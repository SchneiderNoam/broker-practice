  const A = (o, k) => o[k] || (o[k] = { sw: 0, w: 0, n: 0, ok: 0, sure: 0, guess: 0, hes: 0, first: 0, firstOk: 0 });
  for (const [id, st] of Object.entries(S.q)) {
    const q = QBY.get(id); if (!q) continue;
    const ts = SUBS.get(q.sub).topic;
    st.h.forEach((h, i) => {
      const { s, w } = evidence(h[1], h[2], h[4]);
      const ww = w * Math.pow(0.5, (t - h[0]) / (21 * DAY));
      for (const a of [A(sub, q.sub), A(top, ts)]) {
        a.sw += s * ww; a.w += ww; a.n++; a.ok += h[1];
        if (!h[1] && h[2] === 2) a.sure++;
        if (h[2] === 0) a.guess++;
        if (h[2] === 1) a.hes++;
        if (i === 0) { a.first++; a.firstOk += h[1]; }
      }
    });
  }
  const tm = {}, m = {};
  for (const tp of DATA.topics) { const a = top[tp.id]; tm[tp.id] = a ? (a.sw + 0.75) / (a.w + 1.5) : 0.5; }
  for (const sb of DATA.subs) {
    const a = sub[sb.id];
    const base = tm[sb.topic];
    m[sb.id] = { m: a ? (a.sw + 2 * base) / (a.w + 2) : base, a: a || null };
  }
  _mcache = { sub: m, top: tm, topAgg: top, subAgg: sub }; _mver = _ver;
  return _mcache;
}
const subShare = id => SUBS.get(id).n / POOL_TOTAL;
const topicShare = id => TOPICS.get(id).n / POOL_TOTAL;
function pointsLost(subId) { return subShare(subId) * EXAM_Q * (1 - model().sub[subId].m); }
function topicMastery(topId) { return model().top[topId]; }

function seenCount() { return Object.keys(S.q).length; }
function answeredToday() { return S.days[ymd()] || 0; }
function streak() { let n = 0, t = now(); if (!S.days[ymd(t)]) t -= DAY; while (S.days[ymd(t)]) { n++; t -= DAY; } return n; }
function dueQuestions() { const t = now(); return Q.filter(q => practicable(q) && S.q[q.id] && S.q[q.id].due && S.q[q.id].due <= t); }
function mistakes() {
  return Q.filter(q => { const st = S.q[q.id]; if (!st || q.a) return false; const h = st.h[st.h.length - 1]; return !h[1] || h[2] < 2; });
}
function masteredCount() { return Q.filter(q => S.q[q.id] && S.q[q.id].box >= 3).length; }

/* ---------------------------------- question selection ---------------------------------- */
function weightedPick(items, wf) {
  let tot = 0; const ws = items.map(x => { const w = Math.max(0.0001, wf(x)); tot += w; return w; });
  let r = Math.random() * tot; for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
function lastAttempt(q) { const st = S.q[q.id]; return st && st.h.length ? st.h[st.h.length - 1] : null; }

function pickSmart(sess) {
  const M = model(), t = now();
  const cand = Q.filter(q => practicable(q) && !sess.seen.has(q.id));
  if (!cand.length) return null;
  const last = sess.lastSubs;
  return weightedPick(cand, q => {
    const st = S.q[q.id], sb = M.sub[q.sub].m, sh = subShare(q.sub);
    let w;
    if (!st) { w = 0.7 + 2.2 * (1 - sb); }
    else {
      const lh = st.h[st.h.length - 1];
      const overdue = st.due && st.due <= t ? 1 + Math.min(3, (t - st.due) / DAY) * 0.4 : 0;
      w = 0.12 + 3.2 * overdue + 1.6 * (1 - sb) * (lh[1] ? 0.25 : 1);
      if (!lh[1] && lh[2] === 2) w += 1.4;                       // confident error → misconception
      if (st.box >= 4 && !overdue) w *= 0.08;                    // mastered
      if (t - lh[0] < 25 * MIN) w *= 0.15;                       // just seen
    }
    w *= 1 + 2.5 * sh;                                           // weigh by exam share
    if (last[0] === q.sub) w *= 0.5; else if (last.includes(q.sub)) w *= 0.75;   // interleave
    return w;
  });
}
function pickDrill(sess) {
  const cand = Q.filter(q => practicable(q) && q.sub === sess.sub && !sess.seen.has(q.id));
  if (!cand.length) return null;
  const un = cand.filter(q => !S.q[q.id]);
  if (un.length) return un[rnd(un.length)];
  cand.sort((a, b) => (S.q[a.id].box - S.q[b.id].box) || (S.q[a.id].h[S.q[a.id].h.length - 1][0] - S.q[b.id].h[S.q[b.id].h.length - 1][0]));
  return cand[0];
}
function pickReview(sess) {
  const t = now();
  const cand = Q.filter(q => practicable(q) && !sess.seen.has(q.id) && S.q[q.id] && S.q[q.id].due && S.q[q.id].due <= t);
  if (!cand.length) return null;
  cand.sort((a, b) => S.q[a.id].due - S.q[b.id].due);
  return cand[0];
}
function pickDiag(sess) {
  const cnt = {}; sess.results.forEach(r => { const tp = topicOfSub(QBY.get(r.id).sub).id; cnt[tp] = (cnt[tp] || 0) + 1; });
  const need = DATA.topics.map(tp => ({ tp, d: Math.max(1, Math.round(sess.goal * topicShare(tp.id))) - (cnt[tp.id] || 0) })).sort((a, b) => b.d - a.d);
  for (const { tp } of need) {
    const c = Q.filter(q => practicable(q) && !sess.seen.has(q.id) && !S.q[q.id] && SUBS.get(q.sub).topic === tp.id);

}
function pickFromSub(sub, sess) {

  if (!c.length) return null;
  const un = c.filter(q => !S.q[q.id]);
  return (un.length ? un : c)[rnd((un.length ? un : c).length)];
}

/* ---------------------------------- sessions ---------------------------------- */
function startSession(type, o = {}) {
  let goal = o.goal || ({ smart: 20, diag: EXAM_Q, review: 15, drill: 5 }[type] || 10);
  const sess = { type, goal, sub: o.sub || null, ids: o.ids || null, asked: 0, correct: 0, seen: new Set(), results: [], gaps: [], retry: [], lastSubs: [], cur: null, t0: now(), after: 0 };
  if (type === 'review') {
    const n = dueQuestions().length; if (!n) return toast('אין כרגע חזרות מתוזמנות — כל הכבוד! 🎉');
    sess.goal = Math.min(goal, n);
  }
  if (type === 'list') sess.goal = o.ids.length;
  if (type === 'weak') {
    const worst = DATA.subs.map(s => ({ s, l: pointsLost(s.id) })).sort((a, b) => b.l - a.l).slice(0, 3).map(x => x.s.id);
    sess.weak = worst;
  }
  U.sess = sess; U.review = null;
  nextQuestion();
}
function nextQuestion() {
  const s = U.sess; let q = null;
  // 1) re-ask a missed question after a few others
  const ri = s.retry.findIndex(r => r.after <= 0);
  if (ri >= 0) { q = QBY.get(s.retry[ri].id); s.retry.splice(ri, 1); }
  // 2) follow-up questions from the same weak sub-topic (spaced inside the session)
  if (!q) { const gi = s.gaps.findIndex(g => g.after <= 0); if (gi >= 0) { q = pickFromSub(s.gaps[gi].sub, s); s.gaps.splice(gi, 1); } }
  if (!q) {
    if (s.type === 'smart') q = pickSmart(s);
    else if (s.type === 'drill') q = pickDrill(s);
    else if (s.type === 'review') q = pickReview(s);
    else if (s.type === 'diag') q = pickDiag(s);
    else if (s.type === 'weak') { const sb = s.weak[s.asked % s.weak.length]; q = pickFromSub(sb, s) || pickSmart(s); }
    else if (s.type === 'list') { const id = s.ids.find(i => !s.seen.has(i)); q = id ? QBY.get(id) : null; }
  }
  if (!q && s.asked === 0) { U.sess = null; toast('אין כרגע שאלות זמינות לסוג התרגול הזה'); return go(U.screen === 'practice' ? 'home' : U.screen); }
  if (!q || s.asked >= s.goal) return finishSession();
  s.seen.add(q.id);
  s.cur = { q, sel: null, changes: 0, conf: null, rev: false, t0: now() };
  go('practice');
}
function selectOpt(i) {
  const c = U.sess && U.sess.cur; if (!c || c.rev) return;
  if (c.sel !== null && c.sel !== i && c.sel !== -1) c.changes++;
  c.sel = i; render();
}
function commitAnswer(conf) {
  const s = U.sess, c = s.cur; if (c.rev || c.sel === null) return;
  const q = c.q, ms = now() - c.t0;
  if (c.sel === -1) conf = 0;
  const ok = record(q, c.sel, conf, ms, s.type); bump();
  c.conf = conf; c.rev = true; c.ok = ok;
  s.asked++; if (ok) s.correct++;
  s.results.push({ id: q.id, ok, conf, sel: c.sel, sub: q.sub });
  s.lastSubs.unshift(q.sub); s.lastSubs.length = Math.min(3, s.lastSubs.length);
  s.retry.forEach(r => r.after--); s.gaps.forEach(g => g.after--);
  const gap = !ok || conf < 2; c.gap = gap;
  if (gap && s.type !== 'drill' && s.type !== 'diag') {
    s.retry.push({ id: q.id, after: ok ? 8 : 5 });
    s.gaps.push({ sub: q.sub, after: 3 }, { sub: q.sub, after: 7 });
  }
  render();
  setTimeout(() => { const b = document.querySelector('.banner'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
}
function finishSession() {
  const s = U.sess; s.cur = null; s.done = true;
  go('summary');
}
function continueSession() { const s = U.sess; s.goal = s.asked + (s.type === 'drill' ? 5 : 10); s.done = false; nextQuestion(); }

let simTimer = null;
const examQs = id => Q.filter(q => EX[q.e].id === id).sort((a, b) => a.n - b.n);
function buildMix() {
  const pool = Q.filter(q => !q.a), byTopic = {};
  pool.forEach(q => { const t = SUBS.get(q.sub).topic; (byTopic[t] = byTopic[t] || []).push(q); });
  const quota = DATA.topics.map(t => ({ t, n: Math.max(1, Math.round(EXAM_Q * topicShare(t.id))) }));
  let total = quota.reduce((a, x) => a + x.n, 0);
  while (total > EXAM_Q) { quota.sort((a, b) => b.n - a.n)[0].n--; total--; }
  while (total < EXAM_Q) { quota.sort((a, b) => b.n - a.n)[0].n++; total++; }
  const pick = [];
  for (const { t, n } of quota) {
    const c = shuffle(byTopic[t.id] || []);
    pick.push(...c.filter(q => !S.q[q.id]).concat(c.filter(q => S.q[q.id])).slice(0, n));   // unseen first
  }
  return shuffle(pick).map(q => q.id);
}
function startSim(kind, examId) {
  if (S.active) return askConfirm('יש סימולציה פעילה. התחלת סימולציה חדשה תמחק אותה.', () => { S.active = null; startSim(kind, examId); }, 'להתחיל חדשה');
  const ids = kind === 'mix' ? buildMix() : examQs(examId).map(q => q.id);
  S.active = { kind, examId: examId || null, title: kind === 'mix' ? 'סימולציה אקראית' : EXBY.get(examId).t, ids, start: now(), answers: {}, flags: {}, idx: 0, timed: S.settings.simTimer !== false };
  save(); go('simrun'); startSimTimer();
}
function resumeSim() { go('simrun'); startSimTimer(); }
function simLeft() { const a = S.active; return a.start + EXAM_MIN * MIN - now(); }
function simClock() { const a = S.active; return a.timed ? fmtTime(simLeft()) : fmtTime(now() - a.start); }
function startSimTimer() {
  clearInterval(simTimer);
  simTimer = setInterval(() => {
    if (U.screen !== 'simrun' || !S.active) { clearInterval(simTimer); return; }
    const a = S.active, el = $('#simTimer');
    if (a.timed && simLeft() <= 0) { clearInterval(simTimer); toast('הזמן נגמר, המבחן הוגש'); submitSim(true); return; }
    if (el) { el.textContent = simClock(); el.classList.toggle('low', a.timed && simLeft() < 10 * MIN); }
  }, 1000);
}
function submitSim(force) {
  const a = S.active; if (!a) return;
  const qs = a.ids.map(id => QBY.get(id));
  if (!force) {
    const un = qs.filter(q => a.answers[q.id] === undefined).length;
    return askConfirm(un ? `נשארו ${un} שאלות ללא תשובה. להגיש בכל זאת?` : 'להגיש את המבחן?', () => submitSim(true), 'הגשה');
  }
  let correct = 0; const res = {};
  qs.forEach(q => {
    const sel = a.answers[q.id] === undefined ? -1 : a.answers[q.id];
    const ok = isCorrect(q, sel); if (ok) correct++;
    const flag = !!a.flags[q.id];
    if (!q.a) record(q, sel, ok ? (flag ? 1 : 2) : (sel === -1 ? 0 : 1), 0, 'sim');
    res[q.id] = { sel, ok, flag };
  });
  bump();
  const rec = { id: now(), kind: a.kind, examId: a.examId, title: a.title, ts: now(), dur: a.timed ? Math.min(now() - a.start, EXAM_MIN * MIN) : now() - a.start, timed: a.timed, correct, total: qs.length, score: Math.round(correct / qs.length * 100), ids: a.ids, res };
  S.sims.push(rec); S.active = null; save(); clearInterval(simTimer);
  go('simresult', { simRec: rec });
}

    ${opt('🎯', 'נקודות חלשות', 'שלושת תתי־הנושאים שבהם צפוי להיאבד הכי הרבה.', 'start', 'weak')}

function practiceView() {
  const s = U.sess, c = s.cur, q = c.q;
  const typeName = { smart: 'תרגול חכם', diag: 'אבחון', review: 'חזרות', drill: 'תרגול ממוקד · ' + (s.sub ? subLabel(s.sub) : ''), weak: 'נקודות חלשות', list: 'חזרה על טעויות' }[s.type];

      <div class="conf"><button data-act="conf" data-a="2">✅ בטוח<small>ידעתי</small></button><button data-act="conf" data-a="1" style="${c.changes ? 'border-color:var(--warn)' : ''}">🤔 היססתי<small>נטיתי לשתיים</small></button><button data-act="conf" data-a="0">🎲 ניחשתי<small>אין לי מושג</small></button></div></div>` : '';

}

function summaryView() {
  const s = U.sess, n = s.results.length;
  if (!n) return `<div class="stack"><h1>אין מה לסכם</h1><button class="btn primary" data-act="nav" data-a="home">חזרה לבית</button></div>`;
  const ok = s.results.filter(r => r.ok).length, sure = s.results.filter(r => r.ok && r.conf === 2).length;
  const gaps = {}; s.results.filter(r => !r.ok || r.conf < 2).forEach(r => { gaps[r.sub] = (gaps[r.sub] || 0) + 1; });
  const gl = Object.entries(gaps).sort((a, b) => b[1] - a[1]);
  return `<div class="stack"><h1>סיכום 🎉</h1>
    <div class="card hero"><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="kpi"><span class="small muted">דיוק</span><b style="font-size:2rem">${pct(ok / n)}%</b><span class="small muted">${ok} מתוך ${n}</span></div><div class="kpi"><span class="small muted">נכון ובטוח</span><b style="font-size:2rem">${pct(sure / n)}%</b><span class="small muted">${sure} מתוך ${n}</span></div></div></div>
    ${gl.length ? `<div class="card"><h3>מה לחזק</h3><p class="small muted">נושאים שבהם הייתה טעות, היסוס או ניחוש בסשן הזה:</p>${gl.map(([sub, k]) => `<div class="trow"><div class="nm"><b>${esc(subLabel(sub))}</b><div class="tag">${k} שאלות עם פער</div></div><button class="btn sm" data-act="card" data-a="${sub}">📘 כרטיס</button><button class="btn sm primary" data-act="drill" data-a="${sub}">🎯 תרגול</button></div>`).join('')}</div>` : `<div class="banner ok">כל התשובות נכונות ובטוחות. 💪</div>`}
    <div class="row wrap">${s.type !== 'list' ? `<button class="btn primary grow" data-act="more">➕ עוד ${s.type === 'drill' ? 5 : 10} שאלות</button>` : ''}${s.type === 'drill' || s.type === 'list' ? `<button class="btn grow" data-act="start" data-a="smart">▶ חזרה לתרגול חכם</button>` : ''}<button class="btn ghost" data-act="nav" data-a="home">לבית</button></div></div>`;
}

function topicsView() {
  const M = model();
  const tops = DATA.topics.map(t => ({ t, m: M.top[t.id], l: DATA.subs.filter(s => s.topic === t.id).reduce((a, s) => a + pointsLost(s.id), 0) })).sort((a, b) => b.l - a.l);

    ${tops.map(({ t, m, l }) => { const subs = DATA.subs.filter(s => s.topic === t.id); const a = M.topAgg[t.id];
    return `<div class="card"><div class="row between"><div><h3 style="margin:0">${esc(t.label)}</h3><div class="tag">${t.n} שאלות בבנק · כ-${Math.round(t.n / POOL_TOTAL * EXAM_Q * 10) / 10} שאלות במבחן${a ? ' · ' + a.n + ' תשובות' : ''}</div></div><div class="pct" style="font-size:1.3rem">${a ? pct(m) + '%' : '—'}<div class="tag" style="font-weight:400">(−${l.toFixed(1)} נק׳)</div></div></div>

      ${subs.map(s => { const sm = M.sub[s.id], aa = sm.a; return `<div class="trow"><div class="nm"><b>${esc(s.label)}</b><div class="tag">${s.n} שאלות${aa ? ` · ${aa.n} תשובות · ${aa.sure ? aa.sure + ' טעויות בטוחות · ' : ''}${aa.guess} ניחושים` : ' · עדיין לא נבדק'}</div></div><div class="pct">${aa ? pct(sm.m) + '%' : '—'}</div><button class="btn sm ghost" data-act="card" data-a="${s.id}">📘</button><button class="btn sm" data-act="drill" data-a="${s.id}">🎯</button></div>`; }).join('')}
    </div>`; }).join('')}</div>`;

    ${hist.length ? `<div class="card"><h3>היסטוריה</h3>${hist.slice(0, 12).map(s => `<div class="trow"><div class="nm"><b>${esc(s.title)}</b><div class="tag">${new Date(s.ts).toLocaleDateString('he-IL')} · ${s.correct}/${s.total}</div></div><span class="chip ${s.score >= PASS ? 'good' : 'bad'}">${s.score}</span><button class="btn sm ghost" data-act="simview" data-a="${s.id}">תוצאות</button></div>`).join('')}
      ${hist.length > 1 ? `<div class="row" style="align-items:flex-end;height:80px;gap:6px;margin-top:10px">${S.sims.slice(-12).map(s => `<div class="grow center small"><div style="height:${Math.max(6, s.score * 0.6)}px;background:${s.score >= PASS ? 'var(--good)' : 'var(--bad)'};border-radius:6px 6px 0 0"></div>${s.score}</div>`).join('')}</div>` : ''}</div>` : ''}
    <div class="card"><h3>מבחנים אמיתיים מהעבר</h3><p class="small muted">"כבר נענו" = כמה מ-25 השאלות כבר הופיעו אצלך בתרגול. כדי שהציון ישקף ידע אמיתי עדיף מבחן עם מעט שאלות שכבר נענו.</p>
      ${exams.map(e => { const ids = examQs(e.id).map(q => q.id), seen = ids.filter(i => S.q[i]).length; return `<div class="trow"><div class="nm"><b>${esc(e.t)}</b><div class="tag">כבר נענו ${seen}/${ids.length}${taken.has(e.id) ? ' · נפתר כסימולציה' : ''}</div></div><button class="btn sm ${seen === 0 ? 'primary' : ''}" data-act="simstart" data-a="exam" data-b="${e.id}">התחלה</button></div>`; }).join('')}</div></div>`;

function simResultView() {
  const rec = U.simRec, qs = rec.ids.map(id => QBY.get(id));
  const byT = {}; qs.forEach(q => { const t = topicOfSub(q.sub).label; (byT[t] = byT[t] || { n: 0, ok: 0 }); byT[t].n++; byT[t].ok += rec.res[q.id].ok ? 1 : 0; });
  const wrong = qs.filter(q => !rec.res[q.id].ok), pass = rec.score >= PASS;
  const prev = S.sims.filter(s => s.id !== rec.id && s.ts < rec.ts).slice(-1)[0];
  return `<div class="stack"><h1>תוצאות · ${esc(rec.title)}</h1>
    <div class="card hero center"><div class="big" style="font-size:3.4rem">${rec.score}</div><div style="font-weight:800;margin-top:6px">${pass ? '✔ ציון עובר (' + PASS + ')' : '✘ מתחת לציון העובר (' + PASS + ')'}</div><div class="small muted">${rec.correct}/${rec.total} נכונות · זמן ${fmtTime(rec.dur)}${rec.timed ? ' מתוך ' + EXAM_MIN + ':00' : ''}${prev ? ' · הקודם: ' + prev.score : ''}</div></div>
    <div class="card"><h3>לפי נושא</h3>${Object.entries(byT).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n).map(([t, x]) => `<div class="trow"><div class="nm">${esc(t)}</div><div class="bar ${x.ok / x.n >= .7 ? 'good' : x.ok / x.n >= .5 ? '' : 'bad'}" style="width:90px"><i style="width:${x.ok / x.n * 100}%"></i></div><div class="pct">${x.ok}/${x.n}</div></div>`).join('')}</div>
    <div class="card"><h3>מעבר שאלה אחר שאלה</h3><p class="small muted">ירוק = נכון, אדום = שגוי. לחיצה פותחת את התשובה הנכונה וכרטיס הנושא.</p><div class="qgrid">${qs.map((q, i) => `<button class="${rec.res[q.id].ok ? 'good' : 'bad'}" data-act="simq" data-a="${q.id}">${i + 1}</button>`).join('')}</div></div>
    <div class="row wrap">${wrong.filter(q => !q.a).length ? `<button class="btn primary grow" data-act="wrongdrill">🎯 תרגול על ${wrong.length} הטעויות</button>` : ''}<button class="btn ghost" data-act="nav" data-a="sims">לסימולציות</button></div></div>`;

function reviewView() {
  const q = QBY.get(U.review.id), rec = U.review.rec, rr = rec && rec.res[q.id];
  const c = rr ? { sel: rr.sel, rev: true, ok: rr.ok, conf: rr.flag ? 1 : (rr.sel === -1 ? 0 : 2), gap: !rr.ok || rr.flag } : { sel: null, rev: true, ok: null, conf: null, gap: true };

    <div class="card"><div class="stem">${paras(q.s)}</div>${optionsHTML(q, c, true)}${revealHTML(q, c)}</div></div>`;

function mistakesView() {
  const list = mistakes();
  const f = U.mistFilter;
  const items = list.filter(q => matchFilter(q, f));
  const ch = (k, l) => `<button class="btn sm ${f === k ? 'primary' : 'ghost'}" data-act="mfilter" data-a="${k}">${l}</button>`;
  return `<div class="stack"><h1>מחברת טעויות</h1><div class="row wrap">${ch('all', 'הכול (' + list.length + ')')}${ch('wrong', 'טעויות')}${ch('sure', 'טעויות בטוחות')}${ch('hes', 'היסוס')}${ch('guess', 'ניחושים')}</div>
    ${items.length ? `<button class="btn primary" data-act="mlist">🔁 תרגול ${Math.min(15, items.length)} מהרשימה</button>` : '<p class="muted">אין פריטים בסינון הזה. 👏</p>'}
    ${items.slice(0, 60).map(q => { const h = lastAttempt(q); return `<div class="card tight"><div class="row between"><div><span class="chip">${esc(subLabel(q.sub))}</span> ${h[1] ? (h[2] === 1 ? '<span class="chip warn">היסוס</span>' : '<span class="chip warn">ניחוש</span>') : (h[2] === 2 ? '<span class="chip bad">טעות בטוחה</span>' : '<span class="chip bad">טעות</span>')}</div><button class="btn sm" data-act="mview" data-a="${q.id}">צפייה</button></div><p class="small muted" style="margin:6px 0 0">${esc(q.s.replace(/\n/g, ' ').slice(0, 140))}…</p></div>`; }).join('')}</div>`;
}
function matchFilter(q, f) { const h = lastAttempt(q); return f === 'all' || (f === 'wrong' && !h[1]) || (f === 'hes' && h[1] && h[2] === 1) || (f === 'guess' && h[2] === 0) || (f === 'sure' && !h[1] && h[2] === 2); }

function mergeStates(a, b) {
  const out = JSON.parse(JSON.stringify(a));
  out.q = out.q || {}; out.days = out.days || {}; out.sims = out.sims || [];
  for (const [id, sb_] of Object.entries((b && b.q) || {})) {
    const sa = out.q[id];
    if (!sa) { out.q[id] = JSON.parse(JSON.stringify(sb_)); continue; }
    const key = x => x[0] + ':' + x[1] + ':' + x[2];
    const seen = new Set(sa.h.map(key));
    const h = sa.h.concat(sb_.h.filter(x => !seen.has(key(x)))).sort((p, q) => p[0] - q[0]).slice(-15);
    const la = sa.h.length ? sa.h[sa.h.length - 1][0] : 0, lb = sb_.h.length ? sb_.h[sb_.h.length - 1][0] : 0;
    const src = lb > la ? sb_ : sa;
    out.q[id] = { h, box: src.box, due: src.due, lapses: Math.max(sa.lapses || 0, sb_.lapses || 0) };
  }
  for (const [d, n] of Object.entries((b && b.days) || {})) out.days[d] = Math.max(out.days[d] || 0, n);
  const ids = new Set(out.sims.map(s => s.id));
  for (const s of ((b && b.sims) || [])) if (!ids.has(s.id)) out.sims.push(s);
  out.sims.sort((x, y) => x.ts - y.ts);
  out.created = Math.min(out.created || now(), (b && b.created) || now());
  return out;
}

function planInfo() {

  const weak = DATA.subs.map(s => ({ s, l: pointsLost(s.id) })).sort((a, b) => b.l - a.l).slice(0, 3).map(x => x.s);
  const lastSim = S.sims.length ? S.sims[S.sims.length - 1] : null, simGap = lastSim ? (now() - lastSim.ts) / DAY : 99;
  const todo = [];
  if (ph === 'learn') { todo.push({ t: `תרגול חכם: כ-${target(ph)} שאלות (בעיקר חדשות)`, a: 'start', arg: 'smart' }); if (due) todo.push({ t: `חזרות מתוזמנות (${due})`, a: 'start', arg: 'review' }); }
  else if (ph === 'reinforce') { todo.push({ t: 'תרגול נקודות חלשות', a: 'start', arg: 'weak' }); todo.push({ t: `תרגול חכם: יעד ${target(ph)} שאלות`, a: 'start', arg: 'smart' }); if (simGap > 4) todo.push({ t: 'סימולציה אחת כדי לבדוק מצב', a: 'nav', arg: 'sims' }); }
  else if (ph === 'sim') { if (simGap > 1.5) todo.push({ t: 'סימולציה מלאה', a: 'nav', arg: 'sims' }); todo.push({ t: 'מעבר על הטעויות מהסימולציה', a: 'nav', arg: 'mistakes' }); todo.push({ t: `חזרות מתוזמנות (${due})`, a: 'start', arg: 'review' }); }
  else { todo.push({ t: `מחברת טעויות (${mis})`, a: 'nav', arg: 'mistakes' }); todo.push({ t: `חזרות מתוזמנות (${due})`, a: 'start', arg: 'review' }); }
  // weekly outline
  const weeks = []; for (let d = D, w = 0; d > 0 && w < 8; w++) {

}

    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">${kpi('תשובות בסך הכול', totalAns)}${kpi('דיוק ממוצע', avgAcc === null ? '—' : avgAcc + '%')}${kpi('ממוצע סימולציות', avgSim === null ? '—' : avgSim)}</div>

    <div class="grid2"><div class="card"><h3>לפי מועד מבחן</h3>${Object.entries(byExam).map(([k, n]) => `<div class="trow"><div class="nm">${esc(k)}</div><div class="pct">${n}</div></div>`).join('')}</div>
      <div class="card"><h3>נושאים חלשים נפוצים</h3>${weakTop.length ? weakTop.map(([id, n]) => `<div class="trow"><div class="nm small">${esc(SUBS.get(id) ? SUBS.get(id).label : id)}</div><div class="pct">${n}</div></div>`).join('') : '<p class="small muted">עדיין אין נתונים</p>'}</div></div>
    <div class="card"><h3>משתמשים</h3><input id="admQ" placeholder="חיפוש לפי שם או אימייל" value="${esc(ADM.q)}" style="width:100%;margin-bottom:8px">
      ${list.map(u => { const s = st(u), dl = u.exam_date ? Math.ceil((new Date(u.exam_date + 'T09:00:00') - new Date()) / DAY) : null; return `<div class="trow" data-act="admuser" data-a="${u.id}" style="cursor:pointer"><div class="nm"><b>${esc(u.full_name || '—')}</b> ${u.role === 'admin' ? '<span class="chip">אדמין</span>' : ''} ${u.status === 'blocked' ? '<span class="chip bad">מושעה</span>' : ''}<div class="tag" dir="ltr" style="text-align:start">${esc(u.email)}</div><div class="tag">${s.answered || 0} תשובות · דיוק ${s.accuracy != null ? Math.round(s.accuracy * 100) + '%' : '—'} · ${esc(u.exam_label || 'ללא מועד')}${dl !== null && dl >= 0 ? ' (עוד ' + dl + ' ימים)' : ''} · פעיל: ${lastSeenTxt(u.last_seen_at)} · ${devCnt[u.id] || 0}/2 מכשירים</div></div><span>‹</span></div>`; }).join('') || '<p class="small muted">אין משתמשים</p>'}</div></div>`;
}
async function openAdminUser(id) {
  ADM.detail = { id, prog: null }; go('adminuser');
  const r = await sb.from('progress').select('data,updated_at').eq('user_id', id).maybeSingle();
  if (ADM.detail && ADM.detail.id === id) { ADM.detail.prog = r.data || { none: true }; if (U.screen === 'adminuser') render(); }
}
function adminUserView() {
  const u = ADM.users.find(x => x.id === ADM.detail.id); if (!u) return '<p>המשתמש לא נמצא</p>';
  const s = u.stats || {}, prog = ADM.detail.prog, devs = ADM.devices.filter(d => d.user_id === u.id);
  const sims = prog && prog.data ? (prog.data.sims || []).slice().reverse() : [];
  const days14 = s.days14 || {}, days = [...Array(14)].map((_, i) => ymd(now() - (13 - i) * DAY)), mx = Math.max(1, ...days.map(d => days14[d] || 0));
  return `<div class="stack"><div class="row"><button class="btn sm ghost" data-act="admback">→ חזרה</button><b>${esc(u.full_name || '')}</b>${u.role === 'admin' ? '<span class="chip">אדמין</span>' : ''}${u.status === 'blocked' ? '<span class="chip bad">מושעה</span>' : ''}</div>
    <div class="card"><div class="small" dir="ltr" style="text-align:start">${esc(u.email)}</div><div class="small muted">נרשם: ${new Date(u.created_at).toLocaleDateString('he-IL')} · פעיל: ${lastSeenTxt(u.last_seen_at)} · מועד מבחן: ${esc(u.exam_label || 'לא נבחר')}</div></div>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr"><div class="card tight kpi"><span class="small muted">תשובות</span><b>${s.answered || 0}</b></div><div class="card tight kpi"><span class="small muted">דיוק</span><b>${s.accuracy != null ? Math.round(s.accuracy * 100) + '%' : '—'}</b></div><div class="card tight kpi"><span class="small muted">נשלטו</span><b>${s.mastered || 0}</b></div></div>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr"><div class="card tight kpi"><span class="small muted">שאלות שנראו</span><b>${s.seen || 0}</b></div><div class="card tight kpi"><span class="small muted">טעויות בטוחות</span><b>${s.sureWrong || 0}</b></div><div class="card tight kpi"><span class="small muted">ימי פעילות</span><b>${s.daysActive || 0}</b></div></div>
    <div class="card"><h3>שליטה לפי נושא</h3>${DATA.topics.map(t => { const x = (s.topics || {})[t.id]; const m = x && x.n ? x.m : null; return `<div class="trow"><div class="nm"><b>${esc(t.label)}</b><div class="bar ${m === null ? '' : m >= .75 ? 'good' : m >= .5 ? '' : 'bad'}" style="margin-top:6px"><i style="width:${m === null ? 0 : Math.round(m * 100)}%"></i></div></div><div class="pct">${m === null ? '—' : Math.round(m * 100) + '%'}</div></div>`; }).join('')}${(s.weak || []).length ? `<p class="small muted">נקודות חלשות: ${(s.weak || []).map(w => esc(SUBS.get(w) ? SUBS.get(w).label : w)).join(' · ')}</p>` : ''}</div>
    <div class="card"><h3>פעילות (14 ימים)</h3><div class="row" style="align-items:flex-end;height:70px;gap:3px">${days.map(d => `<div class="grow" style="min-width:0"><div style="height:${Math.max(2, (days14[d] || 0) / mx * 55)}px;background:var(--brand);border-radius:4px 4px 0 0"></div></div>`).join('')}</div></div>
    <div class="card"><h3>סימולציות</h3>${!prog ? '<p class="small muted">טוען…</p>' : sims.length ? sims.slice(0, 10).map(x => `<div class="trow"><div class="nm"><b>${esc(x.title)}</b><div class="tag">${new Date(x.ts).toLocaleDateString('he-IL')} · ${x.correct}/${x.total}</div></div><span class="chip ${x.score >= PASS ? 'good' : 'bad'}">${x.score}</span></div>`).join('') : '<p class="small muted">עדיין לא בוצעו סימולציות</p>'}</div>
    <div class="card"><h3>מכשירים (${devs.length}/2)</h3>${devs.map(d => `<div class="trow"><div class="nm"><b>${esc(d.label || 'מכשיר')}</b><div class="tag">פעילות אחרונה: ${new Date(d.last_seen).toLocaleDateString('he-IL')}</div></div><button class="btn sm ghost" data-act="admdev" data-a="${d.id}">הסרה</button></div>`).join('') || '<p class="small muted">אין מכשירים רשומים</p>'}${devs.length ? `<button class="btn sm" data-act="admresetdev" data-a="${u.id}">איפוס כל המכשירים</button>` : ''}</div>
    ${u.id !== P.id ? `<div class="card stack"><h3>פעולות</h3><div class="row wrap"><button class="btn ${u.status === 'blocked' ? 'good' : 'ghost'}" data-act="admblock" data-a="${u.id}">${u.status === 'blocked' ? 'ביטול השעיה' : 'השעיית משתמש'}</button><button class="btn ghost" style="color:var(--bad)" data-act="admdelete" data-a="${u.id}">מחיקת משתמש</button></div><p class="small muted">השעיה חוסמת כניסה וסנכרון. מחיקה מסירה את החשבון וכל נתוניו לצמיתות.</p></div>` : ''}</div>`;
}
async function admAction(fn, okMsg) { const r = await fn(); if (r && r.error) { toast('הפעולה נכשלה'); return false; } toast(okMsg); await loadAdmin(); return true; }

bootAccount();</script>
