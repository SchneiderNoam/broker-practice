לתכנון ובנייה המייעדת מגרשים להקמת מבני ציבור.","\"שיכון ציבורי\" הם מקרקעין שאושרו כשיכון ציבורי בידי שר הבינוי והשיכון בהתאם לחוק רישום שיכונים ציבוריים.","\"שיכון ציבורי\" הם מקרקעין שאושרו בהתאם לתוכנית מיתאר ארצית וחלה על בניינים של חברות השיכון הציבורי על ידי הוועדה הארצית לתכנון ובנייה.","\"שיכון ציבורי\" הם מקרקעין שאושרו כשיכון ציבורי בידי רשות מקרקעי ישראל בהתאם לחוק רישום שיכונים ציבוריים."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2020-12r1#23","e":25,"n":23,"s":"החל משנת 1960 אברהם שוכר קרקע (ללא מבנה) בתל אביב, המשמשת אותו לתחביבו - שיפוץ של כלי רכב ישנים. הקרקע הוגדרה כקרקע בדמי מפתח על ידי הרשויות.\nבנסיבות העניין, האם חוק הגנת הדייר חל על הקרקע שאברהם שוכר? מדוע?","o":["לא; על קרקע שאין עליה בניין לא חל חוק הגנת הדייר, אלא אם הקרקע הושכרה לפני התשט\"ו (1955) ומשמשת לדייר מקור לפרנסה.","כן; חוק הגנת הדייר חל על קרקע שאין עליה מבנה, ללא סייג.","כן; מכיוון שאברהם שוכר את הקרקע מאז שנת תש\"כ (1960).","לא; חוק הגנת הדייר חל רק על שכירות של נכס למגורים ושל חצר או גינה המשמשות את מטרת השכירות."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2020-12r1#24","e":25,"n":24,"s":"אלכס לביא, מתווך מורשה, פתח בשעה טובה משרד תיווך, הטעון רישוי.\nלאיזו תקופה יינתן לאלכס רישיון העסק?","o":["הרישיון שיינתן הינו לתקופה זמנית של 3 שנים, שניתן להאריכה.","הרישיון שיינתן הינו לתקופה זמנית של שנה, שניתן להאריכו.","הרישיון שיינתן הינו לתקופה של שלוש שנים.","הרישיון שיינתן הינו לתקופה של 15 שנים."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2020-12r1#25","e":25,"n":25,"s":"לצורך קידום ופיתוח שכונה בפתח תקווה, החליטה עיריית פתח תקוה לקיים \"יריד רוכלות\" שבו קבלנים, מתווכים, גננים, נגרים ובעלי מקצוע אחרים, יוזמנו להקים דוכנים לצורך הצעת שירותיהם לתושבי השכונה. יפה הינה בעלת דירת 3 חדרים. בעת ביקורה ביריד, חתמה יפה על טופס הזמנת תיווך בבלעדיות למתווך יעקב (להלן: \"המתווך\"). הבלעדיות נחתמה בטופס נפרד לתקופה המותרת בחוק. לאחר עשרה ימים שבהם המתווך טרם התפנה לטפל בנכס, מבקשת יפה לבטל את הסכם הבלעדיות. המתווך מסרב לכך. הניחו כי מדובר בעיסקת רוכלות כהגדרתה בחוק.\nהאם יפה רשאית לבטל את הסכם הבלעדיות?","o":["יפה אינה רשאית לבטל את הסכם הבלעדיות עליו חתמה, אלא רק בתום תקופת הבלעדיות.","יפה רשאית לבטל את הסכם הבלעדיות עליו חתמה, בתוך 7 ימים מיום החתימה על ההסכם.","יפה רשאית לבטל את הסכם הבלעדיות עליו חתמה, בתוך 14 יום מיום החתימה על ההסכם.","ביטול הסכם הבלעדיות מותנה במה שכתוב בגוף ההסכם."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2020-12r2#1","e":26,"n":1,"s":"בבניין המוגדר ברשם המקרקעין (״טאבו״) כ״בית משותף״ לפי החוק, האם מותר למכור חניה או מרפסת בנפרד מהנכס שאליו הם מוצמדים?","o":["כן; אין מניעה למכור חניה או מרפסת בנפרד מהנכס שאליו הם מוצמדים.","כן; אבל רק במקרקעין מוסדרים (כלומר מקרקעין שעברו ״פרצלציה״).","לא; אלא אם מדובר במכירה לבעלים של דירה מאותו בניין שיכול להצמיד אותם לדירתו או במכירה כחלק מהגדלת שטח הקרקע של הרכוש המשותף באותו בניין.","לא; רכוש מוצמד כשמו כן הוא, הוא מוצמד ואפשר למכור אותו אך ורק עם הדירה שאליה הוצמד."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2020-12r2#2","e":26,"n":2,"s":"שפרה ורונן הם זוג נשוי המצוי בהליכי גירושין. בבעלותם נכס מקרקעין המשמש לעסק משותף.\nרונן חתם על הזמנת תיווך למתווך דור, אשר מצא קונה לעסק, לפי מחיר המקרקעין בלבד. הקונה מבקש לחתום על חוזה רכישה של המקרקעין באופן מיידי במחיר של מיליון וארבע מאות אלף ש״ח.\nשפרה הודיעה למתווך דור שלא יטרח, משום שהיא מעוניינת לרכוש את חלקו של רונן במקרקעין, באותו המחיר שבו הקונה מעוניין.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שפרה אינה רשאית לרכוש את חלקו של רונן במקרקעין באותו מחיר שמציע הקונה שמצא המתווך. אם היא מעוניינת בחלקו של רונן בעסק, עליה להציע מחיר גבוה יותר, כמו כל אדם אחר.","שפרה אינה רשאית לרכוש את חלקו של רונן במקרקעין, וגם לא רונן. עסק של בני זוג שמתגרשים יימכר תמיד לאדם אחר, וזאת כדי להבטיח את הגינות המכירה ולמנוע סחיטה בין בני זוג.","לשפרה יש זכות קדימה ברכישת חלקו של רונן במקרקעין. כלומר, שפרה רשאית לרכוש את חלקו של רונן במקרקעין באותו מחיר שמציע הקונה שמצא המתווך דור למקרקעין.","לשפרה תהיה זכות קדימה ברכישת חלקו של רונן בדירת המגורים המשותפת שלהם בלבד, ולא במקרקעין המשמש לעסק."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2020-12r2#3","e":26,"n":3,"s":"האם למתווך מותר לפעול למכירת נכס השייך לאביו ולאמו?","o":["כן; אולם מכיוון שמדובר בקירבה מדרגה ראשונה, עליו לגלות זאת בכתב בהזמנת התיווך.","כן, אין כל מגבלה בדין על טיפול במכירת נכס לקרוב מדרגה ראשונה.","לא; מתווך אינו רשאי לפעול למכירת נכס של קרוב מדרגה ראשונה, משום שמדובר בעניין אישי.","לא; מתווך אינו רשאי לפעול למכירת נכס של קרוב מדרגה ראשונה, משום שמדובר בניגוד עניינים."],"c":[0],"a":false,"note":"","sub":"b_duties"},{"id":"2020-12r2#4","e":26,"n":4,"s":"בתקופת הקורונה מתקשה יותם מאוד לעמוד בתשלום החזר ההלוואה לבנק בגינה נרשמה על זכויותיו בדירה משכנתא. יותם מאמין כי יוכל להמשיך ולעמוד בתשלומי החזר ההלוואה לאחר שישוב לעבודתו עם סיום תקופת הקורונה.\nהאם יותם רשאי לדחות את החזר התשלומים החודשי לבנק, במידה ויש בידו בטוחה להציע לבנק?","o":["כן; אך עליו להגיע להסדר עם הבנק על מנת שהנכס לא יימכר בהוצאה לפועל.","כן; יותם יוכל לבקש לבצע פרוצדורה מוכרת של הקפאת החזרי הלוואה מובטחת במשכנתא, באישור הבנק, השמור לנסיבות מיוחדות.","לא; לא קיים בשוק המקרקעין הסדר מקובל של הפסקת תשלום החזרי הלוואה המובטחת במשכנתא.","לא. יותם יצטרך לקחת הלוואה נוספת בתמורה לבטוחה שבידו כדי לכסות את התשלום החסר."],"c":[1],"a":false,"note":"","sub":"l_mortgage"},{"id":"2020-12r2#5","e":26,"n":5,"s":"האם אדם שפטור ממס שבח מקרקעין יהיה פטור באופן אוטומטי גם מהיטל השבחה של אותו הנכס?","o":["כן, משום שמדובר במיסים המוטלים עקב עליית ערך של נכס.","כן, משום שכל פטור לפי חוק בגין מס שבח, חל באופן אוטומטי גם על היטל השבחה.","לא; היטל השבחה הוא היטל שגובה הוועדה המקומית לתכנון ובנייה ברשות המקומית בגין שינוי יעוד או שינוי תוכנית בנייה המשביחה את הנכס, ומס שבח מקרקעין הוא מס המשולם בגין עליית ערך הנכס לפי חוק מיסוי מקרקעין.","לא; היטל השבחה הוא מס בגין עליית ערך מקרקעין, ומס שבח מקרקעין הוא היטל בגין עליית ערך הנכס המשולם לרשות המקומית בגין שינוי יעוד או תוכנית בנייה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2020-12r2#6","e":26,"n":6,"s":"יצחק המתווך ולאה הקונה סיכמו בעל פה על דמי תיווך שתשלם לאה אם יאתר יצחק דירה מתאימה שתרכוש לאה. יצחק איתר עבור לאה דירה מתאימה ולאה אכן רכשה את הדירה, אולם לאחר הרכישה, התברר כי הייתה בין הצדדים אי הבנה לגבי גובה דמי התיווך שתשלם לאה ליצחק, ולאה הבינה שיצחק אינו מתכוון לגבות ממנה דמי תיווך בגין עיסקה זו, אלא רק בגין נכסים אחרים שבבעלותה, שבהם הוא מטפל טיפול שוטף.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יצחק אינו זכאי לדמי התיווך; מתווך במקרקעין לא יהיה זכאי לדמי תיווך אלא אם חתם הלקוח על הזמנה בכתב לביצוע פעולת תיווך בהתאם לתקנות.","יצחק זכאי לדמי התיווך ללא כל סייג; אין מניעה לסכם בעל פה על דמי תיווך, כל עוד ההסכם בעל פה עומד בדרישות חוק החוזים.","יצחק אינו זכאי לדמי התיווך; מתווך במקרקעין לא יהיה זכאי לדמי תיווך, אלא אם חתם הלקוח על זיכרון דברים בכתב לביצוע פעולת תיווך בהתאם לתקנות.","יצחק זכאי לדמי התיווך; למתווך מותר להחתים על זיכרון דברים בהתאם לתקנות."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2020-12r2#7","e":26,"n":7,"s":"מתמחה, שאינו מתווך, בחברה בערבון מוגבל (בע\"מ) העוסקת בתיווך, תלה שלט בנכס מסוים והציג אותו למוכרים ולקונים. הדבר קרה ביום שבו המתווך האחראי על הטיפול בנכס זה לא היה פנוי לכך. בעקבות פעולת המתמחה, ועוד באותו היום, הגיעו קונים לנכס וחתמו על חוזה לרכישתו מהמוכרים, ואף חתמו על הזמנת תיווך מפורטת בהתאם לתקנות.\nלפי פסק הדין בעניין ע\"א 3455/06 דה כהן בע״מ נ׳ אלון עמרם, האם החברה זכאית לדמי תיווך?","o":["כן; אין מניעה שמתמחה יסייע בהחתמה על טפסים ובביצוע עבודות טכניות כמתואר.","כן; החברה היא הגורם היעיל בעיסקה והצדדים חתמו על הסכם והזמנת תיווך מרצונם החופשי.","לא; אין מניעה שחברה תבצע עבודת תיווך, אך זאת כל עוד מי שמבצע את העבודה הוא מתווך מוסמך.","לא; לא ניתן לבצע עבודת תיווך, אלא על ידי מתווך מוסמך בלבד."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2020-12r2#8","e":26,"n":8,"s":"מר רודה, מתווך מוסמך, ראה נכס בבלעדיות של המתווכת הגברת שקלרש. מר רודה הציע את הנכס ללקוחותיו, תוך שהוא יוצר קשר ישירות עם המוכרים שאותם ייצגה הגברת שקלרש, מבלי ליידע את הגברת שקלרש בעיסקה כלל ומבלי שהוא רואה חובה לגלות לקונים שהוא מייצג את דבר הבלעדיות של מתווכת אחרת לגבי הנכס.\nלפי פסק הדין בעניין ע״א 25179-07-11 אל הנכס נ׳ שמלצר, מהי חובתו של מר רודה כלפי לקוחותיו? הניחו לצורך שאלה זאת, כי הבלעדיות של הגב׳ שקלרש תקפה כדין.","o":["על מר רודה לגלות ללקוחותיו את דבר קיומה של הבלעדיות של הגב׳ שקלרש על הנכס. המדובר בחלק מחובת הגילוי של מתווך ללקוחותיו במקרה כזה.","על מר רודה לגלות ללקוחותיו את דבר קיומה של הבלעדיות של הגב׳ שקלרש על הנכס, והוא אף חייב להציע את הנכס ללקוחותיו, גם אם הבלעדיות על הנכס שייכת למתווך אחר.","מר רודה אינו חייב לגלות ללקוחותיו את דבר קיומה של הבלעדיות של הגב׳ שקלרש על הנכס. הבלעדיות של הגב׳ שקלרש אינה חלק מחובת הגילוי של מתווך ללקוחותיו לפי החוק.","מר רודה אינו חייב לגלות ללקוחותיו את דבר קיומה של הבלעדיות של הגב׳ שקלרש על הנכס, בגלל שמדובר בנושא רגיל ויומיומי במסגרת הייצוג של המתווך, ולכן אין בו חובת גילוי מיוחדת לפי החוק."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2020-12r2#9","e":26,"n":9,"s":"שלושה מתווכים התווכחו על הנושא של עד מתי קיימת חובה להבטחת ההשקעה של רוכשי דירות על פי חוק.\nלהלן הטענות של כל אחד מהם:\nהמתווך שאול: חובה להבטיח השקעה של רוכשי דירות עד להשלמת הבנייה לפי חוזה המכר בין הקבלן לרוכשים.\nהמתווכת צילה: חובה להבטיח השקעה של רוכשי דירות עד למסירת הדירה לקונים.\nהמתווכת אירנה: חובה להבטיח השקעה של רוכשי דירות עד לקבלת חוזה מול רשות מקרקעי ישראל (מינהל מקרקעי ישראל), של חכירה לתקופה העולה על 25 שנים לטובת הקונים.\nמי מהמתווכים צודק/ים?","o":["רק שאול.","רק צילה.","רק אירנה.","כל השלושה במצטבר."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2020-12r2#10","e":26,"n":10,"s":"מהן מטרותיה של תוכנית מיתאר מקומית, והאם היא רלוונטית לנכסים בעלי חשיבות אדריכלית והיסטורית?","o":["מטרתה של תוכנית מיתאר מקומית היא, בין היתר, שמירה על בניין שיש לו חשיבות אדריכלית והיסטורית, ולכן היא רלוונטית לנכסים בעלי חשיבות אדריכלית והיסטורית.","מטרתה של תוכנית מיתאר מקומית היא, בין היתר, שמירה על בניין שיש לו חשיבות אדריכלית והיסטורית, ולכן היא לא רלוונטית לנכסים בעלי חשיבות אדריכלית והיסטורית.","מטרתה של תוכנית מיתאר מקומית היא, בין היתר, קביעת שטחים וגבולות לפיתוח עירוני וכפרי, ולכן היא לא רלוונטית לנכסים בעלי חשיבות אדריכלית והיסטורית.","מטרתה של תוכנית מיתאר מקומית היא, בין היתר, יעוד הקרקע ושימושה, תוך שמירה על יעוד חקלאי של קרקעות המתאימות לכך, ולכן היא לא רלוונטית לנכסים בעלי חשיבות אדריכלית והיסטורית."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2020-12r2#11","e":26,"n":11,"s":"משה שוכר נכס. לאור ההגבלות בתקופת הקורונה, הודיע משה לבעל הנכס מראש כי הוא צופה שלא יצליח לשלם את דמי השכירות גם לאחר שיוסרו המגבלות ויחודש המסחר. עם זאת, הודיע משה כי מחוסר ברירה, בכוונתו להמשיך ולהחזיק בנכס מבלי שישלם את דמי השכירות, וזאת עד להודעה חדשה.\nמה יכול בעל הנכס לעשות במקרה כזה?","o":["בעל הנכס יוכל לנקוט בהליכים משפטיים כנגד משה בגין הפרה צפויה של החוזה, אך לא רשאי לפעול להקדמת אכיפה של התחייבות שטרם הגיע זמנה לפי החוזה.","בעל הנכס יוכל להוציא למשה אזהרה מההוצאה לפועל.","בעל הנכס יהיה חייב לאפשר למשה להישאר בנכס לתקופה של 3 חודשים לפחות.","אם השכירות רשומה ברשם המקרקעין (״טאבו״), בעל הנכס יהיה חייב למחוק את הרישום בטאבו לפני שיוכל לנקוט בפעולה כלשהי כנגד משה."],"c":[0],"a":false,"note":"","sub":"r_rent"},{"id":"2020-12r2#12","e":26,"n":12,"s":"משה ולאה קיבלו לידיהם דירה חדשה שרכשו מחברה קבלנית.\nעם כניסתם לדירה, חשדו בני הזוג כי שטח הגינה שהוצמדה לדירתם קטן מזה שנקבע בחוזה ואכן, מודד מקצועי שהזמינו למקום, אישר כי שטח הגינה קטן ב- 4.5% מזה שצוין במפרט שבהסכם הרכישה.\nהאם שטח הגינה נחשב כתקין, בהשוואה אל מול המפרט במועד המסירה?","o":["שטח הגינה אינו תקין, והוא מהווה הפרה פשוטה של חוזה מכר המקרקעין.","שטח הגינה אינו תקין; חריגה של 4.5% משטח הגינה אינה חריגה סבירה.","שטח הגינה שסופק לזוג – תקין; ניתן לחרוג חריגה סבירה בשטח הגינה בפועל אל מול שטח הגינה לפי חוזה המכר.","שטח הגינה שסופק לזוג – תקין; ניתן לחרוג עד 5% בשטח הגינה בפועל אל מול שטח הגינה לפי חוזה המכר."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2020-12r2#13","e":26,"n":13,"s":"שמואל הוא מתווך, הפועל להשכיר דירות עבור לקוחותיו המתגוררים בחו״ל ומעביר לידיהם את דמי השכירות בהתאם להוראותיהם.\nבמהלך השנים התיידד שמואל עם תרצה, אחת מלקוחותיו, עד לפטירתה למרבה הצער. תרצה קבעה בצוואתה כי שמואל ימונה כמנהל עזבונה וימשיך לפעול להשכרת ארבע מדירותיה, ויעביר את הכספים למספר ארגוני צדקה על פי בחירתה של המנוחה. שמואל מונה באופן רשמי כמנהל עזבונה של תרצה המנוחה והוא ימשיך לשמש כמתווך בהתאם להוראות אלה ולכל דין.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שמואל מחויב להגיש לאפוטרופוס הכללי דוחו\"ת כפי שיידרש ממנו ולפחות אחת לשנה.","שמואל מחויב להגיש לאפוטרופוס הכללי ידיעות מלאות לפי דרישתו בלבד, ואינו מחויב להגיש לאפוטרופוס הכללי דוחו״ת שוטפים לגבי ניהול הנכסים שהופקדו בידיו.","שמואל אינו מחויב להגיש לאפוטרופוס הכללי דוחו״ת לגבי ניהול הנכסים שהופקדו בידיו, אלא אם חויב לכך בחוזה.","שמואל אינו מחויב להגיש לאפוטרופוס הכללי דוחו״ת לגבי ניהול הנכסים שהופקדו בידיו, אלא אם חויב לכך בצוואה."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2020-12r2#14","e":26,"n":14,"s":"יצחק חתם על הסכם להזמנת שירותי תיווך בבלעדיות עם משה, מתווך במקרקעין, בעניין מכירת דירת פאר שבבעלותו של יצחק. בהזמנת התיווך הוסכם בין הצדדים כי משה המתווך מחויב לבצע פעולת שיווק אחת בלבד, והיא לרכוש כרטיס כניסה ועל חשבון משרד התיווך שלו וללכת על חשבונו למסיבת קוקטייל יוקרתית ומפוארת, שבה ציפו השניים כי הדירה תימכר.\nדירת הפאר אכן נמכרה, אולם יצחק שלח למשה מכתב מעורך דין שבו נטען כי משה רימה את יצחק, וכי לא היה רשאי לבצע פעולת תיווך אחת בלבד, אלא היה חייב לבצע לפחות שתי פעולות תיווך כמתחייב בדין.\nבנוסף, נטען במכתב, כי ללכת ולחפש קונים באירוע יוקרתי היא לא דבר שיכול להיחשב כ\"פעולת תיווך\".\nהאם בנסיבות האמורות נחשב יצחק כמי שביצע את פעולות התיווך הנדרשות ממתווך לפי הדין?","o":["כן, מכיוון שמותר למתווך וללקוח להסכים בכתב בטופס על פעולת תיווך אחת בלבד, וגם פעולה זו לא חייבת להיות מהרשימה המוגדרת המנויה בדין.","כן, מכיוון שיצחק פעל בחוסר תום לב.","לא, מכיוון שעל מתווך לבצע שתי פעולות תיווך לפחות המנויות בדין ולא ניתן לבצע פעולה אחת בלבד.","לא, מכיוון שיצחק לא פירסם את הנכס ולא תלה שלט."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2020-12r2#15","e":26,"n":15,"s":"ליאורה הינה קטינה המתגוררת עם הוריה בדירתם המשותפת. לאחרונה החליטו הוריה של ליאורה להתגרש ובכוונתם שליאורה תעבור להתגורר עם אימה. בינתיים איתר האב קונה לדירתם וחתם עימו על זיכרון דברים למכירת הדירה, אולם אימה של ליאורה טרם מצאה דירה חלופית למגוריה ומגורי בתה הקטינה.\nהאם ניתן למכור את הדירה שבה מתגוררת ליאורה בטרם נמצאו לה ולבתה מגורים חלופיים תחילה?","o":["כן, כי מרגע שנחתם זיכרון דברים, הוא מחייב לכל דבר ועניין.","כן, כי לקטינה יש הורים המחויבים לדאוג לה עם מכירת הדירה.","לא, כי למתווך אסור לערוך זיכרון דברים.","לא, כי הקטינה נחשבת כדיירת מוגנת ולא ניתן למכור נכס שבו מתגוררת הקטינה ללא שנמצאה חלופת מגורים הולמת עבורה."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2020-12r2#16","e":26,"n":16,"s":"ענבל ונאור החליטו להתגרש. במסגרת הגירושין, הם מבקשים לבצע הפרדת רכוש ביניהם, לרבות ביחס לדירת מגוריהם המשותפת.\nהאם העברת הדירה אגב הגירושין יוצרת חיוב במס?","o":["כן; מדובר ב״מכירה״ חייבת של מקרקעין בפסק דין לגירושין, אולם החיוב הוא בשליש מס רכישה בהעברה לילדיהם בלבד. בהעברה בין בני הזוג אין חיוב במס.","כן; חלוקת רכוש בין בני זוג נשואים בפסק דין לגירושין בינם לבין עצמם, או לילדיהם, מחייבת תשלום מס בהיקף של שליש מס רכישה.","לא; העברת מקרקעין בין בני זוג הנעשית בהסכם המאושר בבית משפט למשפחה אינה נחשבת כמכירה לעניין חוק מיסוי מקרקעין, ואינה יוצרת אירוע מס.","לא; אין חיוב במס, שכן מדובר בדירת מגורים, ומכיוון שההעברה היא בין בני הזוג ולא לילדיהם."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2020-12r2#17","e":26,"n":17,"s":"משה נהנה מזיקת הנאה של מעבר בחלקה סמוכה מזה יותר מ- 30 שנה. החלקה הסמוכה, שאינה בבעלותו, משמשת לו כמעבר עם רכבו לחניה שבחלקתו. בעצת מתווך מקומי, פנה משה לבעלים של החלקה הסמוכה הנ\"ל, וביקש לרשום את זיקת ההנאה ברשם המקרקעין (״טאבו״). זאת על מנת להעלות את ערך הנכס שלו. להפתעתו של משה, בעל הקרקע הסמוכה מתנגד לרישום בטאבו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הבעלים אינו רשאי להתנגד לרישום; זיקת הנאה מתארת מצב קיים ואין אפשרות להתנגד לה.","הבעלים אינו רשאי להתנגד לרישום, אולם רק אם חלפו שלושים שנה ללא התנגדות של בעלי הקרקע.","הבעלים רשאי תמיד להתנגד לרישום הזכות, ולמעשה מרגע שהודיע על התנגדותו לזיקת ההנאה, זיקת ההנאה נפסקת באופן מיידי, וזאת ללא הגבלת זמן.","הבעלים רשאי להתנגד לרישום, ואף אינו מחויב להודיע על התנגדותו לשימוש בקרקע."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2020-12r2#18","e":26,"n":18,"s":"איילה מבקשת לקנות חנות הממוקמת בקומת הכניסה של בניין מגורים.\nמבדיקת תשריט הבית המשותף עולה כי החנות מסומנת כ״דירה״ בתשריט.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["סימון החנות כ״דירה״ בתשריט הבית המשותף מצביע על כך שהנכס שמבקשת איילה לקנות, בהגדרה, לא יכול לשמש כחנות, אלא כדירת מגורים בלבד.","סימון החנות כ״דירה״ בתשריט הבית המשותף, מצביע על כך שהנכס שמבקשת איילה לקנות, בהגדרה, לא יכול לשמש כחנות, אלא כדירת מגורים בלבד; על איילה החובה לפנות באופן מיידי לוועדה המקומית לתכנון ובניה כדי לקבל היתר מתאים לשימוש בפועל שנעשה בנכס.","אין מניעה להשתמש כחנות או כעסק ב״דירה״ המופיעה בתשריט הבית המשותף כדירה, כפוף לאישורים המתאימים לשימוש בנכס.","אין מניעה להשתמש כחנות או כעסק ב״דירה״ המופיעה בתשריט הבית המשותף, אולם התקנון המצוי שבחוק המקרקעין דורש לכך הסכמה של רוב בעלי הדירות."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2020-12r2#19","e":26,"n":19,"s":"משה הינו בעלים של קרקע חקלאית מזה שנים רבות. לאחרונה, החליטה הוועדה המרחבית והמחוזית לתכנון ובניה ״להפשיר״ את הקרקע החקלאית שבבעלותו ולשנות את יעודה למגורים.\nהיזם זריזי ביקש מיצחק המתווך לפנות אל משה ולהתעניין בקרקע. כאשר יצחק פנה אל משה, הוא הבין מיד שמשה אינו מודע לשינוי התכנוני, הצפוי להעלות במאות אחוזים את ערך הקרקע שבבעלותו. משה, שהופתע מההתעניינות בקרקע שבבעלותו, שאל את המתווך האם יש מידע חדש שעליו לדעת לגבי הקרקע.\nלאור פסק הדין ע״א 2469/06 רונן סויסה ואחרים נ׳ חברת זאגא ואחרים, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["יצחק אינו חייב לגלות למשה, או לאיש, על אודות העלייה הצפויה של ערך קרקע, שכן זאת המשמעות של עשיית עסקים והמדובר בעניין מקצועי רגיל.","יצחק מחויב להסתיר ממשה את העלייה הצפויה של ערך הקרקע, שכן מתווך מחויב לסודיות ולנאמנות ללקוח לפי החוק.","יצחק אינו רשאי להסתיר ממשה את העלייה הצפויה של ערך הקרקע.","מדובר בקרקע שעדיין לא עברה ״פרצלציה״, ולכן ניתן למכור את הקרקע כקרקע חקלאית בלבד."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2020-12r2#20","e":26,"n":20,"s":"לאורלי ואבי דירת מגורים בבניין הרשום כבית משותף. דירת המגורים כוללת 4 חדרים, ולה צמוד מקום חניה בחניון הבניין. בסמיכות למקום החניה ישנו שטח קרקע המהווה חלק מהרכוש המשותף של הבניין. שטח זה לא נוצל מעולם, והגישה אליו היא אך ורק דרך החניה הצמודה של אורלי ואבי. אורלי ואבי מעוניינים להצמיד לדירתם גם את חלקת קרקע זו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הצמדת חלקת קרקע זו לדירתם טעונה הסכמה של רוב בעלי הדירות.","הצמדת חלקת קרקע זו לדירתם טעונה הסכמה של 60% (שישים אחוז) מן הדירות.","הצמדת חלקת קרקע זו לדירתם אינה טעונה הסכמה של בעלי הדירות האחרים, שכן אין גישה לקרקע זו לדיירים, אלא מהחניה של אורלי ואבי.","הצמדת חלקת קרקע זו לדירתם טעונה הסכמה של כל בעלי הדירות."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2020-12r2#21","e":26,"n":21,"s":"ורד המתווכת קיבלה לטיפולה בבלעדיות דירת פנטהאוז בבניין בן 5 קומות. במקום קיימת תוכנית בניין עיר (תב״ע) אשר מגדילה את אחוזי הבנייה בחלקה בה בנוי הבניין. אולם זאת, ללא הגדלת מספר הקומות. ורד בדקה את תקנון הבית המשותף ואת הזכויות בנכס, וגילתה כי זכויות הבנייה בגג המשותף צמודות לדירה. עוד עלה מן הבדיקה כי במסגרת תוכנית המיתאר החלה על החלקה בה בנוי הבניין, מותר להקים בחלקה בניין בגובה של ״עד חמש קומות״.\nבנסיבות המתוארות, האם ניתן להגדיל את הדירה ולבנות קומה נוספת על הגג?","o":["ניתן לבצע בנייה של קומה נוספת אם 100% מהדיירים בעלי 100% מהרכוש מסכימים לכך.","לא ניתן לבצע בנייה של קומה נוספת, עקב הגבלת הקומות בתוכנית.","ניתן לבצע בנייה של קומה נוספת, וזאת במסגרת הרחבת הפנטהאוז בלבד.","לא ניתן לבצע בנייה של קומה נוספת, משום שזכויות הבנייה המותרות בבית משותף גם הן משותפות לכל הדירות, והן כבר נוצלו."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2020-12r2#22","e":26,"n":22,"s":"מהו ״בית מורכב״?","o":["בניין שלא נתקיימה בו הוראה מהוראותיה של תוכנית, בין שניתנו לסוג מיוחד של בניינים ובין שהן חלות עליו בהיותו נמצא באזור או בשטח מיוחד.","מקרקעין משותפים שלאף אחד מהבעלים בו אין זכות לחלק מסוים בהם.","מבנה של קבע המורכב מקרקע ומבנה.","בית משותף, המורכב ממבנים אחדים או מאגפים אחדים, שלכל אחד מהם כניסה נפרדת או מתקנים נפרדים."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2020-12r2#23","e":26,"n":23,"s":"אבי הוא דייר מוגן בנכס ששימש אותו בעבר כמבנה למכירת מוצרי עור. במהלך הזמן, סגר אבי את עסקו והיסב את הנכס לשימוש לצורך שלט פרסומת ענק ללא שימושים נוספים.\nהאם חוק הגנת הדייר חל על הנכס האמור?","o":["חוק הגנת הדייר חל על שכירות שמטרתה להציג דבר פרסום ללא הגבלה.","חוק הגנת הדייר אינו חל על שכירות מסחרית; החוק חל על דיירים בדירת המגורים שלהם בלבד.","חוק הגנת הדייר אינו חל על שכירות שמטרתה להציג דבר פרסום.","חוק הגנת הדייר חל על שכירות שמטרתה להציג דבר פרסום, כל עוד פעילות הפרסום החלה לפני התשי״ח - 1958."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2020-12r2#24","e":26,"n":24,"s":"ברוריה ביקשה מהמתווכת גילה למצוא לה דירה למגוריה. גילה מצאה דירה המתאימה לברוריה, וסייעה לה להעביר הצעת מחיר שמתאימה לברוריה. למרבה הצער, ברוריה חלתה ומצבה החמיר, עד שבית משפט למשפחה הכריז על ברוריה כפסולת דין.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר בהתייחס למעמד ההצעה שהגישה ברוריה למוכרים?","o":["אם ההצעה נתקבלה על ידי המוכרים, היא בטלה ומבוטלת לפי החוק מכוח מצבה של ברוריה.","אם ההצעה טרם נתקבלה על ידי המוכרים, ההצעה של ברוריה לרכישת הנכס עדיין בתוקף. אין קשר בין ההצעה לבין הפיכתה של ברוריה לפסולת דין, והמשך הרכישה יטופל על ידי האפוטרופוס/ית שלה.","אם ההצעה טרם נתקבלה על ידי המוכרים, ההצעה לרכישת הנכס פקעה עם הפיכתה של ברוריה לפסולת דין.","ההצעה של ברוריה לרכישת הנכס בתוקף, מכיוון שנעשתה לפני שברוריה חלתה."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2020-12r2#25","e":26,"n":25,"s":"דוד פנה ליצחק, מתווך מוסמך, בבקשה שיטפל עבורו במכירת דירת מגורים יוקרתית שירש מאימו. יצחק, אשר עיין בנסח הטאבו (נסח מלשכת רישום המקרקעין) וראה כי דוד הינו הבעלים הרשום של הנכס, פעל לאיתור קונה. יצחק המתווך אכן הביא לכך שקונה התקשר עם דוד בחוזה. במסגרת העיסקה שילם הקונה לדוד את התמורה המוסכמת ששיקפה את שווי השוק של הנכס. בהמשך אף נרשם הקונה כבעלים של הדירה. כעת, הופתע יצחק לקבל פנייה מראובן, שהינו אחיו של דוד. ראובן טוען כי הוא בעל הזכויות המקורי בדירה וכי דוד נרשם בטאבו שלא כדין. יובהר כי הקונה שרכש את הדירה מדוד כלל לא היה מודע לטעות.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם הרישום בטאבו לא היה נכון, יש לתקנו והוא אינו קובע, אלא המידע האמיתי והנכון שנודע ליצחק לגבי בעלי הנכס.","הרישום בטאבו הוא הרישום המחייב, כל עוד הלקוח של יצחק לא ידע על הטעות, שילם ופעל בתום לב לרישום הנכס על שמו.","הרישום בטאבו מחייב מרגע שהלקוח של יצחק שילם את מלוא המחיר לנכס, אפילו אם הלקוח של יצחק ידע על הטעות.","הרישום בטאבו אינו מחייב, משום שלא הוצג בטאבו ייפוי כוח מהבעלים האמיתי."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2021-02r1#1","e":27,"n":1,"s":"שרון נתנה לגידי המתווך בלעדיות למכירת דירה המשמשת למגורים. גידי המתווך תלה שלט בדירה.\nמתי תסתיים תקופת הבלעדיות, כאשר ההסכם אינו מתייחס במפורש לתקופת הבלעדיות?","o":["לאחר שלושים יום, וזאת מכיוון שלא נקבעה תקופה אחרת בהסכם.","כעבור חודשיים, וזאת מכיוון שגידי לא ביצע מספיק פעולות שיווק.","תקופת בלעדיות במקרה שכזה יכולה להיות עד חצי שנה.","תקופת בלעדיות במקרה שכזה יכולה להיות עד תשעה חודשים."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2021-02r1#2","e":27,"n":2,"s":"גילה מנסה למכור את דירתה מזה זמן רב. גילה התקשרה עם דיצה, מתווכת מוסמכת, בהסכם בלעדיות. בהסכם הבלעדיות נכתב כי פעולת התיווך היחידה הנדרשת מדיצה המתווכת, היא לספר על הדירה במכון הכושר היוקרתי שבו היא חברה.\nהאם בתנאים אלה מתקיימת בלעדיות? מדוע?","o":["לא, מכיוון שמדובר בפעולת שיווק שאינה מנויה בדין לצורך בלעדיות.","לא, מכיוון שלא בוצעו לפחות שתי פעולות שיווק.","כן, מספיק לבצע פעולת שיווק אחת לפי הדין כדי לקבל בלעדיות על נכס.","כן, די בפעולת שיווק זו, אם כך הוסכם בין הצדדים."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2021-02r1#3","e":27,"n":3,"s":"גורן שכר בית בודד על חלקה, אך גילה שרעשי מטוסים שעוברים מעל החלקה מפריע את מנוחתו.\nהאם גורן יכול להגביל את המרחב האווירי שמעל החלקה?","o":["לא; הדבר היה אפשרי אך ורק לו גורן היה קונה את החלקה.","לא; זכות במקרקעין בחלקה אינה מקנה, בפני עצמה, את הזכות למנוע מעבר מעל החלקה.","כן; מכיוון ששכירות מקנה לשוכר את כל זכויותיו של הבעלים בחלקה.","כן; אולם רק אם מדובר בשכירות שנרשמת כדין ברשם המקרקעין (טאבו)."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2021-02r1#4","e":27,"n":4,"s":"ליאל ועינב הינם אחים שירשו את דירת הוריהם.\nהאם מותר לליאל למכור את חלקו בדירה לליאת, השכנה ממול?","o":["לא, מכיוון שלעינב ישנה זיקת הנאה לשימוש בחלקה בנכס.","לא; מכיוון שלעינב ישנה זכות קדימה לרכוש את חלקה.","כן; כל עוד עינב מסכימה לעיסקה.","כן; ליאל יכול לבצע כל עיסקה בחלק המסוים שנרשם על שמו בנכס."],"c":[3],"a":false,"note":"","sub":"l_shared"},{"id":"2021-02r1#5","e":27,"n":5,"s":"באין קביעה אחרת בתקנון המוסכם, מי יישא בהוצאות התקנת מעלית בבית משותף?","o":["כל בעלי הדירות.","רק בעלי הדירות שביקשו את התקנת המעלית.","כל בעלי הדירות, למעט אלה שבקומת הקרקע.","לא ניתן להתקין מעלית בבניין שבו לא הותקנה מעלית על ידי הקבלן."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2021-02r1#6","e":27,"n":6,"s":"בעלי הדירה שבקומת הקרקע בבית משותף, מבקשים משאר בעלי הדירות להצמיד חלק מסוים מהרכוש המשותף לדירתם, תוך שהם מציינים כי כך יחסכו שאר בעלי הדירות בעלות אחזקת החלק מהרכוש המשותף שיוצמד אל דירתם בתקנון המוסכם.\nעל מי להסכים להצעה כך שההצעה תתאפשר?","o":["בעלי שני שליש מהדירות בבית המשותף.","בעלי הדירות בבניין, שלהם שני שליש מהרכוש המשותף בבניין.","כל בעלי הדירות בבניין.","רוב בעלי הדירות בבניין, שלהם שני שליש מהרכוש המשותף."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2021-02r1#7","e":27,"n":7,"s":"אולגה רכשה דירה מחברה קבלנית. לאחר חלוף שנה מרישום הבית בפנקס הבתים המשותפים, הנכס של אולגה טרם נרשם בטאבו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["במועד זה טרם קמה חובה לרשום את הנכס בטאבו.","אין כל חובה שבדין על הקבלן לסיים את הבנייה ברישום הנכס - רוב המקרקעין בישראל אינם רשומים בטאבו.","גם אם העיכוב הוא באשמת אולגה ונגרם על ידה, הקבלן מחויב לסיים את רישום הנכס במועד הזה.","אם העיכוב באשמת אולגה ונגרם על ידה, לא קמה חובה לקבלן לסיים את רישום הנכס במועד הזה."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2021-02r1#8","e":27,"n":8,"s":"גיא רכש דירת מגורים מגלית. בהסכם המכר סיכמו הצדדים כי גיא ישלם מקדמה של 10% מערך הדירה ״על החשבון״, ואת השאר לפי לוח תשלומים שנקבע בחוזה המכר. עורך דין מטעמו של גיא רשם הערת אזהרה מתאימה ברשם המקרקעין (טאבו) ביום שאחרי חתימת החוזה.\nלמרבה הצער, גלית נקלעה לקשיים כלכליים לאחר כחודש מתחילת העיסקה, והוטל עיקול על כל נכסיה, וביניהם על הדירה שמכרה לגיא.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["עיקול שהוטל על דירתה של גלית מחייב את גיא לשלם את חובה של גלית ברשם המשכונות באופן מיידי.","מכיוון שגיא רשם הערת אזהרה בטאבו על העיסקה שביצועה התחיל, גיא שמר על זכויותיו מול צדדים שלישיים, כפוף לזכויותיו לפי חוק.","גיא איבד את זכויותיו על הדירה מול כל צד שלישי וכן גם את כספו.","לא ניתן להטיל עיקול על נכס מרגע שנרשמה הערת אזהרה."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2021-02r1#9","e":27,"n":9,"s":"באיזה/אילו מהמקרים הבאים הצדדים נדרשים לשלם מס שבח?","o":["רק בני זוג אשר מתגרשים ומחלקים ביניהם רכוש.","רק בהורשה של דירת מגורים.","רק בפעולות באיגוד מקרקעין בהתאם לערכן.","בכל המקרים המוזכרים בתשובות האחרות."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2021-02r1#10","e":27,"n":10,"s":"חיים, מתווך מורשה, תיווך בעיסקת מקרקעין גדולה. במהלך ביצוע העיסקה, היטעה חיים את הקונים לחשוב שיש מיזוג מרכזי בחדרים, כפי שביקשו ממנו. העיסקה התרחשה בחודש מאי 2020, כאשר בחודש יולי 2020 היתלה חיים מרצונו את רישיון התיווך שלו.\nהאם מוסמך משרד המשפטים לפעול כנגד חיים למרות שרישיונו אינו בתוקף, בגין תלונה שהוגשה כנגדו לאחר התליית רישיונו? אנא סמנו את התשובה הנכונה ביותר:","o":["לא; הקונים ייאלצו לחכות לחידוש הרישיון של חיים כדי להגיש כנגדו תלונה, משום שישנה סמכות למשרד המשפטים לפעול בנושאי משמעת אך ורק כנגד מתווכים פעילים ולא כנגד מתווכים שהיו פעילים בעבר ורישיונם הותלה מרצון.","לא; הקונים היו צריכים לבדוק את הנושא בעצמם ואין אפשרות להתלונן בגין הטעייה למשרד המשפטים.","כן, אך ניתן לפעול באופן משמעתי אך ורק כנגד מתווכים שרישיונם הותלה שלא מרצון.","כן; משרד המשפטים מוסמך לפעול מול חיים באופן משמעתי, למרות שחיים אינו מחזיק ברישיון בר תוקף."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2021-02r1#11","e":27,"n":11,"s":"כיצד קבלן המוכר דירה חדשה מחויב למסור מפרט לרוכשי הדירה?","o":["הקבלן חייב לצרף לחוזה המכר מפרט, ולמסור לקונה העתק חתום שלו. אין כל אפשרות לבצע תיקונים במפרט מרגע שאושר על ידי הוועדה המקומית לתכנון ובנייה.","הקבלן חייב לצרף לחוזה המכר מפרט, ולמסור לקונה העתק חתום שלו. כל תיקון במפרט טעון חתימה של שני הצדדים (המוכר והקונה).","הקבלן אינו חייב לצרף לחוזה המכר מפרט, אך חייב להחזיק מפרט חתום בחברה המשכנת. כל תיקון במפרט מחייב חתימה של שני הצדדים (המוכר והקונה).","הקבלן אינו חייב לצרף לחוזה המכר מפרט חתום, שכן מפרט חתום מוגש לרשויות התכנון והבנייה. כל תיקון במפרט מחייב אישור של הוועדה המקומית לתכנון ובנייה בלבד ואין צורך בחתימה של הרוכש על התיקון."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2021-02r1#12","e":27,"n":12,"s":"חיים גר בבניין ישן שבו נדרשים שיפוצי עומק נרחבים ודחופים. חיים הינו דייר ערירי אשר אינו מעוניין בכל שינוי בנכס. לאחרונה, שכנו לקומה של חיים, ששמו משה, החליט כי הוא מעוניין לשפץ מיוזמתו את הקומה שבה משה וחיים מתגוררים, במסגרת שיפוץ כולל לחיזוק המבנה הישן מרעידות אדמה. משה פונה אל חיים לקבלת הסכמתו לשיפוץ, אולם חיים מתנגד לשיפוץ, תוך שחיים טוען שמשה אינו יכול לבצע כל שיפוץ שהוא בקומה ללא הסכמתו של חיים.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חיים טועה; ניתן לבצע חיזוק מרעידות אדמה ושיפוץ בבניין ללא כל צורך בהסכמת הדיירים האחרים.","חיים טועה; אם משה יוכל לקבל את הסכמת רוב בעלי הדירות בבניין, משה יוכל לבצע את השיפוץ ללא הסכמתו של חיים - זאת במסגרת תוכנית לחיזוק מפני רעידות אדמה של הבניין.","חיים צודק; תמיד תידרש הסכמת כל דיירי הקומה לשיפוצי עומק נרחבים.","חיים צודק; לצורך שיפוצי עומק נרחבים נדרשת הסכמה של כל דיירי הבניין."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2021-02r1#13","e":27,"n":13,"s":"לאון עוסק בתיווך מקרקעין ובמסגרת עבודתו חתם על חוזה למתן שירותי תיווך לטל. באחת מן הפעמים שבהן הראה לאון לטל דירה לרכישה, פרץ בין השניים ויכוח אישי קשה, עד שלבסוף הודיע לאון לטל כי החוזה ביניהם מבוטל, וכי הוא אינו מוכן עוד לספק לו את שירותי התיווך.\nטל, אשר התרשם מאוד מיכולותיו של לאון בתור מתווך, מעוניין לאכוף את קיום החוזה – האם הוא זכאי לעשות כן? מדוע?","o":["כן; ללאון אין זכות לבטל את החוזה בגין ויכוח שלא קשור לתוכנו.","לא; ביצוע האכיפה דורש מידה לא סבירה של פיקוח מטעם לשכת ההוצאה לפועל.","כן; חוזה התיווך ניתן לאכיפה, שכן כבר ניתנו חלק מהשירותים מכוח קיומו.","לא; אכיפת חוזה התיווך היא כפייה על לאון לספק שירות אישי."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2021-02r1#14","e":27,"n":14,"s":"מועדון צרכנות פנה לחברי המועדון בכתב והציע להם:\n\"חברת קבלני סיימה לבנות את הפרויקט שלה בנס ציונה. בעקבות הסכם שחתמה הנהלת המועדון עם חברת הקבלנות קבלני, זכאים כל חברי המועדון שירכשו דירה בפרויקט המגורים של קבלני בנס ציונה, להנחה של 17% מהמחיר. קבלני משווק את הדירות גם בשוק החופשי במחיר של 1,170,000 ש\"ח, אבל חברי המועדון ישלמו רק 1,000,000 ש\"ח. מותנה בהצגת כרטיס חבר\".\nמה מתואר בהצעת המועדון?","o":["קבוצת רכישה כמשמעותה בחוק מיסוי מקרקעין - הנהלת המועדון הינה הגורם המארגן.","קבוצת רכישה כמשמעותה בחוק מיסוי מקרקעין - הנהלת המועדון איננה הגורם המארגן.","קבוצת רכישה כמשמעותה בחוק מיסוי מקרקעין - החברות במועדון הינה המסגרת החוזית (כהגדרת המונח בחוק מיסוי מקרקעין).","כל התשובות האחרות שגויות."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2021-02r1#15","e":27,"n":15,"s":"איתמר וניצן חוכרים חלקה, המשתרעת על פני 4 דונם, ממינהל מקרקעי ישראל. לפני כשנה בנם, ארי, התחתן עם עומר, בחירת ליבו. כמתנת חתונה, החליטו ניצן ואיתמר לבנות לזוג הטרי בית משלהם בחלקה. מעיון בהסכם החכירה עלה, כי בחלק הספציפי בו הם מעוניינים לבנות את הבית, אין זכויות בנייה.\nאם מינהל מקרקעי ישראל יאשר את הבנייה, מה יהיה סוג התשלום אשר יהיה עליהם לשלם לו?","o":["דמי היתר.","דמי הסכמה.","דמי מימוש.","דמי פיתוח."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2021-02r1#16","e":27,"n":16,"s":"בשל עומס עבודה רב החליטה רונית המתווכת להעסיק את יפעת כמזכירה במשרד התיווך שאותו פתחה לאחרונה ואשר בכניסה אליו תלוי שלט עם הכיתוב: \"אין כמו בבית – יועצי ומתווכי נדל\"ן\". יצוין כי יפעת יוצרת קשר עם הלקוחות, וזאת למרות שאין לה כל הכשרה בתיווך והיא כמובן לא מחזיקה ברישיון תיווך תקף.\nהאם דבר העסקתה של יפעת נוגד את הדין? מדוע?","o":["כן; כדי לעבוד במשרד תיווך בתור מזכירה על יפעת להחזיק ברישיון תיווך תקף.","כן; כדי ליצור קשר עם לקוחות על יפעת להחזיק ברישיון תיווך תקף.","לא; יפעת מועסקת בתפקיד מינהלי ולכן אין היא מחויבת בהחזקת רישיון תיווך כדי לפנות ללקוחות.","לא; אין כל איסור על העסקת אדם בתיווך במקרקעין ללא רישיון תיווך אם למעסיק עצמו יש רישיון תיווך בתוקף בעת ההעסקה, בעת ביצוע כל פעולה שהיא תחת פיקוחו של בעל הרישיון."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2021-02r1#17","e":27,"n":17,"s":"איתמר ביקש לרכוש את דירתה של חן ובין השניים התנהל משא ומתן אינטנסיבי בעניין המחיר. לאחר מספר ימים של התדיינות, הודיעה חן לאיתמר כי היא מוכנה להוריד את המחיר המבוקש ב- 5% וכי ניתנות לו 8 שעות לחזור אליה עם תשובה: האם הוא מעוניין לרכוש את הדירה במחיר המופחת? לאחר כ- 4 שעות פנתה חן אל איתמר בשנית ואמרה לו שלאחר מחשבה רבה היא חוזרת בה, ומוכנה להפחית מהמחיר המבוקש רק ב- 3%.\nהאם רשאית חן לנהוג כפי שנהגה?","o":["כן, כל עוד איתמר לא השיב בחיוב על הצעתה הראשונה, חן יכולה לחזור בה ממנה.","כן, הצעתה הראשונית של חן היא אינה הצעה ללא חזרה ולכן חן רשאית לחזור בה ממנה.","לא, חן קבעה מועד לקיבולה של הצעתה הראשונית ולכן לא יכולה לחזור בה ממנה לפני המועד שנקבע.","לא, ברגע שחן הסכימה להפחית מהמחיר המבוקש היא לא יכולה לחזור בה עוד."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2021-02r1#18","e":27,"n":18,"s":"איזה מהמשפטים הבאים הוא הנכון ביותר לעניין הפקעת קרקע על ידי ועדה לתכנון ובניה?","o":["אם מקרקעין הופקעו על פי חוק התכנון והבנייה, ולאחר מכן יעודם שונה לייעוד המחייב בתשלום פיצוי, הוועדה לא מחויבת לשלם כל פיצוי לבעל הקרקע המקורי, וזאת אם חלפו יותר מ- 18 חודשים מיום ההפקעה.","אם מקרקעין הופקעו על פי חוק התכנון והבנייה, ולאחר מכן יעודם שונה לייעוד המחייב בתשלום פיצוי, הוועדה מחויבת לשלם כל פיצוי לבעל הקרקע המקורי, וזאת רק אם בעל הקרקע המקורי פנה אליה בדרישה לקבלת פיצוי בתוך 12 חודשים מיום שינוי הייעוד האמור.","בהליכי הפקעה מכוח חוק התכנון והבנייה, בית מגורים שנועד בתוכנית להריסה, יכול להיות מפונה, גם ללא העמדת שיכון חילופי לבעל המקרקעין, אם הוא דרש זאת, וזאת בתנאי שהוועדה תעמיד לו פיצוי מוגדל בעבור הפינוי.","בהליכי הפקעה מכוח חוק התכנון והבנייה לא יפונה בית מגורים שנועד בתוכנית להריסה אלא לאחר שהועמד שיכון חילופי סביר למי שהיה דר בבית מכוח זכות שבדין או זכות שביושר במועד פרסום ההודעה על הכוונה לרכוש את המקרקעין, או, אם רצה הדייר בכך, לאחר ששולמו לו או לזכותו פיצויים כדי השגת שיכון חילופי סביר."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2021-02r1#19","e":27,"n":19,"s":"לפי פסק הדין ת.א. 945-12-11 עודד סיטי נגד טל פרי, האם הסכם בלעדיות יכול לקבוע הוראות ששייכות להזמנת תיווך?","o":["לא; הסכם בלעדיות יש לנסח לפי הדין במסמך נפרד, והוא לא יכול להחליף את הזמנת התיווך, והסכם בלעדיות לא ייכנס לתוקף בלי הזמנת תיווך כדין.","לא; אך ניתן לחתום על הסכם בלעדיות בלבד שיכלול בתוכו הסכם הזמנת תיווך.","כן; לפי פסק הדין אפשר לערבב נושאים בין הזמנת התיווך לבין הסכם הבלעדיות, ובעיקר כשהם נכתבים במפורש.","כן; לפי פסק הדין מכוח עיקרון תום הלב אין חובה להקפיד על הסכם נפרד לבלעדיות כלל."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2021-02r1#20","e":27,"n":20,"s":"יוגי קנה נכס מקרקעין. למימון הרכישה לווה יוגי הלוואה לדיור (משכנתא) מבנק א'.\nהיכן עלולים להופיע רישומים הקשורים להלוואה?","o":["רק ברשם המשכונות.","רק בפנקסי המקרקעין הרלוונטיים לסוג הנכס.","רישומי עירייה או מועצה אזורית.","ברשם המשכונות וגם בפנקסי המקרקעין הרלוונטיים לסוג הנכס."],"c":[3],"a":false,"note":"","sub":"l_mortgage"},{"id":"2021-02r1#21","e":27,"n":21,"s":"לפי פסק הדין בעניין 2413-09-07 סמרה ואחרים נגד שמואל, האם ניתן לחייב בתשלום דמי תיווך בגין רכישה של פעילות של עסק, ולא שכירות או רכישת המקרקעין שבהם בית העסק יושב?","o":["כן; רישיון התיווך יחול על כל תיווך שהוא ללא הגבלה, לרבות במוצרים, בשירותים ובכל עניין אחר.","כן; לעתים המשמעות של העיסקה מבליעה בתוכה הסכם שימוש או קנייה של מקרקעין.","לא; ניתן לתווך בעיסקאות במקרקעין בלבד.","לא, אלא אם הדבר נכתב במפורש בהסכם התיווך."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2021-02r1#22","e":27,"n":22,"s":"אלון וקרן מתגוררים בפזיטו, מושב חקלאי הממוקם על מקרקעי ישראל. לאחרונה היקצתה להם האגודה השיתופית \"משק עזר\". אלון מעוניין לבנות שם שתי יחידות מגורים לאיתי ונגה, ילדיהם של בני הזוג, אך קרן סבורה כי הואיל ומדובר ב\"משק עזר\" ניתן לעשות בשטח שימוש למלאכה או לעיבוד חקלאי בלבד.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["קרן צודקת; \"משק עזר\" מיועד רק לצורכי מלאכה ועיבוד חקלאי.","קרן טועה; \"משק עזר\" מיועד רק לצורך עיבוד חקלאי מצומצם.","קרן טועה; \"משק עזר\" מיועד רק לצורכי מלאכה.","קרן טועה; \"משק עזר\" מיועד ליחידת מגורים, מלאכה ועיבוד חקלאי מצומצם."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2021-02r1#23","e":27,"n":23,"s":"ליאת ומורן כרתו ביניהן הסכם בכתב שלפיו למורן יש זכות קדימה ברכישת דירתה של ליאת כאשר זו תחליט למכור אותה. לצורך הפחתת הסיכוי שליאת תמכור את דירתה מבלי לשאול קודם את מורן האם ברצונה לרכוש אותה, פנתה מורן לרשם המקרקעין והוכיחה לו את דבר קיומה של זכות הקדימה, כדי שזה ירשום הערת אזהרה לטובתה בגין כך על דירתה של ליאת.\nהאם ירשום רשם המקרקעין את הערת האזהרה המבוקשת?","o":["כן, הרשם ירשום את הערת האזהרה ויודיע לליאת על עצם רישומה.","לא, ניתן לרשום הערת אזהרה על סמך בקשתו של הזכאי (מורן במקרה דנן) רק במקרה של הרשאה בלתי חוזרת.","לא, לצורך רישום הערת האזהרה יש צורך בבקשה משותפת של ליאת ומורן לכך.","לא, לא ניתן לרשום הערת אזהרה בגין זכות קדימה."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2021-02r1#24","e":27,"n":24,"s":"הקבלן אושרי מכר דירה חדשה לעמרי. בחוזה נכתב כי החזקה בדירה תימסר לעמרי ביום 1 בינואר, 2020. לצערו הרב של עמרי, אושרי לא העביר לו את החזקה בדירה במועד המוסכם.\nבהנחה שחוזה המכר לא הסדיר את נושא האיחור במסירת הדירה, בתוך כמה ימים יהיה עמרי זכאי לפיצוי בגין האיחור גם ללא הוכחת נזק?","o":["עמרי יהיה זכאי לפיצוי מכוח החוק רק לאחר שחלפו שלושים ימים מתום המועד הקבוע לכך בחוזה המכר.","עמרי יהיה זכאי לפיצוי מכוח החוק רק לאחר שחלפו שישים ימים מתום המועד הקבוע לכך בחוזה המכר.","עמרי יהיה זכאי לפיצוי מכוח החוק רק לאחר שחלפו תשעים ימים מתום המועד הקבוע לכך בחוזה המכר.","עמרי לא יהיה זכאי לפיצוי בלא הוכחת נזק, שכן פיצוי מסוג זה לא חל על עיסקאות מכר מקרקעין."],"c":[1],"a":false,"note":"","sub":"c_remedy"},{"id":"2021-02r1#25","e":27,"n":25,"s":"יצחק, דייר מוגן בדירה יוקרתית במרכז ירושלים, נפטר.\nבין אשתו של יצחק, הפרודה ממנו, שהתגוררה עימו בנכס במשך שנים, לבין בת זוגו החדשה, שהתגוררה עימו בדירה בשבעת החודשים שלפני פטירתו, פרץ ויכוח בשאלה מי זכאית להיות הדיירת המוגנת במקום יצחק.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בת הזוג החדשה היא הדיירת המוגנת, אך זאת בתנאי שהתגוררה בבית שישה חודשים לפחות עם יצחק, ובהתאם להסכם פרידה בין בני הזוג בכתב.","בת הזוג החדשה היא הדיירת המוגנת, ללא כל תנאי או סייג.","דיור מוגן חלף מהעולם, ואין זכאות לדיור מוגן לאחר פטירתו של דייר מוגן.","אשתו הפרודה של יצחק היא הדיירת המוגנת; אין כל אפשרות בחוק לזכות במעמד של דיירות מוגנת לאחר שבעה חודשים בלבד של מגורים משותפים."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2021-02r2#1","e":28,"n":1,"s":"מי מהבאים הוא ״בר רשות״ בהסכם חכירה מול רשות (מינהל) מקרקעי ישראל וקיבוץ או מושב שיתופי?","o":["מי שקיבל רשות ממרכז הנדל״ן הישראלי לעשות שימוש בקרקע.","מי שקיבל רשות מהטאבו (לשכת רישום המקרקעין) לבנות לפי תוכנית היתר.","מי שקיבל רשות מהקיבוץ או מהמושב שבו הוא מתגורר לבנות יחידת דיור.","מי שקיבל רשות מהאגודה השיתופית שהיא בעלת הזכויות בקרקע לעשות שימוש בקרקע."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2021-02r2#2","e":28,"n":2,"s":"מי אחראי לעריכת דוח אפס?","o":["אדריכל.","עורך דין.","שמאי מקרקעין.","מהנדס."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2021-02r2#3","e":28,"n":3,"s":"איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דמי היוון הם תשלום חד פעמי מראש של התשלומים העתידיים לטאבו, עבור זכות חכירה ארוכת טווח של הבעלות במקרקעין.","דמי היוון הם תשלום חד פעמי מראש של התשלומים העתידיים לרשות מקרקעי ישראל, עבור זכות חכירה ארוכת טווח של השכירות במקרקעין.","דמי היוון הם תשלום חד פעמי מראש של התשלומים העתידיים לרשויות המס, עבור זכות חכירה ארוכת טווח של הבעלות במקרקעין.","דמי היוון הם תשלום חד פעמי מראש של התשלומים העתידיים לרשות המיסים."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2021-02r2#4","e":28,"n":4,"s":"מהו ״מדד תשומות הבנייה״?","o":["מדד שמפרסם בנק ישראל המשקף את עלות סל המוצרים והשירותים הניתנים בתחום הבנייה.","מדד שמפרסם בנק ישראל המשקף את השינויים בערך הדירות בישראל.","מדד שמפרסמת הלשכה המרכזית לסטטיסטיקה, המשקף את השינויים, בין היתר, במטבע חוץ.","מדד שמפרסמת הלשכה המרכזית לסטטיסטיקה, המשקף את השינויים, בין היתר, של מחירי חומרי הגלם שבהם משתמשים קבלנים לצורך בניית דירות."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2021-02r2#5","e":28,"n":5,"s":"האם הורשה של מקרקעין והעברה של מקרקעין במסגרת פסק דין לגירושין חייבות במס?","o":["הורשה - כן, העברה במסגרת פסק דין לגירושין - לא.","הורשה - לא, העברה במסגרת פסק דין לגירושין - כן.","שתי הפעולות חייבות במס.","שתי הפעולות אינן חייבות במס, מכיוון שאינן נחשבות ל\"מכירה\" לפי החוק."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2021-02r2#6","e":28,"n":6,"s":"זוהר הקבלן חתם על חוזה למכירת דירה חדשה למשה במסגרת מכרז \"מחיר למשתכן\". בחוזה נכתב כי החזקה בדירה תימסר למשה ביום 1 בינואר 2020. לצערו הרב של משה, זוהר לא העביר לו את החזקה בדירה במועד המוסכם.\nבהנחה שחוזה המכר לא הסדיר את נושא האיחור במסירת הדירה, בתוך כמה ימים יהיה משה זכאי לפיצוי בגין האיחור, גם בלא הוכחת נזק?","o":["משה יהיה זכאי לפיצוי מכוח החוק רק לאחר שחלפו שלושים ימים מתום המועד הקבוע לכך בחוזה המכר.","משה יהיה זכאי לפיצוי מכוח החוק רק לאחר שחלפו שישים ימים מתום המועד הקבוע לכך בחוזה המכר.","משה יהיה זכאי לפיצוי מכוח החוק רק לאחר שחלפו תשעים ימים מתום המועד הקבוע לכך בחוזה המכר.","משה לא יהיה זכאי לפיצוי בלא הוכחת נזק, שכן פיצוי מסוג זה לא חל על עיסקאות מכר מקרקעין."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2021-02r2#7","e":28,"n":7,"s":"עדנה היא בעלים של חנות במרכז 'לב בבלי'. עם הגעתה של עדנה לגיל פרישה, החליטו היא ובעלה לעבור לליסבון ולבלות שם את יתרת חייהם כפנסיונרים. בעקבות כך, החליטה עדנה למכור את החנות. עדנה שכרה את שירותיו של ירון המתווך, ואף חתמה על הסכם בלעדיות כדין. הסכם הבלעדיות לא כלל, ביודעין, סעיף בקשר למשך תקופתו.\nמתי יפוג תוקפו של הסכם הבלעדיות?","o":["תוקפו של הסכם הבלעדיות יפוג לאחר 30 יום.","תוקפו של הסכם הבלעדיות יפוג לאחר 6 חודשים.","תוקפו של הסכם הבלעדיות יפוג לאחר 9 חודשים.","הצדדים בחרו במודע שלא לציין סעיף בקשר למשך תקופתו של ההסכם, ככל הנראה מכיוון שלא רצו להגביל את תקופת הבלעדיות."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2021-02r2#8","e":28,"n":8,"s":"משה המתווך מייצג רוכש פוטנציאלי, המעוניין לקנות נכס של אדם שנפטר זה מכבר בהוצאה לפועל. הנכס נמכר בהוצאה לפועל מכיוון שלאדם שנפטר היו במותו חובות כבדים. בניו של הנפטר אמרו למשה כי הם מבקשים לקבל את הנכס שבו מעוניין הלקוח של משה לידיהם ולגור בו.\nמכיוון שהנכס נמכר עקב חובות של המוריש בהוצאה לפועל, האם הלקוח של משה המתווך יוכל לרכוש את הנכס בהוצאה לפועל?","o":["מרגע שהנכס נמכר בהוצאה לפועל עקב חובות, אין כל יתרון או עדיפות לבניו של הנפטר על פני כל רוכש אחר בהוצאה לפועל.","רק לאחר שימוצו שאר נכסי הנפטר תחילה, כגון ביטוחים וכיוצא בזה, לפני שיימכר נכס המקרקעין.","מי שיקבל עדיפות ברכישת הנכס על פני הקונה הפוטנציאלי הוא קודם כל מי שהנכס יועד לו בצוואה.","רק ילדיו של הנפטר יוכלו לרכוש את הנכס."],"c":[2],"a":false,"note":"","sub":"k_misc"},{"id":"2021-02r2#9","e":28,"n":9,"s":"על פי הוראות חוק המקרקעין (חיזוק בתים משותפים מפני רעידות אדמה), כיצד יש לאשר הליך של הריסת בניין קיים והקמתו מחדש?","o":["ההליך טעון החלטה מראש של כל בעלי הדירות. אם לא תתקבל הסכמה כאמור, אין כל דרך לבצע את העבודות.","ההליך טעון החלטה מראש של רוב בעלי הדירות. אם לא תתקבל הסכמה כאמור, אין כל דרך לבצע את העבודות.","ההליך טעון החלטה מראש של רוב בעלי הדירות, ואולם רשאי המפקח, אף אם לא התקבלה על כך החלטה מראש של כל בעלי הדירות בבית המשותף, לאשר את ביצוע העבודה, על פי תביעה של בעלי הדירות שבמועד הגשת התביעה היו בבעלותם מחצית מהדירות בבית המשותף ומחצית מהרכוש המשותף היו צמודות לדירותיהם, ובלבד שנתן לכל בעלי דירה בבית המשותף הזדמנות לטעון את טענותיו.","ההליך טעון החלטה מראש של כל בעלי הדירות, ואולם רשאי המפקח, אף אם לא התקבלה על כך החלטה מראש של כל בעלי הדירות בבית המשותף, לאשר את ביצוע העבודה, על פי תביעה של בעלי הדירות שבמועד הגשת התביעה היו בבעלותם ארבע חמישיות (4/5) מהדירות בבית המשותף וארבע חמישיות מהרכוש המשותף היו צמודות לדירותיהם, ובלבד שנתן לכל בעלי דירה בבית המשותף הזדמנות לטעון את טענותיו."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2021-02r2#10","e":28,"n":10,"s":"כיצד ניתן לרשום צו רישום בפנקס הבתים המשותפים?","o":["צו לרישום בית בפנקס יינתן על ידי המפקח, אם ביקשו זאת הבעלים ששטח הרצפה של דירותיהם מהווה למעלה ממחצית שטח הרצפה של כל הדירות שבבית.","צו לרישום בית בפנקס יינתן על ידי בית המשפט, אם ביקשו זאת הבעלים ששטח הרצפה של דירותיהם מהווה למעלה ממחצית שטח הרצפה של כל הדירות שבבית.","צו לרישום בית בפנקס יינתן על ידי המפקח, אם ביקשו זאת הבעלים ששטח הרצפה של דירותיהם מהווה למעלה מארבע חמישיות (4/5) משטח הרצפה של כל הדירות שבבית.","כל בעלי דירה בבניין רשאי לפנות לרישום בית בפנקס, על מנת לשמור את זכויותיו בנכס, ואין משמעות לשטח הדירה, שכן כבעלי מקרקעין, הוא רשאי לרשום את זכויותיו אצל המפקח."],"c":[0],"a":false,"note":"","sub":"h_works"},{"id":"2021-02r2#11","e":28,"n":11,"s":"איזו מההתאמות הבאות אינה התאמה הטעונה הסכמה של רוב בעלי הדירות בבית משותף?","o":["התאמת פתח או שער כניסה לחצר הבית, תוך שינוי מבנה הפתח או השער, צורתו או מידותיו, כגון: הסרת מנעול השער, ביטול שער, הרחבת פתח והתקנת שער.","התאמת דלת כניסה או פתח כניסה לבית המשותף, תוך שינוי מבנה הדלת או הפתח, צורתם או מידותיהם, כגון: הסרת מנעול הדלת, ביטול דלת או הרחבת פתח והתקנת דלת.","שינוי תוואי של שביל גישה קיים, לרבות סלילת שביל חדש.","התאמה של מקום חניה קיים."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2021-02r2#12","e":28,"n":12,"s":"בשנת 2019 רכשה נוגה דירת מגורים בתל אביב. שווי הדירה הינו 1 מיליון ש\"ח בדיוק. נוגה שילמה דמי תיווך של 20,000 ש\"ח, ועלות שכ\"ט עורך דין של 10,000 ש\"ח. מעבר לכך לא היו לנוגה עלויות נוספות בקשר לדירתה.\nהניחו שנוגה הינה תושבת ישראל, ללא דירות נוספות בבעלותה וזוהי דירתה היחידה.\nמה יהיה מס הרכישה שעל נוגה לשלם?","o":["3.5% על סכום של 1 מיליון ש\"ח, כלומר סכום של 35,000 ש\"ח.","3.5% על סכום של 970,000 ש\"ח, כלומר 33,950 ש\"ח.","3.5% על סכום של 1,030,000 ש\"ח, כלומר 36,050 ש\"ח.","מאחר שזו דירתה היחידה של נוגה, נוגה אינה צריכה לשלם מס רכישה."],"c":[3],"a":false,"note":"","sub":"x_purchase"},{"id":"2021-02r2#13","e":28,"n":13,"s":"אבנר, בן 38, אזרח מדינת ישראל, השתחרר לפני 4 חודשים מהכלא לאחר שסיים לרצות את עונשו כדין. בזמן שהותו בכלא, הקדיש את מרבית זמנו ללמידה לבחינה לקבלת רישיון תיווך במקרקעין, כדי שיוכל להירשם לבחינה אשר עתידה להתקיים יומיים לאחר שחרורו.\nהאם אבנר רשאי להירשם ולגשת לבחינת המתווכים?","o":["כן; רק אם אבנר אינו פושט רגל.","כן; יש לוודא כי העבירה בה הורשע אבנר אינה עבירה שמפאת מהותה, חומרתה ונסיבותיה הוא אינו ראוי לשמש מתווך מקרקעין.","לא; אבנר בכל מקרה לא יהיה זכאי כיום לגשת לבחינה ולהגיש בקשה לקבלת רישיון תיווך.","לא, גם בתום שנתיים אבנר לא יהיה רשאי לגשת לבחינה."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2021-02r2#14","e":28,"n":14,"s":"איתן עובד בתור מתווך במקרקעין. במסגרת אחת מעיסקאות התיווך שאיתן ניסה לקדם, הגיע לידיו מידע מסוים שאינו מידע מהותי לעיסקה.\nהאם על איתן למסור את המידע שהגיע לידיו ללקוחו?","o":["כן, יש למסור ללקוח גם מידע שאינו מידע מהותי לעיסקה.","כן, על איתן למסור כל מידע ללקוחו תמיד, ללא כל חריג או סייג.","לא, על איתן למסור מידע ללקוחו רק אם הוא עלול לסכן את קיום העיסקה.","לא, מחובתו של איתן למסור את המידע רק אם הוא מהותי."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2021-02r2#15","e":28,"n":15,"s":"תום, אחיו של יעקב, עוסק בתיווך מזה כעשור. לאחרונה החליט יעקב למכור את דירתו שביישוב ירדן הנרקיסים ולכן פנה אל תום, אחיו, כדי שזה יסייע לו במכירת דירתו לאחד מלקוחותיו לפי שוויה בשוק.\nהאם לתום מותר לתווך בעיסקה שבין אחד מלקוחותיו לבין אחיו יעקב?","o":["לא; לתום עניין אישי במכירת הדירה של יעקב ומכאן שאינו יכול לתווך בעיסקה בשום מצב.","כן; אם תום יגלה ללקוחו שהמוכר הוא אחיו ויקבל את הסכמת הלקוח לכך בכתב.","כן; לתום אין עניין אישי במכירת הדירה ולכן אין מניעה שיתווך בעיסקה.","כן; אם תום ימסור ללקוחו את המידע בדבר זהות המוכר, אין כל מניעה שיתווך בעיסקה."],"c":[1],"a":false,"note":"","sub":"b_duties"},{"id":"2021-02r2#16","e":28,"n":16,"s":"רחל ומיכל כרתו ביניהן הסכם בכתב שלפיו למיכל יש זכות קדימה ברכישת דירתה של רחל, כאשר זו תחליט למכור אותה. לצורך הפחתת הסיכוי שרחל תמכור את דירתה מבלי לשאול קודם את מיכל האם ברצונה לרכוש אותה, פנתה מיכל לרשם המקרקעין והוכיחה לו את דבר קיומה של זכות הקדימה בכדי שזה ירשום הערת אזהרה לטובתה בגין כך על דירתה של רחל.\nהאם ירשום רשם המקרקעין את הערת האזהרה המבוקשת?","o":["כן, הרשם ירשום את הערת האזהרה ויודיע לרחל על עצם רישומה.","לא; ניתן לרשום הערת אזהרה על סמך בקשתו של הזכאי (מיכל במקרה דנן) אלא רק במקרה של הרשאה בלתי חוזרת.","לא; לצורך רישום הערת האזהרה יש צורך בבקשה משותפת של רחל ומיכל לכך.","לא; לא ניתן לרשום הערת אזהרה בגין זכות קדימה."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2021-02r2#17","e":28,"n":17,"s":"עידו הינו אדם פרטי שרכש נכס למגורים בשנת 2000.\nבשנת 2015 הורחבו זכויות הבנייה בנכס כתוצאה מאישורה של תב\"ע שהופקדה בעיריה.\nבשנת 2020 מכר עידו את הנכס לעלמה (גם היא אדם פרטי אשר רכשה את הנכס לצורכי מגוריה).\nבחוזה המכר נכתב: ״היטלים לרשות המקומית ישולמו על ידי הבעלים״.\nמה המיסים שעל עלמה לשלם?","o":["מס רכישה.","היטל השבחה.","מס שבח מקרקעין.","מס ערך מוסף."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2021-02r2#18","e":28,"n":18,"s":"בנק טפחות מבקש לרשום משכנתא על נכס מקרקעין.\nהיכן יוכל לרשום את המשכנתא כאשר הנכס אינו רשום עדיין בלשכת המקרקעין (\"טאבו\")?","o":["ברשם המשכונות בלבד.","בחברה המשכנת בלבד.","בממונה על הרישום במינהל האזרחי באיו\"ש בלבד.","בכל הגופים המוזכרים בתשובות האחרות."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2021-02r2#19","e":28,"n":19,"s":"בלובי של בניין ״אורות בעיר״, הרשום כבית משותף, ישנה רחבה שבה הוקם פסל מפואר. הרחבה מוגדרת כ״הצמדה״ לרכוש המשותף בבניין, ולצורך הקמתה ניתן היתר בנייה כדין.\nכעת מבקש בעל אחת הדירות, שהינו מיליונר אמיד, להצמיד את הרחבה לדירתו הפרטית, ומוכן לשלם על כך סכום ניכר.\nהאם הדבר ניתן?","o":["ניתן להצמיד את הרחבה כחלק מהרכוש המשותף לדירתו של בעלים מסוים בבית משותף, אך זאת רק בהינתן רוב של 100% מבעלי הדירות.","מכיוון שמדובר בפסל שהוא יצירת אמנות, ניתן להצמידו לדירתו של בעלים מסוים בבית משותף ללא כל הגבלה.","ניתן להצמיד הצמדה זאת בבית המשותף לדירתו של בעלים מסוים בלבד, אך זאת בהינתן רוב של 51% מבעלי הדירות.","ניתן להצמיד הצמדה זאת בבית המשותף, מכיוון שיש לפסל היתר בנייה נפרד כדין."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2021-02r2#20","e":28,"n":20,"s":"מרתה רוצה להוסיף מרפסת בדירתה.\nלאיזו רשות עליה לפנות בבקשה להיתר?","o":["רשם המקרקעין (\"טאבו\").","הוועדה המקומית לתכנון ובנייה בעירייה.","החברה המשכנת.","מינהל מקרקעי ישראל."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2021-02r2#21","e":28,"n":21,"s":"מה מבין הבאים עשויה להיחשב כ\"תוכנית מפורטת\" בסמכות ועדה מקומית לתכנון ובנייה?","o":["קביעת גובהם של בניינים ומספר הקומות שמותר להקים בהם.","קביעת הוראות בדבר אספקת ביוב לאזור העיר ולאזור של עיר אחרת הנסמכת על מתקני העיר.","קביעת הוראות בדבר מתקנים לאספקת חשמל לאזור העיר ולאזור של עיר אחרת הנסמכת על מתקני העיר.","ייחוד נכס כ\"שמורת טבע\" ארצית."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2021-02r2#22","e":28,"n":22,"s":"במסגרת אחת מעיסקאות התיווך שניהל, לא גילה אריאל ללקוחו על עניין אישי שהיה לו באותה העיסקה. בשל כך, הוגשה קובלנה נגד אריאל ונוהל נגדו הליך משמעתי מול ועדת המשמעת.\nאיזה מבין האמצעים הבאים אין בסמכותה של ועדת המשמעת להטיל על אריאל בגין התנהלותו?","o":["לחייב את אריאל בתשלום הוצאות ההליכים המשמעתיים שהתנהלו נגדו.","להתלות את רישיונו לתקופה קצובה של חמש שנים.","להטיל על אריאל קנס כספי על תנאי.","לבטל את רישיון התיווך של אריאל."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2021-02r2#23","e":28,"n":23,"s":"מועדון הלילה ״בננה ספליט״ הופעל בבאר שבע כדין מזה שנים ארוכות על ידי משה, עד לפטירתו בטרם עת לאחרונה. משה שכר את המועדון בדמי מפתח, ועם פטירתו המשיכה בתו יפעת להפקיד את דמי המפתח לבעל הבית, והשכירה מחצית מהנכס בשכירות משנה לדייר אחר.\nבעל הבית של המועדון מבקש להחזיר את הנכס לידיו כדי לגבות שכירות במחיר שוק ולא שכירות מופחתת בדמי מפתח.\nהאם רשאית יפעת להמשיך את השכירות של העסק בדמי מפתח בתנאים אלה?","o":["כן; יפעת זכאית להמשיך את דמי המפתח כבתו של משה.","כן; אולם רק כפוף לפינוי דייר המשנה.","לא; יפעת אמנם זכאית להמשיך את דמי המפתח כבתו של משה, אולם זכותה בוטלה מכיוון שהשכירה חלק מהעסק בשכירות משנה.","לא; עם פטירתו של דייר בדמי מפתח, חוזר הנכס לבעליו כשהוא נקי מדמי מפתח."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2021-02r2#24","e":28,"n":24,"s":"לפי פסק הדין ע״א 2643/97 שלמה גנז נגד בריטיש וקולוניאל חברה בע״מ ואחרים:\nלקוח של המתווך לירון קנה נכס, אך לא הספיק לרשום הערת אזהרה בטאבו. הסתבר כי המוכר ועורך דינו היו נוכלים, ומכרו את הנכס באופן מיידי לאדם אחר בתמורה לסכום נמוך יותר. הקונה השני הספיק לרשום הערת אזהרה בטאבו, ולא ידע על קיומו של הלקוח של לירון, אך שילם כבר את הכסף.\nלפי פסק הדין בעניין, מי יזכה בנכס בנסיבות שכאלה?","o":["הקונה החדש, משום שהלקוח של לירון לא רשם הערת אזהרה בטאבו ומשום שלא ידע על קיומו של הלקוח של לירון.","הקונה החדש, משום שאחרון בזמן תמיד גובר על הראשון בזמן במכירה.","לירון, משום שהיה הקונה הראשון.","לקוחו של לירון, משום שהראשון בזמן תמיד גובר."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2021-02r2#25","e":28,"n":25,"s":"לפי פסק הדין בעניין ע\"א 2144/91 מוסקוביץ נגד ביר, מה יהיה גובהם של דמי תיווך במידה ודמי התיווך לא סוכמו במסגרת הזמנת תיווך?","o":["דמי התיווך יעמדו על 1% במידה ולא סוכמו.","דמי התיווך יעמדו על 2% במידה ולא סוכמו.","לפי פסק הדין, לא ישולמו דמי תיווך כלל אם לא נכתב הסכום של דמי התיווך כדין בהזמנת תיווך.","לפי פסק הדין, דמי התיווך ישולמו כמקובל במקרה של עיסקת קומבינציה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2021-04#1","e":29,"n":1,"s":"מתווך התקשר עם בעלי דירה בהסכם בלעדיות שכל תוכנו של ההסכם עסק אך ורק בבלעדיות.\nהמתווך פירסם את הדירה באתר האינטרנט שלו, אולם במקביל פירסמו בעלי הדירה את הדירה בלוח מודעות באינטרנט.\nלמחרת, מר ווטסון נתקל במודעה של בעלי הדירה, התקשר לבעלי הדירה, ובמעמד השיחה נקבע שהמחיר יעמוד על 1,000,000 ש\"ח. למחרת היום נחתם חוזה המכר בסכום זה, בין בעלי הדירה למר ווטסון.\nלאחר זמן מה הגיע המתווך לדירה ופגש שם את מר ווטסון. מר ווטסון סיפר למתווך שהוא הבעלים החדש. בתגובה דרש המתווך ממר ווטסון סכום של 20,000 ש\"ח בגין שירותי התיווך.\nהאם מר ווטסון חייב לשלם דמי תיווך?","o":["כן; המתווך הינו הגורם היעיל בעיסקה.","כן; חזקה על המתווך שהינו הגורם היעיל, מאחר שמר ווטסון קנה את הנכס בתוך תקופת הבלעדיות.","כן; אם יוכח שהמוכרים לא שילמו למתווך, הרי שהאחריות הינה של מר ווטסון.","לא."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2021-04#2","e":29,"n":2,"s":"זיוה ודני גרים בהרצליה פיתוח. בבעלותם שתי דירות בשווי 2 מיליון ש\"ח כל אחת.\nבעקבות קשיים כלכליים, נאלצו דני וזיוה למכור את דירות המגורים שלהם ולקנות דירה קטנה יותר.\nדירה אחת נאלצו למכור בתאריך 12.5.2020. במקומה רכשו מזוג צעיר בתאריך 17.5.2020 דירת מגורים קטנה יותר בשווי מיליון ש\"ח, שהייתה לטעמם.\nאת הדירה השנייה שבבעלותם נאלצו למכור בתאריך 30.5.2020, וזאת כאמור לאחר שמכרו את דירתם הראשונה.\nהאם דני וזיוה יכולים להצהיר לרשויות מיסוי מקרקעין, לצורכי חישוב מס רכישה במקרקעין, כי רכשו את דירת המגורים היחידה שלהם?","o":["כן; מכיוון שחישוב מס רכישה הוא חישוב לינארי.","כן; מכיוון שטרם עברו 24 חודשים מרגע מכירת הדירה הראשונה של כל אחד מבני הזוג.","לא; מכיוון שבמועד הרכישה היו בבעלות זיוה ודני שתי דירות ולא דירה יחידה.","לא; אלא אם עברו 24 חודשים מרגע מכירת הדירה הראשונה של דני וזיוה."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"x_purchase"},{"id":"2021-04#3","e":29,"n":3,"s":"דוד ויוסי הם אחים ושניהם מתווכים. יוסי עובד כשכיר אצל דוד.\nיוסי אילץ אישה מבוגרת באיומים שתחתום על חוזה להזמנת שירותי תיווך, ומנע מהגברת להתקשר ולהתייעץ עם עורך דינה לגבי החתימה; יוסי דרש מהלקוחה לחתום על המסמך באופן מיידי.\nהלקוחה חתמה על הזמנת שירותי התיווך, ודמי התיווך שולמו לאחים בגין העיסקה.\nיחד עם זאת, לאחר תקופה קצרה הוגשה תלונה לממונה על חוק הגנת הצרכן כנגד האחים.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין מניעה למנוע מלקוח התייעצות לגבי התקשרות בעיסקה או תנאיה כשהלקוח מבקש התייעצות שכזו; מדובר בעשיית עסקים לגיטימית.","עורך דינה של הלקוחה אינו חלק מהעיסקה, ולכן אין חובה בחוק לאפשר לה להתייעץ עימו.","רק יוסי, ולא דוד, עשוי להיות אחראי להפרה של חוק הגנת הצרכן.","דוד ויוסי עשויים להיות אחראים להפרה של חוק הגנת הצרכן."],"c":[3],"a":false,"note":"","sub":"k_consumer"},{"id":"2021-04#4","e":29,"n":4,"s":"שמרית קנתה נכס מקרקעין. המוכר החליט להטעות ולרמות את שמרית ואת יפית, והתחייב בעיסקת מקרקעין נוספת בגין אותם מקרקעין גם כלפי יפית.\nשמרית, הקונה הראשונה, מיהרה ושילמה במזומן תמורה גבוהה עבור הנכס, כפי שדרש המוכר. יפית שילמה במזומן תמורה קטנה יותר עבור הנכס, גם זאת בהתאם לדרישת המוכר.\nאחד השכנים סיפר ליפית שראה כי הנכס כבר נמכר לשמרית במחיר מפולפל, וכי שמרית הקונה היא במקרה הבת של חברים שלו. יפית בחרה שלא לבדוק את הנושא, והזדרזה לנסות ולרשום את הבעלות בטאבו על שמה, וזאת על מנת שהמוכר לא יתחרט לגבי המחיר הזול שבו מכר לה את הנכס.\nבנסיבות המתוארות, האם שמרית או יפית יזכו בבעלות בנכס?","o":["שמרית, הקונה הראשונה, תזכה בבעלות על הנכס, משום שהקונה השנייה לא בדקה את דברי השכנים וניסתה לעקוף את הקונה הראשונה.","שמרית, הקונה הראשונה, תזכה בבעלות על הנכס, משום שהקונה הראשון תמיד זוכה במקרה של מכירה כפולה.","אף אחת מהן לא תזכה בבעלות על הנכס.","יפית, הקונה השנייה, תזכה בבעלות על הנכס, משום שהקונה השנייה תמיד תזכה במקרה של מכירה כפולה."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2021-04#5","e":29,"n":5,"s":"מהו הרוב המתאים של בעלי הדירות בבית משותף לביצוע התקנת מעלית?","o":["שני שלישים.","75%","51%","60%"],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2021-04#6","e":29,"n":6,"s":"קבלן מוכר דירה חדשה. נציג הקבלן דרש מהקונה תשלום מראש של 20% מתמורת הנכס.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["קבלן יכול לקבל במקרה זה רק 14% משווי הדירה מבלי לתת בטוחה בגין העיסקה לקונים.","קבלן יכול לקבל במקרה זה רק 7% או פחות מכך משווי הדירה מבלי לתת בטוחה בגין העיסקה לקונים.","קבלן חייב לתת במקרה זה בטוחה, שהיא ערבות בנקאית, מהשקל הראשון, לקונים בעיסקת מקרקעין.","אין מניעה לדרוש מקונה במקרה זה 20% מהתמורה מראש, ללא ערובה בגין רישום הערת אזהרה לגבי העיסקה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2021-04#7","e":29,"n":7,"s":"שמשון החליט לקנות דירה מהקבלן יובב. יובב הקבלן סיפק לשמשון מפרט של הדירה.\nשמשון מצא בדירה סטיות מהמפרט שעליו הקבלן התחייב.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין חובה למסור מפרט של דירה לרוכש, אין צורך להחתים את הרוכש על כל שינוי ביחס למפרט, אלא רק על שינויים מהותיים ביחס למפרט.","אין חובה למסור מפרט של דירה לרוכש. יש צורך להחתים את הרוכש על כל שינוי ביחס למפרט.","חובה למסור מפרט של דירה לרוכש ולהחתים את הרוכש על כל שינוי ביחס למפרט.","חובה למסור מפרט של דירה לרוכש. יש צורך להחתים את הרוכש רק על שינוי מהותי ביחס למפרט."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2021-04#8","e":29,"n":8,"s":"באיזה/אילו מהמקרים הבאים ניתן לבטל חוזה בישראל?","o":["רק במקרה של הטעיה.","רק במקרה של כפייה ועושק.","רק במקרה של טעות.","בכל המקרים המוזכרים בתשובות האחרות."],"c":[3],"a":false,"note":"","sub":"c_form"},{"id":"2021-04#9","e":29,"n":9,"s":"עמי ותמי, בני זוג, נכנסו לאתר המכירות של פרויקט בבנייה, וכל אחד מהם קנה מהקבלן דירה לעצמו. הקבלן מכר דירה אחת לעמי במחיר הגבוה מ- 1.5 מיליון ש\"ח, ודירה אחרת לבת זוגו תמי במחיר של מיליון ש\"ח באותו פרויקט בנייה.\nהקבלן איחר במסירת הדירה לעמי ב- 14 יום ולתמי ב- 100 יום.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הקבלן חייב לפצות רק את תמי, מכיוון שלפי החוק יש חובת פיצוי רק אם יש איחור משמעותי של יותר מ- 90 יום.","אין כפל פיצוי באיחור של מסירת דירה לבני זוג שקנו 2 דירות באותו פרויקט.","הקבלן חייב לפצות את עמי בלבד, מכיוון שמגיע פיצוי רק בעקבות איחור במסירת דירה שנקנתה ביותר מ- 1.5 מיליון ש\"ח.","הקבלן חייב לפצות את תמי בלבד, מכיוון שהקבלן איחר במסירת הדירה ביותר מ- 60 יום."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2021-04#10","e":29,"n":10,"s":"מה מקנה \"טופס 4\" לבעל הנכס?","o":["\"טופס 4\" מקנה לבעל הנכס זכאות לחבר את הבניין לתשתיות כמו לרשת החשמל, המים, התקשורת וכו'.","\"טופס 4\" מקנה לבעל הנכס זכאות לחבר את הבניין לתשתיות, כגון לרשת החשמל, המים, והתקשורת ולאכלס בפועל את הבניין.","\"טופס 4\" הוא היתר בנייה.","\"טופס 4\" מקנה לבעל הנכס אפשרות לאכלס בפועל את הנכס גם אם העבודות לא הסתיימו במלואן."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2021-04#11","e":29,"n":11,"s":"בפסק דין תא\"מ 4203-02-09 שמעון נ' סמיקון, נדונה תביעה בגין דרישה לתשלום דמי תיווך עבור מכירת דירת הנתבעת בהרצליה. מהעובדות עולה כי לאחר חתימת זיכרון הדברים התברר לנתבעת כי רובצים על הנכס עיקולים ושיעבודים.\nמה קבע בית המשפט?","o":["בית המשפט קבע שהמתווך אינו צריך למסור ללקוחו מידע לגבי עיקולים ושיעבודים הרובצים על הנכס, מכיוון שלא מדובר במידע מהותי.","בית המשפט קבע שהמתווך חייב למסור ללקוחו מידע לגבי עיקולים ושיעבודים הרובצים על הנכס, מכיוון שמדובר במידע מהותי.","בית המשפט קבע שאין פסול בנוכחות של מתווך בזמן עריכת זיכרון דברים.","בית המשפט קבע שמתווך אינו יכול לטפל בעיסקה שבה יש עיקול או שיעבוד הרובצים על הנכס."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2021-04#12","e":29,"n":12,"s":"מהו \"מחירון דקל\"?","o":["\"מחירון דקל\" הוא כלי עזר לתמחור עבודות בנייה.","\"מחירון דקל\" הינו מחירון לכריתת עצים המתפרסם ע\"י פקיד היערות.","\"מחירון דקל\" הוא מחירון לעצי דקל שונים שבפיקוח, המפורסם ע\"י משרד החקלאות.","\"מחירון דקל\" הוא אמצעי לחיפוש ואיתור נכסים לפי מחיר ואזור ברחבי הארץ."],"c":[0],"a":false,"note":"","sub":"k_consumer"},{"id":"2021-04#13","e":29,"n":13,"s":"בין גב' רבינאי לבין חברת \"מן השקד\" בע\"מ נחתם זיכרון דברים למכירת דירתה של גב' רבינאי בהרצליה, בסכום של 3.5 מיליון ש\"ח. נקבע כי בתוך 10 ימים ייחתם חוזה בין הצדדים. הוכן חוזה, אך לא נחתם, שכן גב' רבינאי חזרה בה מהעיסקה בטענה כי מחיר הדירה שנקבע נמוך בהרבה מערכה בשוק.\nבנסיבות העניין ועל פי פס\"ד של ביהמ\"ש העליון: \"ע\"א 158/77 חוה רבינאי נ' חברת מן השקד בע\"מ (בפירוק)\", האם זיכרון הדברים מחייב את הצדדים?","o":["לאחר שהמוכרת חזרה בה מהעיסקה, זיכרון דברים לא מחייב את הצדדים. יתרה מכך, הצדדים לא חתמו על חוזה מחייב בתוך 10 ימים כנדרש.","זיכרון הדברים מחייב את הצדדים, אך יש לשערך את שווי הבית להיום.","זיכרון הדברים אינו מחייב, מאחר שלא נוצר קשר חוזי מחייב בין הצדדים, משום שהצדדים ביקשו לראות עצמם קשורים רק עם חתימת חוזה.","זיכרון דברים עשוי לחייב את הצדדים כמו כל חוזה, ובלבד שהוא כולל, בין היתר, פרטים מהותיים וחיוניים של העיסקה."],"c":[3],"a":false,"note":"","sub":"c_form"},{"id":"2021-04#14","e":29,"n":14,"s":"זוג מבוגרים פנו למתווכת טלי לקבל שירותי תיווך למציאת דירת מגורים בקומת קרקע בנתניה. מאחר שהזוג חסר ניסיון ואינו מכיר את החוקים, ביקשו בני הזוג שהבית יהא ללא פגמים או הפתעות, כך שיוכלו להתגורר בו מייד עם רכישתו. המתווכת הבטיחה כי תמצא עבורם בית על פי דרישתם. לאחר חתימת ההסכם התברר לרוכשים כי חלק מהדירה נבנה ללא היתר. בני הזוג ביטלו את הסכם הרכישה. למרות זאת, נדרשו ע\"י המתווכת לשלם את דמי התיווך.\nבנסיבות המתוארות ובהתאם לפסק דין: \"בר\"ע 209/01 זיוה וזאב מאיר נ' טלי שושן ואח'\", איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המתווכת תהא זכאית לדמי תיווך; לא ניתן לצפות שהמתווך יידע שחלק מהדירה הינו ללא היתר, מאחר שבדיקת המצב החוקי של הדירה הינה באחריות עורך הדין.","המתווכת לא זכאית לדמי תיווך מאחר שלא פעלה בנאמנות, בהגינות ובזהירות סבירה במילוי תפקידה.","המתווכת לא תהיה זכאית לתשלום דמי תיווך, מאחר שהסכם הרכישה בוטל.","לאחר שנחתם חוזה בין הצדדים, המתווכת זכאית לתשלום דמי תיווך גם אם הרוכשים ביטלו את הסכם הרכישה."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2021-04#15","e":29,"n":15,"s":"מתי פוקעת מישרתו של מנהל עיזבון?","o":["מישרת מנהל עיזבון פוקעת ביום שבו בית משפט מאשר כי סיים את תפקידו.","מישרת מנהל עיזבון פוקעת רק לאחר מסירת הודעתו להתפטרות מתפקידו.","מישרת מנהל עיזבון פוקעת לפי בקשת מעוניין בדבר או לבקשת היורשים.","מישרת מנהל עיזבון פוקעת אם ביקשו כך נושי המוריש."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2021-04#16","e":29,"n":16,"s":"החברה הקבלנית \"הבונים באושר\" מקימה בניין דירות חדש ברמת בית שמש. הבניין בן 12 קומות ובו 24 דירות מגורים ו- 4 חנויות בקומת הקרקע. משרד התיווך של איציק חסיד, הידוע ביעילותו בסביבה, חתם בכתב עם החברה על הסכם תיווך, לפיו יקבל חצי אחוז על כל עיסקה שיביא לידי מימוש. בשל דמי התיווך הנמוכים שעליהם סוכם בהסכם התיווך, נקבעה תקופת בלעדיות של שנתיים (24 חודשים) על כלל הנכסים בפרויקט.\nבנסיבות העניין ולעניין הסכם הבלעדיות שנקבע, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["תקופת הבלעדיות למכירת הדירות וגם תקופת הבלעדיות למכירת חנויות תקינות.","תקופת הבלעדיות למכירת הדירות וגם תקופת הבלעדיות למכירת חנויות אינן תקינות.","תקופת הבלעדיות לעניין החנויות אינה תקינה מאחר שתקופת הבלעדיות לא יכולה לעלות על תשעה חודשים מהיום שבו חתמה החברה על ההזמנה.","תקופת הבלעדיות שנקבעה בהסכם לגבי דירות המגורים אינה תקינה, אך תקופת הבלעדיות לעניין החנויות תקינה."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2021-04#17","e":29,"n":17,"s":"למיכאל אליצור חנות תכשיטים ברחוב המלך ג'ורג' בירושלים, אותה רכש בדמי מפתח בשנת 1965 (תשכ\"ה). עתה, לאחר שמיכאל הגיע לגיל 80, הוא מעוניין למכור את החנות בדמי מפתח ולפרוש לגימלאות.\nמה יהא חלקו של בעל הבית בדמי מפתח שיתקבלו מהמכירה מאת הדייר הנכנס בשנת 2021?","o":["50%, המהווים את הסכום העודף על חלקו של הדייר היוצא.","25%, המהווים את הסכום העודף על חלקו של הדייר היוצא.","33%, המהווים את הסכום העודף על חלקו של הדייר היוצא.","40%, המהווים את הסכום העודף על חלקו של הדייר היוצא."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2021-04#18","e":29,"n":18,"s":"איזו מבין ההחלטות הבאות אינה בסמכות הוועדה המקומית לתכנון ובנייה?","o":["הגדלת שטחים שנקבעו בתוכנית בת תוקף לצורכי ציבור.","הוספת שימושים, במגרש המיועד בתוכנית למגורים וששטחו עולה על 3000 מ\"ר, למטרת משרדים, מלונאות או מסחר בחזית בניין המיועד למגורים.","קביעה או שינוי בדבר גובהם של בניינים ומספר הקומות שמותר להקים בבניין.","הגדלת השטח הכולל המותר לבנייה במגרש המיועד למגורים בתוכנית שאישרה הוועדה המחוזית בשיעור עד 20% מהשטח הכולל המותר לבנייה לפי התוכנית."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2021-04#19","e":29,"n":19,"s":"מהי ההגדרה המדויקת ל\"זכות במקרקעין\" לעניין מיסי המקרקעין בישראל?","o":["זכות במקרקעין הינה בעלות או חכירה לתקופה העולה על עשרים וחמש שנים, בין שבדין ובין שביושר.","זכות במקרקעין הינה בעלות או חכירה לתקופה העולה על חמש עשרה שנים, בין שבדין ובין שביושר.","זכות במקרקעין הינה בעלות או חכירה לתקופה העולה על שלושים שנים, בין שבדין ובין שביושר.","זכות במקרקעין הינה בעלות או חכירה לתקופה העולה על עשרים שנים, בין שבדין ובין שביושר והרשומים בפנקס המקרקעין."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2021-04#20","e":29,"n":20,"s":"מיטל מבקשת לפתוח חנות אלקטרוניקה ב״קניון האחים״, הסמוך למקום מגוריה. ב״קניון האחים״ אין חברת ניהול.\nהאם מיטל נדרשת לרישיון בגין עסק שנפתח בקניון? אם כן, לאיזו תקופה יינתן לה הרישיון ועל ידי איזה גורם?","o":["מיטל נדרשת לרישיון בגין עסק שנפתח בקניון. כאשר נדרש רישיון, הרישיון ניתן על ידי משרד הכלכלה והתעשייה ל- 15 שנים קדימה.","מיטל נדרשת לרישיון בגין עסק שנפתח בקניון. כאשר נדרש רישיון, הרישיון ניתן על ידי הרשות המקומית ל- 10 שנים קדימה.","אין צורך ברישיון בגין עסק שנפתח בקניון. כאשר נדרש רישיון, הרישיון ניתן על ידי הרשות המקומית ל- 15 שנים קדימה.","אין צורך ברישיון בגין עסק שנפתח בקניון. כאשר נדרש רישיון, הרישיון ניתן על ידי הרשות המקומית ל- 10 שנים קדימה."],"c":[1],"a":false,"note":"","sub":"k_misc"},{"id":"2021-04#21","e":29,"n":21,"s":"בעלי בית משותף בן 12 דירות ברחוב דרך חברון בירושלים ייאלצו להרוס את הבניין, וזאת בשל שקיעה של יסודות הבניין.\nשבעה מבעלי הדירות, המהווים רוב של ¾ (שלושה רבעים) מבעלי הדירות אשר הרכוש המשותף בנכס צמוד לדירותיהם, מעוניינים לשמש כמשקמים, ולבנות את הבית המשותף מחדש.\nהמשקמים פנו לשאר בעלי הדירות, ודרשו מהם להשתתף בהוצאות הכרוכות בבנייה מחדש, באופן יחסי, לפי חלקם ברכוש המשותף.\nקיימת תוכנית אדריכלית והנדסית לנכס, שלפיה ניתן להקים את הבניין מחדש ללא הדירות שבעליהן לא מעוניינים לשלם בגין הבנייה מחדש.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מכיוון שיש אפשרות מעשית, לפי תוכנית אדריכלית והנדסית, לבנות את הבניין מחדש, ללא הדירות שלא מעוניינות להשתתף בפרויקט, ניתן לחייב את כל בעלי הדירות להשתתף בהוצאות הכרוכות בבנייה מחדש.","ניתן תמיד לחייב את כלל הדיירים להשתתף בהוצאות הבנייה מחדש לפי חלקם ברכוש המשותף.","יש לבטל את בקשת המשקמים, וזאת מכיוון שלא ניתן להקים מחדש במקרה כזה את הבניין ברוב של 3/4 (שלושה רבעים) מבעלי הדירות שהרכוש המשותף צמוד לדירותיהם.","ישנה אפשרות לצוות על בעלי הדירות המסרבים להשתתף בתוכנית הבנייה מחדש להעביר את זכותם לאדם אחר שיבוא במקומם בכל הנוגע לחובת ההקמה או התיקון של הנכס."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"h_common"},{"id":"2021-04#22","e":29,"n":22,"s":"חני חתמה על הסכם הרשאה עם רמ\"י, לתקופה של 3 שנים - הסכם שנהוג לחדשו.\nהאם חייבת חני בתשלום מס רכישה?","o":["לא.","כן.","כן, בשיעור שליש ממס הרכישה הרגיל.","כן, למעט קרקע חקלאית."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2021-04#23","e":29,"n":23,"s":"מגרש נמכר במחיר 100,000 ש\"ח. הצדדים סיכמו כי הקונה ישלם את מיסיו של המוכר, בסך 30,000 ש\"ח.\nמהו שווי המכירה לצורך דיווח לרשויות המס על העיסקה?","o":["70,000 ש\"ח.","100,000 ש\"ח.","130,000 ש\"ח.","הקונה לא רשאי לשלם את המס של המוכר."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2021-04#24","e":29,"n":24,"s":"איציק רכש דירת מגורים נוספת לעצמו לפני שנתיים וחצי. במשך חצי שנה הדירה שימשה לסדנה לתיקון תכשיטים ומכירתם ואיש לא גר בה. כעת, לאחר שבמשך שנתיים הוא השכיר את הדירה למגורים, הוא מבקש למכור אותה.\nהאם איציק זכאי לפטור ממס שבח?","o":["כן, מכיוון שהדירה שימשה למגורים ארבע חמישיות מהתקופה עבורה מחושב השבח.","לא, מכיוון שהדירה לא שימשה למגורים ארבע חמישיות מהתקופה עבורה מחושב השבח.","לא, מכיוון שהדירה שימשה למגורים ארבע שנים לפני מכירתה, למרות ששימשה למגורים ארבע חמישיות מהתקופה עבורה מחושב השבח.","כן, כל דירת מגורים נחשבת כ\"דירת מגורים מזכה\" לעניין פטור ממס שבח, ללא תלות בתקופה."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"x_gains"},{"id":"2021-04#25","e":29,"n":25,"s":"יורם, מתווך מקרקעין, נהג בפזיזות ומתוך התלהבות סיפר ללקוח שלו שהוא \"מוכרח לרכוש\" דירה מסוימת, בטענה שאושרה באזור הנכס תב\"ע - \"תוכנית בניין עיר\" - שתעלה את ערך הנכס באופן משמעותי. דבריו של יורם היוו שיקול מרכזי מבחינת הלקוח ברכישת הנכס.\nהאם כאשר יורם נסחף בלשונו הוא עבר עבירת משמעת כמתווך?","o":["לא; ישנה חובת זהירות המוטלת על מתווכים בדין, אך הפרתה מהווה הפרה של אתיקה מקצועית בלבד ולא מהווה עבירת משמעת.","כן; ישנה חובת זהירות המוטלת על מתווכים בדין, אשר הפרתה מהווה עבירת משמעת.","לא; לא חלה על מתווכים חובת זהירות בדין.","כן; הפרה של כל חובה שהיא המוטלת על מתווך בחוק המתווכים מהווה עבירת משמעת."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2021-07#1","e":30,"n":1,"s":"האם מותר לנכות הוצאות לצורך קביעת סכום השבח בעת מכירת מקרקעין? אם כן, אילו? אנא סמנו את התשובה הנכונה ביותר.","o":["ניתן לנכות כל הוצאה הכלולה בשווי המכירה.","לא ניתן לנכות הוצאות, למעט היוון.","ניתן לנכות את דמי התיווך ברכישת הזכות, אך לא יותר מ- 2% מהתמורה, שכ\"ט עו\"ד, ושכ\"ט שמאי מקרקעין, כל זאת אם אינם כלולים בשווי המכירה.","אין אפשרות לנכות הוצאות מהחיוב של מס שבח מקרקעין."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2021-07#2","e":30,"n":2,"s":"רן התקשר עם מתווך בהזמנת תיווך, לפיו המתווך יפעל למכירת דירתו בבלעדיות. בהסכם הבלעדיות לא פורטו פעולות השיווק שעל המתווך לבצע.\nבנסיבות המתוארות, כמה פעולות שיווק על המתווך לבצע לצורך קיום תנאי הבלעדיות?","o":["המתווך לא חייב לבצע פעולות שיווק, אם אלו לא סוכמו לצורך בלעדיות.","על המתווך לבצע שתי פעולות שיווק לפחות.","על המתווך לבצע את כל פעולות השיווק המנויות בתקנות המתווכים (פעולות שיווק).","פעולות השיווק יפורטו בהזמנת התיווך."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2021-07#3","e":30,"n":3,"s":"בבית משותף, בעלי דירות רשאים לערוך תקנון ולשנות את הוראותיו.\nמהו שיעור הבעלות ברכוש המשותף הצמוד לדירותיהם של רוב בעלי הדירות הדרוש לצורך שינוי התקנון?","o":["66.66% (שני שליש).","75% (שלושה רבעים).","51% (חמישים ואחד אחוז).","60% (שישים אחוז)."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2021-07#4","e":30,"n":4,"s":"מר ברגמן, אלמן, התגורר בגפו בדירה בדמי מפתח. לימים, מר ברגמן הפך מרותק לדירתו. בנו המסור אלעזר, המתגורר בדירה שבבעלותו, עבר לגור עם אביו כדי לסעוד אותו במחלתו. לאחר מספר חודשים נפטר מר ברגמן.\nבנסיבות העניין, האם אלעזר יהיה לדייר הבא ויוכל להחזיק בדירה? נא לסמן את התשובה הנכונה ביותר.","o":["אלעזר יהיה לדייר הבא ויוכל להחזיק בדירה, ובלבד שהתגורר בדירה ביחד עם אביו לפחות שישה חודשים סמוך לפטירתו.","אלעזר יהיה לדייר הבא ויוכל להחזיק בדירה, ובלבד שהתגורר בדירה ביחד עם אביו לפחות שישה חדשים סמוך לפטירתו ושהודיע מראש על מגוריו עם אביו לבעל הבית.","אלעזר לא יהיה לדייר הבא ולא יוכל להחזיק בדירה, מאחר שבבעלותו דירת מגורים אחרת.","אלעזר יהיה לדייר הבא ויוכל להחזיק בדירה, ובלבד שהתגורר בדירה ביחד עם אביו לפחות שנה סמוך לפטירתו."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2021-07#5","e":30,"n":5,"s":"עמוס, בעלים של דירת מגורים, פנה למתווך דוד לצורך מכירת דירתו.\nדוד המתווך החתים את עמוס על טופס הזמנה לשירותי תיווך.\nאיזה מהמשפטים הבאים הוא הנכון ביותר בהתייחס לתוכן הזמנת תיווך במקרקעין על פי התקנות?","o":["אין צורך לכלול מע״מ בדמי התיווך המוסכמים.","אין צורך לכתוב את סוג העיסקה (כגון בעלות, שכירות וכו').","אין צורך לכלול את לוח התשלומים של התמורה שסיכמו הצדדים בעד הנכס.","אין צורך לכלול את כתובת הלקוח וכתובת המתווך."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2021-07#6","e":30,"n":6,"s":"שמעון, מתווך במקרקעין, סיכם עם גונן על מכירת דירתו. הצדדים חתמו ביניהם על הזמנה לשירותי תיווך, וכן חתמו על מסמך נפרד, שבו ניתנה למתווך בלעדיות לעניין מכירת הדירה. בהסכם הבלעדיות סוכם שהמתווך יפרסם את הדירה אך ורק בעיתון של מועדון גולף יוקרתי בחו\"ל, ללא כל פעולת שיווק נוספת. שמעון ביצע את הפרסום כאמור.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על שמעון לבצע שלוש פעולות שיווק לפחות.","על שמעון לבצע שתי פעולות שיווק לפחות.","על שמעון לבצע פעולת שיווק אחת נוספת.","שמעון אינו מחויב בפעולת שיווק נוספת מעבר לפרסום שביצע."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2021-07#7","e":30,"n":7,"s":"ירוחם מבקש להורות בצוואתו כי חברה בע\"מ תנהל את עזבונו.\nהאם הוא רשאי לעשות כן?","o":["לא, למנהל עיזבון ניתן למנות רק אדם.","לא, למנהל עיזבון ניתן למנות רק אדם או חברה ללא כוונת רווח.","לא, במקרה כזה האפוטרופוס הכללי ימונה למנהל העיזבון.","כן, ניתן למנות חברה בע\"מ כמנהלת עיזבון."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2021-07#8","e":30,"n":8,"s":"מהי \"פרטה\"?","o":["צו מינוי מנהל עיזבון הניתן ע\"י בית המשפט.","הזמנת נושים הנעשית ע\"י מנהל עיזבון.","דו\"ח שמוסר מנהל עיזבון לאפוטרופוס הכללי לעניין נכסי העיזבון וחובותיו.","סדר עדיפות החובות הנקבע ע\"י מנהל עיזבון."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2021-07#9","e":30,"n":9,"s":"יוני מונה ע\"י ההוצאה לפועל ככונס נכסים על חנות, לצורך מימושה. בהמשך התברר ליוני שכונסת נכסים אחרת מונתה לצורך מימוש אותה חנות בהליכים קודמים.\nכיצד על יוני לפעול?","o":["על יוני להפסיק את פעולותיו ככונס נכסים, משום שהמינוי המוקדם גובר על המאוחר.","המינוי המאוחר גובר על המוקדם, ולכן על יוני לפטר את כונסת הנכסים הקודמת.","על יוני להודיע על כך לרשם ההוצאה לפועל ולבקש הוראות.","שני כונסי הנכסים יכולים לפעול במקביל למימוש החנות, ולכן אין צורך בפעולה נוספת של יוני במצב כזה."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2021-07#10","e":30,"n":10,"s":"דוד הוא מתווך במקרקעין בעל משרד תיווך, המעסיק במשרדו 4 מתווכים. דוד מעוניין למכור את הדירה של הוריו באמצעות משרדו. דוד ביקש מיורם, אחד המתווכים במשרדו, לטפל בתיווך ובמכירת הדירה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["משרד התיווך של דוד אינו רשאי לתווך בעיסקת מקרקעין כשיש לו עניין אישי במקרקעין.","משרד התיווך של דוד רשאי לתווך בעיסקת מקרקעין, מכיוון שדוד אינו מטפל אישית בעיסקה.","יורם, המתווך מהמשרד של דוד, יכול לתווך בעיסקה - אך עליו לגלות ללקוח את עניינו האישי של דוד בנכס, ולקבל את הסכמת הלקוח לכך בכתב.","יורם, המתווך העובד במשרדו של דוד, אינו רשאי לתווך בעיסקה. זאת מאחר שלדוד, בעל משרד התיווך, יש עניין אישי בנכס."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2021-07#11","e":30,"n":11,"s":"למשפחת הלפרין חלקה בת 6 דונם בגבעת שמואל. הוועדה המקומית לתכנון ובנייה של גבעת שמואל החליטה להפקיע לצורכי ציבור 2.5 דונם מהחלקה לצורך סלילת כביש. בגין ההפקעה קיבלה משפחת הלפרין פיצוי בסך של 2 מיליון ש\"ח (שזהו השווי שנקבע לעניין הפיצויים בשל ההפקעה).\nמה יהא שווי המכירה של זכות המקרקעין שהופקעה לצורכי מס?","o":["הפקעה אינה נחשבת כזכות מקרקעין לצורכי מס. לכן לא ישולם מס בגין הפיצוי.","שווי המכירה של זכות המקרקעין שהופקעה לצורכי מס יהא מיליון ש\"ח, מחצית מהפיצוי שהתקבל.","שווי המכירה של זכות המקרקעין שהופקעה לצורכי מס יהא 2 מיליון ש\"ח.","שווי המכירה של זכות המקרקעין שהופקעה ייקבע לפי הערכת שמאי."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2021-07#12","e":30,"n":12,"s":"מני זכה במגרש לבניה למגורים בהרחבה ביישוב שבגליל המערבי מרשות מקרקעי ישראל (רמ\"י/מינהל מקרקעי ישראל). לאחר קבלת התוצאות בדבר זכייתו במגרש, קיבל הודעה כי עליו לחתום על חוזים עם רמ\"י למימוש זכייתו.\nבנסיבות העניין, על אילו חוזים נדרש מני לחתום? נא לסמן את התשובה הנכונה ביותר.","o":["על מני לחתום עם רמ\"י על חוזה פיתוח ובסיום הבנייה על חוזה חכירה.","על מני לחתום עם רמ\"י על הסכם רכישה ובסיום הבנייה על חוזה פיתוח.","על מני לחתום עם רמ\"י על חוזה רכישה ולאחר תשלום דמי הסכמה על חוזה חכירה.","על מני לחתום עם רמ\"י על חוזה פיתוח בלבד."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2021-07#13","e":30,"n":13,"s":"יעקב, בעל דירה, חתם על הסכם תיווך למכירת דירתו עם המתווך יצחק. המתווך יצחק לא החזיק ברישיון בתוקף במועד ביצוע העיסקה. המתווך ביצע באופן יעיל ובזריזות את עבודת התיווך והעיסקה יצאה לפועל. המתווך יצחק הגיש ליעקב דרישה לתשלום דמי תיווך, כפי שסוכם. יעקב סירב לשלם את דמי התיווך.\nבנסיבות העניין, ובהתאם לפס\"ד של ביהמ\"ש: ת\"א 50812/06 זילברברג מיכאל נ' סגל משה, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על יעקב לשלם את דמי התיווך למתווך שביצע את עבודתו באופן יעיל וכנדרש.","על יעקב לשלם את דמי התיווך למתווך שביצע את עבודתו, למרות היעדר רישיון תיווך בתוקף בתקופה הרלבנטית.","יעקב פטור מתשלום עמלת התיווך ליצחק, מכיוון שיצחק לא החזיק ברישיון בתוקף במועד העיסקה.","יעקב פטור מתשלום עמלת התיווך למתווך, משזה לא הראה נאמנות למוכר בעת עבודת התיווך."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2021-07#14","e":30,"n":14,"s":"בעלי דירה התקשרו עם מתווך בהסכם תיווך בבלעדיות. המתווך ביצע פעולות שיווק כדין, אך לבסוף, הדירה נמכרה בתקופת הבלעדיות רק בסיועו של מתווך אחר, וזאת שבועיים לפני תום הסכם הבלעדיות.\nלפי פסק הדין בעניין ת״א 44919/07 בכר עופר ואחרים נגד מעוז טל ואחרים, האם המתווך הראשון, שעימו נחתם הסכם בלעדיות בתוקף בזמן המכירה, זכאי לעמלת התיווך בבלעדיות - גם אם הדירה נמכרה על ידי מתווך אחר?","o":["לא. תמיד כאשר קיים הסכם בלעדיות והדירה נמכרת על ידי אחר, תהיה זכאות לדמי תיווך על ידי המתווך בעל הבלעדיות.","כן. קיימת חזקה שהמתווך הראשון שקיבל בלעדיות וביצע את פעולות השיווק הנדרשות נחשב ״הגורם היעיל״ במכירה ולכן הוא יהיה זכאי לדמי תיווך.","לא. לא סביר שהמוכר יצטרך לשלם דמי תיווך פעמיים.","לא. אם מתווך אחר הצליח למכור את הדירה בתקופת הבלעדיות, דמי התיווך מגיעים לו."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2021-07#15","e":30,"n":15,"s":"יקיר הינו מתווך מורשה ומנוסה. יקיר תיווך בעיסקה לרכישת דירה בקרית אונו. הצדדים לעיסקה, המוכר והקונה, פנו למתווך יקיר שיסייע להם לערוך זיכרון דברים, זאת בטרם חתימה על הסכם מכר. יקיר הודיע לצדדים כי אינו יכול לסייע להם בעריכת זיכרון דברים, והיפנה אותם לעורך דין לביצוע העיסקה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המתווך יקיר פעל כשורה ויהא זכאי לדמי תיווך, למרות שיכול היה למסור לצדדים נוסח סטנדרטי של זיכרון דברים.","המתווך יקיר פעל כשורה ויהא זכאי לדמי תיווך.","המתווך יקיר ביצע עבירת משמעת ע\"פ חוק המתווכים, ולכן לא יהא זכאי לקבל דמי תיווך.","המתווך יקיר לא זכאי לקבל דמי תיווך, מכיוון שמתווך לא יכול לקבל תמורה משני צדדים לעיסקה."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2021-07#16","e":30,"n":16,"s":"נעמה מכרה בית פרטי לאופירה. ביום שבו מכרה את הבית, שווי הנכס, לפי שמאות שנערכה, עמד על 4.2 מיליון ש\"ח.\nלאור עליית מחירי הנדל\"ן, עלה שווי הנכס ל- 5 מיליון ש\"ח, זאת לפי שמאות שנערכה במועד מסירת החזקה בנכס בפועל.\nלפי מה יחושבו מיסי המקרקעין?","o":["מיסי המקרקעין יחושבו לפי שווי הנכס ביום המסירה.","מיסי המקרקעין יחושבו לפי שווי הנכס ביום המכירה.","שווי הנכס ייקבע לפי שמאות ממשלתית אחרונה.","שווי הנכס ייקבע לפי שווי הנכס במועד השלמת העברת הבעלות לרוכשים."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2021-07#17","e":30,"n":17,"s":"קרן הינה מתווכת ותיקה. כתוצאה מלחץ רב ביצעה קרן עבירת משמעת. כתוצאה מכך הוגשה כנגד קרן קובלנה ובעקבות זאת החליטה ועדת המשמעת במשרד המשפטים להרשיע את קרן ולגזור עליה עונש משמעותי. קרן מעוניינת לערער על החלטת ועדת המשמעת.\nהיכן יש להגיש את הערעור ובתוך כמה זמן?","o":["לבית משפט שלום, בתוך 30 יום.","לוועדת הערעורים, בתוך 14 יום.","לרשם המתווכים, בתוך 20 יום.","לבית משפט מחוזי, בתוך 45 יום."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2021-07#18","e":30,"n":18,"s":"איזה מהמסמכים הבאים חייב קבלן שמוכר דירה חדשה לצרף לחוזה המכר?","o":["נסח טאבו.","נסח טאבו, תשריט, והוראות תחזוקה ושימוש.","מפרט והוראות תחזוקה ושימוש.","מפרט ותשריט."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2021-07#19","e":30,"n":19,"s":"היכן נעשה רישום זכויות הדיירים שרכשו דירות הנמצאות בתהליך בנייה?","o":["ברשות/מינהל מקרקעי ישראל (רמ\"י) ואצל רשם המקרקעין.","אצל רשם המקרקעין, ברשות/מינהל מקרקעי ישראל (רמ\"י
