ראשונה.","זכותו של יוסי עדיפה, אך אם איתמר בעל בתום לב ובתמורה והעיסקה נרשמה לטובתו - זכותו של איתמר עדיפה.","מספיק שאיתמר לא ידע על רכישת הדירה ע\"י יוסי כדי שזכותו תגבר."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2016-01#21","e":12,"n":21,"s":"טל טסה לחו\"ל לשבועיים ביום בו עזבה נכנס רועי לשטח הגינה שלה והשתלט עליה. מיד עם חזרתה הוציאה טל את רועי, תוך שימוש בכוח, מהמקרקעין שלה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["טל פעלה כדין, אך ורק בהנחה שעשתה שימוש בכוח סביר.","טל לא פעלה כדין, שכן היה עליה לפנות למשטרה.","טל לא פעלה כדין ; היה עליה לפנות לבית - המשפט בבקשה שייתן צו פינוי.","טל לא פעלה כדין ; היה עליה לפנות לעירייה בבקשה שיפנו את רועי."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2016-01#22","e":12,"n":22,"s":"שחר ואסף רכשו ביחד חנות רהיטים. במסגרת הסכם השיתוף, הם קבעו כי אף צד לא רשאי למכור את חלקו במקרקעין המשותפים בלי הסכמת השותף השני. לאחר 7 שנים שחר החליטה להעביר את חלקה לגל, בניגוד לעמדתו של אסף.\nבנסיבות העניין, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["שחר הפרה את ההסכם שנערך עם אסף, ולכן עליה לשלם לו פיצויים ולבטל את ההסכם שערכה עם גל.","שחר הפרה את ההסכם שנערך עם אסף, ולכן עליה לשלם פיצויים לאסף וגם לגל.","שחר לא הפרה את ההסכם שנערך עם אסף, שכן התנאי כוחו יפה לעד 5 שנים.","שחר לא הפרה את ההסכם שנערך עם אסף, שכן לא ניתן לקבוע מגבלה בהסכם שיתוף על אפשרות העברת חלקים במקרקעין משותפים."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2016-01#23","e":12,"n":23,"s":"בבית משותף בירושלים יש 6 דירות. במסגרת אסיפה כללית הוצא להתקין מעלית בבניין, מבירור שערכו הדיירים התברר כי ניתן להתקין את המעלית כך שלא תגרום לפגיעה מהותית בדירות האחרות, או בחלקם, ברכוש המשותף או בחזית הבית. 4 בעלי דירות הצביעו בעד התקנת המעלית ו-2 הצביעו נגד.\nבנסיבות העניין, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן להתקין את המעלית, שכן זוהי החלטה הדורשת הסכמה של כלל הדיירים.","לא ניתן להתקין את המעלית, שכן זוהי החלטה הדורשת הסכמה של כלל הדיירים, אולם ניתן לפנות לבית - המשפט בבקשה להכריע בנושא.","הסכמה של 4 בעלי דירות מתוך 6 מספיקה בכדי לקבל החלטה בנוגע להתקנת מעלית, והדיירים המתנגדים אינם יכולים לעשות דבר בנושא.","הסכמה של 4 בעלי דירות מתוך 6 מספיקה בכדי לקבל החלטה בנוגע להתקנת מעלית, אך הדיירים המתנגדים יכולים לפנות למפקח על הבתים המשותפים, אשר יכול, בין השאר, לבטל את ההחלטה, אם ימצא את התנגדותם של הדיירים מוצדקת."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2016-01#24","e":12,"n":24,"s":"איציק המתווך הורשע על ידי ועדת המשמעת על כי לא פעל בהגינות ובדרך מקובלת והוועדה גזרה עליו ביטול רישיון התיווך שלו. איציק המתווך החליט לערער. כיצד יכול איציק לערער על הפסיקה?","o":["איציק רשאי לערער בפני רשם המתווכים.","איציק רשאי לערער בפני בית משפט, בכפוף לכך שוועדת המשמעת החליטה לפרסם את החלטה לעיון הציבור באתר האינטרנט של משרד המשפטים.","איציק רשאי לערער בפני בית המשפט השלום, בכפוף לכך שהתובע הודיע למתלונן על החלטת ועדת המשמעת בקובלנה אם לא נכח בשעת מתן ההחלטה.","איציק רשאי לערער בפני בית המשפט המחוזי."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2016-01#25","e":12,"n":25,"s":"מהם \"דמי הסכמה\"?","o":["דמי הסכמה הינם תשלום אשר נערך בהסכמה בין צדדים לחוזה במקרקעין.","דמי הסכמה הינם תשלום אשר דורשת רשות מקרקעי ישראל (מינהל מקרקעי ישראל) מחוכר, כתנאי להסכמתו להעביר זכויות חכירה בנכס לצד ג'.","דמי הסכמה הינם תשלום לחברה המשכנת, המתחלק שווה בשווה בין הקונה ליזם כתנאי לקבלת הסכמת החברה להעברה של הזכויות בנכס לצד ג'.","דמי הסכמה הינם פיצויים אשר צדדים לחוזה מסכימים עליהם כפיצוי במקרה של הפרה."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2016-05#1","e":13,"n":1,"s":"שי פנה למשה המתווך וביקש ממנו למכור את הדירה שלו. שי מציג בפני משה בגאווה אישור כי הדירה רשומה בלשכת רישום המקרקעין וטוען כי עקב כך הוא אינו חייב בתשלום מס שבח בעת מכירת הדירה\n. בנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שי צודק; מאחר שהמקרקעין שלו רשומים בלשכת רישום המקרקעין אין הוא חייב בתשלום מס שבח בעת המכירה.","שי טועה; שי יצטרך לשלם מס שבח מופחת כי המקרקעין רשומים בלשכת רישום המקרקעין.","שי טועה; אין חשיבות לשאלה האם המקרקעין רשומים בלשכת רישום המקרקעין כאשר בודקים את נושא החיוב במס שבח.","שי צודק; על מנת שמקרקעין יהיו רשומים בלשכת רישום המקרקעין יש צורך לשלם עבורם מס שבח במועד הרישום ולכן אין צורך בתשלום מס שבח במועד המכירה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2016-05#2","e":13,"n":2,"s":"למי משלמים היטל השבחה?","o":["ללשכת רישום המקרקעין.","לוועדה המקומית.","לרשות המיסים.","למשרד הבינוי והשיכון."],"c":[1],"a":false,"note":"","sub":"p_levy"},{"id":"2016-05#3","e":13,"n":3,"s":"דני עיין בנוסח רישום המקרקעין לנכס שנבנה בשנת 1985 וחיפש אישור לגבי זכויות הבנייה בנכס. דני לא מצא אישור לקיומן של זכויות בנייה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן למצוא אישור לגבי קיומן של זכויות בנייה בנסח הרישום.","נסח רישום אמור לכלול אישור לגבי קיומן של זכויות בנייה ולכן אם דני לא מצא את האישור לזכויות הבנייה, הרי שאין לנכס זכויות בנייה.","רק נסח רישום של נכסים שנבנו לאחר שנת 1990 כולל את קיומן של זכויות בנייה.","אם זכויות הבנייה שייכות רק לדירה העליונה בנכס, אזי בנסח הרישום לא יהיה אישור לקיומן של זכויות הבנייה."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2016-05#4","e":13,"n":4,"s":"זהבה רצתה לרכוש דירה מגיא. זהבה קיבלה אישור זכויות מאת החברה המשכנת ביחס לדירה של גיא. זהבה ראתה כי לא רשום באישור הזכויות כי קיימת משכנתא על הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על זהבה לבדוק ברשם המשכונות אם קיים שיעבוד על הדירה.","אם באישור הזכויות לא רשומה משכנתא, ברור כי אין שיעבוד על הדירה.","לא ניתן לשעבד דירה הרשומה בחברה משכנת.","על זהבה לבדוק בבנקים למשכנתאות האם גיא קיבל אצלם משכנתא."],"c":[0],"a":false,"note":"","sub":"l_mortgage"},{"id":"2016-05#5","e":13,"n":5,"s":"שאול רוצה לקנות דירה במרכז תל אביב לשימוש כמשרד. המוכר אמר לו כי עליו להגיש בקשה לשימוש חורג על מנת שיוכל להשתמש בדירה כמשרד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על שאול לפנות לרשויות המס כדי שיכירו בדירה כמשרד.","על שאול לפנות לוועדה המחוזית על מנת שתתיר לו לעשות שימוש השונה מזה שנקבע בתוכנית החלה במקום או בהיתר הבנייה.","על שאול לפנות לוועדה המקומית על מנת שתתיר לו לעשות שימוש השונה מזה שנקבע בתוכנית החלה במקום או בהיתר הבנייה.","על שאול לפנות למשרד השיכון על מנת שיתיר לו לעשות שימוש השונה מזה שנקבע בתוכנית החלה במקום או בהיתר הבנייה."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2016-05#6","e":13,"n":6,"s":"שחר רכש לפני מספר שנים דירה וקיבל משכנתא בריבית נמוכה מאוד. כרגע רוצה שחר לרכוש במקומה דירה גדולה יותר ויקרה יותר, אך הוא חושש שיצטרך לפרוע את המשכנתא הטובה שיש לו ולקחת משכנתא בתנאים פחות טובים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שחר יכול לפנות לבנק ישראל על מנת שיאשר לו לקבל משכנתא חדשה בתנאים הקיימים.","כדי למכור דירה חייבים שהמשכנתא עליה תסולק לחלוטין ולכן שחר ייאלץ לפרוע את המשכנתא עם מכירת הדירה הישנה ולקחת משכנתא חדשה.","שחר יכול לבקש מהבנק לגרור את המשכנתא שלו לדירה החדשה באותם תנאים.","שחר לא יכול לגרור משכנתא קיימת לדירה חדשה באותם תנאים."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2016-05#7","e":13,"n":7,"s":"דני מעוניין לרכוש מגרש המיועד לבנייה בירושלים. דני בירר ומצא כי משה, המחזיק במגרש, חתום על חוזה פיתוח עם רשות מקרקעי ישראל בתוקף עד שנת 2018.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המשמעות של חוזה הפיתוח היא שמשה, המחזיק במגרש, זכאי להירשם כבעלים של זכות חכירה לדורות.","משה, המחזיק במגרש, יוכל למכור את המגרש לדני, אם ישלם דמי היתר.","המשמעות של חוזה הפיתוח היא שהמחזיק במגרש התחייב לסיים את הבנייה על הקרקע עד שנת 2018 ואז יוכל לחתום על הסכם חכירה עם רשות מקרקעי ישראל.","בכל מקרה משה לא יכול למכור את המגרש."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2016-05#8","e":13,"n":8,"s":"דינה וחיים נמצאים בהליכי גירושין. במסגרת הסכם הגירושין שלהם, אשר ניתן לו תוקף של פסק דין, דינה אמורה לקבל את חלקו של חיים בדירת המגורים שלהם, תמורת מיליון ש\"ח, ושוקלת לקחת משכנתא.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם דינה תיקח משכנתא לצורך התשלום לחיים, אזי חיים יצטרך לשלם מס שבח.","חיים לא יצטרך לשלם מס שבח, בין אם דינה אם תיקח משכנתא או לא.","אם דינה תיקח משכנתא לצורך התשלום לחיים, היא תצטרך לשלם מס רכישה.","אם דינה תצרף חוות דעת של שמאי, לפיה הדירה שווה פחות ממיליון וחצי ש\"ח, היא לא תצטרך לשלם מס רכישה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2016-05#9","e":13,"n":9,"s":"זאב המתווך מעוניין למכור את דירת המגורים שלו. יובל, שהוא יזם בחברת היי טק, פנה לזאב והציע לרכוש את דירת המגורים שלו.\nבנסיבות העניין, האם העיסקה חייבת בתשלום מס ערך מוסף?","o":["מאחר שזאב הוא מתווך, יחול מס ערך מוסף על העיסקה.","יובל יהיה חייב לשלם מס ערך מוסף על רכישת הדירה, מאחר שהוא יזם היי טק.","העיסקה פטורה ממס ערך מוסף.","אם הדירה הייתה מושכרת יותר מארבע שנים, לא יהיה פטור ממס ערך מוסף."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2016-05#10","e":13,"n":10,"s":"משה המתווך שכר דירה מאלעד והוא חייב לאלעד 5,000 ש\"ח עבור שכר דירה. אלעד שכר את שירותיו של משה לצורך מציאת דירה להשקעה. משה מצא עבור אלעד דירה להשקעה, וכעת חייב אלעד למשה סך של 9,000 ש\"ח עבור דמי תיווך. אלעד מסרב לשלם למשה את מלוא דמי התיווך ודורש ממנו לשלם את שכר הדירה, אחרת הוא ידרוש את פינויו מהדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רק אחרי שאלעד ישלם למשה את דמי התיווך יצטרך משה לשלם לו את שכר הדירה ולמשה אסור לקזז את שכר הדירה מדמי תיווך.","משה זכאי לקזז את החוב שלו לשכר דירה מדמי התיווך, להם הוא זכאי, ולדרוש רק את היתרה בסך של 4,000 ש\"ח.","משה לא זכאי לקזז את החוב שלו לשכר הדירה מדמי התיווך ולכן הוא חייב לשלם את שכר הדירה והוא יכול לתבוע את אלעד עבור דמי התיווך.","מאחר שמשה שוכר דירה מאלעד, הוא לא רשאי בכל מקרה לתת לו שירותי תיווך ולכן אינו זכאי לתשלום דמי תיווך."],"c":[2],"a":false,"note":"","sub":"r_rent"},{"id":"2016-05#11","e":13,"n":11,"s":"שוקי רכש דירה מאילנה ובהתאם להסכם המכר צריך היה לשלם סכום של מיליון ש\"ח תמורת הדירה. בשיחת טלפון שניהל עם אילנה, אמרה לו שהיא מתחרטת על העיסקה בגלל שמחירי הדירות עלו מאוד ואין בכוונתה למסור לו את הדירה. אילנה מעוניינת לבטל את העיסקה ולשלם לשוקי את הפיצוי המוסכם שנרשם בהסכם. בהסכם מופיע סעיף הקובע כי: \"צד שיפר את ההסכם ישלם לצד השני פיצוי מוסכם של 10% מסכום התמורה והצדדים רואים בסכום זה כסכום סביר בנסיבות העיסקה\".\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שוקי רשאי לפנות לבית המשפט ולתבוע מאילנה שתקיים את העיסקה, ובנוסף הוא זכאי לתבוע מאילנה פיצויים.","שוקי יכול לדרוש את הפיצוי המוסכם רק אם יסכים לביטול ההסכם.","שוקי רשאי לפנות לבית המשפט ולתבוע סעד אחד מבין שניים: אכיפת ההסכם או קבלת הפיצוי המוסכם- לא ניתן לתבוע גם אכיפה וגם פיצוי מוסכם.","שוקי לא זכאי לתבוע מאילנה מאומה, מכיוון שהיא ממילא הציעה לו לקבל את הפיצוי המוסכם וזה הדבר היחיד שהוא זכאי לבקש."],"c":[1],"a":false,"note":"","sub":"c_remedy"},{"id":"2016-05#12","e":13,"n":12,"s":"נועה מעוניינת לרכוש מעקיבא את דירת מגוריו. עקיבא נעזר במתווך נמרץ בשם דוד, אשר קידם את ההליכים למכירה. מכיוון שלא הייתה הסכמה על המחיר, הוחלט להתייעץ עם שמאי מקרקעין. לאחר שקיבלו את חוות דעתו, הסכימו הצדדים על מחיר קרוב להמלצת השמאי. במשך כל המשא ומתן נועה שמה לב שעקיבא מתנהל בצורה מעט מוזרה; עקיבא עצוב ואינו מרבה לחייך. כשהגיע זמן מסירת החזקה בדירה נדהמה נועה לקבל הודעה על ביטול ההסכם מעורך דין ששכר עקיבא. עורך הדין טען בשם עקיבא כי עקיבא היה בדיכאון בשל פטירתה של אמו ובכלל לא התכוון למכור את הדירה, ולכן העיסקה היא בבחינת ניצול מצוקתו הזמנית והוא זכאי לבטל את העיסקה בטענה של עושק.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההתנהלות של עקיבא מעידה על חוסר גמירות דעת, ולכן אין תוקף להסכם.","רק אם מחיר הדירה נמוך ביותר מעשרים אחוז מחוות הדעת של השמאי אפשר יהיה לבטל את ההסכם.","אין אפשרות לבטל את ההסכם בנסיבות המפורטות.","אין אפשרות לבטל הסכם במקרקעין שנערך בכתב לאחר חתימתו."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2016-05#13","e":13,"n":13,"s":"יוני מנסה למכור את הדירה שלו במשך מספר חודשים. יוני רוצה לטוס לטיול בן 3 חודשים, אך חושש כי במהלך שהותו בחופשה הוא יחמיץ קונה אשר ירצה לקנות את הדירה.יוני מעוניין להשאיר ייפוי כוח לאחיו, שיאפשר לאחיו לחתום בשמו על חוזה מכירה בתקופת שהותו בחו\"ל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מתן ייפוי הכוח עלול לחייב את יוני בתשלום מס שבח.","מתן ייפוי הכוח יחייב את יוני בתשלום מס שבח מופחת של מחצית מהמס הרגיל.","מתן ייפוי הכוח פטור ממס שבח.","מתן ייפוי הכוח יחוייב במס מאחר שהאח של יוני הוא לא עורך דין."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2016-05#14","e":13,"n":14,"s":"שולה רוצה לרכוש דירה מקבלן. נציג המכירות של הקבלן אמר לשולה כי בנק לאומי נותן \"ליווי פיננסי\" לפרוייקט.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם שולה תרצה לרכוש דירה מהקבלן, היא תהיה חייבת לקחת משכנתא מבנק לאומי.","לא ניתן לקחת משכנתא לרכישת דירה מקבלן אם יש לו ליווי פיננסי.","אין חובה לקחת משכנתא דווקא מהבנק המלווה לצורך רכישת דירה מהקבלן.","יהיה אפשר לקבל משכנתא מבנק אחר רק אם בנק לאומי יסכים להעמיד ערבות בנקאית לצורך קבלת המשכנתא."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2016-05#15","e":13,"n":15,"s":"ליאור חתם על הסכם לרכישת דירה מקבלן. בהסכם רשום כי על אף האמור בהוראות החוק, הרי שהקונה מסכים לשלם 20% מהתמורה ללא קבלת ערבות בנקאית, וזאת תמורת הנחה בשיעור של 20,000 ש\"ח ממחיר הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין לקונה כל בעיה להסכים על ויתור לקבלת ערבות בנקאית.","אין כל תוקף להסכמה לוותר על ערבות בנקאית, גם אם הצדדים הסכימו על כך בהסכם המכר.","אם החוזה נחתם בנוכחות עורך דין, הויתור על הערבות תקף.","אין כל בעיה להסכים על ויתור על ערבות בנקאית, ובלבד ששיעור ההנחה לא יעלה על 7% ממחיר הדירה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2016-05#16","e":13,"n":16,"s":"רינה היא מתווכת בעלת רישיון. תרצה, שכנה של רינה, ביקשה מרינה כי היא תאתר עבורה קונה לדירתה תמורת 2 מיליון ש\"ח.לאור יחסי החברות ביניהן, הן הסכימו שרינה לא תקבל דמי תיווך מתרצה.\nרינה איתרה קונה, אשר היה מוכן לשלם 2.1 מיליון ש\"ח עבור הדירה. רינה אמרה לקונה כי הוא ישלם לתרצה סך של 2 מיליון ש\"ח ואת היתרה בסך 100,000 ש\"ח הוא ישלם לה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שתרצה לא משלמת לרינה המתווכת דמי תיווך, אז אין כל בעיה עם ההתנהגות של רינה.","אסור לרינה לנהוג בצורה המתוארת.","מותר למתווך לגבות מהקונה דמי תיווך ואין למוכר זכות להתערב בעניין.","אסור למתווך לקחת מקונה דמי תיווך בשיעור הגבוה מ- 2% + מע\"מ."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2016-05#17","e":13,"n":17,"s":"שי ורוני חתמו על זכרון דברים למכירת הדירה של רוני. בנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכרון דברים לא מחייב את הצדדים המידה ולא נחתם חוזה מחייב בפני עורך דין בתוך 7 ימים מהמועד שחתמו על זכרון הדברים.","זכרון הדברים מחייב את הצדדים אם נערך בנוכחות עורך דין.","זכרון הדברים מחייב את הצדדים כמו כל חוזה, אם הוא כולל את הפרטים המהותיים והחיוניים של העיסקה.","זכרון הדברים לא מחייב את הצדדים אם נערך בנוכחות מתווך."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2016-05#18","e":13,"n":18,"s":"שי פנה לקבלן הבונה כרגע דירות בפתח תקווה, הקבלן הציע לשי להשכיר לו דירה בפרוייקט למשך 30 שנה תמורת מיליון ש\"ח. הקבלן טוען כי מאחר שמדובר בשכירת דירה, אז הוא לא צריך לתת בטוחה לשי עבור מיליון השקלים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין צורך בהעמדת ערבות בנקאית כבטוחה תמורת התשלום, מאחר שמדובר בשכירות של דירה מקבלן ולא בקנייה של דירה.","כאשר שוכרים דירה מקבלן חייבים בכל מקרה לקבל כבטוחה ערבות בנקאית.","הקבלן חייב לתת בטוחה לכסף ששי ישלם לו, כאשר אחת הבטוחות האפשריות היא ערבות בנקאית.","אסור לקבלן להשכיר דירה לתקופה כלכך ארוכה ולכן העיסקה היא לא חוקית."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2016-05#19","e":13,"n":19,"s":"מה המשמעות לעניין מס שבח כשצדדים לעיסקה קובעים כי המוכר יקבל לידיו סכום של 2,000,000 ש\"ח \"נטו\", כלומר שהמס של המוכר, ככל שיהיה, יחול על הקונה?","o":["במקרה כזה איו חיוב במס שבח, מכיוון שהנכס נמכר במחיר \"נטו\" שהוא נמוך מהמחיר \"ברוטו\".","במקרה כזה רשות המיסים חייבת לבצע \"גילום מלא\", כלומר הוספת המס המגולם למחיר העיסקה.","רשות המיסים רשאית לקבוע את שווי המכירה בדרך של \"גילום מלא\".","המוכר חייב לשלם מס שבח תמיד. במקרה כזה הוא ישלם את המס מתוך הסכום נטו שיקבל."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2016-05#20","e":13,"n":20,"s":"רמי רוצה לרכוש דירה מהקבלן \"שלמה ובניו\" לכניסה מיידית. הקבלן הציע לרמי לשעבד את הדירה בשיעבוד ראשון לטובת רמי בלשכת רישום המקרקעין, אשר תהיה לה עדיפות על כל רישום אחר שיהיה בלשכת רישום המקרקעין. רמי רוצה לקבל ערבות בנקאית מהקבלן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור לקבלן להציע את שיעבוד הדירה כבטוחה לקונה.","הבחירה בין הבטוחות שמציע הקבלן היא אך ורק של הקונה ואסור לקבלן לקבוע מראש איזו בטוחה הוא נותן.","מותר לקבלן להציע שיעבוד הדירה כבטוחה לקונה.","קבלן יכול להציע אך ורק ערבות בנקאית כבטוחה לקונה דירה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2016-05#21","e":13,"n":21,"s":"דליה היא הבעלים של עשירית דירה בחולון. אין לדליה עוד זכויות בנדל\"ן. כיום רוצה דליה לרכוש דירה בקבוצת רכישה והיא לא יודעת איזה מס רכישה היא תצטרך לשלם עבור רכישת הדירה החדשה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דליה לא תשלם מס רכישה, מאחר שהיא רוכשת דירה בקבוצת רכישה.","דליה תשלם מס רכישה לפי חישוב של דירה יחידה.","דליה תשלם מס רכישה מופחת בשיעור של שליש ממס רכישה רגיל.","דליה תשלם מס רכישה לפי חישוב של דירה של דירה שנייה."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2016-05#22","e":13,"n":22,"s":"מוטי הוא הבעלים של מגרש ברחובות, הרשום בלשכת רישום המקרקעין. בלשכת רישום המקרקעין רשומה זכות קדימה על המגרש לטובת דינה. שלומי מעוניין לרכוש את המגרש תמורת סך של מיליון ש\"ח. מוטי שלח מכתב בדואר רשום לדינה עם ההצעה של שלומי לרכישת המגרש.\nבנסיבות העניין איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן לרכוש מגרש אשר רשומה עליו זכות קדימה.","רק אם דינה תסרב לרכוש את המגרש תמורת סכום של מיליון ש\"ח, יוכל שלומי לרכוש את המגרש, אבל רק לאחר 14 יום מיום הסירוב של דינה.","לדינה יש זכות לרכוש את המגרש במחיר הנמוך ממיליון ש\"ח שהציע שלומי, מאחר שרשומה לטובתה זכות קדימה.","אם דינה תסרב לרכוש את המגרש בסכום שהוצע, יוכל שלומי לרכוש את המגרש."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2016-05#23","e":13,"n":23,"s":"ענבל היא הבעלים של קרקע בתל אביב, הרשומה בלשכת רישום המקרקעין (טאבו). על הקרקע רשומה זיקת הנאה לטובת מלכה, המאפשרת לה זכות מעבר בקרקע. מאחר שהמדובר בקרקע בשטח גדול, מלכה רוצה להתקין ספסל באמצע הדרך, כדי שתוכל לנוח כאשר היא עוברת בקרקע. ענבל מתנגדת לבקשתה של מלכה.\nבנסיבות העניין איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ענבל היא הבעלים של הקרקע ותמיד רצונו של הבעלים גובר על רצונו של מי שרשומה זיקת הנאה לטובתו.","ענבל צודקת, מאחר שזיקת הנאה אינה מאפשרת למלכה להחזיק בקרקע.","מלכה צודקת, מאחר שזיקת הנאה נועדה לאפשר לה לבנות בקרקע כדי לממש את זכות המעבר שלה.","מלכה צודקת, מאר שרצונו של בעל זיקת ההנאה גובר תמיד על רצון הבעלים של הקרקע."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2016-05#24","e":13,"n":24,"s":"רונית שכרה דירה מאופיר לתקופה של שנתיים. כעבור שנתיים, אם סיום החוזה, סירבה רונית לפנות את הדירה והמשיכה לגור בה. אופיר הודיע לה שהוא מתכוון לפנות אותו בכוח מן הדירה ולסלק משם את חפציה.\nבנסיבות העניין איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מדובר בקניין של אופיר, ובכלוף תקופת השכירות זכותו לפנות את רונית תוך שימוש בכוח.","בישראל אסור לפנות משיגי גבול בכוח.","רונית נכנסה לדירה בהסכמה ולכן אופיר אינו רשאי לפנותה מהדירה בכוח.","אופיר הוא הבעלים של המקרקעין ולכן זכותו לפנות את רונית בכוח, אך רונית תוכל לתבוע אותו על נזקיה."],"c":[2],"a":false,"note":"","sub":"r_rent"},{"id":"2016-05#25","e":13,"n":25,"s":"דני שומר שבת. דני רכש דירה בבניין רב קומות, והוא מעוניין להתקין בחדר המדרגות מנגנון המאפשר הפעלה אוטומטית של תאורה בלא חילול שבת, על חשבונו.\nבנסיבות העניין, איזה רוב מהדיירים צריך להסכים להתקנת המנגנון?","o":["רוב רגיל של יותר ממחצית הדיירים.","רוב של לפחות שני שליש מהדיירים.","אין צורך בהסכמה של אף אחד מהדיירים לבקשתו של דני.","חייבים הסכמה של כל הדיירים."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2016-08#1","e":14,"n":1,"s":"אביב הוא דייר מוגן. אביב נפטר ונעמי, שהייתה ידועתו בציבור מזה 8 חודשים, גרה בדירה בכל אותם חודשים. כעת בעל הדירה מבקש מנעמי לפנות את הדירה, אך היא מסרבת בטענה שהיא הפכה כעת להיות דיירת מוגנת בדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["נעמי טועה, היא ואביב לא היו נשואים ולכן אינם נחשבים 'בני-זוג'.","נעמי טועה, כדי שתהא זכאית להיות דיירת מוגנת בדירה, היה עליה להיות ידועה בציבור של אביב למשך 9 חודשים לפחות.","לא ניתן לדעת, השאלה האם נעמי טועה או צודקת תלויה רק בנוסח החוזה שנערך בין אביב לבעל הדירה.","נעמי צודקת, מכוח החוק, בנסיבות המתוארות היא הפכה להיות דיירת מוגנת."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2016-08#2","e":14,"n":2,"s":"שילה היא מתווכת אשר עברה עבירת משמעת, ולכן הוחלט להעמידה בפני ועדת המשמעת.אחד מחברי הוועדה הוא פרנק. פרנק ושילה היו בעבר בעלי משרד תיווך משותף, אך סכסוך חריף בין השניים הביא את הקשר לסיומו.3 חודשים לאחר תחילת הדיון החליטה שילה לבקש את פסילתו של פרנק, במטרה לנקום בו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["פרנק ושילה מסוכסכים ויש חשש ממשי למשוא פנים בבירור הקובלנה, על כן פרנק אינו יכול לשמש כחבר ועדת המשמעת בעניינה של שילה.","אמנם יש חשש ממשי למשוא פנים בבירור הקובלנה, אך שילה ידעה על חשש זה כבר בתחילת הדיון והיה עליה לטעון לפסילתו של פרנק כבר במועד זה.","לא ניתן לבקש פסילה של חבר ועדת המשמעת אלא בהסכמת התובע.","ניתן לפסול חבר מדיון בוועדת המשמעת רק בהסכמתו."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2016-08#3","e":14,"n":3,"s":"מה מהבאים מתאר בצורה הנכונה ביותר \"הפרה יסודית\" של חוזה?","o":["כל מעשה או מחדל בניגוד לחוזה.","אי-ביצוע של תשלום.","הפרה שניתן להניח לגביה שאדם סביר לא היה מתקשר באותו חוזה לו ראה מראש את ההפרה ותוצאותיה, או כזו שהוסכם עליה בחוזה שתיחשב ליסודית.","כל מעשה או מחדל שהוסכם עליהם בחוזה כי הפרתם תגרור פיצויים מוסכמים."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2016-08#4","e":14,"n":4,"s":"ליאם הגר כיום בשכירות, קנה משכנתו הקשישה דירה, לאחר שסיפרה לו כי עם פטירתו של בעלה היא מעוניינת במכירת הדירה כדי לעבור לדיור מוגן. ליאם הסתמך על נסח הטאבו של הדירה, בו שכנתו רשומה כבעלים. בהמשך התגלה לליאם כי הרישום בפנקסי המקרקעין היה שגוי וכי שכנתו אינה הבעלים של הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם המקרקעין אינם מוסדרים, לליאם זכות הבעלות בדירה.","אם המקרקעין מוסדרים, לליאם זכות הבעלות בדירה.","אין זה משנה לעניינו האם המקרקעין מוסדרים או לא, כל עוד רכישת הדירה נעשתה בתמורה ובתום לה, לליאם זכות הבעלות באותה דירה.","אין זה משנה לענייננו אם המקרקעין מוסדרים או לא, מכיוון שהרישום בפנקסי המקרקעין נמצא שגוי, רכישתו של ליאם את הדירה מתבטלת."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2016-08#5","e":14,"n":5,"s":"איזה מבין המשפטים הבאים מתאר בצורה הנכונה ביותר את המונח \"תוכנית החיזוק\"?","o":["תוכנית שמטרתה לבצע רפורמה בחוק המכר (דירות), כך שלקונים יהיה כוח חזק יותר אל מול הקבלנים החזקים.","תוכנית שמטרתה חיזוק היסודות של מבנים ישנים.","תוכנית שמטרתה בניית מבנים חדשים עם יסודות בנייה חזקים יותר.","תוכנית מיתאר ארצית לחיזוק מבנים קיימים מפני רעידות אדמה."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2016-08#6","e":14,"n":6,"s":"אלימלך הינו קבלן אשר בנה בניין מגורים חדש. בחוזה המכר קיים סעיף הקובע כי הניהול וההחזקה התקינה של הרכוש המשותף יתבצעו על ידי חברת התחזוקה 'ב.ה.ר' , לתקופה של 24 חודשים, ואין אפשרות לסיים את ההתקשרות עם חברת 'ב.ה.ר' קודם לכן. חוזה התחזוקה צורף כנספח לחוזה המכר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["סעיף זה בטל, שכן הוא מהווה תנאי מקפח בחוזה אחיד.","סעיף זה בטל, שכן רק בעלי הדירות בבית המשותף יכולים להחליט על חברת הניהול וההחזקה.","סעיף זה תקף, אולם רק בהנחה שאלימלך יוכיח כי בחירתו בחברת 'ב.ה.ר' הינה סבירה בנסיבות העניין.","סעיף זה תקף, שכן מדובר בתקופה שאינה עולה על 3 שנים."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2016-08#7","e":14,"n":7,"s":"יורי רכש דירה מחברת הקבלנים \"רופין\". \"רופין\" דרשה מיורי לשלם לה 9% ממחיר הדירה כתשלום ראשון.\nבאיזה מהמקרים הבאים דרישתה תהיה בניגוד לחוק?","o":["בחוזה לא נקבעו ביטחונות או ערבויות לטובת יורי.","\"רופין\" מסרה ליורי ערבות בנקאית להבטחת החזרתם של כל הכספים ששילם לה.","\"רופין\" ביטחה את עצמה אצל מבטח להטחת החזרתם של כל הכספים שיורי שילם לה, ויורי צוין כמוטב על-פי פוליסת הביטוח ודמי הביטוח שולמו מראש.","\"רופין\" רשמה לגבי הדירה הערת אזהרה על מכירת הדירה."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2016-08#8","e":14,"n":8,"s":"לקרן היו מקרקעין במודיעין בבעלותה, אשר הופקעו ללא מתן פיצויים מכוח חוק התכנון והבנייה.בהמשך, יעודם של המקרקעין שונה לייעוד שעבורו אין להפקיע מקרקעין ללא מתן פיצויים.\nהאם קרן זכאית לקבל פיצויים? אם כן, מטעם מי?","o":["כן. מטעם הוועדה המקומית.","כן. מטעם הוועדה המחוזית.","כן. מטעם עיריית מודיעין.","לא."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2016-08#9","e":14,"n":9,"s":"בתאריך 6 במאי 2013 רכש יובל את דירתו הראשונה והיחידה בסכום של 1,300,000 ש\"ח.\nמה היה שיעור מס הרכישה ששילם?","o":["על חלק השווי שעד 1,089,350 ש\"ח -5% , על חלק השווי העולה על 1,089,350 ש\"ח ועד 3,268,040 ש\"ח -6%.","יובל לא שילם מס רכישה כלל.","על חלק השווי שעד 1,139,320 ש\"ח - לא שולם מס, על חלק השווי העולה על 1,139,320 ש\"ח ועד 1,601,210 ש\"ח -3.5%.","על חלק השווי שעד 1,470,560 ש\"ח 5%."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2016-08#10","e":14,"n":10,"s":"מיקי קיבל בדואר רשום הודעת עיקול על דירת מגוריו מלשכת ההוצאה לפועל, מכיוון שלא שילם חוב.לאחר 10 ימים מיום המצאת ההודעה, ובטרם מיקי שילם את החוב, הגיע לדירתו שמאי מקרקעין מוסמך כדי לערוך שומת מקרקעין.מיקי סירב להכניס את השמאי לדירתו וטען כי הוא מסיג גבול.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מיקי צדק; שמאי מקרקעין מוסמך רשאי להיכנס לדירה כדי לערוך שומת מקרקעין רק לאחר 30 יום מיום המצאת ההודעה.","מיקי טעה; בנסיבות העניין רשאי שמאי מקרקעין מוסמך להיכנס לדירה כדי לערוך שומת מקרקעין.","מיקי צדק; שמאי מקרקעין מוסמך רשאי להיכנס לדירה כדי לערוך שומת מקרקעין רק בהינתן צו בית-משפט המאפשר זאת.","מיקי טעה; מרגע הטלת צו עיקול, רשאי שמאי מקרקעין מוסמך להיכנס לדירה כדי לערוך שומת מקרקעין."],"c":[1],"a":false,"note":"","sub":"k_misc"},{"id":"2016-08#11","e":14,"n":11,"s":"מהם \" דמי היוון\" ?","o":["תשלום אותו גובה מינהל מקרקעי ישראל (רשות מקרקעי ישראל) מהחוכר כתנאי למתן הסכמתו לפיצול החלקה.","חישוב הערך הכלכלי של התשלומים העתידיים למינהל מקרקעי ישראל ( רשות מקרקעי ישראל) עבור תקופת החכירה או יתרתה בתשלום חד-פעמי מראש.","דרישת תשלום אשר דורש מינהל מקרקעי ישראל (רשות מקרקעי ישראל) מהחוכר, כתנאי למתן הסכמתו להחרבת הבנייה הקיימת בנכס.","תשלום אותו גובה מינהל מקרקעי ישראל (רשות מקרקעי ישראל) מהחוכר בגין שינוי יעוד הנכס."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2016-08#12","e":14,"n":12,"s":"במשך 36 שנה, עובר יהודה עם רכבו במגרשו של יואב כדי להגיע לביתו, בהיעדר דרך אחרת.יואב מכר את מגרשו לרחל. רחל אמרה ליהודה כי הוא אינו יכול עוד להמשיך לעבור עם רכבו בשטחה.\nהאם ליהודה קיימת זכות מעבר בשטח המגרש, למרות מכירת המגרש לרחל? מדוע?","o":["לא, הואיל וניתן לראות את הנוהג בין יהודה ליואב כחוזה לרעת צד שלישי ולכן הוא בטל.","לא, הואיל ויהודה יודע כי רחל מתנגדת לכך.","כן, כי הזכות הראויה להוות זיקת הנאה.","כן אך בכפוף לכך שישלם פיצוי לרחל."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2016-08#13","e":14,"n":13,"s":"אביב ושירלי כרתו ביניהם חוזה. שירלי הפרה את החוזה הפרה לא-יסודית. כעת מבקש אביב את ביטול החוזה לאלתר ואילו שירלי מבקשת אורכה קצרה נוספת לצורך תיקון ההפרה של החוזה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אביב זכאי לבטל את החוזה, שירלי הפרה את החוזה ולכן אינה זכאית לקבל אורכה של מספר ימים לצורך קיומו.","אביב דרש לתת לשירלי אורכה לקיים את החוזה. אם לא יקויים החוזה תוך זמן סביר יהיה אביב זכאי לבטל את החוזה.","אביב זכאי לבטל את החוזה, אך עליו לפצות את שירלי על הנזקים שנגרמו לה בשל כך.","לא ניתן בשום מקרה לבטל חוזה כאשר ההפרה אינה הפרה יסודית - לכל היותר ניתן לתבוע פיצויים."],"c":[1],"a":false,"note":"","sub":"c_remedy"},{"id":"2016-08#14","e":14,"n":14,"s":"עליזה חתמה עם משה המתווך על טופס הזמנת שירותי תיווך בנוסח הסטנדרטי הנהוג בחברת התיווך \"איבלי\" שבה עובד משה.לאחר שרכשה את הדירה, טוענת עליזה כי משה היטעה אותה ביודעין לגבי הנכס שרכשה וכי נגרם לה נזק בשל כך.\nבטופס הזמנת שירותי התיווך קיים סעיף האוסר עליה לפנות לבית המשפט.\nבפני מי רשאית עליזה להעלות את טענותיה בקשר להטעיה?","o":["עליזה אינה יכולה לפנות לבית המשפט, אך היא יכולה להגיש תלונה לוועדת המשמעת.","עליזה אינה יכולה לפנות לבית המשפט ואינה רשאית גם להגיש תלונה לוועדת המשמעת ולרשם המתווכים.","עליזה אינה יכולה לפנות לבית המשפט, אך היא יכולה לפנות בתלונה אל רשם המתווכים.","עליזה יכולה לפנות לבית המשפט ואף יכולה לפנות לוועדת המשמעת בתלונה."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2016-08#15","e":14,"n":15,"s":"אסף הוא דייר מוגן בדירת מגורים. כעת הוא מעוניין לצאת מהדירה ומציע במקומו דייר חלופי- חברת \"קומרקין\" בע\"מ. בעל הדירה אינו מעוניין בחילוף זה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בעל הדירה יכול לטעון כי אין הוא מעוניין להשכיר את דירתו לחברה בע\"מ.","בעל הדירה אינו יכול למנוע את החילוף בכל מקרה.","בעל הדירה יכול למנוע את החילוף ואינו נדרש לנמק מדוע.","בעל הדירה אינו יכול למנוע את החילוף, אלא באישור המפקח על הבתים המשותפים."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2016-08#16","e":14,"n":16,"s":"לברכה ולמשה בעלות משותפת על מקרקעין בזיכרון יעקב.השניים ערכו הסכם לפירוק שיתוף ביניהם וקבעו כי חלוקת המקרקעין תהא בעין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההסכם אינו תקף, לא ניתן לעשות חלוקה בעין של מקרקעין.","ההסכם תקף, אולם רק אם ההסכם אושר על ידי המפקח.","ההסכם תקף, לצדדים יש חופש לקבוע את נוסחו של הסכם פירוק השיתוף בהתאם לרצונם.","ההסכם אינו תקף, אך ניתן לפנות לוועדה המקומית ולבקש אישור חריג."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2016-08#17","e":14,"n":17,"s":"אחרי החורף האחרון החליט צפריר כי נמאס לו לתקן את הנזילות החוזרות בגלל בכל שנה, והוא מעדיף למכור את דירתו ולעבור לדירה בבניין חדש.משכך פנה לדניאלה המתווכת בבקשה שתסייע לו במכירת דירתו והסביר את הסיבה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המתווכת חייבת לגלות לקונים הפוטנציאליים את בעיית הנזילות בגג, אולם רק במידה ותישאל על כך במישרין.","המתווכת חייבת לגלות א בעיית הנזילות בגג לכל קונה אפשרי, מאחר שמדובר בעניין מהותי.","למתווכת אסור לגלות את המידע, שכן זהו מידע שהובא לידיעת המתווכת על ידי המוכר ואסור לגלותו שלא בהסכמתו.","אין על המתווכת חובה לגלות או לא לגלות את המידע, שכן חובת בגילוי חלה על המוכר."],"c":[1],"a":false,"note":"","sub":"b_duties"},{"id":"2016-08#18","e":14,"n":18,"s":"אגב הליכי הגירושין של אהוד ואלונה, פסק בית המשפט כי על אהוד להעביר את הדירה לאלונה.\nהאם על אלונה לשלם מס רכישה בעת העברת הדירה על שמה?","o":["כן, הואיל והעברה אגב גירושין היא כפעולת מכירת זכות במקרקעין החייבת במס.","כן, הואיל ובכל מצב של שינוי בעלות במקרקעין לטובת אדם אחר, על אותו אדם לשלם מס רכישה.","לא, הואיל והעברה אגב גירושין היא לא פעולת מכירה החייבת במס.","לא, הואיל ובכל מקרה של העברה בין בני-זוג אין מדובר בפעולת מכירה החייבת במס."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2016-08#19","e":14,"n":19,"s":"איתמר החליט למכור את מגוריו בכפר הדר. בתאריך 20.3.2015 הוא פנה לרחל המתווכת ואף חתם על הזמנה בכתב לקבלת שירותי תיווך ובמסמך נפרד חתם על כך כי הוא נותן את העסקה לטיפולה הבלעדי של רחל.בתחילת חודש אוקטובר 2015, לאחר שביתו טרם נמכר, איתמר החליט לפנות למתווך נוסף, מתוך תקווה שהדבר יזרז את המכירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בהנחה שבהסכם לא נקבעה תקופת הבלעדיות , איתמר פעל בניגוד לחוק, שכן היה עליו להמתין 9 חודשים מיום ההזמנה.","לא ניתן לדעת האם איתמר רשאי היה לפנות למתווך נוסף, שכן לא ידועה משך תקופת הבלעדיות אשר ניתנה למתווכת רחל בהסכם הבלעדיות.","אין זה משנה אם בהסכם נקבעה או לא נקבעה תקופת הבלעדיות, שכן עברו יותר מ-6 חודשים מיום ההזמנה.","בהנחה שבהסכם לא צוינה תקופת הבלעדיות, על איתר לקבל את הסכמת רחל המתווכת לפנות למתווך נוסף."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2016-08#20","e":14,"n":20,"s":"רום קיבל רישיון תיווך כדין. תקופה קצרה לאחר מכן הוא פשט את הרגל. לפיכך החליט רשם המתווכים לבטל את רישיונו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם טרם הביטול נתן הרשם לרום הזדמנות להשמיע את טענותיו ונועץ בוועדה המייעצת - הרשם פעל כדין.","אך ורק אם קיבל הרשם אישור לביטול רישיונו של רום מטעם בית המשפט - הרשם פעל כדין.","הרשם פעל שלא כדין, אמנם הוא רשאי לבטל את רישיונו, אך אם רום הורשע בנוסף בעבירה פלילית שיש עימה קלון.","הרשם פעל שלא כדין, אמנם הוא רשאי לבטל את רישיונו, אך היה עליו לתת לרום תקופה של 3 חודשים לביטול הליכי פשיטת רגל טרם ביטול הרישיון."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2016-08#21","e":14,"n":21,"s":"ליואל יש חוזה פיתוח עם רשות מקרקעי ישראל (מינהל) בתוקף עד סוף שנת 2016. יואל חושש כי הוא לא יספיק לסיים אתבניית המבנה על המגרש עד סוף שנת 2016.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם יואל לא יסיים את הבנייה עד סוף שנת 2016, חוזה הפיתוח מתבטל אוטומטית והוא יאבד את הזכויות שלו במגרש.","אם יואל לא יסיים את הבנייה עד סוף שנת 2016, קיימת לרשות מקרקעי ישראל (מינהל )זכות לבטל את הסכם הפיתוח והוא עלול לאבד את זכויותיו בגרש.","אם יואל לא יסיים את הבנייה עד סוף שנת 2016, הוא יאלץ לשלם דמי היתר על מנת להמשיך ולהחזיק את הזכויות שלו במגרש.","אם יואל לא יסיים את הבנייה עד סוף שנת 2016, הוא יאלץ לשלם דמי חכירה על מנת להמשיך ולהחזיק את הזכויות שלו במגרש."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2016-08#22","e":14,"n":22,"s":"אמא של שי נפטרה והורישה לו את דירת המגורים שלה. שי חושש כי הורשת הדירה תחייב את העיזבון במס שבח ואותו לשלם מס רכישה עקב קבלתה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההורשה היא לא מכירה ולכן לא יחולו מס שבח ומס רכישה.","העיזבון יידרש לשלם מס שבח מלא ושי יחויב במס רכישה.","העיזבון ישלם שליש ממס השבח המלא ושי פטור ממס רכישה.","אם לשי יש יותר מדירת מגורים אחת על שמו , אז העיזבון ישלם מס שבח מלא ושי ישלם מס רכישה כבעל דירה שנייה."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2016-08#23","e":14,"n":23,"s":"גדי וגליה הם זוג נשוי. לגדי יש דירה הרשומה על שמו בלבד.כיום רוצה גליה לרכוש דירה שתירשם על שמה. הצדדים לא ערכו הסכם יחסי ממון בניהם\n.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גליה תשלם מס רכישה לפי חישוב של דירה שנייה.","גליה תשלם מס רכישה לפי חישוב של דירה יחידה.","גליה תשלם רק מחצית ממס הרכישה שיחושב לפי חישוב של דירה יחידה.","גליה תשלם רק שליש ממס הרכישה שיחושב לפי חישוב של דירה שנייה."],"c":[0],"a":false,"note":"","sub":"x_purchase"},{"id":"2016-08#24","e":14,"n":24,"s":"משה פנה ליונה המתווך וביקש למכור בתיווכו את דירתו.משה גם הביא לידיעת יונה כי בבניין מתגורר מעליו דייר שהינו עבריין ממשפחת פשע ידועה, המהלך אימים על הדיירים.משה דרש מיונה כי יחתום על התחייבות לפיה לא יביא מידע זה לידיעת קונים פוטנציאליים כתנאי לכך שיהיה המתווך בעיסקה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יונה לא יגלה מידע זה לקונים, כי התחייב על כך.","יונה לא יגלה מידע זה לקונים, כי על פי החוק אסור לגלות לקונים את עניינו האישי של משה.","יונה לא יגלה מידע זה לקונים, כי המידע אינו רלוונטי לעיסקה.","יונה לא יסכים לשמש כמתווך בעיסקה, אלא אם משה יסכים שהמידע כן יימסר לקונים."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2016-08#25","e":14,"n":25,"s":"מאיה ואסף הם זוג נשוי. מאיה פנתה למתווך לואי, וחתמה עימו על הסכם לקבלת שירותי תיווך. לואי הראה למאיה דירה רחוב טאגור בתל אביב, שהוצעה למכירה תמורת 4 מיליון ש\"ח. מאיה ביררה פרטים על הדירה, ביקרה במקום שוב עם הוריה ועם אדריכל מטעה, ואף הגיעה להסכמה עם המוכרים על מחיר של 3.9 מיליון ש\"ח, וכל על מועדים מוסכמים לפינוי. עם זאת מאיה אמרה כי עליה לקבל את הסכמתו של בעלה השוהה בחו\"ל והמו\"מ בינה לבין בעלי הכנס הופסק. לאחר מספר ימים עם שובו של בעלה אסף מחו\"ל, פנה אסף למתווכת נוספת בשם פאני, אשר הציגה בפניו את אותה הדירה. לאחר שעשה בירורים וקיים שיחות עם המוכרים, הגיע אסף להסכמה איתם על מחיר של 3.85 מיליון ש\"ח ורכש את הדירה. לואי טוען כי על בני הזוג לשלם לו את דמי התיווך, ובני הזוג טוענים כי מאיה לא רכשה את הדירה, אלא אסף, שלא חתם על הסכם עם לואי וכי הם ישלמו דמי תיווך לפאני ועל כן אין הם חייבים לשלם ללואי דמי תיווך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לאור מעורבותה של המתווכת פאני, לואי אינו הגורם היעיל, ועל כן הוא אינו זכאי לדמי תיווך.","התחייבותו של אסף לפאני גוברת על התחייבותה של מאיה ללואי, מאחר שפאני סגרה את העיסקה.","בין אסף ללואי לא נחתמה הזמנת תיווך, מאחר שאסף הוא הקונה ולא מאיה, ולכן לואי לא זכאי לדמי תיווך בשל עיסקה זו.","מאחר שמדובר בזוג נשוי הפועל היחידה כלכלית אחת, לא עבר זמן רב בין המקרים והמחיר דומה, פעילותה של פאני אינה גורעת מזכותו של לואי לדמי תיווך."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2016-11#1","e":15,"n":1,"s":"יוסף הוא הבעלים של חלקה מספר 6. לאסתר אחותו בעלות על חלקה מס' 7. שתי החלקות צמודות זו לזו. חלקה 6 משועבדת בזיקת הנאה, בזכות מעבר כדי להגיע לחלקה 7. לימים אסתר הלכה לעולמה ויוסף ירש את חלקה 7. יוסף איחד את חלקה 6 וחלקה 7 לחלקה אחת.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ברגע ששתי החלקות אוחדו לחלקה אחת- זיקת ההנאה מתבטלת מאליה.","ירושת חלקה 7 ע\"י יוסף מבטלת את זיקת ההנאה.","לפי החוק, מיזוג הבעלות של חלקה 6 וחלקה 7 לבעלות אחת מבטלת את זיקת ההנאה.","לפי החוק, אסור ליורש לאחד את שתי החלקות לחלקה אחת"],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2016-11#2","e":15,"n":2,"s":"אמיר הוא הבעלים של דירה אחת בבית משותף בתל אביב. לדירה צמודות 2 חניות לרכב. אמיר מעוניין למכור את דירתו וחניה אחת, ולהשכיר את החניה השנייה בנפרד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אמיר חייב למכור את הדירה ביחד עם שתי החניות לקונה הדירה.","אמיר יכול למכור את דירתו לקונה אחד ואת 2 החניות להשכיר לאחר.","אמיר יכול למכור את דירתו וחניה אחת לקונה אחד, ואת החניה השניה הוא יכול להשכיר לבעלים של אחת הדירות בבניין.","אמיר יכול למכור את דירתו ביחד עם חניה אחת לקונה אחד, ואת החניה השנייה הוא יכול להשאיר לשימושו האישי."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2016-11#3","e":15,"n":3,"s":"בנימין מתגורר בדירה בת 3 חדרים בקומת קרקע ועורך בה עבודות שיפוץ כלהלן: צביעת הדירה, החלפת צנרת המים והדלוכין, החלפת הריצוף, שיפוץ ואיחוד חדר האמבטיה עם השירותים והרחבת חלון השירותים הפונה לרחוב. במהלך העבודות קיבל בנימין צו הפסקת עבודה מהוועדה המקומית לתכנון ובניה, בטענה כי הוא מבצע שינוי בדירתו ללא קבלת היתר כנדרש.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בנימין יכול להמשיך בעבודת השיפוץ, כי לא ביצע כל עבירת בניה.","על בנימין להפריד את חדר האמבטיה מהשירותים לפי ההיתר המקורי של הבניין ובהתאם לתקנות משנת 1998 המחייבות להפריד את חדר האמבטיה מהשירותים.","על בנימין להפריד את חדר האמבטיה מהשירותים ולהקטין את חלון חדר השירותים.","על בנימין להקטין את חלון חדר השירותים הפונה לרחוב לפי ההיתר המקורי."],"c":[3],"a":false,"note":"","sub":"p_permit"},{"id":"2016-11#4","e":15,"n":4,"s":"דוד הוא הבעלים של דירה והוא מעוניין למכור אותה. דוד התקשר עם מתווך במקרקעין מר כהן. בהסכם להזמנת שירותי תיווך נקבעה תקופת בלעדיות למשך 90 יום. מר כהן פירסם את הדירה באינטרנט ובדירה ביקרו ביחד איתו 5 קונים פוטנציאליים. בסופו של דבר, הדירה נמכרה לקונים שפנו לא באמצעות המתווך, בשל כך סירב דוד לשלם דמי תיווך למר כהן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דוד צודק, אין עליו לשלם למר כהן דמי תיווך, כי הוא אישית דאג להביא לקוח לרכישת הדירה, ומר כהן לא היה הגורם היעיל במכירה.","על דוד לשלם למתווך דמי תיווך, מאחר שהמתווך היה הגורם היעיל ופעל במשך תקופת הבלעדיות למכור את הדירה.","על דוד לשלם למר כהן רק מחצית מדמי התיווך שסוכמו, מכיוון שלשניהם הייתה יד במאמצים למציאת קונה.","על דוד ומר כהן לפנות למגשר כדי שיביא ליישוב המחלוקת ביניהם."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2016-11#5","e":15,"n":5,"s":"אסף מעוניין למכור את דירתו, הוא התקשר עם המתווכת אורנה בהסכם בלעדיות למשך 6 חודשים למכירת הדירה. אורנה המתווכת הייתה פעילה והביא להתקשרות ומכירת הדירה. בדיעבד הסתבר, כי מפאת שיכחה רישיונה של אורנה לא חודש עד מועד ההתקשרות עם אסף.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["למרות שרישיונה של המתווכת לא חודש מפאת שיכחה, על אסף לשלם דמי תיווך לאורנה, שהביא לביצוע העיסקה כמסוכם.","מה שקובע הוא הסכם הבלעדיות עליו אסף חתם ועליו לשלם דמי תיווך לאורנה.","אורנה לא תהיה זכאית לדמי תיווך, מכיוון שלא הייתה בעלת רישיון בתוקף.","אורנה לא תהיה זכאית לדמי תיווך, מכיוון שהחתימה את אסף על בלעדיות אורכה מהמותר בחוק."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2016-11#6","e":15,"n":6,"s":"יוחאי התחייב למכור לראובן את דירתו בהסכם עליו הם חתמו. העסקה טרם נרשמה בלשכת רישום המקרקעין (\"טאבו\"). כעבור שבוע התחייב יוחאי בהסכם חתום עם בינימין למכור לו את דירתו. בנימין פעל בתום לב ושילם ליוחאי את התמורה והעסקה נרשמה על שם בינימין בשלכת רישום המקרקעין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכותו של ראובן לקבל את הדירה, מכיוון שהיה הראשון לחתום על ההסכם לרכישת הדירה.","זכותו של בינימין לקבל את הדירה, למרות שהיה שני לחתום על הסכם הרכישה.","על יוחאי ראובן לפנות להכרעת ביהמ\"ש שיחליט מי יקבל את הדירה.","על יוחאי וראובן לפנות למגשר כדאי להגיע להסכמה וליישוב המחלוקת ביניהם"],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2016-11#7","e":15,"n":7,"s":"מהן זכויות במקרקעין ע\"פ חוק מקרקעין?","o":["בעלות, שכירות, חכירה, חכירה לדורות, זיקת הנאה, הערת אזהרה, משכנתא.","בעלות, שכירות, חכירה, חכירה לדורות, חזקה, משכנתא, הערת אזהרה, זיקת הנאה, ירושה.","בעלות, שכירות, שכירות משנה, חכירה, חכירה לדורות, משכנתא, זיקת הנאה, ירושה.","בעלות, שכירות, חכירה, חכירה לדורות, זיקת הנאה, זכות קדימה, משכנתא."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2016-11#8","e":15,"n":8,"s":"מהי משכנתא?","o":["משכנתא היא משכון של מקרקעין כבטוחה להחזרת הלוואה והיא אחת הזכויות במקרקעין עפ\"י חוק המקרקעין, ומחייבת רישום בלשכת רישום המקרקעין.","משכנתא היא שיעבוד נכס כבטוחה להחזרת הלוואה ומחייבת רישום אצל רשם המשכונות ובנק ישראל.","משכנתא היא שעבוד נכס מקרקעין כבטוחה ואינה כלולה ברשימת הזכויות במקרקעין עפ\"י חוק המקרקעין, אך יש לרשום אותה אצל רשם המשכונות.","משכנתא היא הלוואה הניתנת על ידי בנק למשכנתאות, עליה יהיו חתומים 2 ערבים כבטוחה להחזרת ההלוואה."],"c":[0],"a":false,"note":"","sub":"l_mortgage"},{"id":"2016-11#9","e":15,"n":9,"s":"ירדנה גרה בבית משותף בתל אביב. באסיפת דיירים הוחלט ברוב של 60% מהדירות לבנות ממ\"ד בבניין. ירדנה אינה מעוניינת בממ\"ד ולא בבניה.\nלאור החלטת הדיירים, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["החלטות 60% מהדיירים לבניית ממ\"ד אינה מחייבת את הדיירים שלא הסכימו לכך, מכיוון שיש צורך ברוב של 75% של הדיירים.","אסיפת הדיירים מוסמכת להחליט על הקמת ממ\"ד ברוב של 60%.","בהתאם לחוק המקרקעין, אסיפת דיירים שהחליטה ברוב קולות של דיירי הבניין מחייבת את כל הדיירים בהחלטה.","ע\"פ חוק התכנון והבניה, בניין בו אין אמצעי מיגון כגון, ממ\"ד דיירי הבניין מחוייבים לפעול להקמת ממ\"ד כנדרש , ולכן על ירדנה להשתתף בתשלום הנדרש להקמתו."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2016-11#10","e":15,"n":10,"s":"גילה רוצה למכור את הדירה הישנה שלה ולקנות דירה חדשה מקבלן, אשר נמצאת כרגע בתהליך בנייה. לגילה יש משכנתא על הדירה הישנה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גילה יכולה לגרור את המשכנתא הישנה שלה לרכישת הדירה החדשה.","גילה לא יכולה לגרור את המשכנתא הישנה שלה, מאחר ובניית הדירה החדשה טרם הסתיימה.","לא ניתן לגרור משכנתא לדירה חדשה מקבלן.","גילה צריכה להקפיא את המשכנתא שלה עד שבניית הדירה החדשה תסתיים ורק אז תוכל לגרור אותה לדירה החדשה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2016-11#11","e":15,"n":11,"s":"צפריר שוקל לרכוש דירה מקבלן בפרויקט חדש שבנייתו הסתיימה לא מזמן. הסתבר שהבניין טרם נרשם כבית משותף והדירה לא רשומה בלשכת רישום המקרקעין (\"טאבו\"). הקבלן הודיע לצפריר כי עליו לטפל ברישום.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["החברה הקבלנית חייבת לרשום את הבניין כבית משותף ואח\"כ לרשום את הדירה על שם הקונה ב\"טאבו\".","צפריר יכול לפנות ישירות ללשכת רישום המקרקעין באיזור הפרויקט ולבצע את הרישום באופן עצמאי. הרישום מתבצע מיידית ע\"י לשכת הרישום ולאחר תשלום אגרת הרישום.","צפריר יכול לבצע את פעולות הרישום דרך אתר האינטרנט של האגף לרישום להסדר מקרקעין ושלם גם את אגרת הרישום.","רישום הזכויות ב\"טאבו\" ע\"ש הרוכש ייעשה תוך פרק זמן של שנה מיום תשלום מס הרכישה ולאחר תשלום האגרה הנדרשת. רשות המיסים מעבירה ישירות ללשכת רישום המקרקעין את כל הפרטים הנדרשים לרישום הנכס."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2016-11#12","e":15,"n":12,"s":"מהם מקרקעין כפופים?","o":["מקרקעין שניתנה בהם זיקת הנאה.","מקרקעין שלא ניתן להפיק מהם הנאה בשל מגבלות השטח.","קרקע משופעת מעל 21% ושלא ניתן לבנות עליה מבנה מגורים","מקרקעין שהוכרזו בצו ע\"י הרשות המקומית כמסוכנים וכפופים לאישור מהנדס הרשות ולהסרת הצו."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2016-11#13","e":15,"n":13,"s":"אלי מעוניין למכור את בית המלון שברשותו באמצעות מתווך מקרקעין. המתווך החתים את אלי על הזמנת שירותי תיווך בבלעדיות למכירת הנכס. בהזמנה נקבע תקופת בלעדיות של שנה. לאחר 4 חודשים נוכח אלי, בעל הנכס, כי המתווך לא ביצע עד לאותו מועד את פעולות השיווק שסוכמו ביניהם והוא מעוניין לבטל את הבלעדיות.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שעברו 4 חודשים מיום החתימה על הזמנת בלעדיות- ניתן לסיימה.","מאחר שעברו 3 חודשים מיום החתימה על הזמנת בלעדיות- ניתן לסיימה.","מאחר שעברו 4 חודשים מיום החתימה על הזמנת בלעדיות- היא הסתיימה.","רק לאחר שניתנה למתווך אורכה של 14 יום לבצע את פעולות השיווק והוא לא ביצע את הנדרש, ניתן לסיים את הבלעדיות."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2016-11#14","e":15,"n":14,"s":"על פי החוק והתקנות, מה גובה דמי התיווך אותם רשאי מתווך מקרקעין לגבות בעת מכירה/קנייה של מגרש?","o":["על פי החוק והתקנות ניתן לגבות 2 אחוזים ממחיר המכירה/הקנייה של הנכס בתוספת מע\"מ.","על פי החוק והתקנות ניתן לגבות אחוז אחד מכל צד ממחיר המכירה/הקנייה של הכנס, ובסה\"כ 2 אחוזים בתוספת מע\"מ.","החוק והתקנות אינם קובעים את גובה דמי התיווך, שהינם עניין שיסוכם בין המתווך ללקוחו.","על פי החוק והתקנות ניתן לגבות עד 2 אחוזים ממחיר המכירה/ הקנייה של הנכס, כולל מע\"מ."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2016-11#15","e":15,"n":15,"s":"מר שמריהו מכר וילה בסביון וחל עליו מס שבח. מר שמריהו רוצה לנכות מהמס גם את דמי התיווך בגובה 2% ששילם בעת רכישת הנכס לפני 15 שנה ואת דמי התיווך בגובה 2% ששילם בעת מכירת הנכס.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המוכר יכול לנקות רק 2% מעמלת המכירה או מעמלת הקניה.","המוכר אינו יכול לנקות את עמלת התיווך מסכום מס השבח.","המוכר יכול לנקות את כל עמלות התיווך ששילם.","המוכר יכול לנקות רק את עמלת התיווך על קניית הנכס בעבר."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2016-11#16","e":15,"n":16,"s":"יוסף מתגורר בדירה בתל אביב כדייר מוגן. לימים הכיר את רחל והם חיו בדירה כבני זוג \"ידועים בציבור\". לאחר 3 שנים של מגורים משותפים, יוסף נפטר.\nבנסיבות העניין, מי יהא זכאי להיות דייר מוגן לאחר פטירתו של יוסף?","o":["חוק הגנת הדייר אינו מכיר בזכויות \"ידועים בציבור\", לכן הזכויות בדירה עוברות לילדיו של יוסף, שהם היורשים החוקיים לאחר פטירתו.","לאחר פטירת יוסף הזכויות בדירה עוברות לרחל, בת זוגתו של יוסף שהתגוררה עמו בדירה יותר מחצי שנה לפני פטירתו.","על פי חוק הגנת הדייר הזכויות בדירה חוזרות לבעלים עם פטירת הדייר המוגן.","בהתאם לחוק הירושה, מחצית מהזכויות בנכס המוגן יעברו לבת זוגו של יוסף ומחצית מהזכויות לילדיו."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2016-11#17","e":15,"n":17,"s":"עקיבא שוכר מראובן לול במשק במושב מרגליות בגליל העליון, בהסכם שכירות במשך 20 שנה. לימים הוא התבקש לפנות את הלול בהתראה של 6 חודשים. עקיבא מתנגד לפינויו וטוען כי הוא מתפעל שנים רבות את הלול, ולכן הוא דייר מוגן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["עקיבא צודק: הוא דייר מוגן מאחר שהוא נמצא בנכס יותר מ-20 שנים.","עקיבא אינו צודק ואינו דייר מוגן, מאחר שהוא נמצא בנכס פחות מ-25 שנים.","עקיבא אינו צודק ואינו דייר מוגן על פי חוק.","עקיבא צודק, מאחר שחוק הגנת הדייר חל על שכירות לול של יותר מ-7 שנים."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2016-11#18","e":15,"n":18,"s":"יוסף מעוניין לרכוש בירושלים דירה עם מרפסת. לצורך כך הוא התקשר עם המתווך דוד בהסכם תיווך. דוד הוא מתווך יעיל וזריז והוא הציע ליוסף דירה. דוד ידע כי המרפסת הקיימת נבנתה ללא היתר וכי היא נמצא בשלבי היתר סופיים. יוסף רכש את הדירה ושילם תמורתו כנדרש. לימים התברר ליוסף כן טרם ניתן היתר בנייה למרפסת, ויתרה מכך, הוא נדרש לשלם סכום נכבד כקנס על החריגה וכתנאי לקבלת ההיתר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יוסף יכול לתבוע את דוד המתווך, שיפצע אותו בגין הנזקים שנגמרו לו.","יוסף צריך לתבוע את המוכר ולא את דוד המתווך.","יוסף צריך לתבוע את דוד המתווך, רק עם יתבע רק את המוכר.","יוסף אינו צריך לבוא בטענות לדוד המתווך או לעורך דינו, מאחר שעליו מוטלת החובה לבדיקת הנכס"],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2016-11#19","e":15,"n":19,"s":"מהי חכירה על פי החוק?","o":["חכירה היא שכירות מקרקעין לתקופה של עד 5 שנים.","חכירה היא שכירות מקרקעין לתקופה של יותר מ-7 שנים.","חכירה היא שכירות מקרקעין לתקופה של יותר מ- 5 שנים אך פחות מ-25 שנים.","חכירה היא שכירות מקרקעין לתקופה של יותר מ-25 שנים."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2016-11#20","e":15,"n":20,"s":"מתווכת העוסקת בתיווך מקרקעין הציעה לחברה להתקשר בפרויקט להקמת בניין על מגרש שהיה בבעלות חברה אחרת שחיפשה משקיע. לאחר שהחברה גילתה עניין בפרויקט, היפנתה אותה המתווכת לעורך הדין שייצג את בעלת הקרקע וזה מסר לחברה פרטים נוספים. בסופו של דבר לא יצאה העיסקה אל הפועל, אולם לאחר חודשים מספר התקשרו החברות בעיסקה. המתווכת תבעה דמי תיווך, אולם החברה הסכימה לשלם לה פיצוי מוגבל לפנים משורת הדין בטענה שעורך דינה של בעלת הקרקע היה הגורם היעיל.\nע\"פ פסק דין בעניין של כוכבה יצחקוב נ' מרדכי אביב מפעלי בנייה בע\"מ:","o":["המתווכת או העו\"ד יכולים להיות \"הגורם היעיל\" בביצוע העיסקה, ולא שניהם.","קיימת אפשרות שבמקרה זה קיימים 2 גורמים (המתווכת והעו\"ד) אשר הניעו את העיסקה ושניהם ביחד מהווים את הגורם היעיל.","המתווכת זכאית לדמי תיווך רק כאשר פעלה לבדה, בלי סיוע של עורך הדין.","עורך הדין שנכנס מאוחר יותר לעניים יהיה בהכרח הגורם היעיל."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2016-11#21","e":15,"n":21,"s":"מתווך תיווך בעיסקת מקרקעין שנחתמה בחוזה. צד אחד לחוזה המכר חולק על חובתו לשלם למתווך דמי תיווך וזאת על יסוד הטענה שחוזה המכר הופר על ידי הצד השני.\nע\"פ פסק הדין בעניין של אנגל שושני ואח' נ' אברון את פורת בע\"מ, האם במקרה של הפרת חוזה מתבטלת ההתחייבות לשלם דמי תיווך?","o":["הצד המפר יהיה חייב לשלם למתווך את דמי התיווך.","אם העיסקה התבטלה, המתווך לא זכאי לדמי תיווך.","עצם הפרת החוזה אינה מבטלת התחייבות חוזית עם צד שלישי, שהוא כאן המתווך. אם ההפרה היא מעשהו של הצד השני לחוזה המכר, יוכל הצד המשלם למתווך לתבוע מידי המפר את מה ששילם למתווך.","אם דמי התיווך שולמו לפני שהעיסקה התבטלה, על המתווך להחזיר את דמי התיווך."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2016-11#22","e":15,"n":22,"s":"דיקן האוניברסיטה העברית בירושלים החליט להקים בהקדם האפשרי מכון כושר חדש ומשוכלל באוניברסיטה, ולכן רוצה להימנע מהתהליכים הכרוכים בקבלת הרישיון לעסק.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מכון כושר הוא עסק המחייב רישיון תמיד, ולכן אם יקים הדיקן מכון כושר ללא רישוי הוא יפר את החוק.","הדיקן יכול לשים שלט בכניסה לחדר הכושר, המציין כי לחדר כושר זה לא ניתן רישיון מטעם רשות הרישוי ובכך יהיה פטור מדרישות הרישוי מבלי להפר את החוק.","מכון כושר אינו מחייב רישיון בלאו הכי, ולכן אינו נדרש לבצע דבר.","אם מכון הכושר יהא מוחזק ומופעל בידי האוניברסיטה, וישמש את הסטודנטים מן המניין הרשומים למוסד בלבד, יהא המכון פטור מדרישת הרישוי."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2016-11#23","e":15,"n":23,"s":"אבי החליט להקים קיוסק במרכז \"לב רעות\". לשם כך פנה לרשות הרישוי וזו נתנה לו היתר מזורז להפעלת העסק. כעבור חצי שנה החליטה רשות הרישוי שלא לתת רישיון לקיוסק של אבי, וזאת בהתאם לחוק. אבי התאכזב מאוד מהחלטה והבין שעליו לסגור את הקיוסק בתוך חצי שנה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["היתר מזורז ניתן לתקופה של שנה ולכן יש לאבי עוד חצי שנה להפעיל את הקיוסק, טרם סגירתו.","היתר מזורז ניתן לתקופה של שנתיים ולכן יש לאבי עוד שנה וחצי להפעיל את הקיוסק.","היתר מזורז עומד בתוקפו לשנה ממועד נתינתו או עד להחלטת רשות הרישוי לעניין מתן הרישיון, לפי המוקדם. לכן על אבי לסגור את העסק מיד.","קיוסק אינו עסק הטעון רישוי ולכן אין כל רלוונטיות להחלטת רשות הרישוי."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2016-11#24","e":15,"n":24,"s":"אילן פירסם את דירתו למכירה. שמוליק ראה את הדירה, התלהב ממנה, ובתוך שבוע נערך הסכם מכר בין הצדדים. המעמד חתימת הסכם המכר שילם שמוליק את מלוא המחיר עבור הדירה. למחרת בבוקר התחרט אילן, החליט להפר את החוזה והחזיר באותו יום לשמוליק את כל הכסף ששולם עבור הדירה, וזאת בניגוד לרצונו של שמוליק.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שמוליק זכאי לתבוע את אכיפת החוזה.","לא ניתן לעשות דבר מכיוון שאילן החזיר את כל הכסף אשר שולם לו.","קיום החוזה נתון לשיקול דעתו של אילן בלבד, לכן על שמוליק לשכנע אותו לחזור בו.","שמוליק זכאי לתבוע את אכיפת החוזה בתנאי שישלם קודם את מלוא התמורה לידי אילן."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2016-11#25","e":15,"n":25,"s":"אורי נאלץ למכור את דירתו בשל הצורך במימון ניתוח יקר ודחוף שעליו לעבור בארה\"ב. אורי פנה לרינה המתווכת ושיתף אותה בסיבה זו וכן אמר שהוא מוכן למכור את דירתו במחיר זול יותר משוויה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רינה חייבת למסור מידע מהותי זה למתעניינים בדירה.","רינה יכולה לגלות מידע זה, אך לא חייבת.","רינה יכולה לגלות מידע זה רק בהסכמת אורי.","רינה חייבת לגלות מידע זה למתעניינים, שכן אורי מחוייב לגלותו לקונה על פי דין."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2017-01#1","e":16,"n":1,"s":"איתמר התחייב בחוזה למכור לניצן את דירתו בתמורה למיליון ש\"ח. איתמר הפר את החוזה ולא מסר את הנכס לניצן, ובשל כך החזיר לה את כספה והחוזה בוטל. מיד לאחר ביטול החוזה, מכר איתמר את דירתו לברוך תמורת מיליון וחצי ש\"ח כשוויה בשוק.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רק אם ניצן תוכיח כי נגרם לה נזק כתוצאה מהפרת החוזה, היא תהיה זכאית לפיצוי בגובה חצי מיליון ש\"ח.","אם ניצן תוכיח כי נגרם לה נזק כתוצאה מהפרת החוזה, היא תהיה זכאית לפיצוי בגובה מיליון וחצי ש\"ח.","ניצן נדרשת להוכיח כי נגרם לה נזק כתוצאה מהפרת החוזה, והיא זכאית לפיצוי בגובה מיליון וחצי ש\"ח.","ניצן אינה נדרשת להוכיח כי נגרם לה נזק כתוצאה מהפרת החוזה, והיא זכאית לפיצוי בגובה חצי מיליון ש\"ח."],"c":[3],"a":false,"note":"","sub":"c_remedy"},{"id":"2017-01#2","e":16,"n":2,"s":"מור ורותם כרתו ביניהם חוזה, לפיו מור תמכור את דירתה לרותם, החוזה נחתם על ידי שני הצדדים, אך העיסקה לא נרשמה בפנקסי המקרקעין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["העיסקה הושלמה במלואה.","העיסקה הינה בגדר התחייבות לעשות עיסקה.","עיסקה במקרקעין שאינה נגמרה ברישום מבוטלת מעיקרה.","העיסקה הושלמה במלואה, בכפוף לכך שהצדדים הסכימו ביניהם כי העיסקה אינה טעונה רישום."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2017-01#3","e":16,"n":3,"s":"דנה ועידן סיכמו ביניהם, בעל פה, כי דנה תשכור את דירתו של עידן לתקופה של שנתיים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין תוקף לסיכום בין דנה לעידן, שכן עיסקה במקרקעין טעונה מסמכך בכתב.","ככלל, עיסקה במקרקעין טעונה מסמך בכתב, אך לא כך במקרה של עיסקת שכירות שאינה עולה על תקופה של חמש שנים.","ניתן תמיד להתחייב לעשות עיסקת שכירות בעל פה.","ניתן להתחייב לעשות עיסקה במקרקעין בעל פה, אך רק במקרה של עיסקאות מסוג מכר ולא בעיסקאות מסוג שכירות."],"c":[1],"a":false,"note":"","sub":"r_rent"},{"id":"2017-01#4","e":16,"n":4,"s":"בין אלון לבין אנה נחתם \"זכרון דברים\" למכירת דירה בתל אביב, בו גם נקבע מועד לעריכת חוזה סופי בין השניים. מיד עם חתימת הצדדים על \"זכרון דברים\" העביר אלון לאנה מקדמה בסך 20,000 ש\"ח.\nהאם \"זכרון הדברים\" יכול להיחשב לחוזה מחייב טרם עריכת החוזה הסופי?","o":["לא, אם הצדדים קבעו שיחתמו על חוזה מכר בעתיד.","לא, אם הצדדים לא היו מיוצגים על ידי עורכי דין במעמד עריכת \"זכרון דברים\".","כן, מכוח פסיקת בית המשפט, חוק החוזים כללי וחוק מקרקעין.","לא, זכרון דברים לעולם אינו יכול להיחשב כחוזה מחייב."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2017-01#5","e":16,"n":5,"s":"עומרי חתם על הסכם לרכישת מגרש בתיווכה של נחמה, ההסכם החתום הופר מצד המוכר והעיסקה בוטלה.\nהאם על עומרי לשלם לנחמה המתווכת את דמי התיווך שהתחייב לשלם לה למרות ההפרה מצד המוכר?","o":["לא, מכיוון שהעיסקה לבסוף לא יצאה לפועל.","לא, על עומרי לשלם רק 50% מדמי התיווך המקוריים להם התחייב.","לנחמה לא מגיעים דמי תיווך מעומרי, שקיים את חלקו בהסכם.","נחמה זכאית לעמלה בהתאם להסכמי שירותי התיווך שנחתמו עימה."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2017-01#6","e":16,"n":6,"s":"אביב החליט למכור את דירתו. לצורך כך הוא התקשר עם חן, מתווכת במקרקעין, בהסכם שירותי תיווך עם תקפת בלעדיות של 60 יום. ההסכם ותקופת הבלעדיות נחתמו כדין. למרות שחן פעלה לשיווק הדירה כנדרש בדין, היא נרכשה במהלך תקופת הבלעדיות על ידי אורנה, שלא שוחחה או נפגשה עם חן מעולם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חן לא הייתה \"הגורם היעיל בעיסקה, שהרי הדירה נמכרה שלא באמצעותה ולכן אינה זכאית לדמי תיווך מאביב.","הדירה נמכרה בתקופת הבלעדיות וחזקה שחן הייתה \"הגורם היעיל\" בעיסקה ולכן היא זכאית לדמי תיווך מאביב.","רק אם יוכח שלאורנה נודע על מכירת הדירה מפעולות השיווק שנקטה חן, תהיה חן זכאית לדמי תיווך מאביב.","תקופת הבלעדיות מוגבלת ל-30 יום, וכל קביעה אחרת בטלה ומבוטלת, ולכן חן אינה זכאית לדמי תיווך מאביב"],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2017-01#7","e":16,"n":7,"s":"מהי חברה משכנת?","o":["חברה לניהול בתים משותפים/ שיכונים.","חברה לבניית בתי מגורים עבור משרד השיכון ובינוי.","חברה בע\"מ המופיעה ברישומי רשם החברות כחברה לשיווק נדל\"ן.","חברה הבונה את הבניין ומשכנת את הדיירים בו."],"c":[3],"a":false,"note":"","sub":"l_mortgage"},{"id":"2017-01#8","e":16,"n":8,"s":"איזה מהמשפטים הבאים מתאר בצורה הנכונה ביותר את המונח \"הקלה\"?","o":["צורת הבנייה העושה שימוש בחומרי הגלם בעלי משקל קל יחסית.","בנייה בשינוי קל מהוראות התוכנית החלה במקום הבנייה.","רישיון הניתן לבעל עסק באופן מקל, עוד בטרם קיבל אישור רשמי ומגרומי הרשות, היינו- היתר מזורז.","הקלה בענוש של עוסק, אשר הפר את חובת הגילוי לצרכן, אם הוכיח כי הפגמים בנכס היו ידועים לצרכן."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2017-01#9","e":16,"n":9,"s":"מור שכרה את שירותיו של עמרי, מתווך במקרקעין, כדי שיסייע לה למצוא את דירת חלומותיה. יותר משנתיים פעל עמרי ללא הרף במטרה למצוא למור את דירה המושלמת עבורה. מאמציו הרבים של עמרי נשאו לבסוף פרי, וביום 13.4.2016 קנתה מור דירה. להפתעתה, גילתה מור כי ב-1.4.2016 פג תוקף רישיון התיווך של עמרי בשל אי - תשלום אגרה שנתית.\nהאם מור מחויבת לשלם לעמרי דמי תיווך?","o":["לא, אין זכאות לדמי תיווך בהיעדר רישיון בתוקף.","מור מחויבת לשלם לעמרי דמי תיווך יחסיים, היינו - רק ביחס לתקופה בה החזיק ברישיון כדין.","כן, עמרי היה \"הגורם היעיל\" בעיסקה ויש לעשות הבחנה בין היעדר זכאות לרישיון לבין מצב זמני של היעדר תוקף לרישיון מחמת אי תשלום אגרה בלבד.","כן, אך לאחר מכן תוכל לתבוע את עמרי בטענה של הפרת חובת הגינות ולדרוש פיצויים."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2017-01#10","e":16,"n":10,"s":"חנה ומתן הינם מתווכים במקרקעין אשר סיכמו בעל -פה לשתף ביניהם פעולה לצורך מכירת דירה. השניים סיכמו כי דמי התיווך שיתקבלו ממכירת הדירהה יחולקו באופן שווה ביניהם. חנה מצאה רוכשים לדירה וגבתה את דמי התיווך. כעת, מתן דורש את חלקו בדמי התיווך ואילו חנה מסרבת לכך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הסכם שיתוף פעולה בין מתווכים במקרקעין חייב להיערך בכתב, ומשנערך בעל- פה אין הוא תקף. משכך, מתן אינו זכאי לקבל חלק מדמי התיווך.","הסכם שיתוף הפעולה בין מתווכים במקרקעין יכול שיהא הן בכתב והן בעל- פה, אך תוקפו כפוף להסכמתם של המוכר והקונה לעצם קיומו של שיתוף הפעולה. משכך, בהנחה שהצדדים בעיסקה זו הסכימו לשיתוף פעולה בין מתן לחנה, זכאי מתן לחלקו בדמי התיווך.","אין הכרח כי הסכם שיתוף הפעולה בין מתווכים במקרקעין ייערך בכתב וככל שיוכח כי אכן נערך הסכם בעל- פה, זכאי מתן לקבל את חלקו בדמי התיווך.","לאור הסכם שיתוף הפעולה בין חנה למתן, זכאי מתן לקבל חלק מדמי התיווך. אולם, הואיל וחנה היוותה הגורם היעיל בעיסקה, דרישתו של מתן לקבל 50% מדמי התיווך היא עמידה על זכות שלא בתום- לב ומגיעה לו עמלה מופחתת של 25%."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2017-01#11","e":16,"n":11,"s":"עדי ואופיר שותפים בבעלות על מגרש בפתח תקווה. כיצד תתחלק בעלותו של כל אחד מהם במגרש?","o":["לכל אחד בעלות בשטח מוגדר שגודלו חצי משטח המגרש.","לכל אחד בעלות בשטח מסוים שגודלו לפי חלקו בבעלות על המגרש כולו.","הבעלות של כל אחד מהם מתפשטת בכל אתר ואתר שבמגרש לפי חלקו בבעלות","הבעלות תתחלק בין השניים רק על פי סיכום מראש ביניהם."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2017-01#12","e":16,"n":12,"s":"טיליה היא בעלים של מגרש המיועד למגורים. טיליה אוהבת מרחבים, ולכן כאשר בנתה את ביתה היא ניצלה את כל השטח אשר הותר לבנייה על- ידי הוועדה המקומית. כעת, בנה הבכור בישר לה כי אישתו עתידה ללדת תאומים. טיליה הנרגשת מעוניינת לבנות לנכדיה חדר נוסף.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על טיליה לפנות לוועדה המחוזית על מנת שזו תתיר לה להגדיל את השטח המותר לבנייה.","על טיליה לפנות לוועדה המקומית על מנת שזו תתיר לה להגדיל את השטח המותר לבנייה.","על טיליה לפנות לרשות מקרקעי ישראל על מנת שזו תתיר לה להגדיל את השטח המותר לבנייה.","טיליה אינה יכולה בשום מצב להגדיל את השטח המותר לבנייה."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2017-01#13","e":16,"n":13,"s":"ענבל רכשה דירה מדנה הקבלנית. דנה דורשת כי ענבל תעביר לה את כל תשלומי העמלות וההוצאות הכרוכות בהבטחת כספיה של ענבל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["תשלומי העמלות וההוצאות הכרוכות בהבטחת כספיה של ענבל חלים על דנה.","תשלומי העמלות וההוצאות הכרוכות בהבטחת כספיה של ענבל חלים על ענבל.","תשלומי העמלות וההוצאות הכרוכות בהבטחת כספיה של ענבל חלים על התאגיד הבנקאי המלווה.","תשלומי העמלות וההוצאות הכרוכות בהבטחת כספיה של ענבל חלים על ענבל. אולם, אם ענבל לא תקבל את דירתה יהא על דנה לפצות את ענבל, בין היתר גם על תשלומים אלה."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2017-01#14","e":16,"n":14,"s":"גלי רכשה דירה בפרויקט \"מגדל\" מגיא הקבלן. גיא לא צירף לחוזה המכר מפרט והוראות תחזוקה ושימוש.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין על גיא חובה חוקית לצרף לחוזה המכר מפרט והוראות תחזוקה ושימוש, אלה אם סוכם אחרת.","על גיא מוטלת חובה חוקית לצרף לחוזה המכר מפרט והוראות תחזוקה ושימוש. משלא עשה כן, יראוהו כמי שהתחייב למסור את הדירה לגלי כשכל דבר שצריך היה לפרט במפרט ובאיכות שקבעו הצדדים ביניהם בחוזה המכר.","על גיא מוטלת חובה חוקית לצרף לחוזה המכר מפרט והוראות תחזוקה ושימוש. משלא עשה כן, יראוהו כמי שהתחייב למסור את הדירה לגלי שכל דבר שצריך היה לפרט המפרט הוא באיכות סבירה בהתחשב בנסיבות העניין.","על גיא מוטלת חובה חוקית לצרף לחוזה המכר מפרט והוראות תחזוקה ושימוש. משלא עשה כן, יראוהו כמי שהתחייב למסור את הדירה לגלי שכל דבר שצריך היה לפרט המפרט הוא באיכות גבוהה בהתחשב בנסיבות העניין."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2017-01#15","e":16,"n":15,"s":"אלי רכש לפני שנתיים מגרש של דונם ל-2 יחידות בהרצליה פיתוח על קרקע של רשות מקרקעי ישראל. הרכישה נעשתה באמצעות מתווך במחיר של 8,000,000 ש\"ח. כחלק מהקנייה שילם אלי דמי היוון על הקרקע לרשות מקרקעי ישראל. כיום החליט אלי למכור מחצית מהמגרש לאחיו דן כדי שיבנו יחד בית דו משפחתי.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא נכון ביותר?","o":["אלי ודן יצטרכו לשלם דמי הסכמה.","מכיוון שהמגרש מהוון, לא ישולמו דמי הסכמה.","אלי ודן ישלמו דמי היוון ודמי הסכמה, כל אחד על מחצית המגרש.","אלי ודן ישלמו רק מחצית מדמי ההסכמה."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2017-01#16","e":16,"n":16,"s":"אביתר, בעל דירה בבית משותף, מסרב להשתתף בעלויות תחזוקת החצר המשותפת. יתר בעלי הדירות החליטו להגיש תביעה נגד אביתר בשל סירובו, אך אינם יודעים לאיזה ערכאה משפטית עליהם לפנות כדאי שתכריע בסכסוך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על בעלי הדירות להגיש תביעה לבית המשפט המחוזי,המוסמך להכריע בסכסוך בין הצדדים.","על בעלי הדירות להגיש תביעה לרשם ההוצאה לפועל, המוסמך להכריע בסכסוך בין הצדדים.","על בעלי הדירות להגיש תביעה לרשות המקומית המוסכמת להכריע בסכסוך בין הצדדים בהתאם לתוכנית המיתאר המקומית החלה על המקום.","על בעלי הדירות להגיש תביעה למפקח על המקרקעין המוסמך להכריע בסכסוך בין הצדדים."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2017-01#17","e":16,"n":17,"s":"בדירת שלושה חדרים מתגוררים בני הזוג זילברמן עם שני ילדיהם הקטינים. בית המשפט החליט על פירוק השותפות בדירתם המשותפת, וזאת ע\"י מכירתה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא נכון ביותר?","o":["החלטת בית המשפט שגויה, מאחר שאינו מוסמך לפרק שותפות של דירה המשמשת למגורים של בני הזוג בדרך של מכירתה.","בית המשפט מוסמך לפרק שותפות של דירה שבה מתגוררים בני זוג ולמוכרה במרבה במחיר ללא כל תנאי נוסף.","בית המשפט מוסמך להחליט על פירוק שותפות של דירה בה מתגוררים בני הזוג רק באישור גורמי הרווחה המוסמכים.","בית המשפט מוסמך להחליט על פירוק שותפות של בני הזוג בכפוף למציאת הסדר מגורים אחר המתאים לילדיהם ולבן הזוג המחזיק בהם."],"c":[3],"a":false,"note":"","sub":"l_shared"},{"id":"2017-01#18","e":16,"n":18,"s":"רון, מתווך מקרקעין מוסמך, נוכח לדעת כי אינו מצליח להעניק שירות יעיל וזריז ללקוחותיו הרבים. כדאי להתמודד עם עומס הפניות במשרדו החליט רון להרחיב את פעילותו המקצועית באמצעות הקמת חברה לתיווך מקרקעין בה יועסקו שלושה עובדים שיסייעו לו בפועלות התיווך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא נכון ביותר?","o":["לרון אין אפשרות חוקית להעניק שירותיי תיווך באמצעות חברה בבעלותו, אלא אם יש לחברה רישיון תיווך.","ניתן להעניק שירותי תיווך באמצעות חברת תיווך ובלבד שבחברה מועסקים לפחות 4 עובדים.","ניתן להעניק שירותי תיווך באמצעות חברה ע\"י כל העובדים בחברה, גם אם הינם בעלי רישיון לעסוק בתחום ובלבד שרון מחזיק ברישיון תיווך.","ניתן להעניק שירותי תיווך באמצעות חברה, ובלבד שפעולת התיווך תעשה רק ע\"י העובדים המחזיקים ברישיון תיווך."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2017-01#19","e":16,"n":19,"s":"ניצה, מתווכת במקרקעין מוסמכת, החתימה את יונית, המעוניינת למכור את דירתה, על הזמנת שירותי תיווך ועל טופס בלעדיות לתקופה של 4 חודשים מיום ההזמנה. ניצה ביצעה את פעולות שיווק הדירה כהגדרתן בחוק, ואולם כבר לאחר חמישה ימים נמכרה הדירה ישירות ע\"י יונית לרוכש עצמאי , שלא נעזר בשירותי התיווך של ניצה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא נכון ביותר?","o":["ניצה אינה זכאית לקבל דמי תיווך מיונית, מאחר שלא הייתה הגורם היעיל במציאת הקונה שרכש לבסוף את דירתה של יונית.","ניצה אינה זכאית לקבל דמי תיווך מאחר שחלפו רק חמישה ימים מיום תחילת שיווק דירתה של יונית ועד למכירתה.","ניצה זכאית לקבל דמי תיווך משני הצדדים לעיסקה.","ניצה זכאית לקבל את דמי התיווך מיונית בהתאם להסכם הבלעדיות שנחתם בין השתיים."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2017-01#20","e":16,"n":20,"s":"עמיר, בעל דירה בבית משותף, מתנייד בכיסא גלגלים ומוגדר \"אדם עם מוגבלות\" כהגדרתו בחוק שיוון זכויות לאנשים עם מוגבלות. עמיר מבקש לבצע שתי התאמות בבניין: ביטול מדרגות הכניסה והרחבת פתח הכניסה לבית המשותף. בבניין יש 8 דירות שוות בשטחן. רק אחד מבעלי הדירות מתנגד לביצוע שתי ההתאמות המבוקשות ע\"י עמיר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא נכון ביותר?","o":["ביצוע ההתאמות המבוקשות ע\"י עמיר אינו טעון הסכמה בעלי הדירות האחרים בבית המשותף.","ביצוע ההתאמות המבוקשות ע\"י עמיר טעון הסכמת רוב בעלי הדירות בבית המשותף.","ביצוע ההתאמות המבוקשות ע\"י עמיר טעון הסכמה בעלי הדירות שבבעלותם 60% מהדירות בבית המשותף.","עמיר לא יכול לבצע את ההתאמות המבוקשות ע\"י מאחר שנדרשת הסכמה כל בעלי הדירות בבית המשותף לשם כך."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2017-01#21","e":16,"n":21,"s":"ירון, שהינו בעלים של בית צמוד קרקע, רשם זכות קדימה לגבי הנכס לטובת מרדכי, שכנו המתגורר בצמידות אליו. כשנה לאחר מכן העביר ירון את הנכס שבבעלותו, ללא תמורה, לבנו יהונתן, ללא שהציע אותם תחילה למרדכי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא נכון ביותר?","o":["ירון לא היה זכאי להעביר את הנכס ליהונתן, מאחר שלא הציע אותם תחילה למרדכי.","ירון זכאי להעביר את הנכס ליהונתן, מאחר שהחובה להציע מקרקעין לבעל זכות קדימה אינה חלה על העברה ללא תמורה.","ירון זכאי להעביר את הנכס ליהונתן, מאחר שהעברה ללא תמורה מבטלת את זכות הקדימה.","ירון זכאי להעביר את הנכס ליהונתן, מאחר שזכות קדימה ניתן למכור רק לטובת בן/בת זוג או קרוב משפחה מדרגה ראשונה ולא לטובת השכן."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2017-01#22","e":16,"n":22,"s":"יעל החליטה למכור את דירתה הרשומה בלשכת רישום המקרקעין (\"טאבו\") למיכל. מיכל הוציאה נסח טאבו של הדירה והבחינה כי הוא אינו כולל הערה בדבר תקנון מוסכם. מיכל פנתה ליעל ושאלה אותה למשמעות הדבר. יעל הסבירה למיכל כי בעלי הדירות לא הסכימו ביניהם על תקנון מוסכם וכי על הבניין חל התקנון המצוי, המסדיר את היחסים בין בעלי הדירות ואת זכויותיהם וחובותיהם בקשר לבית המשותף.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא נכון ביותר?","o":["ההסבר של יעל אינו נכון מאחר שהתקנון המצוי מסדיר רק את הסכומים המשולמים לוועד הבית כדמי אחזקה.","ההסבר של יעל אינו נכון - ייתכן שעל הבניין יכול הן התקנון המצוי והן תקנון מוסכם הקובע עניינים מהותיים הנוגעים לזכויותיהם הקנייניות של בעלי הדירות.","ההסבר של יעל נכון, מאחר שבבניין בו בעלי הדירות לא קבעו תקנון מוסכם, יחול התקנון המצוי הנותן מענה לנושאים הנוגעים למערכת היחסים בין בעלי הדירות ולאחזקת הרכוש המשותף בבניין.","ההסבר של יעל אינו נכון - התקנון המצוי בידי וועד הבית המתמנה ע\"י המפקח על הבתים המשותפים"],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2017-01#23","e":16,"n":23,"s":"אברהם מתעניין ברכישת נכס מקרקעין באזור יהודה ושומרון ולשם כך הוא מבקש לקבל מידע בדבר הזכויות הקנייניות בנכס.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא נכון ביותר?","o":["אברהם צריך לפנות לרשם המקרקעין בלשכת רישום המקרקעין הרלוונטית (\"טאבו\").","לא ניתן לקבל מידע בדבר הזכויות הקנייניות של מקרקעין המצויים ביהודה ושומרון.","אברהם יפנה לממונה על הרכוש הממשלתי והנטוש באזור יהודה ושומרון או למשרדי רישום המקרקעין במינהל האזרחי, או אל החברה המשכנת העוסקת בשיווק והכנת רישום הנכס.","אברהם יפנה למשרדי רשות מקרקעי ישראל בירושלים."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2017-01#24","e":16,"n":24,"s":"בבית משותף בהוד השרון קיימות 10 דירות זהות בשטחן ולכל אחת חלק שווה ברכוש המשותף. 7 בעלי דירות מעוניינים להרוס את הבניין ולהקימו מחדש במסגרת תמ\"א 38. שלושה בעלי דירות מתנגדים לתוכנית המוצעת. נציגות הבית המשותף הודיעה לבעלי הדירות כי הרוב הקיים (70%) מספיק כדי לקבוע שהתוכנית יכולה לצאת לדרך.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא נכון ביותר?","o":["נציגות הבית המשותף צודקת - הסכמתם של 7 בעלי דירות מתוך 10 מספיקה לשם קבלת החלטה על הריסת בניין קיים והקמתי מחדש בהתאם לתוכנית החיזוק, בכפוף לקבלת אישור מבית משפט השלום.","נציגות הבית המשותף טועה - ביצוע עבודה ברכוש המשותף, שמטרתה הריסת בניין קיים והקמתו מחדש בהתאם לתוכנית החיזוק, טעונה הסכמה מראש של כל בגלי הדירות בבניין ואולם בהיעדר הסכמה של כל בעלי הדירות רשאים 8 בעלי דירות בבית המשותף האמור לפנות למפקח על המקרקעין לאישור התכנית.","נציגות הבית המשותף טועה - בעלי הדירות לא יכולים לקבל החלטה על הריסת בניין במסגרת תוכנית החיזוק, מאחר שבמסגרת תוכנית תמ\"א 38 ניתן רק לחזק בניין קיים מבלי להורסו.","נציגות הבית המשותף צודקת, מספיק רוב של 2/3 מבעלי הדירות והרכוש המשותף."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2017-01#25","e":16,"n":25,"s":"משה הוא בעל מגרש אחד בלבד המעוניין למוכרו לקבלן הבניין מר שמואל רחמים, כדי שהוא יקים עליו בית דירות וקומת מסחר, ולדבריו העיסקה אינה חייבת במע\"מ.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא נכון ביותר?","o":["העיסקה חייבת במע\"מ.","העיסקה חייבת במע\"מ, רק אם הקבלן רחמים יבנה על המגרש בניין משרדים.","העיסקה חייבת במע\"מ רק אם הקבלן יבנה בניין למגורים.","אין חובת תשלום מע\"מ בעיסקת מקרקעין."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2017-04#1","e":17,"n":1,"s":"ראובן פנה אל משה המתווך בבקשה למצוא עבורו דירת מגורים בת 4 חדרים בבית משותף. מספר ימים לאחר מכן פנה שמעון למשה המתווך בבקשה כי ימצא רוכש לדירתו אשר הינה בת 4 חדרים. שמעון ציין בפני משה כי כאשר הוא רכש אותה מהקבלן, היא הייתה בת 3 חדרים (שני חדרי שינה וסלון) וכי במסגרת שיפוץ יסודי שעשה בדירה, הוא אף הוסיף לדירה חדר נוסף ללא היתר בנייה כדין. על כן, כעת כוללת הדירה 3 חדרי שינה וסלון. שמעון מבקש ממשה שלא לגלות נתון זה לרוכשים פוטנציאליים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לאור חובת הסודיות החלה על משה, משה לא יגלה פרט זה לראובן ו/או לכל רוכש פוטנציאלי אחר, כפי שנתבקש על ידי שמעון.","חובת הנאמנות שי למשה כלפי ראובן ו/או כלפי רוכשים פוטנציאליים אחרים, מחייבת את משה לגלות פרט זה לרוכשים מבלי כל קשר לבקשתו של שמעון.","משה לא צריך לגלות נתון זה לראובן, שכן הדירה כיום הינה בת 4 חדרים וזה מה שראובן ראה ורצה ואין זה רלוונטי כמה חדרים היו לדירה בעת הרכישה מהקבלן או כיצד הורחבה הדירה.","משה יסביר לשמעון כי אינו יכול לקבל את בקשתו וכי חלה עליו חובת גילוי עניין זה לכל רוכש פוטניצאלי וככל שלא יצליח לשכנע את שמעון כי אין נתון זה בסודיות, לא יסכים לקבל על עצמו את הטיפול במכירת הדירה."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2017-04#2","e":17,"n":2,"s":"בבית משותף שבו 28 דירות בהרצליה הותקנו שתי מעליות. מר אליהו, בעליה של דירה אחת בבניין, דורש כי באחת המעליות יותקן \"מנגנון פיקוד שבת\", כך שהמעלית תופעל במהלך השבת כ\"מעלית שבת\" וכי כל הוצאות ההתקנה וההפעלה יחולו על כל הדיירים. כל בעלי הדירות בבניין מסכימים לדרישתו של מר אליהו להתקנת \"מנגנון פיקוד השבת\" אך מסרבים לדרישתו כי יישאו בהוצאות התקנת המנגנון האמור ובהוצאות ההחזקה וההפעלה הנובעות מהפעלת המעלית כמעלית שבת.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שכל בעלי הדירות מסכימים לדרישתו של מר אליהו בנוגע להתקנת המנגנון והפעלת המעלית כמעלית שבת- על כל בעלי הדירות בבניין לשאת בכל ההוצאות הכרוכות בכך בהתאם לחלקם היחסי ברכוש המשותף.","מאחר שכל בעלי הדירות מסכימים לדרישתו של מר אליהו- על כל בעלי הדירות בבניין לשאת בהוצאה החד פעמית של התקנת \"מנגנון פיקוד שבת\" בהתאם לחלקם היחסי ברכוש המשותף, ואילו על מר אלינו לשאת בהוצאות ההחזקה וההפעלה הנובעות מהפעלת המעלית כמעלית שבת.","רק הדורשים התקנת מנגנון \"פיקוד שבת\" והפעלת המעלית כמעלית שבת, יישאו בהוצאות התקנת המנגנון האמור ובהוצאות ההחזקה הנובעות מהפעלת המעלית כמעלית שבת.","מאחר שכל בעלי הדירות מסכימים לדרישתו של מר אליהו בנוגע להתקנת המנגנון והפעלת המעלית כמעלית שבת- על כל בעלי הדירות בבניין לשאת במשותף בכל ההוצאות הכרוכות בכך, בשיעור של 50% ומר אליהו יישא ב- 50% הנותרים."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2017-04#3","e":17,"n":3,"s":"אביתר, שוכר דירה בבית משותף, מחנה באופן קבוע את רכבו בחניה, שעל-פי הרישום בלשכת רישום המקרקעין (להלן: \"הטאבו) , צמודה לדירתה של אילנה, הגרה באותו בית משותף, וזאת בניגוד לרצונה של אילנה. אילנה החליטה להגיש למפקח על המקרקעין תביעה נגד אביתר בגין הסגת גבול, אך היא מתלבטת בשאלה האם המפקח אכן מוסמך לדון בסכסוך ביניהם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אילנה יכולה להגיש את התביעה, לפי בחירתה, למפקח על המקרקעין או לבית המשפט המוסמך להכריע בסכסוך בין הצדדים.","מאחר ואביתר הוא שוכר ולא בעל הדירה בבניין, המפקח על המקרקעין אינו מוסמך להכריע בסכסוך בין הצדדים ועל אילנה להגיש תביעה לבית משפט השלום.","על אילנה להגיש תביעה לרשות המקומית המוסכמת להכריע בסכסוך בין הצדדים, בהתאם לתוכנית המיתאר המקומית החלה על המקום.","על אילנה להגיש תביעה למפקח על המקרקעין, שלו הסמכות הבלעדית להכריע בסכסוך בין הצדדים."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2017-04#4","e":17,"n":4,"s":"בני הזוג מוזס ביקשו ממרגלית המתווכת כי תמצא עבורם בית עם גינה, ללא בעיות רישום. מרגלית איתרה עבורם בית צמוד קרקע בגבעתיים ששטחו הבנוי הוא 250 מ\"ר. כשבוע לאחר החתימה על הסכם המכר התברר לבני הזוג מוזס כי מתוך 250 מ\"ר הבנויים ניתן בעיריית גבעתיים היתר בנייה ל-150 מ\"ר בלבד וכי לא ניתן להכשיר את הבנייה שנבנתה ללא היתר. בתגובה לכך, מסרבים בני הזוג מוזס לשלם למרגלית את דמי התיווך בגין העיסקה ואף ביטלו את הסכם המכר עליו חתמו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הצדדים נפשנו בעזרת המתווכת לשם התקשרות בעיסקה במקרקעין וחתמו על התחייבות לתשלום דמי התיווך ועל הסכם המכר זו מצד מרגלית בנסיבות אלה, כדי לחייב את בני הזוג מוזס בתשלום דמי התיווך.","הסכם המכר בוטל ע\"י בני הזוג מוזס ורק כתוצאה מכך איבדה מרגלית את זכותה לקבלת דמי תיווך.","בית המשפט רשאי לקבוע כי מרגלית אינה זכאית בנסיבות אלה לדמי תיווך, שכן, לא יידעה את בני הזוג מוזס בנוגע לחריגת הבנייה האמורה, היעדרו של \" היתרי בנייה\" מהווה פרט מהותי שמרגלית אמורה הייתה למסור ללקחו במסגרת חובת הזהירות וההגינות המעוגנת בחוק.","מרגלית זכאית לקבלת דמי תיווך. אין זה מתפקידה לבחון ולבדוק את מצב היתרי הבנייה של הנכס, אלא רק את מיקומו ולזהות בעליו- על עורך הדין שמטפל בעיסקה מוטלת החובה לבדוק את כל שאר הפרטים המהותיים."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2017-04#5","e":17,"n":5,"s":"רונית, שזה עתה סיימה את התמחותה ברפואת עיניים, פנתה לשמעון, מתווך במקרקעין. וביקשה ממנו למצוא עבורה נכס בו תוכל לפתוח את מרפאתה החדשה. שמעון הציע לרונית לרכוש דירת מגורים המתאימה בדיוק למטרותיה בקומת הקרקע בבית דירות משותף במרכז עפולה.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל מניעה שרונית תרכוש את דירת המגורים ותפתח בה מרפאה, ובלבד שלא תטריד את מנוחת השכנים בין השעות 14:00-16:00.","על רונית לקבל הסכמה בכתב מכל בעלי הדירות לפתיחת מפראה בבית המשותף, וכן לפצותם על ירדית ערך דירותיהם, בהתאם להערכת שמאי מקרקעין מוסמך.","על המתווך להפנות את רונית לבדוק אם תוכנית המיתאר (תב\"ע) במקום מאפשרת פתיחת מרפאה, ואם כן- להגיש בקשה לשימוש חריג.","לא ניתן לפתוח מרפאה בדירת מגורים בבית המשותף."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2017-04#6","e":17,"n":6,"s":"יואב רכש דירה בבית משותף ועד מהרה התברר לו כי נציגות בבית המשותף אינה מתפקדת וכי בעלי הדירות, שכינסו אסיפה כללית, לא מצליחים להגיע בינם לבין עצמן להחלטה בדבר בחירת נציגות מוסכמת. יואב מודאג ממצבו המתדרדר והולך של הרכוש המשותף ומתבלט כיצד עליו לפעול.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין חובה בדין כי לכל בית משותף תהיה נציגות לשם ניהול ענייני הבית המשותף- ולכן אין בידיו של יואב לעשות דבר.","יואב רשאי להכריז על עצמו כנציגות הבית המשותף לעמן ניהולו התקין והשוטף של הבית.","יואב רשאי לפנות למפקח על המקרקעין, וזה רשאי למנות נציגות לבית המשותף.","יואב רשאי לפנות לחברת ניהול ולמנות אותה כנציגות הבית המשותף."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2017-04#7","e":17,"n":7,"s":"עקב אישור שינוי בתוכנית מיתאר (תב\"ע) החלה ברובע א' ברמת גן והשבחת ערך הקרקע באזור, החליטה הוועדה המקומית לתכנון ובנייה על חובת תשלום מיידית של היטל השבחה מכל בעלי הדירות ברובע זה. בעלי הדירות מתנגדים נחרצות לתשלום מיידי של ההיטל האמור.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בעקבות השבחת ערך הקרקע בעלי הדירות מחויבים באופן מיידי בתשלום היטל ההשבחה בכל מקרה.","בעקבות השבחת הקרקע בעלי הדירות מחויבים בתשלום היטל השבחה רק בעת מכירת זכויותיהם בנכס, או כאשר יבקשו לבנות לזכויות הנוספות שהוענקו להם.","בעקבות השבחת ערך הקרקע החובה לשלם היטל השבחה חלה רק בעת מכירת הזכויות בנכס והיא חלה רק על מי שרוכש זכויות אלה.","בעקבות השבחת ערך הקרקע החובה לשלם היטל השבחה חלה רק בעת מכירת הזכויות בנכס והיא מוטלת, עפ\"י החוק, בשיעורים שווים על המוכר ועל הרוכש."],"c":[1],"a":false,"note":"","sub":"p_levy"},{"id":"2017-04#8","e":17,"n":8,"s":"רקפת היא בעלת משרד תיווך. אליעזר ודנית הינם בעלים של דירה בערד, והם בחרו להזמין מרקפת שירותי תיווך לצורך מכירת דירתם. לשם כך הם התקשרו עם רקפת בהסכם תיווך בבלעדיות למשך 6 חודשים. לאחר שתמה תקופת הבלעדיות האמורה והדירה לא נמכרה, חתמו הצדדים על הסכמה מפורשת להמשיך ולהתקשר בהסכם בלעדיות נוסך לתקופה של 10 חודשים נוספים. הדירה נמכרה חודשיים לפני תום תקופת הבלעדיות השנייה על ידי מתווך אחר, זאת על אף שרקפת נקטה שתי התקופות בפעולות השיווק הנדרשות בחוק המתווכים. אליעזר ודנית מסרבים לשלם לרקפת את דמי התיווך.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["נוכח הסכם הבלעדיות שנחתם בין הצדדים, זכאית רקפת לדמי תיווך, גם אם הדירה נמכה על ידי אחר.","מאחר שרקפת נקטה בשתי התקופות בפעולות השיווק הנדרשות, היא זכאית לדמי תיווך גם אם הדירה נמכרה על ידי אחר.","מאחר שלא תתאפשר התקשרות נוספת בהסכם בלעדיות מעבר לתקופה הקבועה בחוק, הסכם הבלעדיות ביחס לתקופה השנייה אינו תקף ולכן רקפת אינה זכאית לדמי תיווך.","הסכם בלעדיות שנחתם למשך 6 חודשים אינו ניתן להארכה, לכן רקפת אינה זכאית לדמי תיווך."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2017-04#9","e":17,"n":9,"s":"אסף רכש דירת מגורים בבניין בן 4 קומות (דירה אחת בכל קומה). לאחר ששילם את מלוא התמורה, החליט אסף לפצל את הדירה ל- 2 יחידות דיור נפרדות, אותן יוכל להשכיר בנפרד ובכך להגדיל את התשואה מן הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כל עוד השינוי שביצע אסף בדירה אינו נוגע לצד החיצוני של הבניין ואינו משנה את חזיתו- אין צורך בהיתרי בנייה","כל עוד השינוי שביצע אסף אינו נוגע לצד היחצוני של הבניין ואינו משנה את חזיתו, ואסף קיבל את חתימתם של לפחות מחצית מבעלי הדירות- אין צורך בהיתר בנייה.","כל עוד השינוי שביצע אסף בדירה אינו נוגע לצד החיצוני של הבניין ואינו משנה את חזיתו, ואסף קיבל את חתימתם של לפחות 3/4 מבעלי הדירות- אין צורך בהיתר בנייה","אסף מבקש לשנות את מספר יחידות הדיור בבניין ולכן פעולה כזו מצריכה היתר בנייה כדין."],"c":[3],"a":false,"note":"","sub":"p_permit"},{"id":"2017-04#10","e":17,"n":10,"s":"שמשון הינו בעלים של דירת מגורים הרשומה כתת חלקה בפנקס הבתים המשותפים. הדירה מושכרת לגב' דלילה החל משנת 1986. השכירות מתחדשת בכל שנה בהסכמה טלפונית. לאחרונה טוענת גב' דלילה שהיא דיירת מוגנת, מכיוון שהיא מחזיקה בדירה כ- 30 שנה.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דלילה היא דיירת מוגנת לעניין גובה דמי השכירות והגנה מפני פינוי.","דלילה היא דיירת מוגנת לעניין גובה דמי השכירות בלבד.","דלילה היא דיירת מוגנת לעניין הגנה מפני פינוי בלבד.","דלילה אינה דיירת מוגנת."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2017-04#11","e":17,"n":11,"s":"משה הינו עובד מצטיין באגף מס הכנסה ומיסוי מקרקעין, והוא מיועד לצאת ללימודי שמאות מקרקעין על חשבון מקום עבודתו. כחלק ממילוי תפקידו, ומטעם אגף מס הכנסה מיסוי מקרקעין, החל משה לערוך שומות מקרקעין הערוכות חתומות על ידו כחוות דעת מומחה, אשר יוצגו על ידו בפני בית המשפט.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חוות הדעת שעורך משה הינן בהתאם לחוק.","חוות הדעת שעורך משה אינן בהתאם לחוק.","חוות הדעת חוקיות אם משה ערך אותן בהנחיה ובליווי שמאי מקרקעין מוסמך.","חוות הדעת חוקיות אם אושרו על ידי מנהל מס כנסה ומיסוי מקרקעין."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2017-04#12","e":17,"n":12,"s":"חיים גר בבית משותף ישן הדורש שיפוץ. חיים הינו דייר ערירי אשא אינו מעוניין בכל שינוי בסביבתו הקרובה. לאחרונה החליטה משה, שכנו של חיים, כי הוא מעוניין לשפץ מיוזמתו את הקומה בה שניהם מתגוררים. במסגרת השיפוץ יחול שינוי ברכוש המשותף ולשם כך פונה משה אל חיים לקבל את הסכמתו. חיים מסרב לתת את הסכמתו לעבודות השיפוץ ודלעתו, הדבר אמור למנוע ממשה מלבצע את עבודות השיפוץ.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חיים צודק, מאחר שמשה מעוניין לבצע את עבודות השיפוץ בקומה בה שניהם גרים, הוא חייב לקבל את הסכמת כל דיירי הקומה לשיפוץ המבוקש.","חיים צודק, משה חייב לקבל את הסכמת כל דיירי העניין לביצוע עבודות השיפוץ ומאחר שהוא מתנגד- לא יתקבל אישור כאמור.","חיים טועה, משה יכול לפנות לכל בעלי הדירות בבניין, ואם יקבל את הסכמת רובם, יוכל לבצע את עבודות השיפוץ גם ללא הסכמתו של חיים","חיים טועה, משה יכול לפנות לכל בעלי הדירות בבניין, ואם יקבל את הסכמת לפחות 60% מבעלי הדירות, יוכל לבצע את עב
