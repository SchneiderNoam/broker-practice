י תיווך אך ורק אם תוכיח כי מסרה לגלן העתק מכתב ההזמנה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2018-07#16","e":21,"n":16,"s":"מי ממנה את השמאי המכריע לצורך הכרעה במחלוקת על סכום הפיצוי לתובע בשל פגיעה במקרקעין?","o":["הוועדה המקומית אשר החליטה כי התובע זכאי לפיצוי תמנה שמאי מכריע מתוך רשימת השמאים המכריעים.","יו''ר ועדת הערר לפיצויים ימנה את השמאי המכריע מתוך רשימת השמאים המכריעים.","הוועדה המקומית אשר החליטה כי התובע זכאי לפיצוי, ביחד עם התובע והמשיב, יחליטו על השמאי המכריע מתוך רשימת השמאים המכריעים.","יושב ראש מועצת שמאי המקרקעין ימנה שמאי מכריע מתוך רשימת השמאים המכריעים."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2018-07#17","e":21,"n":17,"s":"רועי רכש מהקבלן פרץ דירות 3 חדרים בשטח של 85 מ''ר, כפי שצוין בחוזה ובמפרט שצורף לו. לאחר קבלתה ביצע רועי מדידה של הדירה באמצעות מודד מוסמך, שקבע כי שטח הדירה הוא 82.5 מ''ר בלבד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רועי אינו זכאי לפיצוי בגין הסטייה מהמפרט, מאחר שקיימת אפשרות לסטייה קבילה בשיעור של עד 3% משטח הדירה כמפורט בהסכם ובין השטח למעשה.","רועי זכאי לפיצוי בגין הסטייה מהמפרט, שהיא גדולה מ- 2.5% משטח הדירה כמפורט בהסכם ובין השטח למעשה.","רועי אינו זכאי לפיצוי בגין הסטייה מהמפרט, מאחר שקיימת אפשרות לסטייה קבילה בשיעו של עד 5% משטח הדירה כמפורט בהסכם ובין השטח למעשה.","רועי זכאי לפיצוי בגין הסטייה מהמפרט, שהיא גדולה מ- 2% משטח הדירה כמפורט בהסכם ובין השטח למעשה."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2018-07#18","e":21,"n":18,"s":"חנן ונוע הינם בעלים משותפים של שתי דירות. חלקו של חנן 40% בכל דירה וחלקה של נועה 60% בכל דירה. לאחר מספר שנים החליטו חנן ונועה על פירוק השיתוף ביניהם ורצו לייחד דירה לכל אחד, תוך העברת תשלומי איזון משותף לשותף. שווי כל דירה שכל אחד מהשותפים יקבל הוא 2,000,000 ש''ח.\nאיזו מהמשפטים הבאים הוא הנכון ביותר לעניין התקבול?","o":["נועה זכאית לתקבול בסך 400,000 ש''ח מחנן.","נועה אינה זכאית לתקבול מחנן, כי הייתה חלוקה שווה של הדירות ביניהם.","נועה זכאית לתקבול בסך 200,000 ש''ח מחנן.","נועה זכאית לתקבול בסך 800,000 ש''ח מחנן."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2018-07#19","e":21,"n":19,"s":"עניינה של התובענה הכספית בפס''ד תא 35922/07 מרדכי עוז נ' משה עזרא הוא שיתוף פעולה בין מתווכים בקשר למכירות דירה וחלוקת דמי התיווך שהתקבלו.\nבנסיבות העניין ובהתאם לפסק הדין, מה היו העקרונות הבסיסיים שהובילו את כב' השופט בהחלטתו לקבל את גירסת התובע במלואה?","o":["על המתווך חלה חובה לנהוג בנאמנות, בהגינות ונקיטת אמצעים לקבלת מידע מהותי בנוגע לנכס שבטיפולו ואף לדאוג להוציא נסח רישום. הסכמתם בין מתווכים יכולים להיעשות גם בעל פה.","על המתווך חלה חובה לנהוג בנאמנות, הגינות ונקיטת אמצעים לקבלת מידע מהותי בנוגע לנכס שבטיפולו ועל עורך הדין המטפל בעסקה לברר מי הבעלים של הנכס ולדאוג להוציא נסח רישום. הסכמים בין המתווכים יהיו בכתב.","על המתווך חלה חובה לנהוג בנאמנות, הגינות ונקיטת אמצעים לקבלת מידע מהותי בנוגע לנכס שבטיפולו. על המוכר להוציא נסח רישום לגבי הנכס שבבעלותו ולהראותו לרוכש. הסכמים בין מתווכים יהיו בכתב.","על המתווך חלה חובה לנהוג בנאמנות, הגינות ונקיטת אמצעים לקבלת מידע מהותי בנוגע לנכס שבטיפולו על רוכש הנכס ולברר מי הבעלים של הנכס שאותו הוא מעוניין לרכוש. הסכמים בין מתווכים בכתב."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2018-07#20","e":21,"n":20,"s":"בני הזוג ברלב חיפשו דירה לרכישה באזור המרכז. בעקבות מודעה שפורסמה בעיתון הם יצרו קשר עם אבשלום המתווך, אשר החתים אותם על טופס להזמנת שירותי תיווך והראה להם דירה ברחוב היוגב ברמת- גן. בעת הביקור בדירה הבחינו בי הזוג כי נדרש שיפוץ יסודי וכי המחיר שהוצג להם אינו ראלי, ועל כן ביקשו לבדוק אפשרות להוריד את המחיר. אבשלום מוסר להם כי מפתחות הדירה מוחזקים בבלעדיות אצלו, כי ''אין על מה לדבר... אלו המחירים באזור'' ונתן להם להבין כי המחיר אינו ניתן לוויכוח. אבשלום אף סירב להתקשר לבעלת הדיר במטרה לנסות להוריד את המחיר. כשבועיים לאחר מכן ראו בני הזוג את הדירה במקרה באמצעות מתווך אחר ובנוכחות בעלת הדירה. כשאמרו למתווך האחר שהמחיר המבוקש אינו ריאלי, הבטיח התווך לעשות מאמצים במטרה להוריד את המחיר ואכן הצליח בכך. בני הזוג ניהלו מו''מ עם בעלת הדירה, שנמשך מספר שבועות, עד שלבסוף הוסכם כי ירכשו את הדירה במחיר שהיה לביעות רצונם. הצדדים חתמו על הסכם מכר ושילמו דמי תיווך למתווך האחר. עתה תובע אבשלום מבני הזוג את דמי התיווך בגין העסקה.\nבנסיבות העניין, עפ''י פס''ד ת''א 10272-02-11 ב.פ הנשיא סוכניות נדל''ן בע''מ נ' בקרמן ואח', איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אבשלום זכאי לדמי תיווך ; הוא היה הגורם היעיל בעיסקה, הוא זה שהציג בפני בני הזוג את הדירה לראשונה, הוא השקיע בפרסומה ואף דאג להחתים את לקוחותיו על טופס להזמנת שירותי תיווך.","אבשלום הפראת חובתו כלפי לקוחותיו בכך שלא פנה לבעלת הדירה, לא העביר לה הצעת רכישה ולא פעל להורדת המחיר המבוקש – משכך הוא לא זכאי לדמי תיווך.","אבשלום זכאי לדמי תיווך ; הדירה נמכרה לרוכשי שהוא הראה להם את הדירה ואשר חתמו לו על הזמנת תיווך, וכן הציג להם את עמדת המוכרים לא לרדת מהמחיר.","אבשלום והמתווך האחר, שניהם היו הגורמים היעילים בעסקה, ומשכך עליהם לחלוק ביניהם בדמי התיווך ששולמו ע''י בני הזוג ברלב"],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2018-07#21","e":21,"n":21,"s":"לוועדת המשמעת הוגשה קובלנה נגד מתווך מקרקעין בגין עבירה של התנהגות שאינה הולמת את עיסוקו. במהלך הדיון התגלו והוכחו עובדות, שלא נטענו בקובלנה, המגבשות נגד המתווך גם עבירה של אי גילוי עניין אישי. בתום הדיון, לאחר שניתנה לו הזדמנות סבירה להתגונן, קבעה ועדת המשמעת כי המתווך עבר גם עבירה של אי גלוי כאמור,וזאת בנוסף לעבירה שיוחסה לו מלכתחילה בקובלנה שהוגשו נגדו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על התווך לבקש כי חברי ועדת המשמעת יפסלו את עצמם מלדון בעניינו, מאחר שקיימות נסיבות שיש בהן כדי ליצור חשש ממשי למשוא פנים בבירור הקובלנה.","ועדת המשמעת רשאית לקבוע כי המתווך עבר כל עבירה פלילית או משמעתית שהתגלתה מן העובדות שהוכחו לפניה, ובלבד שניתנה לו הזדמנות להתגונן והוא מיוצג ע''י סניגור פלילי.","ועדת המשמעת רשאית, ללא תנאי, לקבוע כי המתווך עבר כל עבירה שהתגלתה מן העובדות שהוכחו לפני, לרבות עובדות שלא נטענו בקובלנה.","ועדת המשמעת רשאית לקבוע כי המתווך עבר כל עבירת משמעת שהתגלתה מן העובדות שהוכחו לפניה, לרבות עובדות שלא נטענו בקובלנה, ובלבד שניתנה לו הזדמנות סבירה להתגונן."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2018-07#22","e":21,"n":22,"s":"ערן, קבלן ותיק, הקים בניין חדש על מגרש שבבעלותו ביבניאל. ערן רשם את הבניין בפנקס הבתים המשותפים, למרות שכל הדירות בבניין הן בבעלותו. עתה, עוד בטרם נמכרו הדירות לאחרים, מבקש ערן לרשום תקנון מוסכם אשר יסדיר את היחסים בין בעלי הדירות העתידיים ואת זכויותיהם וחובותיהם בקשר לבית המשותף. המפקח על המקרקעין מסרב לבצע, בשלב זה, רישום של תקנון מוסכם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המפקח צודק ; תקנון מוסכם לא ניתן לרישום בשעה שהבית המשותף על כל דירותיו הוא בבעלותו של אדם אחד.","המפקח טועה ; בשעה שהבית המשותף על כל דירותיו בבעלותו של אדם אחד ניתן לרשום רק תקנון מצוי כתקנון שנרשם על ידי בעלי הדירות.","המפקח טועה ; תקנון מוסכם ניתן לרישום אף בשעה שהבית המשותף על כל דירותיו הוא בבעלותו של אדם אחד.","המפקח צודק ; רק הבעלים העתידיים של הדירות ששני שלישים מהרכוש המשותף צמודים לדירותיהם רשאים לערוך תקנון מוסכם, לרשום אותו ולשנות את הוראותיו."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2018-07#23","e":21,"n":23,"s":"איזה מבין המשפטים הבאים אינו נכון?","o":["העברת זכויות בזכות במקרקעין הנעשית על פי פסק דין שניתן אגב הליכי גירושין, לא יראוה כמכירה לעניין חוק מיסוי מקרקעין (שבח ורכישה).","במכירות זכות במקרקעין יהא הרוכש חייב במס רכישה.","בפעולה באיגוד מקרקעין יהא הרוכש חייב במס רכישה.","הורשה מהווה מכירה או פעולה באיגוד לעניין חוק מיסוי מקרקעין (שבח ורכישה)."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2018-07#24","e":21,"n":24,"s":"איזה מבין המשפטים הבאים מגדיר באופן הנכון ביותר את המושג ''שיכון חלוף'' הקבוע בחוק?","o":["בהליכי חיזוק בתים משותפים מפני רעידות אדמה, לא יינתן היתר לתמ''א 38 אלא לאחר שהועמד שיכון חלוף סביר למי שהיה דר בבית מכוח זכות שבדין או זכות שביושר במועד פרסום ההודעה על הכוונה לחזק את הבניין.","בהליכי הפקע, לא יפונה בית מגורים שנועד בתוכנית להריסה, אלא לאחר שהועמד שיכון חלוף סביר למי שהיה דר בבית מכוח זכות שבדין שביושר במועד פרסום ההודעה על הכוונה לרכוש את המקרקעין.","בית משותף שנהרס, כולו או מקצתו, מכל סיבה שהיא, ובעלי הדירות ששלושה רבעים לתקנו – יורה המפקח על המקרקעין, בטרם מתן היתר, על שיכון חלוף לדייריו.","בהליכי ערך לפיצויים ולהיטל השבחה, לא תכריע ועדת הערר בעניינו של אדם, אלא לאחר שניתנה לו ערבות מתאימה והועמד לו מראש שיכון חלוף סביר למקרה שיחויב בתשלום ההשבחה."],"c":[1],"a":false,"note":"","sub":"p_levy"},{"id":"2018-07#25","e":21,"n":25,"s":"מושב שורש הוא אגודה שיתופית חקלאית, אשר חוכרת קרקע מרשות מקרקעי ישראל. המושב הקצה שטחי קרקע לחברי האגודה החקלאים למטרות מגורים ועיבוד חקלאי. נדב הוא חבר באגודה השיתופית, והוא מתגורר במושב שורש, על אף שמקור פרנסתו העיקרי הוא בנגרות ולא בחקלאות. בתחילת השנה פנה נדב להנהלת המושב וביקש להקצות לו משק עזר לנגריה ומגורים.\nבנסיבות העניין איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בקשתו של נדב תידחה – במושבים ניתן להקצות אך ורק שטחי קרקע, המכונים ''נחלות'' וזאת למטרות עיבוד חקלאי בלבד.","בקשתו של נדב תידחה – רק במקרים בהם חברי המושב חוכרים את הקרקע ישירות מרשות מקרקעי ישראל, ולא באמצעות אגודה שיתופית, ניתן להקצות משקי עזר למלאכה ולמגורים.","בקשתו של נדב עשויה להתקבל – משק עזר למלאכה מיועד לכל אדם אשר החקלאות היא לא מקור פרנסתו העיקרי, בתנאי שלא יעלה על 85 מ''ר.","בקשתו של נדב עשויה להתקבל – משק עזר מיועד, בין היתר, למגורים ולמלאכה לחברי אגודה שמתגוררים בישוב חקלאי, אבל החקלאות היא לא מקור הפרנסה העיקרי שלהם."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2019-01#1","e":22,"n":1,"s":"חברת בז'ה, העוסקת במתן שירותי תיווך וניהול לבתים משותפים, שכרה את שירותיה של נועה, מעצבת גרפית מדופלמת, לצורך עיצובו של החוזה האחיד המיועד לקהל לקוחותיה.\nנועה מעוניינת שהחוזה יעוצב באלמנטים הבאים:\nI דף הנייר יהיה בצבע לבן האותיות בצבע שחור.\nII האותיות תהיינה נטויות.\nIII האותיות תהיינה בגודל של 4 מילימטרים.\nIV הרווח בין השורות יהיה בגודל של 1 מילימטר.\nאיזה/ אילו מבין האלמנטים לעיל סותרים את הוראות הדין?","o":["I ו- III.","II.","II ו- IV.","III ו- IV."],"c":[2],"a":false,"note":"","sub":"k_consumer"},{"id":"2019-01#2","e":22,"n":2,"s":"לאחרונה עלו יחסי הנישואין של עירית ויוסי על השרטון והשניים החליטו להתגרש.\nחלוקת הרכוש המשותף נעשתה בפסק דין שניתן בהליך הגירושין.\nיוסי קיבל את כל המיטלטלין של השניים ואילו עירית קיבלה את המגרש בכפר אדר, אשר היה רשום על שמם (במהלך הנישואיון גרו השניים בדירת מגוריהם בתל אביב). \nהאם העברת הזכויות במגרש בכפר אדר מיוסי לעירית חייבת במס שבח ? מדוע ?","o":["לא, העברת זכויות במקרקעין נעשתה בהליך גירושין ולכן אינה חייבת במס שבח.","כן, לאור הגירושין עירית ויוסי אינם בגדר \"קרובים\" ולכן חלוקת הזכויות חייבת במס.","כן, הואיל ויוסי קיבל תמורה כנגד המגרש ( המיטלטלין ).","כן, חלוקת רכוש בגירושין פטורה ממס רק ביחס לדירת המגורים בה התגוררו המתגרשים טרם הגירושים."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2019-01#3","e":22,"n":3,"s":"אלי מתווך דירות בקריית אונו, אשר לאחרונה חש בירידה בהיקף העבודה.\nמשכך, החליט אלי לשלוח מסרונים (הודעות SMS) ללקוחותיו מהעבר והציע את שירותי התיווך שלו עבור עמלה מופחתת של 0.5% במשך החודש הקרוב.\nדקות אחדות לאחר משלוח ההודעה, חזרה אליו במסרון טליה, אחת מלקוחות העבר שלו, והודיע לו כי היא מקבלת את הצעתו בשמחה.\nבעקבות זאת הבין אלי כי עמלת התיווך שהציע נמוכה מידי.\nהוא שלח מיד מסרון נוסף לכל לקוחותיו, כולל לטליה, ובו כתב כי הוא חוזר בו מן ההצעה שנשלחה וכי הוא יעביר למחרת מסרון עם הצעה מתקונת.\nלאחר מכן שלח גם לדודו, לקוח ותיק מסרון והודיע גם הוא כי הוא מקבל את הצעתו.\nבנסיבות העניין, האם אלי יכול לחזור בו מהצעתו למתן שירותי תיווך בעמלה מופחתת של 0.5%?","o":["אלי אינו יכול לחזור בו מהצעתו, הן ביחס לטליה והן יחס לדודו.","אלי אינו יכול לחזור בו מהצעתו ביחס לטליה. באשר לדודו- אם דודו ראה את המסרון השני של אלי לפני ששלח את המסרון שלו, אלי יכול לחזור בו מהצעתו. אם דודו לא ראה את המסרון השני לפני ששלח מסרון לאלי, אלי אינו יכול לחזור בו מהצעתו.","אלי יכול לחזור בו מהצעתו - הן ביחס לטליה והן ביחס לדודו.","אלי אינו יכול לחזור בו ביחס לטליה, אך הוא יכול לחזור בו ביחס לדודו."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2019-01#4","e":22,"n":4,"s":"ורד וישראל כרתו חוזה לפיו ורד תשכור את דירת 3 החדרים בראש העין, אשר בבעלותו של ישראל.\nלפי החוזה, הדירה תהא מוכנה לכניסתה של ורד ביום 1.1.2019.\nהצדדים סיכמו על פיצוי מוסכם בסך 1000 ש\"ח אם הדירה לא תעמוד לרשותה של ורד בזמן.\nכשבועיים לפני שהייתה אמורה להיכנס ורד לדירה, התקשר אליה ישראל והודיעה לה כי הוא נאלץ לדחות את כניסתה לדירה בחודש ימים.\nורד הסבירה לישראל כי אם היא תיאלץ להישאר בדירתה הנוכחית חודש נוסף, הדבר יעלה לה 3000 ש\"ח.\nמשכך, הציע ישראל כי ורד תקטין את הנזק שעלול להיגרם לה כתוצאה מהאיחור,\nותעבור לדירה דומה אחרת באותו בניין אשר בבעלותו לחודש זה, כאשר הוא יישא בעלויות המעבר.\nורד סירבה להצעה ובשל כך נאלצה לשלם 3000 ש\"ח לבעל הדירה הנוכחי על מנת להישאר חודש נוסף בדירה.\nבנסיבות העניין, מה גובה הפיצויים שורד צפויה לקבל בשל הפרת החוזה ללא הוכחת נזק?","o":["ככל הנראה לא פחות מ-1000 ש\"ח.","ככל הנראה לא פחות מ-3000 ש\"ח.","ככל הנראה לא פחות מ-4000 ש\"ח.","ורד אינה צפויה לקבל פיצוי כלל, מאחר שסירבה להצעתו של ישראל."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2019-01#5","e":22,"n":5,"s":"ארי ושלמה גרים בשכנות זה לזה.\nלשלמה יש בגינתו עץ קלמנטינות שופע , אשר שלמה משקיע בו את מירב זמנו.\nחלק מהקלמנטינות המובחרות ביותר בעץ נשרו לתחום גינתו הפרטית המגודרת של ארי. \nדרצ'י, הגנן אשר מטפח אחת לשבוע את גינתו של ארי, נתקל בקלמנטינות המובחרות ונטל אותן לעצמו.\nכל אחד מהשלושה טוען כעת לבעלות על הקלמנטינות.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הקלמנטינות שייכות לשלמה, שכן העץ גדל בגינתו ובזכות השקעתו הרבה.","הקלמנטינות שייכות לארי, שכן הן נשרו לתחום גינתו.","הקלמנטינות שייכות לדרצ'י, מכיוון שמתוקף עבדותו כגנן הייתה לו גישה חוקית לגינתו של ארי.","הקלמנטינות שייכות באופן שווה לכל השלושה."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2019-01#6","e":22,"n":6,"s":"פלג מעוניינת למשכן מקרקעין אשר אינם רשומים במרשם המקרקעין.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["פלג יכולה לרשום את השיעבוד אצל רשם המשכונות.","פלג יכולה לרשום את השיעבוד בפנקסי המקרקעין.","פלג אינה יכולה כלל לרשום את השיעבוד, הואיל ומדובר במקרקעין שאינם רשומים במרשם המקרקעין.","פלג יכולה לרשום את השיעבוד אצל רשות מקרקעי ישראל."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2019-01#7","e":22,"n":7,"s":"פנינה ויגאל הינם בעלים של קרקע חקלאית בתלמי מנשה.\nלאחרונה, שונה יעוד הקרקע מקרקע חקלאית לקרקע לבנייה.\nגיא, שמאי שמונה מטעם הוועדה המקומית, קבע כי ערך הקרקע עלה ב-200,000 ש\"ח כתוצאה משינוי הייעוד.\nפנינה ויגאל החליטו לנצל הזדמנות נדל\"נית זו והתקשרו בחוזה למכירת הקרקע לרוני.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על פנינה ויגאל לשלם היטל השבחה בגובה 100,000 ש\"ח.","על פנינה ויגאל לשלם היטל השבחה בגובה 200,000 ש\"ח.","על רוני לשלם היטל השבחה בגובה 100,000 ש\"ח.","על רוני לשלם היטל השבחה בגובה 200,000 ש\"ח."],"c":[0],"a":false,"note":"","sub":"p_levy"},{"id":"2019-01#8","e":22,"n":8,"s":"היכן רושמים זיקת הנאה לטובת דירה הרשומה בחברה משכנת, ואשר טרם נרשמה בפנקסי המקרקעין?","o":["הגם שהדירה טרם נרשמה בפנקסי המקרקעין, זיקת ההנאה עצמה תירשם בפנקסי המקרקעין.","זיקת ההנאה תירשם אצל החברה המשכנת, שכן הדירה טרם נרשמה בפנקסי המקרקעין.","זיקת ההנאה תירשם אצל רשם המשכונות, שכן מדובר בזכות חוזית ולא קניינית.","זיקת ההנאה תירשם במינהל מקרקעי ישראל."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2019-01#9","e":22,"n":9,"s":"עירית ויוסי חוכרים את ביתם בהר אדר מרשות מקרקעי ישראל (רמ\"י) לתקופה של 99 שנים.\nהשניים החליטו לעבור להזדקן ביחד בתל אביב, ומשכך החליטו להשכיר את ביתם בהר אדר להארי, נוצרי בעל אזרחות אמריקאית בלבד, לתקופה של 10 שנים.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["עירית ויוסי אינם יכולים, בשום מצב, להשכיר את ביתם להארי, מכיוון שאינו ישראלי.","עירית ויוסי יכולים להשכיר את ביתם להארי בלי אישור מאף אחד.","עירית ויוסי יכולים להגיש בקשה להשכיר את ביתם להארי, ליושב ראש מועצת מקרקעי ישראל.","עירית ויוסי יכולים להגיש בקשה להשכיר את ביתם להארי לרשם המקרקעין."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2019-01#10","e":22,"n":10,"s":"מעיין היא בעלת נכסים רבים וביניהם בניין משרדים בתל אביב.\nבשנת 2016 מכרה מעיין לירדן, בן אחותה, את אחת מדירותיה במחיר הנמוך ב- 10% משווי השוק שלה.\nירדן לא רשם את העסקה בלשכת רישום המקרקעין ואף לא רשם לטובתו הערת אזהרה.\nלאחר כשנתיים, מעיין מכרה בטעות לאילון את אותה הדירה שמכרה לירדן.\nזאת, מבלי שאילון בדק את הדירה או את מרשם המקרקעין, ומבלי שרשם הערת אזהרה.\nבסיטואציה המתוארת לעיל, ובהנחה שאילון טרם הספיק לרשום את הדירה על שמו, מי צפוי לזכות בבעלות על הדירה לפי הפסיקה שנקבעה בע\"א 2643/97 שלמה גנז נ' בריטיש קולוניאל חברה בע\"מ ואח' -ירדן או אילון ? מדוע?","o":["ירדן, בשל העובדה שהוא הרוכש הראשון ושאילון לא בדק את מרשם המקרקעין.","אילון, בשל העובדה שירדן רכש את הדירה המחיר נמוך משווי השוק שלה.","ירדן, בשל העובדה שמעיין מכרה לאילון את את הדירה בטעות.","אילון, בשל העובדה שירדן לא פעל לרישום העיסקה בלשכת רישום המקרקעין."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2019-01#11","e":22,"n":11,"s":"יונתן והדר החליטו לטוס לחופשה בזנזיבר לרגל אירוסיהם.\nמיד כששבו מחופשתם גילו להפתעתם כי אל דירתם, אשר מצויה בבעלותם, פלש אבנר - שכנם משכבר הימים.\nאבנר נמצא בדירה 14 ימים.\nכיצד יוכלו יונתן והדר לפעול?","o":["יונתן והדר לא יוכלו לעשות דבר מלבד לפנות לבית המשפט.","יונתן והדר יוכלו להוציא את אבנר ממנה מבלי לעשות שימוש בכוח לצורך כך.","יונתן והדר יוכלו להוציא את אבנר ממנה ואף לעשות שימוש בכוח לצורך כך.","יונתן והדר חייבים לפנות משטרה ולמועצה המקומית הרלוונטית על מנת להוציא את אבנר ממנה."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2019-01#12","e":22,"n":12,"s":"עמרי ושרון חתמו על מסמך והעניקו לו את הכותרת \"זיכרון דברים\".\nבאותו המסמך, אשר ביטא את רצון הצדדים, נכתב כי שרון מתחייבת למכור את דירתה,\nכי חוזה בין הצדדים ייחתם בתוך שבוע ימים וכי מכירת הדירה תתבצע בתמורה לסכום של 1,650,000 ש\"ח,\nאשר יועברו לשרון בעת העברת הבעלות משרון לעמרי במרשם המקרקעין.\nבהנחה שהמסמך האמור מקיים את תנאי המסוימות,\nהאם בנסיבות העניין ועל פי הפסיקה שנקבע בע\"א 158/77 חוה רבינאי חברת השקד בע\"מ (בפירוק), נכרת חוזה מחייב בין השניים?","o":["עמרי ושרון לא כתבו שזיכרון הדברים מחייב ומכאן שלא נכרת ביניהם חוזה מחייב.","עמרי ושרון התכוונו ליצור קשר חוזי מחייב ומכאן שזיכרון הדברים הוא חוזה מחייב.","עמרי ושרון העניקו למסמך את הכותרת \"זיכרון דברים\" ומכאן שאינו יכול להיחשב כחוזה מחייב.","בשל העובדה שזיכרון הדברים מתייחס לפעולות עתידיות של עמרי ושרון - לא ניתן לראות בו חוזה מחייב."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2019-01#13","e":22,"n":13,"s":"אושרי ותמי הקימו יחדיו בית מלון משגשג על מגרש המצוי בבעלות משותפת של שניהם (30% מהמגרש  בבעלות אושרי ו- 70% מהמגרש בבעלות תמי).\nביום 20.7.2017, עת תמי שהתה בחו\"ל, נתגלתה במרתף בית המלון נזילה חריפה אף החלה להביא לשקיעתם של חלק מעמודי התמך של המלון.\nאושרי לא הצליח לעדכן את תמי באשר לנזילה בשל קשיי תקשורת.  \nהאם הדין מתיר לאושרי לתקן את נזקי הנזילה על דעת עצמו ומבלי לקבל את אישורה של תמי?","o":["הדין לא מתיר לאושרי לתקן את נזקי הנזילה על דעת עצמו, שהרי הוא מחזיק רק ב-30% מזכויות הבעלות בית המלון.","במצב מעין זה הדין מחייב את הסכמת כלל השותפים לתיקון הנזקים.","על אושרי לפנות לבית המשפט על מנת שזה יאפשר לו לפעול ללא אישורה של תמי.","לאושרי מותר לתקן את נזקי הנזילה על דעת עצמו."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2019-01#14","e":22,"n":14,"s":"יותם ורעות רכשו במשותף מגרש ביישוב 'הוד והדר' שבגליל התחתון.\nעל מנת להסדיר את היחסים המשפטיים ביניהם, חתמו השניים ביום 25.10.2010 על הסכם שיתוף שכלל מספר סעיפים, ובין השאר, תניה האוסרת על מי מהם למכור את חלקו לאדם אחר מבלי שקיבל לכך את הסכמת השותף השני, וזאת למשך תקופה של 10 שנים מיום חתימת ההסכם.\nביום 17.8.2018 חתמה רעות על הסכם למכירת חלקה בשותפות לאדם אחר מבלי שקיבלה לכך את אישורו של יותם.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לתניה האוסרת מכירה היה תוקף בעת המכירה ולכן פעולתה של רעות היא כדין.","פעולתה של רעות אינה כדין, שהרי היא נוגדת את התניה האוסרת מכירה.","פעולתה של רעות אינה כדין, שהרי ליותם זכות ראשונים על חלקה במגרש.","לתניה בהסכם מעולם לא היה תוקף עקב פגיעתה בזכות הקניין של רעות, ומכאן שפעולתה היא כדין."],"c":[3],"a":false,"note":"","sub":"l_shared"},{"id":"2019-01#15","e":22,"n":15,"s":"ניסים העניק לשושנה ייפויי-כוח בלתי חוזר לתקופה של 12 חודשים על מנת שזו תמכור את דירתו לשחר.\nהאם ייפויי הכוח האמור יהיה פטור ממס ? מדוע?","o":["לא, בשל העובדה שמדובר בייפויי כוח.","כן, בשל העובדה שייפויי הכוח עוסק במכירת דירתו של ניסים לאדם שלישי.","לא, בשל העובדה שמדובר בייפויי כוח לתקופה העולה על 6 חודשים.","כן, בשל העובדה שמדובר בייפויי כוח בלתי חוזר."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2019-01#16","e":22,"n":16,"s":"לאחר שנעמי חתמה עם לב על הסכם תיווך, לפיו לב יהיה זכאי לתשלום בגובה 1.5% מסכום רכישת הדירה של נעמי אם הקונה יימצא באמצעותו, החליט לב להעתיק את חתימתה של נעמי ולהדביקה עם חוזה אחר, שלפיו הוא זכאי יהיה לקבל 2% מסכום רכישת הדירה של נעמי אם הקונה יימצא באמצעותו.\nבנסיבות המתוארות, מה דינו של לב בגין מעשיו?","o":["מאסר שנה.","מאסר שלוש שנים לפחות.","מאסר חצי שנה.","קנס בסכום כפול מזה שלב היה צפוי להרוויח מביצוע העבירה אותה ביצע."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2019-01#17","e":22,"n":17,"s":"פסק דין רעא 394/88 אנגל שושני ואח' נ' אברון את פורת בע\"מ עסק בשאלה האם מתווך זכאי לקבל את התשלום שלכאורה מגיע לו מן הקונה / המוכר שהיו לקוחותיו גם אם חוזה המכר הופר לבסוף על ידי מי שלא היה לקוחו של המתווך.\nמה נקבע בפסק-הדין האמור ?","o":["המתווך אינו זכאי לתשלום מלקוחו, אך יש בכוחו לתבוע תשלום זה מן הצד שהפר את הסכם המכר.","המתווך זכאי לתשלום מלקוחו וגם בכוחו של לקוחו לתבוע מן הצד שהפר את הסכם המכר החזר על הסכום זה.","המתווך אינו זכאי לתשלום מלקוחו וגם אין בכוחו לתבוע תשלום מן הצד שהפר את הסכם המכר, שכן הסכם זה לבסוף לא יצא אל הפועל.","המתווך זכאי לתשלום חצי מהסכום עמלת התיווך אותו יש בכוחו לתבוע הן מלקוחו והן מן הצד שהפר את הסכם המכר."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2019-01#18","e":22,"n":18,"s":"כתוצאה מאישור תכנית חדשה בעיר עפולה חויבו בעליה של הקרקע לייעוד מסחרי המצויה בתחום התוכנית, להתקין בה מקום לחניית שני כלי רכב.\nבעלי המקרקעין הגישו לוועדה המקומית בעירם תביעת פיצויים בגין פגיעה כתוצאה מהתוכנית.\nהוועדה המקומית קבעה שבעלי המקרקעין אינם זכאים לפיצויים ודחתה את תביעתם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שגתה הועדה המקומית בהחלטתה - מי שביום תחילתה של התוכנית היו בעלי המקרקעין שנפגעו כתוצאה מהוראותיה של התוכנית זכאי לפיצויים מאת הוועדה המקומית.","שגתה הועדה המקומית בהחלטתה - בעלי המקרקעין זכאים לפיצויים בגין פגיעה והפקעה כתוצאה מאישור תוכנית מיוחדת.","צדקה הועדה המקומית בהחלטתה - רק מי שביום תחילתה של התוכנית היו בעלי המקרקעין למגורים שנפגעו כתוצאה מהוראותיה של התוכנית זכאי לפיצויים מאת הוועדה המקומית.","צדקה הועדה המקומית בהחלטתה - במקרה בו חיוב בעל המקרקעין על פי תוכנית להתקין בבניין המועד לעסק מקום לחניית כלי רכב, פטורה הוועדה מתשלום פיצויים, ובלבד שהפגיעה סבירה ואין זה מן הצדק לשלם לנפגע פיצויים."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2019-01#19","e":22,"n":19,"s":"יוכבד, חקלאית אשר התגוררה ועיבדה את נחלתה במושב זרועה, נפטרה בשיבה טובה.\nבצוואתה הורישה את הנחלה, בחלקים שווים, לחמש בנותיה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יוכבד לא יכולה להוריש את הנחלה לחמש בנותיה באמצעות צוואה.","יוכבד לא יכולה להוריש את הנחלה באמצעות צוואה והיה עליה לקבוע מראש מי מחמש בנותיה תהיה \"בת ממשיכה\".","במקרה פטירה הקרקע עובדת רק ל\"בן/בת בכורה כבן/בת ממשיך/כה\".","במקרה פטירה הקרקע חוזרת תמיד לרשותה ועיבודה של רשות מקרקעי ישראל."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2019-01#20","e":22,"n":20,"s":"בבית משותף באשדוד בו שמונה דירות מגורים ושני משרדים, על פי היתר לשימוש חורג, הותקנו שתי מעליות.\nיוגב, בעליה של אחת מדירות המגורים, דורש כי באחת המעליות יותקן \"מנגנון פיקוד שבת\" וכי המעלית תופעל כ\"מעלית שבת\".\nכל בעלי הנכסים בבניין מסכימים לדרישתו של יוגב,\nאך מסרבים לדרישתו לשאת בהוצאות התקנת המנגנון האמור ובהוצאות ההחזקה וההפעלה הנובעות מהפעלת המעלית כמעלית שבת.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בבית משותף שבו חלק רק מהדירות משמשות למגורים לא רשאים רוב בעלי הדירות להחליט על התקנת מנגנון פיקוד שבת, וכן על הפעלת אחת המעליות כמעלית שבת.","מאחר שבבניין שני משרדים על פי היתר לשימוש חורג - רק בעלי הדירות למגורים בבניין חייבים לשאת בהוצאה החד פעמית של התקנת \"מנגנון פיקוד שבת\" בהתאם לחלקם היחסי ברכוש המשותף, ואילו על יוגב לשאת בהוצאות ההחזקה וההפעלה הנובעות מהפעלת המעלית כמעלית שבת.","מאחר שכל בעלי הנכסים מסכימים לדרישתו של יוגב בנוגע להתקנת המנגנון והפעלת המעלית כמעלית שבת - על כל בעלי הנכסים בבניין לשאת במשותף בכל ההוצאות הכרוכות בכך בשיעור של 20% ויוגב יישא ב-80% הנותרים.","רק יוגב, בעל הדירה אשר דורש את התקנתו של המנגנון פיקוד השבת והפעלת המעלית כמעלית שבת, יישא בהוצאת התקנת המנגנון האמור ובהוצאות ההחזקה וההפעלה הנובעות מהפעלת המעלית כמעלית שבת."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2019-01#21","e":22,"n":21,"s":"לכל דירה בבית משותף בקרית שמונה מוצמד, בהתאם לרישום בטאבו, שטח חניה לכלי רכב אחד.\nשאול, בעל דירה בבית המשותף, מחנה באופן קבוע את רכבו בחניה של שכנו אמיר שהוא שוכר את דירה בבית המשותף.\nהסכם השכירות של אמיר כולל חנייה.\nאמיר החליט להגיש למפקח על המקרקעין תביעה נגד שאול בגין הסגת גבול.\nהמפקח על המקרקעין דחה את תביעתו של אמיר בנימוק של היעדר סמכות לדיון בסכסוך בין הצדדים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר ?","o":["המפקח על המקרקעין שוגה בהחלטתו - אמיר, על אף היותו שוכר, רשאי להגיש תביעה, לפי בחירתו למפקח על המקרקעין או לבית משפט השלום, המוסמכים להכריע בסכסוך בין הצדדים.","המפקח על המקרקעין צודק בהחלטתו - מאחר שאמיר הוא שוכר ולא בעל דירה בבניין, המפקח אינו מוסמך להכריע בסכסוך בין הצדדים ועל אמיר להגיש תביעה לבית משפט השלום.","המפקח על המקרקעין צודק בהחלטתו - על אמיר להגיש את התביעה לרשות המקומית המוסמכת להכריע בין הצדדים בהתאם להיתר הבניה.","המפקח על המקרקעין שוגה בהחלטתו - המפקח הוא בעל הסמכות הייחודית והבלעדית להכריע בסכסוך שנתגלע בין הצדדים."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2019-01#22","e":22,"n":22,"s":"דנה מתווכת מקרקעין מוסמכת בעלת ותק רב במקצוע, נסעה לשליחות בארה\"ב לתקופה של שלוש שנים.\nבתקופת השליחות לא שילמה דנה אגרה שנתית לחידוש רישיון התיווך.\nעם שובה לישראל המשיכה דנה לתווך במספר עסקאות נדל\"ן.\nבנסיבות העניין , איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מתווכת מקרקעין שאינה מודיעה על התליית רישיונה לתקופה של שלוש שנים אינה רשאית לשוב ותווך בעסקאות מקרקעין , ועליה לעבור שוב בחינת רשם המתווכים.","דנה אינה רשאית לשמש כמתווכת מקרקעין כל עוד לא שילמה את האגרה.","דנה רשאית לשמש כמתווכת מקרקעין, מאחר שוועדת המשמעת לא החליטה על התליית רשיונה.","דנה רשאית לשמש כמתווכת מקרקעין, הן בשל הוותק הרב שצברה במקצוע והן מאחר שלא הודיעה על התליית רישיונה מרצון."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2019-01#23","e":22,"n":23,"s":"עם פטירתו בשיבה טובה של זכריה, מונתה, לבקשתו על פי צוואתו, סתווית שכנתו משכבר הימים, למנהלת העיזבון של כל נכסיו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["למנהל עיזבון יכול להתמנות רק עו\"ד או האפוטרופוס הכללי.","מוריש אינו יכול לקבוע בצוואתו אדם שינהל את עיזבונו, שכן סמכות זו מבורה לבית המשפט לענייני משפחה.","למנהל עיזבון יכול להתמנות גם אדם יחיד אותו קבע המוריש בצוואתו, שינהל את עיזבונו באישור בית במשפט.","למנהל עיזבון  יכול להתמנות רק בן משפחה מדרגה ראשונה של המוריש או האפוטרופוס הכללי."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2019-01#24","e":22,"n":24,"s":"איזה מהמשפטים הבאים משקף באופן הנכון ביותר את המונח \"אחוזי בנייה\" ?","o":["היקף השטח הבנוי המותר במגרש מסוים, הנקבע בתכניות המתאר החלות על המגרש.","אחוז עלות הבנייה מתוך עלות הפרויקט (עלות הקרקע ועלות בנייה).","אופן החישוב והחלוקה של הקרקע חקלאית באגודה שיתופית בין מספר יורשים.","סך הקצאת השטחים וגודלן של הנחלות אשר מקצה האגודה השיתופית לחבריה."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2019-01#25","e":22,"n":25,"s":"היכן מוסדרות זכויותיו וחובותיו של חקלאי שהוא \"בר רשות\" בקרקע שהוחכרה לאגודה השיתופית ע\"י רשות מקרקעי ישראל (מינהל מקרקעי ישראל לשעבר)?","o":["זכויותיו וחובותיו של חקלאי \"בר רשות\" מוסדרים בהיתרי הבנייה ובתכניות המתאר החלות על הקרקע.","זכויותיו וחובותיו של חקלאי \"בר רשות\" מוסדרים בהסכמי \"משק עזר\" ובקריטריונים שקבע שר החקלאות.","זכויותיו וחובותיו של חקלאי \"בר רשות\" מוסדרים בהסכם המשבצת ובהחלטות רשות מקרקעי ישראל.","זכויותיו וחובותיו של חקלאי  \"בר רשות\" מוסדרים ורשומים במשרד הרשות המקומית."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2020-07r1#1","e":23,"n":1,"s":"בפסק דין שנתן בית המשפט חויב בצלאל לשלם חובות כספיים שונים. בעקבות זאת הוטל צו עיקול על אולם שמחות הרשום על שמו של בצלאל במשרדי רשם המקרקעין (להלן: \"הנכס\"). לאחר התראות לתשלום שנשלחו לבצלאל שלא נענו, הורה רשם ההוצאה לפועל על מכירת הנכס לכיסוי החוב הכספי. שמאי מקרקעין מוסמך ערך דוח שומה לשווי הנכס והעתק מהדוח הועבר גם לבצלאל. בצלאל חלק על השומה והמציא שומה של שמאי מקרקעין מוסמך מטעמו הסותרת את השמאות שהוגשה.\nבנסיבות העניין, להחלטת מי יועבר העניין לקביעת השומה לצורך המכירה?","o":["ההחלטה לקביעת השומה לצורך מכירת הנכס תועבר לידי רשם ההוצאה לפועל.","ההחלטה לקביעת השומה לצורך מכירת הנכס תועבר לידי שמאי מקרקעין שלישי, שישמש כבורר.","ההחלטה לקביעת השומה לצורך מכירת הנכס תועבר לידי השמאי הממשלתי הראשי.","ההחלטה לקביעת השומה לצורך מכירת הנכס תועבר לידי רשם המקרקעין."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2020-07r1#2","e":23,"n":2,"s":"בבית משותף בן 3 קומות בקרית אונו, הכולל 6 דירות מגורים, הוחלט באסיפה הכללית של הבניין על הצמדת חדר האופניים המשותף לדירתו של יואל. יואל הוא היחיד בבניין המשתמש בחדר זה ולכן כך הוחלט ע\"י 5 מבעלי הדירות שבבעלותם רוב הרכוש המשותף בבניין. צפריר, המתגורר בקומה השלישית, ראה עצמו מקופח בהחלטה זו והתנגד לכך, למרות שמעולם לא השתמש בחדר האופניים.\nבנסיבות העניין, מה על צפריר לעשות כדי לשנות את ההחלטה שהתקבלה?","o":["מאחר שההחלטה ניתנה ואושרה באסיפה הכללית ע\"י רוב של יותר מ- 80% מבעלי הדירות, לצפריר לא נותר מה לעשות.","כדי לשנות את החלטת האסיפה הכללית של בעלי הדירות בבניין, על צפריר לפנות למפקח על המקרקעין או לבית משפט השלום, לפי בחירתו.","כדי לשנות את החלטת האסיפה הכללית של בעלי הדירות בבניין, על צפריר לפנות לאגודה לתרבות הדיור.","כדי לשנות את החלטת האסיפה הכללית של בעלי הדירות בבניין, על צפריר למנות בורר בהתאם לתקנון הבית המשותף."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2020-07r1#3","e":23,"n":3,"s":"במסגרת ההרחבה במושב אבן ספיר, השייך למועצה אזורית מטה יהודה, הזוג אהוד ושרונה חכרו מגרש בשטח של 500 מ\"ר לבניית בית צמוד קרקע. בחוזה החכירה עם רשות מקרקעי ישראל (להלן: \"רמ\"י\") צוין כי זכויות הבנייה במגרש יהיו בשיעור של 180 מ\"ר ועוד 20 מ\"ר עבור שטחי שירות, ויעמוד על סך כולל של 200 מ\"ר. במהלך הבנייה אושרה תוכנית חדשה, המאפשרת הגדלה של זכויות הבנייה למגורים בחלקה של עוד 25 מ\"ר.\nבנסיבות העניין, האם בני הזוג אמורים לשלם לרמ\"י עבור הגדלת זכויות הבנייה בהתאם לתוכנית החדשה? איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על בני הזוג לשלם למועצה אזורית מטה יהודה היטל השבחה ולכן אין תשלום לרמ\"י.","על בני הזוג לשלם דמי הסכמה לרמ\"י עבור ההסכמה להגדלת זכויות הבנייה בהתאם לתוכנית החדשה.","על בני הזוג לשלם מס שבח על הגדלת זכויות הבנייה.","על בני הזוג לשלם דמי היתר לרמ\"י עבור הגדלת זכויות הבנייה בהתאם לתוכנית החדשה."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2020-07r1#4","e":23,"n":4,"s":"נציגות הבית המשותף ברח' קוגל בחולון החליטה לקיים אסיפה כללית. בבניין לא קיים תקנון מוסכם ולכן חל בבניין התקנון המצוי. חמישה ימים לפני מועד האסיפה תלה מר גדעון שפיר, חבר ועד הבניין, הודעה על קיום אסיפה כללית של בעלי הדירות בבניין, הכוללת את תאריך ושעת הפגישה, מיקומה והנושאים שידונו באסיפה. ההודעה נתלתה בכניסה לבניין בסמוך לתיבות הדואר. האסיפה התקיימה בהשתתפות רוב בעלי הדירות ונתקבלו בה החלטות. נפתלי, בעל דירה בבניין, טוען שהוא היה בחו\"ל ולכן לא ראה את ההזמנה לאסיפה, כך שמסיבה זו כינוס האסיפה אינו חוקי ובכלל זה ההחלטות שנתקבלו אינן חוקיות ויש לבטלן, או לחילופין, יש לכנס אסיפה כללית חוקית חדשה של ועד הבית לצורך דיון מחודש בהחלטות.\nבנסיבות העניין, האם נפתלי צודק בדרישתו? מדוע?","o":["נפתלי צודק בדרישתו; כינוס האסיפה לא היה חוקי, על נציגות הבניין היה למסור הודעה על קיום האסיפה באופן אישי לכל דיירי הבניין.","נפתלי צודק בדרישתו; כינוס האסיפה לא היה חוקי, מכיוון שנציגות הבניין הייתה צריכה לפרסם את דבר קיום האסיפה לפחות שבוע ימים לפני מועד קיומה.","נפתלי אינו צודק בדרישתו; כינוס האסיפה היה כחוק.","נפתלי אינו צודק בדרישתו; לא ניתן לקיים אסיפה מבלי שרוב בעלי הדירות נוכחים בה."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2020-07r1#5","e":23,"n":5,"s":"מר חסון קנה דירה בקומת קרקע ברח' ז'בוטינסקי ברמת גן, הכוללת גם קיוסק פעיל בצמוד לחצר ביתו. באוגוסט 2015 החלה הקמת קו הרכבת הקלה הראשון - הקו האדום - שיעבור, בין היתר, ברח' ז'בוטינסקי ברמת גן, צמוד לחצר ביתו של מר חסון. לצורך הקמת המסילה והרחבת הדרך, היה צורך בהפקעת הקיוסק של מר חסון לצורכי ציבור והסתבר למר חסון שהקיוסק נבנה ללא היתר.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מר חסון לא יפוצה על ההפקעה של הקיוסק, מאחר שהקיוסק הוקם ללא היתר, תוך ביצוע עבירת בנייה.","מר חסון לא יפוצה על ההפקעה של הקיוסק, אלא אם הוועדה ראתה כי הוא פעל בתום לב וקיימות נסיבות מיוחדות המצדיקות תשלום פיצוי.","מר חסון יפוצה על הפקעת הקיוסק בהתאם לקביעת שמאי מקרקעין של הוועדה המקומית לתכנון ובנייה.","ניתן לפנות את הקיוסק של מר חסון ובלבד שיעמידו לרשותו קיוסק חלופי בדומה לקיים."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2020-07r1#6","e":23,"n":6,"s":"עידן רכש דירת 5 חדרים ברמת בית שמש מחברת \"בוני הארץ\". בחוזה נקבע שהחברה מתחייבת למסור את החזקה בדירה לרוכש עד לתאריך מסוים. כיום, חודשיים וחצי לאחר מועד המסירה כמתחייב בהסכם, הדירה טרם נמסרה לעידן.\nבנסיבות העניין, האם עידן זכאי לפיצוי? מדוע?","o":["לא, מכיוון שלא עברו שישה חודשים מתום המועד הקבוע בחוזה למסירת הדירה.","לא, מכיוון שלא עברו שלושה חודשים מתום המועד הקבוע בחוזה למסירת הדירה.","יתכן שעידן זכאי לפיצוי, מכיוון שעברו שישים יום מתום המועד הקבוע בחוזה למסירת הדירה.","לעידן מגיע פיצוי רק אם יוכיח כי נגרם לו נזק עקב האיחור במסירת הדירה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2020-07r1#7","e":23,"n":7,"s":"שלומית, שזה עתה סיימה את לימודיה בסמינר לגננות, פנתה לדודי, מתווך במקרקעין, וביקשה ממנו למצוא עבורה נכס בו תוכל לפתוח גן ילדים. דודי הציע לשלומית לרכוש נכס בבניין משותף במרכז תל-אביב, שהוא דירת מגורים עם יציאה לחצר. לטענתו, הנכס מתאים בדיוק למטרותיה של שלומית, שכן בהפסקות היא תוכל לעשות שימוש בלעדי בחצר הבניין להנאת ילדי הגן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל מניעה ששלומית תעשה שימוש בלעדי בחצר הבניין, אך עליה לקבל הסכמה בכתב מרוב בעלי הדירות לפתיחת גן ילדים בבית המשותף.","על שלומית לבדוק אם תוכנית המיתאר (תב\"ע) במקום מאפשרת פתיחת גן ילדים, אם יש לנכס היתר לשימוש חורג לשמש כגן ילדים ואם החצר צמודה לנכס.","לא ניתן לפתוח גן ילדים בדירת מגורים בבית משותף.","אין כל מניעה ששלומית תרכוש את הנכס, תפתח בו גן ילדים ותעשה שימוש בלעדי בחצר, ובלבד שלא תטריד את מנוחת השכנים בין השעות 14:00-16:00."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2020-07r1#8","e":23,"n":8,"s":"אהרון רובין הינו דייר מוגן בדירה בת 4 חדרים ברח' אלנבי בתל אביב, אותה רכש בדמי מפתח בשנת 1960, ומאז הוא מתגורר בה. כיום מר רובין חלה ובנו ביקש ממנו לבוא לגור עימו. בהתאם לסיכום עם הבעלים, עבר מר רובין להתגורר אצל בנו. במקום מר רובין נכנס אבנר צדוק כדייר מוגן לדירה ושילם לבעל הבית דמי מפתח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שמר רובין עזב את הדירה מרצונו החופשי, אין הוא זכאי לקבל חלק מדמי המפתח.","מאחר שמר רובין התגורר בדירה יותר מ- 5 שנים, הוא זכאי לקבל שישים אחוזים (60%) מדמי המפתח.","מאחר שמר רובין התגורר בדירה יותר מ- 10 שנים, הוא זכאי לקבל שישים ושישה ושני שליש אחוזים (66.66%) מדמי המפתח.","מאחר שמר רובין כדייר יוצא החל להחזיק במושכר משנת 1960, יהיה חלקו בדמי המפתח, ללא קשר לתקופת ההחזקה, שישים ושישה ושני שליש אחוזים (66.66%)."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2020-07r1#9","e":23,"n":9,"s":"על פי פסק הדין בר\"ע 209/01 זיוה וזאב מאיר נ' טלי שושן ואח':\nהמבקשים רכשו בית לאחר שהמתווכת סיפרה להם כי \"אין בעיות מיוחדות עם הבית\".\nהמתווכת לא מסרה להם את מלוא הפרטים על הבית, שכלל חריגות בנייה. המתווכת מצידה ציינה כי עשתה את עבודתה \"על הצד הטוב ביותר\" ותפקידה מסתכם במציאת בית לקנייה. אין מחלוקת כי המתווכת הייתה הגורם היעיל שהביא את הצדדים להתקשרות ולהסכם מחייב.\nבנסיבות המתוארות ובהתאם לפסק הדין המוזכר לעיל, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הצדדים הגיעו להסכם מחייב - די בכך כדי לחייב את המבקשים בתשלום דמי התיווך; הגעה להסכם מהווה דרישה מהותית שבהתקיימו זכאית המתווכת לדמי תיווך.","המתווכת זכאית לדמי התיווך, אין זה מחובתה לתת לרוכשים יעוץ מקצועי או משפטי בעניין פגמים בדירה.","על המתווכת היה להביא לידי הרוכשים מידע מהותי על הדירה, לרבות מידע על היתרי בנייה שלא ניתנו לנכס, ומשלא פעלה כך, אינה זכאית לדמי התיווך.","המתווכת לא זכאית לדמי התיווך, כי לא ביצעה מספיק פעולות תיווך."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2020-07r1#10","e":23,"n":10,"s":"בבית משותף ברחוב ביאליק הותקן גרם מדרגות שהוצב על ידי אומן ידוע מברצלונה, שכל פגיעה או שינוי בו מוערכים בעשרות אלפי שקלים. משפחת נאור מתגוררת בדירת הקרקע והדירה רשומה על שם האב. הבן שחר עבר תאונת דרכים קשה והוא מתנייד בכיסא גלגלים והפך לעיוור.\nרופאו של שחר אישר כי יש לבצע התאמות בגרם המדרגות ובשבילי הגישה, הכוללות: שילוט בכתב ברייל והתקנת אמצעי הרמה ידני לכיסא הגלגלים, באורך 7 מטר, מתקפל, שאינו מפריע למעבר.\nדיירי הבניין מתנגדים עקב הפגיעה בגרם המדרגות האומנותי וביופיו של הבניין.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לביצוע ההתאמות הנדרשות לשחר נדרשת הסכמת רוב בעלי הדירות בבניין.","ביצוע ההתאמות הנדרשות לשחר אינו טעון הסכמה של בעלי הדירות בבניין.","מאחר שהדירה רשומה על שם מר נאור, אביו של שחר, ולא על שם שחר הנכה, נדרשת הסכמה של שישים אחוזים (60%) מבעלי הדירות בבניין לביצוע ההתאמות.","לביצוע ההתאמות הנדרשות לשחר, נדרשת הסכמתם של שישים אחוזים (60%) מבעלי הדירות בבניין."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2020-07r1#11","e":23,"n":11,"s":"רוני ורחל מזרחי ניהלו את חנות הבגדים \"דלידה\" במרכז רחוב יפו בירושלים, שהייתה במשך שנים סמל ירושלמי ותיק. בני הזוג רכשו את הנכס בעיסקת דמי מפתח בשנת 1962. כיום בני הזוג הגיעו לגיל פרישה ובדעתם להפסיק את עבודתם בחנות הבגדים. לאחרונה הם קיבלו הצעה לרכישת החנות ע\"י חברת ביגוד האופנה \"זול ובזול\" בע\"מ, שהינה תאגיד, המעוניינת להפעיל את החנות כאחת מחנויות רשת האופנה שלהם. הזוג מזרחי העבירו לבעל הבית, מר עזרא דולב, את שם הדייר הנכנס המוצע על ידם. בעל הבית דחה את ההצעה לחילופי הדיירים המוצעים והשיב שאינו מסכים להשכיר להם את החנות בשל היותם חברה בע\"מ.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בעל הבית, מר דולב, אינו רשאי לסרב לחילופי הדיירים בחנות הבגדים שהזוג מזרחי הציעו לו.","בעל הבית, מר דולב, אינו רשאי לסרב לחילופי הדיירים כפי שהזוג מזרחי הציעו לו, מאחר שתחום העיסוק של הדייר היוצא, חנות בגדים, זהה לזה של הדייר הנכנס.","בעל הבית, מר דולב, רשאי להתנגד לחילופי הדיירים שהזוג מזרחי הציעו לו, בשל הטעם שהדייר הנכנס אמנם יעסוק באותו תחום, חנות בגדים, אך לא תחת אותו השם המסחרי.","בעל הבית, מר דולב, רשאי להתנגד לחילופי הדיירים שהזוג מזרחי הציעו לו, מכיוון שמדובר בדייר מוצע שהינו גוף מאוגד, דבר המהווה טעם סביר לסירוב."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2020-07r1#12","e":23,"n":12,"s":"כמתווך באזור דימונה, התבקשת על ידי בעל נכס למכור את הנכס שברשותו שהינו אולם תעשיה הנמצא על קרקע המנוהלת בידי רשות מקרקעי ישראל (רמ\"י). בהתאם למסמכים המשפטיים אשר הוצגו בפניך נקבע, בין היתר, כי הקרקע בה ממוקם הנכס מסומנת ברמ\"י כקרקע עירונית.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בהתאם לחוק, קרקע עירונית הינה קרקע שייעודה לפי תוכנית שניתן להוציא מכוחה היתר בנייה לפי חוק התכנון והבנייה, התשכ\"ה- 1965, הוא למגורים או תעסוקה.","בהתאם לחוק, קרקע עירונית הינה קרקע שייעודה לפי תוכנית שניתן להוציא מכוחה היתר בנייה לפי חוק התכנון והבנייה, התשכ\"ה- 1965, הוא למגורים ומסחר ולא לתעשייה.","בהתאם לחוק, קרקע עירונית הינה קרקע שייעודה לפי תוכנית שניתן להוציא מכוחה היתר בנייה לפי חוק התכנון והבנייה, התשכ\"ה- 1965, הוא למגורים, לתעסוקה ולגידול בעלי חיים.","בהתאם לחוק, קרקע עירונית הינה קרקע שייעודה לפי תוכנית שניתן להוציא מכוחה היתר בנייה לפי חוק התכנון והבנייה, התשכ\"ה- 1965, הוא למגורים בלבד."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2020-07r1#13","e":23,"n":13,"s":"מהי חכירה במקרקעין ומהי חכירה לדורות במקרקעין?","o":["חכירה הינה שכירות לתקופה של יותר משנה. חכירה לדורות הינה שכירות לתקופה של יותר משנתיים.","חכירה הינה שכירות לטווח קצר. חכירה לדורות הינה שכירות לטווח ארוך.","חכירה הינה שכירות לתקופה של יותר מחמש שנים. חכירה לדורות הינה שכירות לתקופה של יותר מעשרים וחמש שנים.","חכירה הינה שכירות חופשית בלתי מוגנת. חכירה לדורות הינה שכירות העוברת בירושה."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2020-07r1#14","e":23,"n":14,"s":"בנהריה קיים מרכז מסחרי בן קומה אחת ובו 10 חנויות. שטח כל חנות 30 מ\"ר. החנויות כולן פונות לרחבה מרוצפת, המהווה חלק מהרכוש המשותף ורשומה במושע. אחת החנויות משמשת כבית קפה. לפני כ- 3 שנים החליט בעל בית הקפה, על דעת עצמו, להוציא שולחנות וכיסאות לרחבה הצמודה לחנות ולהשתמש בחלק זה כמקום ישיבה לבאי בית הקפה. בעל בית הקפה אף הסדיר נושא זה אל מול הרשות המקומית ומשלם לעירייה אגרות על השטח בשימוש שהינו כ- 20 מ\"ר. שאר הבעלים דורשים תשלום בגין השימוש.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הרכוש המשותף פתוח תמיד לשימוש לכל הדיירים ללא תשלום.","הסדרת הנושא אל מול הרשות המקומית אינה מבטלת את הזכות של בעלי הזכויות האחרים לדרוש שכר ראוי בעד השימוש.","כל עוד הוסדר הנושא אל מול העירייה והוועדה המקומית, זכותו של בעל הנכס להשתמש בשטח הצמוד לו ללא כל תשלום נוסף.","לצורך שימוש במקרקעין הצמודים לחנות יש להצמידן בטאבו. ללא הצמדה כאמור אסור השימוש במקרקעין במקרה זה."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2020-07r1#15","e":23,"n":15,"s":"משה, מתווך דירות, החתים את זוהר המוכרת על הסכם בלעדיות בתיווך בטופס נפרד מהזמנת התיווך. לאחר מכן, ביצע שתי פעולות תיווך כנדרש בתקנות.\nתקופת הבלעדיות לפי דין הייתה אמורה להסתיים אחרי חצי שנה. למרבה הצער, משה לא הצליח למכור את הדירה, למרות פעולות השיווק, ולכן ביקש להאריך את הבלעדיות לחצי שנה נוספת.\nבנסיבות המתוארות ובהתייחס לפסק הדין בעניין ת״א 44919/07 בכר עופר נגד מעוז טל ואחרים, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מכיוון שלפי החוק, הבלעדיות מוגבלת לחצי שנה בלבד, לא ניתן להאריך תקופה זו - גם לא בהסכמה.","הצדדים יכולים להסכים בכתב להאריך את תקופת הבלעדיות, ללא הגבלה כלשהי.","הצדדים יכולים להסכים בכתב להאריך את תקופת הבלעדיות לתקופה סבירה, כגון לא יותר משנה מיום ההזמנה המקורית, ובתנאי שנחתם הסכם בלעדיות חדש.","אם הדירה נמכרה בעזרת מתווך אחר, לאחר חצי שנה הבלעדיות לא משנה וזוהר לעולם לא תצטרך לשלם למתווך שהחתים אותה על בלעדיות."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2020-07r1#16","e":23,"n":16,"s":"מוטי וליאורה החליטו להיפרד. ברשותם דירת מגורים בת 5 חדרים בחדרה, שנרכשה על ידם בחלקים שווים ובה הם מתגוררים כיום. מוטי החליט למכור את חלקו בנכס, שהינו 50%, לחברו הטוב שוקי, במחיר השוק. ליאורה שמעה על העיסקה וביקשה ממוטי למכור לה את חלקו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["למוטי עומדת הזכות למכור את חלקו לכל אדם המרבה במחיר.","לליאורה עומדת הזכות לרכוש את הדירה במחיר הנמוך באופן משמעותי ממחיר השוק, עקב היותה בעלת מחצית הזכויות בנכס.","מוטי זכאי למכור את הנכס במסגרת התמחרות בשוק החופשי.","מוטי אינו זכאי להעביר את חלקו לשוקי, אלא אם הציע אותו תחילה לליאורה."],"c":[3],"a":false,"note":"","sub":"l_shared"},{"id":"2020-07r1#17","e":23,"n":17,"s":"שמואל ותמר מבקשים להוסיף ממ\"ד לבית המגורים שבבעלותם, אשר לצורך בנייתו נדרש להרוס מחסן בחצר.\nבמקרה זה, האם יש צורך בהיתר בנייה?","o":["בגין בניית הממ\"ד יש צורך בהיתר בנייה. בגין הריסת המחסן – אין צורך בהיתר.","יש צורך בהיתר שיפרט הן את תוספת הממ\"ד והן את הריסת המחסן.","מאחר שממ\"ד הינו מבנה בטיחותי, אין צורך לקבל היתר בנייה לבנייתו, אך יש צורך לקבל היתר להריסת המחסן.","מאחר שהממ\"ד נבנה על חשבון המחסן – מדובר בשינוי פנימי קל, שאינו טעון היתר."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2020-07r1#18","e":23,"n":18,"s":"נדב ירש מגרש של 2 דונם שייעודו לבניית משרדים ברמת החייל בתל אביב. מכיוון שלדעתו יש עודף משרדים באזור ואין תחנות דלק, מעוניין נדב לבנות תחנת דלק על הקרקע שירש.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על נדב לפנות לוועדה המקומית לתכנון ובנייה, מכיוון שהדבר בסמכותה.","על נדב לפנות לוועדה הארצית לתכנון ובנייה, מכיוון שתחנות דלק שייכות לתשתית ארצית של כבישים ודלק ולכן הדבר בסמכותה.","לא ניתן לשנות יעוד קרקע ממשרדים לתחנת דלק.","לא צריך לשנות את יעוד הקרקע; קרקע בייעוד למשרדים כוללת גם מסחר, תעשיה ותחנות דלק."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2020-07r1#19","e":23,"n":19,"s":"משפחת חלפון רכשה דירה בירושלים, שנבנתה בשנת 1972 בבניין שבו 30 דירות ומערכת חימום מים והסקה משולבת ומרכזית. משפ' חלפון החליטה להתנתק רק מההסקה, מכיוון שבני המשפחה מעדיפים לחמם את דירתם בעזרת מזגן חסכוני ולהמשיך להשתמש במערכת חימום המים המרכזית.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["משפחת חלפון אינה יכולה להתנתק רק ממערכת ההסקה.","משפחת חלפון יכולה להתנתק מההסקה ולהישאר מחוברת לחימום המים רק בהסכמת כל הדיירים.","משפחת חלפון יכולה להתנתק מההסקה ומחימום המים ביחד, ללא הסכמת ועד הבית, אך היא תידרש לשאת בעלות תחזוקת תשתיות המערכת.","משפחת חלפון יכולה להתנתק מההסקה ומחימום המים ללא הסכמת הדיירים, אך היא תחויב בעלות המערכת המרכזית גם לאחר שתתנתק ממנה ותפסיק ליהנות ממנה."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2020-07r1#20","e":23,"n":20,"s":"מר כרמלי, יזם נדל\"ן, רכש מגרש בגודל של דונם אחד ברחוב הראשי של הרצליה ועליו בניין מגורים של 3 קומות. מר כרמלי בדק ומצא שאחוזי הבנייה אינם מנוצלים במלואם וכעת מבקש להוסיף 2 קומות לבניין.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם עפ\"י זכויות הבנייה מותרת בנייה של 3 קומות בלבד, לא ניתן לקבל אישור לבניית 5 קומות, גם אם יש אחוזי בנייה נוספים שטרם נוצלו.","אם עפ\"י \"אחוזי הבנייה\" יש אחוזים לא מנוצלים, ניתן לנצלם ולהוסיף קומות לבניין בלי קשר לזכויות הבנייה.","ניתן להשתמש באחוזי בנייה לא מנוצלים בבניין קיים, רק למי שהוא בעל זכויות הבנייה.","זכויות הבנייה קובעות רק את השימוש של הבניין, כגון מסחרי, מגורים, ולא כמה קומות או גודל אפשר לבנות."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2020-07r1#21","e":23,"n":21,"s":"בת\"ק 41268-09-12 נועם יואל כהן נ' אנדרי גולן, נדונה תביעה של מתווך לדמי תיווך. המתווך החתים את הלקוח על כתובת הבניין יפת 41, יפו, מבלי לציין באיזו דירה בבניין מדובר. המתווך הראה ללקוח דירה בבניין השייכת לאדם שבבעלותו מספר דירות בבניין זה. הלקוח לא אהב את הדירה שהוצעה. לאחר 4 חודשים ראה הלקוח מודעה פרטית של הבעלים על דירה אחרת שלו באותו בניין. הלקוח פנה ישירות לבעלים ושכר אותה. המתווך תבע את הלקוח לדמי תיווך בגין העיסקה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בית המשפט קיבל את התביעה וחייב את הלקוח לשלם דמי תיווך, מכיוון שהלקוח חתם על הזמנת תיווך לבניין והמתווך הראה לו דירה דומה בבניין, רק בקומה אחרת, ולכן היה \"הגורם היעיל\".","בית המשפט דחה את התביעה לתשלום דמי התיווך, משום שהמתווך נמנע מלמסור ללקוח העתק מהזמנת שירותי התיווך, לא ציין בהזמנה פרטים מלאים ולא היה הגורם היעיל שהביא להתקשרות בין בעל הדירה ללקוח.","בית המשפט קיבל את התביעה ופסק שצריך לשלם דמי תיווך כי הדירה שייכת לאותם בעלים ולכן המתווך הוא הגורם היעיל.","בית המשפט דחה את התביעה לדמי תיווך, כי המתווך לא ציין במודעה שהוא המתווך והקונה לא התכוון בכלל לפנות למתווך."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2020-07r1#22","e":23,"n":22,"s":"חברת \"מגדלים\" בונה בתל אביב בניין משרדים בן 20 קומות ובו 82 משרדים. בחוזה המכירה קבעה החברה כי חברת \"המתחזק\" בע\"מ תתחזק את הבניין למשך 3 שנים, עם אופציה ל- 3 שנים נוספות, וזאת תמורת דמי ניהול שישלמו בעלי המשרדים.\nהאם יכולה חברת הבנייה שמוכרת את המשרדים לקבוע בחוזה הוראה מסוג זה?","o":["לא. רק ועד הבית שייבחר לאחר שיקבלו את החזקה במשרדים יכול למנות מתחזק/חברת ניהול.","כן. חברת הבנייה יכולה לקבוע בהסכם המכר או בתקנון מי יהיה המתחזק/חברת ניהול לבניין ללא הגבלה, עם אופציות להארכה.","לא. חברת הבנייה אינה יכולה להכניס להסכם המכר או התקנון מתחזק/חברת ניהול לבניין, אלא רק ברוב של 60% מבעלי הרכוש המשותף שיביעו הסכמה לכך בכתב.","לא. חברת הבנייה יכולה לקבוע בחוזה המכר או בתקנון חברת הניהול/המתחזק ל- 3 שנים, בלי יכולת להחליפה ללא הסכמת הרוכשים, אך לא לתקופה ארוכה מזו."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2020-07r1#23","e":23,"n":23,"s":"רועי ואשתו רכשו מקבלן דירה בבנייה בשכונת המשתלה בתל אביב. הם אמורים לקבל את הדירה בעוד כשנה וחצי, כשתהיה מוכנה. מכיוון שחששו מהעיסקה, ביקשו מהקבלן לקבל ערבות בנקאית או פוליסת ביטוח על הכסף ששילמו. הקבלן הסכים לכך, אבל טען שיש עמלה גבוהה על הערבות ועליהם לשלם את עמלת הערבות.\nהאם יכול הקבלן לדרוש את השתתפות הרוכשים בעמלה?","o":["על מי שדורש את הערבות הבנקאית לשלם את סכום עמלת הערבות.","על הקבלן לשאת בכל ההוצאות והעמלות הכרוכות בהוצאת ערבות לקונים.","עמלת הערבות צריכה להתחלק בין הקונים לקבלן שווה בשווה.","הקבלן והקונים יכולים לקבוע ביניהם מי ישלם את עמלת הערבות."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2020-07r1#24","e":23,"n":24,"s":"נעמה, מתווכת בתחילת דרכה, קיבלה בבלעדיות דירת מגורים למכירה בשכונת נווה שאנן בחיפה. נעמה עברה לאחרונה בהצלחה את מבחן המתווכים וזכרה היטב את חומר הלימוד. נעמה החליטה לבצע פעולות כדלקמן: היא הציבה שלט על הנכס, הציבה שלט במרכז קהילתי והציבה שלט על גבי לוח מודעות ציבורי.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["נעמה ביצעה כראוי את הוראות התקנות לעניין פעולות השיווק.","נעמה לא ביצעה כראוי את הוראות התקנות לעניין פעולות השיווק שלא ניתן לקבל בלעדיות בלעדיהן.","נעמה לא ביצעה כראוי את הוראות התקנות לעניין פעולות השיווק, אולם תוכל לסכם בכתב עם לקוחותיה על פעולות השיווק.","נעמה ביצעה כראוי את הוראות התקנות לעניין פעולות השיווק ואף ביצעה פעולת שיווק אחת יותר מהמינימום הנדרש בתקנות."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2020-07r1#25","e":23,"n":25,"s":"אהרון הינו יזם נדל\"ן ובבעלותו היו 12 דירות ו- 3 חניות שביקש למכור.\nהוא פנה לבני המתווך וחתם לו על בלעדיות (במסמך נפרד) לתקופה של 15 חודשים.\nבני פירסם את הדירות באינטרנט ושלח מיילים לקונים פוטנציאליים, אך טרם הצליח לאתר קונה. לאחר 13 חודשים מכר אהרון את אחת מהדירות לחברו מהצבא וסירב לשלם לבני דמי תיווך בטענה שהבלעדיות אינה בתוקף.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הבלעדיות על דירה תקפה רק לחצי שנה, ולכן בני לא זכאי לדמי תיווך.","הבלעדיות תקפה לשנה בלבד בגלל החניות, ולכן בני לא זכאי לדמי תיווך.","הבלעדיות תקפה ולכן על אהרון לשלם דמי תיווך.","בני לא היה \"הגורם היעיל\" ולכן הוא לא זכאי לדמי תיווך."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2020-07r2#1","e":24,"n":1,"s":"לפי עובדות פסק דין ת.פ. 1224/06 מדינת ישראל נגד דוידסון דניאל, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לפי תקנות המתווכים (פעולות שיווק, התשס״ה - 2004, תקנה 1(א)(7)) ניתן לבצע ״כל פעולת שיווק שאינה מנויה בפיסקאות (1) עד (6) כפי שתסוכם בין הצדדים״, ובכלל זאת מותר לצדדים לעיסקה לסכם על פעולת שיווק שבה אדם שאינו בעל רישיון יפרסם מודעה המחפשת שוכרים ויקשר באופן עצמאי בינם לבין משכיר דירה באותה שכונה.","אדם שאינו בעל רישיון תיווך אינו רשאי להציב מודעה המחפשת שוכרים ולקשר בינם לבין בעלי דירה המחפשים להשכיר אותה אפילו בהסכמת כל הצדדים לעיסקה המסכימים לשלם לו דמי תיווך ואפילו אם הדבר סוכם במפורש בין הצדדים כפעולת שיווק מותרת.","אדם שאינו בעל רישיון תיווך יכול לבצע באופן עצמאי פעולות תיווך שיוחדו למתווך בחוק, כל עוד הוא מבצע אותן תחת השגחה של מתווך מוסמך.","באותו פסק דין, כל הצדדים לעיסקה שילמו בהסכמה דמי תיווך לאדם שאינו מתווך, ובמקרה של הסכמה שכזאת המדינה אינה נוהגת להתערב."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2020-07r2#2","e":24,"n":2,"s":"מהם דמי היוון?","o":["'דמי היוון' הם תשלום לעירייה בשל עליית ערך המקרקעין בהתאם לחוק התכנון והבניה.","'דמי היוון' הם תשלום לרשות מקרקעי ישראל (בשמו הקודם - מינהל מקרקעי ישראל). תשלום זה משולם מראש עבור כל תקופת החכירה או יתרת תקופת החכירה.","'דמי ההיוון' הם תשלום לרשות מקרקעי ישראל (בשמו הקודם - מינהל מקרקעי ישראל). תשלום זה משולם מראש עבור כל שנה בנפרד.","דמי היוון הם דמי היתר לרשות מקרקעי ישראל."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2020-07r2#3","e":24,"n":3,"s":"בידי הוועדה המקומית לתכנון ובנייה הזכות להפקיע קרקעות שנועדו בתוכנית לצורכי ציבור.\nמה מהבאים לא נכלל תחת ההגדרה של צורכי ציבור?","o":["שטח פרטי פתוח (שפ\"פ) ושטחים מסחריים.","בתי קברות, מבנים לצורכי דת.","שמורות טבע, עתיקות ושדות תעופה.","תחנות אוטובוס ותחנות רכבת."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2020-07r2#4","e":24,"n":4,"s":"חברת הבנייה \"אשרמן\" בנתה בניין בטבריה ובשל התפרצות וירוס הקורונה נוצר עיכוב בתהליך הבנייה. בעקבות זאת החליטה \"אשרמן\" להתחיל ולאכלס את הבניין בטרם הסתיימו עבודות הפיתוח והגינון בחצר ובטרם התקבל \"טופס 4\".\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שהבנייה הושלמה והדירות מוכנות למגורים, אין כל מניעה להתחיל באיכלוסן.","הוועדה המקומית העניקה היתר לבנייתו של הבניין, לפיכך אין כל מניעה להתחיל באיכלוסן של הדירות.","כל עוד לא חתמה הוועדה המקומית על \"טופס 4\" לא ניתן לאכלס את הדירות בבניין.","כל עוד לא סיימה החברה את כל עבודות הפיתוח והגינון בחצרים סביב הבניין, לא ניתן להתחיל באיכלוסו."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2020-07r2#5","e":24,"n":5,"s":"מר ציפורי הוא בעלים של דירה בקומת קרקע בבית משותף בן 8 דירות. לבניין קיים תקנון מצוי. באסיפה כללית של בעלי הדירות בבניין התקבלה החלטה, לפיה יבוצעו שיפוצים בבניין במסגרת \"החזקה תקינה\", הכוללים: צביעת חדר המדרגות, תיקון המעלית, איטום וזיפות הגג. בהחלטה נקבע כי כל הדיירים יתחלקו באופן שווה בהוצאות השיפוץ. מר ציפורי מתנגד להחלטה זו, בנימוק ששטח דירתו קטן משטחן של כל אחת מהדירות האחרות.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מר ציפורי צריך להשתתף בתשלום השיפוצים בבניין ולשלם כפי שנקבע באסיפת בעלי הדירות, מאחר שמדובר ב\"החזקה תקינה\" וניהולו של הרכוש המשותף בבניין.","מר ציפורי צודק בהתנגדותו; התשלום עבור השיפוצים צריך להיות בהתאם ליחס בין שטח רצפת דירתו לבין שטח הרצפה של כל הדירות שבבית המשותף.","מר ציפורי צריך להשתתף בתשלום השיפוצים כפי שנקבע באסיפת בעלי הדירות בבניין; ההחלטה התקבלה ברוב קולות ולא ניתן לערער עליה.","מר ציפורי צודק בהתנגדותו, מאחר שהתשלום עבור איטום וזיפות הגג לא צריך לחול עליו כבעל דירה בקומת קרקע."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2020-07r2#6","e":24,"n":6,"s":"שמואל וגילה הם זוג נשוי, אשר בבעלותם דירה המשמשת למגוריהם. שמואל מעוניין למכור את חלקו בדירה. מכיוון שלגילה קיימת זכות קדימה, הוא הציע למכור לה את חלקו בסכום של 1.4 מיליון ש\"ח. גילה סירבה להצעה. 8 חודשים לאחר מכן פנה שמואל לחברו ריצ'י והציע למכור לו את חלקו בסכום של 1.2 מיליון ש\"ח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שמואל פעל כדין, הוא קודם הציע לגילה את חלקו בדירה ורק לאחר שסירבה הציע אותו לחברו.","שמואל פעל שלא כדין; היה עליו להמתין לפחות 12 חודשים מהיום בו סירבה גילה להצעה עד ליום בו העביר את חלקו לחברו ריצ'י.","שמואל פעל שלא כדין, מכיוון שגילה סירבה להצעתו, הוא היה רשאי להציע, בנקודת זמן זו, את חלקו לריצ'י, אך רק בסכום גבוה מהסכום אשר הציע לגילה.","שמואל פעל שלא כדין, היה עליו להציע את הדירה לגילה פעם נוספת במחיר החדש ורק אם הייתה עומדת בסירובה, יכול היה להציע אותה לחברו ריצ'י."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2020-07r2#7","e":24,"n":7,"s":"מהי \"חברה משכנת\"?","o":["חברה משכנת היא חברה הבונה בניין ומשכנת את הדיירים בו.","חברה משכנת היא חברה קבלנית, אשר זכתה במכרז להקמת שכונה שלמה בעיר מסוימת.","חברה משכנת היא חברה יעודית למשכנתאות.","חברה משכנת היא חברה ממשלתית, אשר בונה בנייני מגורים לאוכלוסיות מוחלשות בלבד."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2020-07r2#8","e":24,"n":8,"s":"רן הציע לדניאל לרכוש ממנו את דירתו והודיע לו כי הצעתו זו תעמוד בתוקף למשך 20 ימים. לאחר 19 ימים דניאל נתן הצעה נגדית נמוכה יותר.\nאיזה מהמשפטים הבאים מתאר באופן הנכון ביותר את המצב המשפטי?","o":["קיבולו של דניאל הוא למעשה הצעה חדשה, אשר על רן חלה החובה לקבלה.","קיבולו של דניאל הוא קיבול תוך שינוי ומשכך בין רן לדניאל נכרת חוזה מחייב.","קיבולו של דניאל הוא למעשה הצעה חדשה, אשר רן צריך לקבלה על מנת שייכרת חוזה מחייב בין השניים.","קיבולו של דניאל הוא קיבול להצעה בלתי חוזרת, ומשכך בין רן לדניאל לא נכרת חוזה מחייב."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2020-07r2#9","e":24,"n":9,"s":"ראובן הינו בעל בית בדמי מפתח אשר מעוניין להחזיר לעצמו את הנכס. על כן הגיע להסכמה עם אמנון, הדייר, על חלקו בדמי המפתח וביקש מאמנון לפנות את הנכס בתוך 90 ימים.\nמכיוון שראובן לא שילם לאמנון את חלקו, אמנון לא פינה את הדירה. ראובן פנה לבית המשפט שהוציא פסק דין לפינוי. ראובן פנה להוצאה לפועל לצורך ביצוע הפינוי של אמנון ולא התכוון לשלם לאמנון את הסכום שהוסכם ביניהם עד שיפנה את הנכס.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ראובן יכול להפעיל כוח סביר כדי לפנות את אמנון מהדירה.","ראובן לא יכול לבצע את פסק הדין כל עוד לא שילם לאמנון את חלקו.","ראובן יכול לפנות את אמנון באמצעות המשטרה בתנאי שישלם לו את חלקו בתוך 15 יום מיום שיפונה.","ראובן לא יכול לפנות את אמנון, מכיוון שהוא דייר מוגן עד שימצא דירה חלופית."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2020-07r2#10","e":24,"n":10,"s":"יוסף, בן 80, הינו קשיש וחולה ומתגורר בשכירות מוגנת בדירה בת 5 חדרים בתל אביב. יוסף ביקש מבנו ראובן ובני משפחתו המתגוררים בדירתם בבאר שבע, לבוא ולהתגורר עימו בדירתו המרווחת וכן לסייע לו בעת הצורך. ראובן ובני משפחתו קיבלו את הצעת אביו ועברו לגור עימו, וזאת לאחר שהשכירו את דירתם בבאר שבע. לאחר שנה נפטר האב הקשיש. עם תום ימי השבעה פנה בעל הבית, מר גרשוני, לראובן ודרש ממנו את פינוי הדירה והשבתה לידיו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר? מדוע?","o":["בעל הבית אינו צודק מאחר שראובן התגורר ביחד עם אביו בדירה יותר מ- 6 חודשים בסמוך לפטירת האב.","בעל הבית צודק מאחר ולראובן הייתה דירה אחרת למגורים בעת פטירת אביו.","בעל הבית אינו צודק מאחר שזכותם של ילדי הדייר להיות יורשים בעת פטירת האב.","בעל הבית צודק מאחר שראובן לא קיבל את הסכמת בעל הבית להתגורר בדירה ביחד עם אביו."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2020-07r2#11","e":24,"n":11,"s":"ארנון שכר מדן משרד בשטח של 120 מ\"ר לתקופה של 6 שנים. ארנון השקיע בשיפוץ המשרד כ- 200,000 ש\"ח. על מנת להבטיח את זכויותיו במשרד, מיהר ארנון לרשם המקרקעין במטרה לרשום הערת אזהרה לטובתו על המשרד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ארנון זכאי לרשום הערת אזהרה כבעל זכות שכירות, ובלבד שהרשם יודיע מיד על הרישום לדן, בעל הנכס.","ארנון אינו זכאי לרשום הערת אזהרה על זכות השכירות בנכס, אלא רק על קנייה.","רק דן, בעל הנכס, רשאי להורות על רישום הערת אזהרה לטובת השוכר.","רק ארנון זכאי לרשום הערת אזהרה כבעל זכות שכירות במשרד."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2020-07r2#12","e":24,"n":12,"s":"עפ\"י חוק מיסוי מקרקעין, אילו 3 פעולות אינן נחשבות כמכירה?","o":["הורשה, העברה אגב גירושין, מתנה בין קרובים.","הורשה, העברה אגב גירושין, חלוקת נכסי עיזבון בין יורשים.","הורשה, חכירה, העברה בין בני זוג.","הורשה, העברת מניות באיגוד מקרקעין, חלוקת נכסי עיזבון בין יורשים."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2020-07r2#13","e":24,"n":13,"s":"מיכאל הוא הבעלים של שתי דירות בבית משותף במגדלי השקמה ברחובות. לכל אחת מהדירות מוצמד מחסן הרשום בלשכת רישום המקרקעין (טאבו). מיכאל החליט כי הוא מסתפק במחסן אחד בבניין ולכן פנה למתווך מקרקעין מוסמך, כדי שזה יסייע לו במציאת רוכש לאחד מהמחסנים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לבעלי הדירות האחרים בבית המשותף קיימת זכות קדימה ברכישת המחסן ומיכאל רשאי למכור את המחסן רק לאחר שהציע אותו תחילה לבעלי הדירות בבניין.","מאחר שמיכאל הוא הבעלים של המחסן המוצמד לדירתו הוא רשאי למכור את המחסן לכל אדם, בין אם הוא בעל דירה בבניין בין אם לאו.","מיכאל אינו רשאי למכור את המחסן בבניין לאף אדם, בין אם הוא בעל דירה בבניין בין אם לאו, מאחר שהמחסן צמוד לדירה ולא ניתן למכור מחסן בנפרד מהדירה.","מיכאל רשאי למכור את המחסן המוצמד לדירתו אך ורק לאחד מבעלי הדירות בבניין."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2020-07r2#14","e":24,"n":14,"s":"איזה מהמשפטים הבאים, המתייחסים למשקי עזר במושבים חקלאיים, הוא הנכון ביותר?","o":["במושבים ניתן להקצות אך ורק שטחי קרקע, המכונים \"נחלות\", וזאת למטרות עיבוד חקלאי בלבד.","רק במקרים בהם חברי המושב חוכרים את הקרקע ישירות מרשות מקרקעי ישראל, ולא באמצעות אגודה שיתופית, ניתן להקצות משקי עזר למלאכה ולמגורים.","משק עזר למלאכה מיועד לכל אדם אשר החקלאות היא לא מקור פרנסתו העיקרי, בתנאי שלא יעלה על 85 מ\"ר.","משק עזר מיועד, בין היתר, למגורים ולמלאכה לחברי אגודה המתגוררים ביישוב חקלאי, אבל החקלאות היא לא מקור הפרנסה העיקרי שלהם."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2020-07r2#15","e":24,"n":15,"s":"אדם ושירי מעוניינים להוסיף עמודי תמך בחדר המדרגות המשותף בבניין בו הם מתגוררים, וזאת במסגרת פרויקט תמ\"א 38 שמטרתו לחזק את הבניין בלבד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על אדם ושירי לקבל מראש את הסכמתם של 75% מבעלי הדירות בבית המשותף.","על אדם ושירי לקבל מראש את הסכמתם של רוב בעלי הדירות בבית המשותף.","על אדם ושירי לקבל מראש את הסכמתם של כל בעלי הדירות בבית המשותף.","על אדם ושירי לקבל מראש את הסכמתם של 2/3 מבעלי הדירות בבית המשותף."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2020-07r2#16","e":24,"n":16,"s":"דורון היה בעלים של אולם אירועים, אשר נוכח מגפת הקורונה צבר חובות שלא הצליח לפרוע, ולכן זכויותיו באולם האירועים עוקלו ונפתחו כנגדו הליכי הוצאה לפועל. במסגרת ההליכים פורסם מכרז למכירת האולם והוגשו מספר הצעות רכישה, כשההצעה הגבוהה היתה בסך 2,000,000 ש\"ח. ההצעה השנייה היתה בסך 1,800,000 ש\"ח וההצעה השלישית היתה בסך 1,700,000 ש\"ח. כל אחד מהמציעים צירף ערבות בגובה 10% מהסכום שהציע. מנהל המכירות החליט להזמין את המציעים למכירה פומבית, בניסיון להעלות את המחיר ביניהם, אך דרש תחילה שישלימו את גובה הערבות ל- 200,000 ש\"ח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן להזמין את המציעים להעלות את הצעתם, כי מציע ההצעה הגבוהה זוכה בעיסקה.","ניתן להזמין את המציעים להשתתף במכירה פומבית, ויוכלו להשתתף בה רק אם יעלו את הערבות לשיעור של 10% מסכום ההצעה הגבוהה ביותר שנתקבלה.","ניתן להזמין רק את שלושת המציעים הגבוהים ביותר להשתתף במכירה הפומבית, בתנאי שהם מצהירים כי בכוונתם להציע יותר מההצעה הגבוהה ביותר שנתקבלה.","המציעים רשאים לדרוש ממנהל המכירות להזמינם למכירה פומבית, בתנאי שיתנו הצעה משופרת מראש."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2020-07r2#17","e":24,"n":17,"s":"אבנר הוא מתווך בירוחם, המתמחה במגורים. מכיוון שרוב הדירות שאבנר מציע נמצאות ביישוב ועולות כ- 500,000 ש\"ח, נוהג אבנר להחתים את כל הלקוחות על הסכם בלעדיות (אבנר מחתים גם את המוכרים וגם את הקונים) על סכום תיווך קבוע של 20,000 ש\"ח (שהם יותר מ- 2%), וזאת בלי קשר למחיר העיסקה. אבנר פועל כך כדי שתהיה לו הכנסה סבירה.\nישנם לקוחות שהתלוננו וטענו כי אבנר אינו יכול לגבות סכום כזה והוא מנצל את הבלעדיות שבידיו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אבנר יכול לגבות בדירות שבבלעדיות עד 2% מסכום העיסקה אבל לא יותר.","אבנר אינו יכול לנקוב בסכום בשקלים לדמי התיווך, אלא רק באחוזים, ללא קשר אם יש לו הסכם בלעדיות או לא.","אבנר יכול לקבוע סכום מוסכם לדמי התיווך, ללא קשר למחיר העיסקה, גם בבלעדיות.","אבנר יכול לקבוע סכום מוסכם לדמי תיווך, אך שלא יהיו יותר מ- 2% מהמחיר המבוקש בדירות בבלעדיות."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2020-07r2#18","e":24,"n":18,"s":"רותם, יותם ויובל הינם 3 חברים שרכשו במשותף מגרש בשטח של דונם וחצי (1,500 מ\"ר) על מנת לבנות בו בעתיד 3 קוטג'ים למשפחותיהם.\nלפיכך חתמו שלושתם על הסכם בדבר זכויותיהם וחובותיהם בכל הנוגע למגרש, לפיו כל אחד יבנה על שטח של חצי דונם בית בשטח של כ- 350 מ\"ר. רותם ויותם (ללא יובל ששהה בחו\"ל), חתמו על הסכם ביניהם בדבר הניהול הרגיל של המקרקעין המשותפים והשימוש בהם. בינתיים החליט יובל, חובב מכוניות עתיקות, להעמיד על שליש מהמגרש את מכוניותיו, וזאת עד שיבנו את הבתים, והוא הודיע על כך לחבריו. רותם ויותם כעסו על יובל, אך הוא טוען שההסכם ביניהם אינו מחייב אותו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההסכם לגבי ניהול המקרקעין אינו תקף, שכן ההסכם צריך להיות בין כל הבעלים, ויובל אינו יכול להשתמש במגרש שלא למטרת הבנייה.","הסכם ניהול בין רוב הבעלים מחייב את כל הבעלים, ויובל יכול לעשות שימוש במגרש להעמדת המכוניות במידה שהודיע להם על כך ושאינו מונע משותפיו לעשות שימוש סביר במגרש.","יובל יכול להשתמש במגרש רק אם קיבל הסכמה מפורשת של שותפיו, שכן הסכם ניהול המקרקעין הוא על בניית קוטג'ים ולא על העמדת המכוניות.","יובל יכול להשתמש בשליש מהמגרש ולעשות בו ככל שברצונו מבלי להודיע לשותפיו, וזאת מכיוון שלא שיתפו אותו בהסכם הניהול השוטף."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2020-07r2#19","e":24,"n":19,"s":"מהי \"גרירת משכנתא\"?","o":["הארכת תקופת ההלוואה מעבר לתקופה המקורית.","צירוף או העברת המשכנתא לאדם/לווה אחר.","החלפת הנכס המשועבד לבנק כבטוחה להלוואה, בנכס אחר עליו תירשם המשכנתא.","שהלווה גורר את החוב ולא עומד בתשלומים במועדם."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2020-07r2#20","e":24,"n":20,"s":"בע\"א 2643/97 שלמה גנז נ' בריטיש וקולוניאל חברה בע\"מ ואח' דובר על הנסיבות הבאות: ראובן מכר מקרקעין לשמעון. העיסקה הושלמה, פרט לרישום בפנקסי המקרקעין. שמעון מכר המקרקעין ללוי. עיסקה זו הושלמה, פרט לרישום. לוי לא רשם הערת אזהרה לטובתו. חלפו שנים רבות. שמעון מכר את המקרקעין בשנית ליהודה, אשר רשם מיד הערת אזהרה.\nלוי תובע אכיפת ההסכם עימו ורישום המקרקעין על שמו. שמעון ויהודה מתנגדים לכך, תוך שיהודה מבקש כי ההסכם עימו ייאכף. ראובן אינו נוקט כל עמדה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יהודה זכה בנכס, בין השאר מכיוון שלוי לא רשם הערת אזהרה.","לוי זכה בנכס, כי השלים את העיסקה, מלבד רישום.","שמעון זכה בנכס, כי מכרו ללוי וליהודה את אותה קרקע.","כל העיסקאות בטלות והקרקע תוחזר לראובן."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2020-07r2#21","e":24,"n":21,"s":"עמית הינו בעל דוכן פיצה בגודל של 25 מ\"ר (להלן: \"העסק\") שקיבל היתר זמני מהעירייה להפעלתו. הדוכן נפתח לפני 3 חודשים. נוכח חובות שצבר עמית במהלך תקופת הקורונה, החליט למכור את העסק.\nרון, אשר מתעניין ברכישת העסק, מבקש לדעת עד מתי ההיתר הזמני תקף?","o":["היתר זמני ניתן ללא הגבלת זמן.","היתר זמני ניתן לתקופה שמבקש בעל העסק.","היתר זמני ניתן לתקופה של עד שנה.","לא ניתן כלל לקבל היתר זמני."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2020-07r2#22","e":24,"n":22,"s":"גלית ודוד גרים בבניין בן 4 דירות והחליטו ליזום, במסגרת תמ\"א 38, הריסה ובנייה מחדש של הבניין. במסגרת הפרויקט מתכוונים להוסיף לבניין עוד 6 דירות חדשות, כאשר גודל דירות הבעלים הקיימים יישאר זהה לגודלן כיום.\nבבעלות מי תהיינה הדירות החדשות?","o":["הדירות יחולקו בין הדיירים, על פי שטח הדירות הישנות בבעלותם.","הדירות יחולקו בין הדיירים לפי החלק ברכוש המשותף הצמוד לכל דירה, כפי שהיה טרם ביצוע העבודה.","הדירות החדשות תהיינה שייכות לקבלן המבצע בלבד.","הדירות החדשות הן חלק מהרכוש המשותף וינוהלו על ידי ועד הבית."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2020-07r2#23","e":24,"n":23,"s":"משה חתם על עיסקת קומבינציה עם קבלן בקשר לנכס מקרקעין ברחוב השושנים, וקיבל במסגרת העיסקה בעלות בדירה בבניין שהקים הקבלן. בהמשך מכר משה את הדירה לרועי ומאז עברו כ- 19 שנים. לפני שנה קרס אחד העמודים המחזיקים את המרפסת של הבניין והמרפסת התמוטטה.\nמהנדס בניין שבדק את ההתמוטטות קבע כי מדובר באי התאמה יסודית של העמודים המחזיקים את הבניין. רועי תבע ממשה את תיקון המרפסת והעמודים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["משה היה בעל דירה בבניין ולא בנה אותו, ולכן אינו אחראי על איכות הבנייה.","מכיוון שחלפו שנים רבות, מדובר בבלאי טבעי ולא ניתן לתבוע.","מכיוון שחלפו 19 שנה יתכן שמשה אחראי בגין אי התאמה יסודית בבניין.","משה אינו אחראי, מכיוון שעברה תקופת הבדק."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2020-07r2#24","e":24,"n":24,"s":"בבעלות חיים נמצא מוסך למשאיות הממוקם באזור התעשייה של העיר חולון. למוסך חזית לרחוב הבנאי, המהווה עורק תחבורה ראשי באזור ובעורפו שטח פתוח לא מפותח הכולל חורש טבעי ודיונות. לפני כשנה אושרה תוכנית בניין עיר (תב\"ע), לפיה לוועדה המקומית הזכות להפקיע חלק מחזית המגרש בו ממוקם המוסך לטובת הרחבת הכביש. לפני כשבוע קיבל חיים מכתב, לפיו מבקשת הוועדה להפקיע 400 מ\"ר מחזית המגרש, המהווים 46% מהמגרש בו ממוקם המוסך. חיים מבקש בתמורה להפקעה לקבל את אותו גודל של שטח הנמצא בעורף מגרשו ושכיום הינו שטח פתוח בבעלות עיריית חולון.\nמה הדין בסוגיה זו?","o":["הפקעה לצורך כביש אינה מאפשרת חילופי קרקע.","ניתן לבצע חילופי קרקע כל עוד אין לחיים תביעות כספיות.","חיים רשאי לבקש חילופי קרקע מהוועדה המקומית ובהסכמת הוועדה המחוזית.","רק לוועדה הארצית לתכנון ובנייה הזכות לאשר חילופי קרקע."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2020-07r2#25","e":24,"n":25,"s":"מהו מנגנון \"בן ממשיך\" הנהוג במושבים?","o":["מנגנון המאפשר לבן או בת של חקלאי לעבוד במשק ולהמשיך את העסק המשפחתי.","מנגנון המאפשר לחקלאי להעביר את חלקה א' או חלק ממנה, המיועד למגורים, לאחד מילדיו.","מנגנון משפטי המאפשר לרשום את ילדיו של החקלאי כחלק מבעלי המשק והמטעים.","מנגנון המאפשר לחקלאי להעביר את הנחלה כולה לאחד מילדיו."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2020-12r1#1","e":25,"n":1,"s":"למירב דירה שבה היא מתגוררת. הבניין בו נמצאת הדירה הינו בבעלות מדינת ישראל. לימים מירב החליטה לפתוח מסעדה בדירתה.\nהאם צפוי לחול על מירב מס או תשלום כלשהו?","o":["מירב תחויב בתשלום היטל השבחה לוועדה המקומית לתכנון ובנייה.","מירב לא תחויב בתשלום או במס לאף גורם.","מירב תחויב בתשלום מס שבח לרשות מיסוי מקרקעין, על פי שומה.","מירב תחויב בתשלום דמי היתר לרשות מקרקעי ישראל, בגין שינוי יעוד הנכס, ככל שיידרש, ויתכן שתחויב גם בהיטל השבחה."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2020-12r1#2","e":25,"n":2,"s":"משה ביקש לקנות דירה ביישוב המצוי באזור יהודה ושומרון. לשם כך, ביקש מעזרא המתווך לבדוק עבורו את מצב הזכויות בנכס.\nבאיזה מהמשרדים הבאים בהכרח לא יימצא מידע רלבנטי?","o":["הממונה על הרכוש הממשלתי הנטוש באזור יהודה ושומרון.","משרדי רישום מקרקעין במינהל האזרחי יהודה ושומרון.","החברה המשכנת.","רשם המקרקעין (טאבו) בירושלים."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2020-12r1#3","e":25,"n":3,"s":"בבעלות חברת ההשקעות \"סלע\" חלקות קרקע מס' 14, 15, 20 בגוש 16668 בעפולה, המהוות קרקע חקלאית (להלן: \"הקרקע\"). בשל אישור תוכנית ג/7246 אשר ייעדה חלקים מהקרקע לדרך (כביש), נוצרה פגיעה בערך הקרקע, כך ששווייה פחת.\nבתוך כמה זמן על בעלי הקרקע להגיש לוועדה המקומית תביעה לפיצויים?","o":["על בעלי הקרקע להגיש תביעה לפיצויים מהוועדה המקומית בתוך שלוש שנים מיום תחילת תוקפה של התוכנית.","מאחר שהקרקע החקלאית לא נפגעה בדרך של הפקעה, בעלי הקרקע לא יוכלו להגיש תביעה לפיצויים מהוועדה המקומית.","התביעה לפיצויים יכולה להיות מוגשת בכל עת, אך לא יאוחר מחמש שנים מיום תחילת תוקפה של התוכנית.","על בעלי הקרקע להגיש תביעה לפיצויים מהוועדה המקומית בתוך שנה וחצי מיום תחילת תוקפה של התוכנית."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2020-12r1#4","e":25,"n":4,"s":"חברי ועד בית משותף של בניין שנבנה בשנת 1968 ברחוב שלמה בתל אביב, החליטו, במסגרת ישיבת האסיפה הכללית של בעלי הדירות, להעלות הצעה להרחיב את הדירות בבניין, זאת במסגרת תוכנית לחיזוק בתים בפני רעידות אדמה (תמ\"א 38). בהתאם להצעה, הבניין יחוזק מפני רעידות אדמה. על פי תוכנית החיזוק, הדירות בבניין יורחבו במסגרת הרכוש המשותף, ללא תוספת בנייה של דירות חדשות.\nמבין בעלי הדירות, מהו הרוב הנדרש כדי לבצע את התוכנית המוצעת?","o":["יש צורך בהסכמה של כל בעלי הדירות בבניין.","יש צורך בהסכמה של 75% מבעלי הדירות בבניין.","יש צורך בהסכמה של 60% מבעלי הדירות בבניין.","יש צורך בהסכמה של שני שלישים מבעלי הדירות בבניין."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2020-12r1#5","e":25,"n":5,"s":"יניב רכש דירה בת 6 חדרים בקומה האחרונה בבית משותף. בעת החתימה על הסכם הרכישה, ציין עורך דין לוין בפני יניב, כי בתקנון הבית המשותף נקבע שהבעלים של הדירה הנ\"ל אחראי על הוצאות ותשלומי אחזקת הגג המשותף. יניב אינו מעוניין שאחזקת הגג המשותף תהא על חשבונו.\nבנסיבות המתוארות, מה על יניב לעשות כדי לשנות את הקביעה המופיעה בתקנון?","o":["על יניב לפנות למפקח על הבתים המשותפים ולבקש שיורה על שינוי ההוראה בתקנון.","לא ניתן לשנות את ההוראה בתקנון, שכן היא חלה ספציפית על הדירה שיניב רכש.","יניב יכול להתעלם ולא לקיים את הקביעה שאחזקת הגג המשותף חלה על דירתו.","רק בית משפט שלום מוסמך להכריע בסכסוכי מקרקעין ולכן על יניב להגיש תביעה בבית משפט זה, ואין לו אפשרות אחרת לפתור את הנושא."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2020-12r1#6","e":25,"n":6,"s":"בהתאם לפסק דין 1966/05 ת.א. קשתות הנשיא יעוץ ושווק נדל\"ן בע\"מ נגד דוד שמעון ואח', האם מתווכת רשאית להחתים צדדים על מסמך בכתב שלפיו הקונה ישלם מס רכישה, המוכר ישלם היטל השבחה ומס שבח, וכי הם ישלמו קנס במידה ויפרו את החוזה ביניהם?","o":["לא, כי הדבר צריך להיעשות במסמך נפרד מהזמנת התיווך.","לא, כי במקרה כזה המתווכת סייעה לצדדים בעריכת מסמכים בעלי אופי משפטי.","כן, רק אם יצוין מועד מסירת הנכס בכתב.","כן, רק אם המתווכת הציגה בפני התובע וצד ג' רישיון תיווך בתוקף."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2020-12r1#7","e":25,"n":7,"s":"עניינה של התביעה בפס\"ד 35922107 ת.א. מרדכי עוז נ' משה עזרא הוא שיתוף פעולה בין מתווכים, בקשר למכירת דירה, וחלוקת דמי התיווך שהתקבלו ממכירתה.\nלפי פסק הדין, האם ניתן לאכוף הסכם שיתוף פעולה שנעשה בעל פה בין מתווכים?","o":["כן, כל עוד מדובר בחוזה לפי דרישות חוק החוזים בין המתווכים המשתפים פעולה.","לא, לפי סעיף 9 לחוק הזמנת תיווך בכתב.","לא, לפי סעיף 8 לחוק המקרקעין התשכ\"ט 1969, התחייבות לעשות עיסקה במקרקעין טעונה מסמך בכתב.","כן, הן מכוח החובה בסעיף 9 לחוק המתווכים להזמנת תיווך בכתב והן מכוח החובה בסעיף 8 לחוק המקרקעין לערוך הסכם במקרקעין בכתב בלבד."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2020-12r1#8","e":25,"n":8,"s":"פסק דין של ביהמ\"ש השלום 4350/08 ב- ת.א דה–כהן נ' זר–גוטמן ואח' עוסק בסוגיה האם התובע זכאי לקבל מהנתבעים דמי תיווך בעקבות חתימת זיכרון דברים על תנאי, לרכישת נכס מקרקעין, למרות שזיכרון הדברים בוטל בשל אי קיום התנאי הקבוע בו. התנאי היה ביטול צו הריסה בנכס.\nמה נקבע בפסק הדין?","o":["המתווך אינו זכאי לדמי תיווך, כי רק זיכרון דברים ולא עיסקה מלאה נערכו בכתב וזיכרון דברים אינו מחייב, כל עוד לא נחתם חוזה.","המתווך אינו זכאי לדמי תיווך; זיכרון דברים חתום בנסיבות האמורות לא יחייב, אם כניסתו לתוקף הותנתה בהמצאת אישורים ע\"י המוכרים לעניין ביטול צו ההריסה, ואלה לא הומצאו כנדרש.","המתווך זכאי תמיד לקבל דמי תיווך, גם אם עיסקת המכר לא הושלמה - זאת מרגע שנחתם זיכרון דברים בין הצדדים.","המתווך זכאי לקבל דמי תיווך. מתווך לא חייב לגלות לצדדים על קיומו של צו הריסה."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2020-12r1#9","e":25,"n":9,"s":"ורד ביקשה לגרור את המשכנתא הרשומה על דירת מגורים שקנתה בהרצליה לפני כעשור, אל דירת מגורים שרכשה לפני מספר שבועות בתל אביב. לצורך כך, פנתה ורד לחברה המשכנת כדי לקבל את הסכמתה לגרירת המשכנתא.\nהאם די באישורה של החברה המשכנת לצורך גרירת המשכנתא?","o":["לא; שיעבוד דירה הרשומה בחברה משכנת נרשם אך ורק ברשם המשכונות, שכן זכויות הדייר, כל עוד לא נרשמו בפנקסי המקרקעין, הינן זכויות חוזיות ולא קנייניות.","כן; עד לרישום הזכויות בפנקסי המקרקעין, רישום הזכויות בדירה נעשה ברשות מקרקעי ישראל וכן אצל החברה המשכנת.","לא; יש צורך בהסכמת המלווה לצורך החלפת הנכס המשועבד כבטוחה כנגד הלוואה.","כן; אין צורך בהסכמת המלווה כל עוד הלווה לא מכר את דירתו הישנה המשועבדת לבנק."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2020-12r1#10","e":25,"n":10,"s":"שרון הינו בעל דירת 2 חדרים בבניין משותף. שרון הגיש לאריאל הצעה לרכישת חדר אחד מסוים מדירתו, ולא את כולה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין מניעה ששרון ירכוש חדר אחד מסוים מדירת אריאל, אך זכויות הבעלות על החדר לא יירשמו על שמו.","הבעלות במקרקעין תמיד תהיה בחלק מסוים במקרקעין ולכן הדבר אפשרי.","לא ניתן להפריד חלק מסוים מדירת מגורים ולמכור אותו.","אין מניעה ששרון ירכוש חדר אחד מדירתו של אריאל וירשום את זכויות הבעלות בחדר על שמו בטאבו."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2020-12r1#11","e":25,"n":11,"s":"אביעד הוא רופא שבבעלותו משרד בשטח של 42 מ\"ר, הכולל 2 חדרי משרד, חדר שירותים ומחסן. אביעד שכר את שירותיו של אמנון המתווך לצורך מכירת המשרד. אמנון החתימו בכתב על הזמנה לשירותי תיווך, וכן חתם על מסמך נפרד למתן בלעדיות למתווך. בהסכם הבלעדיות לא נקבעה תקופת הבלעדיות. כעבור שלושה חודשים ביקש אביעד להשתחרר מהסכם הבלעדיות, מכיוון שראה כי המתווך לא מצליח להביא רוכשים רציניים, למרות שביצע את פעולות השיווק הנדרשות בחוק.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בכל מקרה, אביעד רשאי לבטל את ההסכם באופן חד צדדי, מאחר שהבלעדיות הסתיימה לאחר שלושה חודשים.","אביעד רשאי לבטל את הסכם הבלעדיות שנחתם עם המתווך אמנון אם הוא לא מרוצה, וזאת רק לאחר שישה חודשים מהיום שבו חתם על ההזמנה.","אביעד רשאי לבטל את הסכם הבלעדיות שנחתם עם המתווך אמנון באופן חד צדדי רק בתום תשעה חודשים מיום החתימה על ההזמנה.","אביעד רשאי לבטל את הסכם הבלעדיות שנחתם עם המתווך אמנון באופן חד צדדי רק בתום שנה אחת מהיום שבו חתם על ההזמנה."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2020-12r1#12","e":25,"n":12,"s":"עופר הוא בעלים של דירת מגורים בת 3 חדרים בחולון. תהילה מעוניינת לרכוש את הדירה של עופר. שני הצדדים סיכמו והצהירו ביניהם בעל פה (ללא מסמך בכתב) על העיסקה, בה עופר ימכור את הדירה לתהילה. הצדדים התייצבו בפני רשם המקרקעין במטרה לרשום את העיסקה בטאבו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רשם המקרקעין ירשום את העיסקה בעל פה לאחר ששני הצדדים לעיסקה יצהירו בפניו בעל פה כי הם מתקשרים בעיסקת מכר, ויזדהו בפניו באמצעות תעודת זהות.","רשם המקרקעין רשאי לרשום את העיסקה בעל פה רק באישור המפקח על המקרקעין.","רשם המקרקעין לא ירשום את העיסקה בטאבו.","רשם המקרקעין לא ירשום את העיסקה בעל פה, אך הוא רשאי לרשום הערת אזהרה לגביה."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2020-12r1#13","e":25,"n":13,"s":"איזה מבין הפרטים הבאים אינו חייב להופיע בהזמנה לביצוע פעולות תיווך במקרקעין?","o":["מספר רישיון התיווך של המתווך.","מחיר העיסקה המבוקשת.","שיעור דמי התיווך.","שם המתווך, שם הלקוח, מספרי הזהות וכתובתם."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2020-12r1#14","e":25,"n":14,"s":"עופרה הינה מתווכת מקרקעין ותיקה שעסקה שנים רבות במקצוע כדין בישראל. עופרה מבקשת שלא לעסוק בתיווך במקרקעין בשנתיים הקרובות, זאת מאחר שהיא תשהה בשליחות בחו\"ל. עופרה הודיעה בכתב על התליית רישיונה מרצון לרשם המתווכים. עם שובה ארצה, הודיעה עופרה על ביטול ההודעה בדבר התליית רישיונה מרצון.\nמה יהיה התנאי לחידוש הרישיון?","o":["עופרה תצטרך להיבחן מחדש בבחינות הרישוי בתיווך במקרקעין.","התנאי לחידוש רישיון התיווך של עופרה הוא תשלום אגרה שנתית יחסית מיום ביטול הודעת ההתליה.","עופרה תצטרך לחזור ולגור בישראל באופן קבוע.","אין אפשרות להתלות רישיון תיווך."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2020-12r1#15","e":25,"n":15,"s":"מהו הסכם \"משבצת דו צדדי\"?","o":["הסכם \"משבצת דו צדדי\" הנו הסכם חכירה אשר נחתם בין רשות מקומית לאגודה שיתופית.","הסכם \"משבצת דו צדדי\" הנו הסכם חכירה אשר נחתם בין הסוכנות היהודית לאגודה שיתופית.","הסכם \"משבצת דו צדדי\" הנו הסכם חכירה אשר נחתם בין רשות מקרקעי ישראל לסוכנות היהודית.","הסכם \"משבצת דו צדדי\" הנו הסכם חכירה אשר נחתם בין רשות מקרקעי ישראל לאגודה שיתופית."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2020-12r1#16","e":25,"n":16,"s":"יוגב גילה חוסר הגינות, חוסר אחריות ורשלנות חמורה במהלך עיסוקו בתיווך במקרקעין. בתגובה, הוגשה כנגדו קובלנה לוועדת המשמעת של רשמת המתווכים ע\"י לקוחתו, חב' שוסטר. ועדת המשמעת החליטה על השעיית רישיון התיווך של יוגב למשך חצי שנה.\nכיצד על יוגב לפעול כדי לבטל את החלטת ועדת המשמעת?","o":["על יוגב להגיש ערעור על החלטת ועדת המשמעת לבית המשפט המחוזי, וזאת בתוך 30 יום מיום מתן ההחלטה.","על יוגב להגיש ערעור על החלטת ועדת המשמעת לבית המשפט המחוזי, וזאת בתוך 45 יום מיום מתן ההחלטה.","על יוגב להגיש ערעור על החלטת ועדת המשמעת לבית משפט השלום, וזאת בתוך 45 יום מיום מתן ההחלטה.","על יוגב להגיש ערעור על ההחלטה לרשמת המתווכים ולוועדת המשמעת בתוך 30 יום מיום מתן ההחלטה."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2020-12r1#17","e":25,"n":17,"s":"יונתן שכר משרד בשטח של 260 מ\"ר ב\"קניון ישראלי\" בתל אביב (להלן: \"הנכס\"), לתקופה של 9 שנים, כשדמי השכירות החודשיים הינם בסך של 100,000 ש\"ח לחודש. כדי להבטיח את זכויותיו בנכס, רשם את זכויות החכירה בטאבו, וזאת בהסכמת המשכיר. לימים, יונתן נזקק להלוואה. הוא פנה לבנק למשכנתאות לקבלת הלוואה תמורת שיעבוד זכויות השכירות.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בנק למשכנתאות לא ייתן הלוואה ליונתן על סמך זכויות \"שכירות קצרה\" שלו בנכס.","רשם המקרקעין לא ירשום את זכויות השכירות בטאבו על שם יונתן.","יונתן רשאי לשעבד את זכויותיו בנכס לקבלת הלוואה, בכפוף לתנאי השכירות ובלי הסכמת המשכיר.","יונתן רשאי לשעבד את זכויותיו בנכס לקבלת הלוואה, בתנאי שהמשכיר יסכים לכך."],"c":[2],"a":false,"note":"","sub":"r_rent"},{"id":"2020-12r1#18","e":25,"n":18,"s":"בני הזוג נפתלי ושימחה הדר מתגוררים בשכירות מוגנת לפי חוזה, בבית מרווח, וזאת החל משנת 1956. חוזה השכירות המקורי הסתיים, אך הצדדים המשיכו לנהוג לפיו. לימים, לאחר שהילדים עזבו את הבית, החליטו בני הזוג להשכיר 2 חדרים בדירתם. בעל הבית הביע התנגדות לכך.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["התנגדות בעל הבית אינה מוצדקת, מאחר שהשוכרים רשאים להשכיר בשכירות משנה חלקים מהמושכר.","התנגדות בעל הבית מוצדקת; הזוג הדר רשאי להשכיר בשכירות משנה חלקים מהמושכר רק בהסכמת בעל הבית.","התנגדות בעל הבית אינה מוצדקת, מאחר שהשוכרים מחזיקים במושכר מלפני שנת 1962 ויש להם זכות להשכיר בשכירות משנה את המושכר כולו או חלקים ממנו, גם ללא הסכמת בעל הבית.","התנגדות בעל הבית אינה מוצדקת, מאחר שהשוכרים רשאים להשכיר בשכירות משנה את המושכר כולו, או חלקים ממנו."],"c":[1],"a":false,"note":"","sub":"r_rent"},{"id":"2020-12r1#19","e":25,"n":19,"s":"לצורך עבודות הקמת הרכבת הקלה, מבקשת המדינה להפקיע ולהרוס את בית הקפה הוותיק \"עלית\" הנמצא על ציר רח' ז'בוטינסקי בתל אביב.\nבנסיבות אלה, כיצד ייקבע שווי \"המכירה\" לצורך חישוב מס שבח מקרקעין?","o":["מכיוון שמדובר בהפקעה, אין כל חיוב במס שבח מקרקעין - הפקעה איננה נחשבת כמכר.","שווי \"המכירה\" של המקרקעין שהופקעו יהיה בהתאם לשווי השוק, כפי שייקבע ע\"י השמאי הממשלתי.","שווי המכירה הוא שווי ביום המכירה של הזכות במקרקעין הנמכרת כשהיא נקייה מכל שיעבוד או משכנתא.","שווי המכירה של המקרקעין שהופקעו הוא השווי שנקבע לעניין הפיצויים בשל ההפקעה."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2020-12r1#20","e":25,"n":20,"s":"זהבה ומירון מעוניינים לפתוח בדירתם קייטנה לילדים הנמצאים בחופשת הקיץ.\nהאם זהבה ומירון מחויבים ברישיון עסק?","o":["כן.","לא.","לא, אך מחויבים בהוראות המדינה בנושא תברואה.","כן, רק אם הקייטנה מוגדרת כ\"מחנה נוער\" לפי חוק."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2020-12r1#21","e":25,"n":21,"s":"עמותת \"עלומים\", המטפלת בילדים ובוגרים עם מוגבלויות פיזיות וצרכים מיוחדים, פנתה למתווך מקרקעין, מר אלון קאופמן, שיאתר עבור העמותה נכס בשכירות לצורך מעון למגורי 9 חוסים.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["לא ניתן לאכלס יותר משישה חוסים בבניין מאוכלס המיועד למגורים, אלא אם יועד לכך על ידי ועדה מקומית לתכנון ובניה.","כל נכס בבניין בנוי ומאוכלס המיועד למגורים, עשוי להתאים למגורי החוסים, ללא כל מגבלה.","יש צורך בקבלת אישור ועדה מקומית לתכנון ובניה לאיכלוס החוסים, לכל מספר חוסים שהוא.","ניתן להרשות בחוזה מול בעל הנכס, איכלוס חוסים ללא הגבלה, והדבר תלוי בבעל הנכס בלבד."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2020-12r1#22","e":25,"n":22,"s":"איזו מההגדרות הבאות היא הנכונה ביותר ביחס ל\"שיכון ציבורי\"?","o":["\"שיכון ציבורי\" הם מקרקעין שאושרו על ידי ועדה מקומית
