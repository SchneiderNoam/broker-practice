.","כן, ורק אם כל השכנים מסכימים למכירה."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2013-07#20","e":2,"n":20,"s":"מר זאב שועלי שוחרר זה עתה מהכלא לאחר שריצה שנת מאסר בגין עבירות שוחד ומירמה. מיד עם שחרורו החליט מר שועלי לפתוח משרד תיווך. כדי לזרז את הליכי קבלת רישיון התיווך, זייף מר זאב שועלי תעודת יושר של משטרת ישראל, על-פיה מעולם לא הורשע בפלילים. הצגת תעודת היושר בפני רשם המתווכים הביאה לכך שמר שועלי הורשה לגשת לבחינות רשם המתווכים, ולאחר שעמד בהן בהצלחה הוענק לו רישיון מתווך במקרקעין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מר שועלי עשוי להיות מורשע בעבירה פלילית, אך לא ניתן להרשיעו בעבירת משמעת.","מר שועלי עבר עבירת משמעת, אך לא ניתן להעמידו לדין פלילי.","מר שועלי עשוי לעמוד לדין פלילי, אך ניתן יהיה להעמידו לדין משמעתי רק אם יורשע בדין הפלילי.","מר שועלי עשוי לעמוד לדין פלילי, וללא תלות בכך, הוא עשוי להיות מורשע בעבירת משמעת בהתאם לחוק המתווכים במקרקעין."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2013-07#21","e":2,"n":21,"s":"דבורה היא מתווכת מקרקעין ותיקה ובעלת מוניטין. במסגרת עבודתה, תיווכה דבורה בעיסקת מכר של שטח מסחרי, הנמצא בבעלות חברת \"ציפורי השיר\" בע\"מ הנמצאת בשליטתו המלאה של יונה עפרוני, שהוא נכד (מנישואים קודמים) של בעלה. דבורה לא הביאה לידיעת הקונה את העובדה שיונה עפרוני מוכר לה בהיותו נכד של בעלה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כיוון שמוכרת הנכס היא חברה בע\"מ, ולא יונה עפרוני במישרין, לא היה על דבורה להודיע לקונה על היכרותה עם מר עפרוני.","כיוון שמר עפרוני הוא לא צאצא של דבורה, אלא נכד של בעלה מנישואים קודמים, לא היה על דבורה להודיע לקונה על היכרותה עם מר עפרוני.","על דבורה היה להודיע לקונה על היכרותה עם מר עפרוני, אך הדבר לא מהווה עבירת משמעת.","דבורה עברה עבירת משמעת בהתאם לחוק המתווכים במקרקעין."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2013-07#22","e":2,"n":22,"s":"יוסף הוא מתווך בעל רישיון שעבר עבירת משמעת לפי חוק המתווכים. ועדת המשמעת שדנה בעניינו של יוסף הטילה עליו אמצעים משמעתיים כדלקמן: התליית הרישיון לתקופה של 5 שנים, התראה ונזיפה. יוסף טוען כי החלטת הוועדה היא לא בהתאם לחוק.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההחלטה היא לא בהתאם לחוק, כי לא ניתן לגזור על יוסף יותר מאשר אמצעי משמעתי אחד.","ההחלטה היא לא בהתאם לחוק, כי לא ניתן לגזור על יוסף יותר מאשר שני אמצעים משמעתיים.","ההחלטה היא לא בהתאם לחוק, כי העונשים שהטילה הוועדה לא עומדים בדרישות החוק.","ההחלטה עומדת בתנאי החוק."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2013-07#23","e":2,"n":23,"s":"מהי \"גרירת משכנתא\"?","o":["כאשר הלווה מבקש להחליף את הבנק ממנו נטל את הלוואת המשכנתא (החלפת הגורם המלווה).","כאשר הלווה מבקש להחליף את הנכס המשועבד למלווה כביטחון להחזר הלוואת המשכנתא (החלפת השיעבוד).","כאשר הלווה מבקש להחליף את הערבים אשר חתמו ערבות להחזר הלוואת המשכנתא (החלפת ערבים).","כאשר הלווה מבקש לשנות את סכום ההלוואה."],"c":[1],"a":false,"note":"","sub":"l_mortgage"},{"id":"2013-07#24","e":2,"n":24,"s":"דניאל הוא שוכר אשר חתם לפני כחודש ימים על חוזה שכירות לדירת מגורים לתקופה של 25 שנה. אתמול סיים דניאל את רישומה של שכירות זו בלשכת רישום המקרקעין, והיום הוא מעוניין לשעבד שכירות זו במשכנתה, וזאת ללא הסכמת חיים המשכיר. בחוזה השכירות לא צויין דבר לעניין האפשרות למשכן את השכירות.\nהאם דניאל צריך לקבל את הסכמתו של חיים לשם שיעבוד השכירות במשכנתה?","o":["כן, כל חוזה שכירות מחייב הסכמת המשכיר לצורך שיעבוד השכירות במשכנתה.","לא, מכיוון שזהו חוזה שכירות לתקופה של 25 שנים.","לא, מכיוון שהשכירות נרשמה ולא צויין דבר בחוזה לעניין משכנתה.","כן, מכיוון שזהו חוזה שכירות לתקופה של 25 שנים."],"c":[2],"a":false,"note":"","sub":"r_rent"},{"id":"2013-07#25","e":2,"n":25,"s":"עורכת הדין מזל מונתה בלשכת ההוצאה לפועל ככונסת נכסים, למכירת דירה. לאחר שהדירה נמכרה במכרז, מצא הקונה כי בדירה קיימת רטיבות, וברצונו לתבוע את כונסת הנכסים בגין אי גילוי מידע, על פי סעיף 4 לחוק הגנת הצרכן.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הקונה יכול לתבוע את כונסת הנכסים ולא תעמוד לה כל הגנה על-פי דין.","הקונה יוכל לתבוע את כונסת הנכסים, רק אם יקבל את אישור ראש ההוצאה לפועל להגשת התביעה.","לכונסת הנכסים עומדת הגנה על פי דין, בהיותה כונסת נכסים, כל עוד לא ידעה על הרטיבות האמורה.","לכונסת הנכסים עומדת הגנה על פי דין, בהיותה כונסת נכסים, כל עוד לא ידעה על הרטיבות האמורה, ואף ציינה בהצעה למכירת הדירה, כי אין לה ידיעה על מצב הדירה וכי לא תישא באחריות."],"c":[3],"a":false,"note":"","sub":"k_consumer"},{"id":"2013-10#1","e":3,"n":1,"s":"נתונים לשאלות 1-2\nגד וראובן חתמו על חוזה לפיו גד ימכור לראובן את ביתו. בעיסקה תיווך בנימין, מתווך מורשה.\nראובן גילה כי גד הסתיר ממנו את העובדה שמרפסת הבית ואחד החדרים נבנו באופן לא חוקי, ולפיכך שווי הבית נמוך באופן מהותי מהמחיר שעליו הסכימו. ראובן מעוניין לקבל את הסכום ששילם בחזרה וכן פיצוי על הוצאות שנגרמו לו, כגון: עורך דין, מהנדס בנייה, אובדן זמן ועוגמת נפש.\nכדי להשיג את מבוקשו, מה מהבאים על ראובן לדרוש? מדוע?","o":["לדרוש אכיפה יחד עם פיצויים שנועדו להשיב את המצב לקדמותו.","לדרוש ביטול יחד עם פיצויים שנועדו להשיב את המצב לקדמותו.","לדרוש אכיפה יחד עם פיצויים בגובה עלות הכשרת הבניה הלא החוקית בוועדת התכנון (פיצויי קיום).","זוהי טעות בכדאיות העסקה בלבד ולכן לא ניתן לדרוש כל פיצוי."],"c":[1],"a":false,"note":"","sub":"c_remedy"},{"id":"2013-10#2","e":3,"n":2,"s":"לאחר שבוע הסתבר לראובן שבנימין המתווך ידע על אי-חוקיות הבנייה כבר בעת שהראה לראובן את הבית לפני הקנייה. ראובן תבע את בנימין ודרש את החזר דמי התיווך. בנימין טען שאמנם העריך ש\"משהו לא בסדר\" אבל טען שאין זה מתפקידו להבין בחוקי התכנון והבנייה, וכי היה על ראובן להיוועץ בעו\"ד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ראובן לא זכאי לקבל את דמי התיווך בחזרה, מאחר שאין זה מתפקידו של המתווך להבין בחוקי התכנון והבנייה, והאחריות תוטל על עורך הדין של העיסקה.","ראובן זכאי לקבל חזרה את דמי התיווך, מאחר שמרגע שבנימין הפר את חובת ההגינות נשללה זכאותו לדמי התיווך.","ראובן היה צריך להגיש את התביעה להחזר דמי התיווך כנגד גד ולא כנגד בנימין שהוא לא צד לעיסקה.","אם בנימין יטען שחריגות הבנייה הן עניין אישי של גד, ראובן לא יהיה זכאי לקבל את דמי התיווך בחזרה שכן על בנימין חלה חובת חיסיון."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2013-10#3","e":3,"n":3,"s":"לאסף דירת 5 חדרים. אסף מכר את אחד החדרים בדירה לכנרת, השכיר חדר אחר לגולן לתקופה של 4 שנים והשכיר חדר שלישי לירדן לתקופה של 20 שנה.\nאיזו/אילו מהעיסקאות יסכים רשם המקרקעין לרשום בלשכת רישום מקרקעין?","o":["כנרת וירדן.","גולן וירדן.","כנרת בלבד.","ירדן בלבד."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2013-10#4","e":3,"n":4,"s":"אורי קנה מרועי בית הבנוי על קרקע מוסדרת. אורי שילם רק מחצית מהתמורה ובהתאם לתנאי הסכם המכר הוא לא יכול לבצע העברת בעלות בבית עד שישלם את מלוא התמורה.\nבנסיבות העניין, איך יכול אורי להגן על זכויותיו המשפטיות?","o":["למרות האמור בהסכם יכול אורי לרשום בעלות מאחר ששילם את מחצית התמורה.","לרשום הערת אזהרה.","אין לו דרך להגן על עצמו.","לבקש מרשם המקרקעין לרשום עיקול על הבית."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"l_register"},{"id":"2013-10#5","e":3,"n":5,"s":"לגילה יש דירה שהיא חלק מבית משותף במרכז תל אביב. לדירה צמודות 2 חניות בטאבו. מאחר שלגילה יש רק מכונית אחת, היא החליטה להשכיר את החניה השנייה.\nבנסיבות העניין, האם מותר לגילה להשכיר את החנייה?","o":["כן, בתנאי שתקבל את אישור בעלי כל הדירות.","כן, בתנאי שתקבל את אישור רוב בעלי הדירות.","כן.","לא ניתן לבצע עיסקה רק בחלק מדירה."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2013-10#6","e":3,"n":6,"s":"חברת \"הבונים\" בונה פרויקט מגורים שיכלול 100 דירות מגורים, ללא נכסים מסוגים אחרים. כדי לשווק את הפרויקט פנתה החברה למשרד תיווך גדול. המשרד החתים את נציג החברה על חוזה בלעדיות למשך 24 חודשים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל פגם בחוזה האמור.","החוזה בטל, מאחר שהנכסים שבהם מדובר הם דירות מגורים.","המצב לא חוקי והחוזה בטל מאחר שתקופת הבלעדיות עולה על התקופה הקבועה בחוק.","הבלעדיות תהיה תקפה ל- 6 חודשים בלבד ואז תתבטל מאליה."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2013-10#7","e":3,"n":7,"s":"לניצן דירה ביקנעם. ניצן משכירה את הדירה שבבעלותה לדנה. בחוזה השכירות נכתב שכדי להבטיח את המשך מגוריה של דנה בדירה לתקופה ארוכה, ניצן מתחייבת שלא למכור את הדירה במשך 15 שנה. דנה מעוניינת לרשום את התחייבותה של ניצן כהערה בלשכת רישום המקרקעין.\nבנסיבות העניין, האם יכולה דנה לעשות זאת?","o":["כן, בתנאי שלא חלפה שנה ממועד החתימה על חוזה השכירות.","לא, מאחר שלא מדובר בחוזה מכר, לא ניתן להגביל העברת בעלות.","לא, לא ניתן לרשום הגבלה של אי העברת זכות מכוח חוזה שכירות.","כן."],"c":[3],"a":false,"note":"","sub":"r_rent"},{"id":"2013-10#8","e":3,"n":8,"s":"דייר בקומת גג בבית משותף הוא אדם הסובל ממוגבלות כהגדרתה בחוק שוויון זכויות לאנשים עם מוגבלות, תשנ\"ח- 1998. הדייר מעוניין, על חשבונו, לחספס בעדינות את המדרגות ואת שביל הגישה על מנת למנוע החלקה, באופן שלא פוגע בחדר המדרגות וביכולת השימוש הסבירה של הדיירים האחרים. הדייר הציע כי הוא יישא בכל העלויות וכן הציג אישור של מרפא בעיסוק במסמך הערוך לפי הטופס שבחלק ד' לתוספת השנייה לחוק, כי ביצוע ההתאמה דרוש לו בשל מוגבלותו, לשם נגישותו הבטוחה והעצמאית. 60% מהדיירים מתנגדים, מאחר שהם טוענים שביצוע עבודות כאלה יכער את הבניין ויפגע בערך רכושם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יש צורך בהסכמה פה אחד.","יש צורך בהסכמה של רוב רגיל.","יש צורך בהסכמה של רוב בעלי הדירות ששטח של 2/3 מהרצפה צמוד לדירותיהם.","אין צורך בהסכמה."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2013-10#9","e":3,"n":9,"s":"מה ההבדל בין הפרה יסודית של חוזה להפרה שאינה יסודית?","o":["הפרה יסודית היא מעשה חמור שעלול לגרור סנקציות פליליות.","הפרה שאינה יסודית היא לא הפרה חמורה של החוזה ולא מעניקה זכות ביטול בכל מקרה, אלא רק זכות לקבלת פיצויים.","בהפרה יסודית צריך להודיע מיידית לצד המפר כי הוא מפר ואילו בהפרה לא יסודית ניתן להודיע לו בתוך זמן סביר.","הפרה יסודית מזכה את הצד הנפגע בזכות ביטול מיידית ואילו בהפרה לא יסודית יש צורך לתת אורכה לצד המפר לתיקון ההפרה."],"c":[3],"a":false,"note":"","sub":"c_remedy"},{"id":"2013-10#10","e":3,"n":10,"s":"אמיר ועופרה הם בני זוג המתגוררים בדירה אופנתית ברחוב שינקין. כמו כן, לעופרה יש משק חקלאי בצפון הארץ, אשר ירשה, ביחד עם אחותה עדנה, מהוריה. המשק נרשם על שם שתי האחיות שנה אחרי מות ההורים. על שטח המשק נמצא צריף בו גר חקלאי המעבד את הקרקע עבור עופרה.\nאם עופרה רוצה למכור את חלקה במשק, למי מהבאים יש זכות קדימה?","o":["לאמיר - מכוח היותו בן זוגה של עופרה.","לאף אחד אין זכות קדימה.","לחקלאי המעבד את הקרקע - בתנאי שהוא מעבד את הקרקע יותר מ- 3 שנים.","לעדנה - מכוח היותה יורשת משק חקלאי."],"c":[1,3],"a":false,"note":"תשובה נכונה: תשובות ב וד התקבלו","sub":"ila"},{"id":"2013-10#11","e":3,"n":11,"s":"רוני וליטל הם ידידים ותיקים. רוני הוא מתווך מורשה. ליטל פנתה לרוני וביקשה ממנו למצוא לה דירה לקנייה. רוני הסכים, והשניים חתמו על הסכם, לפיו רוני לא ייקח מליטל דמי תיווך. רוני אכן מצא דירה לליטל. ערב החתימה על החוזה נודע לרוני כי בדירה יש בעיית טחב קשה.\nהאם רוני חייב להודיע על הבעיה לליטל?","o":["לא, מאחר שליטל לא משלמת דמי תיווך.","לא, מאחר שליטל היא ידידה ותיקה שלו.","כן, מאחר שרוני הוא מתווך חלה עליו חובת ההגינות גם כלפי לקוח שלא משלם.","כן, ובלבד שנרשם בהסכם התיווך שליטל היא לקוחה שלו."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2013-10#12","e":3,"n":12,"s":"מהו \"הסדר השוברים\"?","o":["ההסדר שבין מתווך לבין רוכש דירה מקבלן, לפיו המתווך מקבל את דמי התיווך בהתאם לשוברי התשלום לקבלן.","ההסדר שבין מקרקעין צמודים ההורסים יחד חציצה המפריעה למעבר ולקיום זיקת הנאה בין המגרשים.","שיטת רישום במינהל מקרקעי ישראל, הנקראת כך משום שהיסטורית היו משלמים לפקידים בשוברים ולא במזומן.","ההסדר שבין קבלן לבנק לפיו הבנק מנפיק לקבלן שוברים לתשלום עבור דירות."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2013-10#13","e":3,"n":13,"s":"לרוני דירה המיועדת למגורים בקומה התחתונה של בניין ברחוב רוטשילד בת\"א. רוני מבקשת לפתוח במקום חנות.\nבנסיבות העניין, מה על רוני לעשות?","o":["להגיש בקשה להקלה.","להגיש בקשה לשימוש חורג.","אין צורך בהגשת בקשה כלשהי לשימוש בדירה כחנות.","להגיש בקשה להיתר בנייה."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2013-10#14","e":3,"n":14,"s":"במקרה שאדם שוכר מקבלן דירה חדשה לתקופה של 20 שנים - האם יש צורך לצרף מיפרט לחוזה המכר?","o":["כן, בכל עיסקה עם קבלן צריך הקבלן לצרף מפרט.","לא.","יש לצרף מפרט, אלא אם כן הוסכם אחרת בחוזה השכירות.","כן, כי השוכר הוא בגדר קונה משנה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2013-10#15","e":3,"n":15,"s":"גדי חוכר חלקה ממינהל מקרקעי ישראל, עליה הוא מתעתד לבנות את בית חלומותיו. לאחרונה, עקב קשיים כלכליים, החליט גדי לפצל את החלקה לשתי חלקות בנייה נפרדות. הניחו כי הפיצול אפשרי בהתאם לחוקי התכנון והבנייה והתוכניות החלות על החלקה.\nאיזה תשלום צריך גדי לשלם על מנת לקבל את הסכמת מינהל מקרקעי ישראל לפיצול המגרש?","o":["גדי לא צריך לשלם למינהל כלל, היות ושטחן הכללי של החלקות כלל לא שונה.","על גדי לשלם למינהל מקרקעי ישראל דמי היתר.","על גדי לשלם למינהל מקרקעי ישראל דמי היוון.","על גדי לשלם למינהל מקרקעי ישראל דמי הסכמה."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2013-10#16","e":3,"n":16,"s":"חיים ושולה התקשרו בעיסקת מקרקעין בה חיים ימכור לשולה דירת מגורים שבעבר היה בה שינוי תכנוני ולכן במימוש הנכס תהיה חבות לשלם היטל השבחה. חיים מעוניין ששולה תשלם את כל המיסים – היטל השבחה, מס שבח ומס רכישה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הדבר אסור ביחס להיטל ההשבחה, אבל מותר ביחס למיסי שבח ורכישה.","השבחה ומס רכישה הינם מיסים עקיפים ולכן מותר \"לגלגל\" אותם על הרוכש, אבל שבח הוא מס אישי ולכן על חיים לשלמו.","אין מניעה לקבוע ששולה תשלם את כל המיסים ובלבד ששולה מגישה דו\"חות שנתיים כדין ורשומה כעוסק או כעוסק מורשה ברשות המיסים.","אין מניעה לקבוע ששולה תשלם את כל המיסים, אולם הדבר עשוי לשנות את מחיר הרכישה לצורכי מס."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2013-10#17","e":3,"n":17,"s":"דאוד הוא הבעלים של נכס מקרקעין. הנכס הופקע, ודאוד קיבל תמורתו 2 מיליון ש\"ח וכן קרקע חלופית.\nהאם יחול מס שבח על ההפקעה, ואם כן, על מה?","o":["יחול מס שבח מלא על התשלום במזומן בלבד.","יחול מס שבח מופחת על התשלום במזומן בלבד.","יחול מס שבח מלא הן על התשלום במזומן והן על ערך הקרקע החלופית.","זוהי הפקעה ולא מכירה מרצון ולכן לא יחול מס שבח על ההפקעה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2013-10#18","e":3,"n":18,"s":"אילן ואבנר חתמו על הסכם לרכישת דירה ברחוב הרצל 18 בירושלים. בטעות נרשם בהסכם: רח' הרצל 24 ירושלים. בינתיים אבנר הקונה גילה כי מחיר הדירות באזור צפוי לרדת בשל מלאי דירות גדול האמור להיות מוצע למכירה. הוא מבקש לבטל את החוזה בגלל הטעות במספר הבית.\nבנסיבות העניין, האם הוא רשאי לבטל את ההסכם בנימוק זה? מדוע?","o":["כן, כי מדובר בטעות מהותית, שהרי זו דירה אחרת לגמרי.","כן, אבל רק אם יודיע בתוך זמן סביר על ביטול העיסקה.","כן, אבל רק אם מתברר שהדירה ברחוב הרצל 24 לא עומדת למכירה.","לא, כי מדובר בטעות סופר שניתן לתקן לפי אומד דעת הצדדים, שהרי ברור איזו דירה הם ראו לפני החתימה על ההסכם."],"c":[3],"a":false,"note":"","sub":"c_form"},{"id":"2013-10#19","e":3,"n":19,"s":"בבית משותף גרים 5 דיירים. גג הבניין מוצמד לדירתה של יונה וכך רשום בצו הרישום. כעת מבקשים הדיירים לבצע חיזוק של הבניין נגד רעידות אדמה. אחד מבעלי הדירות הוא קבלן בניין אשר קיבל בהסכמת כלל הדיירים את האחריות לביצוע העבודות. לשם ביצוע הבנייה, יש להעביר את הבעלות בגג לקבלן כדי שהוא יוכל לבנות דירות על הגג. יונה, המעוניינת בביצוע הפרויקט בהקדם, מבקשת להעביר על שם הקבלן את הגג המוצמד לדירתה בלבד.\nבנסיבות העניין, האם הדבר אפשרי?","o":["לא, משהוצמד הגג הרי שהוא מהווה חלק מהדירה, ולא ניתן לעשות עיסקאות רק בחלק מהדירה.","לא, יש צורך לכנס אסיפה נוספת ולהחליט ברוב רגיל על הצמדה מחדש.","כן, בתנאי שההעברה ללא תמורה ויונה לא תקבל עודף זכויות במהלך אישור הפרויקט.","כן, בתנאי שיתוקן צו הרישום ושיודיעו על כך לשאר בעלי הדירות בבניין ויאפשרו להם לטעון את טענותיהם."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2013-10#20","e":3,"n":20,"s":"גיא רכש דירה באריאל הנמצאת באזור יהודה ושומרון. לצורך קבלת משכנתא התבקש גיא למסור לבנק אישור ביחס לזהות הבעלים של הדירה.\nהיכן יכול שי לקבל אישור כזה?","o":["במשרדי רישום המקרקעין במינהל האזרחי.","בלשכת רישום המקרקעין.","במינהל מקרקעי ישראל.","במשרדי מס שבח באריאל"],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2013-10#21","e":3,"n":21,"s":"היטל השבחה ישולם ל: -","o":["וועדה מקומית לתכנון ובנייה.","עירייה/מועצה אזורית מקומית.","המועצה הארצית לתכנון ובנייה.","רשות המיסים (אגף מיסוי מקרקעין)."],"c":[0],"a":false,"note":"","sub":"p_levy"},{"id":"2013-10#22","e":3,"n":22,"s":"יונתן ירש מאביו חנות במרכז בתל אביב. כעת מעונין יונתן למכור את החנות.\nהאם מכירת החנות תיחשב \"מכירת זכות במקרקעין\" לצורכי מס שבח?","o":["לא, מכיוון שהורשה אינה נחשבת למכירה.","לא, במידה וזוהי החנות היחידה שברשותו.","כן.","כן, רק במידה ותתקבל תמורה בגין מכירת החנות."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2013-10#23","e":3,"n":23,"s":"משה נקלע לקשיים כספיים והוא חייב הרבה כסף לאנשים שונים. כדי שלא יעקלו לו את הדירה, מעוניין משה להעניק את דירתו כמתנה לאחיו יניב. יניב לא יודע על החובות של משה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["משה רשאי להעביר את דירתו, אך יניב, כמקבל המתנה, חייב לברר שההעברה לא נועדה למטרה לא כשרה, ואם לא עשה זאת, הוא מבצע עבירה פלילית.","משה מבצע עבירה פלילית, אך אם יניב לא ידע שמטרת ההעברה היא להונות את נושיו של משה, אין עליו אחריות פלילית.","גם משה וגם יניב מבצעים עבירה פלילית, משה בשל הניסיון להונות את נושיו ויניב בכך שלא בדק את כשרות המתנה, למרות שהחוק מחייב אותו בכך.","גם משה וגם יניב לא ביצעו עבירה פלילית, אך בית המשפט יכול לבטל את העיסקה אם ימצא שהמתנה נועדה להונות את נושיו של משה."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2013-10#24","e":3,"n":24,"s":"יצחק ראובני חתם על הסכם לרכישת דירה מחברת \"המשכן בע\"מ\". לצורך רכישת הדירה, נטל מר ראובני משכנתא מבנק \"המלווה\" בע\"מ. הבניין טרם נרשם בפנקסי המקרקעין ('טאבו').\nהיכן תירשם המשכנתא אותה לקח מר ראובני?","o":["היות ומדובר בזכויות במקרקעין – המשכנתא תירשם בפנקסי המקרקעין.","היות ומדובר בזכויות במקרקעין ועדיין אין רישום של הבית, המשכנתא תירשם אך ורק במינהל מקרקעי ישראל.","היות ומדובר בזכויות חוזיות בלבד – המשכנתא אינה יכולה להירשם, והיא תירשם בפנקסי המקרקעין רק לאחר רישום הבית.","היות ומדובר בזכויות חוזיות – המשכנתא תירשם ברשם המשכונות."],"c":[3],"a":false,"note":"","sub":"l_mortgage"},{"id":"2013-10#25","e":3,"n":25,"s":"לזהבה מגרש באור יהודה שייעודו, לפי תוכנית, לשטח חניה. כיום רוצה הוועדה המקומית להפקיע מידי זהבה את המגרש.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הסמכות להפקעה נתונה בידי הממשלה בלבד.","לוועדה המקומית אין סמכות להפקיע מקרקעין מאדם פרטי.","הוועדה המקומית יכולה להפקיע מקרקעין מאדם פרטי.","הוועדה יכולה להפקיע רק במידה וזהבה אינה קטינה."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2014-01#1","e":4,"n":1,"s":"עליזה היא אישה מבוגרת, המעוניינת למכור את דירתה מאחר שעברה להתגורר בבית אבות.היא ביקשה עזרה משכנה הצעיר אפרים. אפרים פרסם את הדירה באתר האינטרנט \"יד משומשת\" ואף הציע להראות את הדירה לקונים הפוטנציאליים, על מנת להקל על עליזה.אפרים מבצע את העבודה בהתנדבות.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא הנכון ביותר?","o":["מותר לאפרים לעשות זאת רק אם ברשותו רישיון תיווך במקרקעין.","מותר לאפרים לפרסם את הדירה אף ללא רישיון תיווך, אך אסור לו להראות את הדירה לקונים, אלא אם כן יש לו רישיון תיווך.","בנסיבות העניין אין כל בעיה שאפרים יפרסם את הדירה ויראה אותה לקונים, כל עוד הוא לא מציג עצמו כמתווך.","אפרים לא רשאי לפרסם את הדירה באינטרנט, אך הוא יכול להראות את הדירה עבור עליזה כל עוד לא יציג עצמו כמתווך."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2014-01#2","e":4,"n":2,"s":"לדניאל בית פרטי בהרצליה פיתוח הרשום על שמו בבעלות מלאה. כיום דניאל זקוק בדחיפות לכסף, וברצונו למכור את בעלותו במבנה בלבד, כך שהקרקע תישאר בבעלותו.\nבנסיבות העניין, האם הדבר אפשרי? מדוע?","o":["לא, מכיוון שהבעלות בקרקע חלה גם על המבנה.","כן, ניתן לעשות הסכם מכר למבנה בלבד, ולאחר מכן לרשום את הבעלות על המבנה בלשכת רישום המקרקעין.","לא, אולם ניתן לפנות לוועדה המקומית ולבקש לפצל את הרישום של המבנה מרישום הקרקע שעליה הוא בנוי, ובמידה והבקשה תאושר, הוא יוכל למכור את המבנה בלבד.","כן, אך רק באישור מינהל מקרקעי ישראל."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-01#3","e":4,"n":3,"s":"קרן ואוהד רכשו לפני כשש שנים מגרש ריק ופנוי בנס ציונה. כשבוע לאחר רכישת המגרש ערכו ביניהם הסכם שיתוף במשרדו של עורך דין שרגא, ובאותו היום נרשם ההסכם בלשכת רישום המקרקעין.בהסכם היה סעיף שבו נרשם: \"למען הסר ספק, אף אחד מהבעלים לא רשאי למכור את חלקו במגרש בעשרים השנים הבאות\".קרן מעוניינת עכשיו למכור את חלקה לחיה, חברתה הטובה.\nבנסיבות העניין, האם הדבר אפשרי?","o":["כן.","לא, מכיוון שהסכם השיתוף נרשם בלשכת רישום המקרקעין.","לא, מכיוון שחלפו רק שש שנים מחתימת החוזה; על קרן להמתין שיחלפו שבע שנים ואז תחול התיישנות על האמור בסעיף.","כן, אולם על קרן להציע את החלקה לאוהד תחילה, ורק אם הוא יסרב לקנותה, תוכל למכור את המגרש לצד שלישי."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2014-01#4","e":4,"n":4,"s":"גדי רכש דירה מאת החברה הקבלנית \"בנייה מעולה\". מיד כאשר גדי קיבל את הדירה מאת החברה הקבלנית, הוא מכר אותה לשולה. החברה הקבלנית דורשת מגדי כתנאי להעברת הזכויות בדירה, שגדי יחתום על כתב ויתור תביעות כנגדה ויצהיר כי אין לו כל טענה ביחס לאי התאמה בדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכותה של החברה לדרוש חתימה על כתב ויתור וגדי חייב לחתום עליו.","רק אם חלפה יותר משנה ממועד מסירת החזקה יכולה החברה לדרוש חתימה על כתב הוויתור וגדי חייב לחתום עליו.","אסור לחברה לדרוש חתימה על כתב ויתור כזה כתנאי למתן הסכמתה להעברה ואין כל תוקף לחתימה על כתב ויתור כזה.","גדי לא חייב לחתום על כתב הוויתור, אבל אם הוא יחתום הוא לא יוכל לטעון כי כתב הוויתור בטל."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2014-01#5","e":4,"n":5,"s":"שמוליק הוא הבעלים של דירה בבניין הרשום כבית משותף וחל בו התקנון המצוי. שמוליק מעוניין להתנתק מהמערכת המרכזית לחימום המים בגלל ריבוי התקלות בה והעלות הכספית שהוא נדרש לשלם בכל פעם. המערכת לא משולבת חימום והסקה. שולה, יושבת ראש ועד הבית, הודיעה לשמוליק כי הוועד מסרב לאפשר לו להתנתק.\nבנסיבות העניין, האם צריך שמוליק את הסכמת בעלי הדירות האחרים בכדי להתנתק מהמערכת המרכזית?","o":["שמוליק יכול להתנתק ללא קבלת הסכמת השכנים.","שמוליק צריך את הסכמתם של שני שליש מבעלי הדירות בבניין.","מכיוון שמדובר ברכוש משותף נדרשת לשמוליק הסכמתם של כל בעלי הדירות בבניין.","שמוליק לא יכול להתנתק מאחר שהוועד סירב לכך, אך אסיפת הדיירים יכולה לבטל את החלטת הוועד ברוב רגיל."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2014-01#6","e":4,"n":6,"s":"רוב בעלי הדירות בבניין מגורים הרשום כבית משותף בפתח תקווה החליטו להצמיד חלק מהגינה לדירה בקומת הקרקע שהיא בבעלותה של זהבה, וזאת כדי שזהבה תוכל לנטוע בגינה עצי פרי. משה, הבעלים של הדירה בקומה שמעל זהבה, מתנגד להחלטה עקב סכסוך אישי שיש לו עם זהבה.\nבנסיבות העניין, האם ניתן לבצע את ההצמדה? מדוע?","o":["לא ניתן, מכיוון שנדרשת הסכמת כל בעלי הדירות.","ניתן להצמיד חלק מהגינה לדירתה של זהבה, מכיוון שישנה הסכמה של רוב בעלי הדירות.","ניתן להצמיד חלק מהגינה, מכיוון שדירתה של זהבה נמצאת בקומת הקרקע והיא סמוכה לגינה.","סכסוך אישי הוא לא סיבה סבירה להתנגדות, ולכן התנגדותו של משה לא רלוונטית."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2014-01#7","e":4,"n":7,"s":"רונן גר בדירה עבורה שילם דמי מפתח. רונן מעוניין לצאת מהדירה, ומציע במקומו דייר חלופי - העמותה לשיקום הקשיש- המבקשת להפעיל במקום משרד. בעל הבית מעוניין לעצור את חילוף הדיירים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בעל הבית רשאי לסרב לדייר החלופי המוצע על פי שיקול דעתו המלא.","התנגדות בעל הבית תיחשב כסבירה בנסיבות העניין, משום שהדייר החלופי הוא גוף מאוגד.","סירובו של בעל הבית ייחשב סביר, אם לפי יעוד הדירה אסור לעשות בה שימוש כמשרד, אך אם לפי הייעוד זהו שימוש מותר, התנגדותו לא תיחשב סבירה.","כל התנגדות של בעל הבית לדייר חלופי בנסיבות העניין תיחשב כבלתי סבירה."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2014-01#8","e":4,"n":8,"s":"מאיה ואסף הם זוג נשוי. בני הזוג פנו יחדיו למתווך לואי, אשר החתים אותם על הסכם תיווך, וראו באמצעותו מספר נכסים. באחד מהימים, כאשר אסף ש הה בחו\"ל פנתה מאיה למתווך לואי, שהחתים אותה על הסכם למתן שירותי תיווך ביחס לנכס ברחוב טאגור בתל אביב, וסיפר לה שמחיר הנכס עומד על כ- 4 מיליון ש\"ח.מאיה ראתה את הנכס, אך שאלה על גמישות במחיר ולואי הבטיח שיבדוק זאת. מאיה מצידה אמרה שהיא צריכה להתייעץ עם אסף השוהה בחו\"ל. לואי אכן בדק ואף ציין בפני בעלי הנכס שמדובר בקונה רצינית.בעלי הנכס התרשמו ואמרו ללואי כי הם מתכוונים לקדם את העיסקה. מאיה דיברה עם בעלי הנכס בטלפון והם קבעו מועד לחתימת חוזה כשאסף יחזור מחו\"ל.לאחר 5 ימים, ולפני המועד הקבוע לחתימת החוזה, התקשר אסף עם מתווכת אחרת - גילה. גילה הראתה לאסף את אותו הנכס. אסף הסכים לקנות את הנכס במחיר 4.1 מיליון ש\"ח.בהסכם הרכישה נרשם כי אסף הוא הרוכש, והוא ומאיה עברו לגור בנכס מיד עם השלמת העיסקה. כעת לואי תובע את דמי התיווך.הזוג טוען כי לואי לא יכול להיות הגורם היעיל לעיסקה מאחר שגילה היא זו שהפגישה בין הקונה למוכר, ולכן לואי לא זכאי לדמי תיווך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שגילה היא זו שהפגישה בין אסף למוכר, לואי הוא לא גורם שבלעדיו העיסקה לא הייתה מתקיימת, ולכן הוא לא הגורם היעיל, והוא לא זכאי לדמי תיווך.","לואי היה זכאי לדמי תיווך רק אם מאיה הייתה רוכשת בעצמה את הדירה, ולא אסף.","בין אסף ללואי לא נחתם הסכם תיווך עבור הנכס ברחוב טאגור, ולפיכך לואי לא זכאי לדמי תיווך עבור עיסקה זו.","מאחר שמדובר בזוג נשוי הפועל כיחידה כלכלית אחת, לא עבר זמן רב בין המקרים, וכן המחיר דומה, הרי שהעובדה שגילה נכנסה לתמונה לא פגעה בזכותו של לואי לדמי תיווך."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2014-01#9","e":4,"n":9,"s":"חיים הוא מתווך מקרקעין עם קשרים רבים בעולם הנדל\"ן הישראלי. יום אחד פנה אליו היזם גיל וסיפר לו כי הוא מעוניין להקים מלון בוטיק על שטח שבבעלות משפחתו.חיים וגיל חתמו על הסכם תיווך כדין, בו נרשם כי המתווך יהיה זכאי לתשלום 2% מהתמורה במידה ויצליח למצוא משקיע לפרויקט.לאחר מספר ימים הפגיש חיים את גיל עם היזם ארקדי. הצדדים חתמו על זיכרון דברים שזה לשונו: \"בתוך 30 ימים מיום חתימת זיכרון דברים זה הקרקע המזוהה ע\"פ תשריט מצורף תירשם על שם ארקדי.בתמורה לשינוי הרישום ישלם ארקדי לגיל 4 מיליון ש\"ח במזומן וכן תינתן לו זכות לגור בסוויטה העליונה של המלון שייבנה, או להשכירה לאורחים.המיסים יחולו על הצדדים לפי החבות בחוק , והיטלי ההשבחה ישולמו על ידי ארקדי. הצדדים יקבעו תאריך סופי שבו ידונו עורכי הדין שלהם על הפרטים הנותרים\".הצדדים חתמו על המסמך והתשריט, אולם לא לחצו ידיים. לאחר כשבוע, ובטרם נחתם החוזה בפני עורך דין, הסתכסכו גיל וארקדי והחליטו לעצור את ההתקדמות.\nחיים שמע על כך ומיהר לדרוש מגיל את דמי התיווך בגובה 2%.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חיים לא זכאי לדמי תיווך, מאחר שכל מה שנחתם הוא זיכרון דברים ולא חוזה מחייב.","בעיקרון, זיכרון דברים עשוי להיות מחייב, אבל במקרה זה נקבע דיון נוסף בנוכחות עורכי דין ולכן המסמך הוא רק שלב במשא ומתן. לפיכך, לא נחתם חוזה מחייב וחיים לא זכאי לדמי תיווך.","בזיכרון הדברים שנחתם נמצאים כל הפרטים המהותיים ולכן זה חוזה מחייב, אולם חיים יהיה זכאי לדמי תיווך רק כאשר ייחתם החוזה בפני עורכי הדין, כפי שהוסכם בזיכרון הדברים.","בזיכרון הדברים נמצאים כל הפרטים המהותיים ולכן זה חוזה מחייב וחיים זכאי לדמי תיווך, אפילו אם העיסקה לא תצא לפועל."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2014-01#10","e":4,"n":10,"s":"יעל תיווכה בעיסקת מכר דירה. המוכר והקונה חתמו על הסכמי תיווך, שבהם התחייבו לשלם כל אחד 1% מגובה העיסקה.בחוזה המכר שנחתם בין הצדדים נקבע כי הקונה ישלם למוכר 1.5 מיליון ש\"ח ובנוסף יעביר למוכר מגרש שבבעלותו.\nבנסיבות העניין, מה גובה דמי התיווך להם זכאית יעל?","o":["אין מספיק נתונים להשיב על כך.","כל אחד מהצדדים ישלם 1% מהסכום ששולם בפועל (1.5 מיליון ש\"ח).","כל אחד מהצדדים ישלם 1% משווי העיסקה (1.5 מיליון ש \"ח + שווי המגרש לפי הערכת שמאי).","כל אחד מהצדדים ישלם 2% מן הסכום ששולם בפועל (1.5 מיליון ש\"ח), שכן זה ההסדר שנקבע בחוק ביחס למקרים כאלה."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2014-01#11","e":4,"n":11,"s":"ג'ון רכש דירת יוקרה בישראל בשווי 6 מיליון ש\"ח באמצעות שירי המתווכת. מכיוון שלא התכוון לעשות שימוש בדירה בשנה הקרובה, הציע לשירי לגור בדירה למשך שנה במקום לשלם לה דמי תיווך.שירי התייעצה עם רואה החשבון שלה, שאמר לה שאם היא תוציא חשבונית כדין על שווי העיסקה - אין מניעה לכך מבחינת דיני המס.\nהאם שירי יכולה לקבל את הצעתו של ג'ון?","o":["לא, החוק דורש שדמי תיווך יהיו במזומן בלבד.","כן, אך ורק בתנאי שייחתם חוזה שכירות בכתב בין ג'ון לשירי.","כן.","כן, בתנאי שייחתם חוזה שכירות בכתב בין ג'ון לשירי, והוא יירשם בלשכת רישום המקרקעין."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2014-01#12","e":4,"n":12,"s":"מה מבין הבאים אינו נחשב עסקה במקרקעין?","o":["השכרת דירה למגורים.","חכירה לדורות של תחנת דלק.","העברת מבנה מסחרי ללא תמורה.","קבלת משרד לפי צוואה."],"c":[],"a":true,"note":"התשובה הנכונה: כל התשובות מתקבלות","sub":"l_ownership"},{"id":"2014-01#13","e":4,"n":13,"s":"מאיה היא אדריכלית מצליחה ובעלת דירה בתל אביב. מאיה קיבלה הצעת עבודה ממשרד באוסטרליה. מאיה לחוצה לקבל את ההצעה, לפיכך פנתה למתווך שימצא קונה לדירתה בתל-אביב.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המתווך חייב לגלות את עניין הדחיפות לכל קונה פוטנציאלי, מאחר שזהו מידע מהותי.","המתווך חייב לגלות את עניין הדחיפות רק אם הקונה ישאל אותו, מאחר שחובת הנאמנות לקונה מחייבת אותו לכך.","למתווך מותר לספר את המידע או לא לספרו, לפי שיקול דעתו, מאחר שהמידע לא קשור לנכס.","למתווך אסור לגלות את המידע."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2014-01#14","e":4,"n":14,"s":"בנימין ושרה הם זוג נשוי. השניים חיים בדירה משותפת במרכז העיר כבר 5 שנים. השניים החליטו להיפרד אך בחרו שלא להתגרש, ולחלק את הרכוש ביניהם ללא פנייה לבית המשפט.הם סיכמו שהדירה תירשם רק על שמו של בנימין ואילו שרה תקבל את כל יתרת הרכוש.\nבנסיבות העניין, האם תיתכן חבות במס בעת חלוקת הרכוש?","o":["לא, העברה בין בני זוג פטורה מתשלום מיסים.","כן, רק אם לא יתגרשו בתוך שלוש שנים ממועד חלוקת הרכוש.","כן, משום שמדובר במכירה","בכל מקרה יחול רק מס רכישה."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2014-01#15","e":4,"n":15,"s":"שמשון הוא הבעלים של משרד תיווך, ויובל הוא מנהל חשבונות העובד במשרד.שמשון זייף את פרטי נסח רישום המקרקעין (\"נסח טאבו\") של דירה בחולון וביקש מיובל כי ימסור מסמך זה לגבריאל, המעוניין לרכוש את הדירה.\nמהי אחריותו של יובל לעניין הזיוף?","o":["האחריות לעניין זיוף המסמך חלה על שמשון בלבד.","יובל הינו מנהל חשבונות בלבד ולכן לא חלה עליו כל אחריות בעניין זיוף המסמך.","אם יובל היה מודע לכך שהמסמך מזוייף - דינו כדין המזייף שמשון.","דינו של יובל בכל מקרה כדין המזייף שמשון."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2014-01#16","e":4,"n":16,"s":"בבעלותו של זאב חלקת קרקע מוסדרת בחיפה. לפני כשנתיים אושרה תוכנית המיתאר המקומית חיפה/1000, וחלקתו של זאב ממוקמת במרכזה של תוכנית זו.כתוצאה מאישורה של התוכנית נפגע ערך החלקה.\nמהו פרק הזמן העומד לרשותו של זאב על מנת להגיש תביעה לפיצויים בגין ירידת ערך?","o":["במקרקעין מוסדרים לא חלה התיישנות, ועל כן התביעה לפיצויים יכולה להיות מוגשת בכל עת.","התביעה לפיצויים תוגש בתוך שבע שנים מיום תחילת תוקפה של התוכנית.","התביעה לפיצויים תוגש בתוך שלוש שנים מיום תחילת תוקפה של התוכנית.","זאב יוכל להגיש את התביעה רק כאשר ימכור את הקרקע ולאחר שהיקף הנזק יתברר."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2014-01#17","e":4,"n":17,"s":"מוטי מבקש למכור את זכויות הבעלות בדירתו, לה צמודה בנסח הרישום חצר בשטח של 100 מ\"ר.יעקב מתגורר בסמוך למוטי כארבעים שנה, ועובר דרך חצרו של מוטי מידי יום מבלי שמוטי התנגד לכך.יעקב הגיש תביעה לבית המשפט לרשום לטובתו את זכות המעבר כזיקת הנאה רשומה.\nבנסיבות המתוארות, האם האדם שיקנה ממוטי את זכויותיו צריך לחשוש מהאפשרות שתירשם זיקת הנאה לטובת יעקב ביחס לחצר הצמודה לדירה? מדוע?","o":["לא, מאחר שכאשר רכש את הדירה לא הייתה זיקת ההנאה רשומה בלשכת רישום המקרקעין.","כן, כי בנסיבות המתוארות רשאי יעקב לדרוש רישום של זיקת הנאה לטובתו.","לא, כי החצר רשומה על שם מוטי ברשם המקרקעין ואין אפשרות לרשום זיקת הנאה ללא הסכמתו.","לא ובתנאי שימהר וירשום את הדירה על שמו לפני שיינתן פסק דין בתביעה של יעקב, מאחר שאז תפקע זיקת ההנאה של יעקב."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2014-01#18","e":4,"n":18,"s":"יוכבד עוסקת בתיווך ובעיסקה האחרונה הגישה לצדדים זיכרון דברים שיש למלא ובפרטים החסרים.\nהאם פעולה זו עלולה לגרום לכך שיוכבד לא תהא זכאית לדמי תיווך?","o":["פעולה זו עלולה לגרום לכך שיוכבד לא תהיה זכאית לדמי תיווך, כי החוק אוסר על מתווך לערוך או לסייע בעריכת מסמכים משפטיים.","הגשת זיכרון דברים ריק היא לא סיוע משפטי, מאחר שהצדדים יכולים להוריד טופס כזה מהאינטרנט.","רק סיוע להשלמת פרטים בהסכם עלול לגרום לאי זכאות לדמי תיווך.","זיכרון דברים הוא לא הסכם מחייב, ועל כן הוא לא מסמך משפטי שאסור למתווך להיות מעורב בעריכתו."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2014-01#19","e":4,"n":19,"s":"אברהם נפטר ובצוואתו הוריש את דירתו לבנו ולבתו. האם על היורשים לשלם מס רכישה בעת העברת הדירה על שמם?","o":["לא, משום שהורשה היא לא פעולת מכירה החייבת במס.","כן, כי הורשה היא פעולת מכירה החייבת במס.","לא, כי לא ידוע מה שווי הדירה.","כן, כי צריך לשלם על כל נכס מקרקעין הנרשם על שמו של אדם."],"c":[0],"a":false,"note":"","sub":"x_purchase"},{"id":"2014-01#20","e":4,"n":20,"s":"שי עוסק במכירה של דירות. כיום רוצה שי למכור את דירת המגורים הפרטית שלו למלכ\"ר (מוסד ללא כוונת רווח).\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על העיסקה יחול מע\"מ מלא.","על העיסקה יחול מע\"מ בשיעור מופחת של 10%.","העיסקה פטורה מתשלום מע\"מ.","שי רשאי לבחור אם לשלם מע\"מ או מס שבח ביחס למכירה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2014-01#21","e":4,"n":21,"s":"שמונה יורשים מכרו את דירתם בירושלים. בבדיקה מקדימה התברר כי חל עליהם חיוב בגין היטל השבחה.מכיוון שהצדדים להסכם לא ידעו מהו גובה החיוב, הוסיף עורך הדין תנאי בהסכם שבו נאמר שאם יתברר שהחיוב עולה על 100,000 ש\"ח יוכלו הצדדים לבטל את ההסכם.\nבנסיבות העניין, האם ניתן לכתוב סעיף כזה? מדוע?","o":["כן, חוק החוזים מאפשר גמישות רבה, ולא מגביל חוזה כזה.","לא, כי הצדדים לא יודעים בוודאות האם ההסכם סופי או לא.","כן, בתנאי שקיבלו מראש את הסכמת רשויות המס לתנאי זה.","כן, בתנאי שקיבלו מראש את הסכמת הוועדה המקומית לתנאי זה."],"c":[0],"a":false,"note":"","sub":"p_levy"},{"id":"2014-01#22","e":4,"n":22,"s":"ששון ביקש למכור את דירתו הרשומה בלשכת רישום המקרקעין (\"טאבו\"). בנסח הטאבו של הדירה הופיעו המילים \"תקנון מוסכם\".ששון הסביר לקונה כי משמעות הביטוי הוא הסכמה בין בעלי הדירות בבניין רק לגבי עניינים לא מהותיים, כגון ניקוי חדר המדרגות ואיסור להרעיש בשעות אחה\"צ.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא הנכון ביותר?","o":["ששון צודק; אכן בתקנון מוסכם ניתן לקבוע הסכמות רק בעניינים לא מהותיים.","ששון לא צודק, מאחר שתקנון מוסכם יכול להתייחס גם לזכויות בנייה ולנושאים מהותיים נוספים.","ששון לא צודק, מאחר שתקנון מוסכם קיים בכל הבתים המשותפים.","ששון צודק, מאחר שרק בתקנון המצוי ניתן לקבוע הוראות בעניינים מהותיים."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2014-01#23","e":4,"n":23,"s":"אברהם שוכר מבנה עבור מכללה שבבעלותו. הוא ביקש לחדש את חוזה השכירות לעשר שנים נוספות, אך הבעלים ביקש שהחידוש יהיה לתשע שנים ואחד עשר חודשים, על מנת שלא לשלם מס רכישה ומס שבח.\nבנסיבות המתוארות, האם צודק הבעלים? מדוע?","o":["הבעלים לא צודק, מאחר שהשכרה לתקופה של עד 25 שנה לא מחויבת במיסי מקרקעין.","הבעלים צודק, מאחר שיש לדווח על השכרה לתקופה של עשר שנים ויותר לרשויות מיסוי מקרקעין ולשלם עליהן מיסים.","הבעלים לא צודק, כי מדובר בהשכרה ל- 10 שנים ולא בחכירה ל- 10 שנים המחויבת במס.","הבעלים לא צודק, כי בכל מקרה יש לדווח לרשויות המס ולשלם מס על חוזה שכירות שאורכו יותר מחמש שנים."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2014-01#24","e":4,"n":24,"s":"יעקב מנהל משרד תיווך ומעסיק מספר מתווכים שכירים- כולם בעלי רישיון.אחד מן המתווכים השכירים הטעה את אחד הלקוחות. כתב אישום מכוח חוק הגנת הצרכן הוגש כנגד המתווך וכנגד יעקב המנהל.\nבנסיבות העניין, האם ניתן להרשיע את יעקב? מדוע?","o":["לא, לא ניתן להאשים אדם על עבירה שביצע אדם אחר.","ניתן להרשיע את יעקב כי מנהל תמיד אחראי לפעולה של עובד שלו.","לא ניתן להרשיע את יעקב אם יוכיח כי הוא עשה ככל שאפשר למנוע את הטעיית הלקוח.","לא ניתן להרשיע את יעקב, מאחר שעבירה על פי חוק הגנת הצרכן היא אישית ואין אחריות למנהלים."],"c":[2],"a":false,"note":"","sub":"k_consumer"},{"id":"2014-01#25","e":4,"n":25,"s":"שלמה רכש דירה מחברה קבלנית לפני כשנתיים. הדירה טרם נרשמה בלשכת רישום המקרקעין. כיום רוצה שלמה לברר היכן רשומות הזכויות שלו בדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הזכויות בדירה יכולות להיות רשומות רק במינהל מקרקעי ישראל.","הזכויות בדירה יכולות להיות רשומות במינהל מקרקעי ישראל ו/או בחברה המשכנת.","מאחר שהדירה לא רשומה בלשכת רישום המקרקעין הרי ששלמה לא יכול לקבל אישור על רישום הזכויות שלו בדירה.","הזכויות בדירה יכולות להיות רשומות רק במשרדי מיסוי המקרקעין."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2014-05#1","e":5,"n":1,"s":"צדדים לעיסקה קבעו כי המוכר יקבל לידיו סכום של 2 מיליון ש\"ח והקונה ישלם את כל המיסים החלים בעיסקה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["במקרה כזה אין חוב במס שבח, כיוון שהנכס נמכר במחיר \"נטו\" שהוא נמוך מהמחיר \"ברוטו\".","במקרה כזה רשות המס חייבת לבצע \"גילום מלא\".","במקרה כזה רשות המס רשאית, אך לא חייבת, לבצע \"גילום מלא\" של המס.","המוכר חייב לשלם מס שבח תמיד; במקרה כזה הוא ישלם את המס מתוך הסכום נטו שיקבל ואין כל תוקף להסכמה מול הקונה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2014-05#2","e":5,"n":2,"s":"שי רוצה לרכוש דירת גג בתל אביב. לטענת המוכר מותר לבנות עוד שתי קומות בדירה.\nהיכן יכול שי לבדוק את טענת המוכר?","o":["במשרדי מיסוי מקרקעין.","במשרדי הוועדה המקומית לתכנון ובנייה.","במחלקת הארנונה של עיריית תל אביב.","אצל החברה הקבלנית שבנתה את הדירה."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2014-05#3","e":5,"n":3,"s":"רונית היא מתווכת במקרקעין. רונית חתמה על הסכם בלעדיות עם גיל למכירת הדירה של גיל.רונית פירסמה את הדירה בעיתון יומי נפוץ.\nכמו כן, תלתה שלט על הדירה. במהלך תקופת הבלעדיות, פגש גיל את השכן שלו וסיפר לו שהוא רוצה למכור את דירתו, השכן מיד הציע לרכוש את הדירה ובין הצדדים נחתם הסכם למכירת הדירה.\nבנסיבות העניין, האם זכאית רונית לתשלום דמי התיווך?","o":["רונית לא זכאית לתשלום דמי התיווך, מאחר שהיא לא הייתה הגורם היעיל בעיסקה.","רונית זכאית לתשלום דמי תיווך מלאים.","רונית זכאית למחצית מדמי התיווך, מאחר שהיא לא הייתה הגורם היעיל.","רונית תהיה זכאית לתשלום דמי תיווך, אלא אם כן גיל יוכיח שהשכן לא ידע על הפרסומים שביצעה רונית."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2014-05#4","e":5,"n":4,"s":"רוני הוא מתווך במקרקעין. יועץ המס של רוני יעץ לו להקים חברה ולהפעיל באמצעותה את עסק התיווך שלו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור למתווך לעבוד בתיווך באמצעות חברה.","מותר למתווך לעבוד בתיווך באמצעות חברה רק אם קיבל אישור בכתב ומראש של רשם המתווכים.","אין כל בעיה שמתווך יעבוד באמצעות חברה, ובלבד שפעולת התיווך תיעשה על ידי מתווך בעל רישיון.","מותר למתווך לעבוד בתיווך באמצעות חברה רק אם קיבל אישור בכתב ומראש של שר המשפטים."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2014-05#5","e":5,"n":5,"s":"יוני הוא במאי צעיר המבקש לביים תוכנית בשם \"עיסקאות נדל\"ן כדאיות\" בערוץ הטלוויזיה המקומי.בכוונתו של יוני להציג בתוכנית מידע ופרטים על עיסקאות כדאיות במקרקעין והוא מקווה שאנשים יצליחו לעשות עיסקאות בעקבות המידע.יוני הוא לא מתווך במקרקעין ואין לו רישיון לכך. הוא גם לא מתכוון להציג עצמו כמתווך במסגרת התוכנית.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יוני מקבל שכר עבור היוזמה שלו ולכן הוא מבצע תיווך אסור במקרקעין.","מותר ליוני לפרסם מידע על הנכסים, אבל אם הוא מפרסם בתוכנית מיהם בעלי הזכויות בקרקע - אזי הוא כבר עוסק בתיווך אסור במקרקעין.","יוני צריך לקבל אישור מראש ובכתב של רשם המתווכים על מנת שיוכל להציג בתוכנית את המידע הנ\"ל.","הפרסום מותר כל עוד יוני לא מציג עצמו כמתווך."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2014-05#6","e":5,"n":6,"s":"שגיא הוא מתווך ותיק אשר מייצג את רינה במכירת דירתה כבר תקופה ארוכה.מספר פעמים בעבר הצליח למצוא קונים מתאימים, אבל בכל פעם בוטלה העיסקה לאחר שהתברר שיש חריגות בנייה בדירה. בימים האחרונים ראתה ליאת את הדירה, התלהבה מאוד והיא מבקשת לרכוש את הדירה. שגיא מתלבט האם הוא צריך לספר לה על הסיבה לביטול העסקאות הקודמות.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם רינה אסרה על שגיא לספר על סיבת הביטול, הוא לא צריך לספר לליאת.","אין זה מתפקידו של מתווך להתייחס לעיסקאות קודמות שנכשלו; מדובר במידע לא רלוונטי.","שגיא צריך לספר לליאת את הסיבה לביטול העיסקאות בעבר, מאחר שמדובר בעניין מהותי הנוגע לנכס.","שגיא לא צריך לספר, מאחר שתפקידו של מתווך הוא לקדם עיסקאות ולא להכשיל אותן."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2014-05#7","e":5,"n":7,"s":"לפני מספר שנים רכש אריאל משרד בבניין משרדים. ביום 1.1.2014 החליט אריאל למכור את המשרד ובאותו היום פנה ליותם המתווך.\nיותם החתים את אריאל על הסכם תיווך ועל מסמך בלעדיות נפרד. במסמך נקבע שתקופת הבלעדיות תהיה 6 חודשים.ביום 10.3.2014 גילה אריאל שיותם תלה שלט בחלון המשרד, אך לא נקט עד אז בכל אמצעי שיווק אחר.\nבנסיבות העניין, האם יכול אריאל להשתחרר מהסכם התיווך? מדוע?","o":["אריאל יכול להשתחרר; המתווך לא רשאי להחתים על הסכם בלעדיות למכירת משרד, מכיוון שלא מדובר בדירת מגורים.","אריאל יכול להשתחרר; כי המתווך לא ביצע את פעולות השיווק כנדרש בשליש הראשון של תקופת הבלעדיות.","אריאל לא יכול להשתחרר; כי תקופת הבלעדיות למשרד היא תשעה חודשים ועוד לא חלף שליש מתקופה זו.","אריאל לא יכול להשתחרר; כי סעיף הבלעדיות נחתם כדין והמתווך ביצע את פעולות השיווק כנדרש."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2014-05#8","e":5,"n":8,"s":"בני הוא מתווך וגם שותף ב- 15% בחברת \"הבונה המקומי\" אשר רכשה 5 דירות בבית משותף.ברצונו של בני לפנות ליוסף, שהוא בעל דירה נוספת בבניין, ולנסות לשכנע את יוסף למכור את דירתו לחברה. בני שיכנע את יוסף לשכור את שירותיו כמתווך ושמע ממנו כמה הוא מבקש בעבור הדירה.המחיר היה גבוה ממחיר השוק של הדירה. בני סיפר ליוסף שמצא חברה המוכנה לשלם את המחיר המבוקש. באותו היום חתם יוסף על זיכרון דברים עם מנהל החברה.\nבנסיבות העניין, האם פעל בני בהתאם לחוק? מדוע?","o":["כן; בני ייצג את הלקוח היטב והשיג בעבורו את המחיר שביקש.","כן; לבני אין עניין אישי, מאחר שיש לו רק חלק קטן בחברה.","לא; בני צריך היה לגלות שיש לו עניין אישי בעיסקה ולקבל את הסכמת יוסף בכתב.","לא; אסור היה לו לפעול בעיסקה בשום מקרה, כי מדובר בניגוד עניינים."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2014-05#9","e":5,"n":9,"s":"בית המשפט הרשיע את מנשה המתווך בשל ניצול מצוקתו השכלית של הלקוח משה בהתאם לסעיפים 3 ו-23 לחוק הגנת הצרכן.במסגרת הטיעונים לעונש שהתקיימו לאחר ההרשעה (אחריהם קובע בית המשפט את עונשו של הנאשם) ביקשה התביעה כי בנוסף לעונש שייפסק, ישלול בית המשפט את רישיון התיווך של מנשה לתקופה של 5 שנים.\nבנסיבות העניין, האם הדבר אפשרי? מדוע?","o":["לא, הממונה על המתווכים הוא רשם המתווכים ורק לו סמכות לשלול רישיון של מתווך.","לא, רישיון של מתווך מותנה בתשלום האגרה בלבד, ואין אפשרות לשלול רישיון של מתווך לאחר שעבר את המבחן ועמד בכל התנאים לקבלת רישיון תיווך.","כן, בית המשפט רשאי לשלול רישיון של מתווך במקרה כזה.","לא, אמנם בית המשפט רשאי לשלול רישיון של מתווך, אך הוא לא רשאי לעשות זאת לתקופה העולה על 3 שנים."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2014-05#10","e":5,"n":10,"s":"שוקי רכש דירה משולה ובהתאם להסכם הרכישה שילם שוקי לשולה סכום של 1,000,000 ש\"ח.מספר ימים לפני שהיה אמור לקבל את החזקה בדירה ולהעביר את הזכויות על שמו, התקשרה אליו שולה ואמרה לו שהיא מתחרטת על העיסקה כיוון שמחירי הדירות עלו מאוד ואין בכוונתה למסור לו את הדירה.היא אמרה לו שהיא מוכנה לבטל את העיסקה ולשלם לו את הפיצוי המוסכם שנרשם בהסכם. היא חזרה ואמרה שלא תסכים בשום אופן למסור לו את הדירה.שוקי עיין בהסכם וראה שאמנם מופיע בו סעיף קצר הקובע כי: \"צד שיפר את ההסכם ישלם לצד השני פיצוי מוסכם של 10% מסכום התמורה והצדדים רואים בסכום זה כסכום סביר בנסיבות העיסקה\".שוקי לא מעוניין שהעיסקה תתבטל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שוקי רשאי לפנות לבית המשפט ולתבוע משולה שתקיים את העיסקה, ובנוסף הוא זכאי לתבוע משולה פיצוי מוסכם בגין הפרת ההסכם, במידה ולא תמסור החזקה בדירה במועד.","שוקי לא זכאי לתבוע משולה מאומה, כיוון שהעיסקה טרם הושלמה ולא נרשמה בלשכת רישום המקרקעין. זכותו של מוכר להתחרט עד לסיום הרישום.","שוקי רשאי לפנות לבית המשפט ולתבוע סעד אחד מבין שניים: או אכיפת ההסכם או את הפיצוי המוסכם, אבל לא ניתן לתבוע גם אכיפה וגם פיצוי מוסכם.","שוקי לא זכאי לתבוע משולה מאומה, כיוון שהיא ממילא הציעה לו לקבל את הפיצוי המוסכם וזה הדבר היחיד שהוא זכאי לקבל."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2014-05#11","e":5,"n":11,"s":"חברת \"הדייר האדיב\" עוסקת בהשכרת דירות למגורים לדיירים רבים.החברה נוהגת להחתים את השוכרים שלה על הסכם מוכן ומודפס מראש, אשר הפרטים שמוסיפים בו הם רק הפרטים הבאים: פרטי הדירה המושכרת, תקופת ההסכם ושכר הדירה ההתחלתי.מספר חודשים לאחר חתימת החוזה עם ששון, הודיעה לו נציגת החברה כי החברה מעלה את שכר הדירה ב- 5% בהתאם לסעיף 4.ד.3 להסכם, הקובע כך: \"לחברת ה\"דייר האדיב\" זכות לשנות, על דעתה בלבד, לאחר כריתת ההסכם, את שכר הדירה, וזאת ללא קשר לגורמים חיצוניים כלשהם\".\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ששון לא יכול להתנגד להעלאת שכר הדירה; הסעיף ברור, וששון צריך היה לקרוא את ההסכם לפני שחתם, ולא יכול לבוא בטענות כיום.","מכיוון שמדובר בחוזה אחיד ובתנאי שחזקה שהוא תנאי מקפח, ששון יכול לפנות לבית המשפט ולדרוש ביטול או שינוי של התנאי המקפח.","ששון לא יכול להתנגד להעלאת שכר הדירה; לא מדובר בחוזה אחיד, מכיוון שבכל הסכם ממלאים פרטים הקשורים לעיסקה ספציפית.","מכיוון שמדובר בחוזה אחיד ובתנאי שיש לגביו חזקה שהוא מקפח, ששון לא צריך אפילו לפנות לבית המשפט; התנאי בטל מאליו וששון לא צריך לעשות דבר."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2014-05#12","e":5,"n":12,"s":"גיל לווה מרוני מיליון ש\"ח בשנת 2012. להבטחת תשלום ההלוואה, מישכן גיל את הדירה שלו לטובת רוני.על פי תנאי ההלוואה, על גיל להחזיר את ההלוואה בתשלום אחד בשנת 2017. המשכנתא נרשמה בשלכת רישום המקרקעין.כיום רוצה גיל לפדות את המשכנתא ולמחוק את הרישום שלה בלשכת רישום המקרקעין. רוני מסרב לפידיון ההלוואה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שרוני מסרב, גיל לא יכול לעשות דבר.","גיל יכול להפקיד את המגיע ממנו בידי רשם המקרקעין ולבקש מהרשם למחוק את רישום המשכנתא.","גיל יכול להפקיד את המגיע ממנו בחשבון הבנק של רוני ולבקש מהרשם למחוק את רישום המשכנתא.","גיל יכול להפקיד את המגיע ממנו אצל רשם המשכונות ולבקש מהרשם למחוק את רישום המשכנתא."],"c":[1],"a":false,"note":"","sub":"l_mortgage"},{"id":"2014-05#13","e":5,"n":13,"s":"במסגרת הסכם לרכישת דירה שערך יאיר המוכר עם דליה הקונה, התחייב יאיר להחליף את כל הדלתות בבית מאחר שהדלתות היו ישנות מאוד וחורקות.הצדדים לא רשמו בהסכם אילו דלתות ירכוש יאיר במקום הדלתות הקיימות. דליה הייתה זו שניסחה את ההסכם שבין הצדדים.\nדליה בדקה מעט וגילתה שיש בשוק שלושה סוגים של דלתות: הזולות ביותר הן דלתות נחותות, הבינוניות הן דלתות מלאות ופשוטות, והיקרות הן דלתות מלאות ומעוצבות בהידור רב.דליה פנתה ליאיר ודרשה בתוקף כי ירכוש את הדלתות היקרות ביותר, מאחר שהיא רגישה מאוד לנושא העיצוב של ביתה ורוצה את הטוב ביותר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דליה צודקת; יאיר קיבל תמורה בעד הדירה והתחייב להחליף דלתות, ואם לא הוסכם אחרת, דליה זכאית לבחור בטוב ביותר.","דליה צודקת; החוק קובע שכאשר לא מוסכם אחרת, יש לספק מוצר מאיכות מעולה.","דליה טועה; כיוון שלא נרשמו פרטיהן של הדלתות, הסעיף הזה לא ניתן לביצוע והוא מבוטל לחלוטין.","דליה טועה; כיוון שלא נרשמו פרטיהן של הדלתות, יאיר מחויב לספק דלתות בינוניות ולא את הדלתות הטובות ביותר שקיימות."],"c":[3],"a":false,"note":"","sub":"s_sale"},{"id":"2014-05#14","e":5,"n":14,"s":"דני הוא סטודנט המבקש לשכור דירה במרכז ירושלים. דני הגיע לדירה של שרון והחליט שהוא רוצה לשכור את הדירה. דני ושרון לחצו ידיים וסיכמו בעל פה כי דני ישכור את הדירה למחרת היום לתקופה של שנה, בשכר דירה חודשי של 3,000 ש\"ח. הצדדים סיכמו כי למחרת היום הם יעלו את ההסכמות על הכתב. כאשר הגיע דני למחרת לדירה הוא הופתע לשמוע משרון כי היא התחרטה ולא רוצה להשכיר לו את הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דני לא יכול לעשות דבר, מאחר שעיסקה במקרקעין מחייבת מסמך בכתב, ולכן אין כל תוקף לסיכום שלהם שנערך בעל פה.","דני יכול לתבוע את שרון ולחייב אותה להשכיר לו את הדירה והוא לא היה חייב להעלות על הכתב את הסיכום ביניהם.","דני לא יכול לאכוף את ההסכם כי לא נחתם מסמך בכתב, אבל הוא יכול לתבוע פיצויים על הפרת ההתחייבות.","דני יכול לתבוע את אכיפת ההסכם רק אם בינתיים לא הושכרה הדירה לשוכר אחר בשכר דירה חודשי זהה."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2014-05#15","e":5,"n":15,"s":"אריה וליאת גרים זה מול זו בבניין הרשום כבית משותף. אריה הרחיב את דירתו לתוך חדר המדרגות וליאת הגישה נגדו תביעה למפקח על הבתים המשותפים.המפקח קיבל את התביעה והורה לאריה להחזיר את המצב לקדמותו, אך אריה אינו מקיים את פסק הדין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ליאת יכולה לפנות להוצאה לפועל לצורך אכיפת פסק הדין של המפקח.","למפקח על הבתים המשותפים אומנם יש סמכות לפסוק בתביעה, אך אין דרך לאכוף את פסק הדין אלא רק לתבוע פיצויים על הפרתו.","למפקח על הבתים המשותפים אין סמכות לפסוק בתביעה כזו, ולכן לא ניתן לאכוף את פסק הדין של המפקח.","ליאת צריכה לרשום את פסק הדין בלשכת הרישום של המקרקעין והרשם יכול לחייב את אריה השכן לבצע את התיקונים."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2014-05#16","e":5,"n":16,"s":"דני קרא מודעה בעיתון לפיה נמכרת דירה באמצעות מנהל עיזבון. כאשר דני ביקש לברר פרטים הוא הופתע לגלות כי מנהל העיזבון הוא חברה בשם \"ניהול עיזבונות\" בע\"מ.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חברה לא יכולה להתמנות כמנהלת עיזבון.","חברה יכולה להתמנות כמנהלת עיזבון רק אם קיבלה אישור למינוי מאת רשם התאגידים.","חברה יכולה להתמנות כמנהלת עיזבון.","אי אפשר למכור דירה באמצעות מנהל עיזבון, ויש למנות כונס נכסים."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-05#17","e":5,"n":17,"s":"שירה קנתה בית מרועי ושילמה מקדמה בגובה 21% מהתמורה. הצדדים קבעו בחוזה כי העברת הבעלות תירשם ביום החתימה, ללא קשר לתשלום מלוא התמורה.\nבנסיבות העניין, האם רשאי רשם המקרקעין לרשום את העברת הבעלות?","o":["כן, מאחר שהנוסח החוזי הוא הקובע.","לא, משום שחוק המקרקעין אוסר על רישום בעלות לפני ששולמה מלוא התמורה.","כן, מאחר ששירה שילמה יותר מ- 20% מהתמורה.","לא, ניתן לרשום רק הערת אזהרה."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-05#18","e":5,"n":18,"s":"דינה הגיעה הביתה לאחר שהות ממושכת בנפאל. להפתעתה מצאה בביתה משפחה זרה. הסתבר שבמהלך שהותה בנפאל הגיע מתחזה, אשר מכר את הדירה למשפחה הזרה. המתחזה נעזר בנסח מקרקעין מזויף, והמשפחה שילמה לו את מלוא התמורה המוסכמת. המשפחה לא טרחה לבדוק בעצמה ברשם המקרקעין את אמיתות הרישום, וגם לא רשמה את העיסקה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הדירה שייכת למשפחה הזרה, מאחר שהיא שילמה את התמורה ופעלה בתום לב.","הבעלות תישאר של בעלת הדירה דינה.","הדירה תימכר והתמורה תחולק חצי-חצי בין דינה למשפחה הזרה.","למשפחה הזרה תהיה זכות החזקה בדירה כדיירים מוגנים, אך הבעלות תישאר של דינה."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2014-05#19","e":5,"n":19,"s":"בבעלות יצחק קרקע במרכז רמת אביב. שמעון הוא יזם נדל\"ן. השניים נפגשו בבית קפה והסכימו לשתף פעולה במטרה לבנות על הקרקע בניין בן 48 דירות שיירשם כבית משותף.בסוף הפגישה אמר שמעון: \"יצחק, שים לב, אני תלוי בך, אל תמכור את הקרקע!\". יצחק הסכים והשניים ביקשו מהמלצר מפית וכתבו עליה: \"יצחק לא ימכור את הקרקע בגוש 94/09, שמעון יתחיל את הבדיקות בעירייה\". השניים חתמו וציינו מספרי תעודת זהות.שמעון מיהר לרשם המקרקעין וביקש לרשום הערת אזהרה בדבר איסור על יצחק למכור את המקרקעין שלו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רשם המקרקעין לא ירשום הערת אזהרה, אך הוא יכול לרשום במקום זאת הערה בדבר הצורך בקבלת הסכמת צד שלישי למכירה (כאשר הצד השלישי הוא שמעון).","רשם המקרקעין יכול לרשום הערת אזהרה כמבוקש.","לא ניתן לרשום את הערת האזהרה בנוסח ששמעון מבקש, משום שלא ניתן לרשום הערת אזהרה על איסור לעשות עיסקה. הערות אזהרה נועדו להזהיר על עיסקאות שכבר נעשו ולא נרשמו כבעלות מלאה.","בנסיבות המתוארות לעיל, לא ניתן לרשום כל הערה בלי צו של בית משפט."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2014-05#20","e":5,"n":20,"s":"ועדת המשמעת החליטה לבטל את רישיון התיווך של גבריאל המתווך, ושלחה לו את החלטתה. גבריאל מעוניין לבטל את ההחלטה.\nבנסיבות העניין, כיצד יכול גבריאל לפעול?","o":["על גבריאל להגיש ערר לשר המשפטים על החלטת ועדת המשמעת.","גבריאל יכול לפנות לבית המשפט המחוזי בתוך 45 יום ולערער על ההחלטה.","גבריאל יכול לפנות לוועדה המייעצת לרשם המתווכים בתוך 30 יום ולערער על ההחלטה.","לוועדת המשמעת אין סמכות לשלול את רישיונו של גבריאל בשום מקרה, אלא רק לרשם המתווכים, ולכן אין תוקף להחלטה זו."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2014-05#21","e":5,"n":21,"s":"שחר ביקשה מאסף המתווך למצוא קונה לדירתה בת\"א וחתמה על הסכם בלעדיות כחוק. אסף הציע לשחר לבחור בין שתי חלופות לשיווק דירתה: הצבת שלט על דירתה + הצבת שלט במרכז הקהילתי + הצבת שלטים על גבי לוחות מודעות בשכונה או הצבת שלט על דירתה + פרסום הדירה בעיתון \"נדל\"ן ת\"א\".\nאיזו מבין החלופות אפשרית?","o":["שתי החלופות אפשריות, אך החלופה הראשונה עדיפה, מאחר שהיא מאפשרת שלוש דרכי שיווק ואילו החלופה השנייה רק שתיים.","החלופה הראשונה לא עומדת בדרישות לפעולות השיווק ואילו השנייה כן. לכן, רק השנייה אפשרית.","שתי החלופות אינן עומדות בדרישות לפעולות השיווק.","שתי החלופות אפשריות, ואין האחת עדיפה על האחרת. לכן, הדבר נתון לבחירתה של שחר."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2014-05#22","e":5,"n":22,"s":"אבי החליט להקים קיוסק במרכז \"לב רעות\". לשם כך, פנה לרשות הרישוי וזו נתנה לו היתר מזורז להפעלת העסק.כעבור חצי שנה החליטה רשות הרישוי שלא לתת רישיון קבוע לקיוסק של אבי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["היתר מזורז ניתן לתקופה של שנה, ולכן יש לאבי עוד חצי שנה להפעיל את הקיוסק לפני סגירתו.","היתר מזורז ניתן לתקופה של שנתיים, ולכן יש לאבי עוד שנה וחצי להפעיל את הקיוסק.","היתר מזורז עומד בתוקפו לשנה ממועד נתינתו או עד להחלטת רשות הרישוי בעניין מתן הרישיון, לפי המוקדם. על אבי לסגור את העסק בתוך 7 ימים מקבלת ההחלטה על ביטול ההיתר המזורז.","קיוסק אינו עסק הטעון רישוי, ולכן אין כל משמעות להחלטת רשות הרישוי."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2014-05#23","e":5,"n":23,"s":"מוטי הוא בעליו של מחסן ברחוב יפת בירושלים, שנבנה על ידו ללא היתר.בשנת 2013 התקבלה החלטה ברשויות התכנון להרחיב את רחוב יפת בעיר ולהוסיף לכביש העובר בו נתיב נוסף. לצורך הרחבה זו, היה צורך בהפקעת מחסנו של מוטי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין לפנות את מחסנו של מוטי, אלא לאחר שהועמד לרשותו שיכון חלוף סביר.","מוטי יפוצה על ההפקעה של מחסנו בסכום שאותו יקבע שמאי.","מוטי לא יפוצה על ההפקעה של מחסנו בשום מקרה, מאחר שאין לו היתר.","מוטי לא יפוצה על ההפקעה של מחסנו, אלא אם פעל בתום לב וקיימות נסיבות מיוחדות המצדיקות זאת."],"c":[3],"a":false,"note":"","sub":"p_permit"},{"id":"2014-05#24","e":5,"n":24,"s":"רועי גר בבניין בשכונת רחביה בירושלים. רועי מעוניין להרחיב את הדירות בבניין במסגרת תוכנית לחיזוק בתים בפני רעידות אדמה (תמ\"א 38). רועי מציע כי כל השכנים יפעלו להרחיב את הדירות בבניין על חשבון הרכוש המשותף, ללא בנייה של דירות חדשות בבניין.\nבנסיבות העניין, איזה רוב של בעלי הדירות צריך רועי לקבל כדי שיוכל לבצע את התוכנית?","o":["על רועי להשיג רוב של מחצית בעלי הדירות בבניין.","על רועי להשיג רוב של 60% בעלי הדירות בבניין.","על רועי להשיג רוב של 75% בעלי הדירות בבניין.","על רועי להשיג הסכמה של כל בעלי הדירות בבניין."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2014-05#25","e":5,"n":25,"s":"מהם \"דמי הסכמה\"?","o":["תשלום ראשון המועבר למוכר או למשכיר של נכס במועד חתימה על זיכרון דברים.","תשלום אותו נדרש בעל נכס לשלם למי שיש לו זכות קדימה על הנכס, בתמורה להסכמתו למכירת הנכס לצד שלישי.","תשלום אותו דורש מינהל מקרקעי ישראל מבעל זכות חכירה מולו כתנאי להעברת זכויות החכירה לצד ג'.","חלק מדמי ההיוון שנדרש לשלם מי שחוכר קרקע ממינהל מקרקעי ישראל."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2014-07#1","e":6,"n":1,"s":"יגאל המתווך תיווך בעיסקת מכר דירה בין שחר המוכר לקרן הקונה.לאחר שקרן השלימה את חובותיה במסגרת ההסכם וקיבלה את הדירה, פנה אליה דוד השכן,ודרש שתטפל בבעיית הנזילה החמורה מהדירה שרכשה והציג בפניה חוות דעת מומחה שערך בדיקות לבקשתו של שחר ובידיעתו של יגאל, אשר הצביעה על הנזילה החמורה בדירה.קרן הופתעה מפנייתו של דוד, מאחר ששחר ויגאל מעולם לא סיפרו לה על חוות הדעת ולא על הנזילות.היא פנתה בתלונה כנגד יגאל. יגאל היה גם הוא המום, מאחר ששחר הבטיח לו שהנזילות תוקנו בדיוק לפי חוות הדעת ולפני מכירת הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לפי החוק יש ליגאל הגנה, מאחר שלא ידע ולא היה עליו לדעת כי היה בממכר משום הפרה של ההוראות הקבועות בחוק.","על פי הכלל \"ייזהר הקונה\" היה על קרן להזמין מומחה שיבדוק את הדירה, ולכן יגאל לא אחראי כלפיה.","יגאל אחראי כלפי קרן, מאחר שהוא לא בדק שיש הסכם שיפוצים.","יגאל אחראי כלפי קרן, מאחר שהוא היה צריך לספר לקרן על הנזילות ולתת לה את חוות הדעת."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2014-07#2","e":6,"n":2,"s":"ההורים של דינה רוצים לתת לה דירה במתנה. ההורים חוששים כי דינה תמכור את הדירה מיד לאחר שתקבל אותה ורוצים לוודא שדינה לא תוכל למכור את הדירה ללא הסכמתם.במסגרת הסכם המתנה, הסכימה דינה לא למכור את הדירה ללא הסכמת ההורים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההורים יכולים לרשום לטובתם הערה על צורך בהסכמה בלשכת רישום המקרקעין.","ההורים לא יכולים לעשות דבר, מאחר שהדירה תהיה בבעלותה של דינה.","ההורים יכולים רק לפנות לבית המשפט על מנת שיחייב את רשם המקרקעין לרשום הערה, לפיה דרושה הסכמת ההורים למכירת הדירה.","ההורים יכולים לרשום לטובתם זיקת הנאה."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-07#3","e":6,"n":3,"s":"עדי רוצה לרכוש דירה הרשומה בלשכת רישום המקרקעין.עדי רוצה לבדוק בלשכת רישום המקרקעין את זכויות המוכר בדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רק בעל הדירה יכול לעיין ברישום בלשכת רישום המקרקעין.","רק אם בעל הדירה יתן הסכמה בכתב, עדי יוכל לעיין ברישום בלשכת רישום המקרקעין.","עדי יכול לעיין ברישום בלשכת רישום המקרקעין ללא צורך בקבלת הסכמת בעל הדירה.","עדי צריך להגיש בקשה מנומקת מדוע הוא רוצה לעיין, ורק אם רשם לשכת המקרקעין יאשר את בקשתו, אז הוא יהיה רשאי לעיין ברישום בלשכת רישום המקרקעין."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2014-07#4","e":6,"n":4,"s":"צינור מרכזי העובר מתחת לדירה של אלון התפוצץ, ומים רבים החלו לזרום לכיוון חדר המדרגות של הבניין.אלון מסרב לאפשר את ביצוע התיקונים מדירתו, בטענה שייגרמו לו נזקים כתוצאה מהעבודות,וכי בכל מקרה הצינור לא שייך לו, אלא שייך לכל הדיירים בבניין. הבניין רשום כבית משותף וחל עליו התקנון המצוי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["במידה ואלון יוכיח כי אכן מדובר בצינור השייך לכל הבניין, הוא לא חייב לאפשר את תיקון הצינור מהדירה שלו.","אלון חייב לאפשר את ביצוע העבודות ההכרחיות לתיקון הצינור מהדירה שלו.","רק אם יותר ממחצית הדיירים בבניין ידרשו בכתב מאלון לאפשר את ביצוע התיקונים, הוא יהיה חייב לאפשר את ביצוע התיקונים מהדירה שלו.","רק אם יותר משני שליש הדיירים בבניין ידרשו בכתב מאלון לאפשר את ביצוע התיקונים, הוא יהיה חייב לאפשר את ביצוע התיקונים מהדירה שלו."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2014-07#5","e":6,"n":5,"s":"רמי שוכר מבנה המצוי במשק חקלאי במושב אורה ליד ירושלים.רמי שוכר את המבנה משנת 1965 ולטענתו הוא דייר מוגן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רמי הוא דייר מוגן.","רמי הוא לא דייר מוגן.","רמי הוא דייר מוגן, ובלבד שבעל המשק החקלאי לא שלח לו מכתב במהלך 7 השנים האחרונות שבו הוא מכחיש את הדיירות המוגנת.","רמי הוא דייר מוגן, אלא אם כתוב בחוזה השכירות שחוק הגנת הדייר לא יחול עליו."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2014-07#6","e":6,"n":6,"s":"מאיה קנתה מגרש במחיר של מיליון ש\"ח. גובה המשכנתא שלקחה מאיה לרכישת המגרש הוא 400,000 ש\"ח.מאיה מכרה את המגרש לאסף תמורת 2 מיליון ש\"ח. הוצאות התיווך של אסף בגין העיסקה הסתכמו ב- 100,000 ש\"ח.\nמה מחיר המכירה של מאיה לצורך מס שבח?","o":["מיליון ש\"ח.","מיליון ושש מאות אלף ש\"ח.","מיליון ותשע מאות אלף ש\"ח.","שני מיליון ש\"ח."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2014-07#7","e":6,"n":7,"s":"שני צדדים לעיסקה הצהירו בעל-פה בפני רשם המקרקעין כי הם מתקשרים בעיסקת מכר מקרקעין.לא נעשה מסמך בכתב.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הרשם רשאי לרשום את העיסקה.","הרשם רשאי לרשום את העיסקה רק אם יהיה נוכח עורך דין במעמד ההצהרה.","הרשם לא רשאי לרשום את העיסקה, אך הוא רשאי לרשום הערת אזהרה על סמך ההצהרה.","הרשם לא רשאי לרשום את העיסקה."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2014-07#8","e":6,"n":8,"s":"דני מחנה את רכבו מזה 35 שנים בשטחו של מוטי. בלשכת רישום המקרקעין לא רשומה כל הערה בעניין זה.כעת מוטי מתכוון למכור את השטח. הרוכש של השטח אמר לדני:\"ימי החניה שלך בשטח נגמרו, שכן המכירה יוצאת לפועל מחר\".\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דני יכול להמשיך ולחנות בשטח של מוטי והוא יכול לדרוש לרשום לטובתו זיקת הנאה בטאבו.","דני לא יכול להמשיך ולחנות בשטח של מוטי, משום שהוא כבר יודע על התנגדות הצפויה ורישום זיקת הנאה בטאבו יהיה בחוסר תום לב.","דני לא יכול להמשיך ולחנות בשטח של מוטי, מפני שגם אם ירשום זיקת הנאה, הרי שהרישום \"מתבטל\" עם מכירת השטח לצד שלישי.","דני יכול להמשיך לחנות בשטח של מוטי ובלבד שמוטי יסכים לרשום זיקת הנאה."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2014-07#9","e":6,"n":9,"s":"חברת עמידר היא חברה בבעלות מלאה של מדינת ישראל.החברה בנתה בניין דירות על קרקע אשר בוצעו בה איחוד וחלוקה.בחלוף 3 שנים ממועד מסירת הדירות, האיחוד והחלוקה,פנו הדיירים לחברה ודרשו ממנה לרשום את הדירות ואת חלוקתן בין הדיירים בפנקס הבתים המשותפים. החברה טענה כי:\n(1) טרם חלף הזמן המחייב רישום.\n(2) מאחר שעמידר חברה בבעלות המדינה, אין לה חובה לרשום את הדירות בפנקס הבתים המשותפים.\nבנסיבות העניין, האם צודקת החברה בטענותיה? מדוע?","o":["לגבי טענה (1) - החברה טועה, שכן עברו יותר משלושה חודשים מהמסירה. לגבי טענה (2) - דין המדינה כמו דין כל מוכר אחר.","לגבי טענה (1) - החברה טועה, מאחר שעברו יותר משמונה עשר חודשים מהמסירה ומהאיחוד והחלוקה. לגבי טענה (2) - דין המדינה כמו דין כל מוכר אחר.","לגבי טענה (1) - החברה צודקת ובלבד שהחברה המשכנת שבבעלות המדינה גובה דמי רישום כאמור ב\"צו פיקוח על מחירי מצרכים ושירותים (קביעת מחיר מירבי לשירותי נותן שירות בהיעדר רישום זכויות בפנקסי המקרקעין), תש\"ס - 1999\". לגבי טענה (2) - לחברה מעמד מיוחד עקב היותה חברה ממשלתית.","לגבי טענה (1) - החברה צודקת, מאחר שלא עברו 7 שנים מהמסירה. לגבי טענה (2) - דין המדינה כמו דין כל מוכר אחר."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-07#10","e":6,"n":10,"s":"אבי הוא הבעלים של דירה בבניין דירות מאוכלס. הדירה שמתחתיו מושכרת לעמותה המשכנת בדירה ארבעה חוסים שמשרד העבודה והרווחה אישר להם לגור בדירה המשמשת כמעון.העמותה מעוניינת לשכור דירה נוספת בבניין ולשכן גם בה ארבעה חוסים נוספים. בתוכנית המיתאר הרלוונטית, הוועדה המקומית לא התייחסה למספר החוסים המותר. אבי מעוניין למנוע את המהלך.\nבנסיבות העניין, איזו מהטענות הבאות יכולה לעזור לאבי להשיג את מטרתו?","o":["בבניין יהיו יותר חוסים מהמותר בחוק.","המהלך מפר את חוק המקרקעין.","המהלך מפר את חוק רישוי עסקים.","אבי לא יכול לעשות דבר כנגד החלטת הוועדה."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2014-07#11","e":6,"n":11,"s":"בבניין שבו גר דני הושג הרוב הדרוש לצורך ביצוע תמ\"א 38. במסגרת התוכנית, רצה דני שחדר המדרגות יורחב.\nבנסיבות העניין, כמה מבעלי הדירות צריכים להסכים להרחבת חדר המדרגות כדי שהתוכנית תוכל לצאת לפועל?","o":["רוב בעלי הדירות.","70% ויותר מבעלי הדירות.","80% ויותר מבעלי הדירות.","נדרשת הסכמה של 100% מבעלי הדירות."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2014-07#12","e":6,"n":12,"s":"נציגות ועד הבית המשותף ברח' דיזינגוף 256 בתל אביב, החליטה לקיים אסיפה כללית.על הבניין חל התקנון המצוי. האסיפה נקבעה ליום 16.01.15 בשעה 20:15.האסיפה תתקיים בגינת הבניין בסמוך לכניסה.ביום 10.01.15 תלתה ציפי, נציגת הוועד, הודעה על קיום האסיפה, מועדה, והנושאים שידונו בה, בשטח הבניין ליד הכניסה למעלית, באופן ברור וגלוי.האסיפה התקיימה במועדה ונתקבלו בה החלטות. יובל, דייר בבניין, טוען שהוא לא קיבל כל הזמנה לאסיפה, כי אם היה יודע היה מגיע לאסיפה, כי ההחלטות שנתקבלו משפיעות גם עליו והוא מתנגד להן, ולכן ההחלטות בטלות כלפיו, או שלחילופין, על הנציגות לכנס שוב את אסיפת וועד הבית.\nמה הדין?","o":["החלטת הנציגות בטלה בעיקרה. על הנציגות היה למסור הודעה לכל דיירי הבניין אישית.","החלטת הנציגות לא בטלה. ציפי פעלה כדין ובהתאם לחוק.","החלטת הנציגות בטלה. הנציגות היתה צריכה לפרסם את ההודעה על האסיפה כ-18 ימים לפחות לפני מועד האסיפה. מקום פרסום המודעה אינו כדין.","החלטת הנציגות לא בטלה. אך עליה לקיים תוך 10 ימים אסיפה חוזרת ולהודיע על כך לדיירים כפי שקבוע בתקנון הבניין."],"c":[],"a":true,"note":"התשובה הנכונה: כל התשובות מתקבלות","sub":"h_common"},{"id":"2014-07#13","e":6,"n":13,"s":"רן רוצה לקנות דירה במושב חגור ופנה למתן, שהוא מתווך במקרקעין. מתן הכין הזמנה בכתב כנדרש בחוק והחתים עליה את רן.ארוסתו של מתן המתווך, יעל, המתגוררת במושב חגור, החליטה למכור את דירתה, לאור חתונתם הקרבה ומעברם לבית משותף.מתן הציע את דירתה של יעל לרן, מבלי ליידע את רן שזו דירת ארוסתו. הדירה נמכרה במחיר השוק.\nבנסיבות העניין, האם על מתן לספר לרן שהדירה היא של ארוסתו?","o":["מאחר שהדירה נמכרה במחיר השוק - מתן לא צריך לגלות לרן על כך.","הואיל ומתן ידע על רצונה של יעל למכור את דירתה רק לאחר שהזמנת שירותי התיווך נכתבה, הוא אינו נדרש לספר על כך לרן.","הואיל ומדובר בדירת ארוסתו ולא בדירתו שלו, מתן לא נדרש לספר על כך לרן.","על מתן לגלות לרן שזוהי דירת ארוסתו, ולקבל את הסכמתו לכך בכתב."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2014-07#14","e":6,"n":14,"s":"קרן היא מעצבת פנים מצליחה, בעלת משרד בתחום, אך ללא רישיון תיווך. קרן סיפרה לתמר חברתה, המעוניינת לקנות דירה, שחברה אחרת שלה, שחר, רוצה למכור דירה.קרן תיאמה פגישה בין השתיים ואכן תמר ושחר נפגשו וחתמו על חוזה למכירת הדירה. קרן שלחה להן מכתב ברכה ובו ציינה כי היא לא מתווכת ולכן אין לה דרישות לקבל מהן דמי תיווך.\nבנסיבות העניין, האם הפרה קרן את חוק המתווכים?","o":["כן; קרן הפרה את חוק המתווכים.","כן; הואיל וקרן היתה הגורם היעיל בעיסקה מבלי שהיא מתווכת מורשה, היא הפרה את חוק המתווכים.","כן; הואיל ורק מתווך בעל רישיון לפי חוק המתווכים רשאי לעסוק בתיווך, הפרה קרן את חוק המתווכים.","לא; קרן לא הפרה את חוק המתווכים."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2014-07#15","e":6,"n":15,"s":"היכן ניתן לקבל מידע בדבר עיקול על זכויותיו הקנייניות של בעל קרקע?","o":["בוועדה המקומית לתכנון ובנייה.","ברשות המקומית.","בלשכת רישום המקרקעין.","במשרדי מיסוי המקרקעין."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-07#16","e":6,"n":16,"s":"תשלום דמי היתר ישולם למינהל כאשר: -","o":["החוכר מבקש אישור ממינהל מקרקעי ישראל לבנות תוספת בנייה לבית הקיים.","החוכר מבקש למכור את כל זכויותיו לצד שלישי.","החוכר מבקש לחתום על חוזה חכירה חדש עם המינהל.","החוכר מבקש מהמינהל שיתיר לו למכור חלק מזכויותיו לצד שלישי."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2014-07#17","e":6,"n":17,"s":"גיא הגיע לראות דירה באמצעות המתווכת לאה. גיא סיפר ללאה כי הוא רוצה לרכוש דירה ללא חריגות בנייה.לשאלתו של גיא, השיבה לאה כי הדירה במצב מצוין וכי אין לה כל בעיה מיוחדת או חריגות בנייה. גיא רכש הדירה ונעזר בשירותיו של עורך הדין מטעמו.לאחר החתימה על החוזה התברר כי 2 חדרים בדירה נבנו ללא היתר, ולכן שווי הדירה נמוך בהרבה ממה שגיא שילם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גיא לא יכול לתבוע את המתווכת, מאחר שהוא נעזר בשירותיו של עורך דין מטעמו.","גיא יכול לתבוע את המתווכת על מנת שתפצה אותו בנזקים שנגרמו לו.","גיא לא יכול לתבוע את המתווכת, מאחר שזה לא מתפקידו של מתווך לבדוק היתר בנייה.","גיא יכול לתבוע את המתווכת רק אם יתבע גם את עורך הדין שלו."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2014-07#18","e":6,"n":18,"s":"לפני מספר שנים עבר אריאל לגור בדירה המורכבת משני מחסנים צמודים. כיום רוצה אריאל למכור את המחסנים ופנה ליותם המתווך.יותם החתים אותו על הסכם תיווך ועל מסמך בלעדיות נפרד, ואולם הם שכחו לרשום סעיף המגדיר את תקופת הבלעדיות.לאחר חודשיים ושבוע התחרט אריאל על כי נתן בלעדיות למתווך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אריאל לא יכול להשתחרר מהסכם הבלעדיות; אם יותם המתווך ביצע פעולות שיווק וכל עוד הוא ממשיך לבצע אותן, יותם הוא מתווך בלעדי של הנכס.","אריאל יכול להשתחרר מהסכם הבלעדיות, כיוון שממילא אין תוקף לבלעדיות בכל הנוגע למחסנים.","אריאל יכול להשתחרר מהסכם הבלעדיות, כיוון שבמקרה זה מדובר על דירה כהגדרתה בחוק ותקופת הבלעדיות מסתיימת לאחר חודש.","אריאל יכול להשתחרר מהסכם הבלעדיות, רק אם יותם המתווך לא ביצע כל פעולת שיווק במהלך החודשיים הראשונים."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2014-07#19","e":6,"n":19,"s":"אביב מעוניין להפעיל קניון בתחומי הרשות המקומית \"גני גרדנר\".\nבנסיבות העניין, למי צריך אלי לפנות על-מנת לקבל רישיון להפעלת העסק?","o":["לראש הרשות המקומית \"גני גרדנר\", או לאחר שהוסמך לכך על-ידו.","לאדם ששר הפנים הסמיכו לכך.","קניון אינו עסק הטעון רישוי ולכן לא נדרש לקבל רישיון להפעלתו.","לשר הבינוי והשיכון, או לאחר שהוסמך לכך על-ידו."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2014-07#20","e":6,"n":20,"s":"אסף מונה על ידי בית המשפט לנהל את עזבונו של נדב ז\"ל. במסגרת תפקידו כמנהל עיזבון, התקשר אסף בחוזה למכירת דירתו של נדב.\nבנסיבות העניין, האם אסף פעל בהתאם לסמכותו? מדוע?","o":["לא, מנהל עיזבון לא מוסמך להתקשר בחוזה למכירת דירה.","כן, מתוקף סמכותו, מנהל עיזבון רשאי לבצע כל פעולה הדרושה למילוי תפקידו ללא צורך בקבלת אישור כלשהו.","כן, ובתנאי שאסף קיבל אישור של בית המשפט שמינה אותו כמנהל עיזבון לביצוע בפעולה זו.","לא, רק היורשים של נדב יכולים להתקשר בחוזה למכירת הדירה."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-07#21","e":6,"n":21,"s":"שמעון נפטר והוריש דירת מגורים ללילך בתו. לאור חובות של שמעון לנושים, בית המשפט הורה על מינוי מנהל עיזבון.לילך מעוניינת לקבל את הדירה לחזקתה מהר ככל האפשר.בהיעדר החלטה אחרת של בית המשפט\nבנסיבות העניין, איזה מה משפטים הבאים הוא הנכון ביותר?","o":["מנהל העיזבון יעריך מה גובה חובותיו של שמעון, ואם יש מספיק כספים נזילים כדי לכסות את החובות המשוערים, הוא יכול לאשר את העברת הדירה ללילך עוד לפני כיסוי חובות הנושים.","מנהל העיזבון חייב להזמין את נושי המוריש שיודיעו לו בכתב את תביעותיהם ורשאי לקבוע לפי שיקול דעתו המוחלט את התקופה בה הנושים רשאים להגיש הודעה.","מנהל העיזבון חייב להזמין את נושי המוריש שיודיעו לו בכתב את תביעותיהם וחייב לאפשר לנושים לפחות 3 חודשים מיום הפרסום להגיש את תביעותיהם.","מנהל העיזבון חייב להזמין את נושי המוריש שיודיעו לו על תביעותיהם, אך הודעה יכולה להיות בעל פה או בכתב ובתוך פרק זמן שיקבע מנהל העיזבון."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2014-07#22","e":6,"n":22,"s":"מור ובר חתמו על חוזה לרכישת דירה. בר הפרה את החוזה הפרה לא יסודית, ומור החליטה לתבוע את בר בגין ההפרה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מור לא יכולה לתבוע את אכיפת החוזה.","מור לא יכולה לתבוע את ביטול החוזה מיידית.","מור לא יכולה לתבוע פיצויים בעד הנזק שנגרם לה בשל ההפרה.","מור לא יכולה בשום מקרה לדרוש את ביטול החוזה כאשר מדובר בהפרה לא יסודית."],"c":[1],"a":false,"note":"","sub":"c_remedy"},{"id":"2014-07#23","e":6,"n":23,"s":"משה המתווך נפגש עם חן לצורך מילוי הזמנה בכתב לביצוע פעולת תיווך במקרקעין, כאשר לפתע שם לב שהדיו בעט שלו עומד להיגמר. השניים הבינו כי לא יישאר מספיק דיו ולכן ייאלצו לוותר על רישום חלק מן הפרטים שתכננו לכתוב בהזמנה.\nבנסיבות העניין, על אילו פרטים יכולים הצדדים לוותר, מבלי לפגוע בתקינותו של הסכם התיווך?","o":["שמות, כתובות ומספרי זיהוי של המתווך ושל הלקוח.","תיאור הנכס נשוא פעולת התיווך.","אופן ביצוע העברת התשלום עבור התיווך וכן מועד העברת התשלום.","מחיר העיסקה המבוקשת, בקירוב."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2014-07#24","e":6,"n":24,"s":"קבלן בנה בניין בן 10 דירות, מתוכן חמש דירות המיועדות למכירה וחמש דירות המיועדות להשכרה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כל המכירות וההשכרות חייבות במע\"מ.","מכירה או השכרה לעוסק חייבת במע\"מ, אך מכירה או השכרה לאדם פרטי לא חייבת במע\"מ.","מכירות הדירה חייבות במע\"מ אך ההשכרות לא חייבות במע\"מ.","אין חיוב במע\"מ בעיסקאות עם קבלן."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2014-07#25","e":6,"n":25,"s":"משכיר ושוכר סיכמו ביניהם על השכרת קרקע השייכת למשכיר לתקופה של 9 שנים. השניים נפגשו במשרדו של המתווך שתיווך בעיסקה, אשר הסביר להם ששכירות לתקופה כזו חייבת להיות בכתב. עד לחתימת חוזה בכתב, הציע להם המתווך לחתום על זיכרון דברים. המשכיר והשוכר לא ידעו מה יש לכתוב בזיכרון הדברים ולפיכך הציע להם המתווך נוסח שהיה במשרדו מעיסקה קודמת, אך הוא לא היה מעורב בעריכתו. המשכיר והשוכר ערכו זיכרון דברים בעצמם, בהתבסס על המסמך שנתן להם המתווך, ובהמשך חתמו על חוזה שכירות שנערך בידי עורך דין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שהמתווך לא הכין בעצמו את זיכרון הדברים, אין כל פגם בהתנהלותו.","המתווך סייע לעריכת מסמך משפטי ולפיכך הוא ביצע עבירה פלילית, אולם מאחר שבהמשך נחתם חוזה שכירות חוקי והמתווך היה הגורם היעיל בעיסקה, הוא זכאי לדמי תיווך.","המתווך לא ביצע עבירת משמעת בנסיבות העניין, אך מאחר שסייע לעריכת מסמך משפטי הוא לא זכאי לדמי תיווך.","בנסיבות העניין המתווך ביצע עבירת משמעת, וכמו כן הוא לא זכאי לדמי תיווך."],"c":[3],"a":false,"note":"","sub":"r_rent"},{"id":"2014-10#1","e":7,"n":1,"s":"לקוח חתם על הסכם תיווך כאשר על ההסכם מופיע לוגו של סוכנות תיווך הפועלת כחברה בע\"מ.חתימת המתווך על ההסכם נעשתה עם חותמת של החברה ובשמה. הסוכנות מעסיקה מתווכים בעלי רישיון.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין מניעה כי שירותי התיווך יינתנו באמצעות תאגיד ובלבד שפעולת התיווך תיעשה ע\"י מתווך בעל רישיון.","ניתן לבצע את פעולת התיווך רק באמצעות תאגיד שהוא חברה בע\"מ.","אין כל מניעה כי פעולת התיווך תיעשה באמצעות תאגיד ובלבד שהבעלים של התאגיד יהיה בעל רישיון תיווך.","לא ניתן כלל לתת שירותי תיווך באמצעות תאגיד, אלא רק באמצעות מתווך שקיבל רישיון תיווך."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2014-10#2","e":7,"n":2,"s":"דני קנה דירה מקבלן. במפרט הדירה נכתב שכל הקרמיקה בחדר המדרגות של הבניין המשותף תהיה מסוג א'.ביום המסירה גילה דני כי הקרמיקה היא קרמיקה מסוג ב', כלומר ברמת איכות נמוכה יותר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין תוקף להתחייבות במפרט, מאחר שקרמיקה היא לא בגדר דירה או מערכות חיוניות ולכן המפרט לא חל עליה.","אין תוקף להתחייבות במפרט, מאחר שמדובר בחדר המדרגות ואילו מפרט מתייחס רק לדירה.","יש תוקף להתחייבות במפרט ודני רשאי לדרוש מהקבלן לקיים אותה.","יש תוקף להתחייבות במפרט, רק אם כל הדיירים בבניין ידרשו זאת."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2014-10#3","e":7,"n":3,"s":"ניצן ואיתמר הם בעלי דירה במרכז העיר בירושלים.נודע להם כי לצורך עבודתם עליהם לעזוב את ישראל בעוד שבועיים לתקופה ארוכה.הם פנו עוד באותו יום לירדן, מתווכת ידועה ובעלת רישיון תיווך, שתסייע להם למצוא במהירות קונה לדירתם.ירדן סיפרה לגיא, המעוניין לרכוש את הדירה, שהמוכרים לחוצים למכור, מאחר שהם טסים לחוץ לארץ בעוד כשבועיים.\nבנסיבות העניין, האם ירדן פעלה כדין?","o":["כן; על ירדן מוטלת החובה לגלות את העניין לקונה פוטנציאלי.","כן, ובלבד שניצן ואיתמר לא אסרו עליה לגלות מידע זה.","לא; לירדן אסור לגלות לאיש, שלא בהסכמת איתמר וניצן, על עזיבתם לחוץ לארץ.","כן. המידע לא קשור למהות הנכס וטיבו ולכן ירדן יכלה לספר על כך לצד ג'."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2014-10#4","e":7,"n":4,"s":"דליה רוצה לרכוש דירה מחברה קבלנית. כאשר קראה דליה את חוזה המכר היא גילתה להפתעתה כי הקבלן מבקש להצמיד את מחיר הדירה למדד המחירים לצרכן.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור לקבלן להצמיד את מחיר הדירה למדד המחירים לצרכן, אלא רק למדד תשומות הבנייה.","הקבלן רשאי להצמיד את מחיר הדירה למדד המחירים לצרכן רק אם קיבל אישור מראש מאת שר האוצר.","הקבלן רשאי להצמיד את מחיר הדירה למדד המחירים לצרכן .","הקבלן חייב לאפשר לרוכש הדירה לבחור לאיזה מדד הוא רוצה להצמיד את מחיר הדירה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2014-10#5","e":7,"n":5,"s":"שולה, שמכרה דירה לשוקי, הפרה את חוזה מכר הדירה.היא מסרה לשוקי את הדירה באיחור של חודש ימים ושוקי הסכים לקבל את הדירה כאשר הוא מדגיש כי הוא לא מוותר על זכויותיו לפי החוק והחוזה.שוקי פנה לשולה וביקש ממנה לשלם לו את הפיצוי המוסכם.בהסכם המכר נרשם כי הצד המפר ישלם לצד הנפגע פיצויים מוסכמים ללא הוכחת נזק בשיעור של 25% מסכום העסקה.שולה מודה שאכן הפרה את ההסכם ואין לה סיבה טובה לכך, אך היא לא רוצה לשלם פיצוי גבוה כל כך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שולה חייבת לשלם את הפיצוי המוסכם; מי שמפר הסכם בלי סיבה טובה לא יכול לשנות את הפיצוי המוסכם.","שוקי לא יכול גם לקבל את הדירה וגם לדרוש פיצוי .","החוק קובע שפיצוי מוסכם לא יעלה בשום מקרה על 15% מסכום העסקה, ולכן התנאי של 25% בטל ומבוטל.","בית המשפט יכול להתערב בסכום הפיצוי רק אם מדובר בפיצוי שנקבע ללא כל יחס סביר לנזק שניתן היה לראותו מראש בעת כריתת ההסכם כתוצאה מסתברת של ההפרה."],"c":[3],"a":false,"note":"","sub":"c_remedy"},{"id":"2014-10#6","e":7,"n":6,"s":"יאיר ונורית שוכרים דירת גג בבית משותף.השכנים פלשו לגג המוצמד לדירה של יאיר ונורית והציבו בו מתקנים שונים המפריעים ליאיר ולנורית.יאיר ונורית עיינו בחוזה השכירות שלהם ולא מצאו כל התייחסות לנושא.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שיאיר ונורית רק שוכרים את הדירה, הם לא יכולים לתבוע את השכנים.","מאחר שיאיר ונורית רק שוכרים את הדירה, הם לא יכולים לתבוע את השכנים אצל המפקח על הבתים המשותפים, אך הם יכולים לתבוע את השכנים בבית משפט השלום.","יאיר ונורית יכולים לתבוע את השכנים אצל המפקח על הבתים המשותפים או בבית משפט השלום.","יאיר ונורית יכולים לתבוע את השכנים אצל המפקח על הבתים המשותפים רק אם יקבלו הסכמה בכתב של בעל הדירה שלהם."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2014-10#7","e":7,"n":7,"s":"מיכל הגישה תלונה כנגד טל המתווך, בטענה שלא מסר לה את העתק ההסכם ביניהם לאחר שהחתים אותה בפגישה שקיימו במשרדו של טל.\nבנסיבות העניין, איזה מבין העונשים הפליליים הבאים יכול טל לקבל אם אכן יורשע בעניין זה?","o":["לא ניתן להרשיע מתווך בעבירה של אי מסירת העתק הסכם.","אפשר להטיל על טל עונש של פי שלושה מהקנס הקבוע בסעיף 61 (א) (2) לחוק העונשין, לסגור את העסק של טל לתקופה מסוימת ולהתלות את רישיונו לתקופה שיקבע בית המשפט.","אפשר להטיל על טל עונש של פי שבעה מהקנס הקבוע בסעיף הקבוע בסעיף 61 (א) (2) לחוק העונשין, לסגור את העסק של טל לתקופה מסוימת ולהתלות את רישיונו לתקופה שיקבע בית המשפט.","אפשר להטיל על טל עונש של פי שבעה מהקנס הקבוע בסעיף הקבוע בסעיף 61 (א) (2) לחוק העונשין, אבל אי אפשר לסגור את העסק של טל לתקופה מסויימת."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2014-10#8","e":7,"n":8,"s":"יגאל זייף מסמכים המציגים כי חברה שיקים בעוד כחודש זכאית להירשם כבעלים של קרקע בזיכרון יעקב.יגאל הציג את המסמכים המזויפים לגיא היזם. על סמך מסמכים אלה נחתמה ביניהם עסקה.אחרי שבוע התברר כי המסמכים היו מזויפים ולכן העסקה בוטלה. בסופו של דבר יגאל לא הקים את החברה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן לבצע עבירת זיוף ביחס לחברה ולכן יגאל לא יואשם בזיוף.","לא ניתן לבצע עבירת זיוף ביחס לחברה שלא הוקמה ולכן יגאל לא יואשם בזיוף.","ניתן להאשים את יגאל בזיוף גם ביחס לחברה שהייתה צריכה להיווסד (גם אם לא נוסדה בסופו של דבר).","מאחר שהעסקה בוטלה, לא ניתן להאשים את יגאל בזיוף."],"c":[2],"a":false,"note":"","sub":"k_misc"},{"id":"2014-10#9","e":7,"n":9,"s":"מתווך התבקש לתווך בעיסקה למכירת בניין בלבד, ללא הקרקע שעליה הוא עומד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין מניעה לבצע עיסקה כזו לאור עיקרון חופש החוזים.","לא ניתן לבצע עיסקה כזו מאחר שעיסקה במקרקעין חלה על הקרקע והבניין.","ניתן לבצע עיסקה כזו רק אם מדובר בבית משותף.","ניתן לבצע את העיסקה אם הבניין נבנה ללא אישורו של בעל הקרקע."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2014-10#10","e":7,"n":10,"s":"דני חתם על הסכם לשכירת דירה ל- 15 שנים, ונקבע שישלם את מלוא דמי השכירות מראש.הדירה רשומה בלשכת רישום המקרקעין. דני חושש שבעל הבית יתחרט ולכן רוצה לוודא שהעסקה הושלמה ונגמרה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["העיסקה נגמרה כאשר הצדדים סיימו לחתום על ההסכם.","העיסקה נגמרה כאשר התקבל אישור מס שבח על העיסקה.","העיסקה נגמרה כאשר היא נרשמה בלשכת רישום המקרקעין.","העיסקה נגמרה כאשר שולמה מלוא התמורה החוזית."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2014-10#11","e":7,"n":11,"s":"בהסכם מכר של דירה מקבלן ניתנו לקונה שתי אפשרויות: הראשונה-התשלום הראשון יעמוד על 10% ממחיר הדירה והקונה יקבל ערובה, והשנייה - תשלום של 7% ממחיר הדירה והקונה יקבל ערובה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שתי האפשרויות הן לא חוקיות.","אין כל בעיה בשתי האפשרויות.","האפשרות הראשונה היא חוקית אך האפשרות השנייה היא לא חוקית.","האפשרות הראשונה היא לא חוקית אך האפשרות השנייה היא חוקית."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2014-10#12","e":7,"n":12,"s":"גיא רכש דירה בבניין הרשום כבית משותף. כעת הוא מעוניין לבטל את רישום הבית כבית משותף.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן לבטל רישום בית משותף.","ניתן לבטל רישום בית משותף אם ביקשו זאת כל בעלי הדירות או אם המפקח נוכח שהבית לא ראוי עוד לרישום בפנקס ולאחר שניתנה הזדמנות לכל בעל זכות בדירות שבבניין לטעון את טענותיו.","כל בעל דירה שבבניין רשאי לבטל רישום בית משותף ,לאחר שניתנה הזדמנות לכל בעל זכות בדירה שבבניין לטעון את טענותיו.","ניתן לבטל רישום בית משותף רק אם לפחות 75% מבעלי הדירות ביקשו זאת."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2014-10#13","e":7,"n":13,"s":"מתווך שהחתים לקוח על הסכם תיווך והיה הגורם היעיל שהביא להתקשרות הצדדים בהסכם מחייב, סייע לערוך מסמכים הנוגעים לעיסקת המקרקעין.\nבנסיבות העניין, האם הוא זכאי לדמי תיווך?","o":["המתווך זכאי בכל מקרה לדמי תיווך.","המתווך לא זכאי לדמי תיווך אם הוא גם ייצג לקוח במשא ומתן.","המתווך לא זכאי לדמי תיווך.","המתווך זכאי לדמי תיווך אם מדובר במסמכים שהם לא בעלי אופי משפטי."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2014-10#14","e":7,"n":14,"s":"בבית משותף יש 8 דירות. באסיפת דיירים הועלתה האפשרות לערוך בבניין, באמצעות קבלן,פרויקט חיזוק לפי חוק המקרקעין (חיזוק בתים משותפים מפני רעידות אדמה), התשס\"ח 2008.הקבלן מבקש לבנות דירות נוספות בבניין כחלק מהפרויקט. אחד הדיירים מתנגד להצעה של הקבלן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לבניית הדירות הנוספות נדרשת הסכמה של 51% מבעלי הדירות בבניין, ולכן הדיירים יכולים להמשיך כדי לקדם את הפרויקט.","לבניית הדירות הנוספות נדרשת הסכמה של כל בעלי הדירות ולכן הדיירים לא יכולים לעשות דבר כדי לקדם את הפרויקט.","לבניית הדירות הנוספות נדרשת הסכמה של כל בעלי הדירות אך הדיירים יכולים לפנות למפקח על הבתים המשותפים, אשר רשאי בתנאים מסוימים לאשר את הבנייה לפי הסכמה של בעלי דירות שבבעלותם שני שליש מהדירות ושני שלישים מהרכוש המשותף.","לבניית הדירות הנוספות נדרשת הסכמה של שני שליש של בעלי הדירות ולכן הדיירים יכולים להמשיך ולקדם את הפרויקט."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2014-10#15","e":7,"n":15,"s":"מתווכת הציעה לרינה היזמית להתקשר בפרויקט להקמת בניין על מגרש שהיה בבעלות חברה שחיפשה משקיע.לאחר שרינה גילתה עניין בפרויקט הפנתה אותה המתווכת למתווך נוסף שייצג את החברה בעלת הקרקע, וזה מסר לרינה פרטים נוספים. בעקבות זאת התקשרו הצדדים בעיסקה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כאשר יותר ממתווך אחד טיפל בעיסקה, רק הראשון בזמן הוא הגורם היעיל הזכאי לדמי תיווך.","קיימים מקרים שישנם שני גורמים או יותר אשר הניעו את התהליך וכולם ביחד מהווים את הגורם היעיל הזכאי לדמי תיווך.","כאשר יש מספר מתווכים אשר ביצעו פעולות תיווך בעיסקה הרי שעליהם לחלוק ביניהם את דמי התיווך בחלקים שווים.","כאשר יותר ממתווך אחד טיפל בעיסקה, רק המתווך שביצע את פעולת התיווך האחרונה בזמן, הוא הגורם היעיל הזכאי לדמי תיווך."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2014-10#16","e":7,"n":16,"s":"מהו \"ליווי פיננסי\"?","o":[
