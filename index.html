 הבאים הוא הנכון ביותר?","o":["על הקבלן למסור את הדירה כשכל פרט שהיה אמור להיכלל במפרט הוא באיכות גבוהה.","על הקבלן למסור את הדירה כשכל פרט שהיה אמור להיכלל במפרט הוא באיכות סבירה.","הקבלן רשאי למסור גימור בכל איכות שהיא, אלא אם החוזה בין הצדדים מחייב אותו במפורש אחרת.","מדובר בעניין שבין הצדדים לחוזה, הדין אינו מתייחס כלל לאיכות הגימור של דירה חדשה."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2025-07#5","e":45,"n":5,"s":"שלומי חיפש חנות לקנייה, ופנה למתווכת מירי שתסייע לו בעניין. שבועיים לאחר מכן התקשרה מירי לשלומי ועידכנה אותו כי מצאה חנות עבורו, במחיר של 1.2 מיליון ש\"ח. אין בבעלותו של שלומי כל דירת מגורים.\nהאם שלומי יהיה זכאי לסיווג של ״דירה יחידה״ לצורכי מס רכישה בגין רכישת החנות? מדוע?","o":["כן; הואיל ואין בבעלות שלומי כל דירת מגורים, הוא פטור לחלוטין ממס רכישה.","כן; הואיל ושווי החנות הוא מתחת לתקרת דירה יחידה, שלומי יהיה פטור ממס רכישה.","לא; שלומי לא יהיה פטור ממס רכישה, אולם הוא יהיה פטור ממס שבח בעת מכירת החנות.","לא; מדרגות מס רכישה ל\"דירה יחידה\" אינן תקפות לגבי מקרקעין שאינם דירת מגורים."],"c":[3],"a":false,"note":"","sub":"x_purchase"},{"id":"2025-07#6","e":45,"n":6,"s":"אילו אישורים דורש רשם המקרקעין (טאבו) מצדדים לעיסקה, כתנאי לרשום את זכויותיו של רוכש דירת מגורים שבבעלות המוכר?","o":["אישור מס רכישה, אישור מס שבח, אישור מס הכנסה ואישור מהרשות המקומית.","אישור מס רכישה, אישור מס שבח, אישור מהרשות המקומית על היעדר חובות, אישור אדריכל על היעדר חריגות בנייה.","אישור מס רכישה, אישור מס שבח, אישור הרשות המקומית על היעדר חובות.","אישור מס רכישה, אישור מס שבח, אישור הרשות המקומית על היעדר חובות ואישור רשות מקרקעי ישראל."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2025-07#7","e":45,"n":7,"s":"אורלי ואורן כרתו ביניהם חוזה מכר של דירה; אורלי המוכרת ואורן הוא הרוכש. אורן הפר את אחד מסעיפי החוזה, הפרה לא יסודית.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["אורלי זכאית לבטל את החוזה באופן מיידי.","אורלי אינה זכאית לבטל את החוזה במקרה של הפרה לא יסודית.","אורלי זכאית לבטל את החוזה רק לאחר שנתנה לאורן אורכה לקיום החוזה והחוזה לא קוים בתוך זמן סביר לאחר מתן האורכה.","אורלי אינה זכאית לביטול החוזה, אלא אם נתנה לאורן 3 ימי עסקים לתיקון ההפרה."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2025-07#8","e":45,"n":8,"s":"נעמי ירשה מהוריה בית פרטי בנהריה, אשר מבחינה תכנונית אינו ניתן לחלוקה. הבית הוא בשטח של 250 מ\"ר ומחולק לשתי קומות. נעמי מעוניינת לפצל את הנכס לשתי דירות, אחת בכל קומה, ולמכור אחת מהן.\nבנסיבות המתוארות, האם נעמי תוכל למכור רק את אחת הקומות בבית שירשה? מדוע?","o":["כן; החוק אינו עוסק בפיצול של נכס לשתי יחידות.","כן; אולם רק אם אף אחת מהדירות אינה עולה בשוויה על מיליון ש\"ח.","לא; משום שלא ניתן למכור רק חלק ממקרקעין.","לא; משום שלא שולם היטל השבחה בגין הפיצול."],"c":[2],"a":false,"note":"","sub":"p_levy"},{"id":"2025-07#9","e":45,"n":9,"s":"מה מבין הבאים לא יכול להיות מוכר כ״דירת מגורים יחידה״ לצורכי מס שבח?","o":["דירה המיועדת למגורים שבנייתה נסתיימה.","דירה המיועדת למגורים שבנייתה טרם נסתיימה.","חלק מדירת מגורים.","דירה בבעלותו של יחיד."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2025-07#10","e":45,"n":10,"s":"רועי מעוניין למכור את דירתו למרדכי. רועי ומרדכי הגיעו ביחד לרשם המקרקעין והודיעו לו שהם סיכמו ביניהם בעל פה על עיסקת מכר בנוגע לדירה.\nהאם רשם המקרקעין יבצע רישום בטאבו של העיסקה בין הצדדים כאמור? מדוע?","o":["כן; אם מתקיימים היסודות הנדרשים בחוק החוזים לחוזה.","כן; אם הונחה דעתו של הרשם שמדובר בעיסקה שאינה פיקטיבית.","לא; מכיוון שעיסקת מקרקעין טעונה מסמך בכתב.","לא; מכיוון שרשם המקרקעין אינו הסמכות לרישום עיסקת מקרקעין."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2025-07#11","e":45,"n":11,"s":"נוי ועמית רכשו חלקת קרקע. נוי ועמית חתמו על הסכם שיתוף המסדיר את היחסים המשפטיים ביניהן בקשר לקרקע. אחד מהסעיפים בהסכם השיתוף קובע כי נוי ועמית אינן רשאיות לפרק את השיתוף ביניהן. תוקפו של הסעיף ל- 10 שנים מיום חתימת ההסכם. לאחר 5 שנים ממועד חתימת ההסכם, נוי ועמית הסתכסכו, ועמית מעוניינת לפרק את השיתוף.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["עמית אינה רשאית לדרוש את פירוק השיתוף כל עוד לא עברו 10 שנים מיום חתימת ההסכם.","עמית רשאית לדרוש את פירוק השיתוף רק אם נוי תסכים לכך.","בית משפט רשאי לפרק את השיתוף אם נראה לו הדבר צודק בנסיבות העניין.","עמית יכולה לפנות לרשם המקרקעין (טאבו) ולפרק את השיתוף."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2025-07#12","e":45,"n":12,"s":"מהו \"הסכם משבצת\" במושב חקלאי?","o":["הסכם שכירות של עד 10 שנים בין אגודה שיתופית לרשות מקרקעי ישראל.","הסכם מכר בין אגודה שיתופית לסוכנות היהודית.","הסכם חכירה בין אגודה שיתופית לרשות מקרקעי ישראל.","הסכם מכר בין אגודה שיתופית לרשות מקרקעי ישראל."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2025-07#13","e":45,"n":13,"s":"כפיר הוא בעלים של דירה. לכפיר יש אח תאום בשם אופיר. אופיר הצליח להשיג את תעודת הזהות של כפיר, פרסם למכירה את הדירה של כפיר, ומכר אותה, תוך שהוא מתחזה לכפיר, הבעלים האמיתי של הנכס.\nמה העונש הצפוי לאופיר על התחזות זו?","o":["עבודות שירות של עד 24 חודשים.","מאסר על תנאי של עד 12 חודשים.","מאסר של עד 3 שנים.","מאסר בית של עד 6 חודשים."],"c":[2],"a":false,"note":"","sub":"k_misc"},{"id":"2025-07#14","e":45,"n":14,"s":"שאול עבר בהצלחה את המבחן האחרון שהתקיים להסמכת מתווכים וקיבל את רישיון התיווך. שאול התחיל לעבוד כמתווך והגיע להסכמה עם ציפורה, בעלת דירה, כי יפרסם את דירתה למכירה, אך לא קיבל בלעדיות. לאחר כשלושה שבועות הודיעה ציפורה לשאול כי מכרה את הדירה בעצמה. שאול השאיר את המודעה שפירסם בקשר לדירתה, למשך חצי שנה נוספת, וענה לשלושה מתעניינים בפרק הזמן הזה.\nהאם שאול פעל כדין בנסיבות אלה? מדוע?","o":["כן; מותר לפרסם מודעות באזור הפעילות של מתווך ובכלל זה נכס לדוגמא שכבר נמכר.","כן; אין למתווך כל מניעה להמשיך ולפרסם נכס שכבר נמכר.","לא; על שאול חלה החובה להסיר פרסום של נכס שנמכר בתוך 3 ימי עסקים ממועד ההודעה על כך.","לא; על שאול חלה החובה להסיר בהקדם האפשרי פרסום של נכס שנמכר."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-07#15","e":45,"n":15,"s":"תומר הוא מתווך מקרקעין. תומר מתמחה בליווי משקיעים לרכישת דירות להשקעה.\nלקוחותיו של תומר משלמים לו דמי רצינות כמקדמה על סך 5,000 ש\"ח וסכום זה מקוזז מדמי התיווך כאשר נחתמת עיסקה.\nהאם תומר פועל כדין? מדוע?","o":["כן; כל עוד תומר מצהיר לרשויות המס על הכנסתו מדמי התיווך.","לא; על תומר חל איסור מוחלט לגבות דמי רצינות בגין עיסקת תיווך.","כן; כל עוד דמי התיווך ייגבו בנוסף ובנפרד מדמי הרצינות.","לא; אלא אם הלקוח אישר זאת בכתב מראש ולא בדיעבד."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2025-07#16","e":45,"n":16,"s":"יוסף נפטר, והותיר מספר בתים בעזבונו. בצוואתו ציווה יוסף שחברת \"ארטיקים לכל כיס\" תהיה מנהלת העיזבון, ואם לא יתאפשר, אזי ימונה בנו הבגיר למנהל העיזבון.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["לא ניתן למנות חברה כמנהלת עיזבון, אלא רק אדם מעל גיל 18 יכול להיות מנהל עיזבון.","ניתן למנות חברה כמנהלת עזבון אך ורק אם לא יתאפשר לבנו של הנפטר להיות מנהל עיזבון, כגון עקב מחלה.","ניתן למנות חברה כמנהלת עיזבון.","בית המשפט לא רשאי להתערב בבקשתו של נפטר בקשר למינוי מנהל עיזבון, וימנה רק את מי שהנפטר ציין בצוואתו כמנהל עיזבון."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2025-07#17","e":45,"n":17,"s":"מה ההבדל בין \"שימוש חורג\" ל\"הקלה\"?","o":["הקלה היא מתן רשות לעשות שימוש חורג בנכס, שימוש חורג הוא שימוש בנכס בניגוד לרישיון העסק.","הקלה היא שימוש השונה מזה שנקבע בתוכנית החלה על הנכס או בהיתר הבנייה, שימוש חורג הוא בנייה בשינוי קל מהוראות התוכנית החלה על הנכס.","הקלה היא בנייה בשינוי קל מהוראות התוכנית החלה על הנכס, שימוש חורג הוא שימוש השונה מזה שנקבע בתוכנית החלה על הנכס או בהיתר הבנייה.","הקלה היא בנייה בשינוי קל מהוראות התוכנית החלה על הנכס, שימוש חורג הוא הוא בנייה בשינוי גדול מהוראות התוכנית החלה על הנכס."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2025-07#18","e":45,"n":18,"s":"יובל הוא מתווך רשום, וגם מעצב פנים. יובל החתים רוכש פוטנציאלי על הסכם להזמנת שירותי תיווך בסך 2% מסכום העיסקה והציג בפניו בית לרכישה. הרוכש מעוניין ברכישת הבית, אך מבקש להפחית את דמי התיווך ל- 1% מסכום העיסקה. יובל מספר לו שהוא עוסק גם כמעצב פנים. הם מגיעים לידי הסכמה שהרוכש ישלם 2% דמי תיווך, כפי שכתוב בהסכם, אך יובל גם יעצב את הבית מחדש בעבור אותו תשלום.\nהאם יובל פעל כדין? מדוע?","o":["כן; כל עוד דמי התיווך אינם גבוהים מ- 2% אין מניעה להוסיף שירות במסגרת אותו התשלום.","לא; על המתווך להבחין במפורש ובכתב בין סכום דמי התיווך לבין סכום נוסף בעבור כל שירות נוסף.","כן; מאחר שעיצוב הבית הוא עיסוק שמסייע למתווכים למכור את הבית, מתווכים רשאים להציע את שירותיהם כמעצבים במסגרת התשלום על התיווך.","לא; בכל מקרה על המתווך נאסר לעסוק עם לקוחו בכל עיסוק אחר שאינו תיווך."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2025-07#19","e":45,"n":19,"s":"גלית שכרה דירה באמצעות מתווך. השכירות עומדת להסתיים, וגלית שכחה להודיע לבעל הבית על רצונה להמשיך את השכירות. כחודש לפני תום השכירות, בעל הנכס חתם על בלעדיות לאותו המתווך, אשר יצר קשר עם גלית והסביר לה כי הוא מבקש לקבוע עם שוכרים פוטנציאליים. המתווך סיפר לגלית שהוא פרסם את הנכס, ועבד שעות רבות על מנת להביא שוכרים לנכס.\nגלית המופתעת מבקשת להישאר בדירה, אך המתווך מבהיר לה כי במידה שהיא מעוניינת להישאר בדירה, המדובר בחוזה חדש, ולכן עליה לשלם לו דמי תיווך בסך דמי השכירות החודשיים, וזאת על מנת לפצות אותו על דמי התיווך שהוא היה מקבל לו היה מוצא שוכר חדש.\nבנסיבות המתוארות, האם המתווך רשאי לגבות דמי תיווך מגלית? מדוע?","o":["כן; למתווך יש בלעדיות, הוא ביצע פעולות שיווק והשקיע מאמצים בשיווק, ולכן חזקה שהוא צריך לקבל דמי תיווך בגין חידוש החוזה.","לא; למתווך אסור לגבות דמי תיווך בגין חידוש השכירות.","כן; המתווך פעל כדין, מכיוון שקיבל את רשותו של בעל הנכס לאתר שוכר חדש.","כן; אך המתווך רשאי לגבות מגלית דמי חידוש רק בסך מחצית מסכום השכירות החודשי."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2025-07#20","e":45,"n":20,"s":"לפי פסק הדין בעניין מדינת ישראל נגד אופז, האם מותר למתווך לערוך זיכרון דברים עבור צדדים לעיסקה שלגביה מחזיק המתווך הזמנת תיווך חתומה כדין? האם המתווך זכאי במקרה כזה לדמי תיווך?","o":["לא; מדובר באיסור פלילי והמתווך לא זכאי לדמי תיווך.","לא; מדובר בהפרת כללי אתיקה בלבד, אך המתווך זכאי לדמי תיווך אם היה בעל רישיון בתוקף והיווה גורם יעיל בעיסקה.","כן; מותר למתווך לכתוב זיכרון דברים לבקשת הלקוחות, והמסמך יועבר לעורך דין להמשך טיפול.","כן; מכיוון שזה תפקידו של המתווך להעלות על הכתב את הפרטים המהותיים שהוסכמו בין הצדדים לעיסקה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2025-07#21","e":45,"n":21,"s":"דן רוצה לשכור חנות ולכן התקשר למתווך וביקש שיאתר עבורו חנות מתאימה. עם סיום השיחה שלח המתווך לדן הודעת וואטסאפ, כדלקמן: \"בהמשך לשיחתנו, תשלום דמי תיווך למציאת חנות להשכרה יהיה בסך חודש אחד של דמי שכירות\". לאחר בדיקה של מספר חנויות שאת פרטיהן דן לא עידכן בהסכם הזמנת התיווך, המתווך מצא חנות שהתאימה לדן ודן אכן שכר את החנות.\nלפי פסק הדין בעניין ת\"א 6577/98 טרנס גלובל נגד נתנאל, האם זכאי המתווך לדמי תיווך מהשוכר בנסיבות אלה? מדוע?","o":["כן; לפי פסק הדין הודעת הוואטסאפ של דן המתווך מחליפה טופס הזמנת שירותי תיווך כנדרש עפ\"י החוק ודן היה הגורם היעיל בעיסקה.","לא; הודעת הוואטסאפ אינה כוללת את הפרטים הנדרשים בהזמנת תיווך, ולכן דן המתווך לא זכאי לדמי תיווך.","כן; משום שדן המתווך היה הגורם היעיל בעיסקה.","דן המתווך אינו זכאי לדמי תיווך, כי לא היה הגורם היעיל בעיסקה."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"b_fee"},{"id":"2025-07#22","e":45,"n":22,"s":"חווה ויוסי מבקשים למכור את דירתם. הם פנו לאביגיל המתווכת על מנת שאביגיל תשווק עבורם את הדירה. חווה ויוסי ביצעו בדיקות באופן עצמאי והגיעו למסקנה כי שווי דירתם הינו 2.5 מיליון ש\"ח. בהתאם לכך הינחו את אביגיל לפרסם את הדירה במחיר זה. בשיחתם עם אביגיל ציינו חווה ויוסי כי מצבם הכלכלי אינו טוב וכי הם מעוניינים למכור את הדירה כמה שיותר מהר. אביגיל פרסמה את הדירה בסכום של 2 מיליון ש\"ח, ובתוך שבוע יצר עימה קשר קונה וחתם עימה על טופס הזמנת שירותי תיווך. אביגיל המתינה כשבועיים ואז עדכנה את חווה ויוסי כי יש לה קונה שמוכן לשלם רק 2 מיליון ש\"ח. בלית ברירה הסכימו חווה ויוסי למחיר, אלא שבמועד החתימה על הסכם המכר התברר לחווה ויוסי כי הקונה כלל לא ידע שהם דרשו 2.5 מיליון ש\"ח.\nהאם נפל פגם בפעולותיה של אביגיל? מדוע?","o":["לא; אביגיל היוותה גורם יעיל בעיסקה והפעילה שיקול דעת לגבי מחיר הדירה.","לא; מכיוון שאביגיל מייצגת את שני הצדדים היא רשאית להציע לצדדים מחיר מתאים לנכס.","כן; אסור היה לאביגיל לפעול בניגוד להוראה שקיבלה מחווה ויוסי, והיה עליה לפעול בשקיפות לגבי המחיר שהיא מפרסמת עבורם.","כן; אסור היה לאביגיל לייצג את שני הצדדים."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2025-07#23","e":45,"n":23,"s":"משה טייל ברחוב וראה על אחד הבתים שלט \"דירה למכירה\" עם מספר הטלפון של המתווך חזי. משה התקשר לחזי, וחזי עדכן אותו שהדירה נמכרת במחיר מציאה של 1.2 מיליון ש״ח מכיוון שיש בדירה שוכר. משה התלהב, ניגש מיד למשרדו של חזי וחתם על טופס הזמנת שירותי תיווך. לאחר כשבוע נפגשו המוכר ומשה במשרדו של עו\"ד לחתימה על הסכם מכר. לתדהמת משה התברר לו, כי הדירה מושכרת כדין לדייר מוגן בשכירות מוגנת. משה ביטל מיד את הסכם התיווך, וסירב לחתום על הסכם המכר. חזי כעס ודרש ממשה את דמי התיווך, כפי שהתחייב בטופס הזמנת שירותי התיווך.\nהאם חזי פעל כדין? מדוע?","o":["כן; משה חתם על טופס הזמנת שירותי תיווך והתחייב לשלם לחזי דמי תיווך.","כן; חזי גילה למשה כי הדירה מושכרת, ובכך יצא ידי חובתו.","לא; חזי היה חייב למסור למשה כל מידע מהותי בקשר לדירה, והעובדה שהדירה מושכרת לדייר מוגן היא מידע מהותי, משום שדייר מוגן זוכה להגנות ששוכר רגיל אינו זכאי להן.","לא; לפי הדין בישראל כל דייר שמתגורר בדירה בשכירות נחשב כדייר מוגן בה ולכן לא מדובר במידע מהותי מבחינת הלקוח."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2025-07#24","e":45,"n":24,"s":"משה הוא מתווך מקרקעין. משה החתים את יעל, המעוניינת למכור את דירתה, על טופס הזמנת שירותי תיווך, אך שכח להביא עימו את טופס הבלעדיות הרגיל שלו, ולכן הוסיף בכתב יד כי יזכה לבלעדיות למשך שישה חודשים במכירת דירת המגורים של יעל. בסופו של דבר הדירה נמכרה על ידי מתווך אחר בתוך תקופת הבלעדיות.\nלפי פסק הדין בת״א 2461/07 בראון נ׳ סידרון, האם העובדה שהבלעדיות לא נחתמה במסמך נפרד, פוסלת את הבלעדיות של משה? מדוע?","o":["כן; הוראת החוק דורשת החתמה על בלעדיות במסמך נפרד מטופס הזמנת שירותי התיווך, ולא ניתן להתנות ולהסכים אחרת בין הצדדים.","כן; מכיוון שהדירה נמכרה על ידי מתווך אחר.","לא; ובלבד שיש הסכמה של הלקוחה לכך שהדבר לא ייעשה במסמך נפרד.","לא; מדובר בדרישה טכנית של החוק והלקוחה חתמה על בלעדיות כדין."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2025-07#25","e":45,"n":25,"s":"גבריאל רכש בית צמוד קרקע עם חלקה חקלאית צמודה, הרשום ברשות מקרקעי ישראל (מנהל מקרקעי ישראל) (להלן: \"רמ\"י\").\nבנסיבות אלה, מהם דמי הסכמה בהקשר זה, והאם גבריאל חייב בתשלום דמי הסכמה לרמ\"י?","o":["דמי הסכמה משולמים לרמ\"י על מנת לקבל את הסכמת רמ\"י לתוספות בנייה, ויש לשלמם במקרה של בקשה לתוספות בנייה בלבד.","דמי הסכמה הם תשלום לרמ\"י המשולם כתנאי להעברת זכויות חכירה. יש לשלמם במקרה שהחכירה על הנכס אינה מהוונת.","דמי הסכמה הם תשלום לרמ\"י שיש לשלם בכל מקרה של העברת זכויות ברמ\"י.","דמי הסכמה הם תשלום לרמ\"י עבור הסכמת רמ\"י לתוכנית בנייה בנכס ויש לשלמם עם אישור תוכנית בנייה על ידי רמ\"י בנכס בבעלות המדינה."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2025-11#1","e":46,"n":1,"s":"שמעון המתווך ראה מודעה באתר אינטרנט המשמש לפרסום מודעות נדל״ן, שבה פרסם איציק דירה למכירה בבני-ברק, במחיר של 1.9 מיליון ש\"ח. באותו היום שמעון יזם פגישה עם איציק - מוכר הדירה. למחרת הציג שמעון את הדירה ללקוח שלו. הלקוח התרשם מהנכס ובתוך שבועיים קנה את הדירה של איציק במחיר המבוקש. זאת לאחר השתדלות גדולה מצד שמעון המתווך. שמעון כעת מבקש מאיציק דמי תיווך בשיעור 2% משווי העיסקה, בטענה כי הוא טרח והוציא לפועל את העיסקה: הוא יצר קשר בין הצדדים כשהביא את הקונה לדירה, הוא הראה לקונה את הדירה, ואף שיכנע את הקונה לשלם את המחיר המבוקש. איציק מסרב לשלם דמי תיווך לשמעון המתווך, מכיוון שאיציק לא חתם על טופס הזמנה לקבלת שירותי תיווך, והוא זה שפירסם את הדירה למכירה.\nבנסיבות המתוארות, האם איציק צריך לשלם דמי תיווך לשמעון המתווך? מדוע?","o":["כן, מאחר ששמעון הוא בעל רישיון תיווך בתוקף והוא היה הגורם היעיל בעיסקה, חייב איציק לשלם לו דמי תיווך.","כן; איציק חייב לשלם לשמעון דמי תיווך, כי הוא סירב לחתום על הזמנת התיווך.","לא, מאחר שאיציק לא הסכים מראש לשלם לשמעון דמי תיווך ולא חתם על הסכם להזמנת שירותי תיווך.","לא, משום שהמתווך כבר מייצג לקוח מטעמו, אך ניתן לייצג את שני הצדדים לעיסקה בנסיבות אלה."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2025-11#2","e":46,"n":2,"s":"גיל פנה ליואב המתווך, וביקש מיואב שיאתר עבורו נכס חדש לקנייה מקבלן בלוד, עד לסכום של 1.5 מיליון ש\"ח. בהסכם המכר מול הקבלן היה תנאי לחוזה: \"ככל שלא יינתן היתר בנייה לפרויקט בתוך 12 חודשים ממועד חתימת הסכם המכר, יהיה רשאי הקונה לבטל את ההסכם בהודעה בכתב שישלח הקונה לקבלן 14 יום מראש.\" חלפו 12 חודשים, והיתר הבנייה לא ניתן. מכיוון שחלפו 12 חודשים מאז שנחתם הסכם המכר והיתר בנייה לא התקבל, בוטל הסכם המכר בהתאם לחוזה. בהסכם התיווך שנחתם אין התייחסות למצב זה.\nלפי פסק הדין ע״א 3455/06 דה כהן נ׳ זר גוטמן, האם זכאי המתווך לדמי תיווך? מדוע?","o":["כן; הואיל והעיסקה עם המתווך הושלמה והמתווך היה הגורם היעיל בעיסקה, המתווך זכאי לדמי תיווך.","לא; משום שהתנאי שבהסכם הרכישה לא התקיים.","כן; מאחר שההסכם להזמנת שירותי התיווך לא בוטל על ידי הלקוח.","לא; לפי פסק הדין, לקוח של מתווך רשאי בכל שלב של עיסקת מקרקעין לבטל את העיסקה ולקבל בחזרה את דמי התיווך."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2025-11#3","e":46,"n":3,"s":"מתן ביקש למכור את דירתו בסכום של 1.3 מיליון ש\"ח. מתן פנה לאיגור המתווך וביקש ממנו שיפעל עבורו בעניין. איגור החתים את מתן על טופס להזמנת שירותי תיווך. לאחר החתימה פירסם איגור את הדירה של מתן בפורום שבו חברים עשרות מתווכים וגם תלה שלט מחוץ לנכס. לאחר כשבועיים יצרה עימו קשר אולגה, ביקשה לראות את הנכס וחתמה לאיגור על טופס הזמנת שירותי תיווך. לאחר שאולגה ראתה כי הדירה מוזנחת ודרוש בה שיפוץ מסיבי, היא ביקשה מאיגור שיאפשר לה לדבר עם המוכר ולנסות להגיע עימו להסכמות. איגור סירב לקיום קשר ישיר בין אולגה לבין מתן, בטענה שהוא הגורם המקצועי שיכול להביא את הצדדים להבנות, ובטענה שהוא חושש שהעיסקה לא תצא אל הפועל, אם מתן ואולגה יקיימו מו״מ ישיר ביניהם שלא דרכו.\nהאם איגור רשאי לפעול כפי שפעל? מדוע?","o":["כן; מדובר בשיקול מקצועי של המתווך, ולכן איגור לא חייב לאפשר קשר ישיר בין הצדדים לעיסקה.","כן; לפי הדין, הקשר בין הצדדים מתנהל דרך המתווך ולא באופן ישיר.","לא; אסור לאיגור למנוע מאולגה לקיים קשר ישיר עם מתן או להקשות על כך, אלא אם מתן אינו מעוניין לקיים עם אולגה קשר ישיר.","לא; לפי הדין, איגור מחויב להפגיש את הצדדים לעיסקה גם אם שני הצדדים לה הם לקוחותיו, כך שיהיה קשר ישיר ביניהם."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2025-11#4","e":46,"n":4,"s":"שושנה היא מתווכת מקרקעין במקצועה. עקב עליית המחירים במשק, שושנה ואחותה החליטו למכור את הדירה בחדרה שירשו מאמם ז״ל בחלקים שווים. שושנה פירסמה מודעה למכירת הדירה. אבישי התקשר לשושנה בקשר למודעה. שושנה הבהירה לאבישי כי היא מתווכת במקרקעין, וכי אם אבישי מעוניין לרכוש את הדירה, הדבר כרוך בדמי תיווך בשיעור 2% משווי החלק של אחותה בדירה. אבישי התמקח והצליח להוריד את דמי התיווך ל- 1.5% משווי החלק של אחותה של שושנה בדירה, חתם על הסכם להזמנת שירותי התיווך ששלחה לו שושנה, ולאחר כשבועיים נחתם הסכם המכר בין כל הצדדים.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא נפל פגם בהתנהלות של שושנה; שושנה היא בעלת רישיון תיווך בתוקף, היא החתימה את אבישי על טופס הזמנת שירותי תיווך והיא היתה הגורם היעיל בעיסקה.","לא נפל פגם בהתנהלות של שושנה, מכיוון ששושנה גילתה לאבישי את הפרטים המהותיים המתחייבים: שהיא עצמה בעלים של חלק מהנכס ושאחותה היא בעלים של חלק מהנכס.","נפל פגם בהתנהלות של שושנה; אסור היה לשושנה לגבות דמי תיווך כלל בעיסקה זו, משום שקיימת לה זכות במקרקעין האלה.","נפל פגם בהתנהלות של שושנה, משום ששושנה לא החתימה את אבישי ואת אחותה על טופס הסכמה מרצון בעיסקה של קרוב משפחה מדרגה ראשונה על נכס זה."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2025-11#5","e":46,"n":5,"s":"אבנר פנה למתווכת נילי בבקשה שתאתר עבורו נכס \"בשווי של 5 מיליון ש\"ח בת\"א״. אבנר חתם מול נילי על טופס הזמנת שירותי תיווך, שלפיו, במידה שהיא תאתר עבורו דירה במחיר המבוקש, הוא מתחייב לשלם לה דמי תיווך בשווי 2% משווי העיסקה, בתוספת מע\"מ. לאחר כחודשיים, שבהם נילי פירסמה מודעות באתרים ומודעות פיזיות באזור המבוקש, איתרה נילי דירה מתאימה בגודל ובמיקום, והציגה אותה לאבנר. אבנר אמר לנילי שהוא ״רוצה לחשוב קצת״. בינתיים, פנה אבנר ישירות למוכרים ובמשך כחודש ימים התמקח איתם על המחיר, בניסיון להוריד את המחיר המבוקש. המוכרים מצידם המשיכו לחפש קונה רלוונטי. בסופו של דבר קיבלו המוכרים הצעת רכישה בסכום של 5.4 מיליון ש\"ח. או-אז, נבהל אבנר והסכים גם הוא לשלם סכום זה. אבנר כעת מסרב לשלם לנילי דמי תיווך, בטענה שהיא לא השיגה עבורו את המחיר שביקש.\nהאם אבנר צודק? מדוע?","o":["כן; העיסקה נסגרה בסכום גבוה מהמסוכם בין המתווכת לבין אבנר, ולכן אבנר לא חייב לשלם דמי תיווך.","לא; מכיוון שנילי הייתה הגורם היעיל בעיסקה ונחתם הסכם תיווך כדין.","כן; משום שנילי לא הייתה הגורם היעיל בעיסקה.","לא; מאחר שנילי איתרה עבורו את הנכס."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2025-11#6","e":46,"n":6,"s":"שלמה פנה אל דן, מתווך מקרקעין, וביקש מדן למצוא נכס באזור מגוריו עבור אחד מילדיו, כדי שבנו יגור קרוב אליו. הסכם להזמנת שירותי תיווך נחתם בין שלמה ודן בהתאם, ובו סוכם על עמלת תיווך בשיעור של 1%. בהמשך דן פנה לבן של שלמה, החתים אותו על טופס חדש להזמנת שירותי תיווך כדין, והביא לידי עיסקת רכישה של נכס מתאים, וזאת בתמורה לעמלה של 2% מבנו של שלמה. לאחר סיום העיסקה, דן דורש לקבל דמי תיווך משלמה וגם מבנו (הקונה בפועל).\nהאם דן פעל כדין? מדוע?","o":["כן; דן רשאי לגבות תשלום ללא מגבלה מכל מי שחתם מולו על טופס להזמנת שירותי תיווך כדין.","לא; דן לא פעל כדין, אלא אם גילה מראש ובכתב לשלמה ולבנו על כך שהוא מקבל תשלום מגורם נוסף בעיסקה זו.","כן; אין איסור על ייצוג קרובי משפחה בעיסקת מקרקעין.","כן; מאחר ששלמה אינו הקונה בפועל – אין כל מניעה לגבות ממנו תשלום נפרד ונוסף בעיסקה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2025-11#7","e":46,"n":7,"s":"ראובן ושמעון הם אחים ובעלים במשותף של דירת מגורים בתל אביב, בחלקים שווים. האחים לא חתמו ביניהם על הסכם שיתוף. ראובן זקוק לכסף, והציע לאחיו שמעון לרכוש את חלקו של ראובן בדירה בשווי שוק, אשר ייקבע ע\"י שמאי מקרקעין נייטרלי. שמעון סירב להצעתו של ראובן ואף הודיע לו כי הוא מתנגד למכירת חלקו של ראובן למישהו אחר, מאחר שהוא לא מוכן שמישהו אחר יהיה בעלים ביחד איתו בדירה.\nבנסיבות המתוארות, האם שמעון יכול למנוע מראובן את המכירה? מדוע?","o":["לא; כל שותף במקרקעין משותפים זכאי בכל עת לדרוש את פירוק השיתוף.","כן; שמעון רשאי לבחור את שותפו לדירה.","כן; דירה היא מקרקעין שלמים, ועל פי חוק אין תוקף לעיסקה בחלק מסוים במקרקעין. לכן ראובן אינו יכול למכור את חלקו בדירה למישהו אחר.","לא; משום שאין תוקף להסכם המגביל את זכותו של שותף במקרקעין לפרק את השיתוף בכל עת."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2025-11#8","e":46,"n":8,"s":"בבניין ישן ברחוב ארלוזורוב 12 בתל אביב החליטו בעלי דירות, שבבעלותם שני שלישים מהדירות בבניין, להתקין מעלית חדשה ברכוש המשותף, וזאת לאחר שקיימו אסיפה כללית של הדיירים וקיימו הצבעה בעניין. הדיירים אף פנו לעירייה וקיבלו היתר להתקנת המעלית בבניין. שמעון, שהתגורר בקומת הקרקע, הודיע כי הוא לא מתנגד להתקנת המעלית בבניין, אך מאחר שהוא גר בקומת הקרקע הוא לא ישתתף בהוצאות התקנת המעלית, אך הוא מסכים להשתתף בהוצאות החזקתה והפעלתה של המעלית.\nהאם עמדתו של שמעון מוצדקת? מדוע?","o":["לא; בעל דירה חייב להשתתף בהוצאות הדרושות להחזקתו התקינה ולניהולו של הרכוש המשותף, כך גם לגבי המעלית, לכן שמעון חייב להשתתף גם בעלות התקנת המעלית.","לא; מאחר ששמעון לא התנגד להקמת המעלית, הוא חייב לשאת בחלק מהעלות של הקמת המעלית.","כן; בעלי הדירות בקומת הקרקע לא חייבים לשאת בהוצאות התקנת המעלית, אפילו אם הם נמנים עם המחליטים להתקינה.","כן; כדי לחייב את שמעון להשתתף בעלות התקנת המעלית דרוש רוב של 80% מהדיירים."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2025-11#9","e":46,"n":9,"s":"במכירת זכות במקרקעין של בית פרטי בעל שלוש קומות של רוכש הנמנה על קבוצת רכישה, כשחלק מהזכות מיועד לשמש למגורים וחלק מהזכות מיועד למסחר בעתיד, האם הגדרת ׳דירה יחידה׳ תחול על מלוא הנכס, או רק על חלקו?","o":["הפטור חל על מלוא הנכס, שכן מדובר בדירה יחידה.","על הנכס כלל לא חלה הגדרה של ׳דירה יחידה׳, שכן מדובר בבית פרטי ולא בדירה.","תיתכן זכאות לפטור רק לגבי בית המגורים ולא לגבי זכויות הבנייה הנוספות.","אין כלל זכאות לפטור ׳דירה יחידה׳ על הזכויות במקרה זה, הואיל ולמוכר ישנן זכויות בנייה נוספות."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2025-11#10","e":46,"n":10,"s":"חווה וירון החליטו להתגרש. על מנת למנוע ויכוחים בנוגע לדירה שבבעלותם המשותפת, הם החליטו במהלך משפט הגירושין להעביר את הדירה לבנם יוסי, על אף שליוסי כבר היתה דירה קטנה שהוא רכש בעצמו. להסכמות בין הצדדים ניתן תוקף של פסק דין.\nבנסיבות המתוארות, האם העברת הנכס מחווה וירון ליוסי חייבת במס? מדוע?","o":["כן; אמנם העברה מהורה לילד, ללא תמורה, פטורה ממס שבח, אולם היא אינה פטורה ממס רכישה מצידו של יוסי.","כן; הואיל וליוסי יש כבר דירה, ההעברה ליוסי חייבת גם במס שבח מצידם של חווה וירון וגם במס רכישה מצידו של יוסי.","לא; העברת זכות במקרקעין אגב גירושין אינה מוגדרת כמכירה, ולכן אינה חייבת במס.","לא; כל העברה של נכס מהורים לילדם פטורה ממס, גם ממס שבח וגם ממס רכישה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2025-11#11","e":46,"n":11,"s":"רותי רכשה ממירי דירה שנקנתה על ידי מירי בשנת 2010. סוכם בין השתיים כי במועד החתימה על הסכם המכר, תשלם רותי למירי מחצית מהתמורה, ואת המחצית השנייה היא תשלם כנגד מסירת החזקה. השתיים חתמו על הסכם המכר ודיווחו על העיסקה לרשויות מיסוי מקרקעין. מירי לא זכאית לפטור ממס שבח.\nבנסיבות המתוארות, האם רותי חייבת בתשלום מקדמת מס שבח? מדוע?","o":["כן; רותי חייבת בתשלום מקדמה על חשבון מס השבח בשיעור של 7.5% מהתמורה.","כן; תמיד קיימת חובה על הרוכשים לשלם מקדמה על חשבון מס שבח, והיא חלה מרגע החתימה על חוזה הרכישה.","לא; אין חובה לשלם מקדמה למס שבח, אלא אם הרוכש מעוניין בכך.","לא; הרוכש לא צריך לשלם מס שבח, אלא המוכר הוא שמשלם את מס השבח במלואו."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2025-11#12","e":46,"n":12,"s":"עד מתי מציע בחוזה מקרקעין יכול לחזור בו מהצעה מפורטת בכתב שנתן לרכישת נכס?","o":["מציע בחוזה רשאי לחזור בו מהצעתו בכל זמן סביר.","מציע בחוזה רשאי לחזור בו מהצעתו עד שהצד השני מקבל את מסמך טיוטת החוזה.","מציע בחוזה רשאי לחזור בו מהצעתו עד לחתימה על זיכרון דברים בין הצדדים.","מציע בחוזה רשאי לחזור בו מהצעתו אם עשה כן לפני שהצד השני נתן הודעה על קיבול."],"c":[3],"a":false,"note":"","sub":"c_form"},{"id":"2025-11#13","e":46,"n":13,"s":"לנכסיו של אהרון מונה כונס נכסים. בין הנכסים של אהרון היה בית פרטי בדרום תל אביב. כונס הנכסים מבקש מאהרון הבעלים, שימסור לו פרטים על הנכס: האם נבנו תוספות בנייה לא חוקיות? האם שולמו דמי היוון? האם קיימת רטיבות בנכס אשר תוקנה לאחרונה? אהרון לא מעוניין להעביר את המידע לכונס.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ברגע שנכס עובר לכונס נכסים, לכונס יש ייפוי כוח לכל פעולה בנכס, ולאהרון אין כל זכות או חובה בקשר לנכס ולכן הוא לא מחויב למסור לכונס מידע או מסמכים.","בעל הנכס מחויב למסור לכונס נכסים כל מסמך וידיעה שיש לו על הנכס.","בעל הנכס מחויב למסור לכונס רק את המידע והמסמכים שהכונס לא יכול להשיג ברשויות, כמו המידע לגבי רטיבות בבית.","ברגע שנכס עובר לכונס נכסים, לכונס הנכסים יש סמכות לכל פעולה בנכס, אך אסור לכונס לפנות אל החייב על מנת לקבל ממנו מידע או מסמכים."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2025-11#14","e":46,"n":14,"s":"מה זאת ׳פרטת עיזבון׳?","o":["פירוט הנכסים אשר נותרו בעיזבון לאחר תשלום החובות של הנפטר - המסמך מוגש על ידי היורשים או מנהל העיזבון לאפוטרופוס הכללי.","פירוט החוב שנותר בעיזבון לאחר שימוש בכל נכסי העיזבון - המסמך מוגש על ידי היורשים או מנהל העיזבון לאפוטרופוס הכללי.","פירוט בתצהיר מאומת כדין של נכסי העיזבון וחובותיו - המוגש לאפוטרופוס הכללי.","מסמך משפטי שעורך אדם בחייו ומהווה נספח לצוואה, ובו הוראות מפורטות המיועדות למנהל העיזבון ומבהירות כיצד לנהוג בעיזבון, עד הגיע היורשים לגיל 18."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2025-11#15","e":46,"n":15,"s":"מהו ׳חוזה פיתוח׳?","o":["הסכם בין רשות מקרקעי ישראל (מינהל מקרקעי ישראל) למועצה מקומית, לפיו מתחייבת המועצה המקומית לפתח אזור מסוים, ותמורתו היא מקבלת את אותו אזור לבעלותה ורשאית לבנות שם גם בתי מגורים.","הסכם שיתוף בין בעלי דירות בבית משותף, לפיו יבנו תוספות בנייה ברכוש המשותף.","הסכם בין רשות מקרקעי ישראל (מינהל מקרקעי ישראל) לרוכש זכויות במקרקעין של המדינה, המייעד קרקע לבנייה ולפיו מתחייב הרוכש לבנות מבנה על הקרקע בתוך פרק זמן מסוים ובתנאים שהרשות אישרה.","הסכם בין מועצה מקומית לבין רוכש זכויות בקרקע, לפיו היזם רוכש את הזכויות, אך מתחייב לפתח את האזור ולבנות שם תשתיות, בתי ספר ושכונות מגורים."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2025-11#16","e":46,"n":16,"s":"חואן רוכש דירה ממרסלו - שניהם ישראלים ממוצא ארגנטינאי. מאחר ששניהם מקבלים משכורות מארגנטינה, חואן ומרסלו מעוניינים להצמיד את העיסקה לפסו הארגנטינאי.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור להצמיד עיסקה בישראל למטבע חוץ.","ניתן להצמיד עיסקה בישראל לדולר או ליורו בלבד.","ניתן להצמיד עיסקה בישראל לכל מטבע חוץ שהצדדים לעיסקה מבקשים לעשות כן לגביו.","ניתן להצמיד עיסקה בישראל לכל מטבע חוץ אשר נמצא ברשימת נגיד בנק ישראל לעניין עיסקאות מכר בישראל."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2025-11#17","e":46,"n":17,"s":"יניב המתווך שמע שרינה מוכרת את הבית שלה, ומעוניינת לרכוש בית אחר ולערוך בו שיפוץ יסודי. יניב ניגש לרינה והציע לה שירותי תיווך ללא תשלום בעבור המכירה, אך דרש ממנה להתחייב שאת השיפוץ בדירה תבצע באמצעות אשתו הקבלנית.\nבנסיבות המתוארות, האם יניב פעל כדין? מדוע?","o":["כן; יניב הציע לרינה שירות בעיסקת חבילה, דבר אשר נפוץ ומקובל בקרב המתווכים, ואין בו כל פסול בהתאם לתקנות ולחוק.","לא; מדובר בהתניה אסורה של שירות בשירות.","כן; כל עוד יניב לא גובה תשלום על מכירת הנכס, מותר לו לקבוע תנאים לקבלת עמלת תיווך בגין המכירה.","לא, מתווך אינו רשאי לגבות תשלום אם הוא מוותר מראש על חלק מהשירותים."],"c":[1],"a":false,"note":"","sub":"b_duties"},{"id":"2025-11#18","e":46,"n":18,"s":"יוכבד, בעלת דירה פרטית באזור מבוקש, מעוניינת למכור את הדירה שלה. כדי לעשות כן, יוכבד יצרה קשר עם חברת תיווך בע״מ מובילה באזור מגוריה, וחתמה מול החברה על טופס להזמנת שירותי תיווך. בהזמנת התיווך הופיעו פרטי הנכס, פרטי המוכרת, המחיר המבוקש ומספר החברה. בגלל כמות המתעניינים בדירה של יוכבד, היה צריך לשלוח מספר אנשי צוות מהחברה, חלקם מתווכים מוסמכים וחלקם עובדים בחברה עד שייגשו לבחינת רשם המתווכים. ביניהם בלט אחד, משה, שטרם ניגש לבחינה, אך היה איש מכירות נמרץ, הראה את הנכס לקונה שמצא, ענה על כל השאלות לגבי הנכס - קטנות כגדולות, והיה הגורם היעיל לחוזה מכירה שלבסוף נחתם במחיר המבוקש. כאשר הגיע החשבון לתשלום דמי התיווך, יוכבד הודיעה לחברה כי היא לא מתכוונת לשלם דמי תיווך בגין העיסקה, מכיוון שהעיסקה בוצעה על ידי חברה בע״מ.\nלפי פסק הדין ע״א 3455/06 דה כהן נגד עמרם, האם יוכבד חייבת לשלם דמי תיווך בנסיבות אלה? מדוע?","o":["כן; חברה בערבון מוגבל יכולה להיות צד להסכם להזמנת שירותי תיווך, ללא כל מגבלה.","כן; מכיוון שמשה היה הגורם היעיל ונחתמה הזמנת תיווך כדין.","לא; חברה בערבון מוגבל אינה רשאית לעסוק בתיווך כלל, אלא אך ורק מתווך בעל רישיון מוסמך.","לא; שירותי תיווך יכולים להינתן באמצעות תאגיד, אך פעולות התיווך המהותיות עצמן חייבות להיעשות בידי מתווך שמחזיק ברישיון תיווך בתוקף בזמן הפעולות."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2025-11#19","e":46,"n":19,"s":"האם מוטל מס ערך מוסף על עיסקה במקרקעין?","o":["לא, בכל מקרה לא מוטל מע\"מ על עיסקה במקרקעין.","כן, תמיד מוטל מע\"מ בעיסקה במקרקעין, אך הוא לא ניתן לקיזוז.","לא, תמיד מוטל מע\"מ על עיסקה במקרקעין, למעט בעיסקה של דירת מגורים.","כן, מוטל מע\"מ על עיסקה במקרקעין כאשר צד אחד לעיסקה הוא עוסק והעיסקה היא במהלך עיסוקו."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2025-11#20","e":46,"n":20,"s":"מהו הסכם לפי ׳תמ״א 38׳?","o":["הסכם שבמסגרתו יזם מקבל שטח מרשות מקרקעי ישראל (מינהל מקרקעי ישראל) ובונה בשטח האמור בית מחוזק מפני רעידות אדמה.","הסכם לבנייה של עד 38 דירות חדשות על גבי בניין שנבנה לפני שנת 1980.","הסכם לחיזוק דירות מפני רעידות אדמה, בדרך של חיזוק המבנה או הריסתו ובנייתו מחדש.","הסכם שיפוץ בניין שמאפשר רק בניית ממ״דים בדירות מגורים קיימות לפי תוכנית מיתאר ארצית העוסקת בנושא."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2025-11#21","e":46,"n":21,"s":"דן המתווך מחזיק בהזמנת תיווך ובהסכם בלעדיות כדין למכירת הבית של יהודה. דן העביר ליהודה שאלון פרטים על הנכס. יהודה מסרב לחתום או לענות על השאלון.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על מתווך חלה החובה למסור למוכר את השאלון על הנכס, וחל עליו איסור לעסוק בתיווך של מכירת הנכס כאשר המוכר מסרב לענות על השאלון. סירוב כזה מצביע על הסתרת מידע, ולכן העיסוק בתיווך במקרה זה ייחשב כחוסר תום לב.","לא חלה חובה על מתווך להגיש שאלון על הנכס, זו אמנם יוזמה ברוכה בתחום התיווך, אך זו לא חובה.","כאשר מוכר מסרב למלא את השאלון, על המתווך להשלים את התשובות בעצמו לפי מיטב שיקול דעתו והיכרותו עם הנכס, ורק אם אינו מצליח בכך – עליו לוותר על העיסקה.","על מתווך חלה החובה למסור למוכר את השאלון על הנכס. אם המוכר מסרב למלאו, לאחר שהמתווך עשה מאמץ סביר לקבל את התשובות לשאלון מהמוכר, הוא יכול להמשיך לעסוק בתיווך הנכס, אך חייב לציין את הסירוב בפני הרוכש."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-11#22","e":46,"n":22,"s":"בשכונת התקווה עמד בניין ובו 8 דירות. הבניין היה רעוע והתמוטט. לבניין אין ביטוח. 6 מתוך בעלי הדירות (שהם 3/4 מתוך בעלי הדירות) החליטו להקים את הבניין מחדש, אך נתקלו בשתי בעיות: א. שני בעלי דירות מסרבים להשתתף בהוצאות. ב. הדיירים כולם לא יודעים כיצד לחלק את ההוצאות ביניהם.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כל בעל דירה ישא בהוצאות הבנייה מחדש בהתאם לחלקו היחסי ברכוש המשותף; במקרה של סירוב - המפקח רשאי לצוות על מי שמסרב מבין בעלי הדירות להעביר את זכויותיהם בדירות לצד שלישי שייבחר על ידם ויישא בחובות הבנייה במקומם.","כל בעל דירה יישא בהוצאות הבנייה מחדש בהתאם לחלקו היחסי ברכוש המשותף; במקרה של סירוב - המפקח רשאי לצוות על מכירת כל הקרקע ליזם ולחלוקת התמורה בין הדיירים.","כל בעלי הדירות יחלקו שווה בשווה בהוצאות הבנייה; ובמקרה של סירוב - המפקח רשאי לצוות על הסרבנים להעביר את זכויותיהם בדירות לצד שלישי שייבחר על ידם ויישא בחובות הבנייה במקומם.","אי אפשר להכריח את בעלי הדירות הסרבנים להשתתף בהוצאות. לצערם של בעלי הדירות האחרים, הם לא יוכלו לבנות את הבניין עד שיצליחו לשכנע את בעלי הדירות הסרבנים לעשות כן."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2025-11#23","e":46,"n":23,"s":"עידן, מתווך נדל\"ן, מחזיק רשימת מתעניינים שנאספה לאורך השנים מאנשים שהתעניינו בעבר בנכסים שפירסם. חברו דניאל, גם הוא מתווך, קיבל לאחרונה בלעדיות על בית חדש למכירה. עידן מעוניין להעביר לדניאל את מספרי הטלפון של המתעניינים מרשימתו, במטרה שיפנה אליהם ויציע להם את הנכס.\nהאם מותר לעידן להעביר את פרטי לקוחותיו לדניאל? מדוע?","o":["כן; אין כל פסול בשיתוף פעולה בין מתווכים, ואפשר להעביר פרטי מתעניינים ללא צורך באישורם של המתעניינים.","כן; כל עוד המתעניינים לא ביקשו להסיר את פרטיהם מהרשימה, מותר לעשות בהם שימוש גם בהקשר לנכסים של מתווך אחר.","לא; עידן אינו רשאי להעביר פרטים של לקוחות שלו למתווכים אחרים לצורך שיווק נכסים.","כן; ניתן להעביר פרטים כאמור, אך בתנאי שעידן קיבל את אישור המתעניינים להעברת פרטיהם."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-11#24","e":46,"n":24,"s":"רועי, בעל סוכנות פרסום, מעוניין למצוא נכס בשכירות בדמי מפתח במיקום מרכזי לצורך פרסומות וראווה. הוא מבקש לשכור את הנכס בדמי מפתח, שכן הוא אינו בטוח כמה פרסומות יצליח למכור.\nהאם הדין מתיר מטרה זאת לצורך שכירות בדמי מפתח בנסיבות אלה?","o":["לא; מכיוון שועדות מקומיות אינן מוסמכות לאשר שכירות בדמי מפתח של נכסים המשמשים לצורך פרסומת או ראווה.","לא; אין אפשרות כיום לשכור נכסים בדמי מפתח בישראל.","כן; ניתן לשכור בדמי מפתח נכס לצורך פרסומת או ראווה, ללא כל הגבלה.","כן; אך שימוש לפרסומת וראווה חייב להיעשות במסגרת השימוש בנכס, ולא כשימוש יחיד בנכס."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2025-11#25","e":46,"n":25,"s":"בתכנון ובנייה, איזה מבין הבניינים הבאים מוגדר כ׳בניין חורג׳?","o":["בניין שנבנה באופן בלתי חוקי – כלומר ללא רישיון מלכתחילה.","בית משותף שיותר ממחצית הדירות בו בנויות בניגוד להיתר המקורי של הדירות והיתר זה טרם הוסדר.","בניין שמתקיימת בו כל חריגת בנייה שהיא, שלא הוסדרה כדין.","בניין שנמצא בשטח או באזור מיוחד, ולכן לא מתקיימת בו הוראה של תוכנית לפי חוק התכנון והבנייה."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"p_permit"},{"id":"2026-05#1","e":47,"n":1,"s":"ראובן רצה לקנות דירת 3 חדרים בראשון לציון, במחיר של 1.5 מיליון שקל. לצורך כך, פנה ראובן לשמעון, שהוא מתווך במקרקעין, וחתם לשמעון על הזמנת תיווך בכתב כדין. שמעון הביא את ראובן לסיור בדירה ברחוב ביאליק, שעבורה המוכרים דרשו 1.9 מיליון ש״ח. ראובן ביקש כי שמעון ינהל בשמו מו״מ ויוריד את המחיר מ-1.9 מיליון, לסכום שראובן יוכל לעמוד בו.\nשמעון אמר לראובן: ״חבל על הזמן, המוכרים האלה הם בונקר, אין טעם אפילו לפנות במטרה להוריד את המחיר, כי הם לא יורידו את המחיר לעולם״, והמשיך להראות לראובן דירות נוספות. שמעון לא דיבר יותר עם ראובן על הדירה ברחוב ביאליק.\nלאחר שחלפו חודשיים מחתימת ההסכם בין ראובן לשמעון, ראובן שכר את שירותיה של גילה המתווכת, שהראתה לו את אותה דירה ברחוב ביאליק וחתם מולה על הסכם להזמנת שירותי תיווך כדין. גילה ניהלה משא ומתן והצליחה, במאמץ רב, להוריד את המחיר ל- 1.65 מיליון שקל, וראובן חתם על הסכם רכישה של הדירה.\nבנסיבות המתוארות לעיל ולפי פסק הדין תא\"מ 10272-02-11 ב.פ. הנשיא סוכנויות נדל״ן בע״מ נ׳ בקרמן, האם קיימת חובה לשלם לשמעון דמי תיווך? מדוע?","o":["לא; מאחר ששמעון לא היה הגורם היעיל שהביא להתקשרות הצדדים בהסכם מחייב, שכן אחרי שהראה את הנכס לא עשה מאומה כדי שהעיסקה תצא אל הפועל.","כן; החלפת המתווך במקרה כזה היא פעולה בחוסר תום לב, מאחר ששמעון הכיר לראובן את הנכס ובלעדיו לא תיתכן עיסקה.","לא; בשום מקרה לא משלמים כפל דמי תיווך ליותר ממתווך אחד.","כן; ראובן יצטרך לשלם דמי תיווך לשני המתווכים, מכיוון ששניהם היוו גורם יעיל בעיסקה ובלעדיהם לא הייתה עיסקה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2026-05#2","e":47,"n":2,"s":"יוסף נפטר, והוריש בצוואתו שתי דירות מגורים שהיו בבעלותו לשני אחייניו, בחלקים שווים ביניהם (כל אחד מהאחיינים קיבל 1/2 מכל דירה). דירה אחת היא נכס יקר באופן משמעותי מהשנייה - דירה יוקרתית ליד כיכר המדינה בתל אביב, ודירה שנייה היא דירת 3 חדרים בירושלים. לאור האמור, שני האחיינים החליטו לחלק ביניהם, בהסכם בין יורשים שנערך אצל עורך דין, את הירושה באופן שונה מהחלוקה שצוינה בצוואה, כך שבבעלות כל אחד מהם תהיה דירה שלמה, ולא 1/2 מכל דירה. האחיין שיקבל את הנכס היקר יותר ישלם לאחיין השני כסף. התמורה שולמה מפדיון קופת גמל, האחיין שקנה את חלקו של האחיין השני וזאת לאחר שניתן צו ירושה.\nבנסיבות המתוארות, האם האחיינים יחויבו בתשלום מיסים (מס רכישה ומס שבח לפי העניין)?","o":["האחיינים יהיו חייבים במס שבח בלבד, אך בשיעור מופחת של שליש, מאחר שמדובר בעיסקה בין קרובי משפחה.","האחיינים לא יהיו חייבים בתשלום מיסי מקרקעין כל אחד לפי חלקו, משום שירושה בישראל תמיד פטורה ממס.","עשויה להיות חבות במיסוי מקרקעין במקרה זה, משום שניתנה למי מהיורשים תמורה בכסף או בשווה כסף, שלא מנכסי הירושה.","האחיינים יהיו חייבים בתשלום מיסי מקרקעין כל אחד לפי חלקו כבר בעת קבלת הירושה, וזאת מכיוון שלא מדובר בירושה של קרוב משפחה מדרגה ראשונה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2026-05#3","e":47,"n":3,"s":"במשך 24 החודשים האחרונים אלכס הוא הבעלים של מגרש בתל מונד בשטח של 300 מ\"ר. חוץ ממגרש זה אין בבעלותו של אלכס נכס מקרקעין אחר.\nבנסיבות המתוארות, האם אלכס זכאי לפטור ממס שבח כאשר ימכור את המגרש? מדוע?","o":["כן; אך רק אם לא מכר נכס מקרקעין אחר במהלך 24 החודשים הקודמים.","לא; פטור ממס שבח לא חל על מכירת זכויות במקרקעין שהם לא דירת מגורים מזכה.","לא; מאחר שהוא לא הבעלים של המגרש יותר מ- 4 שנים.","כן; אלכס לא חייב במס שבח, מכיוון שבכל מקרה אין מס שבח על מכירת מגרשים, אלא רק על דירות מגורים."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2026-05#4","e":47,"n":4,"s":"בניין מסוים בקרית חיים לא רשום כבית משותף. בבניין מערכת מרכזית לחימום מים. יואב, שגר בקומה הראשונה, החליט להתנתק מהמערכת המרכזית לחימום מים. הוא פנה ליתר הדיירים והודיע להם על כוונתו להתנתק מהמערכת. יואב אף התחייב בפני שאר הדיירים בבניין, כי התנתקותו מהמערכת המרכזית לחימום מים לא תפגע ברכוש המשותף, או בכל דירה אחרת בבניין. יתר בעלי הדירות בבניין התנגדו, בטענה כי מדובר במערכת מרכזית וכי לא ניתן להתנתק ממנה.\nבנסיבות העניין, האם יואב רשאי להתנתק מהמערכת המרכזית לחימום מים? מדוע?","o":["כן; בעל דירה רשאי להתנתק על חשבונו מהמערכת המרכזית לחימום מים, ללא הסכמת בעלי הדירות האחרים.","לא; מי שמחובר למערכת מרכזית לחימום מים לא יכול להתנתק ממנה מבלי לקבל את הסכמת כל בעלי הדירות לכך.","לא; מכיוון שמערכת המים מהווה רכוש משותף של כל בעלי הדירות והתנתקות מהמערכת תגדיל את ההוצאות של כל יתר בעלי הדירות.","כן; משום שהבניין לא רשום כבית משותף."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"h_common"},{"id":"2026-05#5","e":47,"n":5,"s":"שלום, דייר מוגן השוכר בדמי מפתח נכס כדין, השקיע בשנת 2025 20,000 ש\"ח בשיפוץ יסודי של הנכס. כעת רוצה שלום למכור את זכות הדיירות המוגנת שלו, אך להפחית מחלקו של בעל הבית את עלות השיפוץ. שלום בדק בהסכם דמי המפתח שלו ולא מצא כל התייחסות לנושא הקיזוז.\nבנסיבות אלה, האם שלום, הדייר המוגן, יכול לקזז את הסכום שהשקיע בשיפוץ מהתשלום שהוא מעביר לבעל הבית במסגרת החלפת דיירים בדמי מפתח?","o":["לא; משום שדמי מפתח הם סכום קבוע, והם לא ניתנים לניכוי או שינוי.","לא; משום שאין לדייר זכות כלשהי בשיפוץ שהוא עורך בדירה בדמי מפתח.","כן; אך רק בתנאי שבעל הנכס מסכים לכך במפורש.","כן; מאחר שאין התייחסות לכך בהסכם דמי המפתח."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2026-05#6","e":47,"n":6,"s":"חברת ההייטק הישראלית \"אין-וידאו\" בע\"מ החליטה להקים מרכז פיתוח גדול בנוף הגליל, ולשם כך היא מבקשת מרשות מקרקעי ישראל (מינהל מקרקעי ישראל) למכור לה את הזכויות על 30 דונם של מקרקעי ישראל שבבעלות המדינה.\nבנסיבות המתוארות, האם ניתן לבצע עסקת מקרקעין מול הרשות בנסיבות אלה? מדוע?","o":["לא ניתן לבצע עסקה במקרה זה, משום שרשות מקרקעי ישראל לא יכולה לבצע עסקאות מול חברות מסחריות.","ניתן לבצע עסקה מול רשות מקרקעי ישראל, וזאת על ידי חתימה על חוזה חכירה ארוך טווח.","לא ניתן לבצע עסקה מול רשות מקרקעי ישראל במקרה זה, משום שמדובר בחברת הייטק, ולא באגודה או עמותה שמטרתם חקלאות.","במקרה זה, ניתן אך ורק לבצע הסכם חכירה משולש: בין היישוב, המועצה והתאגיד."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2026-05#7","e":47,"n":7,"s":"יעקב הזמין ריהוט מחברת הרהיטים ״לאה\" בע״מ מתוך קטלוג של החברה.\nבטופס הזמנת הריהוט לא צוינה איכות הריהוט שצריך להגיע.\nכשהגיע הריהוט, הופתע יעקב לגלות כי הריהוט שהגיע היה ברמה בינונית ולא יותר.\nיעקב טוען כי שילם מחיר גבוה, וכי הוא ציפה לקבל ריהוט ברמה גבוהה מאד.\nבנסיבות המתוארות, האם יעקב יוכל לחייב את חברת הרהיטים להחליף את הריהוט לריהוט ברמה גבוהה?","o":["כן; בהיעדר הסכמה אחרת היה על לאה בע״מ לספק ליעקב ריהוט ברמה גבוהה.","לא; בחוק אין כל התייחסות לנושא זה ולכן יעקב היה חייב לציין את איכות הריהוט על גבי טופס ההזמנה.","לא; בהיעדר הסכמה אחרת, על לאה בע״מ למסור ליעקב ריהוט ברמה בינונית.","כן; אך רק בתנאי שיעקב לא עשה שימוש בריהוט."],"c":[2],"a":false,"note":"","sub":"k_consumer"},{"id":"2026-05#8","e":47,"n":8,"s":"אביתר גר בבניין ישן ובו 16 דירות. הוא מעוניין להרחיב את דירתו ולהוסיף לה מרחב מוגן דירתי (ממ\"ד). התברר כי אחד הדיירים, המקורב ליזם נדל\"ן, שיכנע 30 אחוז מהדיירים להתנגד לבקשתו, כדי שהיזם המקורב אליו יקים בבניין פרוייקט תמ\"א 38. יתר הדיירים הודיעו לאביתר כי הם מסכימים לבקשתו.\nבנסיבות המתוארות, האם אביתר יוכל לקבל היתר בנייה להקמת הממ\"ד? מדוע?","o":["לא, מכיוון שיש צורך בהסכמת רוב של מי שבבעלותם שלושה רבעים מהדירות.","כן, אין צורך בהסכמת דיירים בבית משותף אם מבוקשת תוספת של בניית ממ״ד.","לא, מכיוון שעל אביתר לקבל הסכמה של 100% מהדיירים לצורך בנייה של תוספת ממ״ד.","כן, מכיוון שלהקמת ממ\"ד יש צורך בקבלת הסכמה של מי שבבעלותם שישים אחוזים מהדירות."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2026-05#9","e":47,"n":9,"s":"לתומר, מתווך במקרקעין, יש לקוח שמבקש לרכוש דירה. הלקוח חתם על הזמנה לקבלת שירותי תיווך כדין. תומר הציג בפני הלקוח שלו דירה, ושבוע לאחר מכן רכש הלקוח את הדירה. חודש אחרי החתימה התברר שתומר ידע שבדירה נמצא שוכר סרבן שלא משלם דמי שכירות ולא מפנה את הדירה מזה כחצי שנה.\nבנסיבות העניין, האם תומר היה צריך לגלות ללקוח שלו על הימצאות השוכר הסרבן בדירה? מדוע?","o":["תומר פטור מכל אחריות שהיא לגבי המחזיקים בנכס, שכן הימצאותו של דייר בדירה ותאריך הפינוי של הנכס נקבעים במסגרת חוזה הרכישה על ידי עורכי דין בלבד. זוהי אחריות בלעדית של עורכי הדין בעסקה.","תומר פטור מכל אחריות שהיא לגבי הרוכש משום שהרוכש היה חייב לברר מי נמצא בדירה לפני שחתם על החוזה ולכן הלקוח לא פעל בתום לב במהלך הרכישה.","תומר חייב לגלות ללקוחו כל פרט לגבי הדייר בדירה, שכן הרוכש פעל בתמורה ובתום לב ברכישת הנכס.","על תומר מוטלת חובה לגלות ללקוח שבנכס ישנו מחזיק שהוא לא הבעלים, ושהוא מסרב לסכם על תאריך יציאה מהנכס."],"c":[3],"a":false,"note":"","sub":"r_rent"},{"id":"2026-05#10","e":47,"n":10,"s":"יותם החתים את שולמית על הסכם להזמנת שירותי תיווך, מול חברת \"אלופי הנדל\"ן של נתניה\" בע\"מ, שבעל המניות היחיד שלה הוא מתווך בעל רישיון כחוק. פרטיו של יותם לא הופיעו על הטופס, ויותם הוא לא מתווך מורשה. יותם הציג בפני שולמית דירה ששולמית לא הכירה, סייע לשולמית מול בעל הנכס בהגעה לעמק השווה לגבי המחיר, ושולמית רכשה את הנכס.\nלאחר ששולמית רכשה את הדירה פנה אליה נציג מטעם החברה וביקש ממנה לשלם את דמי התיווך המוסכמים בסך 2% בתוספת מע\"מ, אך שולמית סירבה לשלם את דמי התיווך.\nבנסיבות המתוארות לעיל ולפי פסק הדין ע\"א 3455/06 דה כהן בע\"מ נ' אלון עמרם, האם שולמית חייבת לשלם דמי תיווך לחברה בגין העסקה? ואם כן - למי?","o":["חברה בע״מ יכולה לתת שירותי תיווך, ולכן ברגע ששולמית חתמה על הסכם הזמנת שירותי תיווך מול החברה, היא חייבת בתשלום דמי תיווך.","שולמית לא חייבת בתשלום דמי תיווך לחברה, משום שלא חתמה על בלעדיות.","מותר למתווך לפעול באמצעות חברה, אבל מאחר שהגורם היעיל בעסקה, שהוא יותם, פעל ללא רישיון כחוק, שולמית פטורה מלשלם דמי תיווך בגין העסקה.","שולמית חייבת בדמי תיווך ליותם, משום שיותם היה הגורם היעיל בעסקה. יותם סייע לה במו״מ לגבי המחיר והכיר לה את הנכס, וזאת לאחר שחתמה על הסכם להזמנת שירותי תיווך כדין."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2026-05#11","e":47,"n":11,"s":"שני אנשי עסקים, חברי ילדות, יעקב ואברהם, נפגשו בבית קפה בתל אביב, והחליטו כי יעקב ירכוש את בית המלון של אברהם, ששמו \"שבע-טון\". אברהם הפליג בסיפורים לגבי כדאיות העסקה ליעקב. לאחר שהגיעו להסכמות, הניח יעקב מפית על השולחן וכתב עליה בכתב ידו את התנאים הבאים:\n\"יעקב ירכוש מאברהם את המלון \"שבע-טון\" בתמורה למיליון ש\"ח.\nהתשלום יבוצע בעשרה תשלומים שווים של מאה אלף ש\"ח כל אחד, שיבוצעו בכל חודש החל מהחודש שלאחר החתימה. הרוכש יהיה רשאי להקדים את התשלומים.\nהרוכש יקבל את החזקה במלון לאחר השלמת התשלומים.\"\nבתחתית המפית כתבו הצדדים את התאריך והוסיפו את חתימותיהם.\nבערב, לאחר שסיפר יעקב לאשתו על העסקה, היא כעסה עליו על כך שרכש את המלון במחיר גבוה מידי לטעמה. יעקב בירר מייד עם רואה החשבון שלו, וגילה לתדהמתו שהעסקה לא כדאית עבורו כלל וכלל. למחרת בבוקר, לאחר לילה של נדודי שינה, התקשר לאברהם וביקש לבטל את העיסקה, בנימוק שהסכום שהציע גבוה מידי, וכי למרות שהפרטים היו נכונים, הוא הוטעה על ידי אברהם באופן מהותי לגבי הכדאיות הכלכלית של העסקה עבורו. אברהם מצידו סירב לבטל את החוזה.\nבנסיבות העניין, האם ההסכם ניתן לביטול עקב טעות? מדוע?","o":["ההסכם ניתן לביטול, משום שמדובר במצג שווא מהותי לעסקה.","ההסכם לא ניתן לביטול, משום שטעות בכדאיות העסקה בלבד לא מהווה עילה לביטול ההסכם.","ההסכם ניתן לביטול, מכיוון שרק עורכי דין מוסמכים לערוך חוזה לרכישת מקרקעין.","ההסכם ניתן לביטול, משום שטעות שעוסקת אך ורק בכדאיות העסקה היא עילה לביטול ההסכם."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2026-05#12","e":47,"n":12,"s":"מהו \"שימוש חורג\" במקרקעין, והאם על מתווך במקרקעין לגלות ללקוח שלו שמתעניין ברכישת המקרקעין, שנעשה במקרקעין שימוש חורג, כאשר הדבר מובא לידיעתו?","o":["מדובר בשימוש במקרקעין השונה מהשימוש המותר בהיתר הבנייה. לא חלה על מתווך חובה לגלותו ללקוח בכתב, מכיוון שרק שמאי מקרקעין מוסמך לקבוע שיש שימוש חורג.","מדובר בשימוש החורג מהתקופה של חוזה התקשרות מול רשות מקרקעי ישראל. אין חובה לגלותו ללקוח, משום שהנושא הוא טיפול משפטי שרק עורך דין צריך לטפל בו.","מדובר בשימוש במקרקעין השונה מהשימוש שנקבע בהיתר הבנייה. חלה על מתווך חובה לגלותו ללקוח בכתב, ביחד עם האסמכתא למסקנה של שימוש חורג.","מדובר בשימוש במקרקעין השונה מהשימוש שנקבע בהיתר הבנייה. מתווך במקרקעין לא ימסור מידע על מצב תכנוני ואפשרויות תכנוניות של נכס בכל מקרה, כי זו פעולה שרק לשמאי או לעורך דין מותר לבצע."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2026-05#13","e":47,"n":13,"s":"מהו \"הסכם משבצת\"?","o":["הסכם חכירה בין אגודה שיתופית לבין רשות מקרקעי ישראל ובו הגדרת ה״משבצת״, כלומר שטח הקרקע והנחלות באגודה השיתופית המסוימת.","הסכם שיתוף במקרקעין המגדיר את חלקו של כל שותף במקרקעין.","הסכם חכירה משולש בין חוכר, מושב או קיבוץ, וחקלאי, המגדיר את ה״משבצת״ של חקלאי פרטי מסוים.","הסכם במסגרת תקנון מוסכם בבית משותף, המגדיר את חלקו של כל בעל דירה ברכוש המשותף."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2026-05#14","e":47,"n":14,"s":"עליזה נפטרה והותירה אחריה צוואה. בצוואתה הורישה עליזה את בית מגוריה לבתה אפרת, אשר התגוררה עימה. בנוסף ציוותה כי המזומנים שהיו לה ועוד שתי דירות שהיו בבעלותה, יחולקו בחלקים שווים בין חמשת ילדיה, ובהם אפרת.\nעליזה מינתה מנהל עיזבון לצורך טיפול בנכסים ובחלוקה, ובית המשפט אישר כדין את המינוי. בטרם חולק העיזבון התברר למנהל העיזבון כי לעיזבון ישנו חוב בסך 350,000 ש\"ח לבית האבות שבו שהתה המנוחה לפני פטירתה.\nבנסיבות המתוארות, כיצד על מנהל העיזבון לפעול?","o":["מנהל העיזבון ירשום את הנכסים על שם היורשים, ולאחר מכן על הנושים להפנות את דרישותיהם ליורשים באופן אישי לאחר חלוקת העיזבון, וכל אחד יהיה חייב חמישית מהחוב.","חובות העיזבון יסולקו מתוך נכסי העיזבון, תחילה מתוך המזומנים ונכסים נזילים המצויים בעיזבון, ואם לא יהיה בכך די, מנהל העיזבון יממש נכסים נוספים לצורך פירעון היתרה. דירתה של אפרת תהיה אחרונה בסדר המימוש לכיסוי החובות.","מנהל העיזבון ישלם את חובות העיזבון רק מתוך חלקם של חמשת הילדים (המזומנים ושתי הדירות), משום שבית המגורים הועבר בצוואה לאפרת בלבד.","מנהל העיזבון יסלק את חובות העיזבון תחילה מתוך החלק של היורש אשר קיבל את החלק הגדול יותר מהעיזבון, וזאת לאור עיקרון השוויון וההגינות."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2026-05#15","e":47,"n":15,"s":"מהם \"מקרקעין מוסדרים\"?","o":["יחידות בבתים משותפים או בהסכמי שותפות במקרקעין שנרשמו ברשם המקרקעין.","מקרקעין שעברו חלוקה לגושים וחלקות, וזכויות הבעלות רשומות בכל חלקה.","מקרקעין שהזכות בגינם מוסדרת מול רשות מקרקעי ישראל בחוזה חכירה.","מקרקעין שהוסדר בהם היתר בנייה כדין וניתן בהם טופס איכלוס כדין."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2026-05#16","e":47,"n":16,"s":"שלומית ואריאל הם בני זוג נשואים ללא ילדים. בני הזוג לא חתמו ביניהם על הסכם יחסי ממון. בני הזוג מתגוררים בנפרד עקב אילוצי עבודה: שלומית היא מנהלת מחלקה בבית חולים בצפון, ואילו אריאל הוא פרופסור לספרות באוניברסיטת באר שבע. לאחר הנישואין רכשה שלומית דירת מגורים ורשמה אותה על שמה בלבד. כעת אריאל רוכש דירת מגורים ומתכנן לרשום אותה על שמו בלבד. ידוע כי לפי חוק מיסוי מקרקעין, ברכישת דירת מגורים יחידה (כלומר כאשר לרוכש אין דירה נוספת), עשוי לחול שיעור מס רכישה מופחת/הטבה בהתאם להגדרת \"דירה יחידה\". אריאל רושם את הדירה בטאבו אך ורק על שמו.\nבנסיבות המתוארות, האם ההטבה של מס רכישה לפי מדרגות של דירה יחידה תחול על אריאל? מדוע?","o":["כן, משום שזו דירתו היחידה של אריאל.","לא, משום שלעניין מס רכישה בני זוג נחשבים כרוכש אחד וכבר יש בידיהם את הדירה של שלומית.","כן, בגלל הרישום בטאבו והמגורים בנפרד של בני הזוג.","לא, בגלל שבני הזוג לא חתמו על הסכם ממון הם נחשבים כתא משפחתי אחד לעניין מס רכישה."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2026-05#17","e":47,"n":17,"s":"יאיר לקח משכנתה מהבנק לטובת נכס מקרקעין שבבעלותו. לאחר שיאיר פוטר הוא לא הצליח במשך 6 החודשים האחרונים לשלם את המשכנתה. הבנק, שלטובתו נרשמה המשכנתה, שלח ליאיר מכתבי התראה ופניות באמצעות עו״ד, ולאחר מכן פנה ללשכת ההוצאה לפועל למימוש המשכנתה.\nבנסיבות המתוארות, האם ניתן לממש את המשכנתה של יאיר בהוצאה לפועל? מדוע?","o":["כן; הבנק רשאי להגיש להוצאה לפועל בקשה למימוש משכנתה, ורשם הוצאה לפועל מוסמך להוציא צו מכירה לאחר המצאה ואזהרה לחייב.","לא; על הבנק להגיש תביעה לבית משפט מוסמך בלבד למימוש המשכנתה, והוא רשאי לממש בהוצאה לפועל אך ורק פסק דין סופי.","כן; הבנק רשאי להגיש להוצאה לפועל בקשה למימוש משכנתה, ובתנאי שקיבל את הסכמת משרד האוצר לביצוע פעולת הכינוס.","לא; מאחר שטרם חלפה שנה מהמועד בו יאיר הפסיק לשלם את תשלומי המשכנתה."],"c":[0],"a":false,"note":"","sub":"l_mortgage"},{"id":"2026-05#18","e":47,"n":18,"s":"בשנות השבעים נטלה שולמית משכנתה בבנק משפחתי קטן, \"שמחה לישראל\" בע\"מ, אשר לא נותן עוד שירות או מקבל עוד כספים. יתרת החוב שלה לבנק היא 5,000 ש\"ח. שולמית מעוניינת למחוק את המשכנתה באופן מיידי מנסח הרישום של דירתה.\nבנסיבות המתוארות, מה שולמית יכולה לעשות על מנת למחוק את רישום המשכנתה שלה בלשכת רישום המקרקעין?","o":["שולמית תוכל להפקיד את סכום החוב אצל רשם המקרקעין, והרשם ימחק את המשכנתה מנסח הרישום.","שולמית יכולה למחוק את המשכנתה אך ורק באמצעות צו שיפוטי של בית משפט.","שולמית פטורה מהמשכנתה ורשם המקרקעין ימחק את המשכנתה באופן אוטומטי.","שולמית יכולה למחוק את המשכנתה אך ורק באמצעות תשלום לתאגיד המקורי שלו היא חייבת את הכסף."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2026-05#19","e":47,"n":19,"s":"יובל רכש את הזכויות למחסן מערן, אשר חתם על חוזה חכירה לא מהוון של 49 שנים מול קק\"ל (קרן קיימת לישראל) ביחס למחסן. כעת יובל ביקש להגדיל את זכויות הבנייה בנכס ולשנות את יעודו, ובהתאם לכך הגיש לוועדה המקומית לתכנון ובנייה בקשה לשנות את יעוד הנכס מאחסנה למגורים ולהגדילו, במטרה למכור אותו ברווח לאחר שינוי הייעוד.\nבמידה שתאושר בקשתו של יובל, אילו תשלומים יידרש יובל לשלם לקק\"ל?","o":["דמי היתר עבור המכירה, דמי היוון עבור שינוי הייעוד.","דמי היתר עבור שינוי הייעוד, דמי הסכמה עבור העברת הזכויות.","דמי היוון עבור המכירה, דמי הסכמה בגין שינוי הייעוד.","דמי חכירה עבור הרכישה, דמי היתר עבור שינוי הייעוד."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2026-05#20","e":47,"n":20,"s":"לביא פרסם את דירתו למכירה. משה, מתווך מנוסה, יצר קשר עם לביא וביקש לדעת פרטים על הדירה, כדי שיידע מה להציג ללקוחות פוטנציאליים ואף תיאם ביקור בדירה. משה לא אמר ללביא שהוא מתווך.\nהאם משה פעל כדין? מדוע?","o":["משה פעל כדין, משום שהוא יכול לעדכן את לביא שהוא מתווך בהזדמנות הראשונה ולאחר דרישה מצד לביא.","משה פעל כדין, משום שהוא לא חייב לעדכן את לביא שהוא מתווך, ויכול לגשת לראות דירה מפרסום.","משה פעל שלא כדין, שכן היה עליו לציין את עצם היותו מתווך בפנייתו הראשונה ללביא.","משה פעל שלא כדין, שכן אסור היה לו לתאם פגישה או ביקור בדירה, מבלי לציין את עובדת היותו מתווך, אך הוא היה רשאי לשוחח עם לביא מבלי לציין את היותו מתווך."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2026-05#21","e":47,"n":21,"s":"רונית, בעלת דירה, חתמה עם המתווך המורשה אורי על טופס הזמנה לקבלת שירותי תיווך, ועל הסכם בלעדיות ל־ 6 חודשים למכירת דירתה. בהסכם הבלעדיות צוינו פעולות שיווק שעל אורי לבצע לצורך הבלעדיות, ואורי אכן ביצע כדין מספר פעולות שיווק הכרוכות בעלויות (פרסום ממומן, צילום מקצועי ושילוט).\nכעבור חודשיים הודיעה רונית לאורי בשיחת טלפון כי היא \"מפסיקה את הבלעדיות\" וממשיכה למכור את הנכס שלה בעצמה. רונית לא שלחה הודעה בכתב על ביטול הבלעדיות, ולא תיעדה את עובדת הביטול. לאחר חמישה חודשים מיום החִתימה על הבלעדיות מכרה רונית את הדירה לקונה שמצאה בעצמה, ללא מעורבותו של אורי.\nאורי כעת תובע דמי תיווך.\nלפי פסק הדין בעניין ת״א 945-12-11 סיטי נ׳ פרי, האם ניתן לבטל את הבלעדיות בנסיבות אלה?","o":["ביטול בעל־פה של בלעדיות תקף תמיד, משום שדיני התיווך אינם מחייבים הודעת ביטול בכתב.","בלעדיות לא ניתנת לביטול כלל לפני תום התקופה - לא בעל פה ולא בכתב.","לפי פסק הדין אין חובה לקבל באופן אישי שירות ממתווך מסוים, ולכן אין מניעה לשלוח הודעת ביטול בכל עת.","ביטול של התחייבות לבלעדיות צריך להיעשות בכתב, במיוחד כאשר נעשו על ידי המתווך פעולות הדורשות הוצאות כספיות על פי חוזה הבלעדיות."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2026-05#22","e":47,"n":22,"s":"חן, מתווכת במקרקעין, היא בעלת 15% מקרקע בגדרה, וקרובי משפחתה של חן הם בעלי שאר הקרקע האמורה. במשפחתה של חן החליטו למכור את הקרקע ופירסמו אותה למכירה. רוכשים פוטנציאליים, אשר הביעו התעניינות, פנו אל חן בקשר לקרקע. חן החתימה את המתעניינים על טופס הזמנה בכתב לקבלת שירותי תיווך ותשלום דמי תיווך, ותיאמה איתם ביקור בנכס.\nהאם חן רשאית לנהוג כפי שנהגה? מדוע?","o":["כן, בתנאי שחן גילתה בכתב ללקוחותיה את הקירבה המשפחתית וקיבלה את הסכמתם של המתעניינים בכתב לשלם לה דמי תיווך.","לא, חן לא רשאית לשווק את הקרקע למכירה עקב ניגוד העניינים הנובע מקרבת משפחה.","לא, חן לא רשאית לגבות דמי תיווך בגין הקרקע.","כן, בתנאי שחן גילתה למתעניינים בכתב את דבר בעלותה בחלק מהקרקע, את קירבת המשפחה שלה, וקיבלה את הסכמת הלקוחות בכתב לשלם לה דמי תיווך."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2026-05#23","e":47,"n":23,"s":"ליאת ירשה עם אחיה יובל ואחיה שמעון נכס מקרקעין ב׳מושע׳. מאז שקיבלו את הקרקע בירושה, שמעון, אחד האחים, משתמש בקרקע כולה לצורכיו הפרטיים, ללא שאי פעם נערך הסכם בין האחים.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["ליאת ושמעון יכולים לדרוש תשלום מיובל, אבל רק מרגע שהם ביקשו זאת, ואך ורק אם לא יפנה את הקרקע.","מאחר שאין הסכם שקובע במפורש מה חלקו של כל שותף, שמעון יכול לעשות שימוש בקרקע, ובלבד שלא יפריע לליאת ויובל לעשות גם שימוש בקרקע.","שותף במקרקעין לא חייב לשלם דמי שימוש ראויים עבור השימוש שהוא עושה בקרקע, מאחר שהוא חלק מהבעלים.","שמעון חייב לליאת ויובל דמי שימוש ראויים בגין השימוש בקרקע."],"c":[1,3],"a":false,"note":"תשובה נכונה: תשובות ב וד התקבלו","sub":"l_ownership"},{"id":"2026-05#24","e":47,"n":24,"s":"מהו שווי המכירה של זכות במקרקעין שהופקעה לצורך חישוב מס?","o":["שווי השוק של המקרקעין שהופקעו בניכוי ירידת ערך של 20%.","השווי שנקבע לעניין הפיצויים בשל ההפקעה.","שווי הקרקע והבניה הפוטנציאלית שעליה.","גילום מלא של ערך הקרקע ביום פרסום הודעת ההפקעה."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2026-05#25","e":47,"n":25,"s":"כנגד יצחק החייב הוגשה להוצאה לפועל בקשה למימוש של פסק דין כספי שלא שולם. במסגרת תיק ההוצאה לפועל מוּנָה כונס נכסים לדירת המגורים של יצחק. יעל טוענת שיש לה זכות בנכס בגין הסכם שכירות שעליו שילמה מראש, והיא מבקשת לעצור את ההליכים.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["יעל לא יכולה להתערב בהליכים כנגד יצחק, אך יצחק רשאי לבקש לעצור את ההליך, מכיוון שהשכיר את הנכס ליעל.","יעל תוכל להתערב בהליך רק אם רשמה הערת אזהרה בגין שכירות של יותר מחמש שנים.","יעל יכולה לפנות לרשם ההוצאה לפועל ולבקש השהייה של ההליך כדי שתוכל לפנות לבית המשפט או לפנות בבקשה ליתן הוראות לכונס הנכסים.","יעל ויצחק לא יכולים לעשות דבר כדי לעצור פעולות של כונס נכסים, מכיוון שהוא עצמאי בפעולות שלו."],"c":[2],"a":false,"note":"","sub":"k_misc"},{"id":"2026-07#1","e":48,"n":1,"s":"חברה יזמית, הבונה בנייני מגורים, מממנת את פעילותה באמצעות משקיעים פרטיים. משקיעים אלו שכרו מתווך כדי שיבצע פעולות תיווך בפרויקט שבונה החברה. המתווך התקשר בעסקאות תיווך עם רוכשים פוטנציאליים אך לא גילה להם כי הוא מקבל שכר גם מהמשקיעים.\nהאם, בנסיבות העניין, המתווך פעל כדין?","o":["המתווך פעל כדין. זאת משום שהוא לא מקבל שכר בקשר לעסקת המקרקעין הפרטנית של כל דייר ודייר.","המתווך לא פעל כדין. במקרה המתואר הוא חייב לגלות לרוכשים כי הוא מקבל שכר מהמשקיעים.","המתווך לא פעל כדין. חוץ מהעובדה שהוא מקבל שכר מהמשקיעים, היה עליו לשתף את רוכשי הדירות גם במידע עסקי שנמסר לו מהמשקיעים.","המתווך פעל כדין. הוא מחויב לסודיות כלפי המשקיעים, ולכן כל שהוא מחויב לעשות הוא לגלות למשקיעים כי הוא מקבל עמלה גם מהרוכשים."],"c":[1],"a":false,"note":"","sub":"b_duties"},{"id":"2026-07#2","e":48,"n":2,"s":"רפאל הוא מתווך במקרקעין מוסמך. רפאל נוהג לטייל ברחובות עירו, וכשהוא נתקל במודעה \"למכירה\" שמפרסם בעל דירה, הוא פונה לבעל הדירה מבלי לספר שהוא מתווך במקרקעין, ומתעניין בפרטי הנכס ובמחיר המבוקש. לאחר מכן, רפאל מציע את הנכסים ללקוחותיו.\nהאם רפאל פועל כדין בנסיבות אלה?","o":["רפאל לא פועל כדין, אך ורק אם בעל הדירה מיוצג על ידי מתווך אחר.","רפאל פועל כדין משום שהוא לא רשאי לגלות שום מידע הנוגע ללקוחותיו.","רפאל פועל כדין שכן הוא מחויב להציג עצמו כמתווך אך ורק ללקוחות שלו.","רפאל לא פועל כדין, שכן הוא צריך להציג את עצמו כמתווך במקרקעין גם למי שלא לקוח שלו."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2026-07#3","e":48,"n":3,"s":"ליאורה הציעה את דירתה למכירה באמצעות מתווך, וחתמה עימו על הסכם להזמנת שירותי תיווך במקרקעין. המתווך הראה את הדירה ליוכבד, מבלי שעדכן את ליאורה על הביקור של יוכבד בדירה. בעת הביקור בדירה, הודיעה יוכבד למתווך, כי תסכים לרכוש את הדירה במחיר הנמוך ב- 150,000 ₪ מהמחיר המבוקש. יוכבד מבקשת מהמתווך להעביר לליאורה את הצעת המחיר שלה יחד עם ההסבר כי לדעתה המחיר מופרז מכיוון שהדירה זקוקה לשיפוץ משמעותי. המתווך הודיע ליוכבד שאין בכוונתו להעביר לליאורה הצעות נמוכות מהמחיר המבוקש, וכך עשה. המתווך לחץ על יוכבד להעלות את הצעתה למחיר המבוקש, ובסופו של דבר יוכבד נענתה לדרישתו ורכשה את הדירה במחיר המבוקש.\nבנסיבות המתוארות האם המתווך פעל כדין?","o":["המתווך פעל כדין, לא היה עליו להעביר את ההצעה לליאורה כיוון שההצעה פחותה מהמחיר המבוקש.","המתווך לא פעל כדין, הוא לא צריך להיות מעורב במשא ומתן בין הצדדים.","המתווך לא פעל כדין, משום שהיה עליו להעביר ללקוחה כל הצעה שקיבל.","המתווך פעל כדין, מכיוון שהשיג עבור ליאורה את המחיר המבוקש."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2026-07#4","e":48,"n":4,"s":"יצחק פרסם את דירתו להשכרה לתקופה של שנתיים. ראובן, ביקר בדירה, ניהל עם יצחק משא ומתן, וסיכם עם יצחק, בעל פה, על שכירת הדירה לשנתיים במחיר של 2,500 ש״ח לחודש.\nראובן קיבל מיצחק את מפתחות הדירה והעביר חלק מחפציו לדירה באותו יום.\nלמחרת, התקשר ראובן ליצחק במטרה לתאם עימו את מסירת השיקים עבור תשלום דמי השכירות אלא שיצחק מסר לראובן כי הוא מצטער אבל שרה ביקרה בדירה לפני שעה, הותירה עליו רושם טוב, והציעה לשכור את הדירה ב-2,800 ש״ח לחודש.\nבנסיבות העניין, האם יצחק רשאי להשכיר את הנכס לשרה?","o":["כן, זאת משום שלא נחתם חוזה שכירות עם ראובן, וכל חוזה במקרקעין חייב להיעשות בכתב.","כן, משום ששרה לא ידעה על ראובן, ולכן יצחק רשאי לקבל את הצעתה.","לא, מכיוון שהחזקה בדירה נמסרה לראובן והוא כבר הכניס את חפציו לדירה.","לא, מכיוון שההפרש בין דמי השכירות שסוכמו עם ראובן לאלו שסוכמו עם שרה, לא מהותי."],"c":[2],"a":false,"note":"","sub":"r_rent"},{"id":"2026-07#5","e":48,"n":5,"s":"במסגרת חוזה לרכישת דירה שנכרת ביניהם, דוד היה חייב ליהונתן תשלום אחרון בסך של 200,000 ₪. יתרת החוב העדכנית של דוד ליהונתן עומדת כיום על 250,000 ₪, ומורכבת מקרן בסך 200,000 ₪, ריבית בסך 40,000 ₪ והוצאות שיהונתן התחייב בהן במסגרת החוזה במקרה של חוב, בסך 10,000 ₪. יהונתן הצליח לגבות מדוד רק 100,000 ₪ על חשבון החוב, ואת יתרת החוב, נותר דוד חייב ליהונתן.\nבנסיבות העניין, ובהיעדר הסכמה אחרת בין הצדדים, מהו סדר זקיפת התשלומים של החוב של דוד כלפי יהונתן?","o":["תחילה יש לזקוף את התשלום לחשבון הקרן. לאחר מכן ניתן לזקוף לחשבון הריבית, ורק לאחר מכן לחשבון ההוצאות שיהונתן התחייב בהן בשל אותו חוב.","יש לזקוף את התשלום לחשבון הריבית בסך 40,000 ₪ תחילה, ואז את היתרה להקטין מקרן החוב. ההוצאות שיהונתן הוציא לא רלוונטיות באכיפה של חוזה. הן נושא לתביעה נפרדת ותו לא.","יש לזקוף את התשלום לחשבון ההוצאות שהוציא יהונתן תחילה בסך 10,000 ₪, ואת היתרה לזקוף לחשבון קרן החוב. הריבית לא רלוונטית באכיפה של חוזה. היא נושא לתביעה נפרדת ותו לא.","יש לזקוף תחילה את התשלום להוצאות בסך 10,000 ₪, את היתרה מכך לזקוף לריבית בסך 40,000 ₪, ואת היתרה מכך לזקוף על חשבון קרן החוב."],"c":[3],"a":false,"note":"","sub":"c_remedy"},{"id":"2026-07#6","e":48,"n":6,"s":"ארבעה שותפים הם בעלים בחלקים שווים בבניין מגורים ישן בן ארבע דירות שלא רשום כבית משותף בפנקס הבתים המשותפים. אחד השותפים מגיש תביעה לפירוק השיתוף בבניין, דורש למכור את הבניין כולו לצד שלישי, ולחלק את התמורה הכספית בין השותפים. שלושת השותפים האחרים מתנגדים למכירה, ודורשים לפרק את השיתוף כך שכל אחת מהדירות תירשם על שם אחד מהשותפים.\nבנסיבות אלה, האם ישנה אפשרות עבור השותפים במקרקעין להימנע ממכירת הבניין?","o":["לא. זאת משום שרישום בית משותף לא מהווה דרך חוקית לפירוק שיתוף לפי חוק המקרקעין, והדרך היחידה לפירוק שותפות בבניין היא מכירתו.","כן. אפשר לבצע פירוק שיתוף בדרך של רישום הנכס כבית משותף והקצאת בעלות לכל אחד מהבעלים על דירה משלו.","לא, רישום כבית משותף כדרך לפירוק שיתוף אפשרי אך ורק אם כל השותפים מסכימים לכך פה אחד. בהיעדר הסכמה של אחד השותפים, בית המשפט מחויב להורות על מכירת הנכס.","כן. ניתן למנוע משותף במקרקעין מלפרק את השותפות במקרקעין."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2026-07#7","e":48,"n":7,"s":"שמשון מכר את דירתו לשני אנשים שונים. הוא חתם על חוזה עם הרוכש הראשון וקיבל ממנו תשלום עבור הדירה, ולאחר מכן חתם על חוזה עם הרוכש השני וקיבל גם ממנו תשלום, ואף רשם לטובת הקונה השני הערת אזהרה. שמשון נעלם, וכעת כל אחד מהרוכשים טוען כי זכותו בדירה גוברת.\nזכותו של מי מהקונים עדיפה?","o":["מכיוון ששני הקונים פעלו בתום לב ושילמו את התמורה, זכאותם לדירה זהה ולכן יחלקו ביניהם את הדירה שווה בשווה.","זכותו של הקונה הראשון גוברת.","הקונה הראשון גובר, אלא אם הקונה השני פעל בתום לב, שילם את התמורה והשלים את הרישום על שמו.","אף אחד מהצדדים לא יכול לזכות בדירה בנסיבות אלה, מכיוון שרישום הערת אזהרה ע״י הקונה השני לא נחשב כהשלמת עסקה מצדו."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2026-07#8","e":48,"n":8,"s":"לאחרונה רכש רועי דירת מגורים. לצורך רכישת הדירה נטל רועי הלוואה מהבנק. בתמורה להלוואה נרשמה לטובת הבנק משכנתה על הדירה. כעת מבקש רועי למכור את דירתו לפנינה, אולם הבנק מסרב לכך, שכן, לטענת הבנק על רועי לעמוד בתנאי ההלוואה עד לסיומה ולא רשאי להביא לפרעונה טרם המועד. רועי מבקש לשלם את יתרת ההלוואה במלואה.\nמה הדין בנסיבות האמורות?","o":["הבנק צודק, שכן, רועי לא רשאי למכור את הדירה אלא לאחר שההלוואה תשולם במלואה, במועדה המקורי, ולכן עליו להמתין עד שיגיע מועד ההלוואה לסיומו.","הבנק טועה. הבנק לא רשאי למנוע מרועי לפרוע את יתרת ההלוואה בטרם יגיע מועד סיומה, ולכן רועי רשאי להפקיד את התשלום אצל רשם המקרקעין ולבקש שיפקיע את המשכנתה במידה שנפדתה.","הבנק טועה. רועי רשאי בכל עת לפרוע את ההלוואה, אך אם הבנק מסרב לכך, יכולה פנינה לגרור את המשכנתה אליה.","הבנק צודק. המשכנתה מקימה לבנק זכות בלעדית בדירה, ולבנק הזכות למנוע בכל מקרה את מכירת הדירה לפנינה."],"c":[1],"a":false,"note":"","sub":"l_mortgage"},{"id":"2026-07#9","e":48,"n":9,"s":"רועי מתגורר בדירת הגג בבית משותף הרשום בפנקס הבתים המשותפים. בבית המשותף קיימות שתי מעליות המיועדות לשרת את כל בעלי הדירות. רועי מעוניין להצמיד לדירתו בלבד את אחת המעליות תוך תשלום הולם לשאר בעלי הדירות.\nמה הרוב של בעלי הדירות הדרוש לרועי לשם קביעת הוראה בתקנון אודות ההצמדה בה הוא מעוניין?","o":["רוב רגיל מבעלי הדירות בבית המשותף.","הסכמה של כל בעלי הדירות בבית המשותף.","רוב של 75% מבעלי הדירות בבית המשותף.","לא ניתן להצמיד את המעלית לדירה."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2026-07#10","e":48,"n":10,"s":"אליהו מתווך במקרקעין משנת 2010 ושילם את כל האגרות במועדן. בשנת 2026 הוגשה תלונה במשטרה כנגד אליהו שהובילה לפתיחת חקירה פלילית כנגדו בחשד לביצוע עבירות מין. אליהו מבקש לשלם את האגרה לחידוש רישיון התיווך לשנת 2027.\nמה רשם המתווכים מוסמך לעשות בנסיבות אלו?","o":["רשם המתווכים יכול להתלות זמנית את רישיון התיווך של אליהו לאחר שנועץ בוועדה המייעצת.","רשם המתווכים לא יכול למנוע את חידוש הרישיון במקרה זה, אלא רק לאחר ההרשעה.","רשם המתווכים יכול לזמן את המתלוננת למסירת עדות, ואם התרשם שהיא אמינה יכול לבטל את הרישיון של אליהו.","רשם המתווכים יכול לנקוט באמצעים משמעתיים כנגד אליהו: התראה, נזיפה, קנס, התליה או ביטול רישיון."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2026-07#11","e":48,"n":11,"s":"אילן הוא בעלים של דירת מגורים הרשומה בפנקס הבתים המשותפים. לדירה צמודה חניה. אילן מבקש למכור לסיגל את דירתו, אולם את החניה הצמודה לה הוא מבקש למכור לראובן, שהוא בעלים של משרד בבניין סמוך.\nהאם אילן רשאי לעשות כן?","o":["כן, וזאת בתנאי שהתקנון בין בעלי הדירות בבית המשותף מאפשר את הפרדת ההצמדה מהדירה.","כן. אילן יכול למכור את החניה שלו בנפרד מדירתו לכל מי שיבחר.","לא. לא ניתן למכור הצמדה במקרקעין למי שאינו בעל נכס בבניין.","לא. אין אפשרות חוקית להפריד הצמדה מדירת מגורים ולמכור אותה בנפרד."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2026-07#12","e":48,"n":12,"s":"יורם הוא מתווך במקרקעין אשר החליט לפרוש מהמקצוע, ובהתאם לכך הודיע לרשם המתווכים כי הוא מבקש להתלות מרצון את רישיונו.\nלאחר שהותלה רישיונו מרצון, הוגשה כנגדו תלונה בגין עבירות משמעת, לפי חוק המתווכים במקרקעין התשנ\"ו-1996, שלכאורה ביצע בתקופה שקדמה להתליית הרישיון.\nהאם ועדת המשמעת מוסמכת לדון בקובלנה בגין המעשים?","o":["לא. ועדת המשמעת לא מוסמכת לדון בעניין בנסיבות הללו. אלא אם מדובר בתלונה הנוגעת לחוק הגנת הצרכן, התשמ״א-1981 או בעבירה לפי חוק העונשין, התשל״ז-1977.","לא. ועדת המשמעת לא מוסמכת לדון בעניין. אלא אם כן רשיונו של יורם לא היה בתוקף בזמן ביצוע המעשים.","כן. ועדת המשמעת מוסמכת לדון בעניין גם לאחר שיורם פרש מהמקצוע והתלה את רישיונו.","כן. ועדת המשמעת מוסמכת לדון בעניין. אבל אם במועד הדיון רשיונו של יורם לא בתוקף, הוועדה לא רשאית להטיל עונש של התלייה או ביטול רישיון."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2026-07#13","e":48,"n":13,"s":"רופא שיניים מפעיל מרפאה בבניין משרדים. לאחרונה נדרש לבצע שיפוץ יסודי במרפאה, ולכן מעוניין להעביר את מרפאתו באופן זמני למרתף של ביתו הפרטי. היתר הבניה לביתו קבע שימוש למגורים.\nהאם רופא השיניים רשאי להעביר את מרפאתו למרתף ביתו באופן זמני?","o":["לא. זאת משום שלא ניתן לסטות מהוראות היתר הבניה.","כן, אך ורק בתנאי שרופא השיניים פנה לוועדה המחוזית לתכנון ובניה לצורך שינוי ייעוד, ושינוי הייעוד אושר באופן קבוע.","כן, בתנאי שהגיש בקשה לשימוש חורג והבקשה אושרה.","לא, מכיוון שלא ניתן להגיש בקשה להקלה זמנית להפעלת העסק במרתף ביתו."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2026-07#14","e":48,"n":14,"s":"מתווך במקרקעין החתים את לקוחו על הסכם להזמנת שירותי תיווך לצורך שיווק דירתו של הלקוח. באותו הסכם נכתב כי תינתן למתווך בלעדיות למכירת הדירה למשך חצי שנה מיום חתימת החוזה, וכי המתווך מתחייב להציב שלט בדירה, ולפרסם את הדירה בעיתון יומי נפוץ על חשבונו של המתווך. שבועיים לאחר חתימת החוזה, הלקוח מכר את דירתו בעצמו ללא סיועו של המתווך. כעת טוען הלקוח כי המתווך לא זכאי לדמי תיווך משום שמכר את דירתו בעצמו ללא סיוע כלשהו של המתווך. המתווך מצידו, טוען כי ביצע כבר את פעולות השיווק שפורטו בהסכם להזמנת שירותי התיווך, בתוך שבוע מיום חתימת החוזה, ולכן זכאי לדמי התיווך.\nהאם המתווך זכאי לדמי תיווך בנסיבות אלה?","o":["המתווך זכאי לדמי תיווך בנסיבות אלה, מכוח חזקת \"הגורם היעיל״ שבבלעדיות.","המתווך לא זכאי לדמי תיווך, שכן הוא לא יכול להיחשב כ\"גורם היעיל\" בעסקה אם הוא לא איתר בעצמו את הרוכש.","המתווך זכאי לדמי תיווך, משום שהלקוח אישר את ההסכם להזמנת שירותי תיווך והדירה נמכרה בתוך תקופת הבלעדיות.","המתווך לא זכאי לדמי תיווך, שכן לא נחתם הסכם בלעדיות נפרד."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2026-07#15","e":48,"n":15,"s":"בני זוג חתמו על הסכם גירושין אשר אושר בבית משפט לענייני משפחה. בהסכם נקבע כי הבעל ישלם לאשה מיליון ש״ח ויקבל בתמורה את מלוא הזכויות בדירת המגורים של בני הזוג.\nהאם העברת הדירה בנסיבות אלה מחייבת את בני הזוג במס רכישה ובמס שבח?","o":["העברת הדירה פטורה ממס שבח אך חייבת במס רכישה.","העברת הדירה פטורה ממס שבח וממס רכישה.","העברת הדירה חייבת בשליש מס רכישה כיוון שמדובר בהעברה בין קרובים.","העברת הדירה פטורה ממס כל עוד טרם החלה חלוקת הרכוש ורק אם התשלום שמשלם הבעל לא מגיע ממקורות חיצוניים לנכסי בני הזוג."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2026-07#16","e":48,"n":16,"s":"חברת בניה (להלן: \"החברה\") הקימה פרויקט למגורים. החברה לא צירפה להסכמי המכר של הדירות מפרט והוראות שימוש ותחזוקה. בין הקונים לבין החברה התעוררה מחלוקת לגבי טיב המטבח שסופק: החברה טוענת שהיתה צריכה לספק מטבח ברמה ממוצעת, ואילו הקונים טענו שהחברה היתה צריכה לספק מטבח ברמה גבוהה.\nבנסיבות העניין, מהי רמת המטבח שהחברה הייתה צריכה לספק לרוכשים?","o":["החברה היתה צריכה לספק לרוכשים מטבח ברמה גבוהה.","בנסיבות העניין, החברה צריכה לקיים את החוזה ברמה ממוצעת.","על החברה להציע לרוכשים 3 סוגי מטבחים והרוכשים יבחרו מטבח מתוך חלופות אלו.","החברה מחויבת להציע לכל רוכש זיכוי לרכישת מטבח, מחברת מטבחים לבחירתו."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2026-07#17","e":48,"n":17,"s":"מירי רוכשת דירה מקבלן ומבקשת לשלם 25% מערך הדירה בתשלום הראשון. מירי פנתה לקבלן בבקשה כי במקום ערבות בנקאית להבטחת התשלום, יעניק לה הקבלן הנחה בשווי 10% ממחיר המחירון של הדירה.\nהאם הקבלן רשאי להסכים להצעתה של מירי?","o":["כן. כל עוד העסקה מדוּוחת לרשות המיסים במחיר שנקבע בפועל (לפני ההנחה).","לא. כי הקבלן לא יכול לדווח על העסקה לרשות המיסים במחיר הנמוך ממחיר המחירון של הדירה.","כן. מירי רשאית לוותר על ערבות, שכן, הערבות נועדה להגן עליה, ולכן רשאית לבקש ולקבל הנחה במקומה.","לא. הקבלן לא יכול לקבל תשלום בסך 25% ממחיר הדירה ללא מתן ערבות."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2026-07#18","e":48,"n":18,"s":"בעקבות קשיים כלכליים מציע מלון חדרים להשכרה לטווח ארוך. לקוח פונה אליכם בשאלה האם יוכל לשכור חדר במלון ולהיחשב לדייר מוגן, שכן, מדובר בנכס בו בכוונתו להתגורר שנים רבות.\nהאם חוק הגנת הדייר יחול על השכירות בבית המלון, בהנחה שהחוזה בין הלקוח למלון אינו מתייחס במפורש לתחולת חוק הגנת הדייר?","o":["כן. חוק הגנת הדייר חל בכל נכס שבו אדם גר, והוא מגן עליו מפינוי מדירת המגורים שלו.","כן. בגלל שלא נקבע בחוזה שחוק הגנת הדייר לא חל על השכירות בין הצדדים, אדם שגר במלון לתקופה ארוכה יכול להיות דייר מוגן.","לא. הלקוח יוכל להיות מוגדר כדייר מוגן רק אם יקנה את הדירה כדירת נופש.","לא. חוק הגנת הדייר לא חל על שכירות בבתי מלון."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2026-07#19","e":48,"n":19,"s":"ציונה ובתה דנה ניהלו יחד חנות נעליים. החנות הושכרה לציונה בדמי מפתח במשך שנים רבות. לאחר פטירתה של ציונה, המשיכה דנה להחזיק בחנות כדיירת ממשיכה. לאחר זמן מה ביקשה דנה לשנות את ייעוד העסק ולהפעיל בַמקום מסעדה, אולם בעל הנכס סירב לכך.\nמה הדין במקרה זה?","o":["דייר ממשיך רשאי לשנות את מטרת העסק, ואין צורך באישור בעל הנכס או בית הדין, כל עוד הדייר לא מבצע שינוי פיזי במושכר.","דייר ממשיך רשאי לשנות את מטרת העסק, ואין צורך באישור בעל הנכס ו/או בית הדין, כל עוד השינוי לא מהווה מטרד לשכנים או לסביבה.","בעל הנכס רשאי לסרב, שכן, דייר מוגן לא רשאי לשנות את מטרת השימוש במושכר ללא הסכמת בעל הנכס, ולבית הדין אין סמכות להורות אחרת.","בעל הנכס רשאי לסרב, אך לבית הדין סמכות להתיר שינוי במטרת השימוש במושכר, אם מצא שהשינוי דרוש לקיומו של הדייר."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2026-07#20","e":48,"n":20,"s":"ביום 1 ביוני 2026, בעת שאורי שהה בטיול בחו\"ל, פרץ ניר לדירתו של אורי והחל להתגורר בה. אורי חזר לישראל ביום 20 ביוני 2026 וגילה את דבר הפלישה. ביום 5 ביולי 2026, פנה אורי לניר ודרש ממנו להתפנות. משסירב ניר, שכר אורי מאבטחים פרטיים אשר נכנסו לדירה, השתמשו בכוח סביר ופינו את ניר ואת חפציו מן הנכס.\nהאם פעולתו של אורי חוקית?","o":["פעולתו של אורי חוקית לחלוטין, שכן הוא פעל בתוך 30 ימים מיום שגילה בפועל את הפלישה לדירתו, וזהו המועד הקובע לצורך הפעלת סעד עצמי.","פעולתו של אורי לא חוקית. היה עליו לפנות לבית משפט. זאת משום שזכות הסעד העצמי מוגבלת לשימוש בכוח סביר תוך 30 ימים מיום התפיסה (הפלישה עצמה), ולא מיום הגילוי.","אורי היה רשאי להשתמש בכוח סביר ללא הגבלת זמן, שכן מדובר במקרקעין פרטיים רשומים, והגבלת 30 הימים חלה אך ורק על מקרקעי ציבור שאינם רשומים.","שימוש בכוח סביר מותר אך ורק למניעת פלישה, ואילו מרגע שהפולש תפס את ההחזקה הפיזית בנכס, חל איסור מוחלט על עשיית דין עצמי ויש לפנות לבית המשפט בלבד לצורך פינויו."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2026-07#21","e":48,"n":21,"s":"צילה – בעלת קרקע, התקשרה בהסכם קומבינציה עם יזם. העסקה בוצעה באמצעות מתווך. התמורה לה זכאית צילה מכח ההסכם, כללה תשלום כספי במזומן וכן 4 דירות שיבנו בפרויקט שיקים היזם על הקרקע.\nבהתאם לפס\"ד ע\"א 107/86 אהרון חסין נ' דוד בלס ואח', מהו הבסיס לחישוב דמי תיווך בעסקה?","o":["המזומן בלבד.","שווי כלל התמורה בעסקה, לרבות שווי הדירות בנוסף לרכיב המזומן.","שווי הדירות בלבד, ללא רכיב המזומן.","שווי הקרקע המקורי, ללא התמורה העתידית."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2026-07#22","e":48,"n":22,"s":"יעל ותמר הן בעלים במשותף בדירת מגורים בחלקים שווים. בין השתיים נערך הסכם, לפיו יעל תהיה זכאית לשימוש ייחודי בחדר העבודה בדירה למשך עשר שנים, ותמר לא תעשה בו כל שימוש. ההסכם לא נרשם בפנקסי המקרקעין.\nבנסיבות העניין, האם ההסכם מחייב רוכש עתידי (צד ג') שיקנה את חלקה של תמר בדירה מבלי להכיר את ההסכם בין יעל ותמר בכל דרך שהיא, בהסתמך על נוסח הרישום שהופק מפנקסי המקרקעין?","o":["ההסכם מחייב גם צד ג' כאמור, שכן אין חובת רישום של הסכם השיתוף.","כאשר הסכם שיתוף לא נרשם בפנקסי המקרקעין, הוא לא מחייב אדם שנעשה שותף לאחר חתימת ההסכם.","ההסכם חסר תוקף, שכן, שותפים במקרקעין הם שותפים בחלק בלתי מסוים מהנכס.","ההסכם מחייב, שכן הסכם שיתוף מחייב רוכש עתידי בתנאי שדוּוח לרשות המקומית ולמיסוי מקרקעין."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2026-07#23","e":48,"n":23,"s":"שרה מבקשת למכור את דירתה. יוסי, מתווך במקרקעין, הגיע לביתה של שרה על מנת לשכנע אותה לחתום על הסכם בלעדיות במכירת דירתה. שרה סירבה לחתום, ואף הבהירה כי היא לא מעוניינת בשירותי תיווך כלל. לאחר סירובה, יוסי התקשר לשרה פעמים רבות עם הצעות מרוכשים שייצג והגיע לביתה שלוש פעמים נוספות. לבסוף השתכנעה שרה, חתמה על הזמנת שירותי תיווך, ומכרה את הדירה באמצעות תיוּוכו של יוסי.\nבנסיבות העניין, האם יוסי פעל כדין?","o":["יוסי פעל כדין. מותר למתווך לפנות ללקוח מספר פעמים עד שהוא משתכנע לבצע עסקה.","יוסי פעל כדין. שכן הוא מייצג את לקוחותיו שמעוניינים לרכוש את דירתה של שרה.","יוסי פעל בניגוד לדין. מותר למתווך לפנות ללקוח מספר פעמים, אך אסור לו להגיע לביתו.","יוסי פעל בניגוד לדין. שכן, חל איסור על פניות חוזרות לשם קשירת עסקה."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2026-07#24","e":48,"n":24,"s":"יונתן והראל חתמו על הסכם מֶכר אשר לפיו יונתן רוכש דירה מהראל. התשלום הראשון היה אמור להתבצע כשבועיים לאחר החתימה. יום לפני מועד התשלום הודיע יונתן על ביטול ההסכם.\nמהן התרופות העומדות להראל בגין הפרת החוזה?","o":["הראל רשאי לדרוש את אכיפת החוזה או לבטלו. בנוסף, הוא רשאי לתבוע פיצויים בנוסף לביטול החוזה או אכיפתו, או במקומם.","אי אפשר לדרוש אכיפת חוזה מֶכר דירה, שכן, מדובר בעניין בשירות אישי. לכן הראל זכאי לפיצוי כספי בלבד.","הראל רשאי לבחור בין אכיפת החוזה לבין פיצויים, אך לא יכול לקבל את שניהם.","מאחר שהתשלום הראשון טרם בוצע, ההסכם טרם נכנס לתוקף. לכן אין להראל זכות לדרוש אכיפה או פיצויים."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2026-07#25","e":48,"n":25,"s":"בחוזה המֶכר נקבע תנאי מפורש לפיו הקונה לא יהיה רשאי לבצע כל עסקה במקרקעין הנרכשים, ללא קבלה מראש של הסכמה של המוכר בכתב. המוכר מעוניין להבטיח תנאי זה ברישום בפנקסי המקרקעין.\nאיזו הערה רשאי הרשם לרשום בפנקס המקרקעין ומה משמעותה?","o":["הרשם רשאי לרשום הערה בדבר הצורך בהסכמה של המוכר. כל עוד ההערה רשומה, לא ניתן לרשום כל עסקה הסותרת את תוכן ההערה.","הרשם רשאי לרשום הערת אזהרה רגילה בלבד, אך היא לא מונעת רישום עסקאות סותרות, אלא רק מעניקה למוכר זכות קדימה לקבלת פיצויים כספיים.","אין אפשרות לרשום הערה על צורך בהסכמה של צד שלישי. שכן, תניה כזו נחשבת לפגיעה בלתי חוקית בחופש העיסוק ובחופש הקניין של הקונה.","ניתן לרשום הערה על הגבלת כשרות משפטית, אשר תוקפה פג באופן אוטומטי בחלוף שנה מיום הרישום, אלא אם כן חוּדשה בצו של בית משפט."],"c":[0],"a":false,"note":"","sub":"l_register"}]};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>/* =====================  מוכנה למבחן התיווך — אפליקציית תרגול אדפטיבית  ===================== */
'use strict';
const DAY = 864e5, MIN = 6e4;
const Q = DATA.qs, QBY = new Map(Q.map(q => [q.id, q]));
const SUBS = new Map(DATA.subs.map(s => [s.id, s])), TOPICS = new Map(DATA.topics.map(t => [t.id, t]));
const EX = DATA.exams, EXBY = new Map(EX.map(e => [e.id, e]));
const POOL_TOTAL = Q.filter(q => !q.a).length;
const LET = ['א', 'ב', 'ג', 'ד'];
const EXAM_Q = 25, EXAM_MIN = 120, PASS = 60;
const KEY = 'mitavechet.progress.v1';

/* ---------------------------------- utils ---------------------------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const now = () => Date.now();
const ymd = (t = now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const pct = x => Math.round(x * 100);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmtTime = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(s % 60).padStart(2, '0'); };
const paras = t => t.split('\n').map(p => `<p>${esc(p)}</p>`).join('');
const subLabel = id => SUBS.get(id).label;
const topicOfSub = id => TOPICS.get(SUBS.get(id).topic);

/* ---------------------------------- storage ---------------------------------- */
let memOnly = false;
function defState() {
  return { v: 1, settings: { simTimer: true }, q: {}, days: {}, sims: [], active: null, created: now() };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      try { if (!localStorage.getItem(KEY + '.backup-pre-sims')) localStorage.setItem(KEY + '.backup-pre-sims', raw); } catch (e) { }
      const s = JSON.parse(raw);
      if (s && s.v === 1) return migrate(s);
    }
  } catch (e) { memOnly = true; }
  return defState();
}
function migrate(s) {          // additive only: never removes or rewrites existing progress
  const d = defState();
  s.settings = Object.assign(d.settings, s.settings || {});
  s.q = s.q || {}; s.days = s.days || {}; s.sims = s.sims || []; if (s.active === undefined) s.active = null;
  return s;
}
let S = defState(), STORE_KEY = null;
let saveT = 0;
function save() {
  if (!STORE_KEY) return;
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { memOnly = true; } }, 150);
  if (typeof onSaved === 'function') onSaved();
}

/* ---------------------------------- pool / locks ---------------------------------- */
const practicable = q => !q.a;

/* ---------------------------------- learner model ---------------------------------- */
// Each attempt = [timestamp, correct(0/1), confidence(0 guess,1 hesitated,2 sure), ms, mode]
function evidence(ok, conf, mode) {
  let s, w = 1;
  if (ok) { s = conf === 2 ? 1 : conf === 1 ? 0.6 : 0.3; }
  else { s = 0; w = conf === 2 ? 1.5 : conf === 0 ? 0.7 : 1; }   // confident error = strongest signal
  if (mode === 'sim') w *= 0.8;
  return { s, w };
}
function isCorrect(q, sel) { return q.a ? true : (sel >= 0 && q.c.includes(sel)); }

function record(q, sel, conf, ms, mode) {
  const ok = isCorrect(q, sel);
  const st = S.q[q.id] || (S.q[q.id] = { h: [], box: 0, due: null, lapses: 0 });
  st.h.push([now(), ok ? 1 : 0, conf, ms, mode]);
  if (st.h.length > 15) st.h.shift();
  const INT = [0, 1, 3, 7, 14, 30];
  if (ok && conf === 2) { st.box = Math.min(5, st.box + 1); st.due = now() + INT[st.box] * DAY; }
  else if (ok && conf === 1) { st.box = Math.max(1, st.box); st.due = now() + Math.max(0.5, INT[st.box] / 2) * DAY; }
  else if (ok) { st.box = Math.min(st.box, 1); st.due = now() + 0.5 * DAY; }               // lucky guess → soon
  else { st.box = 0; st.lapses++; st.due = now() + 10 * MIN; }
  S.days[ymd()] = (S.days[ymd()] || 0) + 1;
  save();
  return ok;
}

let _mcache = null, _mver = -1, _ver = 0;
const bump = () => { _ver++; };
function model() {
  if (_mcache && _mver === _ver) return _mcache;
  const t = now(), sub = {}, top = {};
