"ליווי של רוכש דירה ע\"י יועצים פיננסיים המסייעים לו למצוא מימון לרכישת הדירה.","מימון וליווי פיננסי של פרויקט בנייה ע\"י המדינה.","מימון פיננסי של הלוואה לקונה דירה.","מימון לפרויקט בנייה ע\"י תאגיד בנקאי במסגרת הסכם ליווי."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2014-10#17","e":7,"n":17,"s":"מתווך היה הגורם היעיל בעיסקה למכירת דירה. הצדדים חתמו הסכם למכירת הדירה. לאחר מכן הסכם המכירה בוטל.\nבנסיבות המתוארות, האם זכאי המתווך לדמי תיווך?","o":["כן, בכל מקרה ובתנאי שהמתווך קיבל את דמי התיווך לפני ביטול ההסכם.","כן, בכל מקרה ללא קשר לשאלה מתי קיבל המתווך את דמי התיווך.","בכל מקרה המתווך לא זכאי לדמי תיווך אם ההסכם בוטל.","המתווך זכאי לדמי תיווך, בתנאי שלא הותנה אחרת בהסכם התיווך."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2014-10#18","e":7,"n":18,"s":"ראובן חכר חלקת קרקע ממינהל מקרקעי ישראל, לבניית בית מגורים חד משפחתי.בחוזה הוגדר במפורש שמותרת בנייה בשטח של 155 מ\"ר. לאחר השלמת הבנייה, אושרה תוכנית חדשה, המאפשרת הגדלה של זכויות הבנייה בחלקה של עד 180 מ\"ר.\nאיזה תשלום יצטרך ראובן לשלם למינהל מקרקעי ישראל, על מנת שהמינהל יאשר לו לבנות בהתאם לתוכנית החדשה?","o":["כדי לקבל את הסכמת מינהל מקרקעי ישראל להגדלת הבנייה, על ראובן לשלם למינהל דמי היתר.","כדי לקבל את הסכמת מינהל מקרקעי ישראל להגדלת הבנייה, על ראובן לשלם למינהל דמי הסכמה .","כדי לקבל את הסכמת מינהל מקרקעי ישראל להגדלת הבנייה, על ראובן לשלם למינהל דמי היוון בהתאם ליחס שבין שווי זכויות בנייה בשיעור 155מ\"ר לבין 180 מ\"ר.","כדי לקבל את הסכמת מינהל מקרקעי ישראל להגדלת הבנייה, על ראובן לשלם למינהל היטל השבחה."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2014-10#19","e":7,"n":19,"s":"אלעד הוא הבעלים של משרד שבו 5 חדרים. אלעד מכר חדר אחד במשרד למשרד שליחויות, השכיר שני חדרים לדוד מנהל החשבונות לתקופה של 3 שנים, והשכיר חדר שלישי לנעמה האדריכלית לתקופה של 15 שנים.\nאיזו/אילו מהעיסקאות יסכים רשם המקרקעין לרשום בלשכת רישום מקרקעין?","o":["חברת השליחויות ונעמה.","דוד ונעמה.","חברת השליחויות בלבד.","נעמה בלבד."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2014-10#20","e":7,"n":20,"s":"גילי רכשה מגדי זכויות בדירה במרכז ירושלים. לאחר השלמת העיסקה, גילי חתמה על חוזה חכירה לדורות עם המינהל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לגילי זכות שכירות לתקופה של למעלה מעשרים שנים.","לגילי זכות שכירות לתקופה של למעלה מעשרים וחמש שנים.","לגילי זכות שכירות לתקופה של למעלה מארבע שנים.","לגילי זכות שכירות לתקופה של למעלה ממאה שנים."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2014-10#21","e":7,"n":21,"s":"יובל הוא הבעלים של נכס מקרקעין ביהוד. יובל שכר את שירותיה של הילה המתווכת לצורך מכירת הנכס.יובל והילה חתמו על הזמנה לשירותי תיווך במקרקעין כדין ואף הסכימו בכתב על מתן בלעדיות להילה במכירה.הסכם הבלעדיות אושר בחתימת יובל במסמך נפרד, אולם לא נקבעה בו משך תקופת הבלעדיות.כעבור חודש וחצי החליט יובל שהוא לא מרוצה מעבודתה של הילה, והוא מבקש להשתחרר מהסכם הבלעדיות.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא הנכון ביותר?","o":["ללקוח תמיד יש זכות לבטל הסכם בלעדיות שנחתם עם מתווך אם הוא לא מרוצה.","הלקוח לא רשאי לבטל את ההסכם באופן חד צדדי, אך הבלעדיות הסתיימה בכל מקרה אם הנכס מיועד למגורים.","הלקוח רשאי לבטל את ההסכם באופן חד צדדי, אך הבלעדיות הסתיימה בכל מקרה רק אם הנכס לא מיועד למגורים.","הלקוח לא רשאי לבטל את ההסכם באופן חד צדדי, אך הבלעדיות הסתיימה בכל מקרה אם הנכס לא מיועד למגורים והמתווך לא ביצע שתי פעולות שיווק לפחות."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2014-10#22","e":7,"n":22,"s":"קבלן הקים פרויקט של מספר מגדלי משרדים הסמוכים זה לזה.כל מגדל בנוי על חלקה נפרדת הניתנת לרישום בפנקס הבתים המשותפים.הקבלן מבקש לרשום את המגדלים כבית משותף יחיד בפנקס הבתים המשותפים.\nבנסיבות העניין, האם הדבר אפשרי?","o":["אין אפשרות בשום מקרה לרשום מגדל משרדים כבית משותף, משום שהוא לא משמש למגורים.","ניתן לרשום כל מגדל כשלעצמו כבית משותף, אך לא ניתן לרשום את כולם כבניין אחד.","ניתן לרשום את כל המגדלים כבית משותף אחד אם יש להם מתקנים משותפים.","ניתן לרשום את כל המגדלים כבית משותף אחד אם הם הוקמו על מקרקעין מוסדרים ורק אם כולם בנויים על אותם גוש וחלקה."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2014-10#23","e":7,"n":23,"s":"במקרה שאדם שוכר מקבלן דירה חדשה לתקופה של 20 שנים, האם יש צורך לצרף מפרט לחוזה השכירות?","o":["כן, בכל עיסקה עם קבלן חייב הקבלן לצרף מיפרט.","לא.","יש לצרף מיפרט, אלא אם הוסכם אחרת בחוזה השכירות.","כן, כי השוכר הוא בגדר קונה משנה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2014-10#24","e":7,"n":24,"s":"הקומה העליונה בבניין משרדים גבוה היא בבעלות משרד הביטחון ומשמשת כמשרד.הגג צמוד בטאבו למשרד זה, והוקם עליו מנחת למסוקים. כיום משרד הביטחון מעוניין למכור את המקרקעין.שאול, המתווך המשווק את הנכס, מצא קונה המעוניין לרכוש את המשרד, וקונה אחר המעוניין לרכוש את הגג עם מנחת המסוקים שעליו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ניתן למכור את המשרד בנפרד ואת הגג בנפרד, ואין כל בעיה בכך.","ניתן למכור את המשרד בנפרד ואת הגג בנפרד אם ניתן לכך אישור של רשם המקרקעין.","לא ניתן למכור את הגג בנפרד מהמשרד, אך קונה המשרד יכול להשכיר את הגג לתקופה ארוכה ללקוח המעוניין בגג.","לא ניתן למכור או להשכיר את הגג בנפרד מהמשרד, ועל שאול למצוא קונה שיסכים לקנות את שניהם יחד."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2014-10#25","e":7,"n":25,"s":"היכן רושמים שיעבוד על דירה הרשומה בחברה המשכנת?","o":["ברשם המשכונות.","בפנקסי המקרקעין בלשכת רישום מקרקעין (טאבו).","בספרי הרשות המקומית.","במשרדי מיסוי מקרקעין."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2015-02#1","e":8,"n":1,"s":"שני בתים, שבכל אחד יש מספר דירות, נבנו כך שכל בית עומד על חלקה נפרדת. לשני הבתים יש מתקנים משותפים.\nבנסיבות העניין, האם ניתן לרשום את שני הבתים כבית משותף אחד בפנקס הבתים המשותפים?","o":["מאחר שכל בית עומד על חלקה נפרדת, לא ניתן לרשום את שני הבתים כבית משותף אחד.","ניתן לרשום את שני הבתים כבית משותף אחד רק באישור של בית המשפט.","ניתן לרשום בפנקס הבתים המשותפים את שני הבתים כבית משותף אחד.","ניתן לרשום בפנקס הבתים המשותפים שני בתים או יותר כבית משותף, רק בתנאי שהם נבנו ע\"י אותו יזם."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2015-02#2","e":8,"n":2,"s":"לקוח חתם על הזמנה לביצוע פעולות תיווך מול מתווך ובמסמך נפרד חתם על הסכם בלעדיות.\nהמתווך ביצע פעולות שיווק כנדרש בתקופת הבלעדיות, אשר כללו הצבת שלט בקירבת הנכס ופרסום מודעה בעיתון יומי נפוץ.\nעיסקה למכירת הנכס נכרתה אחרי שהסתיימה תקופת הבלעדיות.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["המתווך זכאי בכל מקרה לדמי תיווך, בין אם העיסקה נכרתה בתקופת הבלעדיות או לאחריה.","המתווך זכאי לדמי תיווך גם אם העיסקה נכרתה לאחר תקופת הבלעדיות, מכוח החזקה שהיה הגורם היעיל שהביא להתקשרות הצדדים בהסכם מחייב.","המתווך זכאי לדמי תיווך אך ורק אם העיסקה נכרתה בתקופת הבלעדיות, גם אם הוא היה הגורם היעיל שהביא להתקשרות בין הצדדים.","אם העיסקה נכרתה לאחר תקופת הבלעדיות, המתווך יהיה זכאי לדמי תיווך, בתנאי שהוכח שהוא היה הגורם היעיל שהביא להתקשרות הצדדים בהסכם מחייב."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2015-02#3","e":8,"n":3,"s":"לקוח חתם על הזמנה לביצוע פעולת תיווך עבור דירת מגורים. בהזמנה נכללו כל הפרטים הנדרשים, כפי שנקבעו בתקנות.\nהלקוח חתם בנוסף גם על מסמך נפרד המקנה בלעדיות למתווך, אולם תקופת הבלעדיות לא צוינה במסמך.\nבנסיבות העניין, מה תהיה תקופת הבלעדיות?","o":["תקופת הבלעדיות לא תעלה על שנה מיום החתימה על ההזמנה.","תקופת הבלעדיות תסתיים בתום 30 ימים מיום החתימה על ההזמנה.","לא ניתן לתת בלעדיות ללא ציון תקופת הבלעדיות, ולכן הבלעדיות בטלה.","תקופת הבלעדיות לא תעלה על שישה חודשים מיום החתימה על ההזמנה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2015-02#4","e":8,"n":4,"s":"בעל דירה בקומת הקרקע בבית משותף פלש לחצר הפרטית של גיא, שהוא בעלים של דירה נוספת באותו בית משותף. החצר מוצמדת לדירה של גיא.\nגיא מעוניין לתבוע את בעל הדירה הפולש על הסגת גבול.\nבנסיבות העניין, מי מוסמך להכריע בתביעה של גיא כנגד הפולש?","o":["רק ועד הבית של הבניין יכול להכריע בסכסוכי שכנים.","רק הממונה על רישום בתים משותפים.","רק המפקח על רישום המקרקעין.","בית משפט השלום או המפקח על רישום המקרקעין."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2015-02#5","e":8,"n":5,"s":"דייר מוגן בדירה שהייתה מושכרת בשכירות מוגנת עזב את הנכס מיוזמתו. לדירה יש כניסה נפרדת, מטבח נפרד ושירותים נפרדים.\nבעל הנכס, שהוא אדם פרטי, מעוניין להשכיר את הדירה מחדש.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["בעל הנכס מחויב להציע את הדירה בשכירות מוגנת למשך תקופה של 3 חודשים, ואם לא יצליח למצוא שוכר, יוכל להשכיר את הדירה בשכירות לא מוגנת.","כל דייר אשר יהיה מעוניין בדירה זכאי לבחור האם לשלם דמי מפתח ולהיכנס לדירה כדייר מוגן או לשכור אותה בשכירות לא מוגנת, ולבעל הבית אין זכות להתנגד לבחירה של השוכר.","בעל הנכס לא מחויב להציע את הדירה בשכירות מוגנת.","בעל הנכס חייב להציע את הנכס בדמי מפתח ולשכירות מוגנת בלבד."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2015-02#6","e":8,"n":6,"s":"שמואל, שהחל ללמוד בחיפה, ביקש לחתום על חוזה שכירות למשך כל שנות לימודיו (ארבע שנים).\nבנסיבות העניין, האם עיסקה זו טעונה רישום בלשכת רישום המקרקעין והאם ההתחייבות לביצוע העיסקה טעונה מסמך בכתב?","o":["השכירות טעונה רישום, וההתחייבות לביצוע העיסקה טעונה מסמך בכתב.","השכירות לא טעונה רישום, וההתחייבות לביצוע העיסקה טעונה מסמך בכתב.","השכירות טעונה רישום, וההתחייבות לביצוע העיסקה לא טעונה מסמך בכתב.","השכירות לא טעונה רישום, וההתחייבות לביצוע העיסקה לא טעונה מסמך בכתב."],"c":[3],"a":false,"note":"","sub":"r_rent"},{"id":"2015-02#7","e":8,"n":7,"s":"לדירה בבית משותף מוצמדת חניה ברישום המקרקעין. בעל הדירה מעוניין למכור את החניה בלבד, ללא הדירה שאליה החניה צמודה.\nבנסיבות העניין, האם ניתן למכור את החניה הצמודה בנפרד מהדירה?","o":["הדבר לא אפשרי כלל, כיוון שהחנייה מהווה חלק בלתי נפרד מהדירה.","אם רוב של דיירי הבניין יאשרו את המכירה, ניתן יהיה למכור את החניה בלבד לכל צד שלישי.","ניתן למכור את החניה לדירה באותו בניין או בבית משותף סמוך, ולא נדרשת הסכמת הדיירים בבניין.","ניתן למכור את החניה רק לדירה אחרת באותו בית משותף, ובכפוף לזכות הדיירים האחרים להשמיע את טענותיהם ביחס למכירה."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2015-02#8","e":8,"n":8,"s":"ועדה מקומית הכינה תוכנית מיתאר מקומית ובמסגרתה היא מבקשת להפקיע מקרקעין לצרכים שונים.\nבנסיבות אלה, לאילו צרכים מותר לוועדה המקומית להפקיע מקרקעין?","o":["לוועדה המקומית אסור להפקיע מקרקעין, רק לוועדה מחוזית מותר.","הוועדה המקומית יכולה להפקיע מקרקעין לכל מטרה ראויה.","הוועדה המקומית יכולה להפקיע מקרקעין לצורכי ציבור.","הוועדה המקומית לא יכולה להפקיע מקרקעין ורק שר הפנים יכול."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2015-02#9","e":8,"n":9,"s":"בעלי דירות בבית משותף החליטו להוציא חלקים מהגינה המהווה רכוש משותף ולהצמידם לדירה מסוימת כחניה.\nבנסיבות העניין, האם הדבר אפשרי ואיזה רוב של בעלי הדירות צריך להסכים לכך?","o":["הדבר אפשרי, ונדרשת הסכמה של רוב בעלי הדירות.","הדבר אפשרי, ונדרשת הסכמת כל בעלי הדירות.","הדבר אפשרי, ונדרשת הסכמת בעלי הדירות ששני שלישים מהרכוש המשותף מוצמדים לדירותיהם.","אסור להוציא חלקים מהרכוש המשותף ולהצמידם לדירה מסוימת."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2015-02#10","e":8,"n":10,"s":"חברה העוסקת במתן שירותי תיווך דרשה מהקונה דמי תיווך בגין רכישת וילה בהתאם להסכם תיווך החתום ביניהם.\nהקונה טען כי רכש את הווילה באמצעות חברת תיווך אחרת, עימה התקשר הקונה בשלב מאוחר יותר, ולכן הוא פטור מתשלום דמי תיווך למתווך הראשון.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["רק המתווך הראשון זכאי לעמלת תיווך.","אם הצטרף מתווך נוסף לעיסקה, המתווך הראשון לא זכאי לדמי תיווך.","במצב של מתווך נוסף, תמיד יחלקו המתווכים את שכר הטרחה ביניהם בחלקים שווים.","המתווך הראשון יכול להיות זכאי לדמי תיווך אם בית המשפט יקבע כי הוא שימש כגורם יעיל ליצירת ההתקשרות."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2015-02#11","e":8,"n":11,"s":"חברה מכרה נכס למשה שלא רשם הערת אזהרה. הנכס נמכר פעם נוספת לגיל אשר רשם הערת אזהרה, אך הנכס טרם נרשם על שמו, גיל אינו יודע שהנכס נמכר קודם למשה.\nמשה פנה לבית המשפט בבקשה שבית המשפט יצהיר כי הוא בעל הזכות במקרקעין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכותו של משה עדיפה תמיד.","זכותו של גיל עדיפה תמיד.","זכותו של משה עדיפה עקרונית, אך בנסיבות מסוימות רשאי בית המשפט לקבוע שאי רישום הערת אזהרה מהווה חוסר תום לב מצד משה ולכן לתת עדיפות לזכותו של גיל.","הדירה תהיה שייכת למשה וגיל."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2015-02#12","e":8,"n":12,"s":"מתווכת הבטיחה ללקוחות בהתאם לבקשתם למצוא עבורם בית \"ללא פגמים\" ו\"ללא הפתעות\". הלקוחות העידו על עצמם כקונים חסרי ניסיון.\nהמתווכת לא בדקה את מצב הדירה שהציגה בפני הלקוחות, לאחר חתימת ההסכם התברר כי חלק מהדירה נבנה ללא היתר.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["בית המשפט עשוי לשלול את הזכות של המתווכת לדמי תיווך.","המתווכת לא זכאית לדמי תיווך אם העיסקה בוטלה, אך אם העיסקה מתקיימת המתווכת תהיה זכאית לדמי תיווך.","המתווכת לא תהיה זכאית לתשלום דמי תיווך רק אם הצדדים לא יוצגו על ידי עורכי דין.","לא ניתן אף פעם לצפות ממתווך שיידע שחלק מדירה הוא ללא היתר - נושא זה הוא באחריות הבלעדית של עורכי הדין אשר ייצגו את הצדדים בעיסקה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2015-02#13","e":8,"n":13,"s":"מרינה רוצה למכור נכס שלה. בבדיקה של נסח רישום המקרקעין התברר כי הדירה היא בבעלות קרן קיימת לישראל ומוחכרת דרך מינהל מקרקעי ישראל למרינה.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["יתכן שמרינה תצטרך לשלם דמי הסכמה למינהל כתנאי לאישור העיסקה.","יתכן שמרינה תצטרך לשלם מס שבח למינהל כתנאי לאישור העיסקה.","אין לעניין זה כל חשיבות ומרינה יכולה למכור את הנכס ללא צורך בתשלום כלשהו למינהל.","יתכן שמרינה תצטרך לשלם היטל השבחה למינהל כתנאי לאישור העיסקה."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2015-02#14","e":8,"n":14,"s":"טל וגל בעלים במשותף של חלקת מקרקעין. השתיים חתמו על חוזה שותפות.\nבחוזה הוסכם כי \"אין ביכולתו של צד לחוזה זה לפרק את השותפות\", וכי \"תוקף חוזה זה - 5 שנים\".  לאחר 4.5 שנים, גל מעוניינת בפירוק השותפות באופן מיידי.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["גל תפרק באופן עצמאי את השותפות מאחר שהיא זכאית לעשות זאת בכל עת, ואין כל תוקף לסעיף הגבלת הפירוק בחוזה.","גל תיאלץ לבקש את אישור המפקח על המקרקעין, שהחלוקה תואמת את חוק התכנון והבנייה, ורק לאחר מכן תוכל לדרוש את פירוק השותפות.","גל תיאלץ לפנות לבית-המשפט כדי שיצווה על פירוק השיתוף, במידה והפירוק ייראה לבית משפט צודק בנסיבות העניין.","גל לא יכולה לפרק את השותפות כל זמן שהתניה השוללת זאת עומדת בתוקף."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2015-02#15","e":8,"n":15,"s":"חן, הידועה בציבור של אסף, עברה להתגורר עימו בדירה אותה שכר כדייר מוגן. לאחר כחמש שנים בה התגוררו יחדיו בדירה, נפטר אסף.\nהאם בנסיבות העניין חן תיהפך ל\"דיירת מוגנת\" בדירה מכוח חוק הגנת הדייר? מדוע?","o":["לא, חן לא עונה על ההגדרה של \"בן – זוג\" ולכן לא תיהפך לדיירת מוגנת בדירה.","לא, לאחר מותו של אסף זכויותיו בדירה חוזרות אוטומטית לבעליה.","כן, חן התגוררה עם אסף למעלה משישה חודשים לפני מותו, ונחשבת לבת-זוגו.","לא, רק ילדיו של אסף יכולים להיהפך לדיירים מוגנים בדירה עם מותו."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2015-02#16","e":8,"n":16,"s":"איתמר וניצן החליטו לשכור יחידת דיור המהווה חלק מווילה במושב בית-זית. האם עיסקה זו תקפה?","o":["לא, אין תוקף לעיסקה בחלק מסוים במקרקעין.","כן, ניתן לעשות עיסקת שכירות גם בחלק מהמקרקעין.","לא, רק זיקת הנאה מקנה זכות בחלק מהמקרקעין.","כן, מכיוון ש\"יחידת הדיור\" תשמש את בני-הזוג למגורים."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2015-02#17","e":8,"n":17,"s":"יהורם ורונית הם בני זוג נשואים המתגוררים יחדיו בדירה שבבעלותם המשותפת. יהורם החליט להעניק במתנה את זכויותיו בדירה לבת שלו מנישואיו הקודמים.\nבנסיבות העניין, האם על יהורם להציע את זכויותיו בדירה לרונית בטרם יעניק אותן לבת שלו?","o":["כן, לרונית יש זכות קדימה.","לא, זכות קדימה לא חלה על מתנות.","לא, זכות קדימה חלה רק על משק חקלאי, ואילו בענייננו מדובר בדירת מגורים.","יהורם לא יכול להעניק את הזכויות לבת שלו, מכיוון שאין תוקף לעיסקה בחלק מסוים במקרקעין."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2015-02#18","e":8,"n":18,"s":"דני כרת חוזה עם רוני הקבלן לרכישת דירה בפרויקט של רוני. בחוזה נקבע שרוני המוכר מתחייב למסור את החזקה בדירה לדני בתאריך 01/01/2014, אולם בפועל החזקה בדירה נמסרה לדני רק ב- 14/05/2014.\nבנסיבות העניין, האם דני זכאי לפיצוי?","o":["כן, גם ללא הוכחת נזק.","כן, אולם רק אם יוכיח את הנזק שנגרם לו בשל האיחור.","לא, מכיוון שלא עברו שישה חודשים מהמועד שנקבע בחוזה למסירת הדירה.","לא, מכיוון שבחוזה המכר לא הוסכם על פיצוי כלשהו בשל איחור במסירת הדירה."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2015-02#19","e":8,"n":19,"s":"לאחר שעדי המתווכת הראתה לאבנר הלקוח דירה להשכרה, אבנר ביקש ממנה לסייע לו בבחינת תנאי חוזה השכירות עליו רצה לחתום.\nעדי החלה למחוק מהחוזה מספר סעיפים בטענה שאסור לכתוב אותם מבחינה חוקית. אבנר והמשכיר חתמו על החוזה שתוקן על ידי עדי.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["עדי תיווכה בין הצדדים ולכן היא זכאית בכל מקרה לדמי התיווך שלה.","עדי ערכה את חוזה השכירות ולכן היא לא זכאית לדמי התיווך.","עדי הייתה רשאית לתקן את חוזה השכירות ולכן היא זכאית לתשלום דמי תיווך.","אמנם עדי ביצעה עבירה פלילית, אך היא עדיין זכאית לתשלום דמי התיווך."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2015-02#20","e":8,"n":20,"s":"ליעל דירה ומחסן בבניין המשמש גם למגורים. מאחר שהייעוד של המחסן הוא איחסון בלבד, יעל מבקשת לקבל אישור מגורים גם במחסן.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["יעל צריכה לבקש אישור לשימוש חורג במחסן.","יעל צריכה לשלם דמי הסכמה עבור השימוש במחסן ואז לא יידרש אישור נוסף.","מאחר שהבניין משמש גם למגורים, יעל יכולה להשתמש במחסן לצורכי מגורים ללא צורך באישור נוסף.","יעל צריכה לבקש הקלה מהוועדה המחוזית לתכנון ובנייה."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2015-02#21","e":8,"n":21,"s":"בבעלות משה שתי דירות. משה רוצה למכור את הדירה הזולה מבין השתיים.\nאיזה מס יתכן שמשה יצטרך לשלם בעת המכירה?","o":["אין מיסים במכירה של דירת מגורים.","מס שבח.","מס רכישה.","מס מכירה."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2015-02#22","e":8,"n":22,"s":"חברת \"חידוש שכונות\" בע\"מ מקימה פרויקט בנייה חדש ביבנה.\nיערה, השוקלת לקנות דירה בפרויקט, ביקשה לדעת האם יוצמדו לדירה חניה מקורה ומחסן.\nנציג החברה השיב ליערה כי יוצמד לדירה מחסן אבל עדיין לא הוחלט מה יהיה שטחו, ושנכון למועד חתימת החוזה עדיין לא הוחלט האם לדירה אותה היא מבקשת לקנות תוצמד חניה מקורה או חניה לא מקורה, והדבר יוחלט בהמשך.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["החברה לא מחויבת לציין במפרט מה שטח המחסן ולא מחויבת לציין האם תוצמד לדירה חניה מקורה.","החברה מחויבת לציין במפרט מה שטח המחסן, אבל היא לא מחויבת לציין האם תוצמד חניה מקורה.","החברה לא מחויבת לציין במפרט מה שטח המחסן, אבל מחויבת לציין האם תוצמד לדירה חניה ובאיזה שטח.","החברה מחויבת לציין במפרט מה שטח המחסן והאם תוצמד לדירה חניה מקורה ובאיזה שטח."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2015-02#23","e":8,"n":23,"s":"יונית הגישה בקשה להקלה לוועדה מקומית בפרויקט שהיא מבקשת להקים. להפתעתה סירבה הוועדה המקומית לאשר את ההקלה.\nבנסיבות העניין, מה יכולה יונית לעשות?","o":["יונית יכולה להגיש התנגדות לוועדת המשנה להתנגדויות של הוועדה המחוזית.","יונית יכולה להגיש ערר לוועדת הערר במחוז.","יונית יכולה רק לפנות לבית המשפט.","מאחר שמדובר בהקלה ולא בתוכנית חדשה, החלטת הוועדה המקומית היא סופית ויונית אינה יכולה לעשות דבר."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2015-02#24","e":8,"n":24,"s":"מירי ונירית הן אחיות, אשר ירשו במשותף שתי דירות זהות, הממוקמות באותו בניין ובאותה קומה.שתי הדירות נרשמו על שם שתי האחיות בחלקים שווים ולא נחתם ביניהן הסכם שיתוף.\n5 שנים לאחר שהדירות נרשמו על שמן, רוצה נירית למכור את זכויותיה בשתי הדירות.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["נירית יכולה למכור את חלקה בדירות אך ורק בהסכמתה של מירי או למירי עצמה, משום שאי אפשר לחייב את מירי להיות שותפה בנכס עם אדם זר.","נירית יכולה למכור את חלקה בדירות למי שתרצה, אך למירי תהיה זכות קדימה לרכישת הדירות בכל מחיר אשר עליו יוסכם עם הרוכש.","נירית יכולה למכור את חלקה בשתי הדירות ללא הגבלה.","מאחר ששתי הדירות זהות, נירית יכולה להחליט על דעת עצמה שהיא הבעלים של דירה אחת ומירי תקבל את הדירה השנייה ולכן היא יכולה למכור ללא צורך בקבלת הסכמת מירי."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2015-02#25","e":8,"n":25,"s":"עלי הוא בעלים של שדה. בעקבות הליכי הסדר במקרקעין אישר מפקח לרשום את הקרקע בפנקסים אצל רשם המקרקעין, אך עלי סבור שהרישום שגוי והשטח השייך לו גדול יותר.\nבנסיבות העניין, מה יכול עלי לעשות?","o":["עלי יכול להגיש ערר לממונה על המרשם.","עלי יכול להגיש ערר ישירות לבית המשפט המחוזי.","עלי יכול להגיש ערר לוועדה המחוזית לתכנון ולבנייה.","עלי יכול להגיש ערר לשר הפנים."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2015-04#1","e":9,"n":1,"s":"משה חתם על חוזה פיתוח עם מינהל מקרקעי ישראל, במסגרתו הוקצתה לו קרקע והוא התחייב לבנות עליה בתוך שנתיים בניין מגורים.\nמתי יוכל משה לחתום על חוזה החכירה עם מינהל מקרקעי ישראל?","o":["משה יוכל לחתום על חוזה החכירה בכל עת שירצה, אחרי חתימת חוזה הפיתוח.","משה יוכל לחתום על חוזה החכירה אחרי שיתחיל בבנייה.","משה יוכל לחתום על חוזה החכירה אחרי שיסיים את הבנייה ויעמוד בכל תנאי חוזה הפיתוח.","משה יוכל לחתום על חוזה החכירה בתום השנתיים שנקבעו בחוזה הפיתוח, או כאשר המבנה חובר למים וחשמל, לפי המוקדם."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2015-04#2","e":9,"n":2,"s":"מתן הוא הבעלים של דירת סטודיו המשמשת למגורים, והיא הדירה היחידה שבבעלותו.הוא חתם על הזמנה לקבלת שירותי תיווך למכירת דירתו מרבקה המתווכת.ההזמנה כללה את כלל הפרטים הנדרשים כקבוע בתקנות. מתן החליט לתת לרבקה בלעדיות וחתם על כך במסמך נפרד, שבו נקבעה תקופת בלעדיות של 14 חודשים.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["הצדדים רשאים להסכים ביניהם על כל תקופת בלעדיות שירצו.","תקופת בלעדיות למכירת דירת מגורים היא עד 6 חודשים מיום ההזמנה.","לא ניתן לתת בלעדיות למכירת דירות סטודיו.","תקופת הבלעדיות במכירת דירת מגורים לא תעלה על שנה מיום החתימה על ההזמנה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2015-04#3","e":9,"n":3,"s":"ירון ושלומית הם בני זוג ובעלים משותפים של בית יוקרתי בקיסריה, שבו הם גרים.השניים החליטו להתגרש, וירון מעוניין למכור את חלקו בבית לחברו אביב. שלומית מעוניינת לקנות את חלקו של ירון ולהמשיך להתגורר בבית לבדה.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["ירון חייב להציע את חלקו בדירה לשלומית במחיר שיקבע, אך אם שלומית תסרב לשלם סכום זה, יוכל למכור את חלקו לאביב במחיר המבוקש או במחיר גבוה יותר.","ירון יכול למכור את הדירה למי שירצה, ללא כל הגבלה.","ירון חייב למכור את הדירה לשלומית במחיר שיקבע שמאי מוסמך. רק אם שלומית תסרב לשלם מחיר זה, רשאי ירון למכור את הדירה לאביב בכל מחיר שירצה.","ירון אינו יכול למכור את זכויותיו כלל עד שיושלמו הליכי הגירושין, ואז יוכל למכור את חלקו למי שירצה."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2015-04#4","e":9,"n":4,"s":"עירית ויוסי כרתו חוזה למראית עין בלבד, לפיו עירית מוכרת ליוסי את דירתה.אורנה, שלא ידעה שמדובר בחוזה למראית עין, חתמה עם יוסי על הסכם לשכירת הדירה לשנתיים.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["חוזה למראית עין הוא חוזה בטל. לכן, יוסי אינו יכול להשכיר לאורנה דירה שאינה שלו ואין כל תוקף להסכם שחתם עם אורנה.","גם חוזה למראית עין הוא חוזה תקף. לכן, יוסי יכול להשכיר את הדירה לאורנה.","אורנה תוכל לשכור את הדירה בהתאם לחוזה עם יוסי אך ורק אם עירית תסכים לכך.","אם אורנה שכרה את הדירה מיוסי בתום לב ובהסתמך על החוזה בין עירית ויוסי, לא ניתן לפגוע בזכויותיה."],"c":[3],"a":false,"note":"","sub":"c_form"},{"id":"2015-04#5","e":9,"n":5,"s":"דיירים בבית משותף מעוניינים להתקין מעלית ברכוש המשותף.אם לא נקבע אחרת בתקנון הבית המשותף, מהו הרוב הדרוש להחלטה כזו באסיפה הכללית?","o":["נדרש רוב בעלי דירות שבבעלותם למעלה מ- 50% מהדירות בבית המשותף.","נדרשת הסכמתם של כל בעלי הדירות בבית המשותף.","נדרשת הסכמתם של הבעלים של לפחות 75% מהדירות בבית המשותף.","נדרשת הסכמתם של הבעלים של לפחות שני שלישים מהדירות בבית המשותף."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2015-04#6","e":9,"n":6,"s":"יעל, מיכל ויאיר הם מתווכים מורשים במקרקעין. הם מעוניינים לעבוד יחדיו בתיווך מקרקעין במסגרת חברה שיקימו.\nבנסיבות העניין, איזה מן המשפטים הבאים נכון?","o":["מתווכי מקרקעין רשאים לעבוד במסגרת חברה, ולא נדרשים לקבל רישיון עסק.","מתווכי מקרקעין רשאים לעבוד במסגרת חברה, אך החברה נדרשת לקבל רישיון עסק מהרשות המקומית שבה היא מפעילה את העסק.","מתווכי מקרקעין כלל אינם רשאים לעבוד במסגרת חברה, משום שחברה אינה יכולה לקבל רישיון תיווך.","מתווכי מקרקעין רשאים לעבוד במסגרת חברה, אך החברה נדרשת לקבל רישיון עסק מרשם המתווכים במקרקעין."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2015-04#7","e":9,"n":7,"s":"יואל נפטר, ובצוואתו הוריש שתי דירות שבבעלותו לילדיו, נועם ועומר, ואף קבע שעומר ימונה למנהל העיזבון.\nאלמנתו של יואל, חנה, מתגוררת באחת הדירות והיא מסוכסכת עם עומר, ועל כן חוששת שאם הוא ימונה למנהל העיזבון הוא יפגע בזכויותיה.\nבנסיבות העניין, איזה מן המשפטים הבאים נכון?","o":["בנסיבות העניין, כלל אין צורך למנות מנהל עיזבון ולכן אין לחנה ממה לחשוש.","מנהל עיזבון ממונה תמיד על ידי בית המשפט או הרשם לענייני ירושה, לפי שיקול דעתם המוחלט, ולכן צוואתו של יואל אינה רלוונטית.","בית מהמשפט או הרשם לענייני ירושה ימנו את עומר כמנהל עיזבון, אלא אם יוכח שיש סיבות מיוחדות המצדיקות שלא למנותו.","בית המשפט או הרשם לא מוסמכים לבטל את רצונו של המוריש, ולכן אם עומר מוכן לקבל על עצמו את תפקיד מנהל העיזבון, חובה על בית המשפט או הרשם למנותו לתפקיד."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2015-04#8","e":9,"n":8,"s":"לפרויקט בנייה בגבעתיים ניתן ליווי פיננסי מטעם \"בנק העסקים לישראל \".הקבלן נקלע לקשיים, ועל מנת לסיים את הפרויקט מהר ככל שאפשר החליט להוציא לרוכשים שוברים לתשלום שבהם נרשם מספר חשבון בנק אחר המצוי בבעלותו, במקום מספר חשבון הליווי של הפרויקט.הקבלן מסר את השוברים לרוכשי הדירות, אך טרם שולמו בפועל כספים לחשבון.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["מאחר שטרם שולמו בפועל כספים, לא בוצעה כל עבירה.","הקבלן ביצע עבירה לפי חוק המכר (דירות) (הבטחת השקעות של רוכשי דירות), אך לא לפי חוק העונשין.","הקבלן ביצע, בין היתר, עבירה של קשירת קשר להונות לפי חוק העונשין.","הקבלן ביצע, בין היתר, עבירות של זיוף מסמך בכוונה לקבל באמצעותו דבר ושימוש במסמך מזויף לפי חוק העונשין."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2015-04#9","e":9,"n":9,"s":"ועדה מחוזית אישרה תוכנית מיתאר מחוזית אשר חלה על שטח שיפוט של מספר ועדות מקומיות, ודרשה מן הוועדות המקומיות להפקיע בתוך שנה קרקעות שונות, בהתאם לתוכנית המיתאר החדשה.אחרי שנה, נוכחה הוועדה המחוזית שוועדה מקומית מסוימת לא ביצעה את ההפקעות כנדרש.\nבנסיבות העניין, מה מוסמכת הוועדה המחוזית לעשות?","o":["הוועדה המחוזית יכולה לקנוס את הוועדה המקומית, ולהמשיך לקנוס אותה כל עוד לא תקיים את דרישותיה.","הוועדה המחוזית רשאית להפעיל את סמכויות הוועדה המקומית ולהפקיע במקומה את הקרקע.","הוועדה המחוזית יכולה לפנות למועצה הארצית לתכנון ובנייה על מנת שתוציא צווי קיום לוועדה המקומית.","הוועדה המחוזית יכולה רק לפנות לבית המשפט ולבקש לאכוף על הוועדה המקומית לבצע את ההפקעה."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2015-04#10","e":9,"n":10,"s":"שמעון חכר חלקת קרקע ממינהל מקרקעי ישראל, לבניית וילה פרטית ביישוב כפרי. בהתאם לתוכנית שחלה על הקרקע בזמן כריתת החוזה, הוגדר בחוזה במפורש שמותרת בנייה בשטח של עד 140 מ\"ר.במהלך הבנייה אושרה תוכנית חדשה, המאפשרת הגדלה של זכויות הבנייה בחלקה עד לשטח של 190 מ\"ר.\nאיזה תשלום יצטרך שמעון לשלם למינהל מקרקעי ישראל, על מנת שהמינהל יאשר לו לבנות בהתאם לתוכנית החדשה?","o":["כדי לקבל את הסכמת מינהל מקרקעי ישראל להגדלת הבנייה, על שמעון לשלם למינהל דמי היתר.","כדי לקבל את הסכמת מינהל מקרקעי ישראל להגדלת הבנייה, על שמעון לשלם למינהל דמי הסכמה.","שמעון לא יידרש לשלם תשלום נוסף למינהל.","כדי לקבל את הסכמת מינהל מקרקעי ישראל להגדלת הבנייה, על שמעון לשלם למינהל היטל השבחה."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2015-04#11","e":9,"n":11,"s":"דודו הוא דייר מוגן בנכס מסחרי, בו הוא מפעיל מוסך . דודו החליט שברצונו לעזוב את הנכס, והוא מחפש דייר שיחליף אותו.חברת \"אפולו מוסכים\" בע\"מ, שהיא גוף מאוגד לפי חוק החברות, אשר מעוניינת בנכס מזה זמן רב, פנתה אל דודו וביקשה להיכנס כדיירת מוגנת במקומו ולהמשיך להפעיל את המוסך במקום.בעל הנכס, מר ירושלמי, מסרב לקבל את חברת \"אפולו מוסכים\" בע\"מ כדיירת במקום דודו, וטוען שאינו מוכן לקבל חברה בע\"מ כדייר מוגן בנכס שלו.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["על מר ירושלמי לאפשר את החלפת הדיירים, שכן גם הדייר היוצא וגם הדייר המוצע עוסקים בתחום המוסכים.","מר ירושלמי רשאי להתנגד להחלפת הדיירים אך ורק מטעם סביר, ואילו הסירוב לקבל חברה בע\"מ כדייר מוגן הוא שרירותי ואינו סביר.","בנסיבות העניין, סירובו של בעל הנכס הוא מטעם סביר.","לבעל הנכס אין כלל זכות על פי החוק לסרב להחלפת דיירים, כל עוד הוא מקבל את חלקו בדמי המפתח."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2015-04#12","e":9,"n":12,"s":"עורך הדין מנשה מונה ככונס נכסים מטעם בית המשפט לשם מכירת נכס של קבלן שפשט רגל.לאחר שהנכס נמכר, גילה הקונה כי קיימים בדירה ליקויי בנייה חמורים, וברצונו לתבוע את כונס הנכסים בגין אי גילוי מידע, על פי סעיף 4 לחוק הגנת הצרכן.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הקונה יכול לתבוע את כונס הנכסים, ולא תעמוד לכונס כל הגנה על-פי דין.","הקונה יכול לתבוע את כונס הנכסים רק אם יקבל את אישור בית המשפט שמינה את הכונס להגיש תביעה.","לא ניתן לתבוע את כונס הנכסים בשום מקרה, שכן עומדת לו הגנה על פי דין, בשל היותו כונס נכסים הפועל במינוי בית המשפט.","לכונס הנכסים עומדת הגנה על פי דין, בהיותו כונס נכסים, כל עוד לא ידע על ליקויי הבנייה ובתנאי שציין בהצעה למכירת הדירה, כי אין לו ידיעה על מצב הנכס וכי לא יישא באחריות."],"c":[3],"a":false,"note":"","sub":"k_consumer"},{"id":"2015-04#13","e":9,"n":13,"s":"ליאת המתווכת הועמדה לדין משמעתי על פי חוק המתווכים לאחר שלקוח התלונן נגדה.ועדת המשמעת קבעה שליאת ביצעה עבירת משמעת והחליטה להתלות את רישיונה לתקופה של חצי שנה.ליאת מעוניינת לערער על ההחלטה.\nבפני מי יכולה ליאת לערער?","o":["בפני בית המשפט המחוזי.","בפני בית משפט השלום.","בפני רשם המתווכים במשרד המשפטים.","בפני הממונה על הגנת הצרכן."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2015-04#14","e":9,"n":14,"s":"שרגא מעוניין לשפץ את דירתו ולשנות את החלוקה הפנימית בדירה, מבלי לבצע שינוי בשלד הבניין.\nבאילו נסיבות יידרש שרגא להוציא היתר בנייה לשיפוץ?","o":["יש צורך בהיתר בנייה רק אם העבודות דורשות שינוי בקיר חיצוני של הבניין.","יש צורך בהיתר בנייה אם לצורך ביצוע העבודות יידרשו הפועלים לעבור ברכוש המשותף של הבניין.","יש צורך בהיתר בנייה אם השיפוץ כולל שינוי בקיר חיצוני של הבניין או של הדירה.","יש צורך בהיתר בנייה רק להקמת בניין חדש."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2015-04#15","e":9,"n":15,"s":"יואלה שוקלת לרכוש חלקה, אשר עובר בה שביל המוביל לחלקה סמוכה ורשומה ביחס אליו זיקת הנאה לטובת החלקה האחרת.יואלה, שרואה שהשביל במצב מוזנח, חוששת שתידרש להוציא כספים לתיקונו.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["זיקת ההנאה שבה חלקה מסוימת הינה מקרקעין כפופים עשויה לקבוע שבעל הקרקע חייב לתקן את השביל המוביל לחלקה האחרת.","לבעל הקרקע תמיד זכות מוחלטת להחליט האם לתקן את השביל.","לא ניתן בזיקת הנאה לכפות על בעל הקרקע לתקן את השביל, אך ניתן לקבוע שאסור יהיה לבעל הקרקע הכפופה למנוע מבעל זיקת ההנאה לתקן את השביל, בתנאי שיישא בכל העלויות.","זיקת הנאה יכולה לקבוע שבעל הקרקע חייב לתקן את השביל רק אם זיקת ההנאה היא לטובת כלל הציבור ולא לטובת אדם או אנשים מסוימים."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2015-04#16","e":9,"n":16,"s":"שי, שהוא מתווך חדש באזור ראשון לציון, פנה אל שירה, שהיא מתווכת ידועה בראשון לציון, והציע לה לשתף פעולה במכירת וילה אשר לקוחות של שי ביקשו ממנו למכור.שי ושירה הסכימו בעל פה על תנאי שיתוף הפעולה ביניהם אבל לא חתמו הסכם בכתב.אחרי כחודש מצאה שירה קונה לדירה וגבתה את דמי התיווך מהמוכר ומהקונה.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["שי לא היה גורם יעיל בעיסקה, ולכן הוא לא זכאי לקבל חלק מדמי התיווך.","שי היה גורם יעיל בעיסקה, אבל מאחר שלא נחתם מולו הסכם בכתב, הוא לא זכאי לקבל את חלקו בדמי התיווך שניגבו על ידי שירה.","אין דרישה בחוק כי הסכם שיתוף פעולה בין מתווכים ייערך בכתב ולכן שי זכאי לקבל את חלקו בדמי התיווך ששירה גבתה.","שי אינו זכאי לדמי תיווך משירה, אך הוא יכול לתבוע את הקונה והמוכר שישלמו לו את חלקו."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2015-04#17","e":9,"n":17,"s":"בהסכם למכירת חנות נקבע פיצוי מוסכם למקרה של הפרה בגובה של 150,000 ש\"ח.כתוצאה מהפרה יסודית של ההסכם על ידי הקונה, נגרמו למוכר נזקים בשיעור של 250,000 ש\"ח.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["אי אפשר לתבוע סכום פיצוי הגבוה מסכום הפיצוי המוסכם שנקבע בהסכם.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם רק אם הצדדים קבעו כך מראש בהסכם ביניהם.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם רק אם הפיצוי המוסכם עומד על פחות מעשרה אחוזים משווי העיסקה."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2015-04#18","e":9,"n":18,"s":"בבניין מגורים בן 12 דירות ברחובות, הרשום כבית משותף, החליטו תשעה מבעלי הדירות להצמיד את המקלט המשותף של הבניין לדירתם של חיים ורינה, לאור הסכמתם של חיים ורינה לדאוג לתחזוקה השוטפת של המקלט. חדוה, בעלת הדירה בקומה האחרונה, מתנגדת נמרצות וטוענת שהדבר בלתי אפשרי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חדוה צודקת, לא ניתן להצמיד את המקלט לדירה מסויימת.","חדוה טועה, מכיוון שבעלי יותר משני שלישים מהדירות מסכימים להצמיד את המקלט לדירתם של חיים ורינה.","חדוה צודקת, מכיוון שנדרש כי כל בעלי הדירות בבניין יסכימו להצמדת המקלט לדירה.","ניתן להצמיד מקלט משותף לאחת הדירות רק אם התקנון המוסכם בבניין מאפשר זאת מפורשות."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2015-04#19","e":9,"n":19,"s":"אם אדם שוכר מקבלן דירה חדשה לתקופה של 20 שנים, האם חייב הקבלן לצרף מפרט?","o":["כן, בכל עיסקת שכירות של דירה חדשה מקבלן, המשכיר חייב לצרף מפרט.","לא.","יש לצרף מפרט, אלא אם הוסכם אחרת בחוזה השכירות.","כן, יש לצרף מפרט בכל עיסקת שכירות של דירה חדשה מקבלן לתקופה של יותר מ- 10 שנים."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2015-04#20","e":9,"n":20,"s":"יעל ורפי התקשרו בעיסקת מקרקעין, בה יעל תמכור לרפי דירת מגורים שלאחרונה חלה עליה תוכנית מיתאר חדשה, ולכן במימוש הנכס ייתכן שתהיה חבות לשלם היטל השבחה.יעל מעוניינת שרפי ישלם את כל ההיטלים והמיסים בעיסקה, ורפי מסכים לכך.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["לגבי היטל ההשבחה הדבר אסור, אבל מותר לגבי מס שבח.","היטל השבחה הוא מס עקיף ולכן מותר \"לגלגל\" אותו על הרוכש, אבל מס שבח הוא מס אישי ולכן על יעל לשלמו.","ניתן לקבוע שרפי ישלם את כל המיסים רק אם יעל היא עצמאית הרשומה כעוסק אצל רשויות המס.","אין מניעה לקבוע שרפי ישלם את כל ההיטלים והמיסים, אולם הדבר עשוי לשנות את מחיר הרכישה לצורכי חישוב המס."],"c":[3],"a":false,"note":"","sub":"p_levy"},{"id":"2015-04#21","e":9,"n":21,"s":"דאוד הוא הבעלים של נכס מקרקעין. הנכס הופקע, ודאוד קיבל תמורתו 2 מיליון ש\"ח וכן נכס חלופי.\nהאם יחול מס שבח על ההפקעה? אם כן, על מה?","o":["יחול מס שבח מלא על התשלום הכספי בלבד.","יחול מס שבח מופחת על התשלום הכספי בלבד.","יחול מס שבח הן על התשלום הכספי והן על ערך הקרקע החלופית.","זוהי הפקעה ולא מכירה מרצון ולכן לא יחול מס שבח כלל על ההפקעה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2015-04#22","e":9,"n":22,"s":"בבית משותף גרים 5 דיירים. הזכויות בגג הבניין מוצמדות לדירה שבקומה העליונה.כעת מבקשים הדיירים לבצע חיזוק של הבניין כנגד רעידות אדמה. אחד מבעלי הדירות האחרות בבניין הוא קבלן בניין אשר קיבל בהסכמת כלל הדיירים את האחריות לביצוע העבודות.לשם ביצוע הבנייה, יש להעביר את הבעלות בגג לקבלן כדי שהוא יוכל לבנות דירות על הגג.בעלי הדירה שאליה מוצמד הגג מבקשים להעביר את הגג בלבד, כך שיירשם על שם הקבלן.\nהאם הדבר אפשרי? מדוע?","o":["לא, משהוצמד הגג הרי שהוא מהווה חלק מהדירה, ולא ניתן לעשות עיסקאות רק בחלק מהדירה.","לא, יש צורך לכנס אסיפת דיירים נוספת ולהחליט ברוב רגיל על הצמדה מחדש של הגג.","כן, בתנאי שהזכויות בגג יועברו ללא תמורה ובעלי הגג הקודמים לא יקבלו זכויות עדיפות במהלך אישור הפרויקט.","כן, בתנאי שיתוקן צו הרישום ושיודיעו על כך לשאר בעלי הדירות בבניין ויאפשרו להם לטעון את טענותיהם."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2015-04#23","e":9,"n":23,"s":"יקיר ותמי מבקשים לרכוש דירה בבית משותף. השניים הבחינו כי בנסח רישום המקרקעין (טאבו) של הדירה הנרכשת מצוין כי קיים תקנון מוסכם בבניין זה.\nהאם עובדה זו עשויה להיות רלוונטית לבירור זכויותיהם?","o":["לא, מאחר שמדובר על מסמך פנימי של ועד הבית שבשום מקרה אינו רלוונטי לרוכשי דירה.","כן, מאחר שייתכן ומדובר במסמך מהותי המשפיע על זכויות הבעלים בדירה וברכוש המשותף.","לא, מאחר שמה שחשוב לבדוק בנסח הרישום הוא האם יש שיעבודים ואת זהות המוכר בלבד.","כן, כי אם יש תקנון מוסכם אז המוכר לא יכול למכור את זכויותיו בדירה מבלי לקבל את הסכמת כל דיירי הבית המשותף."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2015-04#24","e":9,"n":24,"s":"משה רכש דירה בבית דירות בחיפה אשר נבנה על ידי הקבלן \"תלים\" בע\"מ, וכן לקח משכנתא מבנק\"המשכן\".\nאחרי שנה, ולפני שהזכויות בדירה נרשמו בפנקסי המקרקעין , מבקש משה למכור את הדירה לדגנית.\nהיכן יכולה דגנית לבדוק את הזכויות בדירה והאם נלקחו משכנתאות על הנכס?","o":["את הזכויות בדירה ניתן לבדוק אצל רשם המקרקעין, ומשכנתאות ניתן לבדוק בחברה המשכנת.","את הזכויות בדירה ניתן לבדוק בוועדה המקומית לתכנון ובנייה, ומשכנתאות ניתן לבדוק בחברה המשכנת.","את הזכויות בדירה ניתן לבדוק בחברה המשכנת או במינהל מקרקעי ישראל, ומשכנתאות ניתן לבדוק אצל רשם המשכונות.","את הזכויות בדירה ניתן לבדוק במינהל מקרקעי ישראל בלבד, ומשכנתאות יש לבדוק אצל רשם המקרקעין."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2015-04#25","e":9,"n":25,"s":"חיים לקח משכנתא בגובה 200,000 ש\"ח לשם רכישת דירה.בטרם החזיר את מלוא ההלוואה לבנק, מבקש חיים למכור את הדירה, לקנות דירה חדשה ולגרור את המשכנתא לדירה החדשה שירכוש.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן כלל לבצע פעולה כזו.","חיים צריך להחזיר לבנק את מלוא יתרת החוב, ולקחת משכנתא חדשה על הנכס החדש שיקנה.","ניתן לבצע גרירת משכנתא לנכס החדש, בתנאי שהבנק המלווה יסכים לכך.","ניתן לבצע גרירת משכנתא לנכס החדש וכל שנדרש הוא שמוכר הדירה החדשה מסכים לכך."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2015-07#1","e":10,"n":1,"s":"יקיר ודינה הם בעלים של דירה בבית משותף. אסיפת הדיירים בבניין קיבלה החלטה כדין ובהתאם לתקנון, לפיה יבוצע שיפוץ בבניין וכל הדיירים יתחלקו באופן שווה בהוצאות השיפוץ.יקיר ודינה מתנגדים להחלטה זו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יקיר ודינה לא יכולים לעשות דבר, מאחר שהחלטת אסיפת הדיירים היא סופית ולא ניתנת לערעור.","יקיר ודינה יכולים להגיש ערר על ההחלטה ליו\"ר הוועדה המקומית לתכנון ובנייה, אשר יכול, בנסיבות מסוימות, לבטל את החלטת אסיפת הדיירים.","יקיר ודינה יכולים לפנות למפקח על הבתים המשותפים, אשר יכול, בנסיבות מסוימות, לבטל את החלטת אסיפת הדיירים.","יקיר ודינה יכולים לפנות לבית המשפט המחוזי, אשר יכול, בנסיבות מסוימות, לבטל את החלטת אסיפת הדיירים."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2015-07#2","e":10,"n":2,"s":"שלומי הוא חוכר לדורות של נכס בנהריה. הנכס רשום בלשכת רישום המקרקעין.שלומי חתם על חוזה למכירת זכויותיו בנכס לגילה. גילה מעוניינת לרשום הערת אזהרה ביחס להתחייבות של שלומי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל אפשרות למכור זכות במקרקעין שאינה זכות בעלות, ולכן אי אפשר לרשום הערת אזהרה.","מאחר ששלומי הוא לא הבעלים של הנכס, אלא רק חוכר לדורות, לא ניתן לרשום הערת אזהרה על בסיס החוזה.","ניתן לרשום הערת אזהרה בלשכת רישום המקרקעין על בסיס החוזה בין שלומי לגילה.","אפשר יהיה לרשום הערת אזהרה רק אם הבעלים הרשום של הנכס יסכים בכתב לרישום ההערה."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2015-07#3","e":10,"n":3,"s":"מיכאל גר בבית משותף. לאחרונה סובל מיכאל מבעיה בעיניו והוא מתקשה לראות בחושך, ובידיו אישורים רפואיים על כך.מיכאל רוצה להחליף, על חשבונו, את התאורה בשביל המוביל לבניין, שהוא חלק מהרכוש המשותף, בתאורה חזקה יותר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מיכאל צריך לקבל את הסכמת מחצית מהדיירים בבניין להחלפת התאורה בשביל.","מיכאל צריך לקבל את הסכמת %75 מהדיירים בבניין להחלפת התאורה בשביל.","מיכאל לא צריך לקבל את הסכמת הדיירים בבניין להחלפת התאורה בשביל.","מיכאל צריך לקבל את הסכמת כל הדיירים בבניין להחלפת התאורה בשביל."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2015-07#4","e":10,"n":4,"s":"נירית מתגוררת בבניין הרשום כבית משותף וחל בו התקנון המצוי.לאחרונה הבחינה נירית בסימני רטיבות בתקרת הדירה שלה, שמקורם בצינור שעובר ברצפת הדירה שמעליה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם יתברר כי מקור הנזילה בצנרת המשותפת של הבית המשותף, נציגות הבית המשותף אחראית לבצע כל תיקון בדירה של נירית.","נציגות הבית המשותף אחראית בכל מקרה לבצע כל תיקון בדירה של נירית כתוצאה מהנזילה.","בכל מקרה, בעלי הדירה שמעל הדירה של נירית הם האחראים לתקן את הנזקים שנגרמו לדירתה.","מאחר שנירית היא בעלת הדירה, האחריות לתיקון הנזקים בדירתה היא עליה בלבד והיא לא זכאית לתבוע את הנזק מנציגות הבית המשותף או מבעלי הדירה שמעליה."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2015-07#5","e":10,"n":5,"s":"נעמה היא מתווכת בעלת רישיון. יפית, שהיא חברה של נעמה, ביקשה מנעמה עזרה במציאת חנות מתאימה לעסק הפרחים שלה.נעמה הודיעה מראש ליפית שלא תיגבה ממנה דמי תיווך, והחתימה אותה על טופס הזמנת שירותי תיווך בהתאם. נעמה הציגה ליפית נכס, שנעמה ידעה שנבנה בניגוד להיתר בנייה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שיפית לא משלמת לנעמה דמי תיווך, נעמה לא חייבת לספר לה על הבנייה הלא חוקית בנכס.","נעמה תוכל לספר ליפית על הבנייה הלא חוקית בנכס רק אם בעלי הנכס יאשר לה זאת בכתב ומראש.","נעמה חייבת לספר ליפית רק אם ננקטו צעדים משפטיים בשל הבנייה הלא חוקית.","נעמה חייבת לספר ליפית על הבנייה הלא חוקית בנכס, ואם לא תספר לה, היא תבצע עבירת משמעת."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2015-07#6","e":10,"n":6,"s":"ירדן הוא בעלים של מגרש גדול בכניסה לירוחם. לאחרונה אושרה במקום תוכנית בנייה וירדן החליט למכור את המגרש ליזם, אשר יקים פרויקט בהתאם לתוכנית.על המגרש רשומה משכנתא לטובת בנק בסכום של 2,000,000 ש\"ח. ירדן רוצה לדעת כיצד יחושב שווי המכירה שלו לעניין מס שבח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שווי המכירה יחושב לפי שווי הנכס פחות 2,000,000 ש\"ח.","שווי המכירה יחושב לפי שווי הנכס בלבד, ללא קשר לגובה המשכנתא.","שווי המכירה יחושב לפי שווי הנכס פחות מחצית משווי המשכנתא.","שווי המכירה יחושב לפי שווי הנכס פחות סכום המשכנתא והפרשי ההצמדה והריבית עליה."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2015-07#7","e":10,"n":7,"s":"אופיר, שהוא מנהל בחברת היי-טק, החליט למכור את הווילה היוקרתית שלו.לקראת המכירה הזמין אופיר חוות דעת משמאי מומחה, ואז התברר לו להפתעתו שהווילה שלו, שאותה רכש לפני 5 שנים, נבנתה בחריגה מהותית מההיתר.\nזיו רוצה לרכוש את הווילה מאופיר. אופיר לא גילה לזיו על חוות הדעת שקיבל, וזיו רכש את הווילה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אופיר לא עבר עבירה על חוק הגנת הצרכן.","אופיר ביצע עבירה לפי חוק הגנת הצרכן ובית המשפט יכול לגזור עליו עונש מאסר בלבד.","אופיר ביצע עבירה לפי חוק הגנת הצרכן ובית משפט יכול לגזור עליו קנס בלבד.","אופיר ביצע עבירה לפי חוק הגנת הצרכן ובית משפט יכול לגזור עליו עונש מאסר או קנס."],"c":[0],"a":false,"note":"","sub":"k_consumer"},{"id":"2015-07#8","e":10,"n":8,"s":"ההוצאה לפועל מינתה כונס נכסים לדירת המגורים של ענבל, שהסתבכה בחובות. כונס הנכסים פנה למתווך אשר מצא רוכש פוטנציאלי לדירה.בטרם הושלמה העיסקה, פנה עומר לכונס הנכסים וטען שרכש את הדירה מענבל עוד לפני שמונה הכונס, אך הזכויות לא נרשמו על שמו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים נכון?","o":["מרגע שמונה כונס הנכסים, עומר לא יכול לטעון כי הדירה שייכת לו.","עומר רשאי להגיש בקשה לכונס הנכסים של ענבל שיאשר שהבית נמכר לו, ואז מינוי כונס הנכסים מתבטל באופן אוטומטי.","עומר רשאי לפנות לראש ההוצאה לפועל על מנת להגן על זכויותיו.","עומר רשאי לפנות למפקח על הבתים המשותפים כדי שיברר את הזכויות ויכריע האם הבית באמת שייך לעומר."],"c":[2],"a":false,"note":"","sub":"k_misc"},{"id":"2015-07#9","e":10,"n":9,"s":"דגנית הועסקה בסוכנות התיווך \"דירות איציק\" שבבעלותו של איציק, שהוא מתווך מורשה. לדגנית עצמה אין רישיון תיווך.במסגרת עבודתה החתימה דגנית את ירחמיאל על הזמנת שירותי תיווך למכירת דירתו, ואף הייתה הגורם היעיל במציאת הקונה שרכש לבסוף את הדירה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים נכון?","o":["דגנית עברה על החוק, בכך שעסקה בתיווך מקרקעין ללא רישיון, אולם איציק לא פעל בניגוד לחוק בכך שהעסיק אותה.","דגנית לא פעלה בניגוד לחוק המתווכים במקרקעין, מאחר שתפקידה היה מנהלתי בלבד. לעומת זאת, איציק, שהעסיק אותה, פעל בניגוד לחוק.","דגנית ואיציק פעלו בניגוד לחוק המתווכים במקרקעין.","דגנית וגם איציק לא עברו על החוק."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2015-07#10","e":10,"n":10,"s":"בשנת 2011 רכש יעקב נכס באילת עם שני שותפים .עם הרכישה, חתמו השותפים על הסכם שיתוף, שבו נקבע במפורש שאין לפרק את השותפות בנכס ב- 10 השנים הראשונות.כעת (בתחילת השנה הרביעית להסכם) נוצרו חילוקי דעות קשים בין השותפים לגבי אופן השימוש בנכס, ויעקב מעוניין לפרק את השיתוף באופן מיידי, אך השותפים האחרים מתנגדים לכך.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בנסיבות העניין, רק בית משפט יכול לאשר את פירוק השיתוף.","יעקב לא יכול לדרוש כיום את פירוק השיתוף, מאחר שטרם עברו לפחות 5 שנים ממועד החתימה על הסכם השיתוף.","יעקב יכול לדרוש כיום את פירוק השיתוף, מאחר שאין כל תוקף להגבלה על הזכות לדרוש את פירוק השיתוף לתקופה של יותר משלוש שנים.","הסכם השיתוף תקף לכל דבר ועניין, ולכן יעקב לא יוכל לדרוש את פירוק השיתוף עד שיעברו 10 שנים ממועד החתימה על הסכם השיתוף."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2015-07#11","e":10,"n":11,"s":"רמי ורינה הם בני זוג, אשר בבעלותם המשותפת שתי דירות הרשומות בחלקים שווים על שם שניהם.השניים החליטו להתגרש, ופסק הדין חילק את הרכוש כך שכל אחד מבני הזוג קיבל את אחת הדירות לבעלותו הבלעדית. אחת הדירות יקרה במידה משמעותית מן הדירה האחרת.\nבנסיבות העניין, האם ייתכן חיוב במס שבח בעת העברת הזכויות בדירות בין בני הזוג?","o":["כן כי כל העברת נכס היא אירוע מס ועשויה להיות מחויבת במס אם נוצר שבח במסגרת העברת הזכויות.","לא כי החוק פוטר ממס שבח בנסיבות אלה.","לא אולם אם יעבירו כספים ביניהם בגין ההפרש בשווי הדירות, הפרש זה חייב במס שבח.","הצד שקיבל את הדירה הזולה לא יחויב במס, אך זה שקיבל את הדירה היקרה עשוי להיות מחויב במס, אם נוצר שבח במסגרת העברת הזכויות."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2015-07#12","e":10,"n":12,"s":"יהודה , מתווך מורשה, תיווך בעיסקת מקרקעין. הצדדים היו מעוניינים לערוך זיכרון דברים ביניהם, וביקשו מיהודה סיוע. יהודה הסביר להם שאסור לו לסייע בעריכת זיכרון הדברים, אך מסר להם נוסח של זיכרון דברים שהוריד מהאינטרנט והציע להם לשנות אותו לפי צורכיהם.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יהודה פעל כדין, ואין שום מניעה שימסור נוסח סטנדרטי של זיכרון דברים לצדדים.","יהודה ביצע עבירת משמעת, אבל הדבר לא פוגע בזכותו לקבל דמי תיווך.","יהודה ביצע עבירה פלילית על פי חוק המתווכים, אבל הדבר לא פוגע בזכותו לקבל דמי תיווך.","יהודה ביצע עבירת משמעת, והוא לא יהיה זכאי לקבל דמי תיווך בעיסקה."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2015-07#13","e":10,"n":13,"s":"לבית משותף יש גינה משותפת, המתוחזקת על ידי כלל הדיירים. כיצד תיקבע חלוקת הוצאות הגינון?","o":["כל דירה תשתתף בסכום זהה, אלא אם נקבע אחרת בתקנון או על ידי אסיפת הדיירים.","שיעור ההשתתפות בהוצאות האחזקה ייקבע באופן יחסי לפי מספר החדרים בכל דירה, אלא אם נקבע אחרת בתקנון או על ידי אסיפת הדיירים.","שיעור ההשתתפות בהוצאות האחזקה יהיה בהתאם לחלק היחסי של שטח רצפת הדירה לשטח רצפת כל הדירות בבית המשותף, אלא אם נקבע אחרת בתקנון או על ידי אסיפת הדיירים.","אין בחוק התייחסות לנושא זה ולכן נדרשת, בכל מקרה, החלטה של אסיפת הדיירים או קביעה מפורשת בתקנון."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2015-07#14","e":10,"n":14,"s":"ימית היא בעלים של דירה במרכז הכרמל בחיפה. לדירה צמודות שתי חניות. ימית מעוניינת למכור אחת משתי החניות לשכן הגר בבניין ממול ואין לו חניה משלו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור למכור חניה הצמודה לדירה מבלי למכור גם את הדירה עצמה, ולכן העיסקה אינה אפשרית.","בנסיבות העניין, אין כל בעיה במכירת חניה יחידה לשכן.","ימית תוכל למכור רק את שתי החניות ביחד, אפילו אם לא מכרה את הדירה עצמה, אך לא ניתן למכור חניה יחידה.","בנסיבות המתוארות, מכירת החניה אפשרית רק בתנאי שניתנה לימית הסכמת כל בעלי הדירות שבבניין שלה מראש ובכתב."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2015-07#15","e":10,"n":15,"s":"שרה היא הבעלים של דירת מגורים הרשומה בלשכת רישום המקרקעין. על הדירה רשומה זכות קדימה לטובת אריאל.\nשרה רוצה לתת במתנה את הדירה לבת שלה, יפעת, שהגיעה כעת לגיל 18. אריאל טוען כי שרה חייבת להציע לו קודם את הדירה מכוח זכות הקדימה שלו.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["שרה לא הייתה צריכה להציע קודם את הדירה לאריאל, מאחר שאין חובה לקיים זכות קדימה כאשר המדובר במתנה.","שרה הייתה צריכה להציע קודם את הדירה לאריאל, מאחר שרשומה לטובתו זכות קדימה.","שרה לא הייתה צריכה להציע קודם את הדירה לאריאל, מאחר שלא ניתן לרשום זכות קדימה על דירת מגורים אלא רק על נכס עסקי.","שרה לא הייתה צריכה להציע קודם את הדירה לאריאל, מאחר שהחוק מאפשר להעביר נכס לבן משפחה קרוב, בתמורה או לא בתמורה, אפילו כאשר רשומה זכות קדימה על הנכס."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2015-07#16","e":10,"n":16,"s":"יואלה מעוניינת לרכוש זכויות במגרש בגליל העליון . המקרקעין לא מוסדרים ולא רשומים במרשם המקרקעין .\nהיכן יכולה יואלה לבדוק האם יש שיעבודים על המגרש?","o":["מאחר שהמקרקעין לא מוסדרים לא יהיה רישום בוועדה המקומית , ולכן על יואלה לפנות לוועדה המחוזית לתכנון ובנייה.","יואלה תוכל לבדוק האם נרשמו שיעבודים במשרדי רשם המקרקעין (טאבו).","יואלה תוכל לבדוק האם נרשמו שיעבודים אצל רשם המשכונות.","יואלה תוכל לבדוק האם נרשמו שיעבודים באמצעות החברה המשכנת."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2015-07#17","e":10,"n":17,"s":"מיכאל הוא מתווך בעל רישיון. חדוה, שבבעלותה נכס, פנתה למיכאל וסיפרה לו כי היא זקוקה בדחיפות לכסף לצורך ניתוח בחו\"ל, ולכן היא מוכנה למכור את הנכס אפילו במחיר הפסד, ובלבד שיימכר מהר ככל האפשר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מיכאל חייב לספר למתעניינים ברכישת הדירה על הניתוח של חדוה, מאחר שמדובר במידע מהותי.","מיכאל לא חייב ליידע מתעניינים בדירה במצבה של חדוה, אך חייב ליידע את הרוכש לפני החתימה על חוזה המכר.","אסור למיכאל לספר לאף אחד על הניתוח של חדוה, אלא בהסכמתה מראש.","אסור למיכאל לתווך בעיסקה, מאחר שבנסיבות העניין נוצר אצלו עניין אישי."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2015-07#18","e":10,"n":18,"s":"חברת \"מגדלים\" היא חברה קבלנית ותיקה.החברה חתמה עם משרד התיווך של מחמוד על הסכם לתיווך בבלעדיות ביחס לפרויקט החדש שלהם ביפו, הכולל דירות מגורים בלבד.תקופת הבלעדיות בהסכם נקבעה ל- 18 חודשים, עם אפשרות להארכה של עוד שנה, אם הבנייה תיתקל בעיכובים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההסכם בטל, מאחר שאסור לתת בלעדיות לתיווך עבור דירת מגורים לתקופה העולה על שנה.","אין כל בעיה בתקופת הבלעדיות שנקבעה בהסכם.","ההסכם בטל, מאחר שאסור לתת תקופת בלעדיות ביחס לדירת מגורים לתקופה של יותר מחצי שנה.","ההסכם יהיה תקף לחצי שנה בלבד, כי זו התקופה המקסימלית של בלעדיות המותרת עבור דירת מגורים."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2015-07#19","e":10,"n":19,"s":"יעל פתחה בית קפה, ובכוונתה למכור בו גם משקאות אלכוהוליים. יעל רוצה לקבל היתר זמני מרשות הרישוי לעסק שלה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין אפשרות לקבל היתר זמני לעסק שבו נמכרים משקאות אלכוהוליים.","תוקפו של היתר זמני לא יעלה על 3 חודשים במצטבר.","תוקפו של היתר זמני לא יעלה על שנה במצטבר.","אין כל הגבלה לגבי תקופת תוקפו של היתר זמני."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2015-07#20","e":10,"n":20,"s":"חברת \"אבן פינה\" קיבלה היתר להקים בניין של 10 דירות בנות 5 חדרים.לאור ריבוי הפניות, מעוניינת החברה לשנות את התוכנית , כך שייבנו 15 דירו תבנות 3 חדרים במקום התוכנית המקורית, מבלי לשנות את היקף הבנייה הכללי.\nבנסיבות העניין, מה נדרשת החברה לעשות?","o":["מאחר שאין שינוי בהיקף הבנייה, ההיתר הקיים עומד בתוקפו והחברה רשאית לבנות על פיו.","על החברה להגיש לוועדה המקומית בקשה להיתר לשימוש חורג.","על החברה להגיש לוועדה המקומית לתכנון ובנייה תוכנית להגדלת מספר היחידות, וההחלטה תינתן על ידי הוועדה המקומית.","על החברה להגיש לוועדה המקומית לתכנון ובנייה תוכנית להגדלת מספר היחידות, וההחלטה תינתן על ידי הוועדה המקומית, אבל חייבת גם באישור של הוועדה המחוזית."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2015-07#21","e":10,"n":21,"s":"יעקב מעוניין לרכוש את הזכויות בבית הבנוי על קרקע של מינהל מקרקעי ישראל במושב רקפות.\nאיזה תשלום ידרוש מינהל מקרקעי ישראל כתנאי לאישור העברת הנכס ליעקב?","o":["אם הנכס לא מהוון, מינהל מקרקעי ישראל ידרוש דמי הסכמה.","מינהל מקרקעי ישראל ידרוש דמי הסכמה, בין אם הנכס מהוון ובין אם הנכס לא מהוון, ואם הנכס לא מהוון - ידרוש גם תשלום דמי היוון.","מינהל מקרקעי ישראל ידרוש דמי היתר, בין אם הנכס מהוון ובין אם הנכס לא מהוון.","בנסיבות העניין לא יידרש כל תשלום למינהל מקרקעי ישראל."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2015-07#22","e":10,"n":22,"s":"אפרים מעוניין לרכוש דירת מגורים מהחברה הקבלנית \"איכות ושירות בע\"מ.בחוזה המכירה שהוצע לו צוין כי \"תשלומי התמורה יהיו צמודים למדד המחירים לצרכן או למדד תשומות הבנייה, לפי הגבוה מבין השניים \".\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["הקבלן רשאי להצמיד את התשלומים למדד המחירים לצרכן בלבד.","הקבלן רשאי להצמיד את התשלומים למדד תשומות הבנייה בלבד.","הקבלן רשאי לבחור מדד אחד בלבד, לפי שיקול דעתו, שאליו יוכל להצמיד את התשלומים עבור הדירה.","אין כל פגם בסעיף שבחוזה."],"c":[3],"a":false,"note":"","sub":"k_consumer"},{"id":"2015-07#23","e":10,"n":23,"s":"יעקב רכש מגרש לבניית בית במושב כרמון במסגרת מכרז של מינהל מקרקעי ישראל .כאשר פנה למינהל, נאמר לו שיצטרך לחתום על שני חוזים מול המינהל.\nעל אילו חוזים יצטרך יעקב לחתום, ומתי?","o":["עם הזכייה במכרז - על חוזה מכר, ובסיום הבנייה - על חוזה חכירה.","עם הזכייה במכרז - על חוזה מכר, ובסיום הבנייה - על חוזה פיתוח.","עם הזכייה במכרז - על חוזה פיתוח, ובסיום הבנייה - על חוזה חכירה.","עם הזכייה במכרז - על חוזה היוון, ובסיום הבנייה - על חוזה חכירה."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2015-07#24","e":10,"n":24,"s":"חיים הוא מתווך נדל\"ן ותיק בירושלים, המציע ללקוחותיו שירות של מתן שומת מקרקעין לנכסים, תמורת 2000 ש\"ח + מע\"מ.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חיים יכול לתת שירות שומת מקרקעין בתנאי שהשומה לא תשמש בבית משפט.","חיים לא רשאי לגבות שכר עבור שירות שומת מקרקעין.","חיים רשאי לתת שירות שומת מקרקעין בתשלום בתנאי שמדובר בדירות יד שנייה.","חיים רשאי לתת שירות שומת מקרקעין בתשלום לאחר התייעצות עם שמאי מקרקעין מוסמך."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2015-07#25","e":10,"n":25,"s":"שמעון זכה בתביעה כספית שהגיש נגד שרית. שרית אינה משלמת את סכום פסק הדין.לשרית ישנה דירה 5 חדרים בתל אביב. שמעון מעוניין להטיל עיקול על דירתה של שרית לשם מימוש פסק הדין שבו הוא זכה כנגדה.לצורך הטלת העיקול וביצוע הליכי גביה שמעון הגיש בקשה לרשם ההוצל\"פ להתמנות ככונס נכסים על דירתה של שרית.\nשמעון הוא כלכלן ויש לו ידע משפטי רחב. רשם ההוצל\"פ דחה את בקשתו של שמעון וציין בהחלטתו כי ראוי שימונה כונס נכסים אחר בעניין.\nמה התשובה הנכונה ביותר?","o":["זוכה חייב להתמנות ככונס נכסים על הדירה.","החלטת רשם ההוצל\"פ תקינה וראויה וזאת כדי למנוע ניגוד עניינים ו\"להיטות יתר\" בהליכי הגביה בין שמעון לשרית.","זוכה ימונה לכונס נכסים רק אם יש קרבה משפחתית בין הצדדים.","זוכה לא ימונה לכונס נכסים אלא אם ראה רשם ההוצל\"פ טעמים מיוחדים לכך. אולם רשאי רשם ההוצל\"פ למנות את עורך דינו של הזוכה לכונס נכסים."],"c":[],"a":true,"note":"התשובה הנכונה: כל התשובות מתקבלות","sub":"l_mortgage"},{"id":"2015-11#1","e":11,"n":1,"s":"החברה הקבלנית \"נטע הבונים\" בע\"מ הקימה פרוייקט בנייה חדש - בניין שבו אבע דירות.\nכל הדירות בבניין נמכרו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יש חובה לרשום את הבניין כבית משותף.","אין חובה לרשום את הבניין כבית משותף.","יש חובה לרשום את הבניין כבית משותף רק אם הבניין כולו מיועד למגורים.","יש חובה לרשום את הבניין כבית משותף אם הדירות נמכרו לבעלים שונים, איך אין חובה כזו אם נמכרו לאותו הרוכש"],"c":[0,1],"a":false,"note":"התשובות הנכונות: א׳ וב׳","sub":"h_works"},{"id":"2015-11#2","e":11,"n":2,"s":"ממתי חלה על צדדים המנהלים משא ומתן לכריתת חוזה חובה לנהוג בתום לב?","o":["משלב המשא ומתן לקראת כריתת החוזה.","רק מכריתת החוזה ואילך, כי לפני כריתת החוזה לא נוצרו בין הצדדים יחסים משפטיים מחייבים.","רק ממועד תחילת הביצוע של התחייבויות הצדדים בהתאם למוסכם בחוזה, כי עד למועד זה אין הצדדים מחויבים זה לזה.","חובת תום לב חלה על צדדים רק אם הוסכם על כך בכתב בין הצדדים."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2015-11#3","e":11,"n":3,"s":"אופיר הוא מתווך מקרקעין בעל רישיון. אופיר החתים את חנן על טופס הזמנת שירותי תיווך ועל טופס בלעדיות נפרד למכירת דירתו.בטופס הבלעדיות אין סעיף שבו נקבעה תקופת הבלעדיות.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["טופס הזמנת שירותי התיווך וגם טופס הבלעדיות בטלים ואינם תקפים.","טופס הזמנת שירותי התיווך תקף, אולם טופס הבלעדיות בטל ואינו תקף.","טופס הזמנת שירותי התיווך תקף והבלעדיות תסתיים בתום 30 יום מחתימת ההזמנה ע\"י חנן.","טופס הזמנת שירותי התיווך תקף, והבלעדיות תסתיים בתום 3 חודשים מיום ההזמנה."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2015-11#4","e":11,"n":4,"s":"יאיר חוכר קרקע מרשות מקרקעי ישראל (הרשות נקראה בעבר מינהל מקרקעי ישראל). יאיר מעוניין למכור את זכויותיו בנכס ורוצה לברר האם יצטרך לשלם דמי הסכמה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כתנאי להעברת זכויות החכירה יש לשלם דמי הסכמה לרשות מקרקעי ישראל","אם חוזה החכירה של יאיר נחתם לפני שנת 1979, הוא יהיה פטור מתשלום דמי הסכמה, אך אם החוזה נחתם במועד מאוחר יותר, הוא יהיה חייב בתשלום.","אם המכירה היא של נכס מהוון אין לשלם דמי הסכמה, אך אם הנכס לא מהוון יידרש תשלום דמי הסכמה.","אם המכירה פטורה ממס שבח, יאיר יהיה פטור מתשלום דמי הסכמה."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2015-11#5","e":11,"n":5,"s":"החברה הקבלנית \"אורנים\" בע\"מ המתמחה בהקמת קניונים ופרויקטים מסחריים, מקימה פרויקט מסחרי חדש בבית שמש שבו חנויות רבות.החברה מעוניינת להזמין שירותי תיווך ממיכל המתווכת, כדי שתשווק בבלעדיות את החנויות בפרויקט.\nבנסיבות המתוארות, על מה צריכה מיכל להקפיד כדי שהסכם הבלעדיות יהיה תקף לכל תקופת השיווק?","o":["על מיכל להקפיד שטופס הזמנת שירותי התיווך יכלול סעיף בלעדיות, וכן להקפיד לבצע בתקופת הבלעדיות פעולות שיווק כהגדרתן בחוק.","על מיכל להקפיד שטופס הבלעדיות ייחתם כטופס נפרד מטופס הזמנת שירותי התיווך, וכן להקפיד לבצע בתקופת הבלעדיות פעולות שיווק כהגדרתן בחוק.","על מיכל להקפיד שטופס הבלעדיות ייחתם כטופס נפרד מטופס הזמנת שירותי התיווך, להקפיד לבצע בתקופת הבלעדיות פעולות שיווק כהגדרתן בחוק, וכן לוודא שתקופת הבלעדיות לא תעלה על שישה חודשים.","על מיכל להקפיד שטופס הבלעדיות ייחתם כטופס נפרד מטופס הזמנת שירותי התיווך ,להקפיד בתקופת הבלעדיות לבצע פעולות שיווק כהגדרתן בחוק, וכן לוודא שתקופת הבלעדיות לא תעלה על 9 חודשים."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2015-11#6","e":11,"n":6,"s":"אילו מהקרקעות הבאות אינן \"מקרקעי ישראל\"?","o":["מקרקעי הקרן הקיימת לישראל.","מקרקעין שבבעלותה של רשות מקומית.","מקרקעי רשות הפיתוח.","מקרקעי מדינת ישראל."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2015-11#7","e":11,"n":7,"s":"ציון רכש דירה בבית משותף הרשום בפנקס הבתים המשותפים בלשכת רישום המקרקעין. להפתעתו של ציון התברר לו שלבית המשותף לא נקבע תקנון מוסכם המסדיר את דרך ניהולו.\nבנסיבות העניין ,איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כאשר אין תקנון מוסכם, אין מערכת חוקית המסדירה את ניהול הבית המשותף וכל בעיה צריכה להיפתר באסיפת הדיירים של הבניין.","כאשר אין תקנון מוסכם ,על הדיירים לפעול על פי התקנון לדוגמה שמפרסמת האגודה לתרבות הדיור.","כאשר אין תקנון מוסכם, לפחות 3/4 מבעלי הדירות אשר לדירותיהם צמודים לפחות מהחלקים 3/4 ברכוש המשותף מוסמכים לפנות למפקח על הבתים המשותפים בדרישה כי יסדיר את דרך ניהולו של הבית המשותף.","כאשר אין תקנון מוסכם ,הבית יתנהל על פי התקנון המצוי."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2015-11#8","e":11,"n":8,"s":"ארבל חתמה על הסכם לרכישת דירה, ועורך הדין הסביר לה שיש למהר ולרשום הערת אזהרה. ארבל מתלבטת ותוהה מדוע הדבר נחוץ.\nבנסיבות העניין, איזה מן המשפטים הבאים הוא הנכון ביותר?","o":["אם נרשמה הערת אזהרה לטובת רוכש הדירה מובטח לו כי זכויות הבעלות יירשמו על שמו.","הערת האזהרה מונעת רישום של עיסקה סותרת, אלא בהסכמת הזכאי או לפי צו בית המשפט.","הערת האזהרה מבטיחה שאין עיקולים על הדירה.","הערת האזהרה מבטיחה שאין הערות נוספות כלשהן הרשומות על הדירה."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2015-11#9","e":11,"n":9,"s":"חברת \"ירוק עד\" חתמה עם יעל, שהיא בעלת שטח מסחרי, על הסכם חכירה לנכס מסחרי.תקופת החכירה נקבעה ל- 15 שנים עם שתי זכויות ברירה (אופציות) לחוכר להארכה ל-10 שנים נוספות בכל פעם, במחיר קבוע.\nבנסיבות העניין,איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על העיסקה לא יחול מיסוי מקרקעין, כי תקופת החכירה לענין חוק מיסוי מקרקעין היא 15 שנים בלבד.","על העיסקה לא יחול מיסוי מקרקעין, משום שמדובר בנכס מסחרי.","על העיסקה לא יחול מיסוי מקרקעין, כי תקופת החכירה לעניין חוק מיסוי מקרקעין היא 25 שנים.","על העיסקה יחול מיסוי מקרקעין, כי תקופת החכירה בעיסקה לעניין חוק מיסוי מקרקעין היא 35 שנים."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2015-11#10","e":11,"n":10,"s":"אביה של נירית נפטר והוריש לה שלושה נכסים - נכס מסחרי ושתי דירות מגורים.\nבנסיבות העניין, עבור אילו נכסים תידרש נירית לשלם מס רכישה?","o":["נירית לא תידרש לשלם כלל מס רכישה.","נירית תידרש לשלם מס רכישה על הנכס המסחרי, בהתאם להערכת שווי שיערוך שמאי מקרקעין מוסמך, אך תהיה פטורה ממס רכישה על דירות המגורים.","נירית תידרש לשלם מס רכישה על הנכס המסחרי ועל דירת מגורים אחת, בהתאם להערכת שווי שיערוך שמאי מקרקעין מוסמך, אך תהיה פטורה ממס רכישה על דירת המגורים השנייה.","כל הנכסים חייבים במס רכישה, שייקבע בהתאם להערכות שווי שיערוך שמאי מקרקעין מוסמך."],"c":[0],"a":false,"note":"","sub":"x_purchase"},{"id":"2015-11#11","e":11,"n":11,"s":"דפנה, שהיא בעלת דירה בנתניה, טסה לחו\"ל לתקופה של שלוש שנים ואישרה לאחותה דנית להשתמש בדירה ללא תשלום עד שתחזור לארץ.\nבנסיבות המתוארות, מהי הזכות שנתנה דפנה לדנית?","o":["שכירות.","זיקת הנאה.","זכות קדימה.","השאלה."],"c":[3],"a":false,"note":"","sub":"r_rent"},{"id":"2015-11#12","e":11,"n":12,"s":"ברכה היא דיירת מוגנת בדירה, עליה שילמה דמי מפתח, והיא מתגוררת בה מאז שנת 1970 בהסכמת הבעלים עזבה ברכה את הדירה ועברה לדיור מוגן, ובמקומה נכנסה כדיירת מוגנת חברת \"אפיקים לעתיד\". החברה שילמה דמי מפתח בסכום של מיליון ש\"ח.\nבנסיבות העניין, איזה סכום זכאית ברכה לקבל?","o":["400,000 ש\"ח.","600,000 ש\"ח.","לברכה אין זכות לקבל חלק בדמי המפתח.","ברכה לא זכאית לקבל חלק בדמי מפתח, אך תקבל 40% מדמי השכירות שתשלם החברה בכל חודש."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2015-11#13","e":11,"n":13,"s":"יפית ואלון מתעניינים ברכישת דירה בפרויקט שבנתה בהרצליה חברת \"בוני הרצליה\" על קרקע של רשות מקרקעי ישראל (שנקראה בעבר מינהל מקרקעי ישראל).הפרויקט הושלם אבל זכויות הדיירים טרם נרשמו בלשכת רישום המקרקעין.\nבנסיבות העניין, היכן יכולים יפית ואלון לקבל מסמכים המוכיחים את הזכויות בדירה?","o":["בלשכת רישום המקרקעין.","בחברה המשכנת או ברשות מקרקעי ישראל.","בחברה המשכנת או אצל רשם המשכונות.","בוועדה המקומית לתכנון ובנייה או ברשות מקרקעי ישראל."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2015-11#14","e":11,"n":14,"s":"משה תיווך בעיסקה של מכירת שטח חקלאי שבו מטע עצי פרי.לאחר חתימת ההסכם, טען המוכר שעליו לשלם דמי תיווך עבור הקרקע בלבד ומשום שחצי מהתמורה שולמה עבור עצי הפרי ולא עבור הקרקע עליו לשלם דמי תיווך רק על חצי מגובה הסכום שקיבל.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם חצי מהתמורה שולמה עבור עצי הפרי, משה לא זכאי למלוא דמי התיווך.","משה זכאי למלוא דמי התיווך, מאחר שהעצים נטועים באדמה ובנסיבות העניין נחשבים כחלק בלתי נפרד מהמקרקעין.","משה זכאי למלוא דמי התיווך, מאחר שאין הסכמה כתובה לגבי שווי העצים שנמכרו.","משה זכאי למלוא דמי התיווך רק אם נושא זה צוין במפורש במסמך נפרד."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2015-11#15","e":11,"n":15,"s":"מוכר וקונה סיכמו ביניהם את תנאי המכירה של נכס. בבדיקה מקדימה התברר שצפוי חיוב בהיטל השבחה.מכיוון שהצדדים לא ידעו מה יהיה גובה החיוב, נקבע בהסכם המכר תנאי, שאם יתברר שהחיוב בהיטל השבחה החל על המוכר יעלה על 100,000 ש\"ח יוכל המוכר לבטל את ההסכם.הוועדה המקומית לתכנון ובנייה קבעה חיוב בהיטל השבחה של עד 250,000 ש\"ח, והמוכר הודיע על ביטול החוזה. הקונה רוצה לקיים את חוזה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור לקבוע בחוזה סעיף המאפשר לבטלו בעתיד, ולכן הסעיף בטל והמוכר לא רשאי לבטל את העיסקה.","הסעיף בחוזה חוקי, ובנסיבות העניין המוכר רשאי לבטל את החוזה.","אסור לקבוע בחוזה סעיף המאפשר לבטל את החוזה בשל חיוב במס, באגרה או בהיטל, לכן הסעיף בטל, והמוכר לא רשאי לבטל את העיסקה.","הסעיף בחוזה חוקי, אך אם המוכר יבטל את החוזה עליו לשלם פיצוי מוסכם בסכום הקבוע בחוק."],"c":[1],"a":false,"note":"","sub":"p_levy"},{"id":"2015-11#16","e":11,"n":16,"s":"יהודה, מתווך מקרקעין שקיבל בעבר רישיון, עסק בתיווך כשרישיון התיווך שלו לא בתוקף.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["יהודה עבר עבירה פלילית, ואם יורשע, רשאי בית המשפט לבטל או להתלות את רישיון התיווך שלו.","רשם המתווכים ישלול את רישיון התיווך של יהודה אף אם לא הועמד לדין משמעתי או פלילי.","יהודה עבר עבירה פלילית וניתן להעניש אותו, אך לא ניתן לשלול רישיון תיווך שנתקבל כחוק בנסיבות העניין.","יהודה ביצע עבירת משמעת, ואם יורשע, ועדת המשמעת רשאית לשלול את רישיון התיווך שלו."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2015-11#17","e":11,"n":17,"s":"דוד וסמדר ביקשו לרכוש דירה באשקלון. המתווכת נעמה הציגה בפניהם דירת פנטהאוז, אך ציינה שבתקנון הבית המשותף נקבע שבעל הפנטהאוז אחראי לבדו על הוצאות אחזקת הגג המשותף.דוד וסמדר רוצים מאוד את הדירה, אך אינם מעוניינים לממן מכיסם את עלות התחזוקה של הגג.\nבנסיבות העניין, בהנחה שדוד וסמדר ירכשו את הדירה, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["משנקבע הוראות בתקנון דוד וסמדר לא יכולים לעשות דבר לשינוי המצב.","ההוראה בתקנון סותרת את הוראות חוק המקרקעין ולכן אין לה תוקף, ודוד וסמדר לא חייבים לקיים אותה.","דוד וסמדר יכולים לפנות לרשם המקרקעין כדי שיורה על ביטול ההוראה בתקנון.","דוד וסמדר יכולים לפנות למפקח על הבתים המשותפים ולבקש שיורה על ביטול או שינוי ההוראה בתקנון."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2015-11#18","e":11,"n":18,"s":"יואב המתווך קיבל דירה למכירה בבלעדיות לתקופה של שישה חודשים. הוא החתים את המוכרת על הזמנת שירותי תיווך וכן על טופס בלעדיות.באותו היום, עוד לפני שהספיק לפרסם את הדירה, נזכר יואב ששרית מחפשת דירה בעלת נתונים דומים.יואב החתים את שרית על הזמנת שירותי תיווך, הציג לה את הדירה והעיסקה נחתמה עוד באותו היום.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יואב לא זכאי כלל לדמי תיווך, כי הוא לא ביצע שתי פעולות שיווק כנדרש.","יואב זכאי לקבל דמי תיווך משני הצדדים.","יואב זכאי לקבל דמי תיווך מהקונה בלבד, כי הוא לא ביצע פעולות שיווק כנדרש על פי תנאי הבלעדיות.","יואב זכאי רק למחצית מדמי התיווך מהמוכרת, מכיוון שלא ביצע את פעולות השיווק הנדרשות בתקופת הבלעדיות, אך זכאי לקבל את כל דמי התיווך מהקונה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2015-11#19","e":11,"n":19,"s":"מנחם חויב בפסק דין לשלם פיצוי בגובה 700,000 ש\"ח. למנחם אין את הסכום, והוא חשש שהדירה בבעלותו תימכר לצורך כיסוי החוב.לכן, מיד לאחר קבלת פסק הדין, חתם מנחם על הסכם הלוואה עם חברה שבבעלותו ושם משכנתא על הדירה כערבות לטובת החברה, כדי להקשות על עיקול זכויותיו.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["מנחם לא ביצע עבירה פלילית, כי הוא לא מכר את הנכס אלא רק מישכן אותו.","מנחם ביצע עבירה של הודאה כוזבת בהתחייבות.","מנחם ביצע עבירה של תחבולה.","מנחם ביצע עבירה של הונאת נושים."],"c":[3],"a":false,"note":"","sub":"l_mortgage"},{"id":"2015-11#20","e":11,"n":20,"s":"שגיא רכש קרקע בכפר שמריהו, עליה הוא מתכוון להקים וילה על מנת למכור אותה מבלי שיגור בה בעצמו. רבקה הביעה עניין ברכישת הווילה אחרי שבנייתה תסתיים.\nבנסיבות העניין, האם שגיא מחויב לצרף לחוזה המכר מפרט טכני?","o":["אי אפשר לדעת, והדבר תלוי בשאלה האם שר השיכון קבע שבאזור של הדירה יש או אין צורך בצירוף מפרט טכני להסכם המכירה.","שגיא מחויב לצרף מפרט טכני רק אם הוא קבלן שעיסוקו בבניית דירות.","בנסיבות העניין אין חובה לצרף מפרט טכני להסכם המכר.","בנסיבות העניין שגיא חייב לצרף להסכם המכר מפרט טכני."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2015-11#21","e":11,"n":21,"s":"רוני ורותי הם הבעלים המשותפים בחלקים שווים של נכס מסחרי שרכשו כהשקעה.הם לא ערכו הסכם המסדיר את יחסי השיתוף ביניהם. רוני מטפל בגבייה של שכר הדירה מן השוכרים בנכס ובכל התיקונים הנדרשים, ואילו רותי לא מטפלת כלל בענייני הנכס.רוני טוען שהוא עובד קשה יותר ולכן הוא זכאי לקבל 2/3 מדמי השכירות, ואילו רותי טוענת שהם זכאים לחלקים שווים בדמי השכירות.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["במצב שבו אין הסכמה בין הצדדים על חלוקת שכר הדירה ואין הסכם שיתוף המסדיר זאת ,הצדדים חייבים לפנות לבית המשפט על מנת לפרק את השיתוף ביניהם","בהיעדר הסכמה כתובה מראש בין השותפים ,חזקה שכל שותף זכאי לחלק מדמי השכירות בהתאם לחלקו בנכס","רוני זכאי לפי החוק לשכר עבור עבודתו, ולכן החוק מאפשר לו לקחת לעצמו עד 2/3 מדמי השכירות מבלי שנדרש אישור מגורם כלשהו.","אם רוני ורותי הם קרובי משפחה מדרגה ראשונה, שכר הדירה יתחלק תמיד בהתאם לחלק של כל שותף בנכס, אבל אם הם לא קרובי משפחה רוני רשאי לקבל עד 2/3 משכר הדירה."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2015-11#22","e":11,"n":22,"s":"יריב הוא הבעלים של חלקה מס' 20 ויפעת היא הבעלים של חלקה מס' 21 ביישוב קהילתי בשרון.שתי החלקות צמודות זו לזו. חלקה 20 משועבדת בזיקת הנאה לטובת חלקה 21 כך שמותר מעבר בחלקה 20 כדי להגיע לחלקה 21.\nיריב רכש מיפעת את חלקה 21, אך לא איחד את החלקות לחלקה אחת.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זיקת ההנאה תוקפא עד ליום שבו ימכור יריב את אחת החלקות.","לפי החוק, בנסיבות המתוארות בשאלה אסור שיהיה אותם בעלים לשתי החלקות.","ברגע שיריב יהיה הבעלים של שתי החלקות תפקע זיקת ההנאה באופן אוטומטי.","רכישת חלקה 21 על ידי יריב לא משפיעה על זיקת ההנאה."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2015-11#23","e":11,"n":23,"s":"מוניר הוא הבעלים של חנות לחומרי בניין במרכז מסחרי ביפו. ברישום בלשכת רשם מקרקעין (טאבו) צמודות לחנות שתי חניות.העסק הסמוך לחנות של מוניר הוא מועדון העובד רק בשעות הערב. החברה המפעילה את המועדון מעוניינת לשכור ממוניר את החניות בשעות הערב, בהן החנות של מוניר סגורה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["החוק אינו מאפשר לבצע עיסקה רק בחלק מסוים במקרקעין ועל כן לא ניתן להשכיר את החניות ללא החנות אליה הן צמודות.","אין כל מניעה לבצע את העיסקה אם הצדדים מעוניינים בכך.","ניתן לבצע את העיסקה רק באישור של רשם המקרקעין או של בית המשפט.","החוק לא מאפשר לבצע עיסקת השכרה המוגבלת לשעות מסוימות בלבד והצדדים צריכים להחליט האם החניות יושכרו למשך כל היום או לא יושכרו כלל."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2015-11#24","e":11,"n":24,"s":"מי מהבאים ייחשב כ\"איגוד מקרקעין \"לצורכי מיסוי מקרקעין?","o":["חברה קבלנית העוסקת ברכישת קרקעות ומכירתן ברווח.","חברה שרכושה הוא נכס מקרקעין אותו היא משכירה, וכן מלאי מזומנים שלא משמש לייצור הכנסות.","חברה ששווי המקרקעין שבבעלותה עולה על 50% מהערך הכללי של החברה.","מושב שהוא אגודה שיתופית, השוכר קרקע מרשות מינהל מקרקעי ישראל (שנקראה בעבר מינהל מקרקעי ישראל) ומשכיר חלקים ממנה לחקלאים שונים שהם חברי האגודה."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2015-11#25","e":11,"n":25,"s":"יעקב מנהל משרד תיווך גדול המעסיק מספר מתווכים, כולם בעלי רישיון.ליעקב עצמו אין רישיון תיווך והוא אחראי רק לניהול העסק ולא משתתף בעבודה מול הלקוחות.אחד המתווכים העובדים בעסק היטעה לקוח במסגרת פעולות התיווך שביצע, והוגש כתב אישום נגד המתווך ונגד יעקב מכוח חוק הגנת הצרכן.\nבנסיבות העניין, איזה מהמשפטים הבאים נכון?","o":["אם העובד יורשע בעבירה אז גם יעקב יורשע בהכרח, כי על פי חוק הגנת הצרכן המנהל אחראי לפעולות של עובד שלו.","עבירה על פי חוק הגנת הצרכן היא תמיד אישית ואין אחריות למנהלים, ולכן יעקב לא יורשע בכל מקרה.","יעקב הוא לא מתווך, ולכן לא יכול להיות אחראי בשום מקרה להטעיה בפעולת תיווך שביצע עובד שלו, ועל כן יעקב לא יורשע בכל מקרה.","אם העובד של יעקב יורשע, יעקב לא יורשע בעבירה בשל התנהגות העובד, בתנאי שיוכיח שהוא עשה כל שאפשר למנוע הטעיית הלקוח."],"c":[3],"a":false,"note":"","sub":"k_consumer"},{"id":"2016-01#1","e":12,"n":1,"s":"חיים הוא יזם נדל\"ן. חיים רכש בניין ישן ומוזנח בן 3 קומות ובו 6 דירות. חיים רוצה להרוס את הבניין ולבנות מחדש, על פי התוכניות של הבניין הישן, ללא שינוי בצורת הבניין, בדירות או בשטח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חיים לא צריך לקבל היתר בנייה, מאחר שהוא יבנה בדיוק את אותו בניין שהוא מתכוון להרוס.","חיים חייב לקבל היתר בנייה לבנייה מחדש.","חיים צריך לבקש הקלה שיפטרו אותו מהצורך בקבלת היתר בנייה.","אם אין שימוש חורג באף אחת מהדירות בבניין, חיים לא צריך לקבל היתר בנייה."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2016-01#2","e":12,"n":2,"s":"בנסח הטאבו של דירה רשומה זיקת הנאה לטובת הולכי רגל המאפשרת להם זכות מעבר בחצר של הבניין. זיקת ההנאה נרשמה לפני 32 שנה, לפי דרישת הרשות המקומית\n. בנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אי אפשר לרכוש דירה אשר רשומה עליה זיקת הנאה לטובת הולכי רגל.","זיקת ההנאה מחייבת רק את הבעלים הקודם של הדירה ולא קונה חדש.","זיקת ההנאה תחייב כל מי שירכוש את הדירה.","אם רוב דיירי הבניין יחליטו באסיפת דיירים כי הם רוצים לבטל את זיקת ההנאה, ניתן למחוק את זיקת ההנאה מהרישום בלשכת רישום המקרקעין."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2016-01#3","e":12,"n":3,"s":"חגית מעוניינת לרכוש דירה במרכז ירושלים. משה המתווך הציג בפני חגית חנות, שלדברי בעליה ניתן להופכה לדירה במחיר מציאה.\nמה נדרש מחגית לעשות כדי להפוך את החנות לדירה?","o":["לבקש אישור לשינוי המתוכנן מכל בעלי הדירות בבניין.","לבדוק את תוכנית המיתאר (תב\"ע) ואם ניתן להפוך את החנות לדירה, יהיה עליה להגיש בקשה לשימוש חורג.","אין צורך בבקשה לשימוש חורג על הדירה.","על חגית להגיש בקשה לתשלום דמי היתר לצורך אישור השינוי."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2016-01#4","e":12,"n":4,"s":"דינה מעוניינת למכור את הדירה שלה. על הדירה של דינה רשומה כיום משכנתא לטובת בנק משכנתאות. דינה רוצה לקנות דירה חדשה, ומכיוון שהמשכנתא שיש לה כיום היא בתנאים מעולים, היא לא רוצה לפרוע אותה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אם שווי הדירה החדשה זהה או עולה על שווי הדירה הישנה, אז דינה יכולה לגרור את המשכנתא לדירה החדשה שתרכוש.","דינה יכולה לגרור את המשכנתא הקיימת לדירה חדשה שתרכוש ללא אישור הבנק.","דינה יכולה לגרור את המשכנתא שלה לדירה החדשה שתקנה, בכפוף לאישור הבנק.","כאשר קונים דירה חדשה חייבים לקחת משכנתא חדשה ולא ניתן לעשות שימוש במשכנתא קודמת."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2016-01#5","e":12,"n":5,"s":"רמי הוא מנהל עיזבון של הדירה של שאול ז\"ל, שהוריש אותה לילדיו- נטלי ונחום. רמי מתכוון למכור את דירת המגורים של שאול וכעת הוא רוצה לדעת האם העיסקה תחויב במס שבח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הורשה אינה מכירה לעניין חוק מיסוי מקרקעין ולכן לא יחול מס שבח.","מכירת הדירה עשויה להיות מחוייבת במס שבח.","מכירה של נכסי עיזבון מחוייבת במס שבח, אבל בשיעור מופחת של חצי מהמס הרגיל.","מכירה של נכסי עיזבון מחוייבת במס שבח, אבל בשיעור מופחת של שליש מהמס הרגיל."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2016-01#6","e":12,"n":6,"s":"כיצד יחושב מס רכישה כאשר קונים משרד בבניין משרדים בהקמה בקבוצת רכישה?","o":["מס הרכישה יחושב לפי ערך החלק בקרקע שרוכש כל אחד מהקבוצה.","מס הרכישה יחושב לפי שווי של הנכס הבנוי וחלקו היחסי של כל אחד מחברי הקבוצה בבניין.","מאחר שמדובר בקבוצת רכישה, הרי שאין תשלום של מס רכישה.","מס הרכישה יחושב לפי ערך החלק בקרקע שרוכשים, אך הקונה יהיה זכאי להפחתה של מחצית מהמס, מאחר שמדובר ברכישה במסגרת קבוצת רכישה."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2016-01#7","e":12,"n":7,"s":"דני רכש דירה. בהסכם המכר שנחתם נקבע פיצוי מוסכם בשיעור של מאה אלף ש\"ח. המוכר הפר את הסכם המכר. התברר לדני כי נגרמו לו נזקים בשיעור של 200,000 ש\"ח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דני לא יוכל לתבוע פיצוי העולה על 100,000 ש\"ח, שכן קביעת פיצוי מוסכם שוללת אפשרות לתבוע פיצוי גדול יותר.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם רק אם הצדדים קבעו כך מראש בהסכם ביניהם.","קביעת פיצוי מוסכם כשלעצמה בחוזה אינה מונעת תביעת סכום כספי גבוה יותר.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם ובלבד שהפיצוי המוסכם לא נמוך מעשרה אחוזים מסכום העיסקה."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2016-01#8","e":12,"n":8,"s":"לפי חוק המקרקעין, מהו בית משותף?","o":["מבנה של קבע הכולל שתי דירות או יותר, ובכלל זה הקרקע שעליה נבנה.","בית שיש בו שתי דירות או יותר והוא נרשם בפנקס הבתים המשותפים.","בית שיש בו שתי דירות או יותר, שאין חובה לרושמו בפנקס הבתים המשותפים.","מבנה של קבע שיש בו לפחות שתי דירות ובכלל זה הקרקע שעליה נבנה ושיש חובה לרושמו בפנקס הבתים המשותפים."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2016-01#9","e":12,"n":9,"s":"מה מותר להצמיד לדירה פלונית בתקנון הבית המשותף?","o":["חלק מחדר המדרגות המשמש רק את אותה דירה.","מחסן המשמש את כל דיירי הבניין.","קרקע שהינה חלק מהרכוש המשותף.","חלק מסויים מחדר העגלות בבניין."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2016-01#10","e":12,"n":10,"s":"דן פנה לראובן המתווך כדי שיסייע לו להשכיר את המחסן הצמוד לדירתו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דן יכול להשכיר שני חדרים בהסכמת רוב בעלי הדירות.","דן יכול להשכיר את המחסן.","דן יכול להשכיר את המחסן רק עם הדירה.","דן יכול להשכיר את המחסן לתקופה שאינה עולה על חמש שנים."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2016-01#11","e":12,"n":11,"s":"איזה מידע לא מופיע בנסח רישום מקרקעין (נסח טאבו) המופק על ידי לשכת רישום המקרקעין?","o":["זהות הבעלים של הנכס וחלקו בזכויות.","זכויות בנייה בנכס.","קיומה של הערת אזהרה להימנעות מעשיית עיסקה.","קיומה של משכנתא על הנכס."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2016-01#12","e":12,"n":12,"s":"יואב רכש מדני בית לפני 5 שנים. בימים אלה התקבלה תוכנית בניין ערים חדשה, המאפשרת בנייה של קומה נוספת בת 150 מ\"ר ויואב מעוניין לבנות את הקומה הנוספת. הבית רשום במינהל מקרקעי ישראל ולא בלשכת רישום המקרקעין. כשקנה יואב את הבית מדני, דני שילם דמי היוון למינהל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יואב יידרש לשלם למינהל דמי הסכמה בגין הבנייה הנוספת.","יואב לא יצטרך לשלם למינהל דמי הסכמה, אך יתכן שהוא יידרש לשלם למינהל דמי היתר עבור הבנייה הנוספת.","יואב יצטרך לשלם למינהל דמי היוון נוספים על תוספת הבנייה.","יואב לא יצטרך לשלם למינהל כל תשלום שהוא."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2016-01#13","e":12,"n":13,"s":"יעקב ודן שכנים באותו בניין, הם פנו לראובן המתווך שיתווך ביניהם לעיסקה הבאה: יעקב ירכוש את המחסן הצמוד לדירתו של דן ובתמורה דן ירכוש את החניה הצמודה לדירתו של יעקב.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יעקב ודן אינם רשאים לעשות את העיסקה.","רק יעקב רשאי למכור את החניה לדן בהסכמת כל הדיירים.","רק דן רשאי למכור את המחסן ליעקב בהסכמת 75% מהדיירים.","יעקב ודן רשאים לעשות את העיסקה בכפוף לתיקון צו רישום הבית המשותף."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2016-01#14","e":12,"n":14,"s":"אבי התמנה למנהל העיזבון של רחל. העיזבון כולל דירת מגורים בטבריה. אבי מעוניין להשכיר את הדירה ליעקב לתקופה של 5 שנים באמצעות המתווך דני.\nבנסיבות העניין, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["אבי לא רשאי להשכיר את הדירה, אלא באישור בית המשפט.","אבי רשאי למכור את הדירה, אך לא להשכירה.","אבי רשאי להשכיר את הדירה לתקופה שלא תעלה על שנה.","אבי יכול להשכיר את הדירה ליעקב ל-5 שנים ללא אישור בית המשפט."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2016-01#15","e":12,"n":15,"s":"במסגרת מילוי תפקידו של עידן כעובד אגף המכס ומע\"מ, הגיש לבית המשפט שומת מקרקעין על חנות השייכת לדנה. דנה, אשר לא הייתה שבעת רצון מהערכתו של עידן, ניסתה לטעון להיעדר קבילות השומה. לדבריה, עידן אינו שמאי מקרקעין, בעוד שהחוק קובע כי רק שמאי מקרקעין יכול להגיש שומת מקרקעין לבית המשפט.\nבנסיבות העניין, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["דנה צודקת; לא ניתן להגיש לבית המשפט שומת המקרקעין של עידן.","דנה טועה; בנוסף לשמאי מקרקעין, כל עובד בכיר במשרד האוצר רשאי להגיש שומת מקרקעין לבית המשפט.","דנה טועה; כל אדם המעוניין בכך יכול להגיש שומת מקרקעין לבית המשפט, ולבית המשפט הסמכות לדחותה או לקבלה, בהתאם לשיקול דעתו.","דנה טועה; עידן אומנם אינו שמאי מקרקעין, אך במסגרת מילוי תפקידו כעובד אגף המכס והמע\"מ הוא מוסמך להגיש שומת מקרקעין לבית המשפט."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2016-01#16","e":12,"n":16,"s":"בחודש ינואר 2014 קיבלה רותם רישיון תיווך כדין. כשלושה חודשים לאחר מכן נשללה אזרחותה.\nבנסיבות העניין, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["רשם המתווכים רשאי לבטל את רישיונה לאלתר.","רשם המתווכים רשאי לבטל את רישיונה, אך רק לאחר שניתנה לרותם הזדמנות להשמיע את טענותיה, ולאחר שהרשם נועץ בוועדה המייעצת.","רשם המתווכים אינו רשאי לבטל את רישיונה, אך הוועדה המייעצת רשאית לעשות כן.","רישיון התיווך של רותם בטל באופן אוטומטי וככל שתמשיך לעסוק בתיווך תהא כפופה לסנקציה פלילית."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2016-01#17","e":12,"n":17,"s":"אורנה, מתווכת במקרקעין, תיווכה בעיסקה למכירת דירתו של אביב וקנייתה על-ידי שירלי. לבקשת שירלי הקונה, אורנה ניהלה עבורה את המשא ומתן לסגירת העיסקה. אורנה הגיעה להסכמה עם הצדדים לגבי מחיר העיסקה, מועד הפינוי, תנאי התשלום ותכולת הדירה והחתימה אותם על זיכרון דברים בנוסח המצוי במשרדה.\nבנסיבות העניין, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["אורנה אינה זכאית לדמי תיווך בעיסקה זו.","אורנה אינה זכאית לדמי תיווך בעיסקה זו, שכן היא עברה עבירה פלילית, ואם תורשע, רשאי בית המשפט לבטל את רישיונה.","אורנה זכאית לדמי תיווך משירלי הקונה בלבד.","אורנה לא חרגה מסמכותה, והיא זכאית לקבל את דמי התיווך."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2016-01#18","e":12,"n":18,"s":"יגאל ופנינה סיכמו בינהם בלחיצת יד עיסקה לפיה יגאל ירכוש מפנינה את דירתה ב- 4 מיליון ש\"ח ב- 4 תשלומים, ומסירת הדירה תתבצע בתוך 4 חודשים, וגם סיכמו לפנות לעו\"ד לצורך עריכת החוזה. בנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההסכמה בין יגאל פנינה הינה עיסקה במקרקעין והצדדים אינם יכולים לחזור ממנה.","ההסכמה מחייבת את יגאל בלבד.","ההסכמה מחייבת את פנינה בלבד.","ההסכמה אינה מחייבת, מכיוון שלא נעשתה בכתב."],"c":[3],"a":false,"note":"","sub":"c_form"},{"id":"2016-01#19","e":12,"n":19,"s":"יוסי החליט למכור את ביתו שסמוך לבית הספר היסודי ביישוב \"מנשה\" ופנה לברוך המתווך שיטפל במכירה. גלי, שחלמה על כך שבנותיה ילכו בביטחה לבית הספר, ראתה שלט ומיהרה להתקשר לברוך. בהתרגשות גדולה היא קבעה עימו פגישה וסיפרה לו וליוסי על הסיבה להתעניינותה בבית, וחתמה עם יוסי על חוזה לרכישת הבית. מספר ימים טרם חתימת החוזה, שמע יוסי המוכר על כך כי התכנית להעביר את בית-הספר היסודי למבנה החדש בצד השני של היישוב, אושרה. המידע היה בידי המתווך ברוך. יוסי וברוך לא עידכנו את גלי על כך. כעת, לאחר חתימת החוזה, גלי גילתה זאת.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גלי אינה יכולה לבטל את החוזה, שכן הוא כבר נחתם.","גלי אינה יכולה לבטל את החוזה, כי היה עליה לבדוק בעצמה.","גלי יכולה לבטל את החוזה, כי יוסי ידע טרם חתימת החוזה על התוכנית להעביר את בית-הספר, וכן ידע כי גלי מעוניינת בביתו אך ורק בגלל הקירבה לבית-הספר.","גלי יכולה לבטל את החוזה, אך הדבר כפוף להסכמתו של יוסי."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2016-01#20","e":12,"n":20,"s":"לורן ויוסי כרתו חוזה לפיו לורן תמכור ליוסי את דירתה. בטרם רשם יוסי את הדירה על שמו בפנקסי המקרקעין, לורן כרתה חוזה עם איתמר לפיו היא תמכור לו את דירתה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכותו של איתמר עדיפה, שכן יוסי טרם רשם את הדירה.","זכותו של יוסי עדיפה, שכן הוא בעל העיסקה ה
