ודות השיפוץ גם ללא הסכמתו של חיים."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2017-04#13","e":17,"n":13,"s":"גיא רכש דירת מגורים מגלית. בהסכם המכר סיכמו הצדדים כי גיא ישלם תשלום ראשון בשיעור 25% מערך הדירה במעמד החתימה של הסכם המכר, ואת יתרת התשלום ישלם עם קבלת החזקה בדירה, במועד שנקבע לארבע חודשים אחרי החתימה. מיד לאחר החתימה על הסכם המכר נרשמה לטובת גיא הערת אזהרה על זכויותיה של גלית בדירה. חודש לאחר החתימה, גלית נקלעה לקשיים כלכליים והוטל עיקול על כל נכסיה, וביניהם גם על דירתה. גיא שמע על המקרה והוא דואג מאוד, שכן שילם לגלית תשלום ראשון עבור הדירה ואינו יודע האם יצליח בנסיבות אלה להשלים את העיסקה ולקבל את הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["העיקול הוטל על זכויותיה של גלית בדירה לאחר שנרשמה הערת אזהרה לטובת גיא, ולכן על גיא לפנות לרשם המשכונות ולשלם את כל חובותיה של גלית. רק לאחר מכן יימחק העיקול אשר הוטל על הדירה.","העיקול שנרשם על זכויותיה של גלית בדירה לא פוגע בזכותו של גיא, הנובעת מההתחייבויות נשוא הערת האזהרה.","גיא איבד את זכותו לרכוש את הדירה, ואך איבד את כספו. רקל אחר מכירת הדירה על ידי כונס נכסים, יוכל גיא לדרוש את הסכום ששילם, ובכפוף להחלטת בית משפט בנושא.","זכותו של גיא היתה נשמרת בכל מקרה, גם אם לא היתה נרשמת הערת אזהרה לטובתו."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2017-04#14","e":17,"n":14,"s":"במה עוסק ערעור אזרחי (ע\"א) דה כהן בע\"מ נ' אלון עמרם ומה הייתה עמדת ביהמ\"ש לעניין עבודת המתווך במקרקעין באמצעות התאגיד?","o":["הערעור עוסק בשאלה האם יכול מתווך במקרקעין לפעול באמצעות תאגיד. עמדת ביהמ\"ש היא כי מתווך במקרקעין אינו רשאי לפעול באמצעות התאגיד.","הערעור עוסק בשאלה האם יכול מתווך מקרקעין לפעול באמצעות תאגיד, עמדת ביהמ\"ש בעניין היא כי אין מניה ששירותי תיווך יינתנו באמצעות התאגיד, ובלבד שפעולת התיווך תיעשה ע\"י מתווך בעל רישיון.","הערעור עוסק בשאלה האם טופס ההזמנה לבלעדיות נחתם כדין. עמדת ביהמ\"ש בעניין היתה כי הטופס לא נחתם כדין.","הערעור עוסק בשאלת גובה דמי התיווך לה זכאית המערערת. עמדת ביהמ\"ש לעניין הייתהכי יש מגבלה לגובה דמי התיווך שזכאי לדרוך מתווך במקרקעין."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2017-04#15","e":17,"n":15,"s":"ליוסף הוצא צו עיקול על זכויותיו בחנות הרשומה על שמו בלשכת רישום המקרקעין (טאבו), בשל אי תשלום חובות. רשם ההוצאה לפועל הורה על מכירת החנות בשל אי תשלום החוב האמור. שמאי מקרקעין ערך דו\"ח שומה לשווי החנות. העתק מדו\"ח השומה נשלח גם ליוסף. יוסך אנו מקבל את האמור בשומה ולכן הגיש שומה של שמאי מקרקעין אחר, הסותר את השומה שקיבל. להחלטת מי תועבר המחלוקת לקביעת השומה לצורך מכירת החנות?","o":["קביעת השומה תועבר להחלטת השמאי הממשלתי הראשי.","קביעת השומה תועבר להחלטת שמאי מקרקעין מכריע.","קביעת השומה תועבר להחלטת רשם ההוצאה לפועל.","השומה תיקבע על ידי בית המשפט על פי ממוצע בין שתי השומות המקרקעין שנערכו."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2017-04#16","e":17,"n":16,"s":"יוסף מתגורר בבית הפרטי שמפלסו נמוך מזה של שכנו דוד. בין שני הבתים קיים קיר הפרדה/ תמך בגובה של כ- 2 מטרים. כתוצאה מהגשמים האחרונים הקיר נסדק ומהווה סכנה. עקב כך יש להרסו ולבנותו מחדש.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מכיוון שמדובר במחוברים שבמיצר- התיקון יחול על דוד, המתגורר במפלס העליון.","הוצאות תיקון הקיר ההפרדה יחולו בחלקים שווים על יוסף ודוד.","הוצאות תיקון קיר ההפרדה יחולו על דוד, מאחר שהקיר משמש אותו גם כקיר תמך.","הוצאות תיקון הקיר יחולו על יוסף, מאחר שהקיר מגן על ביתו הנמוך."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2017-04#17","e":17,"n":17,"s":"בבעלות ברוך ואשתו שתי דירות מגורים ברמת גן. בתם חנה התחתנה והם שוקלים להעביר לה דירה אחת במתנה, בתנאי שלא תמכור אותה, אלא רק בהסכמתם.\nכיצד על ברוך ואשתו לפעול כדי להבטיח את רצונם?","o":["עם העברת הדירה לחנה, לא תהיה לברוך ולאשתו כל אפשרות למנוע את מכירת הדירה ע\"י חנה בעתיד.","עם העברת הדירה לחנה על ברוך ואישתו לרשום הערת אזהרה לטובתם בלשכת רישום המקרקעין על הצורך בהסכמתם למכירה בעתיד.","ההורים אינם אמורים לשעות דבר בעניין, מאחר שברגע שחנה תרצה למכור את הדירה, נדרש רשם המקרקעין לפנות קודם אל נותני המתנה, כלומר, להורים, כדי לקבל את אישורם למכירה.","עם העברת הזכויות לחנה ע\"י ברוך ואשתו, עליהם להבהיר בעל פה התנייתם זו לחנה ובעלה ובכך שיבטיחו את רצונם."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2017-04#18","e":17,"n":18,"s":"חברת \"זוהר הבית - קבלני בניין\" בנתה בניין מגורים בחיפה ובו 3 דירות. כל הדירות נמכרו לרוכשים פרטיים.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על החברה הקבלנית מוטלת החובה לרשום את הבית בפנקס הבתים המשותפים.","אין חובה שהחברה הקבלנית תרשום את הבית בפנקס הבתים המשותפים, מאחר שמדבור בבניין שבו פחות מ-4 דירות.","על פי חוק המכר (דירות) רישום זכויות (תיקון 5) תשע\"א -2011, לאחר שנת הבדק על נציגות הבניין לדאוג לרישום הבית בפנקס הבתים המשותפים.","החובה לרשום את הבניין בפנקס הבתים המשותפים מוטלת על עורכי הדין של רוכשי הדירות."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2017-04#19","e":17,"n":19,"s":"דוד רכש מקבלן דירה בת 4 חדרים בשטח של 110 מ\"ר, וזאת על פי תשריט הדירה והמפרט שלה שצורפו לחוזה המכר. לאחר קבלת הדירה ביצע דוד מדידה באמצעות מודד מומחה והסתבר כי שטח הדירה 105 מ\"ר - משמע מדובר בסטייה של כ- 4.5% בין השטח שהופיע במפרט שצורף לחוזה המכר לבין שטח למעשה (השטח הקיים בפועל). דוד החליט לתבוע פיצוי מהקבלן על שטח הדירה החסר.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דוד זכאי לפיצוי, מאחר שסטייה קבילה הינה בשיעור של עד 2% בין השטח המופיע במפרט לשטח במעשה.","דוד אינו זכאי לפיצוי, שכן קיימת אפשרות לסטייה קבילה בשיעור של עד 3% בין השטח המופיע במפרט לשטח במעשה.","דוד אינו זכאי לפיצוי, שכן קיימת אפשרות לסטייה קבילה בשיעור של עד 5% בין השטח המופיע במפרט לשטח למעשה.","דוד זכאי לפיצוי, מאחר שסטייה קבילה הינה בשיעור של עד 1.5% בין השטח המופיע במפרט לשטח למעשה."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2017-04#20","e":17,"n":20,"s":"הילה מעוניינת להשכיר את דירתה לתקופה ארוכה באמצעות ויקטור, מתווך במקרקעין, עימו חתמה על הסכם בלעדיות. המתווך מצא שוכר לדירה המעוניין לשכור אותה למשך 5 שנים והוא מוכן לשלם את דמי השכירות לכל התקופה מראש. הילה הודיעה לויקטור המתווך כי תשלם לו דמי תיווך בסכום של חודש שכירות בלבד. ויקטור טוען כי מגיע לו 5% מהסכום העיסקה, מאחר שזו שכירות ארוכה.\nבנסיבות עניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הילה צודקת, על פי החוק בעיסקאות של שכירות ניתן לגבות דמי תיווך של עד חודש שכירות בתוספת מע\"מ.","ויקטור צודק, על פי החוק, רשאי המתווך לגבות דמי תיווך של עד 5% מהעיסקה בתוספת מע\"מ בעיסקת -\"שכירות ארוכה\".","על פי החוק, המתווך זכאי ל2% כדמי תיווך מסכום העיסקה.","חוק המתווכים במקרקעין לא קובע באופן מפורש מה גובה התיווך והם עניין שיסוכם מראש ובכתב בין המתווך ללקוח."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2017-04#21","e":17,"n":21,"s":"ניסים, בעל חנות, סיכם על השכרת חנותו לסימה לתקופה של שנתיים. העיסקה סוכמה בלחיצת יד, אשר דמי השכירות החודשיים יעמדו על 5,000 ש\"ח. בהתאם לכך שילמה סימה לניסים את דמי השכירות עבור החודש הראשון. עוד בטרם קיבלה סימה את החזקה בחנות. השכיר ניסים את החנות לעלי, בחוזה לתקופה של 3 שנים, וזאת לאחר שעלי הציע לשלם לניסים 5,500 ש\"ח לחודש ובתוספת חד פעמית של 1,000 ש\"ח , וזאת כדי שיקבל עדיפות על סימה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכותו של עלי עדיפה על זכותה של סימה.","זכותה של סימה עדיפה על זכותו של עלי.","ניסים היה רשאי להתעלם מהסיכום והחליט למי להשכיר את החנות בהתאם לשיקול דעתו הבלעדי.","על כל הצדדים (ניסים, סימה ועלי) לפנות למפקח על המקרקעין או למגשר כדי שיחליט זכותו של מי עדיפה."],"c":[1],"a":false,"note":"","sub":"r_rent"},{"id":"2017-04#22","e":17,"n":22,"s":"בפסק דין תא 1966/05 קשתות הנשיא יעוץ ושווק נדל\"ן בע\"מ נגד דוד שמעון ואח', התובעת מבקשת לחייב את הנתבע בתשלום דמי תיווך עבור מכירת דירתו בחיפה. הנתבע לא שילם לתובעת את דמי התיווך הנדרשים.\nמה הייתה טענתו העיקרית של הנתבע לסירובו לשלם דמי תיווך לתובעת?","o":["לטענת הנתבע, התובעת הפרה את הוראות חוק המתווכים במקרקעין, האוסר על מתווך לערוך או לסייע בעריכת מסמכים בעלי אופי משפטי בקשר עם עיסקת המקרקעין.","לטענת הנתבע, התובעת הפרה את הוראות חוק המתווכים במקרקעין, האוסר על מתווך לעסוק בתיווך מקרקעין, אלא אם הוא בעל רישיון בתוקף.","לטענת הנתבע, התובעת הפרה את הוראות חוק המתווכים במקרקעין ואינה זכאית לדמי תיווך כי לא החתימה אותו על ההזמנה בכתב לביצוע פעולת תיווך.","לטענת הנתבע, התובעת אינה זכאית לדמי תיווך, מכיוון שחלפו יותר משישה חודשים מיום ההזמנה ותקופת הבלעדיות תמה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2017-04#23","e":17,"n":23,"s":"עומרי החלטי לשכור דירה. הוא מצא דירה שמתאימה בדיוק לצורכיו והחליט לשכור אותה למשך 5 שנים. הוא אף ביקש וקיבל אופציה להמשך השכירות, למשך 6 שנים נוספות.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["השכירות טעונה רישום, וההתחייבות לביצוע העיסקה טעונה מסמך בכתב.","השכירות טעונה רישום, וההתחייבות לביצוע העיסקה אינה טעונה מסמך בכתב.","השכירות אינה טעונה רישום, וההתחייבות לביצוע העיסקה אינה טעונה מסמך בכתב.","השכירות אינה טעונה רישום, וההתחייבות לביצוע עסקה טעונה מסמך בכתב."],"c":[0],"a":false,"note":"","sub":"r_rent"},{"id":"2017-04#24","e":17,"n":24,"s":"איזה מהמשפטים הבאים הוא הנכון ביותר בהקשר של \"משכנתא\" ו\"משכון\"?","o":["אין הבדל מהותי בין השניים- ההבדל הוא טכני בלבד וניתן לרשום \"משכתנא\" או \"משכון\", לפי הנוחות.","\"משכנתא\" היא שיעבוד הנרשם בלשכת רישום המקרקעין (הטאבו) על נכס מקרקעין, לשם הבטחת הלוואה ואילו \"משכון\" מתייחס לשיעבוד זכויות ונרשם ברשם המשכונות.","\"משכנתא\" היא שיעבוד הנרשם בלשכת המקרקעין (הטאבו) על נכס מקרקעין, לשם הבטחת הלוואה לרכישת דירה בלבד.","\"משכון\" הוא שיעבוד זכויות במקרקעין ורישומן בלשכת רישום המקרקעין."],"c":[1],"a":false,"note":"","sub":"l_mortgage"},{"id":"2017-04#25","e":17,"n":25,"s":"איזה מהמשפטים הבאים מתאר בצורה הנכונה ביותר את המונח - \"בעלות במושע\"?","o":["\"בעלות במושע\"- שיתוף במקרקעין שבו לכל שותף במקרקעין יש 50% בלתי מסוימים במקרקעין.","\"בעלות במושע\"- הינה בעלות משותפת במקרקעין של מספר בעלים, אשר בעלותו של כל אחד מהם, לפי חלקו, מתפשטת בכל אתר ואתר.","\"בעלות במושע\"- מתייחסת להסכם שיתוף במקרקעין המייחד לכל שותף חלק מסוים במקרקעין.","\"בעלות במושע\"- בעלות משותפת בדירות מגורים לפי חוק המקרקעין."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2017-07#1","e":18,"n":1,"s":"אסף הינו דייר מוגן בדירה בדמי מפתח בתל אביב משנת 1955, וכעת החליט למכור את זכויותיו בדירה.\nמה יהיה חלקו בדמי המפתח?","o":["66%.","79%.","59%.","75%."],"c":[0,1],"a":false,"note":"התשובות הנכונות: א׳ וב׳","sub":"r_protected"},{"id":"2017-07#2","e":18,"n":2,"s":"ליאון הוא דייר מוגן בנכס המשמש אותו כמספרה לפי חוזה השכירות. לימים הוא פנה לבעל הבית מנחם וביקש להשתמש במושכר כבית קפה. מנחם הבעלים סירב לבקשת ליאון, ללא כל סיבה סבירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על ליאון לפנות לבית המשפט השלום ולבקש לשנות את מטרת המושכר.","על ליאון לפנות לבית הדין לשכירות בבקשה לשנות את מטרת המושכר.","על ליאון לפנות למפקח על המקרקעין ולבקש לשנות את מטרת המושכר.","ליאון יכול לפנות ישירות לעירייה לקבלת רישיון עסק ולשינוי ממספרה לבית קפה."],"c":[1],"a":false,"note":"","sub":"r_rent"},{"id":"2017-07#3","e":18,"n":3,"s":"משנת 1985 מתגורר פנחס בבית פרטי, אליו קיימת גישה ראשית בחזית וגישה אחורית דרך שביל העובר בגינתו של שכנו צבי ומקצר את דרכו של פנחס הביתה. פנחס קיבל את הסכמתו בעל פה של צבי למעבר מאז שהוא מתגורר בבית. לפני מספר ימים ביקש צבי מפנחס לא לעבור יותר בשביל האחורי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["צבי צודק, כי זכותו למנוע מפנחס לעבור בשטחו.","דרישת פנחס הינה למעשה להחזיק בשביל האחורי ולכן צבי יכול למנוע ממנו להשתמש בשביל האחורי.","זכותו של פנחס להשתמש בשביל הגישה האחורי העובר בשטחו של צבי והוא זכאי לדרוש לרשום את הנאתו בשביל האחורי.","מכיוון שההסכמה לשימושו של פנחס בשביל האחורי לא ניתנה בכתב, רשאי צבי להספיק את השימוש של פנחס בשביל האחורי."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2017-07#4","e":18,"n":4,"s":"יעקב ורחל (בני זוג) הם בעלי חנות בתל אביב המנוהלת על ידם במשותף. לימים, מאס יעקב בעבודתו בחנות והחליט למכור את חלקו לאחר. הוא הציע לרחל בכתב לרכוש את חלקו בסכום של 500,000 ש\"ח. רחל סירבה, בטענה שזה סכום גבוה עבורה. לאחר 5 חודשים הציע יעקב לשמשון לרכוש את חלקו בסכום זהה לזה שהציע רחל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכותו של יעקב למכור את חלקו לשמעון בעקבות סירובה של רחל.","אסור ליעקב למכור את חלקו כל זמן שרחל היא בת זוגו.","אסור ליעקב למכור את חלקו, אלא אם עברו 4 חודשים מיום הסירוב של רחל.","יעקב אינו רשאי למכור את חלקו, אלא רק לאחר שיציע שוב לרחל לרכוש את חלקו והיא תסרב."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2017-07#5","e":18,"n":5,"s":"באסיפת דיירים בבית משותף בין 4 קומות ובו 8 דירות, הוחלט על התקנת מעלית ברוב של 6 בעלי דירות. דיירי קומת הקרקע התנגדו, בטענה כי המעלית אינה שימושית עבורם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההחלטה שהתקבלה ברוב של שני שלישים מבעלי הדירות בבית המשותף להקמת מעלית מחייבת את כל בעלי הדירות בבניין להשתתף בהוצאות התקנת המעלית.","ההחלטה שהתקבלה ברוב של שני שלישים מבעלי הדירות בבית המשותף אינה מחייבת את דירות הקרקע בתשלום ההתקנה והאחזקה של המעלית.","בעלי הדירות בקומת הקרקע פטורים מהוצאות להתקנת המעלית, אך חייבים להשתתף בהוצאות החזקתה כיתר בעלי הדירות.","רק בעלי הדירות שהחליטו על התקנת המעלית ישאו בהוצאות התקנתה ורק הם יהיו חייבים בהוצאות החזקתה והפעלתה."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2017-07#6","e":18,"n":6,"s":"תא 2461/07 דרור בר און ואח' נ' יפה סידרון ואח' הינה תביעה כספית, בגין הפרת הסכם להזמנת שירותי תיווך בבלעדיות. בית המשפט דחה את התביעה לתשלום דמי התיווך בשל שתי טעות עיקריות.\nמה היו שתי הטענות על פיהן ביהמ\"ש דחה את התביעה?","o":["המתווך לא ביצע ולא פירט את פעולות השיווק בהתקשרות להזמנת שירותי תיווך בבלעדיות וכן המתווך לא היה הגורם היעיל בעיסקה.","המתווך לא החתים את הנתבעת על הסכם בלעדיות כקבוע בחוק, לכן המתווך פעל בחוזר תום לב.","למתווך לא היה רישיון תיווך במקרקעין בתוקף בתקופת ביצוע ההסכם למכירת הדירה, וכן המתווך פעל בחוסר תום לב.","המתווך לא היה הגורם היעיל בעיסקה, וכן המתווך פעל בחוסר תום לב."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2017-07#7","e":18,"n":7,"s":"בבית משותף בן 10 דירות הוחלט על ידי 5 בעלי דירות, המהווים בעלים של 62.5% משטח הדירות בבניין, לבצע עבודה ברכוש המשותף שמטרתה הרחבת את הדירות עפ\"י תוכנית חיזוק.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההחלטה תקינה, מאחר שקיים רוב של בעלי דירות המחזיקים יותר מ-60% משטחי הדירות בבניין.","ההחלטה אינה תקינה, מאחר שיש צורך ברוב של 60% מבעלי הדירות בבניין.","ההחלטה תקינה, מאחר שמספיק שמחצית מבעלי הדירות קיבלו החלטה על ביצוע עבודות ברכוש המשותף.","ההחלטה אינה תקינה, מאחר שאישור עבודה ברכוש משותף במטרה להרחיב דירה הינה בסמכות המפקח על המקרקעין."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2017-07#8","e":18,"n":8,"s":"בשנת 2014 העניקה הוועדה המקומית לתכנון ובנייה היתר ל\"חברה העירונית להתחדשות\" לבנות מגדל מגורים חדש בראשל\"צ. בשנת 2017 השלימה החברה, בשעה טובה, את בנייתו של המגדל והתחילה באיכלוסו. החברה טרם סיימה את כל עבודות הפיתוח והגינון בחצרים סביב המגדל. כמו כן הוועדה המקומית לא חתמה על \"טופס 4\" לבניין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שהבנייה הושלמה והדירות מוכנות למגורים, אין כל מניעה להתחיל באיכלוסן.","הוועדה המקומית העניקה היתר לבנייתו של מגדל המגורים, לפיכך אין כל מניעה להתחיל באיכלוסן של הדירות.","כל עוד לא חתמה הוועדה המקומית על \"טופס 4\" לא ניתן לאכלס את הדירות בבניין.","כל עוד לא סיימה החברה את כל עבודות הפיתוח והגינון בחצרים סביב הבניין, לא ניתן להתחיל באיכלוסו."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2017-07#9","e":18,"n":9,"s":"צאלה מכרה את דירת מגוריה לאלכסנדר. העיסקה הושלמה, פרט לרישומה בפנקסי המקרקעין על שם אלכסנדר. אלכסנדר מכר את הדירה שרכש לחברה קבלנית בע\"מ, בעיסקה זו שולמה התמורה במלואה והיא לא הסתיימה ברישום. החברה הקבלנית לא רשמה הערת אזהרה לטובתה, ללא הצדקה, חלפו שנים רבות. אלכסנדר מכר את הדירה בשנית ליהודה, אשר השלים את העיסקה בתמורה, פעל בתום לב ורשם מיד הערת אזהרה לטובתו. החברה הקבלנית תובעת אכיפת ההסכם עם אלכסנדר ורישום הדירה על שמה. אלכסנדר ויהודה מתנגדים לכך, תוך שיהודה מבקש כי ההסכם עימו ייאכף.\nבנסיבות העניין ועל פי פסק הדין שלמה נגד בריטיש קולינאל חברה בע\"מ ואחרים, איזה מהמשפטים הבאים הוא נכון ביותר?","o":["החברה הקבלנית הכשילה את יהודה כאשר נמנעה מלרשום הערת אזהרה לטובתה במשך תקופה ארוכה, ולכן לא תעמוד לה הזכות לאכיפת הסכם המכר עם אלכסדנר וזכותו של יהודה גוברת.","החברה הקבלנית היא הרוכשת הראשונה בזמן אשר השלימה את העיסקה בתמורה, לפיכך הן החברה הקבלנית והן יהודה לא זכאים לתבוע את אכיפת ההסכם עימם.","אלכסנדר לא רשאי היה למכור את הדירה כל עוד זו לא נרשמה על שמו בפנקסי המקרקעין, לפיכך הן החברה הקבלנית והן יהודה לא זכאים לתבוע את אכיפת ההסכם עימם.","אלכסנדר פעל בחוסר תום לב כאשר מכר פעמיים את אותה הדירה, לכן עיסקת המכר בינו לבין צאלה בטלה ויש להחזיר את המצב לקדמותו ולרשום את הזכויות בדירה על שמה של צאלה."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2017-07#10","e":18,"n":10,"s":"תמי בעלת זכויות המכירה בדירת מגוריה, שילמה למינהל מקרקעי ישראל (רשות מקרקעי ישראל) דמי היוון עבור כל תקופת החכירה. כעת ברצונה להעביר את מלוא זכויותיה בדירה לצג ג'. מינהל מקרקעי ישראל (רשות מקרקעי ישראל) מתנה את העברת הזכויות לצד ג' בתשלום דמי הסכמה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["תמי לא יכולה לממש את זכויותיה בדירה, מאחר שחוכר נכס מאת מינהל מקרקעי (רשות מקרקעי ישראל) אינו רשאי כלל להעביר את זכויותיו בנכס לצד ג'.","תמי מחויבת בתשלום, שכן דמי הסכמה הינם דרישת תשלום אשר דורש מינהל מקרקעי ישראל (רשות מקרקעי ישראל) מחוכר, כתנאי למתן הסכמתו להעברת זכויות החכירה בנכס לצד ג'.","תמי פטורה מהתשלום. שכן ההיוון פוטר את חוכר הנכס מאתר מינהל מקרקעי ישראל (רשות מקרקעי ישראל) מתשלום דמי הסכמה.","תמי רשאית להשכיר את הנכס לתקופה קצובה אך לא להעביר את מלוא זכויות החכירה שלה בנכס לצד ג'."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2017-07#11","e":18,"n":11,"s":"בפס\"ד תא\"מ 10272-02-11 ב.פ הנשיא סוכנויות נדל\"ן בע\"מ נ' בקרמן ואח', נדונה תביעה לתשלום דמי תיווך בגין רכישת דירה. בית המשפט דחה את התביעה לתשלום דמי תיווך בשל שתי טענות עיקריות שהופנו כנגד המתווך.\nמה היו שתי הטענות על פיהן ביהמ\"ש דחה את התביעה?","o":["המתווך לא פעל בנאמנות ובהגינות לטובת לקוחו. בהזמנת שירותי התיווך היו פרטים חסרים.","המתווך לא פירט את פעולות השיווק \"בהזמנת שירותי תיווך\" כחוק. המתווך לא היה הגורם היעיל בעיסקה.","המתוווך לא חתם ולא החתים את הנתבע על הסכם בלעדיות לפי חוק. המתווך פעל בחוסר תום לב.","למתווך לא היה רישיון תיווך במקרקעין בתוקף בתקופת ביצוע ההסכם למכירת הדירה. המתווך פעל החוסר תום לב."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2017-07#12","e":18,"n":12,"s":"עניינה של התובענה הכספית בפס\"ד ת\"א 35922/07 מרדכי עו נ' משה עזרא הוא שיתף פעולה בין מתווכים, בקשר למכירת דירה וחלוקת דמי התיווך שהתקבלו ממכירתה. מה הייתה עמדת ביהמ\"ש לעניין הסכם שיתוף הפעולה בין המתווכים?","o":["בהתאם לנוהג, הסכמי שיתוף פעולה נעשים בכתב, ולכן אין זה סביר שמתווך יסכים לשתף פעולה עם מתווך אחר מבלי שנחתם הסכם על כך.","בשיתוף פעולה בין משרדי תיווך נפרדים, אין הכרח כי ההסכמים ייעשו בכתב, אלא רק בעיסקאות מסחריות.","על פי חוק, הסכמי שיתוף פעולה בין מתווכים לבין עצמם ייערכו בכתב.","קיימים הסכמי שיתוף פעולה בין מתווכים במקרקעין בכתב, אך אין בכך כדי לסתור את העובדה שהסכמים כאלה נעשים גם בעל פה."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2017-07#13","e":18,"n":13,"s":"דוד רכש דירה מחברת הבנייה \"יד ברמה\". להפתעתו גילה כי בחוזה המכר מחיר הדירה הוצמד למדד המחירים לצרכן המתפרסם מידי חודש.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חברת הבנייה רשאית להצמיד את מחיר הדירה למדד המחירים לצרכן המתפרסם מידי חודש.","חברת הבנייה רשאית להצמיד את מחיר הדירה רק למדד תשומת הבנייה המתפרסם מידי חודש.","חברת הבנייה רשאית להצמיד את מחיר הדירה למדד המחירים לצרכן רק באישור הממונה על שוק ההון.","חברת הבניה חייבת לאפשר לרוכש לבחור לאיזה מדד להצמיד את מחיר הדירה."],"c":[0],"a":false,"note":"","sub":"k_consumer"},{"id":"2017-07#14","e":18,"n":14,"s":"חברת הבניה חייבת לאפשר לרוכש לבחור לאיזה מדד להצמיד את מחיר הדירה.","o":["הקבלן חייב לתת בטוחה לכסף שאברהם ישלם לו.","אין צורך בהעמדת בטוחה תמורת התשלום, מאחר שמדובר בשכירות.","כאשר רוכשים מקבלן או שוכרים לתקופה של יותר מ-10 שנים על הקבלן לתת בטוחה או ערבות בנקאית.","אסור לקבלן להשכיר את המשרד לתקופה העולה על 10 שנים ולכן העיסקה אינה חוקית."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2017-07#15","e":18,"n":15,"s":"יוגב, קבלן מאיזור השרון, חתם על חוזה פיתוח עם רשות מקרקעי ישראל בו התחייב לבנות בתוך ארבע שנים בניין מגורים בן 7 קומות ו-28 דירות בהרצליה. בשל עיכובים שונים. לא הצליח יוגב להשלים במועד את בניית הבניין. רשות מקרקעי ישראל פנתה אל יוגב בדרישה לבטל את החוזה שנחתם בין הצדדים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בניית הבניין כבר כמעט הושלמה לחלוטין, לפיכך רשות מקרקעי ישראל אינה זכאית לבטל את החוזה שנחתם בין הצדדים.","ליוגב זכות חכירה בקרקע עליה הקים את בניין המגורים, לפיכך רשות מקרקעי ישראל אינה זכאית לבטל את החוזה שנחתם בין הצדדים.","יוגב לא השלים את בניית הבניין במועד שנקבע, לפיכך רשות מקרקעי ישראל הזכות לבטל את החוזה שנחתם בין הצדדים.","הקרקע שייכת לרשות מקרקעי ישראל, לפיכך לה הזכות, בכל מקרה, לבטל את החוזה שנחתם בין הצדדים תוך מתן פיצוי הולם לקבלן."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2017-07#16","e":18,"n":16,"s":"עדה רכשה דירת מגורים בבית משותף וגילתה כי הדירה אינה מחוברת לדוד שמש. היא פנתה לחברת \" אור השמש\", הזמינה דוד שמש ואף קיבלה היתר כדין להתקנתו במקום סביר על גג הבית המשותף, אשר שטחו מספיק לכל דודי השמש בבניין, בעלי הדירות האחרים בבית המשותף מתנגדים להתקנה האמורה, גם ששטח הגג אינו משמש אותם למטרה מיוחדת אחרת.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בעל דירה, אשר קיבל היתר להתקנת דוד שמש ומילא אחר תנאיו, רשאי להתקין, בנסיבות האמורות, דוד שמש, על גג הבית המשותף, ללא הסכמת בעלי הדירות האחרים.","גם אם ניתן היתר להתקנת דוד שמש ובעל הידרה מילא אחר כל תנאיו - התקנת דוד שמש על גג הבית המשותף מחייבת, בנסיבות האמורות, הסכמה מראש ובכתב של כל בעלי הדירות בבית המשותף.","בעל דירה, אשר קיבל היתר להתקנת דוד שמש ומילא אחר תנאיו, רשאי להתקין, בנסיבות האמורות, דוד שמש, על גג הבית המשותף, ובלבד שכל בעלי הדירות בבניין אישרו לו להתנתק ממערכת החימום המרכזית.","גם אם ניתן היתר להתקנת דוד שמש ובעל הידרה מילא אחר כל תנאיו - התקנת דוד שמש על גג הבית המשותף מחייבת, בנסיבות האמורות, הסכמה מראש ובכתב של 80% מבעלי הדירות בבית המשותף."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2017-07#17","e":18,"n":17,"s":"בית משותף באשדוד, בן 8 קומות ו- 32 דירות ששטחן זהה, נהרס בחלקו משריפה. 24 בעלי דירות בבניין החליטו לתקנו ולשקמו, 8 מבעלי הדירות בבניין מתנגדים למהלך שיקום הבניין והדירות ומסרבים לשאת בכל ההוצאות הכרוכות בכך, הגם שאין אפשרות מעשית לשקם את הבית המשותף לגבי חלק מהדירות בלבד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בעלי הדירות המתנגדים אינם מחויבים לשאת בהוצאות, שכן ההחלטה של שיקום הבניין לא התקלה פה אחד על ידי כל בעלי הדירות בבית המשותף.","בעלי הדירות המתנגדים אינם מחויבים לשאת בהוצאות שכן יש לשקם את הבניין במסגרת תמ\"א 38 ולדרוש מהיזם לשאת בכל ההוצאות הכרוכות בבנייה.","ההחלטה של שלושה רבעים מבעלי הדירות, במקרה זה, לשקם את הבניין והדירות, מחייבת את כל בעלי הדירות, וניתן להגיש תביעה נגד המתנגדים למפקח על המקרקעין.","במקרה בו בית משותף שנהרס, כולו או מקצתו, אפילו מיעוט מהדיירים החליטו להקימו מחדש או לתקנו, יישא כל בעל דירה בהוצאות הכרוכות בכך לגבי דירתו וישתתף, לפי חלקו, בהוצאות הכרוכת ברכוש המשותף."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2017-07#18","e":18,"n":18,"s":"רמי בן ה- 19, אזרח ותושב ארה\"ב בעל היתר כדין לעבודה בישראל ורישיון לתיווך בארה\"ב, הגיש ביום 01.02.2017 בקשה לקבלת רישיון תיווך במקרקעין, וזאת לאחר שעמד בהצלחה בבחינה לקבלת רישיון תיווך במקרקעין בישראל. הגם שמצבו הכלכלי של רמי איתן הוא חסר כל עבר פלילי, החליט רשם המתווכים, בהתבסס על הנתונים האמורים, לדחות את בקשתו של רמי ולא העניק לו רישיון.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["החלטת רשם המתווכים נכונה - רמי אינו אזרח או תושב של מדינת ישראל, לכן הוא לא רשאי לקבל רישיון של מתווך במקרקעין.","החלטת רשם המתווכים נכונה - לרמי טרם מלאו 21 שנים, ולכן הוא לא רשאי לקבל רישיון של מתווך במקרקעין.","החלטת רשם המתווכים שגויה - רמי עומד בתנאים הבסיסיים לקבלת רישיון של מתווך במקרקעין.","החלטת רשם המתווכים שגויה - מאחר שרמי הוא תושב חוץ המחזיק ברישיון לתיווך בארה\"ב, הוא רשאי לקבל רישיון של מתווך מקרקעין בישראל, ללא צורך בבחינת הרישוי בישראל."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2017-07#19","e":18,"n":19,"s":"אילן, בעלים של דירת מגורים, חתם לשחר, מתווך מקרקעין במקצועו, על הזמנת שירותי תיווך והתחייבות לבלעדיות, שחר המתווך לא חתן מצידו על טופס ההזמנה ועל ההתחייבות לבלעדיות, אך עשה מספר פעולות שיווק. אילן מכר את דירת המגורים ללא ידיעת שחר ומסרב לשלם דמי תיווך. שחר הגיש תביעה כספית כנגד אילן לתשלום דמי התיווך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["תביעתו של שחר תידחה- העובדה ששחר המתווך לא חתם על הסכם הבלעדיות מביאה למסקנה שלא נכרת חוזה בלעדיות בינו לבין אילן.","תביעתו של שחר תידחה - אילן מכר את דירת המגורים שלא באמצעות שחר, לפיכך שחר לא זכאי לדמי תיווך.","תביעתו של שחר תתקבל – הסכם בלעדיות יכול להיכרת בין הצדדים גם בעל-פה.","תביעתו של שחר תתקבל- על טופס הזמנת שירותי תיווך ועל התחייבות לבלעדיות יש צורך בחתימת מזמין שירותי התיווך בלבד."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2017-07#20","e":18,"n":20,"s":"יערית, שזה עתה סיימה את לימודיה בסמינר לגננות, פנתה לדודי, מתווך במקרקעין, וביקשה ממנו למצוא עבורה נכס בו תוכל לפתוח גן ילדים. דודי הציע ליערית לרכוש נכס בבניין משותף במרכז תל- אביב, שהוא דירת מגורים עם יציאה לחצר. לטענתו, הנכס מתאים בדיוק למטרותיה של יערית, שכן בהפסקות היא תוכל לעשות שימוש בלעדי בחצר הבניין להנאת ילדי הגן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל מניעה שיערית תעשה שימוש בלעדי בחצר הבניין, אך עליה לקבל הסכמה בכתב מרוב בעלי הדירות לפתיחת גן ילדים בבית המשותף.","על יערית לבדוק אם תוכנית המיתאר (תב\"ע) במקום מאפשרת פתיחת גן ילדים, אם יש לנכס היתר לשימוש חורג לשמש כגן ילדים ואם החצר צמודה לנכס.","לא ניתן לפתוח גן ילדים בדירת מגורים בבית משותף.","אין כל מניעה שיערית תרכוש את הנכס, תפתח בו גן ילדים ותעשה שימוש בלעדי בחצר, ובלבד שהגן יפעל עד השעה 14:00."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2017-07#21","e":18,"n":21,"s":"יורם, בעל דירה בבית משותף, המתנייד באמצעות כיסא גלגלים, פנה לנציגות הבית וביקש להתקין תאורת חירום בשביל הגישה ובכניסה לבית המשותף. הנציגות נענתה מיד לבקשתו, הזמינה התקנת תאורת חירום מחברת \"אור השחר\". יורם פרע את מלוא החשבון. בעלי הדירות בבניין זועמים על הנציגות וטוענים כי פעלה בהיעדר סמכות עת התקינה את התאורה האמורה ללא הסכמת כל בעלי הדירות בבניין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["נציגות הבית המשותף פעלה בסמכות, מאחר שמדובר בפעולה שעניינה התאמה שאינה טעונה הסכמה והיא בוצעה על חשבונו של יורם.","נציגות הבית המשותף פעלה בסמכות, מאחר שמותר לנציגות לבצע כל פעולה אשר לפי ראות עיניה משפרת את איכות החיים בבית המשותף.","נציגות הבית המשותף פעלה בהיעדר סמכות, מאחר שמדובר בפעולה שעניינה התאמה אשר טעונה הסכמה של רוב בעלי הדירות בבית המשותף.","נציגות הבית המשותף פעלה בהיעדר סמכות, מאחר שמדובר בפעולה שעניינה התאמה אשר טעונה הסכמה של בעלי הדירות שבבעלותם שישים אחוזים מן הדירות בבניין."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2017-07#22","e":18,"n":22,"s":"מהו \"הסכם משבצת\" ?","o":["הסכם חכירה בין אגודה שיתופית (לרוב מושב או קיבוץ) לבין רשות מקרקעי ישראל.","הסכם הקצאת \"נחלות\" למגורים ולחקלאות, אשר נחתם בין אגודה שיתופית לבין חברי האגודה.","הסכם הקצאת \"משקי עזר\" למלאכה ולעיבוד חקלאי מצומצם, אשר נחתם בין אגודה שיתופית לבין חברי האגודה.","הסכם המאשר הרחבות והיתרים לשימוש שונה מהייעוד של הקרקע במושבים ובקיבוצים."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2017-07#23","e":18,"n":23,"s":"קיבוץ \"עין להבים\" שהוא אגודה שיתופית, חוכר מזה עשרות שנים קרקע למגורים ולחקלאות מרשות מקרקעי ישראל, אפרים, חבר \" עין להבים\", מתגורר ומעבד את משקו החקלאי בקיבוץ מזה 30 שנה, כאשר מלאו לאפרים 75 שנים הוא החליט להפסיק את חברותו בקיבוץ \"עין להבים\", לעבור להתגורר בבאר שבע, להשכיר את ביתו בקיבוץ ולהמשיך לעבד את המשק החקלאי הצמוד אליו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אפרים מתגורר ומעבד את משקו החקלאי בקיבוץ מזה 30 שנה, לפיכך יש לו זכות קניינית בקרקע, המאפשרת לו להשכיר את ביתו בקיבוץ ולהמשיך לעבד את המשק החלקאי.","אפרים הפסיק את חברותו בקיבוץ, לפיכך הוא איבד את זכותו כ\"בר רשות\" ואין באפשרותו להשכיר את ביתו בקיבוץ ולהמשיך לעבד את המשק החקלאי.","אפרים יכול להמשיך ולעבד את משקו החקלאי, אך אין באפשרותו להשכיר את ביתו בקיבוץ.","אפרים יכול להשכיר את ביתו בקיבוץ, אך אין באפשרותו להמשיך ולעבד את המשק החקלאי."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2017-07#24","e":18,"n":24,"s":"איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["נפגע כתוצאה מהפרת חוזה אינו נדרש להוכיח נזק כאשר הוא תובע פיצוי מוסכם.","נפגע כתוצאה מהפרת חוזה אינו רשאי לתבוע אכיפת חוזה ובנוסף פיצויים.","חובת הקטנת הנזק אינה חלה על נפגע כתוצאה מהפרת החוזה.","נפגע כתוצאה מהפרת חוזה רשאי לתבוע את אכיפת החוזה, בנוסף לביטולו."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2017-07#25","e":18,"n":25,"s":"איזה מהמשפטים הבאים אינו נכון?","o":["ניתן להצמיד לדירת מגורים חלק מחדר המדרגות בבית משותף, וזאת בקבלת הסכמת רוב הדיירים.","הרוב הדרוש לצורך הרחבת דירת מגורים בבית משותף הוא מי שבבעלותם שלולה רבעים מהדירות ושני שלישים מהרכוש המשותף.","התחייבות לעשות עיסקה במקרקעין טעונה מסמך בכתב.","הורשה על פי צוואה אינה נחשבת לעיסקה במקרקעין."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2017-10#1","e":19,"n":1,"s":"6 בעלי דירות בבית משותף בנהריה פנו וקיבלו היתר בנייה לביצוע עבודה ברכוש המשותף, על פי תוכנית חיזוק (תמ\"א 38). ההיתר ניתן לעבודה ברכוש המשותף, שמטרתה חיזוק ושינוי ברכוש המשותף שאינו הרחבת דירה או בניית דירה חדשה. בניין 10 דירות זהות בשטחן. 4 בעלי דירות מתנגדים לביצוע עבודת החיזוק האמורה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההתנגדות תתקבל- ביצוע עבודת חיזוק ברכוש המשותף, שמטרתה שינוי ברכוש המשותף שאינו הרחבת דירה או בניית דירה חדשה, טעון החלטה מראש של כל בעלי הדירות בבית המשותף.","ההתנגדות תידחה- ביצוע עבודת חיזוק ברכוש המשותף, שמטרתה שינוי ברכוש המשותף שאינו הרחבת דירה או בניית דירה חדשה, טעון החלטה מראש של רוב בעלי הדירות בבית המשותף.","ביצוע עבודת חיזוק ברכוש המשותף, שמטרתה שינוי ברכוש המשותף שאינו הרחבת דירה או בניית דירה חדשה, טעון החלטה מראש של כל בעלי הדירות בבית המשותף, ואולם רשאי המפקח על המקרקרעין לאשר את ביצוע העבודה, על פי תביעה של שני שלישים מבעלי הדירות.","ביצוע עבודת חיזוק ברכוש המשותף, שמטרתה שינוי ברכוש המשותף שאינו הרחבת דירה או בניית דירה חדשה, טעון החלטה מראש של ככל בעלי הדירות בבית המשותף, ואולם רשאי המפקח על המקרקעין לאשר את ביצוע העבודה, על פי תביעה של ארבע חמישיות מבעלי הדירות."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2017-10#2","e":19,"n":2,"s":"הזוג יוסף וחנה רכשו דירה בת 4 חדרים מהקבלן י. כהן בפרוייקט \"רננים\" שבחדרה. בחוזה המכר נקבע כי תאריך מסירת הדירה לרוכשים יהיה 01/05/2016. בשל עיכוב בבנייה, הדירה נמסרה בפועל לרוכשים באיחור, בתאריך 15/07/2016.\nבנסיבות העניין, האם בני הזוג יוסף וחנה זכאים לפיצוי מהקבלן?","o":["לא, מכיוון שבחוזה המכר לא סוכם על פיצוי בשל איחור במסירת הדירה.","לא, מכיוון שלא עברו 3 חודשים מהמועד שנקבע בחוזה למסירת הדירה.","כן, גם ללא הוכחת נזק.","כן, אולם רק אם הרוכשים יוכיחו את הנזק שנגרם להם בשל האיחור."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2017-10#3","e":19,"n":3,"s":"רחל בעלת דירת מגורים הרשומה בלשכת רישום המקרקעין. על הדירה רשומה זכות קדימה לטובת אחיינה דוד. לימים הבת של רחל נישאה ורחל מעוניינת לתת במתנה את הדירה לבת שלה. דוד טען בפני רחל כי עליה להציע לו קודם את הדירה בשל זכות הקדימה שלו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רחל צריכה להציע קודם לדוד, מאחר שרשומה לטובתו זכות קדימה.","רחל לא צריכה להציע קודם את הדירה לדוד, מאחר שזכות קדימה לא תחול על העברה ללא תמורה.","רחל לא צריכה להציע קודם את הדירה לדוד, מאחר שזכותה להעביר נכס לבן משפחה קרוב, בתמורה או לא בתמורה גם אם רשומה זכות קדימה על הנכס.","רחל לא צריכה להציע קודם את הדירה לדוד, בעל זכות הקדימה, ותוכל להעביר לבת שלה את הדירה לאחר קבלת אישור מהמפקח על המקרקעין."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2017-10#4","e":19,"n":4,"s":"זכויותיו של איתמר בדירה בעפולה, שנבנתה ע\"י עמידר, רשומות ברשות (במינהל) מקרקעי ישראל ואצל עמידר- החברה משכנת. זכויותיו בדירה טרם נרשמו בפנקסי המקרקעין. איתמר מבקש לשעבד את דירתו לצורך קבלת הלוואה מהבנק.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן לשעבד דירה שנבנתה ע\"י חברה משכנת כל עוד זכויות הדייר בדירה לא נרשמו בפנקסי המקרקעין.","לא ניתן לשעבד דירה שנבנתה ע\"י חברה משכנת, שכן זכויות הדייר בדירה הינן זכויות חוזיות ולא קנייניות.","ניתן לשעבד את הדירה- שיעבוד הדירה הרשומה בחברה משכנת יירשם ברשם המשכונות.","ניתן לשעבד את הדירה- שיעבוד הדירה הרשומה בחברה משכנת יירשם באגף רישום והסדר מקרקעין (טאבו)."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2017-10#5","e":19,"n":5,"s":"סמדר ואביתר החליטו למכור את דירתם הישנה, בה הם מתגוררים מזה 8 שנים, ולקנות במקומה דירה חדשה מקבלן. על דירתם הישנה רובצת משכנתא לטובת בנק \"משכן\". מאחר שאין באפשרותם של סמדר ואביתר לסלק את ההלוואה שנטלו מהבנק לצורך רכישת דירתם הישנה. הם מבקשים להעביר את המשכנתא לדירה החדשה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["עם מכירת הדירה הישנה של סמדר ואביתר חלה החובה לפרוע את מלוא יתרת הלוואה, אותה נטלו מהבנק לצורך מימון דירתם, ולאחר מכן באפשרותם ליטול משכנתא חדשה למימון הדירה החדשה שבכוונתם.","עם מכירת דירתם הישנה באפשרותם של סמדר ואביתר לבצע, בהסכמת הבנק, גרירית משכנתא, ולהחליף את דירתם הישנה המשועבדת לבנק כבטוחה כנגד ההלוואה, בדירה החדשה.","עם מכירת דירתם הישנה חובה על סמדר ואביתר לפנות לבנק ולבצע הקפאת משכנתא לתקופה קצובה עד למועד רכישת הדירה החדשה.","עם מכירת דירתם הישנה סמדר ואביתר רשאים להודיע לבנק, באופן חד צדדי כי בכוונתם להעביר את השיעבוד לדירה החדשה."],"c":[1],"a":false,"note":"","sub":"l_mortgage"},{"id":"2017-10#6","e":19,"n":6,"s":"בתוכנית המיתאר החלה על מגרש ביבנה, נקבעו אחוזי בנייה בסך 85% והם כוללים את סך כל הבנייה המותרת. בעלי המגרש ניצלו 75% מזכויות הבנייה המותרות, לצורך בניית בית רחב מידות על המגרש. כעבור 10 שנים מגמר בניית הבית ואיכלוסו, הגישו בעלי המקרקעין בקשה להיתר בנייה להגדלת השטח הבנוי, תוך שהם מבקשים הפעם לנצל את כל אחוזי הבנייה המותרים על המגרש.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין מניעה להגשת הבקשה להגדלת השטח הבנוי- כאשר לא כל אחוזי הבנייה במקרקעין מנוצלים: ניתן לבקש היתר בנייה להגדלת השטח הבנוי, במסגרת זכויות הבנייה המותרות.","לא ניתן להגיש בקשה להגדלת השטח הבנוי: עם גמר הבנייה, קבלת טופס 4 ואיכלוסו של הבית אין באפשרות בעלי המקרקעין לבקש לנצל את יתרת אחוזי הבנייה המותרים על המגרש.","אין מניעה להגשת הבקשה להגדלת השטח הבנוי ובלבד שבעלי המקרקעין יכללו בה בקשה להקלה לניצול כל אחוזי הבנייה המותרים על המגרש.","אין מניעה להגשת הבקשה להגדלת השטח הבנוי ובלבד שבעלי המקרקעין יכללו בה בקשה ל\"סטייה ניכרת מתוכנית\" לניצול כל אחוזי הבנייה המותרים על המגרש."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2017-10#7","e":19,"n":7,"s":"יפעת פנתה לסיגלית, מתווכת מקרקעין מוסכמת, בבקשה כי תסייע לה למצוא רוכש למגרש בבעלותה. סיגלית, המתווכת, נענתה בשמחה לבקשתה של יפעת והשתיים חתמו על מסמך אחד הנושא את הכותרת הסכם \"להזמנת שירותי תיווך במקרקעין בבלעדיות לתקופה של 6 חודשים\", בו לא פורטו פעולות השיווק שתבצע סיגלית. בטרם הספיקה סיגלית לפרסם את המגרש למכירה בלוחות המודעות הרלוונטיים, היא גילתה לתדהמתה כי בתוך תקופת הבלעדיות נמכר המגרש לזוג רוכשים שהובאו ע\"י מתווך אחר אשר גבה מיפעת עמלת תיווך. סיגלית עומדת על כך כי ישלמו לה דמי תיווך תמורת העסקה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["סיגלית זכאית מלוא דמי התיווך שכן בינה לבין יפעת נכרת הסכם מחייב להזמנת שירותי תיווך במקרקעין בבלעדיות.","סיגלית זכאית למלוא דמי התיווך, מאחר שחלה בעניינה חזקת \"הגורם היעיל\" לגבי העיסקה שנכרתה בתוך תקופת הבלעדיות.","סיגלית אינה זכאית לתשלום דמי תיווך, מאחר שיפעת כבר שילמה עמלת תיווך למתווך אחר.","סיגלית אינה זכאית לתשלום דמי תיווך, מאחר שההסכם עליו חתמה עם יפעת אינו עומד בדרישות החוק והתקנות."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2017-10#8","e":19,"n":8,"s":"בבית משותף בערד, בו 17 דירות שוות בשטחן, הותקנה, עם הקמתו לפני 12 שנים, מערכת גז מרכזית, ע\"י ספק הגז \"גז הדרום\", אליה חוברו כל הדירות בבניין. עתה החליטו 9 בעלי דירות לסיים את ההתקשרות החוזית עם \"גז הדרום\" ולהתקשר בחוזה חדש עם ספק הגז \"ערד בגז\". 8 בעלי דירות המתנגדים למהלך החלפת הספק החליטו להתקין מתקן נפרד להספקת גז לדירותיהם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל מניעה כי 8 בעלי הדירות בבניין, המתנגדים להחלפת ספק הגז הקיים יתקינו מתקן גז נפרד להספקת גז לדירותיהם.","מאחר ששמונת בעלי דירות בבית המשותף מתנגדים להחלפת ספק הגז הקיים לא ניתן להחליפו בספק גז חדש ויש להשאיר את המצב כמו שהוא.","יותר ממחצית מבעלי הדירות בבניין רשאים להסכים בכתב לסיים את ההתקשרות עם ספק הגז הקיים ולהחליפו באחר, ובעלי הדירות המתנגדים לא רשאים להתקין מתקן גז נפרד.","מאחר שמערכת הגז המרכזית בבית המשותף הותקנה ע\"י \"גז הדרום\" עם הקמתו של הבניין לפני 12 שנים, לא ניתן כעת להתקשר עם ספק גז חדש."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2017-10#9","e":19,"n":9,"s":"עדה, בעלת דירה בבית משותף, השכירה את דירתה לשמעון, המתנייד באישור רפואי, באמצעות כיסא גלגלים. עדה פנתה לנציגות הבית המשותף וביקשה לבטל את המדרגות המובילות לשביל הגישה לבניין. הנציגות נענתה מיד וללא כל היסוס לבקשתה, עדה הזמינה פועלים אשר ביטלו את המדרגות וסללו דרך גישה נוחה לבניין. עדה שילמה לפועלים 5,000 ש\"ח תמורת העבודה האמורה. בעלי הדירות בבניין זועמים וטוענים כי הנציגות פעלה בהעדר סמכות ללא הסכמת רוב בעלי הדירות בבניין, עת אישרה לבטל את המדרגות המובילות בשביל הגישה בבית המשותף.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["נציגות הבית המשותף פעלה בסמכות, מאחר שמדובר בפעולה שעניינה התאמה שאינה טעונה הסכמה של בעלי הדירות והיא בוצעה על חשבונה של עדה- בעלת דירה בבניין.","נציגות הבית המשותף פעלה בסמכות, מאחר שמותר לנציגות לבצע כל פעולה אשר לפי ראות עיניה משפרת את איכות חיי הדיירים עם מוגבלות, המתגוררים בבית המשותף.","נציגות הבית המשותף פעלה בהיעדר סמכות, מאחר שמדובר בפעולה שעניינה התאמה אשר טעונה נסכמה של רוב בעלי הדירות בבית המשותף.","נציגות הבית המשותף פעלה בהיעדר סמכות, מאחר שעדה, בעלת הדירה, אינה אדם \"אדם עם מוגבלות\" - כהגדרתו בחוק שיווין זכויות לאנשים עם מוגבלות, התשנ\"ח-1998."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2017-10#10","e":19,"n":10,"s":"מהו \"הסדר מקרקעין\" (פרצלציה)?","o":["הסדר חכירה בין אגודה שיתופית (לרוב מושב או קיבוץ) לבין רשות מקרקעי ישראל.","התהליך שבו לוקחים קרקע שאינה מוסדרת וקובעים מי הבעלים, ומחלקים את החלקות ביניהם.","הסדר בין רשות מקרקעי ישראל ורוכש זכויות בקרקע, המסדיר ומייעד קרקע לבנייה רוויה לגובה.","הסדר המאשר הרחבות והיתרים לשימוש שונה מהייעוד המקורי של הקרקע."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2017-10#11","e":19,"n":11,"s":"אבשלום, בעל בית פרטי בסביון, פנה למרדכי, מתווך מורשה במקרקעין, וביקש ממנו למצוא רוכש לבית. אבשלום ומרדכי הם מכרים ותיקים ובאחת השיחות האישיות ביניהם גילה אבשלום למרדכי כי הוא נתון בחובות כבדים המעיקים עליו מאוד. מרדכי פעל בנמרצות כדי למצוא רוכש לנכס של אבשלום ולשמחתו הגיע למשרדו לקוח אשר הביע התעניינות רבה בעיסקת המכר האמורה, על מנת לקדם את העיסקה פעל מרדכי על דעת עצמו וגילה לרוכש הפוטנציאלי כי אבשלום נתון בחובות ומצבו הכלכלי בכי רע. הרוכש הציע לרכוש את הנכס במחיר מופחת, אבשלום קיבל את הצעתו ועיסקת המכר הושלמה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מרדכי נהג כשורה, עת מסר לרוכש פרטים אודות מצבו הכלכלי של אבשלום, שכן על מתווך חלה חובה למסור למסור ללקוחו כל מידע שיש בידו בעניין הנוגע לעיסקת התיווך.","מרדכי נהג כשורה ולטובתו של אבשלום. מרדכי היה הגורם היעיל בעיסקה וגילוי המידע שהיה בידו אודות מצבו הכלכלי של אבשלום, הוא שהביא לתוצאה המצופה.","מרדכי נהג שלא כדין כאשר מסר פרטים אודות מצבו הכלכלי של אבשלום, שכן למתווך אסור לגלות, שלא בהסכמת הלקוח, מידע שהובא לידיעתו, זולת אם הוא חייב לגלות לפי דין.","מרדכי נהג שלא כדין ועבר עבירה משמעתית של \"אי גילוי עניין אישי\" בכך שלא גילה לרוכש כי הוא ואבשלום מכרים ותיקים."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2017-10#12","e":19,"n":12,"s":"שמעון הוא בעל דירה בבית משותף, המתוחזק ע\"י חברת ניהול. חברת הניהול נבחרה על ידי בעלי הדירות ששני שלישים של הרכוש המשותף צמודים לדירותיהם. שמעון אינו מרוצה מהדרך בה חברת הניהול מתחזקת את הבניין, וכמחאה הפסיק לשאת בהוצאות הבניין לשאת בהוצאות הבניין השוטפות. חברת הניהול החליטה להגיש נגד שמעון תביעה למפקח על המקרקעין, בגין אי תשלום ההוצאות האמורות. לטענת שמעון רק נציגות הבית המשותף, ובעלי הדירות בו, הם שרשאים לתבוע אותו בפני המפקח על המקרקעין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שמעון טועה: למפקח על המקרקעין ניתנה הסמכות להכריע בסכסוך האמור גם במקרה שהמתחזק הוא צד לסכסוך והוא מגיש התביעה.","שמעון צודק: כאשר המתחזק הוא מגיש התביעה - למפקח על המקרקעין ניתנה הסמכות להכריע בעניינים הנוגעים אך ורק לסכסוכים בין בעלי דירות בבית משותף בדבר הסגת גבול מצד בעל דירה לגבי דירה אחרת","שמעון טועה: למפקח על המקרקעין ניתנה הסמכות להכריע בכל הסכסוכים המתגלעים בין בעלי דירות בבית המשותף לבין צדדים שלישיים באשר הם.","שמשון צודק: למפקח על המקרקעין לא ניתנה הסמכות להכריע בסכסוכים, אם מגיש התביעה הוא המתחזק."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2017-10#13","e":19,"n":13,"s":"פסק דין ת\"ק 41268-09-12 נועם יואל כהן נ' אנדרי גולן דן בזכאות לקבלת תשלום דמי תיווך מלקוח, שהוצגה לו דירה מדגמית להשכרה, מתוך כוונה שהצגת הדירה המדגמית תזכה את המתווך בדמי תיווך וזאת לאחר כריתת הסכם שכירות ביחס לכל דירה אחרת בבית המשותף. בית המשפט דחה את תביעת המתווך לקבלת דמי תיווך.\nעל בסיס מה החליט השופט על דחיית התביעה?","o":["המתווך לא מסר ללקוח העתק מההזמנה לביצוע פעולות תיווך, המתווך לא ציין בהזמנה פרטים מלאים ופירוט הדירות אותך הציג, והמתווך לא היה גורם היעיל שהביא להתקשרות בין המשכיר לבעלי הדירה.","המתווך נמנע מלמסור לידי הלקוח עותק חתום מהסכם התיווך, המתווך לא היה הגורם היעיל שהביא להתקשרות בין הלקוח לבעלי הדירה, והמתווך נמנע מלהציג בפני השוכר רישיון תיווך בר תוקף.","בהזמנת התיווך היו פרטים חסרים, המתווך לא היה הגורם היעל שהביא להתקשרות בין הלקוח לבעלי הדירה, והמתווך נמנע מלהציג מפני השוכר רישיון תיווך בר תוקף.","המתווך נמנע מלמסור ללקוח העצק בהזמנה, המתווך נמנע מלהציג בפני השוכר רישיון תיווך בר תוקף בהזמנת התיווך היו פרטים חסרים."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2017-10#14","e":19,"n":14,"s":"בני הזוג שרה ודוד רכשו בית פרטי ישן מאד בכפר סבא, בשטח 200 מ\"ר על מגרש בשטח 410 מ\"ר. לימים החליטו בני הזוג להרוס את המבנה הישן ולבנות במקומו בית חדש, מודרני, בשטח ובצורה זהה לבית המקורי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בני הזוג יידרשו לקבל היתר בנייה מהוועדה המקומית לתכנון ובנייה להריסת הבניין הישן והקמתו מחדש.","בני הזוג אינם חייבים לקבל היתר בנייה מהוועדה המקומית לתכנון והבנייה להריסת הבית הישן, או להקמתו, מכיוון שייבנה בשטח זהה למקורי ואינו מהווה סטייה מהתוכנית.","בני הזוג יידרשו לקבל היתר בניייה מהוועדה המקומית לתכנון ובנייה לבניית הבית החדש בלבד.","בני הזוג יידרשו לקבל היתר בנייה מהוועדה המקומית לתכנון ובנייה וממהנדס העיר להריסת הבית הישן, אך לא יידרש היתר בנייה נוסף להקמתו מחדש."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2017-10#15","e":19,"n":15,"s":"בעלי הדירות ברחוב רופין 36 בחיפה, שבו אין תקנון מוסכם, החליטו לקיים אסיפה כללית בה יחליטו בדבר צביעת חדרי המדרגות בבניין. שלמה שהגיע לאסיפה הכללית, טען שהוא שוכר דירה מספר 12 בבניין והוא בא כוח של יונתן שפירא, בעלי הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בא כוח של בעלי דירה רשאי להשתתף באסיפה כללית בבניין ובלבד שהציג כתב מינוי חתום בידי בעל הדירה שמינה אותו.","באסיפה כללית רק בעלי דירות רשאים להשתתף והלצביע בנושאי החלטות על הוצאה כספית.","כל בא כוח של בעלי דירה רשאי להשתתף באסיפה הכללית בבניין ובלבד שבעל הדירה שמינה אותו הודיע על כך בעל פה ליו\"ר נציגות הבית.","שוכר דירה בבניין אינו רשאי לייצג בעלי דירה באסיפה כללית שמטרתה קביעת ניהול הרכוש המשותף בבניין."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2017-10#16","e":19,"n":16,"s":"יוסף הוא הבעלים של מגרש לבניית 16 יח\"ד ב-2 קומות בסמוך לפארק בר\"ג. לימים הועדה המקומית אישרה לחברת \"הדר על הפארק\", בעלי מגרשים הגובלים עימו, בניית 128 יח\"ד ב-4 מגדלי מגורים בני 8 קומות כל אחד. יוסף התמהמה ורק לאחר שנתיים וחצי מיום תחילת תוקפה של התוכנית הגיש לוועדה המקומית דרישה לפיצויים בשל ירידת ערך ופגיעה במקרקעין שלו הגובלים בתוכנית ובסביבתה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יוסף אינו זכאי להגיש תביעת פיצויים מהועדה המקומית מאחר שהיה עליו להגיש תביעה תוך שנתיים מיום תחילת תוקפה של התוכנית.","יוסף רשאי להגיש תביעת פיצויים מהעודה המקומית בשל פגיעה במקרקעין שלו הגובלים בתוכנית או בסביבתה.","יוסף היה צריך להגיש תביעה לפיצויים מהועדה המחוזית, שהיא המוסמכת למתן פיצויים בגין פגיעה במקרקעין, וזאת בתוך שנתיים מיום תחילת תוקפה של התוכנית.","זכות התביעה לפיצויים עומדת ליוסף רק לאחר קבלת היתרי בנייה, ואז יוסף יוכל לתבוע את חברת \"הדר על הפארק\" על פגיעה במקרקעין שלו."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2017-10#17","e":19,"n":17,"s":"אפרת, יזמית נדל\"ן, חתמה על הסכם חכירה עם רשות (מינהל) מקרקעי ישראל בקשר לבניין משרדים אותו הקימה. כעת מבקשת אפרת לשנות את ייעודו של הנכס למגורים כדי לעלות את שוויו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כתנאי למתן הסכמת המינהל לשינוי הייעוד אפרת אינה מחוייבת בתשלום לרשות (מינהל) מקרקעי ישראל.","כתנאי למתן הסכמת המנהל לשינוי הייעוד על אפרת לשלם לרשות (מינהל) מקרקעי ישראל דמי היטל השבחה.","כתנאי למתן הסכמת המנהל לשינוי הייעוד על אפרת לשלם לרשות (מינהל) מקרקעי ישראל דמי היתר.","כתנאי למתן הסכמת המנהל לשינוי הייעוד על אפרת לשלם לרשות (מינהל) מקרקעי ישראל דמי חכירה."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2017-10#18","e":19,"n":18,"s":"יעל ואביתר הם בני זוג אשר בבעלותם דירה בבאר שבע. נישואיהם של השניים עלו על שרטון והם מצויים בהליכי גירושין, שמסגרתם פסק בית המשפט כי יעל תרכוש את חלקו של אביתר בדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חלוקת רכוש כאמור, אגב הסכם גירושין, תיחשב כמכירה היוצרת חיוב במס שבח ומס רכישה.","חלוקת רכוש כאמור, אגב הסכם גירושין, לא תיחשב כמכירה ועל כן במקרה זה לא נוצר כלל אירוע מס.","חלוקת רכוש כאמור, אגב הסכם גירושין, לא תיחשב כמכירה לצורכי מס, ובלבד שרכישת חלקו של אביתר בדירה ע\"י יעל תתבצע ממקורות מימון חיצוניים.","חלוקת רכוש כאמור, אגב הסכם גירושין, לא תיחשב כמכירה לצורכי מס, ובלבד שרכישת חלקו של אביתר בדירה על ידי יעל תתבצע ממקורות מימון פנימיים- מתוך הנכסים המשותפים של בני הזוג."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2017-10#19","e":19,"n":19,"s":"שמרית רכשה דירה בת 3 חדרים ששטחה 125 מ\"ר, ביצעה בה שיפוץ פנימי נרחב (שברה והוסיפה קירות פנימיים בלבד, ללא פגיעה בחיצוניות, בשלד והחזית הבניין) והפכה אותה לדירה בת 5 חדרים. שטחה של הדירה נותר כשהיה. עתה מבקשת שמרית למכור את דירתה, באמצעות יוסף, מתווך מקרקעין מורשה, אשר נשאל ע\"י לקוחותיו האם שמרית אוחזת בידיה היתר בנייה לשינויים שבוצעו בדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["העבודות שביצעה שמרית, הגדלת מספר החדרים בדירה, טעונות היתר בנייה מטעם רשות הרישוי המקומית.","העבודות שביצעה שמרית בדירה הן בגדר שינוי פנימי שאינו טעון היתר בנייה.","עבודות בנייה, מכל סוג שהוא, שמבצע בעל דירה ברכושו הפרטי, אינן טעונות היתר מטעם רשות הרישוי המקומית.","עבודות בנייה, מכל סוג שהוא, שמבצע בעל דירה ברכושו הפרטי, טעונות הרשאה להקלה."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2017-10#20","e":19,"n":20,"s":"בית המשפט חייב בפסק דין בתאריך 01/01/2017 את בנימין, מתווך במקרקעין, לשלם לרועי סך של 1,000,000 ש\"ח. בנימין, שחשש כי רועי יעקל את דירתו (האמצעי היחיד שברשותו לתשלום חוב), העביר את דירתו על שם בנו במתנה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בנימין עבר עברה פלילית שהעונש בגינה הוא מאסר בפועל.","בנימין לא עבר עבירה פלילית.","בנימיו הפר את חובת ההגינות והזהירות לפי חוק המתווכים.","רשם המתווכים רשאי לבטל את רישיון התיווך של בנימין."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2017-10#21","e":19,"n":21,"s":"דני הוא מנהל עיזבון של הדירה של שאול ז\"ל שהוריש אותה לילדיו אמנון ותמר. דני מתכוון למכור את דירת המגורים של שאול וכעת הוא רוצה לדעת האם העיסקה תחויב במס שבח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הורשה אינה מכירה ולכן את חבות במס שבח.","מכירת הדירה עשויה להיות מחוייבת במס שבח.","מכירה ע\"י מנהל עיזבון פטורה ממס שבח.","מכירה של נכסי עיזבון מחוייבת במס שבח, אבל בשיעור מופחת של שליש מהמס הרגיל."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2017-10#22","e":19,"n":22,"s":"חיים המארגן קבוצת רכישה, איתר מגרש בחולון שעליו תב\"ע לבניין משרדים. הוא אירגן קבוצה של 24 רוכשים. כיצד יחושב מס הרכישה לחברי הקבוצה?","o":["מס הרכישה יחושב לפי ערך החלק בקרקע שרוכש כל אחד מהקבוצה.","מס הרכישה יחושב לפי השווי של הנכס הבנוי.","מאחר שמדובר בקבוצת רכישה, אין תשלום של מס רכישה.","מס הרכישה יחושב מעלות הקרקע וממחצית מעלות הבנייה."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2017-10#23","e":19,"n":23,"s":"אמיר המתווך שכר דירה מאלעד והוא חייב לו 20,000 ש\"ח עבור שכר דירה. אלעד שכר את שירותיו של אמיר לצורך מציאת דירה להשקעה. אמיר מצא עבור אלעד דירה להשקעה וכעת חייב אלעד לאמיר סך של 30,000 ש\"ח עבור דמי תיווך. אלעד מסרב לשלם לאמיר את דמי התיווך ודורש ממנו לשלם את שכר הדירה, אחרת הוא ידרוש את פינויו מהדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רק אחרי שאלעד ישלם לאמיר את דמי התיווך יצטרך אמיר לשלם לו את שכר הדירה ולאמיר אסור לקזז את שכר הדירה בדמי התיווך.","אמיר זכאי לקזז את החוב שלו לשכר דירה מדמי התיווך להם הוא זכאי ולדרוש רק את היתרה בסך של 10,000 ש\"ח.","אמיר לא זכאי לקזז את החוב שלו לשכר הדירה מדמי התיווך ולכן הוא חייב לשלם את שכר הדירה והוא יכול לתבוע את אלעד עבור דמי התיווך.","מאחר שאמיר שוכר דירה מאלעד, הוא אינו רשאי בכל מקרה לתת לו שירותי תיווך ולכן אינו זכאי לתשלום דמי תיווך."],"c":[1],"a":false,"note":"","sub":"r_rent"},{"id":"2017-10#24","e":19,"n":24,"s":"אודליה, ידועתו בציבור של יניב, עברה להתגורר עימו בדירה אותה שכר כדייר מוגן בדמי מפתח. לאחר כחמש שנים בהן התגוררו יחדיו בדירה, נפטר יניב.\nבנסיבות העניין, האם אודליה תיהפך לדיירת מוגנת בדמי מפתח בדירה? מדוע?","o":["לא: אודליה לא עונה על ההגדרה של בן זוג, ומשכך לא תיהפך לדיירת מוגנת בדמי מפתח בדירה.","לא: לאחר מותו של יניב זכויתיו בדירה עוברות לבעליה.","כן: אודליה התגוררה עם יניב יותר מ-6 חודשים לפני מותו, ונחשבת לבת זוגו.","לא: רק ילדיו של יניב יכולים להפך לדיירים בדירה."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2017-10#25","e":19,"n":25,"s":"ליאור חתם על הסכם לרכישת דירה מקבלן. בהסכם רשום שהקונה מסכים לשלם 20% מהתמורה ללא קבלת ערבות בנקאית או ביטוח, וזאת תמורת הנחה בשיעור של 20,000 ש\"ח ממחיר הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל בעיה להסכים לויתור על ערבות בנקאית או ביטוח.","אין כל תוקף להסכמה לוותר על ערבות בנקאית או ביטוח, גם אם הצדדים הסכימו על כך בהסכם המכר.","אם החוזה נחתם בנוכחות עורך דין או בהסכמת הבנק המלווה, אז אין איתו כל בעיה.","אין כל בעיה להסכים על ויתור על ערבות בנקאית, ובלבד ששיעור ההנחה לא יעלה על 7% ממחיר הדירה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2018-01#1","e":20,"n":1,"s":"מיכאל הוא הבעלים של דירה בקומה רביעית, בבית משותף בן 4 קומות ובו 8 דירות. בכל קומה יש 2 דירות. מידי שנה בימי החורף חודרים מי גשמים מגג הבניין לדירתו. מאחר שאין נציגות לבית המשותף, הוא פנה מספר פעמים לבל בעלי הדירות בכתב ובעל פה בדבר הצורך לתקן את הגג, אך נענה בסירוב בטענה שתיקון הגג אינו נוגע להם.\nמה האפשרות הנכונה ביותר העומדת בפני מיכאל?","o":["על מיכאל לתקן את הגג באופן עצמאי ולדרוש משאר בעלי הדירות להשתתף בתיקון.","על מיכאל לתקן את הגג באופן עצמאי ולדרוש משכנו בקומה רביעית מחצית מהוצאות התיקון.","על מיכאל לפנות לאגודה לתרבות הדיור להסדרת העניין מול שאר דיירי הבית ולקבלת סיוע לתיקון הגג שמעליו.","על מיכאל לפנות ולהגיש תביעה נגד בעלי הדירות בפני המפקח על הבתים המשותפים כדי שיורה להם לשאת בעלות תיקון הגג."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2018-01#2","e":20,"n":2,"s":"יוסף, קשיש וחולה בן 80, מתגורר בשכירות מוגנת בדירה בת 5 חדרים בתל אביב. יוסף ביקש מבנו ראובן ובני משפחתו, המתגוררים בדירתם בבאר שבע, לבוא להתגורר עימו בדירתו המרווחת וכן לסייע לו בעת הצורך. ראובן ובני משפחתו קיבלו את הצעת האב ועברו לגור עימו, וזאת לאחר שהשכירו את דירתם בבאר שבע. לאחר שנה נפטר האב הקשיש. לאחר תום ימי השבעה פנה בעל הבית, מר גרשוני, לראובן, ודרש ממנו את פינוי הדירה והשבתה לידיו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בעל הבית אינו צודק. מאחר שראובן התגורר ביחד עם אביו בדירה יותר מ- 6 חודשים בסמוך לפטירת אביו.","בעל הבית צודק, מאחר שלראובן הייתה דירה אחרת למגורים בעת פטירת אביו.","בעל הבית אינו צודק, מאחר שזכותם של ילדי הדייר להיות יורשים בעת פטירת האב.","בעל הבית צודק, מאחר שראובן לא קיבל את הסכמת בעל הבית להתגורר בדירה ביחד עם אביו."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2018-01#3","e":20,"n":3,"s":"פס”ד עא107/86, אהרון חסין נ' דוד בלס ואח', עוסק בערעורו של מתווך הטוען כנגד הסכום שנפסק לטובתו. העיסקה הייתה פרי תיווכו של המתווך, בה נחתם זכרון דברים בין הצדדים, אך בסופו של דבר לא יצאה לפועל, כי הקונה הודיע למוכר שאינו מעוניין בה.\n‎בהתאם לפסק הדין, איזה מהמשפטים הבאים הוא הנכון ביותר?‎","o":["המתווך אינו זכאי לשכרו, מאחר שבסופו של דבר ההסכם לא מומש ולא קוים.","המתווך זכאי לשכר, כי הוא מי שהביא את הצדדים לידי הסכם מחייב, גם אם הצדדים לא מימשו את ההסכם או לא קיימו אותו.","זכרון דברים עליו חתמו הצדדים אינו מהווה חוזה מחייב ולכן המתווך אינו זכאי לדמי תיווך.","המתווך זכאי לדמי תיווך בשיעור2% מהצד שהפר את ההסכם."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2018-01#4","e":20,"n":4,"s":"מהו הסכם משבצת דו צדדי?","o":["הסכם חכירה שנחתם בין הסוכנות היהודיות לאגודה שיתופית.","הסכם חכירה שנחתם בין רשות מקרקעי ישראל לסוכנות היהודית","הסכם חכירה שנחתם בין רשות מקרקעי ישראל לאגודה השיתופית.","הסכם חכירה שנחתם בין רשות מקרקעי ישראל לקרן קיימת לישראל."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2018-01#5","e":20,"n":5,"s":"בע\"א 77/158 חווה רבינאי נ' חברת \"מן השקד\" בע\"מ(בפירוק) בן דן כב' השופט ברק המערערת,(גברת רבינאי) , טענה, בין היתר ,כי זכרון הדברים עליו חתמה אינו הסכם מחייב , שכן נחתם ע\"י המשיבה (חברת \"מן השקד\") לאחר שהמערערת חזרה בה מהצעתה.\nבנסיבות העניין ובהתאם לפסק דין , איזה מהמשטים הבאים הוא הנכון ביותר ?","o":["המערערת חתמה על זכרון הדברים וקיבלה צ'ק כמקדמה. למרות שהמשיבה לא חתמה באותו מועד על זכרון הדברים, נקבע כי בנסיבות אלה מדובר בהסכם מחייב.","זכרון הדברים שנחתם רק ע\"י המערערת אינו הסכם מחייב, מאחר שהמשיבה חתמה עליו לאחר שהמערערת חזרה בה מההצעה.","כל עת שהחוזה נערך ולא נחתם בכתב, הצדדים לא יראו עצמם קשורים בו.","זכרון הדברים הינו הצעה בלבד ואינו עומד בדרישת סעיף 8 לחוק המקרקעין, דהיינו מסמך בכתב. רק עם חתימת חוזה הצדדים יראו עצמם קשורים בו."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2018-01#6","e":20,"n":6,"s":"ארנון שכר חנות בשטח 120 מ\"ר מדן למשך 6 שנים והשקיע בשיפוצה 200,000 ₪. כדי להבטיח את זכויותיו בחנות, ארנון מיהר לרשם המקרקעין לרשום הערת אזהרה על הנכס לטובתו.\nבנסיבות העניין,איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ארנון זכאי לרשום הערת אזהרה כבעל זכות שכירות ובלבד שהרשם יודיע מיד על הרישום לדן, בעל הנכס.","ארנון אינו זכאי לרשום הערת אזהרה על זכות השכירות בחנות.","רק דן, בעל הנכס, רשאי להורות על רישום הערת אזהרה לטובת השוכר.","רק ארנון זכאי לרשום הערת אזהרה כבעל זכות בשכירות החנות."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2018-01#7","e":20,"n":7,"s":"אילן רכש דירת מגורים בת 5 חדרים מהקבלן גרשון הלוי שבנה בית דו משפחתי (הדירה שאילן רכש הינה אחת מתוך 2 הדירות בבית הדו משפחתי). לחוזה המכר גרשון לא צירף מפרט, מאחר שלטענתו מדובר בבית דו משפחתי, שאינו מחייב מפרט. לאחר שנה מקבלת הנכס אילן נוכח לדעת כי המרצפות מוגדרות כסוג ב', חלקן פגומות וחלקן שקעו והעבודה לא נעשתה באופן מיקצועי. אילן דרש להחליף את כל הריצוף בבית שרכש מהקבלן גרשון ועל חשבונו של הקבלן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גרשון הקבלן אינו חייב להחליף את המרצפות כי הן אינן מהוות אי התאמה והן באיכות טובה, ובכך הוא קיים את חיוביו כלפי אילן.","על גרשון הקבלן לבצע תיקון והחלפת המירצפות בדירת אילן, מאחר שהיה עליו למסור את הדירה לאילן מחומרים באיכות גבוה.","גרשון הקבלן אינו חייב להחליף את המרצפות, מאחר שהרוכש אילן היה צריך להיעזר במפקח בנייה ולהפנות את תשומת ליבו של הקבלן לכך שהמרצפות אינן תקינות.","על גרשון הקבלן לבצע את תיקון המרצפות בחלקים בהם הריצוף שקע בלבד."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2018-01#8","e":20,"n":8,"s":"לד\"ר ברנע פלסטיקאי ידוע, בית עסק המשמש מזה 8 שנים כקליניקה רפואית בעלת שם לטיפולים קוסמטיים, וניקראת בשם המסחרי \"מדיקל ברנע\". ד\"ר ברנע הינו דייר מוגן לפי חוק הגנת הדייר.לימים , ד\"ר ברנע החליט למכור את בית העסק לד\"ר שנקר הפלסטיקאי .\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בחלוקת דמי המפתח שיתקבלו בתמורה למכירת הקליניקה עם בעל הבית, ד\"ר ברנע רשאי לנכות שני שלישים עבור המוניטין של בית העסק מהסכום הכללי של דמי המפתח שיקבל ד\"ר מד\"ר שנקר.","בחלוקת דמי המפתח שיתקבלו בתמורה מהקליניקה עם בעל הבית, ד\"ר ברנע לא יוכל לנכות עבור המוניטין של בית העסק מהסכום הכללי של דמי המפתח שיתקבל מד\"ר שנקר.","בחלוקת דמי המפתח שיתקבלו בתמורה מהקליניקה עם בעל הבית, ד\"ר ברנע רשאי לנכות עבור המוניטין של בית העסק מהסכום הכללי של דמי המפתח שיקבל ד\"ר שנקר, וזאת בתנאי שהשם המסחרי \"מדיקל ברנע\" לא ישתנה.","בחלוקת דמי המפתח שיתקבלו בתמורה מהקליניקה עם בעל הבית, ד\"ר ברנע יוכל לנכות סכום שיקבל מד\"ר שנקר עבור המוניטין של בית העסק מהסכום הכללי של דמי המפתח שיקבל. ד\"ר שנקר יוכל לשנות את השם המסחרי של בית העסק ל\"מדיקל שנקר\"."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2018-01#9","e":20,"n":9,"s":"בבית משותף בבת-ים יש 8 דירות מגורים; 4 דירות בנות 3 חדרים בשטח של 80 מ\"ר כל אחת, ו- 4 דירות נוספות בנות 3 חדרים בשטח 65 מ\"ר ועוד 15 מ\"ר גזוזטרה (מרפסת) לכל אחת. ועד הבית החליט לבצע שיפוצים ברכוש המשותף, שמטרתם איטום הגג וצביעת הבניין, ועל כל בעל דירה לשלם לפי חלקו ברכוש המשותף.\nבנסיבות העניין, מהו המשפט הנכון ביותר בהתייחס לאופן חלוקת התשלום בין הדיירים עבור השיפוץ?","o":["מאחר שכל הדירות בבניין הינן בגודל זהה של 3 חדרים, התשלום יתחלק באופן זהה בין כל הדיירים.","מאחר שכל הדירות בבניין הינן בשטח זהה של 80 מ\"ר, התשלום יתחלק באופן שווה בין כל הדיירים.","ארבעה בעלי דירות בבניין ששטח דירתם 65 מ\"ר ישלמו פחות, מאחר ששטח הגזוזטרה לא יובא בחשבון.","בשיפוץ הבניין אין קשר לחלקם של בעלי הדירות ברכוש המשותף ועל כל דייר לשלם שמינית מהסכום."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2018-01#10","e":20,"n":10,"s":"ליוחנן יתרת הלוואה מובטחת במשכנתא ע\"ס 75,000 ₪. הוא הגיע להסדר עם בנק \"משכנתאות לעם\" כי אם יפרע את יתרת המשכנתא בתוך שבוע, הבנק לא יגבה מימנו עמלה בסך 2,000 ₪ בגין פירעון מוקדם. יוחנן אירגן את הסכום לפירעון, אך לפתע פרצה שביתה כלכלית בסניפי הבנק ללא מועד סיום. יוחנן חשש כי יפסיד את ההטבה בגין הפירעון המקדם ובכל מיקרה רצה לפדות את המשכנתא.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר:","o":["בפירעון של יתרת משכנתא הבנק אינו רשאי לוותר על עמלת פירעון מוקדם.","יוחנן יוכל ליפנות למפקח על הבנקים בבנק ישראל, האחראי על תפקוד הבנקים, ולהפקיד בידיו את יתרת המשכנתא.","יוחנן יוכל ליפנות לראשי המקרקעין ולהפקיד את יתרת המשכנתא בידיו.","במקרה של שביתה אין אפשרות יפרוע את המשכנתא."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2018-01#11","e":20,"n":11,"s":"בקופת ועד הבית בבית משותף שבו 24 דירות יש יתרת זכות של 40,000 ש\"ח. באסיפת דיירים שהתקיימה כדין, ביקש ועד הבית להעלות הצעה לביצוע תיקונים בסכום של 5,000 ש\"ח לצרכים הבאים: התקנת מאחז יד בשביל הגישה, התקנת תאורה בשביל הגישה לבית המשותף, חיספוס המדרגות וריצוף שביל הגישה למניעת החלקה. חלק ניכר מבעלי הדירות התנגד להצעה לתיקונים שהוועד העלה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר בהתייחס לביצוע העבודות בבית המשותף?","o":["הוועד רשאי לבצע את התיקונים ללא הסכמת בעלי הדירות, אם הדרישה לביצוען היא מבעלי דירה בעל מוגבלות, המוכן לשלם עבורן.","הוועד מנוע מלבצע את התיקונים שהעלה, אלא אם יקבל אישור של %60 מבעלי הדירות בבניין.","הוועד מנוע מלבצע את התיקונים שהעלה, אלא אם יקבל אישור של %50 מבעלי הדירות בבניין.","הוועד ראשי לבצע את התיקונים שהעלה רק לאחר שקיבל אישור והיתר מהעירייה."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2018-01#12","e":20,"n":12,"s":"על פי חוק המקרקעין, התשכ\"ט – 1969, איזה מהמשפטים הבאים אינו נכון?","o":["ניתן להצמיד לדירת מגורים חלק מהחדר המדרגות בבית משותף וזאת בקבלת הסכמת רוב הדיירים.","הרוב הדרוש לצורך הרחבת דירת מגורים בבית משותף לשם בניית מרחב מוגן דירתי הוא מי שבבעלותם %60 מהדירות.","התחייבות לעשות עיסקה במקרקעין טעונה מסמך בכתב.","הורשה על פי צוואה אינה נחשבת לעישקה במקרקעין."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2018-01#13","e":20,"n":13,"s":"לדורון יש שתי דירות בחולון, שרכש בשנת 2010. עתה הוא מוכר אחת מהם. על מנת לקבל פטור ממס שבח הוא מילא בקשה לפטור במסגרת הדיווח על מכירת הדירה, וציין בה את ההוצאות לעניין חישוב מס שבח שהיו לו. להלן ההוצאות אותן דרש ושלגביהן צירף אסמכתאות: שכ\"ט עו\"ד, שכ\"ט שמאי מקרקעין, דמי תיווך, הוצאות לשיפוץ הדירה, דמי עמילות לבעל המשכנתא להסכמה על המכירה והיטל מס השבחה ששילם לעיריית חולון. בתחשיב רשות המיסים לא אושרו לדורון דמי העמילות והיטל ההשבחה ששילם.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר בהתייחס להחלטת רשות המיסים?","o":["מאחר שלדורון יש שתי דירות, הוא הינו זכאי לפטורים בתשלום מס שבח בגין הוצאותיו.","רשות המיסים הייתה צריכה לאשר לדורון את הוצאותיו עבור דמי העמילות לבעל המשכנתא, למעט היטל ההשבחה ששילם לעיריית חולון שהוא מס העומד בפני עצמו.","רשות המיסים הייתה צריכה לאשר לדורון את הוצאותיו עבור היטל מס ההשבחה ששילם, למעט עבור דמי העמילות לבעל המשכנתא.","רשות המיסים היתה צריכה לאשר לדורון את הוצאותיו כפי שהגיש, כולל עבור דמי העמילות והיטל מס ההשבחה ששילם, וזאת בתנאי שצירף לכך אסמכתאות."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2018-01#14","e":20,"n":14,"s":"האגודה השיתופיץ שנמצאת בבעלות חברי היישוב(לרוב מושב או קיבוץ) חוכרת את הקרקרע מרשות מקרקעי ישראך. האגודה השיתופית מקצה לחבריה שטחים הנקראים \"נחלות\". נחלה חקלאית מורכבת ממספר חלקות משנה: חלקה א' , חלקה ב', חלקה ג'.\nבנסיבות העניין,איזה מהמשטים הבאים הוא הנכון ביותר ?","o":["חלקה א' בנחלה מיועדת למגורים בלבד. חלקה ב' וחלקה ג' מיועדות לעיבוד חקלאי.","חלקה א' בנחלה מיועדת למגורים, למבני משק ולעיבוד חקלאי. חלקה ב' לעיבוד חקלאי וחלקה ג מיועדת לעיבוד חקלאי כרכוש משותף.","חלקה א' בנחלה מיועדת למגורים, למבני משק ולעיבוד חקלאי. חלקה ב' מיועדת למגורים ולעיבוד חקלאי וחלקה ג' מיועדת לעיבוד חקלאי בלבד.","חלקה א' מיועדת למגורים ולעיבוד חקלאי, חלקה ב' מיועדת למבני משק ולעיבוד חקלאי וחלקה ג' מיועדת לעיבוד חקלאי בלבד"],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2018-01#15","e":20,"n":15,"s":"מיכאל הוא הבעלים של שתי דירות בבית משותף במגדלי השקמה ברחובות. לכל אחת מהדירות מוצמדת חניה הרשומה בלשכת רישום המקרקעין (טאבו). מיכאל החליט כי הוא מסתפק בחניה אחת בבניין ופנה למתווך מקרקעין מוסמך, כדי שזה יסייע לו במציאת רוכש לאחת מהחניות.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לבעלי הדירות האחרים בבית משותף קיימת זכות קדימה ברכישת החניה האמורה ומיכאל רשאי למכור את החניה רק לאחר שהציע אותה תחילה לבעלי הדירות בבניין.","מאחר שמיכאל הוא הבעלים של החניה המוצמדת לדירתו הוא רשאי למכור את החניה לכל אדם, בין אם הוא בעל הדירה בבניין ובין אם לאו.","מיכאל אינו רשאי למכור את החניה בבניין לאף אדם, בין אם בעלי דירה בבניין ובין אם לאו, מאחר שהחניה צמודה לדירה ולא ניתן למכור את החניה בנפרד מהדירה.","מיכאל רשאי למכור את החניה המוצמדת לדירתו אך ורק לאחד מבעלי הדירות בבניין."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2018-01#16","e":20,"n":16,"s":"יוגב רכש דירת מגורים בבית משותף ביישוב קהילתי בשומרון. עם תום הליך הרכישה פנה יוגב לאורך דינו וביקש ממנו לרשום את זכויותיו הקנייניות בדירה. עורך הדין מתלבט כיצד לפעול בעניין זה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכויות בנכס הבנוי באזור יהודה ושומרון נרשמת אצל רשם המקרקעין בלשכת רישום המקרקעין באזור יהודה ושומרון (טאבו).","זכויות בנכס הבנוי באזור יהודה ושומרון נרשמות אצל הממונה על הרכוש הממשלתי והנטוש באזור יהודה ושומרון או במשרדי רישום המקרקעין במינהל האזרחי.","זכויות בנכס הבנוי באזור יהודה ושומרון לא ניתנות לרישום.","זכויות בנכס הבנוי באזור יהודה ושומרון נירשמות אצל הממונה על המרשם במינהל במקרקעי ישראל או אצל הממונה על המרשם בקרן קיימת לישראל."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2018-01#17","e":20,"n":17,"s":"ציון ז\"ל, חקלאי אשר עיבד את נחלתו במושב השיתופי עמיעד, נפטר בשיבה טובה. ציון הותיר אחריו ארבעה בנים ובת. לחמשת ילדיו ציווה ציון בצוואתו את כל רכושו בחלקים שווים. כמו כן, כשנה לפני עריכת הצוואה החליט ציון, באישור האגודה השיתופית ורשות מקרקעי ישראל, כי בתו תזכה בנחלה במושב והיא זה שתמשיך לעבד את הקרקע במקומו. ארבעת הבנים דורשים כעת שגם הנחלה תחולק ביניהם ובין אחותם בחלקים שווים, כפי שנכתו בצוואה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["צוואתו המאוחרת של ציון גוברת ויש לחלק את הנחלה במקרה זה באופן שווה בין חמשת ילדיו.","ציון לא יכול להוריש בצוואה את הנחלה ולחלקה בין חמשת ילדיו, ונכון עשה כאשר קבע מראש מי מחמשת ילדיו יהיה \"בן ממשיך\".","ציון אמנם לא יכול להוריש את הנחלה ולחלקה בין חמשת ילדיו על ידי צוואה, אך היה עליו לקבוע מראש מי מארבעת בניו יקבל את הנחלה,      שכן בת לא יכולה להיחשב \"בן ממשיך\".","לחקלאי אין זכות קניינית בקרקע, לכן לאחר מותו הנחלה חוזרת לרשותה ועיבודה של רשות מקרקעי ישראל ולא ניתן לחלקה בין היורשים."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2018-01#18","e":20,"n":18,"s":"נתן ומרים הם בני זוג אשר התקשרו עם סמדר, מתווכת מקרקעין, בהסכם להענקת שירותי תיווך למכירת משרד בבעלותם בראשון לציון. סמדר פעלה נמרצות כדי למצוא רוכש למשרד ועניינה את יואב, לקוחה מזה מספר שנים, בנכס האמור. בשעה טובה נחתם חוזה בין הצדדים ונשתכללה העיסקה למכירת המשרד. כעבור מספר שבועות התברר כי יואב הפר באופן בוטה תנאים מהותיים בחוזה המכר. במצב דברים זה הודיעו נתן ומרים למתווכת סמדר כי הם פטורים מתשלום עמלת התיווך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בכך שיואב הפר באופן בוטה תנאים מהותיים בחוזה המכר יש כדי לפטור את נתן ומרים מתשלום עמלת התיווך.","בכך שחוזה המכר הופר ע\"י יואב, אין כדי לפטור את נתן ומרים מתשלום עמלת התיווך, שכן הם התחייבו לשלם דמי תיווך במיסגרת היחסים בינם לבין סמדר ועיסקת המכר נשתכללה.","בכך שחוזה המכר הופר ע\"י יואב יש כדי לפטור את נתן ומרים מתשלום עמלת התיווך ובלבד שנתקבל אישור לפטור האמור מרשם המתווכים.","חובת התשלום של דמי תיווך קמה על יסוד מערכת היחסים החוזיים בין נתן ומרים לבין יואב. לפיכך כל הפרה, ולו הקלה ביותר, של חוזה המכר ע\"י מי מהצדדים יש בה כדי לפטור אותן מתשלום עמלת תיווך."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2018-01#19","e":20,"n":19,"s":"עזריאל, מתווך מקרקעין מוסמך מזה 20 שנה, החליט משיקולי מס לנהל את שרותי התיווך שלו ולהסיק עובדים שכירים במסגרת התאגדות כחברה בע\"מ. לאחרונה קיבל עזריאל את מרדכי, סטודנט למשפטים, כעובד מן המניין בחברה אשר בבעלותו. מרדכי החליט להתלות מרצון מרצון את רישיון התיווך שלו עת נרשם ללימודים באוניברסיטה. כבר בשבוע הראשון לעבודתו בחברה הצליח מרדכי לתווך בעיסקת מקרקעין גדולה. לתדהמתו של עזריאל, הצדדים לעיסקה סירבו לשלם את עמלת התיווך והוא החליט להגיש נגדם תביעה לבית המשפט.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["התביעה לתשלום עמלת תיווך תתקבל - עזריאל הוא מתווך מוסמך מזה 20 שנה אשר מעניק שרותי תיווך באמצאות תאגיד; מרדכי, המועסק כשכיר בחברה, היה הגורם היעיל בעיסקה.","התביעה לתשלום עמלת התיווך תידחה - הדין מטיל איסור מפורש על מתווך מקרקעין לעניק שרותי תיווך באמצעות חברה בע\"מ.","התביעה לתשלום עמלת תיווך תידחה – אין מניעה ששרותי תיווך יינתנו באמצאות תאגיד, ובלבד שפעולת התיווך תינתן על ידי מי שמחזיק ברישיון תיווך בתוקף.","התביעה לתשלום עמלת התיווך תתקבל - אין מניעה ששרותי תיווך יינתנו באמצאות תאגיד, ובלבד שפעולת התיווך תינתן על ידי מי שמחזיק ברישיון תיווך או החזיק בעברו ברישיון כאמור שהותלה מרצון."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2018-01#20","e":20,"n":20,"s":"המועצה האזורית עמק חפר החליטה על הפשרת והשבחת קרקע המצויה בבעלותו של אפרים. המועצה קבעה כי קרקע זו תעבור שינוי יעוד מקרקע חקלאית לקרקע המיועדת לבנייה. בעקבות החלטה זו מכר אפרים את הקרקע שבבעלותו ל\"שגב נדל\"ן\" בע\"מ, חברה קבלנית בעלת מוניטין בעמק חפר. בעקבות המכירה חויב אפרים בתשלום היטל מס השבחה. אפרים טוען כי חויב שלא כדין בהיטל המס האמור.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אפרים צודק - הוועדה המקומית רשאית לגבות היטל מס השבחה רק במקרים של זכויות בנייה ולא במקרים של שינוי יעוד והפשרה לבנייה.","אפרים צודק - הוועדה המקומית לא רשאית לחייב בעלי קרקע בתשלומי היטל מס אלא רק בתשלומי מס שבח מקרקעין.","אפרים טועה - הוועדה המקומית גובה היטל מס השבחה מבעלי הקרקע כאשר ערך הקרקע שבבעלותו מושבח, בין היתר, בעקבות שינוי יעוד מקרקע חקלאית לקרקע בנייה.","אפרים טועה - כאשר ערך הקרקע מושבח, בין היתר, בעקבות הפשרה ושינוי יעוד מקרקע חקלאית לקרקע לבנייה, הוועדה המקומית גובה היטל השבחה הן ממוכר הזכות האמורה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2018-01#21","e":20,"n":21,"s":"הוועדה המקומית לתכנון ובנייה בחיפה החליטה להפקיע מקרקעין בבעלות פרטית לצורכי ציבור - לנופש ולספורט. הוועדה המקומית, בהסכמת הוועדה המחוזית, ביקשה להגיע להסכם עם בעלי המקרקעין שהופקעו על ידה, במטרה לעביר לו מקרקעין אחרים לסילוק מלא או חלקי של תביעותיו הנובעות מההפקעה, וזאת במקום תשלום פיצויים כספיים תמורת המקרקעין האמורים.\nבנסיבות העניין,איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הסמכות לבצע הפקעה של מקרקעין בבעלות פרטית נתונה אך ורק למועצה הארצית לתכנון ובנייה ולא לוועדה המקומית.","לוועדה המקומית לתכנון ובנייה סמכות לבצע הפקעה של מקרקעין בבעלות פרטית אך ורק לצורכי חינוך, דת, בריאות וביטחון ולא לצורכי נופש וספורט.","לוועדה המקומית לתכנון ובנייה סמכות לבצע הפקעה של מקרקעין בבעלות פרטית לצורכי נופש וספורט, אך אין זה בסמכותה להסכים, אף באישור ובהסכמת הוועדה המחוזית, על חילופי קרקע.","לוועדה המקומית לתכנון ובנייה סמכות לבצע הפקעה של מקרקעין בבעלות פרטית לצורכי נופש וספורט והיא רשאית, בהסכמת הוועדה המחוזית, לבוא לידי הסכם עם בעלי מקרקעין שהופקעו על חילופי קרקע."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2018-01#22","e":20,"n":22,"s":"מתנאל, בעליה של חברה קבלנית, הקים בניין מגורים על קרקע שבבעלותו, והחל לשווק ולמכור דירות בבניין. רחל, אשר התעניינה ברכישת דירה חדשה בבניין האמור, קיבלה לידיה את חוזה המכר. בחוזה נקבע, בין היתר, כי הניהול וההחקה התקינה של הרכוש המשותף יתבצעו על ידי מתחזק שייבחר ע\"י הקבלן. בחוזה המכר לא נכללו פרטים הנוגעים למתחזק, לרבות זהותו. יחד עם זאת, נקבעו תנאי התקשרות עם המתחזק באופן המגביל את הזכות של בעלי הדירות להביא את הסכם ההתקשרות לסיום במשך עשר שנים.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מי שמוכר דירה, בבניין שבנה, רשאי לקבוע כי ניהול הבניין יתבצע ע\"י מתחזק, וזאת מבלי לכלול בחוזה המכר פרטים הנוגעים לאותו מתחזק, לרבות זהותו, וכן רשאי הוא לקבוע, באופן חד צדדי, תנאים המגבילים את הזכות של בעלי הדירות להביא את ההתקשרות עם המתחזק לידי סיום.","מי שמוכר דירה חדשה, בבניין שבנה, לא רשאי לקבוע כי הניהול וההחזקה התקינה של הרכוש המשותף יתבצעו על ידי מתחזק בשום מקרה, מאחר שעניין זה הוא בסמכותו הבלעדית של המפקח על המקרקעין.","מי שמוכר דירה חדשה, בבניין שבנה, רשאי לקבוע כי הניהול וההחזקה התקינה של הרכוש המשותף יתבצעו על ידי מתחזק, ובלבד שמדובר במתחזק בעל ניסיון של עשר שנים ויותר בניהול בתים משותפים.","מי שמוכר דירה חדשה, בבניין שבנה, רשאי לקבוע כי החזקת הרכוש המשותף תתבצע על ידי מתחזק, ולהגביל באופן חד צדדי לתקופה מירבית של שלוש שנים את הזכות של בעלי הדירות להביא את ההתקשרות עם המתחזק לידי סיום."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2018-01#23","e":20,"n":23,"s":"לאחר שעמד בהצלחה יתרה בבחינה הרלוונטית, קיבל אביתר את רישיו התיווך המיוחל. כעבור מספר חודשים נקלע אביתר לתסבוכת כלכלית, אשר אינה קשורה לעסקי התיווך שלו, בעקבותיה הוכרז פושט רגל. רשם המתווכים ביטל לאלתר, וללא שימוע, את רשיונו של אביתר לעסוק בתיווך במקרקעין.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["רשם המתווכים נהג כדין – הכרזה על פשיטת רגל מחייבת ביטול מיידי של רישיון התיווך במקרקעין.","רשם המתווכים נהג כדין – כל הסתבכות כלכלית של מתווך מחייבת ביטול מיידי של רישיו התיווך במקרקעין.","רשם המתווכים נהג שלא כדין – ביטוח הרישיון במקרה של פשיטת רגל אפשרי רק לאחר מתן הזדמנות למתווך להשמיע את טענותיו, ולאחר היוועצות בוועדה המייעצת.","רשם המתווכים נהג שלא כדין – אביתר עבר בהצלחה יתרה את הבחינה לקראת קבלת רישיון תיווך במקרקעין ופשיטת הרגל שאירעה לאחר מכן אינה קשורה לעסקי התיווך שלו."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2018-01#24","e":20,"n":24,"s":"אילו מהתנאים הבאים צריכים להתקיים על מנת שמתווך שמקרקעין יהיה זכר לדמי תיווך מאת לקוח, בעיסקה רגילה שאינה בבלעדיות?","o":["המתווך בעל רישיון בתוקף, הוא אינו פושט רגל והוא היה הגורם היעיל שהביא להתקשרות הצדדים בהסכם מחייב.","המתווך בעל רישיון בתוקף, הוא חתם עם הלקוח על הזמנה מפורטת על הזמנה מפורטת בכתב לביצוע פעולות תיווך במקרקעין והוא היה הגורם היעיל בעיסקה.","המתווך בעל רישיון בתוקף, מלאו לו 18 שנה והוא היה הגורם היעיל שהביא להתקשרות הצדדים בהסכם מחייב.","המתווך בעל רישיון בתוקף, הוא פעל בנאמנות, בהיגנות ובדרך מקובלת והיה הגורם היעיל שהביא להתקשרות הצדדים בהסכם מחייב."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2018-01#25","e":20,"n":25,"s":"נגד משולם, מתווך מקרקעין, הוגשה לוועדת משמעת קובלנה משמעתית בגין עבירה של התנהגות שאינה הולמת את עיסוקו. לאחר בירור הקובלנה ודיון מעמיק בה זוכה משולם, פה אחד, ע\"י כל חברי הוועדה. כעבור חודש הוגש נגד משולם כתב אישום בית משפט השלום בתל אביב, בשל אותו מעשה אשר ממנו זוכה ע\"י ועדת המשמעת. בא כוחו של משולםהגיש לבית המשפט בקשה לביטול כתב האישום בטענת \"כבר זוכיתי\".\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בקשתו של משולם תתקבל - זיכוי על ידי ועדת משמעת מונע נקיטת הליכים פליליים נגד המתווך בשל אותו מעשה אשר ממנו זוכה.","בקשתו של משולם תתקבל - עצם נקיטת אמצעים משמעתייםעל ידי ועדת משמעת נגד המתוור מונעת נקיטת הליכים פליליים נגדו.","בקשתו של משולם תידחה – לוועדת משמעת אין סמכות לזכות מתווך אלא רק סמכות לקבוע כי לא עבר עבירה.","בקשתו של משולם תידחה - זיכוי על ידי ועדת משמעת אינו מונע נקיטת הליכים פליליים נגד המתווך בשל אותו מעשה אשר ממנו זוכה."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2018-07#1","e":21,"n":1,"s":"היכן יש לרשום שיעבוד על זכויות במקרקעין אשר רשומים במרשם המקרקעין והיכן יש לרשום שיעבוד על זכויות במקרקעין שאינם במרשם המקרקעין ?","o":["שיעבוד זכויות על מקרקעין רשומים – יש לרשום בפנקסי המקרקעין ; שיעבוד זכויותעל מקרקעין שאינם רשומים – יש לרשום ברשם המשכונות.","שיעבוד זכויות על מקרקעין רשומים – יש לרשום ברשם הקבלנים ; שיעבוד זכויות על מקרקעין שאינם רשומים – יש לרשום בפנקסי המקרקעין.","שיעבוד זכויות על מקרקעין רשומים – יש לרשם ברשם המשכונות ; שיעבוד זכויות של מקרקעין שאינם רשומים – יש לרשום בפנקסי המקרקעין.","שיעבוד זכויות על מקרקעין רשומים – יש לרשום בפנקסי המקרקעין ; שיעבוד זכויות על מקרקעין שאינם רשומים."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2018-07#2","e":21,"n":2,"s":"אילו שני מבחנים עיקריים שהוזכרו בפרשת חוה רבינאי נ' חברת מן השקד בע''מ (ע''א 158/77) אשר באמצעותם זיכרון דברים עשוי להתפרש כבעל תוקף משפטי של הסכם מחייב ?","o":["מבחן קבילות הראיות ומבחן תום הלב.","מבחן מתן התמורה ומבחן רישום המקרקעין.","מבחן כוונת הצדדים לקשר חוזי מחייב ומבחן קיום הסכמה על הפרטים המהותיים.","מבחן ה''סיבה בלעדיה אין'' ומבחן העסקאות הנוגדות."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2018-07#3","e":21,"n":3,"s":"אדם ושירי מעוניינים להוסיף עמודי תמך בחדר המדרגות המשותף בבניין בו הם מתגוררים, וזאת במסגרת פרויקט תמ''א 38 שמטרתו לחזק את הבניין בלבד.\nבנסיבות המתוארות, איזה מבין המשפטים הבאים הוא הנכון ביותר ?","o":["על אדם ושירי לקבל מראש את הסכמתם של 75% מבעלי הדירות בבית המשותף.","על אדם ושירי לקבל מראש את הסכמתם של רוב בעלי הדירות בבית המשותף.","על אדם ושירי לקבל את הסכמתם של כל בעלי הדירות בבית המשותף.","על אדם ושירי לקבל מראש את הסכמתם של 2/3 מבעלי הדירות בבית המשותף."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2018-07#4","e":21,"n":4,"s":"רן וטליה הם זוג שזה עתה נישא. לרגל נישואיהם החליטו השניים לקנות דירה חדשה מהקבלן הינדי. הם העבירו להינדי 80% ממחיר הדירה והוא מסר להם ערבות בנקאית לצורך הבטחת כספם. הינדי מבקש שישלמו את עלות הפקת הערבות הבנקאית.\nבנסיבות העניין, איזה מבין מהמשפטים הבאים הוא הנכון ביותר?","o":["הינדי צודק ; הערבות הבנקאית נועדה להבטיח את כספם של רן וטליה, ולכן עליהם לשאת בהוצאות הפקתה.","הינדי טועה באופן חלקי ; רן וטליה צריכים לשאת במחצית מעלות הפקת הערבות הבנקאית.","הינדי טועה ; ההוצאות הכרוכות בהבטחת כספם של רן וטליה חלות עליו.","הינדי צודק באופן חלקי ; רן וטליה צריכים לשאת רק ב- 80% מעלות הפקת הערבות הבנקאית."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2018-07#5","e":21,"n":5,"s":"מה יהיה חלקו בדמי המפתח של ''דיור יוצא'' שהחל להחזיק במושכר אחרי שנת התשי''ח (1958) והחזיק בו לתקופה של 10 חודשים?","o":["חמישים אחוזים.","שישים ושישה ושני שליש אחוזים.","שבעים וחמישה אחוזים.","שמונים וחמישה אחוזים."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2018-07#6","e":21,"n":6,"s":"צביקה הוא בעלים של קרקע המיועדת לחקלאות הנמצאת בעיר לוד. לאחרונה צץ במוחו של צביקה רעיון להקים על הקרקע תחנת דלק.\nבנסיבות העניין, איזה מבין מהמשפטים הבאים הוא הנכון ביותר?","o":["צביקה צריך לפנות לוועדה המחוזית בבקשה לשנות את יעוד הקרקע בהליך לשימוש חורג.","צביקה צריך לפנות לוועדה הארצית בבקשה לקבלת הקלה.","צביקה צריך לפנות לוועדה המקומית בבקשה לשנות את יעוד הקרקע.","צביקה אינו צריך לפעול למען שינוי יעוד הקרקע, והוא יכול להתחיל מיד בהקמת תחנת הדלק."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2018-07#7","e":21,"n":7,"s":"דני הוא בעלים של מקרקעין אשר הופקעו כדין לצורך הקמת תחנת רכבת. הוועדה המקומית הציעה לדני כי במקום לשלם לו עבור המקרקעין שהופקעו, יועברו לרשותו מקרקעין אחרים. דני קיבל את ההצעה ונחתם בין הצדדים חוזה, ללא אישור ועדה מחוזית או ארצית.\nבנסיבות העניין, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["הוועדה המקומית פעלה שלא כדין, שכן לא ניתן להציע לבעל המקרקעין מקרקעין אחרים במקום תשלום.","הוועדה המקומית פעלה שלא כדין, שכן היה עליה לקבל את הסכמת הוועדה המחוזית.","הוועדה המקומית פעלה שלא כדין, שכן היה עליה לקבל את הסכמת הוועדה הארצית","הוועדה המקומית פעלה כדין."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2018-07#8","e":21,"n":8,"s":"באמצעות ביצוע איזו פעולה מהבאות יכול קבלן, שבנה דירה על מנת למוכר, לקבל מהרוכש סכום העולה על שבעה אחוזים ממחיר הדירה הנמכרת?","o":["העברת הבעלות בדירה על שם הרוכש.","סיום בניית הבניין.","החתמת הרוכש על הסכם מכר בו מופיעה זכאותו של המוכר לקבלת סכום זה.","הטלת שיעבוד צף על נכסיו, כך שתשלומו של הרוכש יובטח."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2018-07#9","e":21,"n":9,"s":"עידן ומאיה כרתו ביניהם חוזה, לפיו עידן ימכור את דירתו למאיה. עידן הפר את החוזה, לאחר שהחליט שהמראה החיצוני של מאיה לא לרוחו. מאיה, אשר נפגעה מכך מאוד, תבעה פיצויים מעידן בגין נזק שאינו ממוני (לא נגרם למאיה כל נזק כלכלי כתוצאה מההפרה של עידן).\nבנסיבות העניין, איזה מבין המשפטים הוא הנכון ביותר?","o":["בית המשפט לא רשאי בשום מצב לפסוק למאיה פיצויים, שכן לא נגרם לה כל נזק כלכלי.","בית המשפט רשאי לפסוק למאיה פיצויים בעד כל נזק שהוא מוצא לנכון, גם אם מאיה לא תבעה בגינו.","בית המשפט רשאי לפסוק למאיה פיצויים בעד נזק זה, בשיעור שייראה לו.","בית המשפט רשאי לפסוק למאיה פיצויים בעד נזק זה, כל עוד הפיצויים אינם עולים על 5% מגובה העיסקה כולה."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2018-07#10","e":21,"n":10,"s":"מה מהבאים חייבים להיכלל ב''תוכנית בניין עיר'' (תב''ע)?","o":["תקנון ונספח תחבורה.","נספח תחבורה ונספח שמירה על הסביבה.","נספח שמירה על הסביבה ותשריט.","תקנון ותשריט."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2018-07#11","e":21,"n":11,"s":"''מישון – קבלנות'' הינה חברה קבלנית אשר עתידה להתחיל בהליך של תמ''א 38/1, בבית משותף ברחוב רייך בתל-אביב. במסגרת התוכניות מתכוונת ''מישון– קבלנות'' להוסיף לבניין עוד 3 קומות מגורים.\nבנסיבות המתוארות, איזה מבין המשפטים הבאים הוא הנכון ביותר?","o":["''מישון – קבלנות'' יכולה להוסיף 4 קומות מגורים.","''מישון – קבלנות'' יכולה להוסיף לכל היותר 3 קומות מגורים.","''מישון – קבלנות'' יכולה להוסיף לכל היותר 2.5 קומות מגורים.","''מישון – קבלנות'' יכולה להוסיף לכל היותר 2 מקומות מגורים."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2018-07#12","e":21,"n":12,"s":"החובה לשלם היטל השבחה?","o":["החובה לתשלום היטל השבחה חלה מיד עם קבלת זכויות בנייה נוספות שהוענקו לבעל הנכנס עפ''י תוכנית.","החובה לתשלום היטל השבחה חלה עם מכירת הנכס וחלה על הרוכש.","החובה לתשלום היטל השבחה חלה כאשר בעל הזכויות מבקש לממש את זכויות הבנייה או כאשר הוא מוכר את זכויותיו בנכס.","החובה לתשלום היטל השבחה חלה על בעל הזכויות בנכס רק כאשר יעוד קרקע חקלאית משתנה לקרקע לבנייה."],"c":[2],"a":false,"note":"","sub":"p_levy"},{"id":"2018-07#13","e":21,"n":13,"s":"ביום 20.4.2001 רכשה שחר דירת מגורים במחיר של 1,400,000 ש''ח. עוד באותו היום החליטה שחר כי במקום להשתמש בדירה לצורך מגורים, היא תשכיר את הדירה לאסף, כדי שיוכל להשתמש בה כמשרד תיווך. ביום 20.4.2006 אסף פנה לשחר וביקש לקנות ממנה את הדירה בסכום של 1.8 מיליון ש''ח.\nהאם שחר פטורה ממס שבח בגין מכירת הדירה?","o":["לא ; מכיוון שאסף השתמש בדירה כמשרד תיווך ולא למטרת מגורים.","כן ; אך רק אם מדובר בדירת המגורים היחידה בבעלותה.","לא, אלא אם שחר לא מכרה דירת מגורים אחרת בארבע השנים האחרונות בפטור ממס.","כן, מכיוון ששחר מחזיקה בדירה יותר מ-4 שנים."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2018-07#14","e":21,"n":14,"s":"מגי הינה מתווכת. גלן חיפש לשכור דירה לתקופה של שנתיים. גלן הזמין ממגי, בכתב, יואב ולאה הינם אחים שירשו את דירת הוריהם. בהתאם לצו הירושה שהוצא, חלקו של יואב בדירה הוא 25% ולחלקה של לאה 75%. שלוש שנים לאחר הוצאת צו הירושה נזקק יואב לכסף, ולכן ביקש למכור באופן מיידי את חלקו בדירה לבן דודו עידו, ובסכום שנראה לו כגבוה במיוחד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יואב אינו רשאי למכור את חלקו לבן דודו עידו, אלה רק לאחותו לאה, משום שלאה הינה בעלת זכות קדימה מכוח היותה יורשת.","יואב רשאי למכור את חלקו לבן דודו עידו, מאחר שאחותו אינה בעלת זכות קדימה.","יואב רשאי למכור את חלקו לבן דודו עידו רק לאחר שיודיע תחילה לאחותו לאה על המכירה, וזאת מכוח היותה יורשת.","ד. יואב אינו רשאי למכור את חלקו לבן דודו עידו, אלא רק לאחותו לאה, וזאת מכוח היותה בעלת רוב הזכויות בדירה."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2018-07#15","e":21,"n":15,"s":"מגי הינה מתווכת. גולן חיפש לשכור דירה לתקופה של שנתיים. גולן הזמין ממגי, בכתב,שירותי תיווך מקרקעין, בכל הקשור להשכרת דירה בקומה 2 ברחוב אלכסנדריה 7, באילת. מגי הציגה לגלן דירה בקומה 2 בבית המשותף.גלן לא היה עוניין בדירה.מספר חודשים, ביקרה מגי בבית המשותף ונדהמה לגלות כי גלן שכר דירה בקומה 3, לתקופה של שנה, כשמדובר בדירה הזהה לזו שהראתה לו, וזאת מבלי שישלם לה את עמלת התיווך כפי שהתחייב בהזמנה.\nבנסיבות העניין, על פי פסק דין ת''ק  41268-09-12 נועם יואל כהן נ' אנדרי גולן, איזה מבין מהמשפטים הבאים הוא הנכון ביותר?","o":["אם ממכתב ההזמנה ניתן להבין בבירור כי פעולות התיווך מתייחסות גם לדירות אחרות זהות בבית המשותף (וצוינו מספרי הדירות או הקומות), אין מניעה כי מגי תהא זכאית לדמי תיווך, למרות שהיא לא הראתה לגלן את הדירה הספציפית ששכר.","מגי אינה זכאית לדמי תיווך, מכיוון שגלן שכר את הדירה רק לשנה ולא לשנתיים, ולכן במקרה זה אין כל חשיבות לתוכנו של כתב ההזמנה.","מגי זכאית לדמי תיווך גם אם בכתב ההזמנה לא נאמר לגבי דירות אחרות, שכן מדובר בדירות אשר נמצאות באותו בית משותף.","מגי תהא זכאית לדמ
