) ובחברה המשכנת, והשיעבוד נרשם בבנק למשכנתאות.","ברשות/מינהל מקרקעי ישראל (רמ\"י) ו/או בחברה הבונה המשכנת.","ברשות/מינהל מקרקעי ישראל (רמ\"י), ברשם המשכונות, בפנקס זכויות המקרקעין ובוועדה המקומית לתכנון ובנייה."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2021-07#20","e":30,"n":20,"s":"מהו \"הסכם משבצת דו צדדי\"?","o":["הסכם חכירה שנחתם בין הסוכנות היהודית לאגודה שיתופית.","הסכם חכירה שנחתם בין רשות מקרקעי ישראל (רמ\"י) לסוכנות היהודית.","הסכם חכירה שנחתם בין רשות מקרקעי ישראל (רמ\"י) לאגודה השיתופית.","הסכם חכירה שנחתם בין רשות מקרקעי ישראל (רמ\"י) לקרן קיימת לישראל (קק\"ל)."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2021-07#21","e":30,"n":21,"s":"יעל חתמה עם נמרוד על הסכם תיווך, לפיו נמרוד יהיה זכאי לדמי תיווך בגובה 1.5% מסכום רכישת הדירה של יעל. בהמשך, החליט נמרוד לזייף את חתימתה של יעל כדי להגדיל את עמלת התיווך שלו.\nאם יורשע, מה יהיה דינו של נמרוד?","o":["מאסר שנה.","מאסר שלוש שנים.","מאסר חצי שנה.","קנס בסכום כפול מזה שנמרוד היה צפוי להרוויח מביצוע העבירה אותה ביצע."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2021-07#22","e":30,"n":22,"s":"זיו ירש מסבו דירת מגורים.\nהאם זיו צריך לדווח לרשות המיסים על הירושה, והאם עליו לשלם מס על הירושה?","o":["הורשה אינה מכירה, ולכן זיו אינו חייב בדיווח או בתשלום לרשות המיסים.","זיו חייב לדווח לשלטונות המס על הירושה ולשלם מס כדין.","הורשה נחשבת כמכירה ללא תמורה, ולכן זיו חייב לדווח לשלטונות המס על הירושה, אך לא יידרש לשלם מס.","הורשה נחשבת כמכירה, ולכן זיו חייב לדווח לשלטונות המס על הירושה, אך הוא יכול לבקש פטור ממס אם הוא זכאי לכך."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2021-07#23","e":30,"n":23,"s":"מנשה ביקש מדינה, מתווכת מוסמכת, כי תסייע לו במכירת דירתו. מנשה סיפר לדינה כי לדירה אושרו זכויות בנייה נוספות.\nלמה מהמתואר במשפטים הבאים על דינה להסב את תשומת ליבו של מנשה?","o":["מנשה עשוי להיות מחויב בדמי מפתח.","מנשה עשוי להיות מחויב בתוספת היטל השבחה המשולמת לרשות מקרקעי ישראל.","מנשה עשוי להיות מחויב בתוספת היטל השבחה המשולמת לוועדה המקומית לתכנון ובנייה.","על מנשה לבקש אישור לשימוש חורג קודם למכירה."],"c":[2],"a":false,"note":"","sub":"p_levy"},{"id":"2021-07#24","e":30,"n":24,"s":"האגודה השיתופית שנמצאת בבעלות חברי היישוב (לרוב מושב או קיבוץ) חוכרת את הקרקע מרשות מקרקעי ישראל. האגודה השיתופית מקצה לחבריה שטחים, הנקראים \"נחלות\". נחלה חקלאית מורכבת ממספר חלקות משנה: חלקה א', חלקה ב', חלקה ג'.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חלקה א' בנחלה מיועדת למגורים בלבד. חלקה ב' וחלקה ג' מיועדות לעיבוד חקלאי.","חלקה א' בנחלה מיועדת למגורים, למבני משק ולעיבוד חקלאי. חלקה ב' לעיבוד חקלאי וחלקה ג' מיועדת לעיבוד חקלאי משותף בידי האגודה השיתופית.","חלקה א' בנחלה מיועדת למגורים, למבני משק ועיבוד חקלאי. חלקה ב' מיועדת למגורים ולעיבוד חקלאי, חלקה ג' מיועדת לעיבוד חקלאי בלבד.","חלקה א' בנחלה מיועדת למגורים ועיבוד חקלאי, חלקה ב' מיועדת למבני משק ועיבוד חקלאי וחלקה ג' מיועדת לעיבוד חקלאי בלבד."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2021-07#25","e":30,"n":25,"s":"יובל רכש כדין דירה משושי. שושי הודיעה ליובל שהיא מפרה את הסכם הרכישה, ולא מתכוונת למסור לו את הדירה, אלא שהיא מתכוונת אך ורק לשלם ליובל פיצוי בגין הפרת החוזה.\nבחוזה שבין יובל לשושי נכתב שצד שיפר את החוזה ישלם לצד השני פיצוי מוסכם כדין.\nהאם יובל זכאי לתבוע משושי גם את הפיצוי המוסכם בחוזה בגין הפרתו, וגם את אכיפת החוזה במסירת הדירה לידיו? אנא סמנו את התשובה הנכונה ביותר.","o":["יובל יכול לפנות לבית המשפט ולתבוע משושי את אכיפת ההסכם, ובנוסף הוא זכאי לתבוע משושי פיצוי בגין הפרת ההסכם.","יובל יכול לדרוש את הפיצוי המוסכם רק אם יסכים לביטול ההסכם.","יובל יכול לפנות לבית המשפט ולתבוע סעד אחד מבין שניים: או אכיפת ההסכם או את הפיצוי המוסכם, לא ניתן לתבוע גם אכיפה וגם פיצוי מוסכם.","יובל לא זכאי לתבוע משושי דבר, מכיוון שהיא ממילא הציעה לו לקבל את הפיצוי המוסכם וזה הדבר היחיד שהוא זכאי לבקש."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2021-10#1","e":31,"n":1,"s":"יואב התקשר עם מתווך בהסכם תיווך לשם מכירת דירה שבבעלותו. יואב מעוניין להסתיר מהקונים הפוטנציאליים נזק מהותי בדמות חריגת בנייה מסוכנת בדירה, נזק שאותו מקובל לגלות. הקונים פנו למתווך ושאלו אותו האם ידוע לו על נזקים בדירה.\nהאם מתווך חייב לגלות לקונים הפוטנציאליים את הנזק המהותי לדירה הידוע לו?","o":["לא; רק עורך דין רשאי לגלות מידע זה.","לא; מתווך מחויב אך ורק ללקוחו ואינו יכול לנהוג בהגינות כלפי צדדים שלישיים.","כן; על מתווך לפעול בהגינות ובדרך מקובלת.","כן; על מתווך לגלות לקונים תמיד כל ידיעה שהגיעה לידיעתו על ידי הלקוח או מטעמו."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2021-10#2","e":31,"n":2,"s":"שרון, שכירה במשרד של קבלן המשווק דירותיו לציבור, אינה מתווכת. שרון ניסחה מודעה בעיתון מקומי בזו הלשון: ״למכירה פנטהאוז מפואר בשכונת גני חרצית, ארבעה כיווני אוויר, קומה 22, נוף בשמיים, מחיר ברצפה, רק 4.5 מיליון שקלים. דירה מדהימה, כל הקודם זוכה\".\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הפרסום אסור; רק למתווכים מוסמכים בעלי רישיון בתוקף מותר למסור מידע על נכס מקרקעין למכירה.","הפרסום אסור, כל עוד ששרון לא מציגה את עצמה כמתווכת.","הפרסום מותר, כל עוד ששרון לא מציגה את עצמה כמתווכת.","הפרסום מותר; לעובדים בחברות תיווך מותר למסור מידע על נכסים ללא הגבלה."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2021-10#3","e":31,"n":3,"s":"לדירת פנטהאוז בבית משותף הוצמדו שתי חניות סמוכות. רוכש פוטנציאלי מבקש לדעת מה דין החניות.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שתי חניות סמוכות מהוות יחידה נפרדת בבית המשותף, ולכן ניתן למכור אותן בנפרד מהדירה לכל אדם בבניין או מחוצה לו.","שתי החניות נחשבות לחלק מהפנטהאוז.","שתי החניות מהוות חלק מהרכוש המשותף, לכן הן אינן חלק מהממכר.","לא ניתן להצמיד חניות לפנטהאוז, לכן הן אינן חלק מהממכר."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2021-10#4","e":31,"n":4,"s":"על חלקתה של דניאלה רשומה זיקת הנאה לטובת חלקתה של שרונה, ואולם לא נקבעה תקופה בתנאיה.\nמה תוקף זיקת ההנאה?","o":["ללא הגבלת זמן.","לזמן סביר.","עד ששרונה תמכור את חלקתה.","זיקת ההנאה לא תקפה, וזאת בשל פגם שנפל ברישומה."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2021-10#5","e":31,"n":5,"s":"אריה רכש מלינוי מגרש שבבעלותה. לינוי טסה לחו\"ל ואינה פנויה לחתום על בקשה לרישום הערת אזהרה לטובת אריה.\nהאם בנסיבות אלה יכול אריה לרשום הערת אזהרה לטובתו בגין עיסקת הרכישה מלינוי?","o":["לא; רישום הערת אזהרה יבוצע רק במעמד שני הצדדים לעיסקה.","כן, אך ורק אם ההתחייבות היא למשכנתא שלו.","כן; אריה יכול לרשום הערת אזהרה בלי נוכחותה של לינוי.","לא; אין לטאבו אפשרות לרשום הערת אזהרה על מגרש."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2021-10#6","e":31,"n":6,"s":"דנה, רופאת שיניים, משתמשת בדירת מגורים שבבעלותה כמרפאת שינים בלבד, וזאת מיום שרכשה אותה בתאריך 1.1.2010 ועד היום.\nהאם זכאית דנה לקבל פטור ממס שבח במכירת הדירה כיום לצורך הפיכתה בחזרה לדירת מגורים? אנא סמנו את התשובה הנכונה ביותר:","o":["לא; אין פטור ממס שבח לדירות מגורים.","לא; מכיוון שהשימוש בדירה לא היה למגורים בתקופה הנדרשת.","כן, מחצית משיעור המס הרגיל.","כן, בתנאי שאין לה יותר מ- 2 דירות בבעלותה."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2021-10#7","e":31,"n":7,"s":"ביום 1/1/2021 חתם דורון, בעל דירת מגורים, עם מירון, על חוזה שכירות לשנתיים, החל מ- 1/4/2021 בסכום של 3,500 ש\"ח לחודש. יומיים לאחר חתימת ההסכם הנ\"ל, פנה אל דורון שלמה, שמחפש מזה זמן רב דירה דומה, והגיש לדורון הצעה לשכור את הדירה בסכום של 4,000 ש\"ח לחודש, וזאת בתנאי שייחתם באופן מיידי הסכם שכירות למשך 3 שנים, החל מיום 1/3/2021. דורון הסכים להצעתו של שלמה וחתם גם עימו על הסכם שכירות. שלמה נכנס לדירה בהתאם להסכם השכירות.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זכותו של השוכר האחרון תמיד עדיפה, ללא סייג.","זכותו של שלמה, השוכר השני, עדיפה אם הוא חתם על הסכם השכירות וקיבל את הדירה בתום לב.","העיסקה שבוצעה הינה שכירות הנוגדת את השכירות הראשונה הטעונה רישום, ולכן זכותו של שלמה, השוכר השני, עדיפה.","זכותו של השוכר הראשון תמיד עדיפה, ללא סייג."],"c":[1],"a":false,"note":"","sub":"r_rent"},{"id":"2021-10#8","e":31,"n":8,"s":"מי אחראי לאישור או לדחיית תוכנית מיתאר ארצית, שנערכה על פי הוראותיה של המועצה הארצית לתכנון ובנייה?","o":["רשות מקרקעי ישראל.","שר הפנים.","שר הבינוי והשיכון.","הממשלה."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2021-10#9","e":31,"n":9,"s":"האם משרד העוסק בתיווך מקרקעין, המצוי בקניון שמתנהל ללא חברת ניהול, חייב ברישיון עסק? נא לסמן את התשובה הנכונה ביותר.","o":["משרד העוסק בתיווך מקרקעין ובו יותר משלושה עובדים חייב ברישיון עסק.","משרד העוסק בתיווך במקרקעין חייב ברישיון עסק אם לקניון יש חברת ניהול.","משרד העוסק בתיווך מקרקעין ושטחו המבונה עולה על 100 מ\"ר חייב ברישיון עסק תמיד.","משרד העוסק בתיווך מקרקעין כאמור חייב ברישיון עסק."],"c":[3],"a":false,"note":"","sub":"k_misc"},{"id":"2021-10#10","e":31,"n":10,"s":"מהי \"חלקה תלת מימדית\"? נא לסמן את התשובה הנכונה ביותר.","o":["כל יחידת קרקע שבבעלות המדינה ושאינה רשומה עדיין בטאבו.","יחידת קרקע רשומה ושגבולותיה רשומים באופן תלת מימדי, המצויה בעומק שמתחת לקרקע או בחלל הרום שמעליה, במקרקעין רשומים.","חלקת הקרקע שעליה יירשמו הדירות והרכוש המשותף של הבית המשותף.","כל חלקת קרקע מוסדרת עליה הוקמו מבנים למגורים, למסחר וחניות בשלושה מפלסים."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2021-10#11","e":31,"n":11,"s":"אלזה ויצחק, דיירים מוגנים, התגרשו לאחר 20 שנות נישואין. במסגרת הסכם הגירושין ביניהם, עזבה אלזה למשך שנתיים את הדירה שבה התגוררו בני הזוג במשך כל חייהם המשותפים. במסגרת הסכם הגירושין הסכים יצחק לעזוב את הדירה המשותפת כעבור שנתיים ולאפשר לאלזה להיכנס ולגור בה במקומו.\nהאם אלזה יכולה להמשיך להיחשב כ׳דיירת מוגנת׳, למרות שעזבה את הדירה ואת יצחק?","o":["כן, אם אלזה מחזיקה בהסכם גירושין כתוב.","כן, בגלל שהייתה נשואה ליצחק.","לא; ברגע שעזבה את הדירה, אלזה כבר לא נחשבת ׳דיירת מוגנת׳ והדירה חוזרת לבעלי הדירה.","לא; ברגע שיצחק עוזב את הדירה, הדירה חוזרת לבעלי הדירה."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2021-10#12","e":31,"n":12,"s":"מהי התקופה המקסימלית המותרת ל׳שימוש חורג׳ במקרקעין? אנא סמנו את התשובה הנכונה ביותר.","o":["אין הגבלה בזמן ל׳שימוש חורג׳ במקרקעין נתונים.","שנתיים.","התקופה נקבעת בכל נכס על פי נסיבותיו.","אין גורם בישראל שרשאי לאשר ׳שימוש חורג׳ במקרקעין."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2021-10#13","e":31,"n":13,"s":"כאשר אדם נפטר וממונה לו מנהל עיזבון, האם מנהל העיזבון צריך אישור מבית משפט כדי למכור נכס מקרקעין של המנוח?","o":["כן; מנהל עיזבון שמונה על ידי בית המשפט נדרש לאישור מקדים מבית המשפט למכירת נכס מקרקעין.","כן, אך רק אם הדבר נכתב במפורש בצוואה.","לא; רק הטאבו מאשר עיסקאות מקרקעין בירושה בישראל.","לא; מנהל עיזבון שמונה על ידי בית משפט רשאי לפעול במקרקעין של המנוח לפי שיקול דעתו."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2021-10#14","e":31,"n":14,"s":"יצחק ביקש לקנות דירת מגורים במחיר של 2,000,000 ש״ח ושלח למוכר הדירה את הצעתו בכתב. המוכר הסכים לעיסקה, והצדדים חתמו על חוזה אצל עורך דין. בדיעבד הסתבר שעורך הדין טעה במחיר העיסקה וכתב שהדירה שווה מיליון ש״ח יותר ממה שהסכימו הצדדים. כעת המוכר דורש את המחיר שהצדדים חתמו עליו בטעות, ולא את המחיר שסיכמו ביניהם כשסיכמו ביחד את מחיר הדירה.\nהאם טעות הסופר בחוזה מהווה עילה לביטול החוזה?","o":["לא; טעות סופר אינה מהווה עילה לביטול חוזה, והחוזה יתוקן לפי ההסכמה שבין הצדדים.","לא; טעות סופר אינה מהווה עילה לביטול חוזה, והחוזה ייאכף לפי מה שכתוב בו.","כן; כל טעות בחוזה מהווה עילה לביטול חוזה.","כן; מדובר בטעות סופר מהותית ולכן ניתן לבטל את החוזה."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2021-10#15","e":31,"n":15,"s":"דוד מעוניין לרכוש דירה חדשה מקבלן. הקבלן מציין בחוזה כי הרכישה כוללת גם חברת ניהול שתתחזק את הבניין בו נמצאת הדירה.\nהאם חייב הקבלן לכלול את תנאי ההתקשרות עם החברה המתחזקת בחוזה מכר הדירה? האם ההתקשרות עם חברת הניהול שמתחזקת את הבניין מוגבלת בזמן לפי חוק? נא לסמן את התשובה הנכונה ביותר.","o":["אין חובה על פי חוק לכלול את תנאי ההתקשרות עם המתחזק בחוזה מכר הדירה, וההתקשרות עם המתחזק אינה מוגבלת בזמן על פי חוק.","קיימת חובה על פי חוק לכלול את תנאי ההתקשרות עם המתחזק בחוזה מכר הדירה, אך ההתקשרות עם המתחזק אינה מוגבלת בזמן על פי חוק.","אין חובה על פי חוק לכלול את תנאי ההתקשרות עם המתחזק בחוזה מכר הדירה, וההתקשרות עם המתחזק מוגבלת לשלוש שנים על פי חוק.","קיימת חובה על פי חוק לכלול את תנאי ההתקשרות עם המתחזק בחוזה מכר הדירה, וההתקשרות עם המתחזק מוגבלת לתקופה מקסימאלית של שלוש שנים על פי חוק."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2021-10#16","e":31,"n":16,"s":"גדי המתווך גילה חוסר אחריות ונסחף בלשונו באירוע חברתי, בכך שגילה לעיתונאי ידוע שאחד מלקוחותיו נקלע לצרות כלכליות, ולכן מחפש הלקוח למכור נכס מקרקעין שבבעלותו. הלקוח כעס מאוד כשנודע לו על מעשהו של גדי.\nהאם התנהגות זו מצד גדי יכולה לעלות כדי עבירת משמעת, והאם החוק אוסר על גדי לגלות מידע כאמור?","o":["חוסר אחריות הוא אמנם דבר מצער, אבל אין איסור בחוק הנוגע לחוסר אחריות. אין איסור בחוק על גדי לגלות את המידע כאמור, מכיוון שלפי החוק מתווך ימסור כל מידע שיש בידו בעניין מהותי הנוגע לנכס נשוא עיסקת התיווך.","חוסר אחריות הוא אמנם דבר מצער, אבל אין איסור בחוק הנוגע לחוסר אחריות. קיים איסור בחוק על גילוי מידע על הנכס.","חוסר אחריות עשוי לעלות כדי עבירת משמעת של מתווך לפי החוק, וקיים איסור בחוק לגלות מידע כאמור.","חוסר אחריות עשוי לעלות כדי עבירת משמעת של מתווך לפי החוק. אין איסור בחוק על גדי לגלות את המידע כאמור, מכיוון שלפי החוק, מתווך ימסור כל מידע שיש בידו בעניין מהותי הנוגע לנכס נשוא עיסקת התיווך."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2021-10#17","e":31,"n":17,"s":"יגאל כהן, מתווך במקרקעין (להלן: \"המתווך\"), מעסיק בסוכנות התיווך שלו מתמחה שאינו בעל רישיון תיווך, ושמו זהה לשמו של המתווך – לשניהם קוראים יגאל כהן (להלן: \"המתמחה\").\nהמתווך קבע פגישה עם לקוח שמעוניין לראות דירות, אולם מסיבות שונות, נאלץ המתווך להיעדר מהפגישה וביקש מהמתמחה שיחליף אותו. המתמחה נפגש עם הלקוח, הזדהה בשמו, והעביר ללקוח מידע כתוב ומדויק, כפי שהמתווך הינחה אתו, אולם לא הסביר ללקוח כי הוא אינו המתווך, אלא רק מתמחה בעל שם זהה. בנסיבות האמורות הלקוח היה בטוח שמדובר במתווך.\nהאם אפשר לראות את המתמחה כמי שזייף תעודת מתווך, וכמי שהתחזה לבעל תעודת מתווך בנסיבות האמורות? נא לסמן את התשובה הנכונה ביותר.","o":["אפשר לראות את המתמחה כמי שהתחזה לבעל תעודת מתווך, ומכוח כך רואים אותו בחוק אף כמי שזייף תעודת מתווך בנסיבות האמורות.","אפשר לראות את יגאל המתמחה כמי שהתחזה לבעל תעודת מתווך, אך לא כמי שזייף תעודת מתווך בנסיבות האמורות.","אי אפשר לראות את יגאל המתמחה כמי שהתחזה לבעל תעודת מתווך, ובוודאי שלא כמי שזייף תעודת מתמחה בנסיבות האמורות.","אי אפשר לראות את יגאל המתמחה כמי שהתחזה לבעל תעודת מתווך בנסיבות האמורות, אך אפשר לראותו לפי חוק כמי שזייף תעודת מתמחה."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2021-10#18","e":31,"n":18,"s":"מהי ״תוכנית להתחדשות עירונית״? נא לסמן את התשובה הנכונה ביותר.","o":["כל תוכנית פינוי-בינוי במסלול מיסוי.","תוכנית שמספר יחידות הדיור החדשות הכלולות בה הוא 70 לפחות, ושמטרתה פינוי ובינוי במתחם יעודי במסלול מיסוי, או תוכנית לחיזוק מפני רעידות אדמה (׳תמ״א 38׳).","כל תוכנית המצויה בסמכותה של ועדה מחוזית לתכנון ובניה, לרבות כל תוכנית פינוי-בינוי או חיזוק מפני רעידות אדמה (׳תמ״א 38׳) ללא דרישת מינימום מספר יחידות דיור חדשות שייבנו.","כל תוכנית לחיזוק מפני רעידות אדמה (׳תמ״א 38׳)."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2021-10#19","e":31,"n":19,"s":"דביר הינו מתווך מקרקעין, המייצג בעיסקת מכירה לקוחות שמעוניינים למכור דירה שהתגוררו בה בעבר וכעת היא פנויה. דביר הציע ללקוחותיו לערוך בדירה שיפוץ, כך שהוא יציג אותה למתעניינים כדירה חדשה, וזאת לשם סיוע במכירת הדירה.\nהאם ניתן להעמיד את דביר לדין בגין עבירה לפי חוק הגנת הצרכן, והאם ניתן לשלול את רישיונו כמתווך לתקופה בגין מעשהו?","o":["ניתן להעמיד לדין את דביר בגין עבירה לפי חוק הגנת הצרכן והוא חשוף לשלילת רישיון התיווך שלו, לפחות לתקופה.","ניתן להעמיד לדין את דביר בגין עבירה לפי חוק הגנת הצרכן, אך אין סמכות בחוק לשלול רישיון תיווך בגין עבירות על חוק הגנת הצרכן.","המדובר בנושא שאינו מהותי ולכן לא ניתן להעמיד לדין את דביר בגין עבירה לפי חוק הגנת הצרכן, ואין אפשרות לשלול את רישיונו לפי חוק המתווכים.","המדובר בנושא שאינו מהותי ולכן לא ניתן להעמיד לדין את דביר בגין עבירה לפי חוק הגנת הצרכן, אך ישנה אפשרות לשלול את רישיונו לתקופה לפי חוק המתווכים."],"c":[0],"a":false,"note":"","sub":"k_consumer"},{"id":"2021-10#20","e":31,"n":20,"s":"יצחק נתן ייפוי כוח למכירת נכס מקרקעין שבבעלותו לבורר, וזאת על מנת להבטיח את ביצוע פסק דינו של הבורר.\nהאם מתן ייפוי הכוח לבורר בנסיבות האמורות פטור ממיסוי מקרקעין?","o":["כן; מכיוון שייפוי הכוח למכירת המקרקעין ניתן לבורר לשם הבטחת ביצוע פסק דינו.","כן; מכיוון שמדובר בעיסקה במקרקעין לכל דבר ועניין וללא סייג.","לא; מכיוון שייפוי הכוח למכירת המקרקעין ניתן במסגרת בוררות, אך לא הוגבל בזמן.","לא; מדובר בעיסקה במקרקעין לכל דבר ועניין וללא סייג."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2021-10#21","e":31,"n":21,"s":"גיורא, בעל דירה בצפת, חתם על הסכם למכירת דירתו לשלמה. שלמה שילם לגיורא מקדמה בהתאם לתנאי ההסכם. יומיים לאחר חתימתם על הסכם המכירה, קיבל גיורא הצעת מחיר גבוהה יותר מעמנואל. שלמה טרם רשם את הערת האזהרה בדבר העיסקה בלשכת רישום המקרקעין. גיורא מיהר וחתם עם עמנואל על חוזה למכירת דירתו, וזאת מבלי ליידע אותו על ההסכם שנחתם עם שלמה. עמנואל שילם לשלמה מקדמה, אך טרם רשם הערת אזהרה בדבר העיסקה בלשכת רישום המקרקעין.\nזכותו של מי גוברת בנסיבות האמורות? נא לסמן את התשובה הנכונה ביותר.","o":["מאחר שגיורא חתם עם שלמה על חוזה מכר ושלמה טרם רשם לטובתו הערת אזהרה, הרי זכותו של עמנואל, בעל העיסקה השנייה, אשר חתם על חוזה בסכום גבוה יותר עם גיורא, עדיפה.","למרות שגיורא המוכר חתם על הסכם ראשון עם שלמה, ולאחר מכן התחייב כלפי עמנואל לעיסקה נוגדת, זכותו של עמנואל עדיפה, מכיוון שהוא פעל בתום לב ובתמורה.","זכותו של עמנואל, שחתם על חוזה עם גיורא ושילם מקדמה, עדיפה על זכותו של שלמה, מכיוון ששלמה לא הספיק לסיים את העיסקה ברישום כנדרש.","זכותו של שלמה, בעל העיסקה הראשונה, עדיפה, למרות שעמנואל פעל בתום לב ובתמורה."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"l_register"},{"id":"2021-10#22","e":31,"n":22,"s":"לפי פסק הדין בעניין רע\"א 394/88 שושני נגד אברון, במידה וצד להסכם לרכישת דירה מפר את ההסכם בדיעבד, ולא משלם את מלוא התמורה בגין הדירה שרכש, האם המתווך עדיין זכאי לשכרו בגין תיווך?","o":["כן; שכרו של מתווך שהפגיש בין צדדים אינו תלוי בסיום העיסקה בין הצדדים שהתקשרו בחוזה למכירת נכס מקרקעין.","כן, אך ורק אם בוצעו לכל הפחות שתי פעולות שיווק על ידי המתווך.","לא; מתווך זכאי לשכרו רק אם וכאשר העיסקה נרשמת בלשכת רישום המקרקעין.","לא; מתווך זכאי לשכרו רק אם נחתם הסכם בלעדיות כדין."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2021-10#23","e":31,"n":23,"s":"בפסק הדין בתיק 7132-06-08 גלז - גוטרמן נגד שרון, הגברת גוטרמן, המחזיקה בנכס שעליו עמדה בפניה ההצעה ממר הרטמן, בגובה של 7,000,000 ש״ח, שחלקם ישולמו באופן מיידי, וחלקם ישולמו בשכר דירה לתקופה של עד חמש שנים. בסופו של דבר החליטה המוכרת לדחות את ההצעה ולמכור את הנכס לקונה אחר, במחיר נמוך באופן משמעותי.\nהאם המתווך שהביא את ההצעה בגובה 7,000,000 ש״ח זכאי לדמי תיווך?","o":["כן; המתווך זכאי לדמי תיווך משום שהמוכרת ויתרה על הצעה גבוהה יותר.","כן; מתווך זכאי לשכרו מרגע ששימש כגורם יעיל והביא להצעה מיטבית ללקוח.","לא; זכותו של מוכר לסרב להתקשר בעיסקה שלא מתאימה לו, ולכן לא תקום זכות לדמי תיווך במקרה כזה.","לא; אבל לו הייתה בלעדיות כדין במקרה כזה, אז המתווך היה זכאי לדמי תיווך."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2021-10#24","e":31,"n":24,"s":"בבעלות יוחנן משרד המשמש לצורך עסקו ביישוב שדרות. לימים, פרסם יוחנן את המשרד למכירה. בנק הפועלים מעוניין לרכוש את המשרד לצורך פתיחת סניף בנק במקום.\nבנסיבות העניין, האם המכירה חייבת בתשלום מס ערך מוסף? נא לסמן את התשובה הנכונה ביותר.","o":["מכירת המשרד חייבת בתשלום מס ערך מוסף.","מכירת המשרד אינה חייבת בתשלום מס ערך מוסף, מאחר שהעיסקה היא עם מוסד כספי.","המכירה אינה חייבת בתשלום מס ערך מוסף, מאחר שהעסקה נעשית ביישוב שדרות, המוגדר כיישוב עימות.","המכירה אינה חייבת בתשלום מס ערך מוסף, מאחר שמדובר ב\"עיסקת אקראי\" הכוללת מכירת מקרקעין על ידי אדם שאין עיסוקו במכירת מקרקעין."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2021-10#25","e":31,"n":25,"s":"אילו אישורים נדרשים מבעל זכויות בנכס בעת העברת זכות בנכס מקרקעין ברשם המקרקעין? נא לסמן את התשובה הנכונה ביותר.","o":["בעת העברת זכות בנכס מקרקעין, רשם המקרקעין דורש לקבל אישור עירייה המעיד על היעדר חובות ואישורי רשות המיסים על דיווח ואישור העיסקה (אישור על תשלום מיסים או על היעדר חובות מס).","בעת העברת זכות בנכס מקרקעין, רשם המקרקעין דורש לקבל אישור מרשות המיסים המעיד על דיווח ואישור העיסקה.","בעת העברת זכות בנכס מקרקעין רשם המקרקעין דורש לקבל אישור מהעירייה על היעדר חובות לעירייה.","אין צורך באישורים כלשהם, מלבד חוזה מכר מקרקעין בכתב."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2022-02#1","e":32,"n":1,"s":"צחי והדר הינם בעלי חלקות קרקע סמוכות. צחי מוכן לרשום זיקת הנאה לצורך מעבר בחלקתו, אך כזאת שתהיה תקפה כלפי שכנתו הדר באופן אישי בלבד, ולא כלפי גורמים אחרים (כגון מי שיקנה את חלקתה של הדר בעתיד).\nהאם הדבר אפשרי? מדוע?","o":["לא; זיקת הנאה לטובת הדר כמוה כזיקת הנאה לחלקתה של הדר, לכן כוחה יפה גם לרוכש החלקה בעתיד.","לא; זיקת הנאה לטובת הדר כמוה כזיקת הנאה לטובת כל אדם, לכן כוחה יפה לכל מי שייחשב לבעל חלקתה של הדר בעתיד.","לא, לא ניתן לרשום זיקת הנאה לטובת הדר בלבד, לכן זיקת ההנאה היא לטובת הציבור בכללותו.","כן; ניתן לרשום את זיקת ההנאה לטובת הדר בלבד."],"c":[3],"a":false,"note":"","sub":"l_shared"},{"id":"2022-02#2","e":32,"n":2,"s":"שאול, מתווך מוסמך, קיבל לידיו את הטיפול במכירת אולם שמחות. שאול פנה לעמיתו יואל, מתווך מוסמך, והציע לו לשתף פעולה במכירת האולם. שני המתווכים סיכמו בעל פה את דבר שיתוף הפעולה ביניהם וסיכמו כי יתחלקו שווה בשווה בדמי התיווך שיתקבלו מהמוכר.\nהאם חוזה לשיתוף פעולה בין מתווכים יכול להיות בעל פה?","o":["לא; כל חוזה העוסק במקרקעין חייב להיות בכתב.","לא; פרטים של הזמנת תיווך, גם בין מתווכים, חייבים להיות בכתב.","כן; חוזה מסוג זה יכול שייעשה בעל פה.","כן; אבל רק באופן חלקי. ניתן לסכם את האחוזים שמתחלקים בין המתווכים בעל פה בלבד. שאר החוזה בין המתווכים חייב להיות בכתב."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2022-02#3","e":32,"n":3,"s":"ראובן הוא בעל מגרש, שעליו בנה יחידת מגורים על פי היתר בשטח המקסימלי שהותר לו (160 מ\"ר). לימים, ראובן הגיש בקשה לשינוי תב\"ע לוועדה המקומית לתכנון ובנייה, וביקש הוספת זכויות בנייה של 60 מ\"ר למגורים מעבר לקיים. בקשתו אושרה ע\"י הוועדה.\nהאם יחול על ראובן היטל כלשהו? אם כן, למי עליו לשלמו ומתי?","o":["על ראובן לא יחול היטל השבחה, מאחר שזכויות בנייה על המגרש לצורך בנייה עצמית פטורות מתשלום.","על ראובן לא יחול היטל השבחה, מכיוון שמדובר בדירה ששימשה למגורים ברצף במשך כל השנים.","על ראובן יחול היטל השבחה, אותו ישלם לוועדה המקומית לתכנון ובנייה כאשר יממש את זכויות הבנייה שהוענקו לו, או כאשר ימכור את זכויותיו בנכס.","על ראובן יחול היטל השבחה, אותו ישלם לרשות המיסים כאשר יממש את זכויות הבנייה שהוענקו לו או כאשר ימכור את זכויותיו בנכס."],"c":[2],"a":false,"note":"","sub":"p_levy"},{"id":"2022-02#4","e":32,"n":4,"s":"חברה מסחרית מבקשת להשתמש בדירות פרטיות המיועדות למגורים לצורך מסחרי.\nהאם הדבר אפשרי?","o":["כן, אין מניעה להסב את דירות המגורים למסחר, אך לא ניתן לעשות בהן שימוש למשרדים.","כן, אם הדבר נעשה במסגרת היתר לשימוש חורג.","לא, הסבת דירת מגורים למסחר מהווה סטייה מהשימוש המותר ולפיכך היא אינה אפשרית.","לא, בעלי הנכס יכולים לעשות שימוש בנכס המיועד למגורים לצורך מסחר רק אם קיימת הסכמת מלוא השכנים לכך."],"c":[1],"a":false,"note":"","sub":"k_misc"},{"id":"2022-02#5","e":32,"n":5,"s":"ראובן הוא 'בן ממשיך' בנחלה במושב בבעלות המדינה. כשנפטר, עברו הזכויות בנחלה לאשתו אשר המשיכה לגדל גידולים חקלאיים בחלקה 'ב'. לימים ביקשה אשתו להעביר לבתה את הזכויות בנחלה, לרבות חלקה 'ב', המהווה כאמור את השטח החקלאי. בתה מעוניינת לשנות את סוג הגידולים החקלאיים הגדלים בחלקה 'ב'.\nהאם ניתן להוריש לבת את הנחלה והאם נדרש שינוי יעוד לצורך שינוי הגידול החקלאי בחלקה 'ב'?","o":["לא ניתן להוריש את החלקה לבת, אלא יש למנות אותה כבת ממשיכה בחוזה מול רמ\"י (רשות מקרקעי ישראל) והאגודה השיתופית. אין צורך בשינוי יעוד במקרה זה.","ניתן להוריש את החלקה לבת. אין צורך בשינוי יעוד במקרה זה.","לא ניתן להוריש את החלקה לבת, אלא רק למנות אותה כבת ממשיכה בחוזה מול רמ\"י (רשות מקרקעי ישראל) והאגודה השיתופית. יש לשנות יעוד בקרקע במקרה זה.","ניתן להוריש את החלקה לבת, אך יש לשנות את יעוד הקרקע במקרה זה."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2022-02#6","e":32,"n":6,"s":"יפית היא מתווכת מוסמכת במקרקעין, יפית משווקת משרד. המשרד נמצא בבעלות חברה בע\"מ השייכת לאחותה של יפית ונשלטת על ידה. יפית לא שיתפה במידע זה לקוח שלה, המעוניין ברכישת המשרד.\nהאם יפית נהגה כחוק?","o":["יפית נהגה כחוק, בהנחה שיפית מגלה את כל הבעיות בנכס.","יפית נהגה שלא כחוק; על יפית לגלות ללקוח שהיא בעלת עניין בנכס ולקבל את הסכמתו של הלקוח בכתב לביצוע העיסקה כשהוא מודע לקירבה.","יפית נהגה כחוק; היא לא צריכה לגלות ללקוח שמדובר בחברה בשליטת אחותה.","יפית נהגה שלא כחוק; חובה עליה לגלות לצד השני שהיא בעלת עניין בנכס."],"c":[1],"a":false,"note":"","sub":"b_duties"},{"id":"2022-02#7","e":32,"n":7,"s":"שמעון הוא מתווך במקרקעין. מוכר דירה, שהתקשר עם שמעון בהסכם תיווך, סיפר לשמעון, במסגרת עבודתו כמתווך, כי הוא ואשתו נמצאים בתהליך גירושין וביקש משמעון שלא לספר זאת לקונים. הקונים פנו לשמעון ושאלו אותו באופן ישיר: ״האם המוכרים נמצאים בתהליך גירושין?״.\nהאם שמעון צריך לגלות לקונים הפוטנציאליים עובדה זאת?","o":["שמעון חייב לספר מה קורה בדירה, מכיוון שיש קונים שזה ממש יפריע להם, ולכן מדובר בנושא מהותי לפי חוק החוזים.","שמעון חייב לענות על השאלה, אך ורק אם נשאל שאלה ישירה בנושא.","שמעון לא יכול לענות על השאלה, עקב איסור גילוי הידיעה החל עליו כמתווך.","שמעון לא יכול לענות על השאלה, מכיוון שמדובר בנושא מהותי לפי חוק החוזים."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2022-02#8","e":32,"n":8,"s":"מיכל המתווכת מתבקשת על ידי הצדדים להסכם מקרקעין לסייע בעריכת זיכרון דברים בין קונה למוכר.\nבהקשר זה, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["לפי הוראות החוק, מותר למתווך לסייע רק בזיכרון דברים, אבל לא בעריכת חוזה.","לפי הוראות החוק, מותר למתווך לסייע גם בזיכרון דברים וגם בעריכת חוזה.","לפי הוראות החוק, אסור למתווך לסייע בעריכת זיכרון דברים, אבל מותר לו לסייע בעריכת חוזה.","לפי הוראות החוק, אסור למתווך לסייע בעריכת זיכרון דברים, ואף לא בעריכת חוזה."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2022-02#9","e":32,"n":9,"s":"בטופס הזמנת שירותי התיווך שהזמינה לקוחה לא נרשם באיזה סוג עיסקת תיווך מדובר (כגון 'שכירות' או 'מכירה'), וגם לא נרשם מספר תעודת הזהות של הלקוחה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין חובה לרשום סוג עיסקה ואין חובה לרשום מספר תעודת זהות של הלקוחה.","יש חובה לרשום סוג עיסקה, ואין חובה לרשום מספר תעודת זהות של הלקוחה.","יש חובה לרשום סוג עיסקה, ויש חובה לרשום מספר תעודת זהות של הלקוחה.","ת.ז. וסוג עסקה יש חובה לרשום בהסכם בלעדיות בלבד, ולא בהזמנת שירותי תיווך."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2022-02#10","e":32,"n":10,"s":"באיזו דרך נכרת חוזה?","o":["בדרך של מכירה וקנייה.","בדרך של הצעה וקיבול.","בדרך של התרשמות והסכמה.","בדרך של חברות וחתימה."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2022-02#11","e":32,"n":11,"s":"דוד רוצה להיפרד מהשותפות שלו במקרקעין עם משה.\nמה ההליך שעל דוד לנקוט כדי לפרק את השותפות במקרקעין?","o":["בקשה לסילוק יד.","דוד לא יכול לפרק את השיתוף עם משה אם משה לא מסכים לכך.","תביעה לפירוק שיתוף במקרקעין.","בקשה להפרת חוזה."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2022-02#12","e":32,"n":12,"s":"דוד הינו אלמן, המתגורר עם בת זוגו בדירה בדמי מפתח. בנו היחיד מתגורר בסמוך לו, ושוהה בדירה של דוד יותר מ- 4 שעות מידי יום, וזאת על מנת לטפל בו.\nאם דוד יילך לעולמו, מי יהיה זכאי להיות דייר מוגן במקומו?","o":["קרוביו האחרים של דוד (שאינם בת זוגו או בנו).","בת זוגו של דוד תהא הדיירת המוגנת אחריו, אך זאת בתנאי שהתגוררה בבית עם דוד שישה חודשים לפחות.","בהתאם לחוק הגנת הדייר אין אפשרות לצאצאים או לבני זוג לרשת דיירות מוגנת. החזקה בדירה חוזרת לבעל הבית.","בהתאם לחוק הגנת הדייר, בנו יירש את הזכות."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2022-02#13","e":32,"n":13,"s":"ארנון הצטרף לקבוצת רכישה המתארגנת לרכישת זכות במקרקעין ולבניית בניין משרדים על הקרקע.\nלפי מה יחושב מס הרכישה של ארנון?","o":["ארנון, כרוכש הנמנה עם קבוצת הרכישה, יהא חייב במס רכישה אשר יחושב לפי שווי המכירה של הנכס הבנוי.","ארנון, כרוכש הנמנה עם קבוצת הרכישה, לא יהא חייב במס רכישה.","ארנון, כרוכש הנמנה עם קבוצת הרכישה, יהא חייב במס רכישה רק על שווי חלקו היחסי בקרקע.","ארנון, כרוכש הנמנה עם קבוצת הרכישה, יהא חייב במס רכישה מופחת, כפי שיקבע שר האוצר באישור ועדת הכספים של הכנסת, לפי שווי חלקו היחסי בבניין."],"c":[0],"a":false,"note":"","sub":"x_purchase"},{"id":"2022-02#14","e":32,"n":14,"s":"בני זוג רכשו דירה חדשה מקבלן. הקבלן מאחר במסירת הדירה לקונים ללא נימוק מוצדק. החוזה אינו מתייחס למצב של איחור במסירת הדירה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הרוכשים יהיו זכאים לפיצויים בגין איחור במסירה, החל משלושה חודשים מתום המועד הקבוע לכך בחוזה.","הרוכשים יהיו זכאים לפיצויים בגין איחור במסירה, החל מתום המועד הקבוע לכך בחוזה.","הרוכשים יהיו זכאים לפיצויים בגין איחור במסירה, לאחר שישים ימים מתום המועד הקבוע לכך בחוזה.","הרוכשים לא יהיו זכאים לפיצויים בגין איחור במסירה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2022-02#15","e":32,"n":15,"s":"בני זוג חתמו על זיכרון דברים עם קבלן, לרכישת דירת מגורים.\nבמעמד החתימה, הקבלן ביקש מבני הזוג שישלמו לו 10% ממחיר הדירה כמקדמה. סכום זה יהווה \"מקדמה ודמי רצינות\" לחתימה על חוזה הרכישה.\nבנסיבות המתוארות, האם הקבלן פעל כדין?","o":["הקבלן לא פעל באופן חוקי, זאת מכיוון שאסור לגבות מקדמה כספית בעת עריכת זיכרון דברים, אלא רק בעת חתימה על חוזה מחייב.","הקבלן לא פעל באופן חוקי, זאת מכיוון שדרש מחיר שעולה על 7% ממחיר הדירה.","הקבלן פעל באופן חוקי, זאת מכיוון שבכל עיסקת רכישת דירה משלמים 10% מהמחיר כמקדמה.","הקבלן פעל באופן חוקי, זאת מכיוון שזיכרון דברים הוא חוזה לכל דבר ואפשר לגבות בו מקדמה על חשבון הדירה החדשה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2022-02#16","e":32,"n":16,"s":"בבית משותף קיימות 12 דירות. בעלי הדירות מעוניינים להסדיר בתקנון מוסכם, הצמדה של חלק מהרכוש המשותף לטובת חניה לדירה הנמצאת בקומת הקרקע.\nהאם בעלי הדירות יכולים לבצע מהלך זה? אם כן, כיצד?","o":["בעלי הדירות אינם יכולים לבצע מהלך שכזה; מדובר בעיסקת מקרקעין לרכישת חלק מהרכוש המשותף. לכן לא ניתן להצמיד חלק מהרכוש המשותף לדירה מסוימת בתקנון.","בעלי הדירות אינם יכולים לבצע מהלך שכזה; תקנון מוסכם עוסק אך ורק בניהול הרכוש ולא בחלוקת שטחים.","בעלי הדירות יכולים לבצע מהלך שכזה, זאת בתנאי שהמהלך בוצע ברוב של בעלי הדירות ששני שלישים של הרכוש המשותף צמוד לדירותיהם.","בעלי הדירות יכולים לבצע מהלך שכזה, אך זאת בתנאי שהמהלך בוצע בהסכמת כל בעלי הדירות."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2022-02#17","e":32,"n":17,"s":"לאה חתמה על הזמנה בכתב לביצוע פעולות תיווך לצורך מכירת משרד. וכן חתמה לאה על חוזה בלעדיות נפרד. תקופת הבלעדיות לא צוינה על גבי חוזה הבלעדיות.\nהאם ומתי תסתיים תקופת הבלעדיות במקרה זה?","o":["תקופת הבלעדיות תסתיים בתום תשעה חודשים מיום החתימה על הסכם הבלעדיות.","תקופת הבלעדיות תסתיים בתום 30 ימים מיום החתימה על הסכם הבלעדיות.","תקופת הבלעדיות תימשך כל עוד לא נאמר אחרת.","תקופת הבלעדיות תסתיים בתום שישה חודשים מיום החתימה על הסכם הבלעדיות."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2022-02#18","e":32,"n":18,"s":"בני זוג הינם בעלי דירה. בני הזוג התקשרו עם מתווך בהסכם להזמנת שירותי תיווך ובהסכם בלעדיות. בהסכם הבלעדיות סוכמה תקופת בלעדיות בת 90 יום. במהלך תקופת הבלעדיות, ביצע המתווך פעולות תיווך רבות ופעל בשקידה רבה. הדירה נמכרה במהלך תקופת הבלעדיות, אך לא באמצעות המתווך.\nבנסיבות העניין, ובהתייחס לפסק הדין בר\"ע 2285/05 אבנר שמואלי ואח' נ' דורון סמוכה ואח', האם במקרה כזה זכאי המתווך לדמי תיווך?","o":["המתווך זכאי לדמי תיווך, גם אם הדירה לא נמכרה באמצעותו, שכן ברור שהדירה נמכרה בגלל פרסומיו.","המתווך זכאי לדמי תיווך; בזכות שילוב של ביצוע פעולות תיווך בשקידה כדי למצוא קונים טובים לפי הסכם בלעדיות, יש לראות במתווך כ\"גורם היעיל\" בביצוע העיסקה.","המתווך לא זכאי לדמי תיווך; המשמעות של \"בלעדיות\" היא שלא תהיה פנייה למתווך אחר בתקופה של הבלעדיות, אבל ניתן למכור את הדירה ללא מעורבותו.","המתווך לא זכאי לדמי תיווך, זאת משום שלא היה הגורם היעיל בביצוע העיסקה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2022-02#19","e":32,"n":19,"s":"אמנון מתגורר בדירה בשכירות מוגנת (\"דמי מפתח\"). אמנון מבקש להכניס במקומו דייר חלופי שמצא בדמי מפתח, ולעבור לגור אצל בנו.\nבמידה שלא יגיע להסכמה עם בעל הנכס לגבי פינוי המושכר, האם אמנון יכול להציע לבעל הנכס דייר בדמי מפתח במקומו?","o":["כן, אמנון יוכל לעשות כן בתנאי שישלח בדואר רשום הצהרה בכתב על מועד הפינוי, פרטי הדייר המוצע, והסכום המוצע.","כן, אמנון יוכל לעשות כן, אולם עליו להמתין להתחלת הפינוי של הדירה על ידו לפחות חצי שנה ממועד הצעת הדייר החלופי.","לא, הנכס תמיד חוזר לבעל הבית בסיום הדיירות המוגנת להשכרה במחיר מלא.","לא, אין אפשרות כזו בחוק הגנת הדייר."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2022-02#20","e":32,"n":20,"s":"על פי פסק הדין בעניין ת\"א 6577/98 טרנס גלובל סוכנות לנכסים בע\"מ נגד נתנאל בע\"מ, מה דינו של נכס שהמתווך מטעם סוכנות טרנס גלובל לנכסים מראה ללקוח, אבל שלט שתלוי על הנכס מלמד כי הנכס מטופל על ידי סוכנות תיווך אחרת. פרטי הנכס לא נכתבו באופן מפורש בהזמנת התיווך.\nהאם יש חובה לשלם ל\"טרנס גלובל\" דמי תיווך במקרה זה?","o":["אין חובה לשלם דמי תיווך במצב כזה. זאת משום שסוכנות התיווך לא מילאה את הדרישות הקיימות בחוק, והנכס ופרטיו לא פורטו במפורש בהזמנת התיווך (בין השאר).","אין חובה לשלם דמי תיווך במצב כזה. תמיד משלמים רק לסוכנות התיווך שהשלט בנכס שייך לה.","חובה לשלם דמי תיווך במצב כזה. גם אם הנכס שייך לסוכנות תיווך אחרת בבלעדיות, המתווך במקרה כזה הוא הגורם היעיל בביצוע העיסקה.","חובה לשלם דמי תיווך במצב כזה. אין צורך לכתוב במפורש בהזמנת התיווך כל נכס שמתווך מראה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2022-02#21","e":32,"n":21,"s":"האם שמירה ופיתוח של מקומות חשובים מבחינת הטבע והימנעות ככל האפשר מפגיעה בצמחיה, הן חלק ממטרותיה של 'תוכנית מיתאר מקומית'?","o":["כן; שמירה ופיתוח של מקומות חשובים מבחינת הטבע והימנעות ככל האפשר מפגיעה בצמחיה היא חלק ממטרותיה של תוכנית מיתאר מקומית.","כן; לא ניתן לאשר תוכנית בנייה שפוגעת במקומות חשובים מבחינת הטבע.","לא; תוכנית מיתאר מקומית עוסקת אך ורק בבנייה, אדריכלות והנדסה ולא בנושאים של איכות הסביבה.","לא; לשם עיסוק בנושא זה נדרשת תוכנית מיתאר ארצית בשיתוף המשרד לאיכות הסביבה ותוכניות מקומיות אינן עוסקות בנושא זה."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2022-02#22","e":32,"n":22,"s":"לפי החוק, על ידי מי מוטל 'מס שבח', ומי מחויב לשלמו?","o":["מס שבח מוטל על ידי הרשות המקומית ומשולם על ידי הקונה בעיסקת מקרקעין.","מס שבח מוטל על ידי מדינת ישראל ומשולם על ידי הקונה בעיסקת מקרקעין.","מס שבח מוטל על ידי הרשות המקומית ומשולם על ידי המוכר בעיסקת מקרקעין.","מס שבח מוטל על ידי מדינת ישראל ומשולם על ידי המוכר בעיסקת מקרקעין."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2022-02#23","e":32,"n":23,"s":"באיזה מהחוקים הבאים נדון המושג 'פרטת עיזבון'?","o":["חוק מיסוי מקרקעין (שבח ורכישה) התשכ\"ג – 1963.","חוק החוזים (חלק כללי), התשל\"ג – 1973.","חוק המתווכים במקרקעין, התשנ\"ו – 1996.","חוק הירושה, התשכ\"ה – 1965."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-02#24","e":32,"n":24,"s":"יעל ונמרוד חוכרים מרשות מקרקעי ישראל (רמ\"י), בחכירה מהוונת לדורות לתקופה של 99 שנים, בית מגורים צמוד קרקע במושב (להלן: \"הנכס\"). אל יעל ונמרוד פנתה כנסיה יוונית שנמצאת בסמוך, בהצעה לקנות את זכותם לחכירה לדורות על מנת שיוכלו צליינים נוצרים זרים, שאינם תושבי ישראל ואינם אזרחי ישראל, להתארח בנכס כשהם נמצאים בישראל.\nלפי החוק, האם מדובר בעיסקה הניתנת לביצוע?","o":["כן; אולם אך ורק כפוף לאישור בקשה מיוחדת ליו\"ר מועצת רשות מקרקעי ישראל.","כן; חכירה לדורות כמוה כבעלות מבחינת השוק וניתן להעביר בעלות פרטית לכל גורם.","לא; החוק אוסר על העברת מקרקעי ישראל לאדם זר או לתאגיד זר.","לא; מי שחוכר בית צמוד קרקע במושב, הבנוי על קרקע השייכת למדינה, חייב להיות בעל זכות החכירה באופן אישי."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2022-02#25","e":32,"n":25,"s":"אסף, מתווך מוסמך במקרקעין, תיווך בעיסקת מקרקעין עם זוג עולים חדשים. זוג העולים לא שלט בשפה העברית. הזוג הסביר לאסף המתווך במפורש שהם רוצים לקנות בישראל נכס בבעלות. אסף מצא לזוג העולים בית ב\"חכירה לדורות\", והסביר להם ש\"זה בסדר\", \"חכירה\" בעברית זה \"בעלות\". העולים חכרו לדורות את הדירה ללא שהסתייעו בעורך דין, ושילמו לאסף את שכרו. למרבה הצער, בדיעבד הבינו העולים כי אסף ניצל לרעה את העובדה שלא שלטו בשפה העברית, והשפיע עליהם בצורה בלתי הוגנת לעשות עיסקה שלא רצו בה.\nהאם אסף המתווך פעל באופן תקין?","o":["כן. זוג העולים צריך היה לבדוק את התרגום של אסף בעצמו, ואין לאסף כל חובה בנושא זה.","כן. זוג העולים צריך היה לקחת לעצמו מתורגמן ואין לאסף כל חובה בנושא זה.","לא. זאת משום שלפי החוק אסף חייב להיות דובר שפתו של הלקוח כדי לתווך את העסקה עבור הלקוחות.","לא. זאת משום שקיים איסור בחוק לנצל לרעה את אי ידיעת השפה העברית של לקוח."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-04#1","e":33,"n":1,"s":"יונתן חתם על חוזה לרכישת דירה חדשה מחברת בנייה. זכויות הבעלות של רוכשי הדירות טרם נרשמו בלשכת רישום המקרקעין (\"טאבו\"). יונתן מעוניין לדעת היכן רשומות זכויותיו בדירה בשלב זה.\nלאן עליו לפנות כדי לקבל המידע? נא לסמן את התשובה הנכונה ביותר.","o":["זכויותיו של יונתן אמורות להיות רשומות בשלב זה בלשכת רישום והסדר מקרקעין (\"טאבו\").","זכויותיו של יונתן אמורות להיות רשומות בשלב זה בחברה המשכנת הקבלנית שבנתה את הבניין.","זכויותיו של יונתן אמורות להיות רשומות בשלב זה ברשות מקרקעי ישראל.","זכויותיו של יונתן אמורות להיות רשומות בשלב זה ברשם המשכונות."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2022-04#2","e":33,"n":2,"s":"שמרית מבקשת למכור דירה שבבעלותה. חוזה המכר אינו מתייחס לפריטים בדירה בצורה מפורשת. בדירה יש מזגן חדש המחובר למערכת חשמל ייחודית בתוך קיר גבס, כיור המחובר למערכת גריסה בהתקן בתוך המטבח, ופסנתר כנף.\nאיזה מפריטים אלה תוכל שמרית לקחת איתה, אם לא הגיעה להסכמה אחרת עם הקונים?","o":["שמרית לא יכולה להוציא מהדירה דבר; כל הפריטים יישארו בדירה כפי שהקונים ראו אותה.","שמרית יכולה לקחת איתה את המזגן בלבד, מכיוון שהוא חדש.","שמרית יכולה לקחת איתה את הפסנתר בלבד.","שמרית יכולה לקחת איתה את כל הפריטים שתוארו בשאלה."],"c":[2],"a":false,"note":"","sub":"s_sale"},{"id":"2022-04#3","e":33,"n":3,"s":"מה פירוש המושג \"חכירה\"? אנא סמנו את התשובה הנכונה ביותר.","o":["שכירות משנה.","שכירות לתקופה של יותר מ- 25 שנים.","זכות שהוקנתה בתמורה להחזיק במקרקעין ולהשתמש בהם שלא לצמיתות.","שכירות לתקופה של יותר מחמש שנים."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-04#4","e":33,"n":4,"s":"האם ניתן להגיע לסיכום עם ועד הבית של בניין מסוים, שלא יוטל חיוב בגין הוצאות אחזקת הרכוש המשותף על בעל דירה מסוים?","o":["לא, אלא אם נקבע אחרת בתקנון הבית המשותף.","כן; אפשר לסכם עם ועד הבית שלא לשלם הוצאות עבור אחזקת הרכוש המשותף, אבל לתקופה שלא תעלה על שנה.","לא, אלא אם עבודות האחזקה אינן מבוצעות בסמוך לדירה הרלוונטית.","כן; ועד הבית רשאי לתת פטור מהוצאות הרכוש המשותף."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2022-04#5","e":33,"n":5,"s":"יוסף הינו בעלים של נחלה חקלאית במושב. לימים, יוסף נפטר. ילדיו: אהרון, תמי ואתי, ירשו את הנחלה על פי צוואתו.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן להוריש את הנחלה בדרך הרגילה של עריכת צוואה. יש לקבוע מי יהיה או תהיה \"בן ממשיך\" או \"בת ממשיכה\" בחוזה מול רשות מקרקעי ישראל (לשעבר \"מינהל מקרקעי ישראל\").","ניתן להוריש את הנחלה דרך צוואה, לטובת כל ילדיו של יוסף.","ניתן להוריש את הנחלה דרך צוואה, לטובת צאצא/ית יחיד/ה בלבד.","לא ניתן להוריש את הנחלה בדרך הרגילה של עריכת צוואה, שלושת מקבלי הזכות יירשו את החוזה מול רשות מקרקעי ישראל (לשעבר \"מינהל מקרקעי ישראל\") בחלקים שווים בלתי מסוימים."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2022-04#6","e":33,"n":6,"s":"ליאור הוא רופא שיניים, עוסק מורשה. ליאור הוא בעלים של דירת מגורים המשמשת כקליניקה לטיפולי שיניים. ליאור פרסם את הדירה למכירה. ד\"ר אור, רופאת שיניים ועוסקת מורשית אף היא, פנתה אל ליאור וביקשה לרכוש את הדירה.\nבנסיבות העניין, האם המכירה לד\"ר אור חייבת בתשלום מס ערך מוסף בגין מכירת הדירה? נא לסמן את התשובה הנכונה ביותר.","o":["מכירת הדירה לד\"ר אור חייבת בתשלום מס ערך מוסף, מכיוון שמדובר בדירת מגורים.","מכירת הדירה לד\"ר אור אינה חייבת בתשלום מס ערך מוסף, מאחר שהעיסקה נעשית בדירה ששימשה למגורים.","מכירת הקליניקה לד\"ר אור אינה חייבת בתשלום מס ערך מוסף, מאחר שייעוד הדירה הוא למגורים.","מכירת הדירה לד\"ר אור חייבת בתשלום מס ערך מוסף, מכיוון שזוהי עיסקה המתבצעת מול עוסקת מורשית."],"c":[3],"a":false,"note":"","sub":"k_consumer"},{"id":"2022-04#7","e":33,"n":7,"s":"חוזה מכר נכרת בין מוכר לקונה, זאת לאחר שהמתווך החתים את המוכר על הזמנת תיווך, ובה כל פרטי התיווך הנדרשים בחוק. הקונה רכש את הנכס המדובר דרך המתווך והעיסקה יצאה אל הפועל. בהמשך, ביטל הקונה את חוזה המכר.\nהאם יש חובה לשלם דמי תיווך בנסיבות העניין, ובהתאם לפסק הדין רע\"א 394/88 אנגל שושני ואח' נ' אברון את פורת בע\"מ? נא לסמן את התשובה הנכונה ביותר.","o":["לא; אין לקונה חובה לשלם דמי תיווך למתווך, כי העיסקה לא יצאה אל הפועל.","כן; על הקונה לשלם דמי תיווך למתווך. מרגע שנחתם זכרון דברים המתווך זכאי לדמי תיווך גם אם החוזה בוטל בדיעבד.","לא; אין למוכר חובה לשלם למתווך דמי תיווך בנסיבות אלה, כי העיסקה לא הסתיימה.","כן; על המוכר לשלם דמי תיווך למתווך. מרגע שנחתם הסכם מחייב המתווך זכאי לדמי תיווך, גם אם החוזה בוטל בדיעבד."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2022-04#8","e":33,"n":8,"s":"בני זוג חתמו על הזמנת תיווך כדין עם מתווך, אשר מצא להם דירה לפי בקשתם. בחוזה הרכישה של הדירה המדוברת צוין כי קיים צו הריסה ביחס לחלק מהדירה, עקב חריגת בנייה. בין המוכרים והקונים נחתם זכרון דברים עם תנאי מתלה, לפיו זכרון הדברים ייכנס לתוקף רק לאחר המצאת אישור ממהנדס העיר והוועדה המקומית לתכנון ובניה כי צו ההריסה בוטל וזאת להנחת דעת הקונים. למרבה הצער, לא עלה בידי המוכרים להציג אישור ביטול צו ההריסה החלקי במועד שנקבע, וזכרון הדברים בוטל בדיעבד.\nלפי פסק הדין ת\"א 4350/08 דה–כהן נ' זר–גוטמן ואח', האם במקרה כזה קיימת חובת תשלום דמי תיווך?","o":["כן; מרגע שנחתם זיכרון דברים, המתווך זכאי לדמי תיווך גם אם זכרון הדברים בוטל בדיעבד.","כן; מרגע שנחתם זכרון דברים מחייב, המתווך זכאי לדמי תיווך גם אם זכרון הדברים בוטל בדיעבד.","לא; זאת מכיוון שזכרון הדברים היה על תנאי מתלה ולא נכנס לתוקף.","לא; זאת מכיוון שהמוכרים פעלו בחוסר תום לב."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2022-04#9","e":33,"n":9,"s":"מיטל הקימה אתר אינטרנט, שבו היא מפרסמת דירות יד שנייה, ובאמצעותו מפגישה בין קונים למוכרים, וזאת לאחר שמיטל מוסרת הסבר מעמיק על הדירות. מיטל דורשת עבור פעולותיה עמלה מופחתת של אחוז אחד מערך הדירה, בתוספת מע\"מ כחוק.\nהאם הפעולות של מיטל דורשות רישיון תיווך?","o":["כן; מיטל מבצעת תיווך בין מוכר לקונה לשם התקשרותם במקרקעין ובתמורה, ולפיכך עליה להיות בעלת רישיון בתוקף לעיסוק בתיווך במקרקעין.","לא; מיטל יכולה לפרסם דירות למכירה.","לא; מיטל יכולה לפרסם דירות למכירה, אבל היא חייבת להיות עובדת של סוכנות תיווך לצורך כך.","כן; פרסום של נכס מקרקעין דורש רישיון תיווך, וזאת משום שבעצם הפרסום ישנה פעולה מהותית של הצגה של נכס."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2022-04#10","e":33,"n":10,"s":"בעל זכויות חכירה לדורות של דירת גן נפטר (להלן: \"המנוח\"). הדירה בבעלות קרן קיימת לישראל.\nהאם יורשיו של המנוח יידרשו לשלם תשלומי מס שבח או מס רכישה מעצם פעולת ההורשה?","o":["לא; הדירה הינה בחכירה (שכירות ארוכת טווח) ולפיכך מס השבח ומס הרכישה חלים על הבעלים בלבד.","כן; \"מכירה\" של נכס הינה בין בתמורה ובין שלא בתמורה. מכאן שיש לשלם מס שבח ומס רכישה בכל העברה לקרובים.","לא; העברת זכויות במקרקעין במסגרת הורשה איננה \"מכירה\" לעניין חוק מיסוי מקרקעין (שבח ורכישה).","כן; יתכן שהיורשים יידרשו לשלם מס רכישה בשיעור של 1/3 ממדרגות המס."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2022-04#11","e":33,"n":11,"s":"יצחק הוא בעלים של מספר דירות. יצחק מעוניין למכור את אחת מדירותיו, שלאורך השנים שחלפו מאז שרכש אותה, עלה ערכה בשוק החופשי במיליון שקלים חדשים. חלק מעליית השווי נובע מזכויות בנייה נוספות שאושרו על ידי הוועדה המקומית לתכנון ובניה.\nהאם יחול מס שבח בעיסקה זו? אנא סמנו את התשובה הנכונה ביותר.","o":["כן; מס השבח יוטל על השבח במכירת זכות במקרקעין, שהוא ההפרש בין שווי המכירה לרכישה, ובניכויים על פי חוק.","כן, אך מס השבח יחול אך ורק כאשר ערך הדירה מושבח בעקבות הוספת זכויות בנייה או שינוי יעוד. מס השבח יחול אך ורק בעת בנייה או מכירה.","לא, למעט על מרכיב ההשבחה, קרי על זכויות הבנייה הנוספות. מס השבח יחול אך ורק בעת הבנייה או המכירה.","לא; יצחק פטור ממס שבח מכיוון שמדובר בדירת מגורים ויש פטור לדירת מגורים."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2022-04#12","e":33,"n":12,"s":"אוהד מכר נכס מקרקעין החייב במס שבח ושילם למתווכת דמי תיווך בשיעור 5% מערך הנכס. המדובר בנכס ייחודי, שהתיווך בו היה מורכב במיוחד. זאת משום שמדובר בנכס לשימור הדורש עמידה בתשלומי תחזוקה יקרים.\nהאם אוהד יכול לנכות מסכום מס השבח את דמי התיווך ששילם? אם כן, כמה? אנא סמנו את התשובה הנכונה ביותר.","o":["לא ניתן לנכות יותר מ- 2% ממס השבח בגין דמי תיווך.","לא ניתן לנכות סכום כלשהו ממיסוי מקרקעין.","ניתן לנכות ממס השבח כל סכום, ללא תנאי. מדובר בהוצאה מוכרת.","ניתן לנכות ממס השבח את מלוא דמי התיווך ששולמו, אך זאת רק במידה ששוכנע מנהל מיסוי מקרקעין שמדובר בנסיבות מיוחדות המצדיקות זאת."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2022-04#13","e":33,"n":13,"s":"בהתאם לערעור אזרחי 4582/08 אהרון גופר נגד יהודית קאופמן, אם הזמנת תיווך אינה כוללת את המחיר המבוקש לעיסקת המקרקעין, האם יש בכך כדי למנוע מהמתווכת דמי תיווך?","o":["כן; לפי פסק הדין מחיר העיסקה הוא עניין מהותי שלא ניתן להתעלם ממנו.","כן; לפי פסק הדין מתווך זכאי לדמי תיווך אך ורק אם נחתמה הזמנת תיווך כדין ובמסגרת זו יש לציין, לפי החוק, את מחיר העיסקה.","לא; לפי פסק הדין מדובר בפרט לא מהותי מתוך דרישות החוק להזמנת תיווך כדין. פרט שאינו שולל זכאות כשלעצמו לדמי תיווך, אם המתווכת עמדה בשאר דרישות החוק.","לא; לפי פסק הדין, אם ישנה בלעדיות בנכס אז אין צורך לרשום את מחיר העיסקה המבוקש. זאת מכיוון שהוא ממילא מסוכם בין הצדדים בפועל."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2022-04#14","e":33,"n":14,"s":"יצחק רכש דירה חדשה מקבלן. לאחר שקיבל חזקה בדירה הזמין חברה לביצוע ״בדק בית״. המודד שהזמין יצחק מטעם החברה מצא כי ישנה סטייה בשטח הגינה הצמודה לדירה, כך שהגינה שקיבל יצחק קטנה ב- 4.5% מכפי שאמורה הייתה להיות ע\"פ המפרט שצורף לחוזה הרכישה.\nהאם מדובר בסטייה מותרת לפי החוק?","o":["כן; שטח הגינה כולל את שטחי הקירות התומכים בהיקפה, ומותרת סטייה של עד 5% בין שטח הגינה המופיע במפרט המכר לבין השטח למעשה.","כן; משום שמדובר ב״קיר חוץ״.","לא; סטייה קבילה היא סטייה של עד 2% מהשטח המופיע במפרט המכר לבין השטח למעשה.","לא; על שטח הגינה במפרט שמצורף לחוזה המכר להיות תואם לחלוטין לשטח למעשה, ללא הבדלים כלשהם."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2022-04#15","e":33,"n":15,"s":"לצורך הערכת שווי בשומת נכסים של עיזבון, האם ניתן להגיש לבית המשפט חוות דעת מומחה מאת פרופסור להיסטוריה, המומחה בהערכות מחיר של נכסים היסטוריים, אך אינו שמאי מוסמך?","o":["כן; בית משפט רשאי למנות כל אדם שאינו שמאי לצורך הערכת שווי נכס של עיזבון.","כן; היסטוריונים מומחים רשאים להגיש חוות דעת שמאית בנכסים היסטוריים.","לא; רק שמאי מוסמך יכול להגיש חוות דעת שמאית להערכת שווי נכס בבית משפט.","לא; רק מתווך או שמאי מוסמך רשאי להגיש חוות דעת לגבי הערכת שווי של נכס."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-04#16","e":33,"n":16,"s":"בחלוקת דמי מפתח של עסק, האם ינוכה מהסכום המועבר לבעל הנכס התשלום עבור המוניטין של העסק, שאותו משלם הדייר המוצע? אנא סמנו את התשובה הנכונה ביותר.","o":["כן; מכיוון שהמוניטין שייך לשוכר.","כן; כל עוד הדייר המוצע ממשיך את אותו עסק בדמי מפתח באותו שם, או מפעיל פרקטיקה של מקצוע הדורש רישוי, כגון רופא/ה בשם אחר.","לא; משום שתשלום בגין מוניטין המשולם על ידי דייר מוצע חדש בעסק בדמי מפתח שייך לעסק, ולא לבעלי הנכס.","לא; משום שתשלום בגין מוניטין שייך לבעלי הנכס."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2022-04#17","e":33,"n":17,"s":"מי מהבאים אינו נחשב כ״בעל עניין״ בקרקע, לעניין הגשת תוכנית מפורטת לוועדה מקומית או מחוזית לתכנון ובניה? אנא סמנו את התשובה הנכונה ביותר.","o":["חברה ממשלתית שעיקר עיסוקה הוא בפיתוח מבנים ותשתיות.","בעלי הקרקע.","חברה בעלת רישיון להקמת מתקן להתפלת מי ים.","עמותה למען איכות הסביבה שאינה בעלת זכויות בקרקע."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2022-04#18","e":33,"n":18,"s":"חברה קבלנית משווקת דירות חדשות בפרויקט בנייה. בחוזה האחיד לפרויקט, נקבע באחד מהסעיפים כי מחיר הדירה צמוד למדד תשומות הבנייה (להלן: \"המדד\"), באופן שרק אם המדד עולה, המחיר של הדירות יעלה, אולם מחיר הדירה לא יירד במקרה בו המדד יירד.\nהאם הסעיף הנ\"ל תקף? אנא סמנו את התשובה הנכונה ביותר.","o":["לא; תניה בחוזה שבו רק הקבלן ייהנה מעלייה במדד ואילו הרוכשים לא יוכלו ליהנות מירידה במדד, חזקה שהיא תנאי מקפח.","לא; חל איסור בחוק להצמיד חוזה דירה למדד תשומות הבנייה.","כן; צדדים לחוזה רשאים לקבוע את תנאי העיסקה כרצונם.","כן; משום שלא מדובר בחוזה אחיד."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2022-04#19","e":33,"n":19,"s":"בחוזה מכר של דירה חדשה מקבלן נכתב כי הדירה תהיה מדגם \"נוף לפארק\" יוקרתי. דירות מדגם \"נוף לפארק\" תומחרו בתוספת 15% למחיר הדירה. למרבה הצער, הסתבר בדיעבד שבשל סיבות תכנוניות אדריכליות, הוועדה המקומית לתכנון ובניה תגרום לחסימה של הנוף הנשקף לפארק ממרפסות הדירות הנ\"ל.\nמרגע שהקבלן יקבל הודעה על כך, האם הקבלן מחויב לגלות לרוכשים על השינוי התכנוני?","o":["לא; אין חובה לגלות לרוכשים על שינויים תכנוניים.","לא; הקבלן חייב לגלות לרוכשים על שינויים המשפיעים על ערך הנכס עד לחתימת החוזה בלבד.","כן; יש חובה לגלות לרוכשים על כל שינוי תכנוני.","כן; חובה על הקבלן לגלות לרוכשים מידע על כל פעולה הצפויה לגרום להפחתה משמעותית מערך הנכס."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2022-04#20","e":33,"n":20,"s":"באילו מן הדרכים הבאות ניתן לפרק שיתוף במקרקעין?","o":["רק בדרך של חלוקה בעין.","רק בדרך של מכירה.","רק בדרך של רישום הבית בפנקס הבתים המשותפים.","כל התשובות נכונות."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"l_shared"},{"id":"2022-04#21","e":33,"n":21,"s":"אור, מתווך במקרקעין, ביקש לייסד חברה. אור זייף היתרי בנייה במטרה להציגם ללקוחות בשם החברה שבכוונתו לייסד. בסופו של דבר, אור לא הספיק לייסד את החברה.\nהאם ניתן להאשים את אור בעבירה של זיוף בשם החברה שטרם נוסדה?","o":["כן; העובדה שהחברה טרם נוסדה אינה מונעת את האשמתו של אור בזיוף מסמך.","כן; כל עריכת חוזה על ידי מתווך במקרקעין מהווה זיוף, אפילו אם המתווך לא מציג עצמו כעורך דין.","לא; כדי להאשים את אור בזיוף של עיסקה עם מסמכי חברה, צריכה להיות חברה שהיא צד לעיסקה.","לא; לא מדובר בזיוף, אלא בהיתר בנייה שטרם יצא אל הפועל."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2022-04#22","e":33,"n":22,"s":"יצחק הינו בעל עסק לגידול ומכירת בעלי חיים.\nהאם באפשרותו של יצחק לקבל רישיון עסק על סמך תצהיר בסוג זה של פעילות עסקית?","o":["כן; כל עוד מדובר בעופות והנכס אינו עולה בשטחו על 500 מטר.","כן; רישיון עסק לגידול והחזקת בעלי חיים ניתן על סמך תצהיר, כל עוד בעלי החיים המדוברים אינם עופות.","לא; אין בישראל אפשרות לקבל רישיון עסק על יסוד תצהיר.","לא; אלא אם מדובר בעסק שנמצא בקניון."],"c":[1],"a":false,"note":"","sub":"k_misc"},{"id":"2022-04#23","e":33,"n":23,"s":"האם ניתן להעביר בעלות ללא תמורה במקרקעין השייכים למדינת ישראל?","o":["כן, לצורך יישור גבולות והשלמת נחלאות, ובלבד ששטח המקרקעין לא יעלה על 100 דונם בכל פעם ובכפוף לאישור של ועדת הכספים של הכנסת.","כן; החוק קובע שבעלות במקרקעין השייכים למדינת ישראל תועבר לאזרחי מדינת ישראל ללא תמורה.","לא; לא ניתן להעביר בעלות ללא תמורה במקרקעין השייכים למדינת ישראל.","לא; אלא אם מחליפים קרקע עירונית בקרקע חקלאית."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-04#24","e":33,"n":24,"s":"איזו מהפעולות הבאות רשאי מנהל עיזבון לבצע ללא אישור מבית המשפט?","o":["רישום הערת אזהרה בנכס מקרקעין.","מכירת נכס מקרקעין.","איסוף דמי שכירות משוכרים של נכסים אשר היו בבעלות המנוח/ה.","השכרה בשכירות מוגנת של נכס מקרקעין."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-04#25","e":33,"n":25,"s":"מושיקו ויונתן מנהלים מסעדה בשכירות מוגנת. מדובר בשותפות רשומה כדין, הרשומה כדייר בשכירות מוגנת, כאשר מושיקו מצוין בחוזה כאחראי על תשלום השכירות המוגנת. מושיקו יצא מן השותפות ויונתן הכניס שותף אחר לשותפות הרשומה במקום מושיקו.\nהאם נפגע קשר השכירות המוגנת באופן שהנכס חוזר לבעליו של הנכס? אנא סמנו את התשובה הנכונה ביותר בנסיבות העניין.","o":["כן; שכירות לפי חוק הגנת הדייר היא כלפי דייר מסוים בלבד, ולכן מרגע שמושיקו יצא מהחוזה, פג החוזה בדיירות מוגנת והנכס חוזר לבעליו.","כן; אלא אם בחוזה השכירות נרשם אחרת.","לא; אלא אם בחוזה השכירות נרשם אחרת.","לא; מרגע ששותפות רשומה נרשמה כדייר בבית עסק, אין הגבלות על החלפה של שוכרים בשכירות מוגנת, וניתן להחליף את השותפות בכל שוכר אחר."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2022-07#1","e":34,"n":1,"s":"איתן ואלינור קנו דירה בקומה השלישית והאחרונה בבניין מגורים בן 3 קומות, מעל קומת עמודים, בעיר פתח תקווה. אחד השכנים של בני הזוג בונה חדר על הגג ומרפסת גג, וזאת על מנת להגדיל את דירתו.\nבנסיבות העניין, האם הבנייה על הגג היא חוקית?","o":["הבנייה לא חוקית; השכן יכול להשתמש רק בגג שמעל דירתו.","כל עוד הגג מוצמד לשכן והוצא היתר בנייה כדין, אזי הבנייה חוקית.","הבנייה היא חוקית, כל עוד קיימת הסכמה מצד אלינור ואיתן, בעלי הזכויות בדירה מתחת לגג.","המדובר ב\"שימוש חורג\" בגג, ולפיכך יש צורך בהסכמת השכנים."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2022-07#2","e":34,"n":2,"s":"מאיר, הבעלים של דירת מגורים בירושלים, פנה לשמאי המקרקעין מר יצחקי, כדי שזה יעריך את שווי דירתו. שמאי המקרקעין ביקש ממאיר להמציא לו נסח רישום מקרקעין (נסח טאבו) כדי שיוכל לבצע את הערכת שווי דירתו.\nממי מאיר יוכל לקבל מידע ונסח טאבו עבור דירתו, ואילו פרטים יופיעו בנסח? נא לסמן את התשובה הנכונה ביותר.","o":["מאיר יוכל לקבל מידע ונסח טאבו בלשכת רישום והסדר במקרקעין. בנסח יופיע תיאור הנכס, שם הבעלים של הנכס והגבלת זכות הבעלות, אם יש כזו.","מאיר יוכל לקבל נסח טאבו בלשכת הוועדה לתכנון ובנייה בירושלים. בנסח יופיע תיאור הנכס, שם הבעלים של הנכס, הגבלת זכות הבעלות, אם יש כזו, הערות אזהרה, משכנתאות, עיקולים או הגבלה אחרת, אם יש כזו.","מאיר יוכל לקבל נסח טאבו בלשכת רישום והסדר במקרקעין. בנסח יופיע תיאור הנכס, שם בעלי הנכס, הגבלת זכות הבעלות ויתרת זכויות בנייה, אם יש.","מאיר יוכל לקבל נסח טאבו באגף רישום והסדר נכסים ברשות מקרקעי ישראל בירושלים. בנסח יופיע תיאור הנכס, שם בעלי הנכס, הערות אזהרה, אם יש, מצב היוון הנכס, משכנתאות, עיקולים או כל הגבלה אחרת על הבעלות, אם יש כזו."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2022-07#3","e":34,"n":3,"s":"יהונתן רכש מרשות מקרקעי ישראל (רמ\"י) זכויות בקרקע המיועדת לבנייה. יהונתן רוצה לבנות על הקרקע את ביתו. יהונתן חתם עם רמ\"י על \"חוזה פיתוח\" ביחס לקרקע.\nעל מה התחייב יהונתן בחוזה הפיתוח?","o":["לשלם לרמ\"י דמי חכירה בתמורה לשימוש בקרקע.","לפנות את הקרקע לאחר שרשות מקרקעי ישראל תסיים לפתח את הקרקע. רשות מקרקעי ישראל תפתח את הקרקע.","להחזיק בנכס לפחות שלוש שנים עד שיורשה למכור אותו.","לבנות על הקרקע שרכש, לסיים את הבנייה על הקרקע שאותה רכש בתוך פרק זמן נתון, ובתנאים שרמ\"י אישרה. לאחר סיום הבנייה כדין, יוכל יהונתן לחתום על חוזה חכירה עם רמ\"י בקרקע."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2022-07#4","e":34,"n":4,"s":"שני צדדים לעיסקת מקרקעין קבעו כי התשלום עבור הנכס יבוצע במטבע חוץ, שהשימוש בו נאסר לאחרונה במדינת ישראל.\nבמקרה זה, האם ניתן לבצע את עיסקת המקרקעין, ואם כן - כיצד?","o":["ניתן לבצע את עיסקת המקרקעין, אך ורק אם מחיר העיסקה צוין במפורש ונחתם טופס בלעדיות במסמך נפרד.","לא ניתן לבצע את עיסקת המקרקעין, כי נקבע בחוזה שימוש במטבע חוץ שהשימוש בו אסור, ומשום שהחוק אוסר על כל שינוי שהוא במטבע שבו נכרת חוזה.","ניתן לבצע את עיסקת המקרקעין; יש לקיים את החיוב בתשלום במטבע ישראלי, וזאת לפי שער החליפין הרשמי ביום התשלום.","לא ניתן לבצע את העיסקה, כי החוזה נכרת למראית עין בלבד."],"c":[2],"a":false,"note":"","sub":"k_misc"},{"id":"2022-07#5","e":34,"n":5,"s":"יעל רכשה דירת פנטהאוז חדשה מקבלן. מועד מסירת הדירה נקבע בהסכם המכר ליום 30.11.21. בעקבות עיכובים שונים בנסיבות התלויות אך ורק בקבלן, הדירה נמסרה ליעל, בסופו של דבר, רק ביום 6.2.22. בחוזה המכר אין התייחסות למקרה של איחור במסירה.\nיעל דרשה מהקבלן פיצוי בגין איחור במסירת הדירה. הקבלן סירב לפצותה, בטענה שהחוזה ביניהם מתייחס רק לתאריך המסירה של הנכס, אך לא לפיצוי בגין עיכובים במסירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יעל לא זכאית לפיצוי בגין איחור במסירה, מכיוון שמדובר באיחור בנסיבות התלויות בקבלן.","יעל לא זכאית לפיצוי, וזאת משום שהחוזה בין הצדדים אינו עוסק כלל בסוגיית האיחור במסירת הנכס.","יעל זכאית לפיצוי - הפיצוי ישולם החל מהיום ה- 61 קדימה בלבד.","יעל זכאית לפיצוי - הפיצוי ישולם רטרואקטיבית בגין מלוא תקופת האיחור."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2022-07#6","e":34,"n":6,"s":"איתן הוא מתווך נדל\"ן. בעלי דירת מגורים חתמו עם איתן על הזמנת תיווך ועל הסכם בלעדיות למשך חצי שנה, למכירת דירת מגורים. מיד עם החתימה על הזמנת התיווך והסכם הבלעדיות, איתן פרסם את הדירה באתרי אינטרנט שונים, והציג את הנכס לחמישה מתווכים שונים. חודשיים וחצי לאחר מכן, צלצלו זוג רוכשים פוטנציאליים בפעמון דלת הדירה, וביקשו לראות את הדירה. בעלי הבית הציגו בפניהם את הדירה ובסופו של דבר, אותם קונים רכשו את הדירה.\nבהתאם לפסק הדין בעניין ת\"א 2461/07 דרור בראון ואח' נ' יפה סידרון ואח', ובנסיבות העניין, האם בעלי הבית מחויבים לשלם דמי תיווך לאיתן?","o":["כן. בהתאם להנחיות שנקבעו בפסק הדין איתן היה יעיל בעבודתו. כמו כן, לפי פסק הדין, תקופת הבלעדיות לעניין דירה תמיד תעמוד על שלושה חודשים מיום ההזמנה, ותקופת הבלעדיות טרם נסתיימה. לפיכך איתן זכאי לדמי תיווך.","כן. לפי פסק הדין, כאשר קיימת הזמנת תיווך המלווה בהסכם בלעדיות, חזקה שהמתווך ייחשב כ'גורם היעיל'. אך זאת במידה שהמתווך ביצע לפחות שתי פעולות שיווק בשליש הראשון לתקופת הבלעדיות.","לא. לפי פסק הדין, לא ניתן לערוך את הסכם הבלעדיות במסמך נפרד.","לא. משום שלפי פסק הדין אולי איתן עמד בתנאי חוק המתווכים, אך הוא לא היה זה שמצא את הרוכשים וקשר עימם את העיסקה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2022-07#7","e":34,"n":7,"s":"ליאור והילה הם זוג נשוי, אשר מתגורר יחדיו בדירת מגורים שבבעלותם. לימים החליטו בני הזוג לרכוש דירת מגורים נוספת, על שם בנם המשותף הקטין, איתמר, ועבורו. זאת כמתנה לרגל יום הולדתו ה- 15 של הבן. מדובר בדירה חדשה בשווי 450,000 ש\"ח בעיר חדשה הנבנית בנגב.\nבנסיבות העניין, האם דירתו של הבן איתמר יכולה להיחשב כדירה 'יחידה' של איתמר לצורך חישוב מס רכישה?","o":["לא. מאחר ששווי הדירה נמוך מ- 1.6 מיליון ש\"ח.","כן. מכיוון שמדובר בדירה היחידה של איתמר.","לא. קטינים נחשבים לצורכי מיסוי מקרקעין כחלק מהתא המשפחתי של הוריהם. הדירה נחשבת במקרה זה לצורכי מס רכישה כ'דירה שנייה' של ההורים.","כן. קיים בישראל פטור ממס רכישה ברכישת דירה יחידה בכל סכום שהוא."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2022-07#8","e":34,"n":8,"s":"שלמה רכש דירה מאבנר. בהסכם הרכישה נקבע ששלמה הרוכש ישלם את מס השבח וגם את מס הרכישה בגין העיסקה. מנהל מיסוי מקרקעין הוציא שומה שלפיה שווי העסקה ייקבע לפי \"גילום מלא\".\nבמקרה המתואר, מהו \"גילום מלא\"?","o":["\"גילום מלא\" הוא קביעה של מחיר עיסקה לצורכי מס, לפי השווי הריאלי של הנכס שהיה מקבל המוכר - אילו המוכר היה משלם את המיסים על העיסקה, ולא הקונה.","\"גילום מלא\" הוא מצב שבו הקונה לוקח על עצמו את תשלום כל מיסי המקרקעין, ומקבל חשבון לתשלום של מס הרכישה ומס השבח לפי המחיר שנקבע לעיסקה על ידי הצדדים.","\"גילום מלא\" הוא מס הרכישה החל על הקונה, בניכוי הוצאות, כגון דמי תיווך וכד'.","\"גילום מלא\" הוא מס השבח החל על המוכר, בניכוי הוצאות, כגון דמי תיווך וכד'."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2022-07#9","e":34,"n":9,"s":"רונית ועמית החליטו \"לשפר דיור\". כלומר, למכור את דירתם הנוכחית ולעבור לדירה גדולה יותר. לצורך כך הם שכרו את שירותיה של ציפי המתווכת, והתקשרו מול ציפי במסמך הזמנת שירותי תיווך. לאחר שפנתה לשישה מתווכים בעניינם של בני הזוג, ופירסמה את המידע באתר האינטרנט שלה, ציפי מצאה עבור בני הזוג, כעבור 8 חודשים, דירה המתאימה לצורכיהם של בני הזוג. לאחר החלפת טיוטות בין עורכי הדין נחתמה בשעה טובה ומוצלחת העיסקה. אולם עיסקת הרכישה הופרה באופן בוטה על ידי המוכר, כשהסתבר שהנ\"ל פושט רגל והחוזה בוטל כדין.\nבנסיבות העניין, האם ציפי זכאית לדמי תיווך?","o":["ציפי לא זכאית לדמי תיווך מהרוכשים, מכיוון שהעיסקה הופרה על ידי המוכר.","ציפי זכאית לדמי תיווך, מכיוון שנחתמה הזמנת תיווך, ציפי הייתה הגורם היעיל בעיסקה והחוזה נחתם.","ציפי לא זכאית לדמי תיווך, מכיוון שחלפו יותר משישה חודשים מרגע חתימת הזמנת התיווך.","ציפי זכאית לדמי תיווך בשיעור מופחת של אחוז אחד בלבד, כי החוזה בוטל."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2022-07#10","e":34,"n":10,"s":"לפי פסק דין בעניין ת\"פ 1081/06 מדינת ישראל נגד אופז, האם מתווך שהתבקש על ידי לקוח לרשום זיכרון דברים לעיסקה רשאי לעשות כן?","o":["כן; זה חלק מדרישות החוק לפרטי הזמנה בכתב.","כן; מתווך אמור לערוך זיכרון דברים.","לא; אבל מותר למתווך לכתוב זיכרון דברים עבור הלקוח.","לא; למתווך אסור לערוך זיכרון דברים, אפילו לבקשת הלקוח."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2022-07#11","e":34,"n":11,"s":"יניר הוא מתווך מוסמך. בין יניר לבין עדי נחתמה הזמנת תיווך, שבה סוכם שיניר יקבל עמלה של 5% בגין תיווך.\nהאם ניתן לגבות 5% עמלה בגין תיווך, והאם עמלת התיווך מוכרת בניכוי כהוצאה לצורך חישוב מס שבח מקרקעין?","o":["אסור לגבות יותר מ- 2% כעמלת תיווך בישראל. הוצאות תיווך בכל סכום מהוות תמיד הוצאה מוכרת לצורך חישוב מס שבח.","מותר לגבות יותר מ- 2% כעמלת תיווך בישראל, אולם רק 2% מתוך העמלה יהיו מוכרים בניכוי כהוצאה לצורכי חישוב מיסוי מקרקעין, בהיעדר אישור מיוחד ממנהל רשות המיסים.","אסור לגבות יותר מ- 2% כעמלת תיווך בישראל. הוצאות תיווך אינן מוכרות בניכוי לצורך חישוב מס שבח מקרקעין.","מותר לגבות יותר מ- 2% עמלת תיווך בישראל. הוצאות תיווך אינן מוכרות בניכוי לצורך חישוב מס שבח מקרקעין."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2022-07#12","e":34,"n":12,"s":"במקרה של פטירה של אדם, האם מוסמך מנהל עיזבון להעביר זכויות במקרקעין במשק חקלאי, ללא צורך בקבלת אישור מבית המשפט?","o":["כן; זהו תפקידו של מנהל עיזבון.","לא; אלא אם ניתן אישור מבית המשפט לכך.","כן; אבל רק אם אין חובות על הנכס ומדובר בדירת מגורים של המשפחה.","לא; אלא אם ניתן לחלק את הנכס בעין."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-07#13","e":34,"n":13,"s":"שלושה יורשים מעוניינים לכרות ביניהם הסכם, שיעביר לידיהם חלקים מדירות שירשו מהוריהם ללא תשלום.\nהאם היורשים זכאים לפטור ממס שבח בגין ההעברות שתבוצענה בדירות במסגרת ההסכם הנ\"ל?","o":["כן; מדובר בהסכם חלוקה בין יורשים ללא תמורה.","כן; הפטור יינתן לפי חוזה שיפרט את הכספים המשולמים בנפרד.","לא; מכיוון שלמורישים הייתה יותר מדירה אחת.","לא; העברת זכויות ממוסה תמיד."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2022-07#14","e":34,"n":14,"s":"מוטי מחזיק בבית פרטי במודיעין, הרשום על שמו בבעלות מלאה. הבית מחולק ל- 2 מפלסים - זה מעל זה. מוטי מבקש למכור רק את הבעלות שלו על המפלס התחתון בבית ולהמשיך לגור במפלס העליון, שישאר בבעלותו.\nבנסיבות העניין, האם הדבר אפשרי? נא סמנו את התשובה הנכונה ביותר.","o":["לא; לא ניתן לבצע עיסקה בחלק ממקרקעין בלבד.","לא; כי יש איסור על מכירת מפלס תחתון בישראל.","הדבר אפשרי, כל עוד החוזה מתייחס בצורה ברורה למפלס הנמכר.","הדבר אפשרי, בכפוף לאישור רמ\"י (רשות מקרקעי ישראל)."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2022-07#15","e":34,"n":15,"s":"אחרי חיפושים רבים, מצא דוד את דירת חלומותיו. במהלך הפגישה עם המוכר, שלומי, לאחר שלחצו ידיים והרימו כוסית, הם ערכו ביחד מסמך, בו כתבו את המשפט הבא: \"זיכרון דברים. דוד קונה משלומי את הדירה בפתח תקוה. המחיר ותנאי התשלום יסוכמו בתוך שבוע\". מלבד הכותרת והמשפט הזה לא הופיע במסמך כל משפט נוסף. כעבור יומיים החליט דוד לבטל את רכישת הדירה.\nהאם המסמך נחשב הסכם מחייב שניתן לבקש את אכיפתו בבית המשפט?","o":["המסמך נחשב כהסכם מחייב, כי היתה בין הצדדים גמירות דעת.","המסמך לא נחשב כהסכם מחייב, שכן אינו מכיל את הפרטים המהותיים של העיסקה.","המסמך מחייב באופן חלקי, ולכן דוד יצטרך לשלם לשלומי רק מחצית משווי הדירה.","המסמך נחשב כהסכם מחייב, כי הוא מכיל את כל הפרטים המהותיים לעיסקה."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2022-07#16","e":34,"n":16,"s":"ערן וצילה הם בעלי 2 דירות בקוטג' דו משפחתי. 2 הדירות (קוטג'ים) רשומות על שם שניהם.\nבנסח המקרקעין, כל אחד מהקוטג'ים מופיע כדירה נפרדת בבית משותף.\nהאם ניתן למכור לצד ג' רק אחד מהקוטג'ים?","o":["כן; מכיוון שכל דירה מוגדרת כדירה נפרדת.","כן; רק מכיוון שהנכס רשום על שם שני בני הזוג.","לא; מכיוון שהנכס רשום על שם שני בני הזוג.","לא; מכיוון שלא ניתן למכור חלק ממקרקעין."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2022-07#17","e":34,"n":17,"s":"מקרקעין א', המצויים בבעלות בנימין, משועבדים בזיקת הנאה רשומה כדין למקרקעין ב', המצויים בבעלות שרה. בנימין רכש מידי שרה את מקרקעין ב'.\nבנסיבות העניין, האם זיקת ההנאה של שרה מתבטלת מרגע הרכישה של בנימין?","o":["לא, זיקת ההנאה לא מתבטלת עם המכירה לבנימין.","כן, זיקת ההנאה מתבטלת מכיוון ששרה היא המוכרת.","כן, זיקת הנאה מתבטלת מרגע שבנימין הפך לבעלים של 2 החלקות.","לא; לא ניתן לבטל זיקת הנאה הרשומה בטאבו."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-07#18","e":34,"n":18,"s":"יניב הוא בעלים של דירת מגורים בת 4 חדרים בעפולה. רויטל מעוניינת לרכוש את הדירה של יניב. שני הצדדים סיכמו ביניהם בעל פה את העיסקה.\nהאם ניתן לרשום את העיסקה בטאבו?","o":["לא; רשם המקרקעין לא ירשום את העיסקה במקרקעין, כי הצדדים צריכים להתייצב בפני פקיד הטאבו כדי לכרות חוזה מקרקעין.","לא; רשם המקרקעין לא ירשום את העיסקה, מכיוון שעיסקת מקרקעין דורשת מסמך בכתב.","כן; רשם המקרקעין ירשום את העיסקה, כי גם חוזה בעל פה הוא חוזה לכל דבר.","כן; רשם המקרקעין ירשום את העיסקה בעל פה רק אם יתקבל אישור שר הבינוי והשיכון."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2022-07#19","e":34,"n":19,"s":"משה הוא קבלן בניין מורשה, המבצע פרויקט מגורים של התחדשות עירונית. הפרויקט מבוצע באיזור שבו צפיפות הבנייה מוגדרת כצפיפות של שבע יחידות דיור לדונם לפחות.\nהאם משה מחויב להקצות במסגרת פרויקט ההתחדשות העירונית דירות קטנות (כפי שהגדיר שר הפנים) במקרה שכזה?","o":["כן; יש חובה להקצות דירות קטנות בפרויקטים של התחדשות עירונית בהיקף של 20% לפחות.","כן; יש חובה להקצות דירות קטנות בפרויקטים של התחדשות עירונית בהיקף של 20% לפחות, אבל רק אם הפרויקט כולל 100 יחידות דיור ומעלה.","לא; אין חובה להקצות דירות קטנות בישראל.","לא; בהתחדשות עירונית אין מגבלות או הוראות על תמהיל הדירות הנבחר."],"c":[0],"a":false,"note":"","sub":"h_works"},{"id":"2022-07#20","e":34,"n":20,"s":"אביב חתם על הסכם לרכישת דירה חדשה מקבלן. בהסכם נכתב שהרוכש מסכים לשלם 30% מהתמורה. זאת ללא שהובטחו כספיו, בתמורה להנחה של 50,000 ש\"ח ממחיר הדירה.\nהאם הקבלן יכול להימנע מהבטחת כספי הקונה בתמורה להנחה במחיר הדירה?","o":["כן; אם החוזה נחתם בנוכחות עו\"ד או בהסכמת הבנק המלווה את הפרויקט.","לא; אין כל תוקף להסכמה לוותר על הבטחת כספי הקונה אם שולמו יותר מ- 7% מהמחיר, גם אם הצדדים הסכימו על כך בהסכם המכר.","כן; אין מניעה להסכים לוותר על הבטחת כספי הקונה מרגע ששולמו יותר מ- 7% ממחיר הנכס.","לא; לא ניתן לכרות חוזה שכזה, ללא הסכמה מראש של הממונה על חוק המכר."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2022-07#21","e":34,"n":21,"s":"רונית הציעה לרון לרכוש את דירתה, השוכנת על חוף הים. בהצעתה ציינה רונית את המחיר אותו היא מבקשת עבור הנכס, וכתבה כי היא מתכוונת לפנות את הנכס רק בעוד שנה. רון שלח לרונית הודעת מייל ובה כתב: \"רונית יקירה, אני קונה את הדירה, בתנאי שתשאירי לי בה את פסנתר הכנף הלבן, שלא נכלל בהצעת המכירה. יש לך יומיים לענות לי\".\nרונית דחתה את ההצעה, ומכרה את הדירה לרינת.\nהאם רונית הפרה חוזה מול רון?","o":["לא; רון הציע הצעה חדשה ולכן רונית אינה מחויבת לקבלה.","לא; כי רון לא רשם הערת אזהרה בטאבו.","כן; רונית כרתה חוזה בכתב מול רון ברגע שרון הסכים לתנאים שלה.","כן; לא ניתן להפריד מטלטלין מהדירה הנמכרת."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2022-07#22","e":34,"n":22,"s":"מה מבין הבאים נחשב להפעלת השפעה בלתי הוגנת על פי חוק?","o":["שידול צרכן לחתום על חוזה לא כלכלי.","התקשרות עם צרכן בעיסקה אשר תנאיה גרועים מתנאי השוק.","שיכנוע צרכן לרכוש נכס או שירות שאין לו בהכרח צורך בו.","ביצוע פניות חוזרות ונשנות לצרכן כדי לקשור עימו עיסקה, למרות שהצרכן ביקש במפורש שיחדלו מהפניות אליו בנושא."],"c":[3],"a":false,"note":"","sub":"k_consumer"},{"id":"2022-07#23","e":34,"n":23,"s":"זהבה, דיירת בדמי מפתח של חנות בגדים ותיקה ברחוב אלנבי בתל-אביב, נפטרה בשיבה טובה. ילדיה מבקשים להיות דיירים מוגנים במקומה ולהמשיך ולנהל את העסק בדמי מפתח.\nהאם ילדיה יכולים להיות דיירים מוגנים במקומה?","o":["החוק מאפשר לילדים להיות דייר מוגן של בית העסק במקום הנפטרת, בתנאי שעבדו שישה חודשים בעסק לפני פטירתה.","החוק לא מאפשר להיות דייר מוגן של בית העסק, מאחר שמדובר בחנות שהיא בית עסק ולא בדירה למגורים.","החוק מאפשר להיות דייר מוגן של בית העסק, בין אם בכוונתם להמשיך לנהל את החנות בעצמם או על ידי אחרים ובין אם בכוונתם להשכירה לאחרים לכל מטרה אחרת.","החוק לא מאפשר להם להיות דייר מוגן של בית העסק, מאחר שהנכס חוזר לבעלים תמיד עם פטירת הדייר המוגן."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2022-07#24","e":34,"n":24,"s":"בבית מגורים ברמת גן, הסכימו כל הדיירים על הריסת בניין קיים והקמתו מחדש לצורך חיזוקו מפני רעידות אדמה, זאת בהתאם לתוכנית שתוסיף דירה אחת חדשה לבניין.\nלמי תהיה שייכת הדירה החדשה?","o":["הדירה החדשה תחולק בין הדיירים לפי החלק של כל אחד מהם ברכוש המשותף הצמוד לכל דירה, כפי שהיה טרם ביצוע העבודה.","הדירה החדשה שייכת לקבלן המבצע, אלא אם הוסכם אחרת.","הדירה החדשה שייכת לרשות המקומית, במקום היטל השבחה.","הדירה החדשה תחולק בין הדיירים על פי שטח הדירות הישנות שבבעלותם."],"c":[0],"a":false,"note":"","sub":"h_works"},{"id":"2022-07#25","e":34,"n":25,"s":"לפי פסק דין בתל אביב 44919/07 בכר עופר נ' מעוז טל ואח', האם ניתן להאריך את תקופת הבלעדיות בנכס מגורים ליותר מחצי שנה?","o":["לא; הזמנת תיווך יש לערוך בכתב.","לא; לפי חוק, תקופת הבלעדיות בדירת מגורים לא תעלה על חצי שנה.","כן; אין כל מגבלה להארכת תקופת הבלעדיות.","כן; בתנאי שבהזמנת שירותי התיווך נחתמה תוספת להארכת תקופת הבלעדיות לתקופה של לא יותר מ- 6 חודשים נוספים."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2022-10#1","e":35,"n":1,"s":"אוהד ירש את דירת סבתו. הדירה במצב פיזי המחייב תיקונים ושיפוץ, כגון: החלפת צנרת החשמל, צנרת המים וצנרת הביוב. אוהד החליט לשפץ את הדירה, כמו שהיא, ולא להרוס אותה, וזאת ללא שינוי בשטח הדירה. במהלך השיפוץ אוהד החליט להרוס ולבנות מחדש את אחד הקירות החיצוניים שנסדק, תוך שינוי מראה הדירה.\nבנסיבות העניין, האם אוהד חייב בהיתר בנייה לפעולות שהוא מבצע בדירה?","o":["אוהד חייב בהיתר בנייה מהוועדה המקומית לתכנון ובנייה לתיקון ושיפוץ הדירה, מאחר שהוא מחליף את צנרת המים והביוב.","אוהד חייב בהיתר בנייה מהוועדה המקומית לתכנון ובנייה לתיקון ושיפוץ הדירה, מאחר שהוא הורס קיר חיצוני של הדירה.","אוהד אינו חייב בהיתר בנייה מהוועדה המקומית לתכנון ובנייה לתיקון ושיפוץ הדירה, מאחר שהוא אינו משנה את שטח הדירה.","אוהד אינו חייב בהיתר בנייה מהוועדה המקומית לתכנון ובנייה, מאחר שמדובר בשינויים פנימיים בנכס."],"c":[1],"a":false,"note":"","sub":"p_permit"},{"id":"2022-10#2","e":35,"n":2,"s":"חביב הוא בעלים של מגרש פרטי. לחביב נודע כי לפני שבוע נועם פלש למגרש של חביב והקים בו אוהל. חביב ניסה לשכנע את נועם לצאת מהמגרש שלו, אך לא הצליח בכך.\nבנסיבות העניין, האם חביב יכול היום להפעיל כוח כדי לסלקו?","o":["חביב רשאי להפעיל כוח סביר על מנת לפנות את נועם מהמגרש.","חביב לא רשאי להפעיל כוח בשום צורה, אך רשאי להזמין משטרה שתפנה את נועם.","חביב חייב להגיש תביעה לבית משפט השלום כנגד נועם, על מנת לקבל צו מתאים.","חביב רשאי לעשות כל דבר במטרה לסלק את נועם מהמגרש."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-10#3","e":35,"n":3,"s":"\"אמירים\" בע\"מ היא חברה קבלנית שהקימה בניין מגורים משותף ברמת גן.\nבחוזה המכר של הדירות נקבע שהתחזוקה והניהול יתבצעו במשך 5 שנים על ידי אותה חברת הבנייה – \"אמירים\" בע\"מ. נקבע שבתקופה זו לא תוחלף חברת התחזוקה והניהול.\nבחלוף 3 וחצי שנים, הדיירים לא מרוצים מרמת התחזוקה ומבקשים להחליף את החברה המתחזקת.\nהאם הדיירים רשאים לעשות כן?","o":["כן; לא ניתן למנוע בחוזה את החלפת החברה המתחזקת בבניין חדש לאחר חלוף 3 שנים.","כן; הדיירים יכולים לבחור חברה כרצונם, החל מהרגע שהם קיבלו את הדירות.","לא; הדיירים כפופים לחוזה ויש להמתין לסיומו.","לא; אלא אם הדיירים יפצו תחילה את החברה המתחזקת."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2022-10#4","e":35,"n":4,"s":"ניתאי הוא בעלים של דירה בבית משותף. חלק מהדיירים מבקשים לצרף לדירותיהם מרפסות שייבנו מתוך השטח המשותף של הבניין. ניתאי מתנגד, אך 55% מהדיירים, ש- 2/3 מהרכוש המשותף צמוד לדירותיהם, הצביעו בעד המהלך.\nבנסיבות העניין, האם ניתן לבצע את בניית המרפסות עבור דירות מסוימות מתוך הרכוש המשותף, חרף התנגדותו של ניתאי?","o":["באין הסכמה של כל בעלי הדירות בבניין, לא ניתן לבצע שינויים ברכוש המשותף ובזכויות הבנייה.","ניתן לבצע את הבנייה ברכוש המשותף מכיוון שרוב של 55% מהדיירים ש- 2/3 מהרכוש המשותף צמוד לדירותיהם מספיק לשם כך.","לא ניתן לבצע את הבנייה ברכוש המשותף, משום שדרוש רוב של 3/4 מבעלי הדירות שלדירותיהם צמודים לפחות 2/3 מהרכוש המשותף.","ניתן לבצע את הבניה ברוב של 60% מבעלי הדירות בבניין ש- 2/3 מהרכוש המשותף צמוד לדירותיהם, ובלבד שניתנה לכל בעלי הדירות הודעה מתאימה מראש על מועד קיום האסיפה."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2022-10#5","e":35,"n":5,"s":"לפני שנתיים הציעה אילנית לחברתה רונית לקנות מגרש בשותפות, כך שבבעלות כל אחת מהן יהיה חצי מגרש. רונית קיבלה את ההצעה והמגרש נרשם על שם שתיהן בטאבו. אילנית ורונית חתמו על הסכם שיתוף, אך ההסכם לא נרשם בטאבו.\nבנסיבות העניין, האם הסכם השיתוף תקף כלפי צדדים שלישיים?","o":["הסכם השיתוף הוא חוזה תקף ולכן הוא תקף גם כלפי צדדים שלישיים.","ההסכם בין הצדדים תקף, אך הוא לא תקף כלפי צדדים שלישיים.","הסכם השיתוף הוא לא חוזה תקף, אלא רק הצהרת כוונות, ולכן הוא לא תקף כלפי צדדים שלישיים.","הסכם השיתוף לא מחייב את רונית ואילנית, אך הוא תקף כלפי צדדים שלישיים בלבד."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2022-10#6","e":35,"n":6,"s":"היכן יירשם משכון על נכס מקרקעין שאינו רשום בטאבו?","o":["רשם המשכונות.","לא ניתן לרשום משכון על נכס מקרקעין שאינו רשום בטאבו.","ייערך רישום משכנתא בהוצאה לפועל.","ייערך רישום משכנתא אצל הממונה על המשכנתאות בבנק ישראל."],"c":[0],"a":false,"note":"","sub":"l_mortgage"},{"id":"2022-10#7","e":35,"n":7,"s":"כאשר רוכשים קרקע לבניית דירת מגורים במסגרת קבוצת רכישה, כיצד יחושב מס הרכישה?","o":["מאחר שמדובר בקבוצת רכישה, אין צורך לשלם מס רכישה כלל.","מס הרכישה יחושב רק בגין מחיר הקרקע שנרכשה.","מס הרכישה יחושב לפי שווי דירת המגורים הבנויה, בהפחתת מחיר הקרקע שנרכשה.","מס הרכישה יחושב לפי שווי המכירה כנכס בנוי שהוא דירת מגורים."],"c":[3],"a":false,"note":"","sub":"x_purchase"},{"id":"2022-10#8","e":35,"n":8,"s":"מר ישראלי מכר את דירתו למר לונדון. לאחר חתימת החוזה פירק מר ישראלי את אחת מדלתות המטבח ואת כל המנגנון שלה, שהיה מוברג ומותקן לתוך הקיר. בחוזה המכר אין כל התייחסות לנושא המטבח.\nבנסיבות העניין, האם מר ישראלי פירק חלק מהממכר בעיסקת המקרקעין?","o":["לא; מכיוון שהדלתות מוחלפות במסגרת שיפוץ.","לא; החוזה צריך לאפשר במפורש לקונה לשמור את הדלת ואת המנגנון שלה.","כן; מדובר במחובר קבוע ולכן הוא נחשב חלק ממקרקעין.","כן; כל פריט צריך להיות מושאר בדירה במצב כזה."],"c":[2],"a":false,"note":"","sub":"s_sale"},{"id":"2022-10#9","e":35,"n":9,"s":"יגאל ואיריס כרתו ביניהם חוזה מכר של דירה. יגאל הוא המוכר ואיריס היא הרוכשת. יגאל הפר את אחד מסעיפי החוזה, הפרה לא יסודית.\nבנסיבות העניין, האם איריס זכאית לבטל את החוזה? אם כן, מה התנאי לכך?","o":["איריס זכאית לבטל את החוזה באופן מיידי וללא כל תנאי.","איריס לא זכאית לבטל את החוזה במקרה של הפרה לא יסודית.","איריס זכאית לבטל את החוזה רק לאחר שנתנה ליגאל אורכה לקיום החוזה והחוזה לא קוים בתוך זמן סביר לאחר מתן האורכה.","איריס לא זכאית לביטול החוזה - חוזים יש לקיים."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2022-10#10","e":35,"n":10,"s":"אסף מחזיק בבעלותו דירת גג בתל אביב. לאסף יש אח תאום בשם תמיר. תמיר הצליח להשיג את תעודת הזהות של אסף, פירסם למכירה את הדירה, ומכר אותה תוך שהוא מתחזה לאסף, הבעלים האמיתי של הנכס.\nבנסיבות העניין, מה העונש הכתוב בחוק בגין העבירה שביצע תמיר?","o":["עבודות שירות למשך 24 חודשים.","מאסר על תנאי למשך 12 חודשים.","מאסר 3 שנים.","מאסר בית למשך 6 חודשים."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2022-10#11","e":35,"n":11,"s":"לפי פסק הדין בעניין ע\"א 158/77 רבינאי נגד חב' \"מן השקד\" בע\"מ, האם זיכרון דברים יכול להוות הסכם מחייב בין צדדים?","o":["לא; זיכרון דברים הוא רק חלק במשא ומתן עד לכריתת הסכם מחייב בין הצדדים.","כן; זיכרון דברים יכול להיות הסכם מחייב בין הצדדים.","כן, ובלבד שעורך דין אימת את חתימות הצדדים.","כן; אלא אם אחד המתווכים בעיסקה כתב את זיכרון הדברים."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2022-10#12","e":35,"n":12,"s":"האם בית משפט רשאי לבטל רישיון של מתווך במקרקעין שהורשע בעבירות לפי חוק המתווכים או לפי חוק הגנת הצרכן, כחלק מהעונשים בגזר הדין?","o":["כן; בית המשפט רשאי לעשות זאת, בנוסף לכל עונש אחר.","לא; חוק הגנת הצרכן לא מחייב את המתווכים, אלא רק חוק המתווכים.","כן, בתנאי שבית המשפט הוא בית משפט מחוזי.","לא; רק ועדת המשמעת במשרד המשפטים רשאית לבטל רישיון של מתווך מקרקעין."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2022-10#13","e":35,"n":13,"s":"עמרם הוא עוסק מורשה המפעיל חניון לכלי רכב בתל אביב. לאחר שנתיים בהן הפעיל את העסק שלו, מעוניין עמרם למכור את הקרקע שבה הופעל החניון לחברת נדל\"ן.\nבנסיבות העניין, האם עמרם יחויב על העיסקה במע\"מ (מס ערך מוסף)?","o":["לא, אך בתנאי שהמקרקעין מהווים מלאי.","כן, בתנאי שהמקרקעין מהווים רכוש קבוע.","לא, משום שעיסוקו של עמרם הוא לא במכירת מקרקעין.","כן, כי זוהי עסקה שנעשתה במהלך עסקיו."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2022-10#14","e":35,"n":14,"s":"נהוראי רכש דירה מקבלן. בהסכם המכר בין הצדדים נכתב כי שטח המחסן הינו 10 מ\"ר. לאחר קבלת הדירה מדד נהוראי את המחסן והופתע לגלות שהשטח הינו 9 מ\"ר בלבד.\nבנסיבות העניין, האם נהוראי זכאי לקבל פיצוי מהקבלן?","o":["לא; מדובר בסטייה מותרת.","כן; מדובר בסטייה שאינה סטייה קבילה (יותר מ- 2%).","כן; כל סטייה מהשטח הכתוב בהסכם המכר מהווה הפרה של ההסכם.","לא; שטח מחסן נתון לשינויים עקב אילוצים תכנוניים ולכן אינו סופי."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2022-10#15","e":35,"n":15,"s":"דנה וליאור פנו למתווך חגי כדי שיסייע במציאת רוכש לביתם.\nהמתווך החתים את בני הזוג על הזמנת שירותי תיווך והסכם בלעדיות למשך שישה חודשים, אך לא ביצע כל פעולה לשיווק הנכס. לאחר ארבעה חודשים מכרו בני הזוג את ביתם, ללא התערבותו של חגי.\nבנסיבות העניין, האם חגי המתווך זכאי לדמי תיווך מכוח הבלעדיות?","o":["כן; למתווך יש בלעדיות על מכירת הנכס למשך 6 חודשים ולכן אם הדירה נמכרת בתקופת הבלעדיות, המתווך זכאי לדמי תיווך.","לא; המתווך לא ביצע פעולות שיווק, ולכן תקופת הבלעדיות הסתיימה לאחר 1/3 מהתקופה המנויה בהזמנת שירותי התיווך, כלומר לאחר חודשיים.","כן; המתווך זכאי למחצית מדמי התיווך, מאחר שיש לו בלעדיות, אך הוא לא ביצע פעולות שיווק.","לא; תקופת הבלעדיות לעניין דירה היא שלושה חודשים לכל היותר, אפילו אם הצדדים כתבו בהזמנת שירותי תיווך תקופה העולה על 3 חודשים."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2022-10#16","e":35,"n":16,"s":"דניאל התקשר בהזמנת שירותי תיווך לרכישת בית קרקע בסיוע מתווך. המתווך מצא בית שדניאל מעוניין לקנות. בעצתו של המתווך חתם דניאל על הסכם זיכרון דברים אשר ניסח המתווך, לפיו דניאל מתחייב לרכוש את הבית.\nבנסיבות העניין, האם המתווך זכאי לדמי תיווך?","o":["כן; המתווך היה הגורם היעיל בעסקה.","כן, ובלבד שהמתווך קיבל את הסכמת המוכר.","לא; מאחר שהמתווך ערך מסמך בעל אופי משפטי הנוגע לעיסקה במקרקעין, נשללת ממנו זכאותו לפי חוק לדמי תיווך.","לא; מאחר שהמתווך היה צריך לקבל את הסכמת הלקוח במסמך נפרד."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2022-10#17","e":35,"n":17,"s":"שירה ושני חתמו על הסכם לשכירת דירה למשך 3 שנים.\nבנסיבות העניין, האם הצדדים חייבים לרשום את השכירות בלשכת רישום המקרקעין (טאבו)?","o":["כן; משום ששכירות לתקופה של שלוש שנים ויותר טעונה רישום.","כן; משום שכל שכירות במקרקעין טעונה רישום.","לא; משום שלא ניתן לרשום שכירות לתקופה של 3 שנים בלבד.","לא; משום ששכירות של עד 5 שנים אינה טעונה רישום."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2022-10#18","e":35,"n":18,"s":"שלומית מכרה דירה לאמנון בשנת 2019. העיסקה הושלמה בתמורה לתשלום כספי, אך לא נרשמה בלשכת רישום המקרקעין, ולא נרשמה הערת אזהרה בגין העיסקה.\nבשנת 2020 שלומית מכרה את אותה הדירה לתמר, אשר לא ידעה על קיומה של העיסקה עם אמנון ורכשה את הדירה בתום לב. תמר רשמה הערת אזהרה לטובתה מיד לאחר החתימה על הסכם המכר ותשלום כספי. לאחר שנרשמה הערת האזהרה פנה אמנון אל תמר והודיע לה כי הוא רכש קודם לכן את הדירה.\nעל פי פסק דין ע\"א 2643/97 שלמה גנז נ' בריטיש וקולוניאל חברה בע\"מ ואח' ובנסיבות המתוארות, מי יזכה בנכס - אמנון או תמר?","o":["אמנון יזכה בנכס, מאחר שזכותו של בעל העיסקה הראשונה בזמן תמיד תהיה עדיפה, אך היא לא שוללת את זכותו של השני בזמן לקבל פיצוי.","לא ניתן לאכוף אף אחת משתי העיסקאות ולכן שתי העיסקאות יבוטלו.","הנכס יחולק בין 2 הרוכשים בחלקים שווים, בבעלות בלתי מסוימת.","תמר תזכה בנכס, משום שהשלימה רישום הערת אזהרה, ופעלה בתמורה ובתום לב."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2022-10#19","e":35,"n":19,"s":"דוד, איש עסקים מצרפת, חתם מול יונתן המתווך על הסכם הזמנת שירותי תיווך לרכישת בניין משרדים. דוד ניהל משא ומתן לרכישת בניין במחיר שהציע המתווך. המשא ומתן לא צלח. הקשר בין כל הצדדים ניתק.\nלאחר 14 חודשים החליט דוד לרכוש את הנכס בכל זאת, ללא סיוע מצידו של יונתן המתווך.\nלפי פסק הדין ע\"א 2144/91 הנרי מוסקוביץ נ' כץ אסתר ביר, ובנסיבות העניין, האם המתווך זכאי לדמי תיווך?","o":["לא; הזמנת שירותי תיווך אינה בתוקף לאחר 3 חודשים.","לא, הסכם בלעדיות אינו בתוקף לאחר 3 חודשים.","כן, אך רק בתנאי שקיים הסכם בלעדיות.","כן, ניתוק קשר לזמן סביר אינו שולל זכאות לדמי תיווך במחיר שהציע המתווך."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2022-10#20","e":35,"n":20,"s":"ליטל עברה את מבחני ההסמכה של רשם המתווכים וקיבלה רישיון לעסוק בתיווך. ליטל החליטה לפתוח משרד עצמאי בגודל של 55 מ\"ר ולהעסיק שני סוכנים.\nבנסיבות העניין, האם היא נדרשת לרישיון עבור העסק שלה?","o":["לא; הפעלת משרד תיווך לא מצריכה רישיון עסק.","כן; הפעלת משרד תיווך מצריכה קבלה של רישיון עסק ויש לפנות לעירייה ולהסדיר את הנושא.","כן; הפעלת משרד תיווך מצריכה קבלה של רישיון עסק ויש לפנות לרשם המתווכים ולהסדיר את הנושא.","לא; אך הדבר תלוי בגודל המשרד. אם המשרד גדול יותר מ- 50 מ\"ר, יש להוציא רישיון עסק."],"c":[0],"a":false,"note":"","sub":"k_misc"},{"id":"2022-10#21","e":35,"n":21,"s":"בחוזה למכר דירה בין מלכה (המוכרת) לבין ליאון (הרוכש) נקבע פיצוי מוסכם בגין כל חודש איחור במסירת הדירה, על סך 5,000 ש\"ח. מלכה איחרה במסירת הדירה לליאון בחצי שנה.\nבנסיבות העניין, האם ליאון יכול לתבוע את הפיצוי בגין הנזק שאירע לו בפועל, במקום הפיצוי המוסכם?","o":["כן; ליאון רשאי לוותר על הפיצוי המוסכם ולתבוע את הנזק שאירע לו בפועל.","לא; ליאון חייב לתבוע את הפיצוי המוסכם ואין לו אפשרות לתבוע פיצוי אחר.","כן; ליאון יוכל לתבוע את הפיצוי המוסכם וגם את הנזק שאירע לו בפועל ללא הגבלה.","לא; אלא אם כן נכתב במפורש בחוזה המכר שהוא רשאי לוותר על הפיצוי המוסכם ולתבוע במקומו את הנזק בפועל."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2022-10#22","e":35,"n":22,"s":"אריה הוא מתווך מורשה. אריה ניסח הסכם הזמנת שירותי תיווך ומציע ללקוחותיו לחתום על החוזה שניסח. ההסכם עונה להגדרת חוזה אחיד. בהסכם ישנו סעיף לפיו לא ניתן לתבוע את אריה בערכאות משפטיות, גם אם התרשל או הפר את חובותיו (להלן: \"הסעיף\").\nבנסיבות העניין, האם ניתן להגביל את זכות הלקוח לפנות לערכאות משפטיות בהסכם הזמנת שירותי התיווך?","o":["כן; בתנאי שהלקוח מסכים לכך בכתב.","כן; אם הסעיף כתוב באותיות מספיק גדולות ובצורה ברורה.","לא; הדבר מהווה תנאי בטל.","לא; הדבר מהווה תנאי מקפח."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2022-10#23","e":35,"n":23,"s":"איש העסקים חנן זהבי נפטר באופן פתאומי והותיר רכוש הכולל חמש דירות, מפעל, שלוש חנויות ושבעה מגרשים חקלאיים. אחד מילדיו הודיע שהוא מתכוון להשתלט על אחת מהדירות ולהתגורר בה.\nמינוי מנהל העיזבון מתעכב עקב סכסוך בין היורשים.\nהאם יכולים היורש
