<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>מוכנה למבחן התיווך</title>
<style>:root{
  --bg:#f5f6fb;--card:#ffffff;--ink:#1c2340;--muted:#667090;--line:#e4e7f2;
  --brand:#4338ca;--brand-soft:#eceafd;--brand-ink:#ffffff;
  --good:#15803d;--good-soft:#e3f6ea;--bad:#c62828;--bad-soft:#fde7e7;--warn:#b45309;--warn-soft:#fff3dc;
  --shadow:0 1px 2px rgba(20,25,60,.06),0 6px 18px rgba(20,25,60,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1120;--card:#171b30;--ink:#e9ecf8;--muted:#9aa3c4;--line:#292f4d;
    --brand:#8b83ff;--brand-soft:#232650;--brand-ink:#0e1120;
    --good:#4ade80;--good-soft:#123222;--bad:#ff8a8a;--bad-soft:#3a1a1f;--warn:#fbbf24;--warn-soft:#3a2d12;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
    --bg:#0e1120;--card:#171b30;--ink:#e9ecf8;--muted:#9aa3c4;--line:#292f4d;
    --brand:#8b83ff;--brand-soft:#232650;--brand-ink:#0e1120;
    --good:#4ade80;--good-soft:#123222;--bad:#ff8a8a;--bad-soft:#3a1a1f;--warn:#fbbf24;--warn-soft:#3a2d12;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Heebo","Assistant","Segoe UI",system-ui,-apple-system,"Arial Hebrew",Arial,sans-serif;line-height:1.55;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:780px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
p{margin:.35em 0}
.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.card.tight{padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--brand-soft);color:var(--brand);min-height:46px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.good{background:var(--good);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;min-height:36px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.good>i{background:var(--good)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.hero{background:linear-gradient(135deg,#4338ca,#6d5df5);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.8)}
.hero .btn.primary{background:#fff;color:#3730a3}
.big{font-size:2.3rem;font-weight:800;line-height:1}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:1.5rem}
/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav>div{display:flex;width:100%;max-width:780px;padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px)}
.nav button{flex:1;border:0;background:none;padding:9px 2px 8px;color:var(--muted);font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:1.35rem;line-height:1}
.nav button.on{color:var(--brand);font-weight:800}
/* question */
.stem p{margin:.55em 0;font-size:1.04rem}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}.opt.no .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.7}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.conf button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;font-weight:700;font-size:.92rem}
.conf button small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.conf button:hover{border-color:var(--brand)}
.banner{border-radius:14px;padding:12px 14px;font-weight:700}
.banner.ok{background:var(--good-soft);color:var(--good)}.banner.no{background:var(--bad-soft);color:var(--bad)}.banner.warn{background:var(--warn-soft);color:var(--warn)}
details.cardx{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--card);overflow:hidden}
details.cardx>summary{cursor:pointer;padding:12px 14px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.cardx>summary::-webkit-details-marker{display:none}
details.cardx .body{padding:0 14px 14px}
.cardx ul{margin:.3em 0;padding-inline-start:1.15em}.cardx li{margin:.4em 0}
.trap{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:8px}
.trap b{color:var(--warn)}
.tag{font-size:.8rem;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;padding:4px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
@media(max-width:520px){.qgrid{grid-template-columns:repeat(9,1fr);gap:4px}.qgrid button{font-size:.75rem;border-radius:8px}}
.qgrid button{aspect-ratio:1;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:700;font-size:.85rem;padding:0}
.qgrid button.ans{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.qgrid button.flag{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.qgrid button.cur{outline:3px solid var(--brand);outline-offset:1px}
.qgrid button.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qgrid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:0}
.trow .nm{flex:1;min-width:0}
.pct{font-variant-numeric:tabular-nums;font-weight:800;min-width:3ch;text-align:end}
select,input:not([type=checkbox]):not([type=file]):not([type=radio]),textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:780px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.toast{position:fixed;inset-inline:0;bottom:84px;display:flex;justify-content:center;z-index:60;pointer-events:none}
.toast div{background:#111;color:#fff;border-radius:99px;padding:10px 18px;font-size:.9rem}
.lock{opacity:.6}
a{color:var(--brand)}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app"></div>
<script>const DATA = {"topics":[{"id":"broker","label":"חוק המתווכים","n":281},{"id":"contract","label":"דיני חוזים","n":66},{"id":"sale","label":"חוק המכר ומכר דירות","n":84},{"id":"land","label":"חוק המקרקעין ורישום","n":242},{"id":"condo","label":"בתים משותפים","n":117},{"id":"rent","label":"שכירות והגנת הדייר","n":76},{"id":"planning","label":"תכנון ובנייה","n":106},{"id":"tax","label":"מיסוי מקרקעין","n":112},{"id":"ila","label":"מקרקעי ישראל","n":86},{"id":"consumer","label":"הגנת הצרכן ועוד","n":36}],"subs":[{"id":"b_fee","topic":"broker","label":"זכאות לדמי תיווך","n":82,"card":{"law":"חוק המתווכים במקרקעין, התשנ\"ו-1996","gist":"דמי תיווך מגיעים רק כשמתקיימים כל התנאים יחד: רישיון, הזמנה בכתב, 'גורם יעיל' ועסקה שנחתמה.","points":["ארבעה תנאים מצטברים: (1) רישיון תיווך בתוקף בזמן הפעולה, (2) הזמנת שירותי תיווך בכתב ובטופס כדין, (3) המתווך היה ה'גורם היעיל' – פעולתו היא שהובילה להתקשרות, (4) נחתמה עסקה מחייבת. חסר תנאי אחד – אין זכאות.","הסכמה בעל־פה על דמי תיווך אינה מספיקה – נדרשת הזמנה בכתב.","מתווך שלא שילם אגרה / רישיונו לא פעיל אינו זכאי, גם אם פעל במסירות וביעילות.","שיעור דמי התיווך נקבע בהסכמה (אין תקרה בחוק), אבל חייב להיות כתוב בהזמנה – כולל האם הסכום כולל מע\"מ.","'גורם יעיל' נבחן עובדתית: האם ההיכרות והפעולות של המתווך הן שגרמו בפועל לעסקה, או שהצדדים היו מגיעים אליה גם בלעדיו.","דמי תיווך משני הצדדים – ככלל רק אם כל צד הזמין את שירותי המתווך בכתב ויודע על כך."],"traps":["'סיכמנו בטלפון' / בלחיצת יד","מתווך שהרישיון שלו לא פעיל או שפג","מתווך שלא היה הגורם היעיל – רק 'הציג' נכס שהלקוח כבר מכיר","בלבול בין זכאות לדמי תיווך לבין חובות המתווך"]}},{"id":"b_order","topic":"broker","label":"הזמנה בכתב ובלעדיות","n":102,"card":{"law":"חוק המתווכים במקרקעין + תקנות (טופס הזמנת שירותי תיווך)","gist":"ההזמנה חייבת להיות בכתב ובטופס הקבוע; בלעדיות היא חריג שמוגבל בזמן ובתנאים.","points":["הזמנת שירותי תיווך – בכתב, חתומה בידי הלקוח, בטופס שנקבע בתקנות, עם הפרטים החובה: פרטי הנכס והעסקה, שיעור דמי התיווך, תקופת ההזמנה ותנאי הבלעדיות (אם יש).","בלעדיות: חייבת להיות מפורשת, בכתב ובתוך הטופס; בדירת מגורים היא מוגבלת בזמן (ככלל עד חצי שנה) – חריגים מצומצמים קיימים, למשל בשיווק פרויקטים של קבלנים.","אם בהסכם לא נקבעה תקופת בלעדיות במפורש – הבלעדיות מסתיימת, לפי מפתח התשובות הרשמי, אחרי 30 יום.","אסור להתנות מתן שירות אחד בקבלת שירות אחר (למשל: 'אתווך לך את המכירה רק אם תשכור אותי גם לרכישה').","יש למסור ללקוח עותק מההזמנה החתומה.","הסכם תיווך שלא עומד בדרישות הטופס – המתווך עלול לא להיות זכאי לדמי תיווך."],"traps":["הארכת בלעדיות מעבר למותר","בלעדיות שלא סומנה במפורש","'תנאי צמוד' – שירות מותנה בשירות אחר","הזמנה שנחתמה על ידי מי שאינו הלקוח / בעל הנכס"]}},{"id":"b_license","topic":"broker","label":"רישיון, משמעת ועונשין","n":61,"card":{"law":"חוק המתווכים במקרקעין – רישוי, משמעת ועונשין","gist":"אסור לעסוק בתיווך ללא רישיון; רשם המתווכים מנהל פנקס, ועדת משמעת מטפלת בהתנהגות לא ראויה, ויש עבירות פליליות.","points":["עיסוק בתיווך מקרקעין מחייב רישיון מרשם המתווכים (משרד המשפטים): עמידה בבחינה, גיל ותנאי כשירות, העדר הרשעה בעבירה שיש בה קלון, ביטוח אחריות מקצועית ותשלום אגרה.","הרישיון תקף רק כשהוא פעיל (אגרה שולמה) – מתווך עם רישיון לא פעיל נחשב כמי שאינו מורשה.","מתווך רשאי להעסיק עובדים/סוכנים, אך האחריות לפעולות התיווך נשארת על בעל הרישיון.","הליכי משמעת: קובלנה לוועדת משמעת; עונשים כוללים נזיפה, קנס, השעיה או ביטול רישיון; ניתן לערער לבית המשפט.","עיסוק בתיווך ללא רישיון / התחזות למתווך הם עבירות פליליות. בית המשפט רשאי לפסול רישיון כחלק מגזר הדין."],"traps":["'עושה את זה בהתנדבות/לחבר' – עדיין עיסוק בתיווך אם זה עיסוק במקרקעין תמורת תשלום","שיווק עצמי של בעל הנכס (אינו תיווך)","רישיון קיים אך לא פעיל"]}},{"id":"b_duties","topic":"broker","label":"חובות המתווך (גילוי, נאמנות, אמינות)","n":36,"card":{"law":"חוק המתווכים במקרקעין – פרק חובות המתווך","gist":"מתווך חייב לפעול בהגינות, בנאמנות ובשקיפות: לגלות מידע מהותי, להימנע מניגוד עניינים ולא להטעות.","points":["חובת גילוי: חובה למסור ללקוח כל פרט מהותי שידוע למתווך על הנכס או העסקה (פגם משפטי או פיזי, בנייה ללא היתר, בעיות ברישום וכד').","חובת נאמנות ואמינות – לא להטעות לקוח, לא למסור מידע כוזב, לא לפרסם פרסום מטעה (מחיר, שטח, מיקום).","ניגוד עניינים: אם למתווך (או לקרוב/חברה שלו) יש עניין אישי בעסקה – חובה לגלות זאת מראש ובכתב.","אסור לנצל חוסר ידיעה / מצוקה / חוסר שליטה בשפה של הלקוח; יש לוודא שהלקוח מבין את המסמכים.","הפרת החובות עלולה להוביל לשלילת דמי תיווך, תביעה, הליך משמעתי ואף הליך פלילי."],"traps":["מתווך ש'לא ידע' – השאלה היא מה הוא חייב היה לדעת/לברר","קרבה משפחתית/עסקית של המתווך לצד לעסקה","מידע שנמסר רק בעל־פה"]}},{"id":"c_form","topic":"contract","label":"כריתה, כשרות ופגמים בחוזה","n":39,"card":{"law":"חוק החוזים (חלק כללי), התשל\"ג-1973 · חוק המקרקעין (דרישת כתב)","gist":"חוזה נכרת בהצעה וקיבול כשיש גמירות דעת ומסוימות; עסקה במקרקעין דורשת כתב; פגמים בכריתה מאפשרים ביטול.","points":["כריתה: הצעה + קיבול, כשמתקיימות גמירות דעת (כוונה להתקשר) ומסוימות (פרטים עיקריים מוגדרים). 'זיכרון דברים' יכול להיות חוזה מחייב אם יש גמירות דעת ומסוימות (פס\"ד רבינאי נ' מן השקד).","חוזה למכירת מקרקעין – חובה בכתב (דרישת צורה); בלי כתב הוא אינו תקף כעסקה במקרקעין.","חובת תום לב – במשא ומתן, בקיום החוזה ובמימוש זכויות. מו\"מ בחוסר תום לב מזכה בפיצוי.","פגמים: טעות, הטעיה (כולל אי-גילוי), כפייה ועושק – מאפשרים לנפגע לבטל את החוזה. חוזה בלתי חוקי או נוגד תקנת הציבור – בטל.","כשרות: קטין או פסול דין – התקשרות טעונה אישור הנציג/בית משפט. חוזה אחיד – סעיף מקפח ניתן לביטול/שינוי.","תנאי מתלה (העסקה תלויה בהתרחשות) ותנאי מפסיק (העסקה מסתיימת בהתרחשות)."],"traps":["זיכרון דברים = לא תמיד 'רק טיוטה'","הצעה שנדחתה/פגה – אי אפשר לקבל אותה אחר כך","טעות לעומת הטעיה: הטעיה נעשית על ידי הצד השני"]}},{"id":"c_remedy","topic":"contract","label":"הפרה, ביטול ותרופות","n":27,"card":{"law":"חוק החוזים (תרופות בשל הפרת חוזה), התשל\"א-1970","gist":"הפרה → אכיפה, פיצויים או ביטול (בהפרה יסודית); פיצוי מוסכם נבחן לפי החוזה אך בית המשפט רשאי להפחיתו.","points":["בהפרה – הנפגע יכול לבחור: לדרוש אכיפה (קיום בעין), פיצויים, או לבטל את החוזה (ביטול – בהפרה יסודית, או כשהחוזה/החוק מאפשרים).","ביטול מחייב הודעה לצד השני תוך זמן סביר; לאחר ביטול – השבה (החזרת מה שהתקבל).","פיצויים: נזק שנגרם בקשר סיבתי להפרה וצפוי בעת כריתת החוזה; על הנפגע חובה להקטין את נזקו.","פיצוי מוסכם (קנס בחוזה): הנפגע לא חייב להוכיח נזק, אך בית המשפט רשאי להפחית אם הסכום מופרז. הנפגע בוחר בין פיצוי מוסכם לפיצוי בפועל – לא שניהם (אלא אם נקבע אחרת).","ערבון/מקדמה: ערבון (דמי קדימה) בהפרת הרוכש – המוכר רשאי לחלט כפיצוי; מקדמה – היא חלק מהתמורה וניתנת להחזרה."],"traps":["הפרה לא יסודית ≠ זכות ביטול מיידית","לבלבל מקדמה עם ערבון","תביעה לפיצוי בפועל במקום מוסכם – לפי תנאי החוזה"]}},{"id":"s_sale","topic":"sale","label":"חוק המכר","n":4,"card":{"law":"חוק המכר, התשכ\"ח-1968","gist":"חובות מוכר וקונה במכר: מסירה, התאמה ותשלום, ומועד העברת הסיכון.","points":["המוכר חייב למסור את הממכר בהתאם לחוזה: סוג, כמות, איכות; ולהעביר נכס נקי מזכויות צד שלישי.","אי־התאמה: הקונה חייב להודיע על אי־ההתאמה תוך זמן סביר מרגע שגילה או היה עליו לגלות; מוכר שידע ולא גילה – אינו יכול להסתמך על איחור ההודעה.","מה שנכלל בממכר (אביזרים קבועים וכד') נקבע לפי החוזה ונוהג; פריטים שהתחברו לדירה ככלל נשארים עם הדירה, אלא אם הוסכם אחרת.","הקונה זכאי לעכב תשלום אם המוכר לא מילא את חובתו (זכות עכבון) – ולהפך.","כל ההוראות במכר ניתנות להתנאה בחוזה, אך אין להסתיר פגם שהמוכר ידע עליו."],"traps":["הודעה על אי־התאמה לא בזמן סביר","'כפי שהוא' (AS IS) לא מכסה הסתרה מכוונת"]}},{"id":"s_apt","topic":"sale","label":"מכר דירות (קבלן, ערבות, איחור, בדק)","n":80,"card":{"law":"חוק המכר (דירות), התשל\"ג-1973 · חוק המכר (דירות) (הבטחת השקעות של רוכשי דירות), התשל\"ה-1974","gist":"הגנה על רוכש דירה מקבלן: ערובה לכספים ששילם, מפרט מחייב, מועד מסירה, ואחריות לליקויים (בדק ואחריות).","points":["הבטחת השקעות: קבלן שקיבל מהרוכש יותר מ-7% מהמחיר חייב לתת ערובה (ערבות חוק מכר, ביטוח, משכנתא/הערת אזהרה וכד'). אי אפשר לוותר על זה בחוזה.","המפרט הטכני הוא חלק מהחוזה: סטייה ממנו (שטח, חומרים, רמת גימור) היא אי־התאמה; שינויי מפרט דורשים הסכמה בכתב. יש סטיית שטח מותרת מזערית.","איחור במסירה: אחרי תקופת חסד קבועה בחוק הרוכש זכאי לפיצוי ללא הוכחת נזק (שכר דירה ראוי). איחור שנגרם מ'כוח עליון' פוטר רק בהתאם לתנאי החוק.","בדק ואחריות: הקבלן אחראי לליקויים – תקופת בדק (שנים ספורות) ותקופת אחריות ארוכה יותר לליקויי מבנה. כדאי לזכור את מספרי השנים מהמבחנים ולא רק את העיקרון.","מדד תשומות הבנייה – הצמדת התשלומים בחוזה לדירה חדשה נעשית לרוב למדד זה; 'דוח אפס' הוא בדיקת היתכנות כלכלית לפרויקט בליווי בנקאי.","ליווי בנקאי / ערבות בנקאית – מנגנון להבטחת כספי הרוכשים שניתנו לפני המסירה."],"traps":["ויתור בחוזה על ערובה – אין לו תוקף","מתי בדיוק מתחילה תקופת הבדק (ממסירה בפועל)","איחור 'מוצדק' – לא תמיד פוטר מפיצוי"]}},{"id":"l_ownership","topic":"land","label":"בעלות, חכירה וזכויות במקרקעין","n":66,"card":{"law":"חוק המקרקעין, התשכ\"ט-1969 · חוק הירושה · פקודת הנזיקין (סגת גבול)","gist":"סוגי זכויות במקרקעין (בעלות, חכירה, שכירות), עסקה במקרקעין ומה מוגדר 'מקרקעין'.","points":["מקרקעין: קרקע, כל הנטוע/בנוי עליה, וכל המחובר אליה חיבור של קבע. הבעלות בקרקע משתרעת כלפי מעלה ומטה, בגובה ובעומק שיש בהם עניין לבעל הקרקע.","עסקה במקרקעין: העברת בעלות, חכירה, שכירות לתקופה ארוכה, משכנתא ועוד. עסקה מחייבת כתב ורישום כדי ליצור זכות קניינית.","חכירה: זכות לשימוש בנכס לתקופה ארוכה תמורת דמי חכירה; חכירה לדורות – תקופה ארוכה מאוד (בדרך כלל 49 שנים ועוד אופציה/או 99 שנים).","סגת גבול: מי שפולש למקרקעין – הבעלים רשאי לסלקו בכוח סביר תוך זמן קצר מהפלישה (ידע על הפלישה); לאחר מכן – נדרשת פנייה לבית המשפט.","ירושה: מקרקעין בעיזבון עוברים ליורשים לפי הצוואה/החוק; מנהל עיזבון מוגבל בפעולותיו וחלקן דורשות אישור בית משפט."],"traps":["הפרדה בין 'הבעלות' ל'החזקה' ול'שימוש'","כוח לסילוק פולש – תלוי בזמן ובסביר"]}},{"id":"l_register","topic":"land","label":"רישום, הערת אזהרה וטאבו","n":92,"card":{"law":"חוק המקרקעין, התשכ\"ט-1969 · פקודת המקרקעין · תקנות המקרקעין (ניהול ורישום)","gist":"זכות במקרקעין נקנית ברישום; הערת אזהרה מגנה על הקונה בין החתימה לרישום; 'הקודם בזמן קודם בזכות'.","points":["לשכת רישום המקרקעין (טאבו) מנהלת את פנקסי המקרקעין – ובהם נסחי רישום. הנסח מציג בעלות, שעבודים, הערות אזהרה, עיקולים.","עסקה במקרקעין נעשית בכתב; הזכות הקניינית נוצרת ברישום. עד אז לקונה זכות 'אובליגטורית' מכוח החוזה – רק מול המוכר.","הערת אזהרה: רושמים אותה כדי למנוע עסקאות סותרות ולהגן על הקונה מפני נושי המוכר. היא אינה העברת בעלות.","אם נעשו כמה עסקאות באותו נכס – ככלל 'הקודם בזמן קודם בזכות', בכפוף לתום לב ולתמורה.","רישום זכויות בנכס שנרכש מקבלן: הזכויות רשומות על שם הקבלן עד לרישום הבית המשותף והעברה; לכן משכנתא/שעבוד יירשמו תחילה כהערת אזהרה.","מקרקעין מוסדרים – קרקעות שבוצעה בהן הסדר זכויות ורשומות בטאבו; באזור יהודה ושומרון הרישום מתבצע בגורמים אחרים (לשכת רישום באזור)."],"traps":["חתימה על חוזה ≠ בעלות","הערת אזהרה ≠ בעלות","אי רישום לא מבטל את החוזה בין הצדדים"]}},{"id":"l_mortgage","topic":"land","label":"משכנתא ושעבוד","n":28,"card":{"law":"חוק המקרקעין – פרק משכנתא · פקודת המשכון · חוק ההוצאה לפועל","gist":"משכנתא = שעבוד מקרקעין להבטחת חוב; נרשמת בטאבו; בהפרה אפשר לממש.","points":["משכנתא היא שעבוד זכות במקרקעין להבטחת חיוב; נוצרת ברישום. משכון – שעבוד מיטלטלין.","הנושה המשועבד רשאי לממש את הנכס (בהוצאה לפועל, או בכינוס) אם החוב לא נפרע.","גרירת משכנתא – העברת המשכנתא הקיימת מנכס ישן לנכס חדש, תוך שמירת תנאיה.","חברה משכנת – גוף (לרוב קבלן/חברה) שרשום עליו הקרקע/ממנו מתבצעים שעבודים טרם רישום בית משותף; הבנק רושם משכנתא על כלל הפרויקט.","פירעון מוקדם: ככלל הלווה רשאי, אך עשוי לשלם עמלת פירעון מוקדם."],"traps":["היכן נרשם שעבוד כשהנכס עוד לא רשום על שם הרוכש","משכנתא ≠ משכון"]}},{"id":"l_shared","topic":"land","label":"שיתוף, זכות קדימה וזיקת הנאה","n":56,"card":{"law":"חוק המקרקעין – פרק שיתוף · זיקת הנאה · חוק המקרקעין (זכות קדימה)","gist":"בעלות במושע: כל שותף זכאי לדרוש פירוק; זיקת הנאה היא זכות שימוש לטובת נכס אחר.","points":["שיתוף (מושע): כל שותף בעלים של חלק לא מסוים בכל הנכס. כל שותף רשאי לדרוש פירוק השיתוף – בהסכמה או בבית המשפט (בפועל – מכירה וחלוקת הכסף, או חלוקה בעין).","שותף שמשתמש בנכס כולו – ייתכן שיחויב בדמי שימוש לשותפים האחרים.","מכירת חלק במושע: כל שותף רשאי למכור את חלקו, אלא אם נקבע בהסכם שיתוף מגבלה (למשל זכות קדימה/סירוב).","זיקת הנאה: זכות להשתמש (לעבור, להעביר צנרת וכד') בנכס של אחר לטובת נכס שלי. 'נכס זכאי' ו'נכס כפוף'. נרשמת בטאבו; בלי תקופה – בתוקף ללא הגבלה.","זכות מעבר ושביל גישה – הפרטים נקבעים בהסכם או בפסק דין."],"traps":["שותף אינו יכול למכור 'חלקה מסוימת' במושע בלי רישום/פירוק","זיקת הנאה אינה שייכת לאדם אלא לנכס"]}},{"id":"h_common","topic":"condo","label":"רכוש משותף וועד בית","n":77,"card":{"law":"חוק המקרקעין – פרק בתים משותפים · תקנון מצוי","gist":"רכוש משותף שייך לכל בעלי הדירות; ועד הבית מנהל; החלטות באסיפה ברוב; הוצאות לפי יחס שטח.","points":["רכוש משותף: הגג, חדר המדרגות, היסודות, הצנרת הראשית, המעלית ועוד – אלא אם הוצמד לדירה מסוימת בצו הרישום.","ועד הבית נבחר על ידי הדיירים וגובה דמי ועד להוצאות אחזקה; כל דייר חייב לשלם חלק יחסי לפי שטח דירתו (או לפי התקנון).","דייר רשאי להשתמש ברכוש המשותף בלי לפגוע בזכויות אחרים; שימוש בלעדי דורש הסכמה או הצמדה.","החלטות באסיפה כללית: ברוב רגיל כברירת מחדל; לעניינים מיוחדים נדרש רוב מיוחד.","סכסוך בין דיירים – הסמכות להכרעה היא של בית משפט שלום / מפקח על רישום מקרקעין (לפי סוג העניין).","שוכר דירה ברכוש – חיוב אחזקה בדרך כלל על הבעלים אלא אם הוסכם אחרת."],"traps":["הגג אינו שייך בהכרח לדייר העליון","החלטה ברוב רגיל מול רוב מיוחד","מי משלם: שוכר/בעלים"]}},{"id":"h_works","topic":"condo","label":"רישום בית משותף, הצמדות ושינויים","n":40,"card":{"law":"חוק המקרקעין – בתים משותפים · חוק לחיזוק בתים משותפים מפני רעידות אדמה (תמ\"א 38) · צו רישום","gist":"רישום בית משותף, הצמדות, בית מורכב, ושינויים/בנייה ברכוש המשותף – כל אחד מצריך רוב ספציפי.","points":["בית משותף נוצר ברישום צו רישום בפנקס הבתים המשותפים – כל דירה נרשמת כתת־חלקה; נרשם גם התקנון (מוסכם / מצוי).","הצמדה: רכוש משותף (מחסן, חניה, גג, חצר) שמוצמד לדירה מסוימת – נרשם בצו הרישום; אין להפריד הצמדה מהדירה ללא רישום.","בית מורכב – כמה אגפים/בניינים ברישום אחד, לכל אגף יש ועד משלו ואפשר לחלק הוצאות לפי שימוש.","שינוי ברכוש המשותף / תוספת בנייה / חיזוק (תמ\"א) – נדרש רוב מוגדר של בעלי הדירות; החיזוק מפני רעידות אדמה מקל בדרישות הרוב. הרוב המדויק – לפי שאלות המבחנים.","שינויים הנדרשים לנגישות לאדם עם מוגבלות – ניתן לבצע בכפוף לתנאי החוק, בדרך כלל על חשבון המבקש.","התחדשות עירונית (פינוי־בינוי) – שינוי מהותי בבניין תוך הסכמת רוב הדיירים והקצאת דירות חדשות."],"traps":["אי־רישום הצמדה ≠ הצמדה","בלבול בין רוב רגיל לרוב של 'כל בעלי הדירות'","חניה/מחסן שאינם מוצמדים – אי אפשר למכור בנפרד"]}},{"id":"r_rent","topic":"rent","label":"שכירות ושאילה","n":24,"card":{"law":"חוק השכירות והשאילה, התשל\"א-1971","gist":"שכירות היא זכות שימוש תמורת תשלום; שכירות ארוכה טעונה כתב ורישום; שאילה – שימוש בחינם.","points":["שכירות: המשכיר מוסר נכס במצב שמתאים לייעודו; השוכר משלם דמי שכירות ומחזיר בסיום החוזה.","שכירות לתקופה ארוכה (מעל 5 שנים כולל אופציות) – חייבת בכתב; כדי שתקנה זכות קניינית כלפי צד שלישי יש לרשום אותה בטאבו (או הערת אזהרה). שכירות קצרה יכולה להיעשות גם בעל־פה (אך בפועל מומלץ בכתב).","חובות המשכיר: תיקון ליקויים מהותיים; חובות השוכר: תיקונים קלים ושמירה על הנכס.","העברת השכירות או השכרת משנה – ככלל טעונה הסכמת המשכיר.","שאילה – מסירת נכס ללא תמורה לשימוש; השואל חייב להחזיר כשסיים או כשהמשאיל דורש (לפי תנאים).","אי־תשלום דמי שכירות = הפרה; המשכיר רשאי לבטל ולפנות באמצעות בית משפט/הליך כדין, ולא באמצעות כוח עצמי."],"traps":["פינוי שוכר 'בכוח' – אסור","שכירות ארוכה שלא נרשמה – מחייבת בין הצדדים אך לא צד ג'","מי אחראי לתיקון: משכיר או שוכר"]}},{"id":"r_protected","topic":"rent","label":"הגנת הדייר (דייר מוגן, דמי מפתח)","n":52,"card":{"law":"חוק הגנת הדייר [נוסח משולב], התשל\"ב-1972","gist":"דייר מוגן הוא מי שנכנס לנכס בתנאים שנקבעו בחוק (כפופים לתאריכים ולתשלום 'דמי מפתח') – ומוגן מפני פינוי.","points":["חוק הגנת הדייר חל רק על שכירויות מסוימות – בעיקר שכירויות ישנות (לפני מועדים מסוימים בעבר) ובתנאים. שכירות חדשה ברוב המקרים בלתי מוגנת.","דייר מוגן: ניתן לפנותו רק בעילות מוגדרות (לא משלם, שימוש לרעה, עזיבה וכד') ובפסק דין.","דמי מפתח: סכום ששילם הדייר בעת כניסתו לנכס כתמורה על הזכות להגנה; בעת פינוי/מכירה מתחלקים דמי המפתח בין בעל הבית לדייר לפי שיעורים שבחוק.","מעבר זכויות: הגנת הדייר עוברת לבן־זוג/ילדים בתנאים; 'דייר יוצא' ו'דייר נכנס' – עניינים של שאלות מבחן.","'ידועה בציבור' שהתגוררה עם דייר מוגן במשך תקופה – עשויה להיחשב דיירת מוגנת אם התקיימו תנאי החוק."],"traps":["מועד כניסת הדייר לנכס קובע","הגנה אינה עוברת אוטומטית לכל מי שגר בנכס","מבנה שאינו דירה (מסחר, קרקע) – לבדוק תחולה"]}},{"id":"p_permit","topic":"planning","label":"היתר בנייה, טופס 4 ואכיפה","n":45,"card":{"law":"חוק התכנון והבנייה, התשכ\"ה-1965 · תקנות הבקשה להיתר","gist":"בנייה ושימוש בקרקע טעונים היתר; ללא היתר – עבירה, צו הריסה/הפסקה; 'טופס 4' מאשר שהבנייה הסתיימה כדין.","points":["אין להקים/להרוס/לשנות מבנה ואין לשנות שימוש בקרקע בלא היתר מהוועדה המקומית (למעט פטורים מצומצמים).","סטייה מהיתר, שימוש חורג, הקלה וסטייה ניכרת – מנגנונים שמאפשרים חריגה מהתוכנית באישור, ולעיתים בהיטל השבחה.","טופס 4 (תעודת גמר) מעיד שהבנייה בוצעה לפי ההיתר וכי הבניין ראוי לאכלוס וחיבור לתשתיות; בלעדיו – בעיות חיבור לחשמל/מים ורישום.","בנייה ללא היתר – עבירה פלילית; הוועדה רשאית להוציא צו הריסה או צו הפסקת עבודה, והמבנה יכול להיות נתון לקנס ולאכיפה.","מתווך החייב בגילוי: נכס שנבנה ללא היתר – מידע מהותי שחובה לגלותו ללקוח."],"traps":["שיפוץ פנים אינו תמיד מחייב היתר – לבדוק","טופס 4 ≠ היתר בנייה","שימוש חורג ≠ בנייה בלתי חוקית"]}},{"id":"p_plans","topic":"planning","label":"תוכניות, ועדות והפקעות","n":45,"card":{"law":"חוק התכנון והבנייה, התשכ\"ה-1965","gist":"היררכיית התכנון: מועצה ארצית → ועדה מחוזית → ועדה מקומית; תוכנית מתאר ותוכנית מפורטת; הפקעה ופיצוי.","points":["מוסדות תכנון: המועצה הארצית (תמ\"א – תוכנית מתאר ארצית), הוועדה המחוזית (תוכנית מחוזית ומתאר), הוועדה המקומית (תוכנית מקומית/מפורטת והיתרים).","תוכנית מתאר קובעת ייעוד וזכויות בנייה כלליים; תוכנית מפורטת – הוראות לבנייה בפועל. תוכנית מופקדת להתנגדויות לפני אישור.","פיצוי על ירידת ערך (סעיף 197): בעל מקרקעין שערכם ירד בעקבות תוכנית זכאי לפיצוי – הגשת התביעה בתוך 3 שנים מתחילת התוכנית, לוועדה המקומית; השמאי המכריע נקבע לפי החוק.","הפקעה: הוועדה המקומית רשאית להפקיע מקרקעין לצורכי ציבור (דרכים, שטחים ציבוריים, מוסדות ציבור, גנים...). בהפקעה מגיעים פיצויים לבעלים.","איחוד וחלוקה (רה־פרצלציה): איחוד חלקות וחלוקה מחדש בין הבעלים לפי תוכנית.","בעלי עניין בקרקע רשאים להגיש תוכנית מפורטת לוועדה; גורמים מסוימים בוועדה הם בעלי דעה מייעצת בלבד."],"traps":["מי מוסמך לאשר איזו תוכנית","מועד להגשת תביעת פיצויים (3 שנים)","מה נחשב 'צורכי ציבור'"]}},{"id":"p_levy","topic":"planning","label":"היטל השבחה","n":16,"card":{"law":"חוק התכנון והבנייה – התוספת השלישית (היטל השבחה)","gist":"היטל השבחה: 50% מעליית השווי בעקבות אישור תוכנית, הקלה או שימוש חורג; משולם לוועדה המקומית.","points":["היטל השבחה הוא תשלום לוועדה המקומית בשיעור 50% משבח – עליית ערך המקרקעין כתוצאה מאישור תוכנית, מתן הקלה או שימוש חורג.","החבות היא על בעל הזכויות במקרקעין; ההיטל משולם בדרך כלל במועד מימוש הזכויות – בקשת היתר בנייה, מכירה או אישור גמר – המוקדם מביניהם.","חוזה מכר רגיל קובע מי משלם את היטל ההשבחה – בהיעדר סעיף, חלה החבות על המוכר/בעל הזכויות בעת האירוע.","פטורים: דירת מגורים בגדלים/זכויות מסוימים; מקרקעין המשמשים לצורכי ציבור; ועוד.","היטל השבחה ≠ מס שבח: הראשון מהרשות המקומית, השני מרשות המסים."],"traps":["לבלבל היטל השבחה עם מס שבח","מי משלם לפי החוזה מול החוק"]}},{"id":"x_purchase","topic":"tax","label":"מס רכישה","n":26,"card":{"law":"חוק מיסוי מקרקעין (שבח ורכישה), התשכ\"ג-1963 · תקנות מס רכישה","gist":"מס רכישה משולם על ידי הרוכש, לפי מדרגות; דירה יחידה זוכה למדרגות מופחתות, דירה נוספת משלמת יותר.","points":["החייב: הרוכש. נקבע לפי שווי הנכס ולפי מדרגות מס; המדרגות מתעדכנות מדי שנה – יש לבדוק את הטבלה העדכנית.","דירה יחידה: מדרגות מופחתות (כולל מדרגה ראשונה בשיעור 0%). דירה נוספת/דירת השקעה – שיעורים גבוהים יותר מהשקל הראשון.","דירה חלופית: מי שיש לו דירה והוא רוכש חלופית – זכאי לשיעורי דירה יחידה אם ימכור את הדירה הקודמת בתוך תקופה שנקבעה (ראו תשובות המבחנים).","'תא משפחתי' – בני זוג והילדים הקטינים נחשבים יחד לעניין 'דירה יחידה'.","העברה בין בני זוג בגירושין, והורשה – ככלל פטורות ממס רכישה.","קבוצת רכישה: המס מחושב לפי שווי הנכס הבנוי (ולא רק הקרקע), לפי חלקו של כל חבר בקבוצה.","הדיווח והתשלום – בתוך תקופה קצרה מיום החוזה (30 יום)."],"traps":["בלבול בין 'דירה יחידה' לבין 'דירה שנייה שמוכרים'","פטור להורשה/גירושין","קבוצת רכישה – על מה מחושב המס"]}},{"id":"x_gains","topic":"tax","label":"מס שבח ומיסוי אחר","n":86,"card":{"law":"חוק מיסוי מקרקעין (שבח ורכישה), התשכ\"ג-1963 · חוק מס ערך מוסף","gist":"מס שבח משולם על ידי המוכר על הרווח; פטורים לדירת מגורים מזכה; ומע\"מ בעסקאות מסוימות.","points":["החייב במס שבח – המוכר. שבח = שווי המכירה פחות שווי הרכישה (מתואם) והוצאות מותרות (עמלת תיווך, שיפוצים בהוכחה).","שבח ריאלי מול שבח אינפלציוני: האינפלציוני פטור; הריאלי – חייב בשיעורים לפי סוג הנכס והבעלים.","פטור לדירת מגורים מזכה: לפי תנאים (דירה אחת, תקופת החזקה, והצהרה). מי שמוכר דירה שנייה בפרק זמן מסוים – ייתכן שלא יהיה זכאי.","מקדמה על חשבון מס שבח – תשולם בתוך 30 יום ממועד המכירה, על חלק מהתמורה (ולא רק בכסף – גם בשווה כסף).","שווי המכירה לצורך המס: הגבוה בין התמורה לבין שווי השוק; אם הקונה משלם מיסי המוכר – גם הם נוספים לתמורה.","מע\"מ: עסקה במקרקעין של עוסק, או בעל מקצוע – חייבת במע\"מ; עסקה בין אנשים פרטיים בדירת מגורים – בדרך כלל פטורה. הפקעה – גם היא 'מכירה' לעניין מס שבח, בכפוף לפטורים.","יפוי כוח בלתי חוזר למכירה – נחשב כ'מכירה' לצורכי מס (ולעיתים פטור לפי הסעיף)."],"traps":["שבח ריאלי מול אינפלציוני","מי משלם: המוכר ← מס שבח, הקונה ← מס רכישה","הורשה והעברה בגירושין – פטורות"]}},{"id":"ila","topic":"ila","label":"מקרקעי ישראל (רמ״י, היוון, משבצת)","n":86,"card":{"law":"חוק מקרקעי ישראל, התש\"ך-1960 · חוק יסוד: מקרקעי ישראל · חוק רשות מקרקעי ישראל","gist":"רוב הקרקע בישראל שייכת למדינה/קק\"ל/רשות הפיתוח ומנוהלת על ידי רמ\"י; נמסרת בחכירה ולא נמכרת.","points":["מקרקעי ישראל – קרקעות המדינה, רשות הפיתוח וקק\"ל; אין מוכרים אותם אלא בחכירה (חכירה לדורות), בדרך כלל לתקופה של 49 שנים עם אופציה להארכה.","דמי חכירה, היוון (תשלום מראש לטובת חכירה ארוכה/פטור מדמי חכירה שנתיים) ודמי הסכמה (תשלום לרמ\"י בעת העברת זכויות/שינוי ייעוד) – כל אחד עם חישוב משלו.","העברת זכויות בנכס חכור – חלה הסכמת רמ\"י ותשלום דמי הסכמה, אלא אם נקבע פטור.","נחלה במושב: חלקות א', ב' ועוד – 'בן ממשיך' – ירושה של נחלה אינה כרגיל; ככלל הנחלה אינה ניתנת לפיצול בין יורשים.","הסכם משבצת – הסכם בין רמ\"י לארגון התיישבותי (קיבוץ/מושב) להקצאת קרקע חקלאית; חוזה פיתוח – הסכם בין רמ\"י ליזם לפיתוח קרקע.","'פרטה' – חלוקת הזכויות בין שותפים בקרקע; נדרש רישום נפרד.","קרקע עירונית – מוגדרת בחוק (קרקע בתוך תחום רשות מקומית שייעודה אינו חקלאי)."],"traps":["אי אפשר 'למכור' קרקע מדינה – מחכירים","מושב/קיבוץ – מגבלות על העברה","דמי הסכמה ≠ דמי היוון"]}},{"id":"k_consumer","topic":"consumer","label":"הגנת הצרכן והטעיה","n":16,"card":{"law":"חוק הגנת הצרכן, התשמ\"א-1981 · חוק החוזים האחידים","gist":"עוסק אינו רשאי להטעות צרכן או לנצל חולשתו; ללקוח זכות ביטול בעסקאות מסוימות.","points":["הטעיה: עוסק לא יטעה צרכן – לא במהות, לא במחיר, לא באיכות ולא באי־גילוי פרט מהותי.","השפעה בלתי הוגנת: ניצול חולשת הצרכן (גיל, מצוקה, חוסר בקיאות בשפה) כדי לגרום לו להתקשר בעסקה – אסור.","עסקת מכר מרחוק/ עסקת שיווק ישיר – לצרכן זכות ביטול בתוך תקופה שנקבעה.","חוזה אחיד: תנאי מקפח – בית הדין לחוזים אחידים רשאי לבטל/לשנות. הדרישות לגודל אותיות וקריאות בחוזה.","בנדל\"ן – כונס נכסים, מתווך וקבלן יכולים להיות 'עוסקים' לעניין החוק."],"traps":["צרכן = אדם פרטי; עוסק – מי שעוסק בעסקאות במהלך עסקיו","אי־גילוי נחשב להטעיה"]}},{"id":"k_misc","topic":"consumer","label":"רישוי עסקים, חברות, פלילי ועוד","n":20,"card":{"law":"חוק רישוי עסקים · חוק ההוצאה לפועל · פקודת החברות · חוק איסור הלבנת הון · חוק הירושה","gist":"נושאים נלווים שנשאלים במבחן: רישוי עסקים, כינוס נכסים, יפוי כוח, חברה בהקמה, זיוף והתחזות.","points":["רישיון עסק – נדרש לעסק מסוים (בהתאם לצו רישוי עסקים); מונפק על ידי הרשות המקומית; משרד תיווך בקניון/במרכז מסחרי – בדרך כלל כפוף לדרישות.","כונס נכסים (הוצאה לפועל): ממונה למכירת נכס של חייב; פועל בפיקוח; אינו רשאי לפעול בסתירה לחוק (למשל הגנת הצרכן).","יפוי כוח – הרשאה לפעול בשם הממנה; יפוי כוח בלתי חוזר למכירת מקרקעין – ניתן, ויש לו השלכות מיסוי.","חברה בהקמה: מי שפועל בשם חברה שטרם התאגדה – אחראי אישית אלא אם החברה מאשרת את הפעולה לאחר התאגדותה.","זיוף והתחזות – עבירות פליליות; עובד שמבצע זיוף על דעת מעבידו עלול להיות אחראי בפלילים.","שמאי מקרקעין – גורם מוסמך להערכת שווי; חוות דעת של מי שאינו שמאי מוסמך אינה מתקבלת כחוות דעת שמאית."],"traps":["רישוי עסקים ≠ רישיון מתווך","אחריות אישית בחברה בהקמה"]}}],"ex 5","t":"מאי 2025","y":2025,"m":5,"d":"4.5.2025.","u":"/content/%D7%9E%D7%91%D7%97%D7%9F-%D7%AA%D7%99%D7%95%D7%95%D7%9A-%D7%9E%D7%90%D7%99-2025/"},{"id":"2025-07","t":"יולי 2025","y":2025,"m":7,"d":"31.7.2025.","u":"/content/%D7%9E%D7%91%D7%97%D7%9F-%D7%AA%D7%99%D7%95%D7%95%D7%9A-%D7%99%D7%95%D7%9C%D7%99-2025/"},{"id":"2025-11","t":"נובמבר 2025","y":2025,"m":11,"d":"16.11.2025.","u":"/content/%D7%9E%D7%91%D7%97%D7%9F-%D7%AA%D7%99%D7%95%D7%95%D7%9A-%D7%A0%D7%95%D7%91%D7%9E%D7%91%D7%A8-2025/"},{"id":"2026-05","t":"מאי 2026","y":2026,"m":5,"d":"7.5.2026","u":"/content/%D7%9E%D7%91%D7%97%D7%9F-%D7%AA%D7%99%D7%95%D7%95%D7%9A-%D7%9E%D7%90%D7%99-2026/"},{"id":"2026-07","t":"יולי 2026","y":2026,"m":7,"d":"16.7.2026.","u":"/content/%D7%9E%D7%91%D7%97%D7%9F-%D7%AA%D7%99%D7%95%D7%95%D7%9A-%D7%99%D7%95%D7%9C%D7%99-2026/"}],"qs":[{"id":"2013-02#1","e":0,"n":1,"s":"איזה מידע לא מופיע בנסח רישום מקרקעין (נסח טאבו) המופק ע\"י לשכת רישום המקרקעין?","o":["זהות הבעלים של הנכס.","קיומן של זכויות בנייה בנכס.","קיומה של זיקת הנאה לטובת מגרש סמוך לנכס.","קיומה של משכנתא על הנכס."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2013-02#2","e":0,"n":2,"s":"בני רכש בית לפני 5 שנים. בימים אלה התקבלה תוכנית בניין ערים חדשה, המאפשרת בנייה של קומה נוספת, ובני מעוניין לבנות את הקומה הנוספת. הבית רשום במינהל מקרקעי ישראל ולא בלשכת רישום המקרקעין. כשקנה בני את הדירה מיוסף, שילם יוסף דמי היוון למינהל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בני יידרש לשלם למינהל דמי הסכמה רק כאשר ימכור את הבית.","בני לא יצטרך לשלם למינהל דמי הסכמה, אך יתכן שהוא יידרש לשלם למינהל דמי היתר עבור הבנייה הנוספת.","בני יצטרך לשלם למינהל דמי הסכמה למרות שהקרקע מהוונת.","בני לא יצטרך לשלם למינהל כל תשלום שהוא, לרבות דמי הסכמה ודמי היתר."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2013-02#3","e":0,"n":3,"s":"נחום ביקש ממאיר המתווך שיעזור לו לרכוש 10 דירות בבניין באור עקיבא, וחתם על הזמנת שירותי התיווך. מאיר הצליח לקשר בין נחום לשבעה מוכרים שהחזיקו ב- 7 דירות מתוך 10 באותו בניין. בתוך ימים ספורים נחתם הסכם בין נחום לבין כל השבעה. אולם, כמה ימים אחרי כן, לפני שנרשמה הערת אזהרה ולפני ששולם סכום כסף, התברר שהבנק לא מוכן לתת לנחום הלוואה לרכישה של חלק מהדירות בבניין ולא של הבניין כולו, מכיוון שהבניין לא רשום כבית משותף. למרות שהדבר לא הוזכר בחוזה, הסכימו נחום והמוכרים על ביטול העיסקה ללא פיצוי. בהתאם לכך, הודיע נחום למאיר כי העיסקה בוטלה וכי הוא לא זכאי לדמי תיווך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאיר אינו זכאי לדמי תיווך, כי הצדדים לעיסקה הם שקובעים אם העיסקה תקפה או מבוטלת והמתווך כפוף להחלטתם.","מאיר אינו זכאי לדמי תיווך, כי היה עליו ליידע את נחום ואת המוכרים בעובדה שבנקים לפעמים לא נותנים מימון לקרקע משותפת כאשר הבית אינו רשום כבית משותף.","מאיר זכאי לדמי תיווך, מאחר וביטול ההסכם לאחר חתימתו לא משפיע על זכויותיו.","מאיר זכאי לדמי תיווך, מאחר והסירוב של הבנק לתת משכנתא הוא חלק מהסיכונים שלקחו הצדדים בעיסקה, ולכן אין לקונה זכות ביטול גם אם המוכר מסכים לכך."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2013-02#4","e":0,"n":4,"s":"ירון יזם שינוי בתוכנית מיתאר מקומית, המגדיל את מספר יחידות הדיור שניתן לבנות על חלקה השייכת לו, מבלי להגדיל את שטח הבנייה הכללי המותר. הוועדה המקומית לתכנון ובנייה דחתה את התוכנית שהגיש, ועכשיו ירון מעוניין לערער על החלטתה.\nבנסיבות העניין, מה ביכולתו של ירון לעשות?","o":["לא ניתן לערער על החלטת הוועדה המקומית, וירון לא יכול לעשות דבר.","ירון יכול להגיש ערר לוועדת ערר במחוז.","ירון יכול להגיש ערר לממונה על המחוז במשרד הפנים.","ירון יכול להגיש ערר לוועדת המשנה להתנגדויות במחוז."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2013-02#5","e":0,"n":5,"s":"ריקי רכשה מיוסף דירה שבנייתה הסתיימה לפני שלושה חודשים. יוסף רכש את הדירה מקבלן. כיוון שהדירה לא נרשמה בלשכת רישום המקרקעין, נערך הרישום בחברה המשכנת, \"פלס בע\"מ\", אשר בנתה את הדירה. בעת העברת הזכויות נדרשה ריקי לחתום על סעיף ויתור, לפיו לא יהיו לה כל טענה, תביעה, או דרישה כנגד החברה בקשר לליקויים בדירה. ריקי ניסתה להתנגד לחתימה, אך נציג החברה עמד על התנאי ולבסוף הסכימה ריקי לחתום. מספר ימים לאחר העברת הזכויות התברר לריקי כי חברת \"פלס בע\"מ\" בנתה בניגוד לתקן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ריקי לא זכאית לדרוש תיקונים מהחברה, כיוון שהיא חתומה על סעיף ויתור.","לריקי זכות לפנות לחברה ולדרוש תיקונים במשך התקופות הקבועות בחוק, למרות סעיף הוויתור עליו חתמה.","ריקי יכולה לתבוע רק את האדריכל שתכנן את הדירה, מאחר והבנייה נמצאת בתחום אחריותו.","ריקי יכולה לתבוע רק את המהנדס שפיקח על בניית הדירה, מאחר והבנייה נמצאת בתחום אחריותו."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2013-02#6","e":0,"n":6,"s":"היזם רני כסיף בנה בניין ובו 8 דירות בשטח 80 מ\"ר כל אחת ופנטהאוז בגודל 160 מ\"ר. בעת רישום הבית המשותף, ביקש רני מעורך דינו יעקב לקבוע כי כל דירה תשתתף בעלויות האחזקה בשיעור של 1/9 מההוצאות. יעקב בדק את הסכמי המכר של כל הרוכשים ואת המפרטים ולא מצא בהם כל הוראה שמתייחסת לחלוקת הוצאות האחזקה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["כיוון שעורך הדין מחזיק בייפויי כוח מטעם כל הדיירים, הוא רשאי לפי שיקול דעתו להחליט האם להיענות לבקשתו של כסיף ולקבוע כי כל דירה תשתתף בשיעור 1/9 מההוצאות.","הכלל הוא שכל דירה משלמת חלק יחסי בהוצאות בהתחשב בשטח הדירות בבניין ואסור בשום פנים ואופן לסטות מכלל זה, אפילו בהסכמת כל הדיירים.","מכיוון שלא נרשם דבר מראש בהסכמי המכר ובמפרטים, אסור ליעקב להיענות לבקשה של כסיף.","הכלל הוא שכל דירה נושאת בחלק היחסי מההוצאות לפי מספר הדירות, ולכן אין כל בעיה להיענות לבקשה."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2013-02#7","e":0,"n":7,"s":"ועד הבית ברחוב \"השבר הסורי אפריקאי\" מספר 4 החליט להזמין עבודות הנדסיות לחיזוק הבית מפני רעידות אדמה. הוצע על ידי אחד הדיירים לבצע רק את החיזוקים הדרושים אשר משמעותם בפועל ביטול מספר חדרי שירות המשמשים כשטח משותף בבניין. באסיפת הדיירים הצביעו 11 דיירים בעד השיפוץ ושאר 9 הדיירים הצביעו נגד.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסיפת דיירים לא מוסמכת לקבל החלטות הקשורות לניהול הבית המשותף; רק המפקח על בתים משותפים רשאי לקבל החלטות כאלה.","בכל מקרה, אסיפת דיירים לא מוסמכת לקבל החלטות על שיפוץ לפי תוכנית החיזוק ברוב נמוך מ- 60%.","אסיפת הדיירים מוסמכת לקבל החלטות על שיפוץ לפי ההצעה, ואף החלטות בדבר הרחבת דירות, בהחלטה של רוב בעלי הדירות.","ניתן לאשר בהחלטה של רוב בעלי הדירות, תוכנית חיזוק הדורשת רק שינויים ברכוש המשותף, אך להגדלת הדירות נדרש רוב גדול יותר."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2013-02#8","e":0,"n":8,"s":"נועה רכשה דירה שלא רשומה בלשכת רישום המקרקעין ורישומיה מתנהלים בחברה משכנת. לצורך רכישת הדירה קיבלה נועה הלוואה מהוריה והתחייבה לרשום לטובתם שיעבוד. נועה דרשה מעורך הדין שייצג אותה ברכישת הדירה שירשום משכנתא לטובת הוריה. עורך הדין אמר לה שהוא לא יכול לרשום משכנתא, אלא רק משכון בפנקס רשם המשכונות.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין כל צורך ברישום משכנתא או שיעבוד על מנת להבטיח את הזכויות של הוריה של נועה.","כאשר הזכויות מנוהלות בחברה משכנת, רישום משכון הוא הדרך להבטחת הזכויות של הוריה של נועה.","על עורך הדין לרשום משכנתא בלשכת רישום המקרקעין על מנת להבטיח את הזכויות של הוריה של נועה.","עורך הדין יכול לרשום משכנתא, אך בנסיבות העניין עליו לקבל אישור לכך מבית המשפט."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2013-02#9","e":0,"n":9,"s":"שחר רכש בית באמצעות גדי המתווך. לשאלתו של שחר, השיב גדי כי אין כל בעיות מיוחדות בבית שרכש. להפתעתו של שחר הוא גילה לאחר שנכנס לגור בבית כי קומת המרתף של הבית נבנתה ללא היתר.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גדי המתווך עשוי להיות אחראי כלפי שחר ביחס לנזקים שנגרמו לשחר, אפילו אם שחר יוצג ע\"י עו\"ד.","גדי המתווך לא אחראי לבדוק את ההיתר של הבית, מאחר וזה תפקידו של עורך הדין של הקונה.","גדי המתווך עשוי להיות אחראי לנזקיו של שחר רק אם שחר לא נעזר בעורך דין מטעמו.","גדי לא יהיה זכאי לקבל דמי תיווך ביחס לעיסקה, אבל הוא לא יהיה אחראי כלפי שחר לנזקים שנגרמו לו."],"c":[0],"a":false,"note":"","sub":"b_duties"},{"id":"2013-02#10","e":0,"n":10,"s":"כלנית רוצה לרכוש דירה הנמצאת בבנייה מהחברה הקבלנית \"קבלנים מוצלחים בע\"מ\". החברה הקבלנית מציעה לכלנית שתי אפשרויות: הראשונה, לשלם מיליון ש\"ח תמורת הדירה, כאשר כלנית תקבל ערבות בנקאית בהתאם להוראות החוק, והשנייה, לקבל הנחה של חמישים אלף ש\"ח ולוותר על הערבות הבנקאית, כי \"חבל שהבנק סתם ירוויח עלינו כסף\".\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הקבלן רשאי להציע לכלנית את שתי ההצעות הנ\"ל מאחר ואין בהן כל פסול.","אסור לקבלן להפלות בין רוכשים שונים ולכן עליו לקבוע רק אפשרות אחת לגבי כל הרוכשים באותו הבניין.","אסור לקבלן להציע לרוכש דירה לוותר על הערבות.","רק אם כלנית תיוצג על ידי עורך דין מטעמה אשר יסביר לה את הסיכונים ביחס להצעה השנייה, תוכל כלנית לבחור את ההצעה השנייה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2013-02#11","e":0,"n":11,"s":"יוסי הוא מתווך במקרקעין. יוסי ראה מודעה בעיתון לפיה עורך דין חיים מונה להיות כונס נכסים לדירה בתל אביב. יוסי רוצה להביא לקוחות אשר ירכשו את הדירה.\nהאם יוכל יוסי לקבל דמי תיווך מהקונים אם וכאשר הם ירכשו את הדירה מכונס הנכסים?","o":["אסור לגבות דמי תיווך מרוכשים של דירה שנמכרת בכינוס נכסים.","בהנחה שיוסי החתים את הקונים על הסכם הזמנת שירותי תיווך כדין, הוא יהיה זכאי לקבל מהקונים דמי תיווך במידה וירכשו את הדירה מהכונס.","יוסי יוכל לקבל את דמי התיווך מהקונים רק אם כונס הנכסים יסכים שהקונים ישלמו דמי תיווך.","יוסי יוכל לקבל את דמי התיווך מהקונים רק אם ראש ההוצאה לפועל יאשר את התשלום ואת גובה התשלום."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2013-02#12","e":0,"n":12,"s":"שוקי עוסק ביזמות בתחום הנדל\"ן שנים רבות וידוע כמומחה נדל\"ן. לשוקי אין רישיון לתיווך מקרקעין. שוקי תלה על דלת משרדו שלט ענק: \"שוקי נדל\"ן - המומחה שמחבר בין מוכר לקונה\".\nבנסיבות העניין, האם מותר לשוקי לתלות שלט כזה? מדוע?","o":["כן, מכיוון ששוקי עוסק בתחום יזמות הנדל\"ן כבר שנים רבות וידוע כמומחה נדל\"ן.","לא, מכיוון שהשילוט יוצר רושם ששוקי מתווך במקרקעין.","כן, מכיוון שהשילוט הוא על דלת משרדו של שוקי ולא פרסום בעיתונות.","לא, מכיוון שהשילוט לא עונה על דרישות פעולת שיווק כנדרש על פי החוק."],"c":[1],"a":false,"note":"","sub":"b_duties"},{"id":"2013-02#13","e":0,"n":13,"s":"ליצחק חלקת קרקע מוסדרת בבעלות פרטית ברחובות. יצחק מכר ליעקב את בעלותו בחלקה זו, ובין השניים נערך חוזה מכר. יעקב מעוניין להביא את העיסקה לגמר.\nמה עליו לעשות?","o":["ברגע שנכרת החוזה בין הצדדים הסתיימה העיסקה.","גמר תהליך העיסקה הוא ברגע מסירת העתק חוזה המכר למינהל מקרקעי ישראל.","גמר תהליך העיסקה הוא ברישומה בפנקסי המקרקעין.","גמר תהליך העיסקה הוא ברישומה ברשם המשכונות."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2013-02#14","e":0,"n":14,"s":"לראובן דירת מגורים בבעלותו. חיים פלש לדירתו של ראובן. שבוע אחרי הפלישה נודע לראובן שחיים פלש לדירתו.\nמה באפשרותו של ראובן לעשות על מנת לפנות את חיים?","o":["באפשרותו של ראובן אך ורק לפנות ללשכת ההוצאה לפועל על מנת לפנות את חיים מדירתו.","ראובן יכול לפנות את חיים מדירתו אך ורק באמצעות צו בית משפט.","במצב דברים כזה ראובן רשאי לעשות שימוש בכוח במידה סבירה כדי לפנות את חיים בתנאי שלא עברו יותר מ- 30 יום מיום הפלישה.","מכיוון שראובן הוא הבעלים, הוא רשאי לפנות את חיים תוך שימוש בכוח סביר ללא הגבלת זמן."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2013-02#15","e":0,"n":15,"s":"לעזריאל וגבריאל יש דירת מגורים בבעלות משותפת בבת ים. אין בין הצדדים הסכם שיתוף. גבריאל מעוניין לפרק את השיתוף.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גבריאל יכול לפרק את השיתוף רק אם עברו שלוש שנים של בעלות משותפת בדירה.","גבריאל לא יכול לפרק את השיתוף מכיוון שהבעלות המשותפת נרשמה בלשכת רישום המקרקעין.","גבריאל זכאי בכל עת לדרוש את פירוק השיתוף.","גבריאל יכול לפרק את השיתוף רק אם עברו חמש שנים של בעלות משותפת בדירה."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2013-02#16","e":0,"n":16,"s":"בבניין מגורים הרשום כבית משותף בעפולה וחל בו התקנון המצוי, שרה, בעלת הדירה מהקומה השנייה, מסרבת להשתתף בהוצאות השוטפות של החזקת הרכוש המשותף, בטענה שרוב הזמן דירתה ריקה והיא מתגוררת אצל בנה יוסי בחיפה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שרה יכולה לסרב לתשלום ההוצאות השוטפות במידה ותוכיח כי רוב הזמן היא לא שוהה בדירתה.","שרה לא יכולה לסרב לתשלום ההוצאות השוטפות אבל היא תוכל לשלם את חלקה ביחס לזמן שהותה בפועל בדירתה.","שרה לא יכולה לסרב לתשלום ועליה להשתתף בהוצאות השוטפות של החזקת הרכוש המשותף.","שרה יכולה לסרב לתשלום ההוצאות השוטפות במידה ובנה יוסי יגיש תצהיר החתום ע\"י נוטריון כי אמו שרה שוהה רוב הזמן בביתו."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2013-02#17","e":0,"n":17,"s":"בעלי הדירות בבניין מגורים הרשום כבית משותף החליטו להצמיד את הגינה, שהיא רכוש משותף, לדירתו של יושב ראש ועד הבניין, המתגורר בקומה השלישית, כאות הוקרה על פעילותו למען הבניין. נורית, הבעלים של דירת הקרקע, מסוכסכת עם יושב ראש ועד הבניין, והיא המתנגדת היחידה להצמדה זו.\nבנסיבות העניין, האם יכולים בעלי הדירות להצמיד שטח גינה זו, למרות התנגדותה של נורית? מדוע?","o":["כן, מכיוון שיותר ממחצית מבעלי הדירות בבניין הסכימו להצמדה זו.","לא, ניתן להצמיד גינה רק לדירה בקומת הקרקע, ולכן אי אפשר בשום מקרה להצמיד אותה לדירתו של יו\"ר הוועד.","לא, מכיוון שנדרשת הסכמת כל בעלי הדירות בבניין.","כן, רק במידה והצמדת הגינה לא תגרום מטרד לדירתה של נורית שבקומת הקרקע."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2013-02#18","e":0,"n":18,"s":"אביגדור הוא מתווך במקרקעין ידוע מתל אביב. לפני כחודש פנה אליו שמעוני וביקש ממנו להכין עבורו שומת מקרקעין על שווי דירת מגורים ברחוב דיזנגוף עבור תביעתו נגד יחזקאל המתווך.\nבנסיבות העניין, האם יכול אביגדור להכין שומת מקרקעין שכזו?","o":["כן, ובלבד שאביגדור לא תיווך בעיסקה הקשורה לתביעה.","לא, מכיוון שיש צורך בקבלת הסכמה של רשם המתווכים לצורך הוצאת שומה על ידי מתווך.","לא, מאחר ואסור למתווך לערוך שומת מקרקעין.","כן, ובלבד שלא קיימים קשרי עבודה בין אביגדור המתווך ליחזקאל המתווך."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2013-02#19","e":0,"n":19,"s":"בתאריך 01.03.2012 נחתם חוזה שכירות לשנה בין דורית לדנה. הצדדים התכוונו שתחילת השכירות תהיה מיידית, אבל בחוזה נפלה טעות סופר בעניין מועד תחילת השכירות, ונכתב שמועד תחילת השכירות הוא 1.3.2013. דורית טענה כי בגלל טעות זו החוזה הינו בטל ומבוטל.\nבנסיבות העניין, האם דורית צודקת? מדוע?","o":["כן, טעות ברישום המועדים היא עילה לביטול חוזה.","לא, מאחר ומועד תחילת תקופת השכירות הוא לא מידע מהותי בחוזה שכירות.","לא, מאחר ומדובר בטעות סופר בלבד.","כן, מכיוון שזה חוזה שכירות."],"c":[2],"a":false,"note":"","sub":"r_rent"},{"id":"2013-02#20","e":0,"n":20,"s":"מהו שבח לעניין חוק מיסוי מקרקעין (שבח ורכישה)?","o":["השבח הוא היטל ההשבחה החל במכירת מקרקעין.","השבח הוא הסכום שבו עולה שווי המכירה על יתרת שווי הרכישה.","השבח הוא ההשבחה הנוצרת כתוצאה מאישורה של תוכנית מיתאר.","השבח הוא שיעור מס המקרקעין שגובהו 17%, וחל בכל סוג של מכירת מקרקעין."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2013-02#21","e":0,"n":21,"s":"יאיר הוא מתווך מורשה. יאיר סיכם בעל פה עם גיורא המוכר שימצא קונה לדירתו. כעבור חודש מצא יאיר קונה לדירתו של גיורא. לאחר משא ומתן נחתם במשרדו של עורך דין שמוליק הסכם מכר בין גיורא לקונה. יאיר פנה לגיורא ודרש את שכר טירחתו, אך גיורא סירב, בטענה שהוא לא חייב בתשלום כי בינו לבין יאיר לא נערך הסכם בכתב.\nבנסיבות העניין, האם צודק גיורא? מדוע?","o":["לא, מכיוון שיאיר הוא בעל רישיון תיווך כנדרש בחוק והיה הגורם היעיל שהביא להתקשרות.","כן, מאחר והחוק דורש כי הסכם תיווך ייערך בכתב.","לא, מכיוון שחוזה יכול להיות גם בעל פה, ועל גיורא לעמוד בהתחייבותו לפי החוזה.","כן, מכיוון שההסכם נחתם במשרדו של עו\"ד שמוליק, ולא במשרדו של יאיר המתווך."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2013-02#22","e":0,"n":22,"s":"עמוס הוא דייר יוצא לפי חוק הגנת הדייר, אשר החזיק במושכר 8 שנים, החל משנת 2004.\nבנסיבות העניין, מה יהיה חלקו בדמי המפתח?","o":["עמוס לא זכאי כלל לחלק מדמי המפתח.","שישים אחוזים.","שבעים וחמישה אחוזים.","לפי קביעת בית המשפט המוסמך."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2013-02#23","e":0,"n":23,"s":"זיאד מעוניין לרכוש מארקדי דירה בבניין ביפו. הוא בדק את נסח הטאבו ומצא שהקרקע היא בבעלות המדינה ובניהול מינהל מקרקעי ישראל, והיא מוחכרת לארקדי המוכר. זיאד מעוניין להשלים את העיסקה, אבל מתלבט האם עליו לבדוק מתי מסתיים הסכם החכירה בין ארקדי למינהל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["זיאד לא צריך לבדוק מתי מסתיים הסכם החכירה, כי בכל מקרה של העברת זכויות מוארכת זכות החכירה אוטומטית.","זיאד צריך לבדוק מתי מסתיים הסכם החכירה, כי אם ההסכם הסתיים ולא הוארך אין לארקדי זכויות בדירה.","זיאד צריך לבדוק מתי מסתיים הסכם החכירה, כי אם ההסכם הסתיים ולא הוארך, המינהל ידרוש שישולמו דמי הסכמה כתנאי להעברת הזכויות.","זיאד צריך לבדוק מתי מסתיים הסכם החכירה, כי אם ההסכם הסתיים ולא הוארך, המינהל ידרוש שישולמו דמי היתר כתנאי להעברת הזכויות."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2013-02#24","e":0,"n":24,"s":"חיים ודינה נמצאים בהליכי גירושים. לבני הזוג יש וילה בהרצליה המוערכת בשווי של 5 מיליון ש\"ח ומשכנתא בשיעור של 2 מיליון ש\"ח. במסגרת הסכם הגירושים של בני הזוג (אשר קיבל תוקף של פסק דין) הוסכם שדינה תקבל את חלקו של חיים בווילה ובתמורה היא תשלם בעצמה את המשכנתא.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חיים ישלם מס שבח מלא עבור העברת חלקו בווילה לדינה.","חיים ישלם מס שבח מופחת עבור העברת חלקו בווילה לדינה מאחר ויש על הנכס משכנתא.","אין צורך לשלם מס שבח משום שהנכס מועבר ללא שהועברו כספים בין הצדדים.","לא יהיה חיוב במס שבח."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2013-02#25","e":0,"n":25,"s":"גדי עובד כשכיר בחברת החשמל והוא בעלים של דירה. שי, חברו של גדי, רוצה לרכוש את הדירה עבור החברה שלו בשם \"דודי שמש בע\"מ\", העוסקת בייצור דודי שמש. גדי חושש שהעיסקה תחויב במע\"מ.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["העיסקה חייבת במע\"מ, מאחר והמדובר במכירה מאדם פרטי לעוסק במהלך עסקיו.","העיסקה לא חייבת במע\"מ, מאחר וגדי הוא אדם פרטי המוכר דירה.","מאחר והעסקה נעשתה ביחס לדירה ולא לחנות, בכל מקרה לא נדרש תשלום מע\"מ.","גדי יוכל לבחור האם לשלם מע\"מ או מס שבח ביחס לעיסקה."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2013-05#1","e":1,"n":1,"s":"דני ואבי הם בעלים במשותף של מגרש מוסדר הרשום בלשכת רישום מקרקעין. בין הצדדים אין הסכם שיתוף.\nבנסיבות העניין, האם באפשרותו של דני לפרק את השותפות במגרש?","o":["רק אם אבי מסכים לכך.","כן, כל שותף במקרקעין משותפים זכאי בכל עת לדרוש פירוק השיתוף.","לא, לעולם לא ניתן לפרק שותפות במקרקעין מוסדרים.","כן, בתנאי שעברו יותר משלוש שנים ממועד רכישת המגרש."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2013-05#2","e":1,"n":2,"s":"טל הוא הבעלים של דירת מגורים הרשומה כתת חלקה בבית משותף בלשכת רישום המקרקעין בחיפה. טל מעוניין להשכיר את דירתו לשנה אחת בלבד וללא אופציה להארכה, לגלית הסטודנטית.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שכירות לשנה מחייבת חוזה בכתב, אבל לא חייבת ברישום בלשכת המקרקעין.","שכירות לשנה לא מחייבת חוזה בכתב, אבל חייבת רישום בלשכת המקרקעין.","שכירות לשנה לא מחייבת הסכם בכתב, ולא מחייבת רישום בלשכת המקרקעין.","שכירות לשנה מחייבת גם הסכם בכתב וגם רישום בלשכת המקרקעין."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2013-05#3","e":1,"n":3,"s":"סמי הוא הבעלים של חלקת קרקע בנתניה, ובצמוד אליה ממוקמת חלקתו של חזי. על מנת להגיע לחלקתו, חזי נוהג לעבור דרך חלקתו של סמי, למרות שניתן להגיע לחלקה שלו גם מבלי לעבור דרך החלקה של סמי. בין סמי וחזי שוררים יחסי שכנות טובים, וברצונם להסדיר את זכות המעבר של חזי.\nבנסיבות העניין, האם הדבר אפשרי? אם כן - כיצד?","o":["כן, בדרך של זיקת הנאה, שתינתן לחזי או לחלקתו, או לכלל הציבור, וזיקת ההנאה יכולה להינתן על חלק מסוים מחלקתו של סמי.","מאחר שניתן להגיע לחלקה גם ללא מעבר דרך חלקתו של סמי, לא ניתן לרשום זיקת הנאה, אבל ניתן לרשום הערת אזהרה שבה יצוין שלחזי זכות מעבר בשטח.","לא, בנסיבות העניין אין אפשרות חוקית להסדיר את זכות המעבר והיא תלויה תמיד בשיקול דעתו של בעל הקרקע.","ניתן להסדיר את המעבר בחוזה בין סמי וחזי, אבל אין אפשרות לרשום את ההסכמה במרשם המקרקעין."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2013-05#4","e":1,"n":4,"s":"עמי ותמי הם בני זוג, ובבעלותם דירה משותפת המשמשת למגוריהם, הרשומה על שם שניהם בלשכת רישום המקרקעין בירושלים. עמי, שנקלע לקשיים כלכליים, רוצה למכור את חלקו בדירה לאחיו יוסף. תמי טוענת כי עמי לא יכול למכור את חלקו בדירה ליוסף, וכי עליו תחילה להציע לה את חלקו בדירה.\nבנסיבות העניין, האם צודקת תמי בטענתה? מדוע?","o":["כן, מאחר שהחוק דורש זאת.","לא, עמי יכול למכור את חלקו למי שהוא חפץ, מבלי להציע זאת תחילה לתמי בת זוגו.","לא, מאחר שעמי ויוסף הם אחים.","כן, אבל רק אם יש לעמי ותמי ילדים מתחת לגיל 18 הגרים בדירה המשותפת."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2013-05#5","e":1,"n":5,"s":"שחר רכש לפני שנה דירה ולקח הלוואת משכנתא של מיליון שקל. לפני חודש פוטר שחר והוא חושש כי כעת הוא לא יוכל לעמוד בתשלומי המשכנתא.\nבנסיבות העניין, מה יכול שחר לעשות?","o":["שחר יכול לבקש מהבנק לגרור את המשכנתא שלו.","שחר יכול לבקש מהבנק להקפיא את המשכנתא שלו לתקופה קצובה.","שחר לא יכול לעשות דבר, מאחר שטרם חלפו 5 שנים ממועד לקיחת המשכנתא.","שחר לא יכול לעשות דבר, מאחר שטרם חלפו 3 שנים ממועד לקיחת המשכנתא."],"c":[1],"a":false,"note":"","sub":"l_mortgage"},{"id":"2013-05#6","e":1,"n":6,"s":"דינה רוצה לרכוש דירה בפרויקט החדש של חברת \"מוצלחים בנייה\" בע\"מ. כאשר דינה קיבלה את חוזה הרכישה היא שמה לב כי לפרויקט יש ליווי פיננסי. דינה רוצה לקחת הלוואת משכנתא לצורך רכישת הדירה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אי אפשר לקבל משכנתא לצורך רכישת דירה כאשר יש ליווי פיננסי.","אפשר לקבל משכנתא לצורך רכישת דירה כאשר יש ליווי פיננסי.","אפשר לקבל משכנתא לצורך רכישת דירה כאשר יש ליווי פיננסי רק מהבנק המלווה עצמו.","כאשר יש ליווי פיננסי, ניתן לקבל משכנתא לצורך רכישת דירה רק אם המשכנתא היא בשיעור של עד מחצית משווי הדירה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2013-05#7","e":1,"n":7,"s":"רמי רוצה לרכוש דירה שבנייתה טרם הושלמה מהקבלן \"שלמה ובניו\". הקבלן הציע לרמי לרשום הערת אזהרה לטובתו בלשכת רישום המקרקעין אשר תהיה לה עדיפות על כל רישום שיהיה בלשכת רישום המקרקעין. רמי רוצה לקבל ערבות בנקאית מהקבלן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור לקבלן להציע רישום הערת אזהרה כבטוחה לקונה דירה.","הבחירה בין הבטוחות שמציע הקבלן היא אך ורק של הקונה ואסור לקבלן לקבוע מראש איזו בטוחה הוא נותן.","מותר לקבלן להציע לרשום הערת אזהרה העומדת בתנאים המתוארים כבטוחה לקונה דירה.","קבלן יכול להציע אך ורק ערבות בנקאית כבטוחה לקונה דירה."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2013-05#8","e":1,"n":8,"s":"שלומי רוצה לרכוש דירת מגורים במסגרת קבוצת רכישה. שלומי רוצה לדעת כיצד יחושב מס הרכישה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מס הרכישה יחושב לפי ערך החלק בקרקע שירכוש שלומי.","מס הרכישה יחושב לפי שווי המכירה של הנכס הבנוי שהוא דירה המיועדת למגורים.","מאחר שהמדובר בקבוצת רכישה, הרי שאין תשלום של מס רכישה.","מס הרכישה יחושב לפי ערך החלק בקרקע שירכוש שלומי, אך שלומי יהיה זכאי להפחתה של מחצית מהמס מאחר שהמדובר ברכישה במסגרת קבוצת רכישה."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2013-05#9","e":1,"n":9,"s":"דנה, מתווכת מורשית, מנהלת משרד תיווך ומעסיקה בו מספר מתווכים שכירים, שלכולם רישיון תיווך בתוקף. אדם, אחד מהמתווכים השכירים, הסתיר מלקוח מידע מהותי בקשר לנכס אותו הציג בפניו. בעקבות המקרה הוגש כתב אישום נגד אדם המתווך ונגד דנה המנהלת מכוח חוק הגנת הצרכן.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ניתן להרשיע את אדם בעבירה אך לא את דנה, כי לא ניתן להאשים אדם בעבירה על פעולה שביצע אדם אחר.","ניתן להרשיע את דנה בעבירה אך לא את אדם, כי היא כבעלת המשרד אחראית בלעדית לכל פעולות התיווך המתבצעות במשרד.","ניתן להרשיע את אדם בעבירה אך לא את דנה, אלא אם יוכח שדנה ידעה שאדם מסתיר מידע מהלקוח.","ניתן להרשיע את אדם בעבירה, ואף את דנה, אלא אם תוכיח שעשתה כל שאפשר כדי למנוע את הטעיית הלקוח."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2013-05#10","e":1,"n":10,"s":"גיא מחזיק באישור שדירתו, אותה הוא מעוניין למכור, רשומה בלשכת רישום המקרקעין. גיא טוען כי עקב כך הוא אינו חייב בתשלום מס שבח על מכירת הדירה.\nבנסיבות העניין, האם גיא צודק? מדוע?","o":["גיא צודק, מאחר שהמקרקעין שלו רשומים בלשכת רישום המקרקעין הרי שאכן אין הוא חייב בתשלום מס שבח עקב מכירתם.","גיא טועה; גיא יצטרך לשלם שיעור מס שבח מופחת עקב מכירת מקרקעין הרשומים בלשכת רישום המקרקעין.","גיא טועה; אין חשיבות לשאלה האם המקרקעין רשומים בלשכת רישום המקרקעין כאשר בודקים את נושא החיוב במס השבח.","גיא צודק; על מנת שמקרקעין יהיו רשומים בלשכת רישום המקרקעין יש צורך לשלם עבורם מס שבח במועד הרישום ולכן אין צורך בתשלום מס שבח במועד המכירה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2013-05#11","e":1,"n":11,"s":"מוטי הוא הבעלים של מגרש ברחובות הרשום בלשכת רישום המקרקעין. על המגרש רשומה זכות קדימה לטובת דינה. שלומי מעוניין לרכוש את המגרש וסיכם עם מוטי על מחיר של מיליון ש\"ח.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן לרכוש מגרש אשר רשומה עליו זכות קדימה.","רק אם דינה תסרב לרכוש את המגרש תמורת הסך של מיליון ש\"ח, יוכל שלומי לרכוש את המגרש במחיר זה.","דינה יכולה לרכוש את המגרש בסכום הנמוך ממיליון הש\"ח שהציע שלומי, מאחר שרשומה לטובתה זכות קדימה.","שלומי יוכל לרכוש את המגרש ללא קשר לסירוב של דינה, בתנאי שיפקיד בלשכת רישום המקרקעין את הסכום של מיליון ש\"ח."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2013-05#12","e":1,"n":12,"s":"חלקתה של ציפורה הופקעה. בתביעתה לקבלת פיצויי הפקעה טענה ציפורה כי שווי חלקתה הוא 1,000,000 ש\"ח. בסופו של דבר נקבעו פיצויי ההפקעה על סך של 800,000 ש\"ח.\nבנסיבות העניין, מהו הסכום אשר ייקבע כשווי המכירה לעניין מס שבח?","o":["השווי לו טענה ציפורה בתביעתה, כלומר 1,000,000 ש\"ח.","השווי שנקבע לעניין פיצויי ההפקעה, כלומר 800,000 ש\"ח.","שווי המכירה ייקבע בכל מקרה ע\"י שמאי שימונה למטרה זו.","שווי המכירה יהיה שווי בדרך של גילום מלא."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2013-05#13","e":1,"n":13,"s":"בבעלות שמעון נמצא משק חקלאי במושב הבונים. שמעון משכיר את המשק.\nהאם חוק הגנת הדייר עשוי לחול על שכירות זו?","o":["חוק הגנת הדייר חל תמיד על משק חקלאי.","חוק הגנת הדייר לא חל על משק חקלאי.","תחולת החוק תלויה במועד חתימת חוזה השכירות.","החוק חל רק על בניין שהוא חלק ממשק חקלאי."],"c":[1],"a":false,"note":"","sub":"r_protected"},{"id":"2013-05#14","e":1,"n":14,"s":"דינה היא הבעלים של עשירית מדירה בחולון. אין לדינה עוד זכויות בנכסי נדל\"ן. כיום רוצה דינה לרכוש דירה עבור עצמה והיא לא יודעת מה גובה מס הרכישה שהיא תצטרך לשלם בגין רכישת הדירה השנייה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["דינה תשלם מס רכישה לפי חישוב של דירה שנייה.","דינה תשלם מס רכישה לפי חישוב של דירה יחידה.","דינה תשלם מס רכישה מופחת בשיעור של שליש ממס רכישה רגיל.","דינה תשלם מס רכישה מופחת בשיעור של עשירית ממס הרכישה הרגיל."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2013-05#15","e":1,"n":15,"s":"רוני גר ליד משה. רוני שמע כי משה מעוניין למכור את הדירה שלו והסתקרן לדעת כמה שווה הדירה. רוני הגיע לדירה וניהל משא ומתן עם משה ואחרי מספר פגישות הוא הגיע לסיכום עם משה על רכישת הדירה תמורת שני מיליון ש\"ח. כאשר הגיעו הצדדים לחתום על הסכם אשר נוסח על ידי עורכי דין, הודיע רוני למשה כי מעולם הוא לא התכוון לרכוש את הדירה ורק רצה לראות באיזה מחיר הוא יהיה מוכן למכור אותה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מאחר שהייתה הסכמה בעל פה על מכירת הדירה, יוכל משה לתבוע את אכיפת חוזה המכר גם ללא הסכם בכתב.","משה עשוי להיות זכאי לפיצוי מרוני גם אם לא נחתם הסכם בכתב בין הצדדים.","התנהגותו של רוני מהווה הטעיה לפי חוק הגנת הצרכן.","זכותו של רוני להתחרט בכל שלב עד לחתימה על הסכם בכתב ולכן משה לא יכול לעשות דבר כנגדו."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2013-05#16","e":1,"n":16,"s":"בהסכם למכירת דירה נקבע פיצוי מוסכם בשיעור של מאה אלף שקל. כתוצאה מהפרה יסודית של ההסכם על ידי המוכר נגרמו לקונה נזקים בשיעור של מאה וחמישים אלף שקל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אי אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם שנקבע בהסכם.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם רק אם הצדדים קבעו כך מראש בהסכם ביניהם.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם.","אפשר לתבוע סכום פיצוי הגבוה מהפיצוי המוסכם ובתנאי שהפיצוי המוסכם לא נמוך מעשרה אחוזים משווי ההסכם."],"c":[2],"a":false,"note":"","sub":"c_remedy"},{"id":"2013-05#17","e":1,"n":17,"s":"ברק המתווך התחתן לפני כחמש שנים עם יהודית. חיים, בנה של יהודית מנישואיה הקודמים, מעוניין למכור את דירתו. חיים פנה אל ברק שיתווך עבורו בעיסקה זו.\nבנסיבות העניין, האם יכול ברק המתווך לעשות זאת? מדוע?","o":["כן, ללא כל הגבלה, מכיוון שחיים הוא לא הבן הביולוגי שלו, ולכן לא מתקיימת קירבה משפחתית האוסרת זאת.","לא, מכיוון שחיים הוא הבן החורג של ברק המתווך.","כן, רק אם ברק יגלה לקונה הפוטנציאלי את הקשר המשפחתי שלו עם חיים המוכר ויקבל את הסכמת הקונה בכתב לכך שברק יתווך עבורו.","לא, מכיוון שתיווך עבור אדם הקרוב למתווך מהווה ניגוד עניינים."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2013-05#18","e":1,"n":18,"s":"בין שולמית המוכרת לשאול הקונה נחתם הסכם למכירת בית פרטי ברמת השרון בפני עורך הדין צדקיהו. מספר חודשים לפני החתימה הזמינה שולמית את יצחק, מהנדס הבניין, כדי שיבדוק את מצב הבית. המהנדס קבע כי יש להרוס את המבנה מיידית כי יש סכנה שיתמוטט, אך שולמית לא סיפרה על כך לשאול. יומיים לאחר חתימת הסכם המכר פגש שאול במקרה את יצחק המהנדס וסיפר לו על הבית שרכש, ואז לתדהמתו סיפר לו יצחק המהנדס על הבדיקה שערך לבית לפני מספר חודשים ועדכן אותו כי המבנה עלול להתמוטט ויש להרוס אותו מיידית. כעת שאול רוצה לבטל את החוזה.\nבנסיבות העניין, האם רשאי שאול לבטל את החוזה? מדוע?","o":["כן, מאחר שמדובר בהטעיה.","לא, מכיוון שלא ניתן לבטל חוזה שנחתם אצל עורך דין.","לא, מכיוון ששולמית היא זו שהזמינה את יצחק המהנדס לערוך את הבדיקה עבורה בלבד.","כן, אך רק בתנאי ששולמית תסכים לביטול החוזה."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2013-05#19","e":1,"n":19,"s":"למי יש לשלם דמי הסכמה, ובאילו נסיבות?","o":["למינהל מקרקעי ישראל, במכירה של זכויות בנכס מהוון.","למינהל מקרקעי ישראל, במכירה של זכויות בנכס לא מהוון.","לוועדה המקומית לתכנון ובנייה, במכירה של זכויות בנכס מהוון.","לוועדה המקומית לתכנון ובנייה, במכירה של זכויות בנכס לא מהוון."],"c":[1],"a":false,"note":"","sub":"ila"},{"id":"2013-05#20","e":1,"n":20,"s":"ענת פנתה למתווכת סופיה ממשרד \"נכסים - סוף\" כדי שתסייע לה ברכישת דירה. ענת ציינה שהיא מבקשת לרכוש דירת מגורים בת 4.5-5 חדרים בשטח של כ- 120 מ\"ר במחיר עד 1,600,000 ש\"ח, ומאחר שהיא לא מבינה בנושאים אלה היא מבקשת שלא יהיו בדירה בעיות מיוחדות. סופיה ערכה מסמך הזמנה לשירותי תיווך, מילאה את פרטיו, רשמה את המחיר המבוקש, ובחלק המוקדש לתיאור הנכס רשמה \"דירת מגורים\". לאחר שסופיה הציגה לענת מספר דירות רכשה ענת ממשה דירה בשטח בנוי של 125 מ\"ר. הרכישה התבצעה ונחתם הסכם אצל עורך דין יעלי. כאשר התחילה ענת בהליכים לקבלת הלוואת המשכנתא התברר כי בדירה בוצעה עבירת בנייה וכי אחד האגפים של הדירה בשטח 25 מטר נבנה ללא היתר וקיים צו להריסתו, וגם אין אפשרות לקבל היתר עבור חלק זה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא נפל כל פגם בהתנהלותה של סופיה, כי האחריות לבדיקת הנכס מוטלת בכל מקרה על הקונה בלבד.","לא נפל כל פגם בהתנהלותה של סופיה, כי כאשר העיסקה נערכת אצל עורך דין, בכל מקרה האחריות לבדיקת הנכס מוטלת על עורך הדין בלבד.","סופיה לא עמדה בחובת ההגינות והזהירות המוטלת עליה כמתווכת.","סופיה עמדה בחובותיה לפי חוק המתווכים, אך עשויה להיות אחראית לפי חוק הגנת הצרכן."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2013-05#21","e":1,"n":21,"s":"בבניין מגורים בן עשר דירות בעפולה, הרשום כבית משותף, החליטו שבעה מבעלי הדירות להצמיד את המקלט של הבניין לדירתו של יחזקאל, יו\"ר ועד הבית, כהוקרה על תרומתו להחזקתו של הבניין. שולה, בעלת הדירה בקומה האחרונה, מתנגדת נמרצות וטוענת שהדבר בלתי אפשרי.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לא ניתן להצמיד את המקלט לדירה מסויימת.","שולה טועה, מכיוון שיותר משני שלישים מסכימים להצמיד את המקלט התת קרקעי.","שולה צודקת, רק מכיוון שנדרש כי כל בעלי הדירות בבניין יסכימו להצמדת המקלט לדירה.","שולה צודקת, מכיוון שקיים ניגוד עניינים בין הצמדת המקלט לבין תפקידו של יוסף כיו\"ר הוועד."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2013-05#22","e":1,"n":22,"s":"אברהם רכש מגרש ריק בירושלים, והקים עליו בניין הכולל חמש דירות. את הבניין רשם כבית משותף, ערך את התקנון וקבע בו הוראות כאשר כל הדירות היו בבעלותו המלאה. לאחר מכן רשם את התקנון בפנקס הבתים המשותפים. כעבור שנה מכר אברהם ליצחק את הדירה בקומת הקרקע.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["התקנון יחול גם על יצחק.","התקנון לא יחול על יצחק.","התקנון ייכנס לתוקף רק לאחר שאברהם ימכור את כל הדירות שבבעלותו.","התקנון יחול על יצחק רק אם לפחות שליש מהרכוש המשותף צמוד לדירתו."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2013-05#23","e":1,"n":23,"s":"האם יש הבדל בין קרקע מוסדרת הרשומה בפנקסים, לבין קרקע לא מוסדרת הרשומה בפנקסים?","o":["רישום בפנקסים לגבי קרקע מוסדרת מהווה ראיה חותכת לתוכנו, ואילו לגבי קרקע לא מוסדרת הרישום מהווה ראיה לכאורה לתוכנו.","אין רלוונטיות מבחינה ראייתית לשאלה אם הקרקע מוסדרת או לא מוסדרת, כל עוד היא רשומה בפנקסים.","ההבדל היחיד בין קרקע מוסדרת ללא מוסדרת הוא בצורתה הגיאומטרית.","רישום בפנקסים לגבי קרקע מוסדרת מהווה ראיה חותכת לתוכנו, ולגבי קרקע לא מוסדרת הרישום לא מהווה ראיה לתוכנו, אלא נועד לנוחות בלבד."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2013-05#24","e":1,"n":24,"s":"לחיים מגרש ריק בשכונת קרית יובל בירושלים. לפני כשנה נכנסה לתוקף תוכנית מפורטת המשנה את יעוד החלקה למוסדות ציבור ומייעדת את החלקה להפקעה. כעת מעוניינת הוועדה המקומית לתכנון ובנייה \"ירושלים\" להפקיע את המגרש לשם הקמת בית ספר.\nהאם באפשרותה לעשות זאת?","o":["לא, לוועדה מקומית סמכות להפקיע קרקע מכוח תוכנית מיתאר מקומית בלבד.","כן, אם חיים ייתן את הסכמתו לכך מראש ובכתב.","כן, מכיוון שהפקעה זו בסמכותה של הוועדה המקומית.","לא, הסמכות להפקיע מקרקעין נתונה בכל מקרה אך ורק לוועדה המחוזית שבתחומה נמצאים המקרקעין."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2013-05#25","e":1,"n":25,"s":"עזריאל וגבריאל הם תאומים זהים. לעזריאל רישיון לתיווך במקרקעין, אך לגבריאל אין רישיון כזה. עזריאל החל לתווך בעיסקת מקרקעין גדולה, אך נאלץ להפסיק בשל בעיה בריאותית, ועל כן מסר את רישיון התיווך לגבריאל אחיו התאום, שהמשיך בתיווך בעיסקה. במהלך המשא ומתן חשף הרוכש כי גבריאל אינו בעל רישיון לעסוק בתיווך והסתלק מיד מן העיסקה.\nבנסיבות העניין, על מי מהאחים (אם בכלל) חלה אחריות פלילית?","o":["האחריות הפלילית חלה רק על גבריאל אשר הציג את עצמו בכזב כעזריאל בעל רישיון התיווך.","האחריות הפלילית חלה רק על עזריאל אשר השאיל לגבריאל את רישיון התיווך בכוונה שיוכל להציג את עצמו בכזב כבעל רשיון התיווך.","האחריות הפלילית חלה גם על עזריאל וגם על גבריאל.","מאחר שהעיסקה לא הושלמה, לא חלה אחריות פלילית על אף אחד מהאחים, אך רשם המתווכים יכול לבטל את רישיונו של עזריאל בשל הפרת חובת הנאמנות והזהירות."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2013-07#1","e":2,"n":1,"s":"שי רוצה למכור דירה ושדה חקלאי שבבעלותו. גיל מעוניין לקנות משי את הדירה והשדה. שי הציע כי הצדדים יחתמו על הסכם בכתב, אך גיל אמר לו שאין בכך צורך כי לפי הוראות סע' 23 לחוק החוזים אפשר לעשות חוזה גם בעל פה.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הסכם לרכישת מקרקעין תקף גם כשהוא בעל פה, ואין חובה לערוך הסכם בכתב.","יש צורך בהסכם בכתב כדי שהסכם למכירת מקרקעין יהיה תקף.","לא יהיה צורך בעריכת הסכם בכתב רק אם יהיה נוכח עורך דין במעמד הסיכום בעל פה.","מכירת הדירה דורשת הסכם בכתב, אך על מכירת השדה ניתן להסכים בעל פה."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2013-07#2","e":2,"n":2,"s":"דירתה של גלית בשטח בנוי של 100 מ\"ר. על פי תוכנית המיתאר ניתן להרחיב את שטח הדירה בעוד 70 מ\"ר. ברצונה של גלית לממש את הרחבת הדירה ולשם כך פנתה לחזי האדריכל. מבדיקות שערך חזי האדריכל עולה כי על גלית יהיה לשלם \"דמי היתר\".\nמהם \"דמי ההיתר\" שגלית נדרשת לשלם?","o":["תשלום אותו יהיה עליה לשלם עבור היתר הבנייה אשר משולם לוועדה המקומית לתכנון ובנייה.","מס החל על הרחבת דירת מגורים במידה וגלית אינה זכאית לפטור.","תשלום אותו יש לשלם למינהל מקרקעי ישראל כתנאי להסכמתו למימוש זכויות הבנייה אשר לא הוענקו לגלית בהסכם החכירה עימה.","אגרת בנייה אותה יש לשלם לרשות המקומית."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2013-07#3","e":2,"n":3,"s":"דלית פירסמה מודעה בעיתון בזו הלשון: \"למכירה ברח' בבלי בתל אביב דירת גן משופצת, בהסכם חכירה מהוון\". חדווה, המעוניינת לרכוש את הדירה, אינה יודעת מה משמעות המושג \"הסכם חכירה מהוון\".\nבנסיבות אלה, מהו \"הסכם חכירה מהוון\"?","o":["הסכם חכירה שהוא לא מול מינהל מקרקעי ישראל.","הסכם חכירה המשולם בדמי חכירה שנתיים.","הסכם חכירה אשר דמי החכירה עבורו שולמו בתשלום חד פעמי מראש.","הסכם חכירה הרשום בלשכת רישום המקרקעין."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2013-07#4","e":2,"n":4,"s":"יוסי פנה לרינה המתווכת על מנת שתמצא קונה למגרש שבבעלותו. לאחר בירורים פנתה רינה למוטי בהצעה לרכישת המגרש, תוך כדי מסירת פרטי המגרש והבעלים והחתמתו על הסכם הזמנה בכתב. למחרת בבוקר הודיע מוטי לרינה המתווכת כי הוא לא רוצה לרכוש את המגרש והוא מבטל את הסכם ההזמנה. כעבור מספר שבועות נודע לרינה כי נחתם הסכם מכר למגרש בין יוסי למוטי. רינה פנתה למוטי בדרישה לקבלת דמי התיווך ומוטי מסרב בתוקף לשלם לה, בטענה כי ההסכם ביניהם מבוטל.\nבנסיבות העניין, האם מוטי צריך לשלם לרינה דמי תיווך? מדוע?","o":["כן, מאחר שרינה הייתה הגורם היעיל בעיסקה.","לא, מכיוון שביום שלמחרת חתימת ההסכם הודיע מוטי לרינה כי ההסכם ביניהם מבוטל ולכן אין הסכם תיווך בתוקף.","כן, רק אם בהסכם ההזמנה בכתב ניתנה בלעדיות.","לא, מכיוון שרינה לא ביצעה פעולות שיווק."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2013-07#5","e":2,"n":5,"s":"בני הזוג אברהם ושרה ישראלי מעוניינים לרכוש דירה, ולשם כך פנו לחזי המתווך. כעבור שבוע חש אברהם ברע ואושפז בבית החולים. אברהם אמר לשרה כי היא יכולה להמשיך לראות דירות בלעדיו. בזמן שהותו של אברהם בבית החולים הראה חזי המתווך לשרה את דירתו של שמואל והחתים אותה על טופס הזמנת שירותי תיווך. לאחר שחרורו מבית החולים פנה אברהם לבן דודו חיים המתווך שימצא עבורו דירה. חיים המתווך הציג לאברהם את דירתו של שמואל וכעבור חודש נערך הסכם מכר שבמעמדו שולמו לחיים דמי התיווך. כשנודע לחזי המתווך על העיסקה דרש את דמי התיווך מהזוג ישראלי, אך הם סירבו לשלם בטענה שחיים המתווך הוא זה אשר תיווך בעיסקה ורק הוא זכאי לדמי התיווך.\nבנסיבות העניין, האם חזי זכאי לדמי תיווך? מדוע?","o":["לא, מכיוון שחיים הוא האחרון אשר הציג את הנכס לרוכשים.","כן, מכיוון שמתקיימת קירבה משפחתית בין בני הזוג ישראלי לחיים המתווך ולכן חיים לא זכאי לדמי תיווך.","כן, עליהם לשלם לחזי המתווך את דמי התיווך.","לא, מכיוון שבכל מקרה רק מתווך אחד זכאי לדמי תיווך, וחיים כבר קיבל את הכסף, כך שלא ניתן לחייבם לשלם פעמיים."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2013-07#6","e":2,"n":6,"s":"במסגרת חיזוק בניין מגורים הרשום כבית משותף מפני רעידות אדמה, מעוניינים שמונה מתוך עשרה בעלי הדירות לבנות מעלית בשטח הגינה, שהיא חלק מהרכוש המשותף של הבניין. שרית, בעלת הדירה שבקומת הקרקע - שלה יש גישה ישירה לגינה - מתנגדת נמרצות.\nבנסיבות העניין, האם נדרשת הסכמתה של שרית? מדוע?","o":["כן, מכיוון שנדרשת הסכמה של כל בעלי הדירות.","לא, מכיוון שהיא הבעלים של דירה בקומת הקרקע ולכן אין לה זכות הצבעה בכל הנוגע להתקנת מעלית.","לא, מכיוון שלהחלטה יש רוב של בעלי הדירות.","כן, מכיוון שבניית המעלית פוגעת בשטח הגינה המשותפת וכדיירת בקומת הקרקע יש לשרית זכות בלעדית לשימוש בגינה."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2013-07#7","e":2,"n":7,"s":"דוד רכש דירה מהחברה הקבלנית \"הבונים\", אך החברה לא מסרה את הדירה החדשה במועד המופיע בחוזה המכר. בחוזה לא נקבע סעיף כלשהו לעניין פיצוי במידה ויהיה איחור במועד המסירה.\nבנסיבות העניין, ממתי יהיה דוד זכאי לפיצוי בגין האיחור במסירת הדירה לידיו?","o":["מיד בחלוף המועד שנקבע כמועד המסירה בחוזה המכר.","אם האיחור במסירה הינו כתוצאה מנסיבות שאינן בשליטת חברת הבנייה, דוד לא זכאי לפיצוי.","לאחר שחלפו שישים ימים מתום המועד שנקבע למסירה בחוזה המכר, בעבור האיחור ממועד המסירה בחוזה המכר.","לאחר שחלפו שישים ימים מתום המועד שנקבע למסירה בחוזה המכר, בעבור האיחור מאותו המועד."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2013-07#8","e":2,"n":8,"s":"ראובן שוכר מגרש ריק באיזור התעשיה של חדרה, אשר משמש כמגרש גרוטאות ומהווה מקור פרנסתו של ראובן. חוזה השכירות של ראובן נחתם לראשונה בשנת 1982 ומתחדש מידי שנה. כיום, בסוף תקופת השכרה נוספת, בעל המגרש אינו מעוניין להאריך לראובן את החוזה. ראובן טוען כי הוא דייר מוגן.\nהאם הצדק עם ראובן?","o":["לא, מכיוון שהעיר חדרה לא נכללת ברשימת הערים שחוק הגנת הדייר חל עליהן.","כן, מכיוון שזהו מקור פרנסתו.","לא.","כן, מכיוון שהוא שוכר את הקרקע יותר מ- 30 שנה ברצף."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2013-07#9","e":2,"n":9,"s":"אתי ירשה מאביה אברהם חנות במרכז תל אביב.\nהאם יחול מס שבח על ההורשה?","o":["אם החנות היא מקור פרנסתה היחיד של אתי, לא יחול עליה מס שבח.","אם שווי החנות ביום הורשתה עולה על השווי בעת רכישתה על ידי אברהם, יהיה על אתי לשלם מס שבח.","לא, מכיוון שהורשה אינה מכירה לעניין החוק.","אם אברהם החזיק בחנות פחות מארבע שנים ברציפות, יהיה על אתי לשלם מס שבח."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2013-07#10","e":2,"n":10,"s":"יוסי ודני חברים טובים. לרגל יום הולדתו של דני החליט יוסי להפתיעו ולהעניק לו במתנה חנות השייכת לו במרכז המסחרי בבית שמש.\nבנסיבות העניין, האם יחול מס שבח על המתנה?","o":["לא, מכיוון שמס שבח אינו חל על מתנות.","אם החנות רשומה בלשכת רישום המקרקעין, אז לא יחול מס שבח.","אם יש שבח בהענקתה של זכות זו, יחול עליה מס שבח.","אם יוסי היה הבעלים של החנות פחות מארבע שנים ברציפות, יחול עליה מס שבח."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2013-07#11","e":2,"n":11,"s":"שושנה המתווכת ביצעה עבירת משמעת. לאחר כחודש ביטלה שושנה את רישיון התיווך שלה, וכעבור שלושה חודשים הוגשה כנגדה קובלנה בגין עבירת משמעת זו לוועדת המשמעת. שושנה טוענת כי אין משמעות להגשת הקובלנה מכיוון שבזמן הגשתה רישיונה כבר בוטל על ידה.\nבנסיבות העניין, האם שושנה צודקת? מדוע?","o":["לא, ועדת המשמעת רשאית לפעול גם כלפי מי שחדל בינתיים להיות מתווך.","לא, מכיוון שהרישיון בוטל מיוזמתה של שושנה.","כן, משום שסמכותה של ועדת המשמעת היא אך ורק כלפי בעלי רישיון תיווך במקרקעין תקף.","כן, משום שניתן להגיש תלונה נגד מי שחדל להיות מתווך רק עד 45 יום אחרי מועד ביטול הרישיון."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2013-07#12","e":2,"n":12,"s":"יונית היא בעלת רישיון תיווך. ברצונה של יונית לעשות הסבה מקצועית ולעבוד כנהגת אוטובוס. בבירור בחברת האוטובוסים \"המאסף\" נמסר ליונית כי מכיוון שהחברה מממנת את עלות הוצאת רישיון הנהיגה באוטובוס, עליה להתחייב לעבוד לפחות שנתיים בחברתם, וכן לא תוכל לעסוק בכל עבודה נוספת אחרת.\nבנסיבות העניין, מה באפשרותה של יונית לעשות בעניין תשלום אגרת רישיון התיווך בתקופה שבה לא תוכל לעבוד כמתווכת?","o":["באפשרותה להתלות את רישיונה בהודעה שתמסור מראש ובכתב לרשם.","חובת תשלום אגרת רישיון תיווך חלה החל ממועד קבלת הרישיון, ואין אפשרות להימנע מתשלומה.","אם יונית לא עוסקת בפועל בתיווך, לא חלה עליה חובת תשלום אגרת רישיון תיווך, ואין חובה להודיע על כך לרשם המתווכים.","אם יונית אינה עוסקת בפועל בתיווך, אך היא רוצה לשמור את הרישיון ולא לבטלו, חלה עליה חובת תשלום אגרה מופחתת."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2013-07#13","e":2,"n":13,"s":"אילנה פירסמה את דירתה למכירה. שמוליק, שראה את הדירה, התלהב ממנה, ובתוך שבוע נערך הסכם מכר בין הצדדים. במעמד חתימת הסכם המכר שילם שמוליק את מלוא המחיר עבור הדירה. למחרת בבוקר התחרטה אילנה והחליטה להפר את החוזה, ובאותו יום החזירה לשמוליק את כל הכסף ששולם עבור הדירה בהעברה בנקאית, מבלי ששמוליק הסכים לכך.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שמוליק זכאי לדרוש את אכיפת החוזה.","שמוליק לא יכול לעשות דבר, מכיוון שאילנה החזירה את כל הכסף אשר שולם לה.","כל עוד עיסקת מכירת מקרקעין לא נרשמה, כל צד רשאי לבטל אותה, אך ייתכן שהצד המבטל יחויב בתשלום פיצויים.","כל עוד עיסקת מכירת מקרקעין לא נרשמה, המוכר בלבד רשאי לבטל אותה, אך ייתכן שהוא יחויב בתשלום פיצויים לקונה."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2013-07#14","e":2,"n":14,"s":"ניסים מעוניין לרכוש מגרש ריק ופנוי בראשון לציון. הוא קיבל מיעל המוכרת עותק מנסח רישום המקרקעין של המגרש (\"נסח טאבו\"). בנסח רשומים כבעלים במגרש: יעל ½, ודניאל ½. בין יעל לדניאל אין הסכם שיתוף. ניסים מעוניין לקנות את חלקה של יעל בלבד.\nבנסיבות העניין, מה משמעות הבעלות המשותפת במגרש?","o":["בעלותה של יעל מתפשטת בכל המגרש ואין לה חלק מסויים בו.","חציו הדרומי של המגרש בבעלותה של יעל, ואילו חציו הצפוני של המגרש בבעלות דניאל.","לכל אחד מהבעלים חלק מסוים ומוגדר במגרש.","מכיוון שדניאל הוא השותף שיישאר הבעלים במגרש, עומדת לו הזכות לבחור ראשון את חלקו במגרש."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2013-07#15","e":2,"n":15,"s":"חיים ויוסי הם בעלים משותפים במגרש ריק ופנוי בפתח תקווה. לפני כעשר שנים ערכו ביניהם הסכם שיתוף בדבר הניהול והשימוש במגרש. לאחר מכן רשמו הסכם זה בלשכת רישום המקרקעין. כיום חיים מעוניין למכור את חלקו לעדינה.\nבנסיבות העניין, האם הסכם השיתוף יחייב גם את עדינה?","o":["כן.","לא, מכיוון שההסכם נערך בין חיים ליוסי.","לא, מכיוון שחלפו יותר משבע שנים מיום עריכתו ולפיכך חלה עליו התיישנות.","כן, אך רק אם צויין בהסכם במפורש שהוא יחול גם על צדדים שלישיים אשר יקבלו את הזכויות במגרש מן הבעלים המקוריים."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2013-07#16","e":2,"n":16,"s":"מירי ועירית הן אחיות שבבעלותן דירת מגורים בראש העין. מירי מתגוררת בדירה וחלקה בבעלות 3/4, ועירית, המתגוררת ברחובות, היא הבעלים של ה- 1/4 הנותר. על הדירה אין הסכם שיתוף. רמי, שהתגרש ממירי לפני מספר שנים, יודע שהאחיות מסוכסכות ביניהן, ולפיכך פנה לעירית וביקש לקנות את חלקה בדירה בסכום גבוה.\nבנסיבות העניין, האם יכולה מירי למנוע את המכירה?","o":["כן, מאחר שבבעלותה של מירי יותר מ- 50% מהבעלות, לא ניתן להעביר זכויות בחלקים אחרים ללא הסכמתה.","כן, מאחר שמירי מתגוררת בדירה, יש לה זכות קדימה לרכוש את חלקה של עירית במחיר שהציע רמי.","לא.","כן, כי העיסקה בין רמי לעירית נעשית בחוסר תום לב."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2013-07#17","e":2,"n":17,"s":"בבניין מגורים בן שלוש דירות בשלוש קומות בהרצליה, הרשום כבית משותף, חל התקנון המצוי. בעלי הדירות מעוניינים לפצל את הבעלות ברכוש המשותף בבניין, כך שלכל דירה יוצמד חלק ספציפי ומוגדר ברכוש המשותף, על פי החלוקה הבאה: לדירה בקומת הקרקע יוצמד המקלט התת קרקעי הסמוך אליה, לדירה בקומה השנייה יוצמד חדר המדרגות שבשימוש בלעדי שלה, ולדירה בקומה האחרונה תוצמד המעלית היחידה. נחתם הסכם בכתב בין כל בעלי הדירות לחלוקה הנ\"ל.\nבנסיבות העניין, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אסור לבעלי הדירות לעשות את הפיצול המתואר לעיל ברכוש המשותף.","אין כל בעיה בפיצול הרכוש המשותף המתואר לעיל, מכיוון שישנה הסכמה בכתב חתומה על ידי כל הבעלים של הדירות בבניין.","מכיוון שלכל דירה מוצמד חלק אשר סמוך אליה ומשמש אותה - הפיצול מותר.","מאחר שחלוקת הרכוש המשותף אינה זהה בין כל הדירות, החלוקה המבוקשת אסורה על פי התקנון המצוי."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2013-07#18","e":2,"n":18,"s":"ערן הוא הבעלים של חלקת קרקע מוסדרת בערד, שייעודה לתעשייה. לאחרונה אושרה תוכנית מיתאר מחוזית שהגדירה מחדש את גבולות אזור התעשייה ושינתה את יעוד החלקה של ערן לדרך. כתוצאה מכך נפגע ערך החלקה, וערן מעוניין לתבוע פיצויים בגין ירידת הערך.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין לערן זכות לתבוע על ירידת ערך הקרקע בשל התוכנית החדשה.","ערן זכאי לתבוע את הנזק, ועליו להגיש את התביעה לוועדה המקומית לתכנון ובנייה.","ערן זכאי לתבוע את הנזק, ועליו להגיש את התביעה לוועדה המחוזית לתכנון ובנייה.","ערן זכאי לתבוע את הנזק, ועליו להגיש את התביעה למינהל מקרקעי ישראל."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2013-07#19","e":2,"n":19,"s":"חיים הוא הבעלים של דירת מגורים בחיפה, הנמצאת בבניין הרשום בפנקס הבתים המשותפים. לדירה צמודה גינה גדולה. רועי, חברו של חיים (שאינו דייר בבניין) נוהג לערוך אירועים משפחתיים גדולים וביקש לעשות שימוש בגינה, אך השכנים התנגדו לכך. לפיכך הציע חיים לרועי למכור לו את חלקו בגינה בלבד, ואילו דירת המגורים תמשיך להיות בבעלותו של חיים, וכך לעקוף את התנגדות השכנים.\nבנסיבות העניין, האם יכול חיים למכור לרועי רק את הגינה?","o":["לא.","כן, מכיוון שהדירה רשומה בפנקס הבתים המשותפים.","כן, אך רק אם לפחות שני שלישים מהשכנים שבבעלותם לפחות חצי מהרכוש המשותף מסכימים לכך
