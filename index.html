ים האחרים למנוע את השתלטות האח על הדירה שיש להם בה חלק? אם כן, כיצד?","o":["האחים לא יכולים לעצור את ההשתלטות על הדירה, אלא אם יעשו הסכם חלוקת עיזבון.","כל עוד לא מונה מנהל עיזבון רשאי כל יורש לבצע כל פעולה ברכוש.","היורשים יכולים לעכב את כניסת האח לדירה ולדאוג למינוי מנהל עיזבון זמני, במסגרת צו משפטי לשמירת העיזבון.","כל יורש שיש לו חלק בלתי מסוים בדירה רשאי למנוע בכוח סביר שימוש על ידי היורשים האחרים עד למינוי מנהל עיזבון."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2022-10#24","e":35,"n":24,"s":"נעמי היא דיירת מוגנת בדירת 3 חדרים. לדירה צמוד מגרש ריק. המגרש משמש את נעמי לתליית כביסה.\nנמרוד, בעל הבית, מבקש מנעמי לפנות את המגרש כדי שיוכל לבנות עליו.\nהאם השכירות המוגנת חלה על המגרש הריק המשמש לתליית כביסה?","o":["לא; חוק הגנת הדייר אינו חל על קרקע ריקה שאינה משמשת לדיירת כמקור פרנסה.","לא; אין שכירות מוגנת בנכסים לא בנויים.","כן; חוק הגנת הדייר אינו מבדיל בין מגרש לנכס בנוי.","כן; דרושה הסכמה של נעמי כדי לפנות את המגרש, בהיותה דיירת מוגנת."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2022-10#25","e":35,"n":25,"s":"מה היא תוכנית מיתאר ארצית (תמ\"א) ומי רשאי לאשרה?","o":["תוכנית מיתאר ארצית היא תוכנית בניה ושימוש בקרקע בשטח המדינה כולה או חלקה, המאושרת על ידי המועצה הארצית לתכנון ובנייה.","תוכנית מיתאר ארצית היא תוכנית בניה ושימוש בקרקע בשטח המדינה כולה או חלקה, המאושרת על ידי ממשלת ישראל.","תוכנית מיתאר ארצית היא תוכנית בניה ושימוש בקרקע במחוז תכנוני מסויים, המאושרת על ידי שר הפנים או נציג מטעמו.","תוכנית מיתאר ארצית היא תוכנית בניה ושימוש בקרקע במחוז תיכנוני מסויים, המאושרת על ידי מנהל מינהל התכנון במשרד הפנים."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2023-01#1","e":36,"n":1,"s":"רחלי וינון מכרו את דירת מגוריהם. עורך הדין המייצג את הקונים בעיסקה ביקש לקבל לידיו \"אישורי העברה לטאבו\" על מנת שיוכל לטפל ברישום הדירה על שם הקונים.\nאיזה מהמשפטים הבאים מתאר בצורה הנכונה ביותר את המסמכים שעורך הדין של הקונים ביקש מרחלי וינון?","o":["מסמך בחתימת יד של רחלי ושל ינון המאשר שהם מסכימים שהדירה תעבור על שם הקונים.","אישור מרשות המיסים כי הקונים שילמו את מלוא מס הרכישה המוטל עליהם.","אישור עירייה המעיד, בין היתר, על היעדר חובות לעירייה וכן אישור מרשות המיסים על היעדר חובות במיסוי מקרקעין.","אישורי העברה בנקאית על תשלום מלוא תמורת הדירה."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2023-01#2","e":36,"n":2,"s":"רועי הינו הבעלים של דירה בקומה האחרונה בבית משותף. מידי שנה בעונת החורף מי הגשמים מחלחלים וגורמים לרטיבות מאסיבית מגג הבניין לשטח של דירתו של רועי. רועי פנה אל בעלי הדירות בבקשה לתקן את הרטיבות, אך פניו הושבו ריקם.\nהאם רועי יכול לחייב את הדיירים לתקן את הרטיבות שנגרמה לו?","o":["כן; רועי צריך לפנות לממונה על פניות הציבור ברשות מקרקעי ישראל.","לא; רועי צריך לתקן את הנזק בעצמו, שכן דירתו מצויה בקומה האחרונה ויתר הדיירים אינם מחויבים לשאת בעלויות התיקון של הגג.","לא; רועי צריך לשאת בעלות ובתיקון בעצמו ולאחר מכן לדרוש מיתר הדיירים את ההשתתפות בתיקון.","כן; רועי נדרש להגיש תביעה כנגד בעלי הדירות, שתתנהל בפני המפקח על הבתים המשותפים על מנת שיורה לבעלי הדירות לתקן את הרטיבות שבגג הבניין המשותף."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2023-01#3","e":36,"n":3,"s":"סמדר רכשה דירה מקבלן ולצורך כך נטלה הלוואה מבנק. הבניין בו מצויה הדירה טרם נרשם כבית משותף וזכויותיה של סמדר מתנהלות בספרי החברה המשכנת. הבנק מעוניין לרשום שיעבוד על זכויותיה של סמדר בדירה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ניתן לרשום משכנתא על הדירה, בתנאי שסמדר שילמה לפחות 65% מהתמורה לקבלן.","הבנק לא יוכל לרשום שיעבוד על זכויותיה של סמדר אם הדירה אינה רשומה בטאבו.","הבנק לא יוכל לרשום משכנתא על הדירה, אלא משכון ברשם המשכונות על זכויותיה של סמדר וכן לרשום התחייבות לרישום משכנתא בספרי החברה המשכנת.","לא ניתן לרשום שיעבוד על הדירה בנסיבות המקרה."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2023-01#4","e":36,"n":4,"s":"אביתר רכש דירה חדשה באזור יהודה ושומרון.\nהיכן יירשמו זכויותיו?","o":["זכויות בדירה הרשומה באזור יהודה ושומרון נרשמות בלשכת רישום המקרקעין (טאבו) בירושלים.","זכויות בדירה באזור יהודה ושומרון נרשמות בפנקס הבתים המשותפים.","זכויות בדירה באזור יהודה ושומרון נרשמות אצל הממונה על הרכוש הממשלתי והנטוש באזור יהודה ושומרון או במשרדי רישום המקרקעין במינהל האזרחי.","לא ניתן כלל לרשום זכויות בדירה באזור יהודה ושומרון."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2023-01#5","e":36,"n":5,"s":"אלעד וערן רכשו מגרש וחתמו על הסכם שיתוף המסדיר את היחסים המשפטיים ביניהם ביחס למגרש. לאחר כשנתיים הסתכסכו אלעד וערן ואלעד מעוניין לפרק את השיתוף.\nהאם רשאי אלעד לדרוש כעת את פירוק השיתוף?","o":["לא; אלעד אינו רשאי לדרוש את פירוק השיתוף כל עוד לא עברו 3 שנים מיום חתימת ההסכם.","כן; אלעד רשאי לדרוש את פירוק השיתוף אך ורק אם ערן יסכים לכך.","כן; אלעד רשאי להגיש תביעה לפירוק השיתוף.","לא; אלעד לא יכול לדרוש את פירוק השיתוף, מכיוון שלא מדובר בבית משותף."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2023-01#6","e":36,"n":6,"s":"בעיסקת מקרקעין, האם ניתן לרשום הערת אזהרה לטובת הקונה, גם כאשר המוכר לא חתם על בקשה לרישום הערת אזהרה בטאבו בגין העיסקה?","o":["לא; כי העיסקה טרם הסתיימה.","לא; ניתן לרשום הערת אזהרה בגין עיסקת מקרקעין רק לאחר השלמת העיסקה.","כן; בתנאי שיצורף מכתב המסביר מדוע המוכר לא חתם על הבקשה לרישום הערת אזהרה.","כן; בתנאי שיוכח לרשם כי בעל המקרקעין התחייב בכתב לבצע את העיסקה."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2023-01#7","e":36,"n":7,"s":"בגין מה מהבאים ניתן לגבות היטל השבחה?","o":["תוכנית חדשה החלה על מקרקעין המקנה זכויות בנייה נוספות.","עליית מחירים כללית הרלוונטית לנכס.","שיפור תשתיות לנכס.","מס שבח מקרקעין."],"c":[0],"a":false,"note":"","sub":"p_levy"},{"id":"2023-01#8","e":36,"n":8,"s":"שירן חתמה על טופס הזמנה לשירותי תיווך עם אבנר המתווך על מנת שימכור את דירתה. אבנר הציג את דירתה בפני בנו דניאל, והסכם מכר נחתם בין הצדדים.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מתווך במקרקעין לא יתווך בעיסקת מקרקעין אם יש לו עניין אישי במקרקעין או בעיסקה, לרבות לבנו.","מתווך במקרקעין לא יתווך בעיסקת מקרקעין אם יש לו עניין אישי במקרקעין או בעיסקה, לרבות עניין אישי של קרובו - אלא אם גילה ללקוחו את עניינו האישי כאמור וקיבל את הסכמת הלקוח לכך בכתב.","מתווך במקרקעין לא יתווך בעיסקת מקרקעין אם יש לו עניין אישי במקרקעין או בעיסקה, לרבות עניין אישי של קרובו - אלא אם גילה ללקוחו את עניינו האישי כאמור, קיבל את הסכמת הלקוח לכך בכתב, ולא קיבל תשלום עבור התיווך.","מתווך במקרקעין רשאי לתווך בעיסקת מקרקעין אם יש לו עניין אישי ולא מחויב לעדכן שבנו מעורב בעיסקה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2023-01#9","e":36,"n":9,"s":"שרון וגדעון כרתו חוזה, שבמסגרתו רכש גדעון את דירתה של שרון. סוכם כי התמורה תשולם בחמישה תשלומים. שלושה תשלומים שולמו במועד. כשהגיע מועד התשלום הרביעי הודיע גדעון, כי הוא יאחר בתשלום. חלף חודש וגדעון טרם ביצע את התשלום. בחוזה אין התייחסות לאיחור בתשלום. הניחו כי לא מדובר בהפרה יסודית של החוזה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["שרון לא יכולה לבטל את החוזה מיד - עליה לתת לגדעון אורכה לתיקון ההפרה בתוך זמן סביר.","שרון לא יכולה לבטל את החוזה, מכיוון שהחוזה הופר. אין צורך במתן אורכה לקיומו.","שרון יכולה לבטל את החוזה ואין צורך במתן אורכה לקיומו.","שרון יכולה לבטל את החוזה, מכיוון שחלף חודש ממועד ההפרה."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2023-01#10","e":36,"n":10,"s":"פנינה רכשה מאברהם דירה שרשומה בטאבו, ובין השניים נכרת חוזה כדין. בזמן הרכישה, נסח הטאבו היה נקי מכל חוב ומשכנתא. פנינה רשמה הערת אזהרה לטובתה בטאבו. טרם השלמת העיסקה הוטל עיקול על הדירה על ידי נושה של אברהם.\nהאם העיקול פוגע בזכויותיה של פנינה?","o":["העיקול לא יפגע בזכויותיה של פנינה - הערת האזהרה מגינה עליה.","העיקול יפגע בזכויותיה של פנינה, כי הדירה טרם נרשמה על שמה.","העיקול לא יפגע בזכויותיה של פנינה, אלא אם יוכח כי המעקל ידע כי רכשה את הדירה.","העיקול יפגע בזכויותיה של פנינה - הערת האזהרה אינה מגינה מפני עיקול מאוחר."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2023-01#11","e":36,"n":11,"s":"גילה רכשה ממשה דירה בבית משותף, שאליה מוצמד מחסן. בחוזה המכר נקבע כי המכירה אינה חלה על המחסן, וכי המחסן יישאר בבעלות משה.\nהאם בחוזה מכר זה ניתן להפריד את המחסן מהבעלות על הדירה?","o":["לא ניתן להפריד בעיסקת המכירה בין הדירה לבין המחסן, אלא אם משה הינו בעל דירה אחרת בבית המשותף.","אם הצדדים הסכימו על כך, ניתן להשאיר את המחסן בבעלות משה.","המחסן אינו חלק מהדירה ולכן ניתן להפריד בינו לבין הדירה בעיסקת המכירה בכל מקרה.","לא ניתן להפריד בין המחסן לבין הדירה משום שהמחסן נבנה בצמוד לדירה ללא מרווח."],"c":[0],"a":false,"note":"","sub":"h_works"},{"id":"2023-01#12","e":36,"n":12,"s":"רחל ויעקב הם זוג נשוי שבבעלותם דירה המשמשת אותם למגורים. יעקב מכר את חלקו בדירה ליצחק ללא שהציע לרחל קודם לכן לרכוש את חלקו בדירה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יעקב רשאי לעשות כן, כי רחל תישאר דיירת מוגנת בדירה.","יעקב חייב להציע את חלקו בדירה לרחל לפני שיציע את חלקו לאחר.","יעקב חייב להציע את חלקו בדירה לרחל רק במהלך השנתיים הראשונות מעת הרכישה.","יעקב רשאי לעשות כן, אלא אם בין השניים סוכם אחרת בעל פה."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2023-01#13","e":36,"n":13,"s":"יונה שכר חנות מישעיהו לתקופה של שלוש שנים, עם אופציה להארכה לשנה וחצי נוספות.\nהאם עיסקת השכירות חייבת להיות בכתב?","o":["כן, הסכם השכירות מחייב כתב, בשל האופציה להארכה.","לא, הסכם השכירות אינו מחייב כתב, שכן מדובר בשכירות קצרה מחמש שנים.","לא, הסכם השכירות מחייב כתב, כי מדובר בעיסקה במקרקעין.","לא, הסכמי שכירות אינם מחייבים כתב, לא משנה מה משך השכירות."],"c":[1],"a":false,"note":"","sub":"r_rent"},{"id":"2023-01#14","e":36,"n":14,"s":"איציק ואפרת רכשו דירה. שווי הרכישה לפי החוזה היה 1.3 מיליון שקל. על הדירה רובצת משכנתא שיתרתה לסילוק בסך של 300,000 ש\"ח. השמאי העריך את הדירה בסך של 900,000 ש\"ח.\nמהו שווי המכירה לצורכי מיסוי מקרקעין במקרה זה?","o":["1,000,000 ש\"ח - המשכנתא אינה חלק משווי המכירה של הנכס.","1,300,000 ש\"ח - שווי המכירה כפי שקבעו הצדדים בחוזה.","900,000 ש\"ח - לפי הערכת השמאי.","1,200,000 ש\"ח - לפי הערכת השמאי בתוספת המשכנתא."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"x_gains"},{"id":"2023-01#15","e":36,"n":15,"s":"איזו מבין העבירות הבאות תגרור עונש מאסר למתווך במקרקעין?","o":["אי מסירת מידע מהותי ללקוח בעיסקת מקרקעין.","גילוי ידיעה אישית של לקוח, האסורה בגילוי לצד השני בעיסקת מקרקעין.","אי גילוי עניין אישי בעיסקת מקרקעין.","העסקת אדם אחר בתיווך במקרקעין כשהוא אינו בעל רישיון תיווך במקרקעין."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2023-01#16","e":36,"n":16,"s":"יוסי הוא בעלים של נחלה במושב, הכוללת את חלקה א' בה הוא מתגורר, ואת חלקה ב', שבה הוא מגדל מילונים. יוסי מעוניין לבנות צימרים לאירוח כפרי בחלקה ב'.\nהאם יוסי רשאי לעשות כן?","o":["לא; חלקה ב' מיועדת לעיבוד חקלאי וחל בה איסור בנייה.","לא; בחלקה ב' ניתן לעשות שימוש למגורים בלבד, ואסור להקים בה מסחר.","כן; חלקה ב' מיועדת למסחר.","כן; חלקה ב' שייכת ליוסי, והוא רשאי לעשות בה כל שימוש."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2023-01#17","e":36,"n":17,"s":"בבית משותף המכיל 40 דירות (להלן: \"הבניין\") הציעה המתווכת חני מספר דירות להשכרה. רז, המחפש לשכור דירת 4 חדרים, פנה לחני, אשר החתימה אותו על טופס הזמנת שירותי תיווך. בטופס ההזמנה נכתב כי קיימות מספר דירות בבניין במחיר וקומה משתנים. רז חתם על הטופס וחני לא מסרה לו עותק של טופס ההזמנה. לאחר התלבטות, רז הישהה את חיפושו. כעבור כשלושה חודשים שכר דירה אחרת בבניין, אליה הגיע ישירות דרך הבעלים אשר פרסם מודעה בפייסבוק.\nעפ\"י פסק דין ת\"ק 41268-09-12 כהן נ' גולן, האם זכאית חני לעמלת תיווך?","o":["כן; חני זכאית לעמלת תיווך כי רז חתם על טופס כללי לבניין.","לא; חני אינה זכאית לעמלת תיווך, מכיוון שרז לא קיבל העתק של טופס הזמנת שירותי תיווך, לא פורטו בהזמנה פרטים מלאים, וחני לא הייתה הגורם היעיל שהביא להתקשרות הצדדים בחוזה.","לא; חני אינה זכאית לעמלת תיווך מכיוון שרז הוכיח שבעלי הדירה פרסמו את הדירה באופן עצמאי בפייסבוק.","כן; לפי פסק הדין חני זכאית למחצית עמלת התיווך בעיסקה זו, כי חני הציגה ללקוח את הבניין."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2023-01#18","e":36,"n":18,"s":"רונית מעוניינת לרכוש דירה. בעת חיפושיה יצרה קשר עם איציק, מתווך במקרקעין. איציק פרסם דירה למכירה. בעת הביקור בדירה חתמה רונית על הסכם הזמנת תיווך עם אפרת, שהיא מתווכת במשרדו של איציק. שמה של אפרת ומספר ת.ז./רישיון תיווך לא הופיעו בהסכם. אפרת הראתה לרונית את הדירה. תוך כדי הביקור טענה אפרת כי המחיר המבוקש בגין הדירה הינו מיליון ש\"ח. עוד נטען כי המפתחות לדירה ניתנו בבלעדיות למשרד התיווך. רונית ביקשה מאפרת לדבר עם המוכר ולנסות להוריד את המחיר, אך אפרת סירבה וטענה כי המחיר \"קשיח\". רונית המשיכה לחפש דירה והקשר בין רונית למשרד התיווך לא התקיים יותר. לאחר כחודש יצרה רונית קשר עם ליאור ממשרד תיווך אחר. ליאור הציג לרונית מספר דירות, ובין היתר גם את הדירה אותה ראתה עם אפרת. לאחר משא ומתן, ובעזרתו הרבה של ליאור, רכשה רונית את הדירה במחיר של 885,000 ש\"ח. המוכר מצידו טען כי הדירה לא הייתה מעולם בבלעדיות. רונית שילמה עמלת תיווך לליאור.\nבנסיבות העניין ועל פי פסק דין תא\"מ מספר 10272/02/11 ב.פ. הנשיא סוכנויות נדל\"ן בע\"מ נגד בקרמן ואח', האם זכאים איציק ואפרת לעמלת תיווך?","o":["כן; אפרת החתימה והראתה לראשונה את הדירה לרונית.","כן; מקובל לשלם מחצית מעמלת התיווך במקרה שכזה לכל אחד מהמתווכים.","לא; לרונית הזכות לבחור דרך איזה מתווך להתקדם, ולכן איציק ואפרת אינם זכאים לעמלת תיווך.","לא; אפרת לא ניהלה בשם רונית משא ומתן עם המוכר, ובנסיבות אלה אינה הגורם היעיל בעיסקת התיווך."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2023-01#19","e":36,"n":19,"s":"בעלים של מגרש מעוניין לבנות עליו בניין מעץ.\nהאם בנייה מעץ יכולה להיכלל תחת הגדרת 'בניין' לעניין תכנון ובנייה?","o":["בהתאם לחוק התכנון והבנייה, כל מבנה, בין שהוא בנוי אבן ובין שהוא בנוי בטון, ברזל, עץ או כל חומר אחר, ייחשב כבניין.","בהתאם לחוק התכנון והבנייה, כל מבנה, בין שהוא בנוי אבן ובין שהוא בנוי בטון, ברזל, למעט עץ, ייחשב כבניין.","במרכז עיר אסורה הבנייה בעץ, על כל מרכיביו, ועל כן בנייה כזו לא יכולה להיחשב כבניין לעניין חוק התכנון והבנייה.","בניין הינו מבנה בבנייה קשיחה בלבד, הכולל לפחות 2 יחידות דיור, ולכן לא ניתן לבנות בניין מעץ."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2023-01#20","e":36,"n":20,"s":"עליזה, אלמנה ואם לשני ילדים, מתגוררת בדמי מפתח בדירת מגורים (להלן: \"הדירה\"). לפני כשנה הכירה עליזה בן זוג, והוא עבר להתגורר עימה בדירה לפני 3 חודשים. למרבה הצער, נפטרה עליזה.\nהאם בן הזוג ייחשב כדייר מוגן בדירה?","o":["כן; במקרה של פטירתה של עליזה, בן הזוג יהיה דייר מוגן בדירה בה התגוררו ביחד, שכן השניים היו בני זוג למשך תקופה העולה על שישה חודשים סמוך לפטירתה של עליזה.","כן; במקרה של פטירתה של עליזה, בן הזוג יהיה דייר מוגן בדירה בה התגוררו, למעט אם היתה לו בזמן פטירתה של עליזה דירה אחרת למגוריו.","לא; במקרה של פטירתה של עליזה, בן הזוג לא ייחשב לדייר מוגן, שכן, הזכות עוברת לילדיה של עליזה, זאת במקרה שלא היתה להם בזמן פטירתה של עליזה דירה אחרת למגורים.","לא; במקרה של פטירתה של עליזה, בן הזוג לא ייחשב לדייר מוגן, משום שלא די בכך שהשניים היו בני זוג למשך יותר משישה חודשים לצורך העברת הזכות לבן הזוג במקרה המתואר."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2023-01#21","e":36,"n":21,"s":"משה רכש דירה מקבלן וביקש לתקן את מפרט הדירה.\nמה נדרש כדי לתקן מפרט של דירה?","o":["על הצדדים למלא טופס שקבע השר בצו באישור ועדת הכלכלה של הכנסת.","כל תיקון במפרט טעון חתימת שני הצדדים.","לא ניתן לתקן את המפרט לאחר חתימתו.","כל תיקון במפרט טעון חתימת המוכר בלבד."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2023-01#22","e":36,"n":22,"s":"בקרקעות שבבעלות המדינה, מהי ההגדרה של \"קרקע עירונית\"?","o":["קרקע שהייעוד שלה הוא למגורים או לתעסוקה.","קרקע שהייעוד שלה הוא למלונאות.","קרקע שנמצאת בשטח של עיר.","קרקע שהייעוד שלה הוא לפעילות עירונית בלבד."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2023-01#23","e":36,"n":23,"s":"מהו ״שימוש חורג״ בקרקע או בבניין?","o":["שימוש השונה מזה שנקבע בתוכנית החלה במקום או בהיתר הבנייה.","שינוי של הוראות לפי תוכנית בדבר בינוי או עיצוב אדריכליים.","שינוי חלוקת שטחי הבנייה המותרים בתוכנית אחת, שהיא תוכנית שאישרה הוועדה המחוזית.","הגדלת מספר יחידות הדיור, ללא הגדלת סך השטחים למטרות עיקריות."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2023-01#24","e":36,"n":24,"s":"משה הוא מתווך במקרקעין. משה צירף מיוזמתו את לקוחותיו למאגר בתשלום הקרוי \"פרסום דירות מקומי\", ונתן להם הטבה של חודש ראשון רישום חינם למאגר. יוזמת הצירוף למאגר אינה מצוינת בהזמנת התיווך, או בכל חוזה אחר שמשה עורך עם לקוחותיו.\nהחל מהחודש השני נדרשים לקוחותיו של משה לשלם 100 ש\"ח לחודש בגין הרישום למאגר.\nהאם משה רשאי לרשום את לקוחותיו למאגר זה בנסיבות המתוארות?","o":["כן; מכיוון שמדובר בהטבה, משה רשאי לנצל בשם לקוחותיו ובעבורם הטבה של חודש ראשון חינם בעניינים הנובעים ישירות מהסכם הזמנת התיווך שנחתם, גם אם ההטבה אינה מצוינת בו במפורש.","כן; מדובר בפעולת תיווך מותרת.","לא; משה אינו יכול למסור פרטים לגבי לקוחותיו למתווכים אחרים.","לא; משה אינו יכול לצרף לקוח לשירות בתשלום ללא הסכמתו המפורשת של הלקוח, גם אם מדובר בהטבה של חודש ראשון חינם שהלקוח נהנה ממנה."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2023-01#25","e":36,"n":25,"s":"לאחר מותה של הגב' לוי מונה לעזבונה מנהל עיזבון. העיזבון כולל דירת מגורים הרשומה במרשם המקרקעין. כעת מנהל העיזבון רוצה למכור את הדירה.\nמי מהבאים מוסמך למכור את הדירה?","o":["מנהל העיזבון, ללא תנאי.","מנהל העיזבון, לאחר שבית המשפט אישר את פעולת המכירה.","המפקח על הבתים המשותפים.","רשם המקרקעין."],"c":[1],"a":false,"note":"","sub":"l_ownership"},{"id":"2023-05#1","e":37,"n":1,"s":"בנימין הינו הבעלים של דירה וחצר הרשומים על שמו במרשם המקרקעין. ינון, שכנו של בנימין, הבעלים של החלקה הסמוכה, נוהג לעבור בחצר של בנימין כדי לקצר את הדרך לחלקתו. כעבור 30 שנה טוען ינון כי יש לו זיקת הנאה במקרקעין של בנימין.\nהאם זכות המעבר יכולה להירשם כזיקת הנאה? מדוע?","o":["כן, זכות מעבר יכולה להירשם כזיקת הנאה משום שמדובר בזכות במקרקעין.","לא, זכות מעבר אינה יכולה להירשם משום שלא מדובר בשיעבוד.","לא, זכות מעבר אינה יכולה להירשם מכיוון שהרישום לא נעשה בתמורה ובתום לב.","כן, זכות מעבר יכולה להירשם בתנאי שהשביל מגודר ומסומן למעבר בחלקה."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2023-05#2","e":37,"n":2,"s":"מוטי ורונית הציעו למכירה את דירתם הפרטית, שבה הם מתגוררים. הם הגיעו להסכמה עם קונה, שישלם את המחיר המבוקש על ידם: 1,800,000 ש\"ח. הקונה הינו עצמאי, ועוסק במקצוע חופשי. הקונה ביקש לקנות את הדירה למטרת מגורים תוך קיזוז מס ערך מוסף.\nהאם הקונה רשאי לקזז מס ערך מוסף בעסקה זו? אם כן, מדוע?","o":["כן, מס ערך מוסף חל בשיעור של 17% בכל עיסקה בישראל וניתן לקזזו בהתאם.","לא, מס ערך מוסף אינו חל על דירת המגורים, מכיוון שאינה מלאי עסקי ואינה משמשת לעסק ולפיכך לא ניתן לקזזו.","כן, יש לשלם מס ערך מוסף בחישוב לינארי, שלפיו יקוזז הסכום בהתאמה.","לא, מס ערך מוסף אינו חל על דירת המגורים, משום שלא מדובר בעיסקת אקראי."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2023-05#3","e":37,"n":3,"s":"מהי \"חכירה לדורות\"?","o":["חכירה לדורות היא שכירות להחזקה ושימוש במשק חקלאי.","חכירה לדורות היא זכות שכירות לדורות הבאים.","חכירה לדורות היא שכירות לתקופה של עשרים וחמש שנים לכל הפחות.","חכירה לדורות היא שכירות למשך כל תקופת חיי הדייר, אשר לא ניתן להעבירה בירושה יותר מדור אחד בלבד."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2023-05#4","e":37,"n":4,"s":"דני וימית הם בעלים במשותף במקרקעין (בעלים ב'מושע'), ואין ביניהם הסכם לפירוק שותפות.\nהאם ניתן לרשום חלק מסוים מהמקרקעין על שם דני בלבד? אם כן, מה נדרש על מנת שיירשם חלק מסוים מהמקרקעין על שם דני בלבד?","o":["אם דני וימית רוצים לרשום חלק מסוים מהמקרקעין על שם דני בלבד, עליהם לנקוט הליך של \"פירוק שיתוף\" בבית משפט, או לערוך ביניהם הסכם לפירוק שיתוף במושע.","לדני יש חלק במקרקעין, ולכן אין צורך בנקיטת צעד כלשהו לשם רישום חלק מסוים במרשם המקרקעין.","בעלות במושע אינה ניתנת לפירוק.","משמעות המושע היא שלכל אחד מהשותפים יש חלק מסוים במקרקעין, ולכן נדרש כעת לקבל אישור מרשות המיסים והרשות המקומית לצורך ביצוע הרישום בפועל."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2023-05#5","e":37,"n":5,"s":"באסיפה כללית של בעלי הדירות בבית משותף הרשום בפנקס הבתים המשותפים (להלן: \"הבניין\"), התעורר ויכוח בקשר לאופן חלוקת תשלום הוצאות ההחזקה התקינה של הרכוש המשותף. יוסי, בעל דירה בקומה הראשונה, טען שבעלי הדירות בקומות העליונות צריכים לשלם סכום גבוה יותר מבעלי הדירות בקומות התחתונות עבור הוצאות ההחזקה, מאחר שהם עושים יותר שימוש ברכוש המשותף (חדר מדרגות, מעליות וכו'). שולי, שהיא בעלת דירת הפנטהאוז בבניין, טענה שתשלום ההוצאות צריך להתחלק בין כל בעלי הדירות בהתאם לגודל הדירה של כל אחד מהבעלים, ביחס לשטח של כל הדירות בבניין. בתקנון הבית המשותף אין התייחסות לנושא.\nבנסיבות העניין, לפי מה יחושב חלקה של כל דירה בהוצאות ההחזקה התקינה של הבניין?","o":["אופן חלוקת הוצאות ההחזקה בבניין נקבע בהתאם להחלטת הקבלן שהקים את הבניין.","לפי החוק, רק דיירי הקומות העליונות שמשתמשים במעלית בפועל נושאים בהוצאות החזקה, ולכן מי שגר בקומות התחתונות בבניין ישלם פחות, בלי קשר לגודל דירתו.","כל בעל דירה בבניין חייב לשאת בהוצאות החזקת הרכוש המשותף לפי יחס שטח רצפת דירתו אל מול שטח הרצפה של כל הדירות בבניין.","בעל דירה חייב לשאת בהוצאות החזקת הרכוש המשותף לפי יחס שטח רצפת דירתו אל מול שטח הרצפה של הרכוש המשותף בבנין."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2023-05#6","e":37,"n":6,"s":"בן, מתווך במקרקעין, הראה דירה למטרת שכירות ללקוח בבניין מגורים. בן לא ציין את מספר הדירה בטופס הזמנת שירותי התיווך שהחתים עליו את הלקוח, ולא מסר ללקוח העתק מטופס זה.\nבהמשך הסתבר לבן כי הלקוח שכר דירה אחרת באותו בניין.\nהאם על פי פסק דין כהן נ' גולן (ת\"ק 41268-09-12), זכאי בן לקבל עמלת תיווך במקרה זה? מדוע?","o":["כן, משום שהלקוח חתם על טופס הזמנת שירותי תיווך ואין על כך מחלוקת.","לא, מכיוון שבן המתווך לא מסר ללקוח עותק של טופס הזמנת שירותי תיווך, לא ציין את מספר הדירה הספציפית ולא היה הגורם היעיל שהביא להתקשרות.","כן, בן היה הגורם היעיל בביצוע העיסקה, מכיוון שהכיר ללקוח את הבניין, והזמנת התיווך נערכה כדין.","לא, כי בן לא החתים את הלקוח על טופס בלעדיות."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2023-05#7","e":37,"n":7,"s":"ליה, מתווכת מוסמכת ובעלת שליטה בחברה פרטית בע\"מ, מעוניינת לטפל במכירת דירה השייכת לאותה חברה.\nהאם רשאית ליה לתווך בעסקה זאת?","o":["לא, ליה אינה רשאית לתווך בעיסקה, מכיוון שיש לה בה עניין אישי.","כן, אם ליה היא זו שאיתרה את הקונה והראתה לו את הדירה, אין מניעה שתתווך בעסקה זאת.","כן, במקרה כזה ליה תוכל לתווך בעיסקה, אך תהיה זכאית לקבל מחצית מדמי התיווך המוסכמים בלבד.","לא, מכיוון שיש לליה עניין אישי בעיסקה. אולם אם ליה עדכנה את הלקוחות וקיבלה את הסכמתם בכתב לגבי העניין האישי שלה בנכס, ליה זכאית לתווך בעיסקה."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2023-05#8","e":37,"n":8,"s":"מהו \"הסכם משבצת\"?","o":["הסכם הקובע את שיבוצן ומיקומן של הדירות, שיקבלו בעלי המקרקעין בבניין חדש במסגרת עיסקת קומבינציה.","הסכם הקובע את חלוקת האזורים השונים במסגרת תוכנית בניין עיר.","הסכם לחלוקת שטחים משותפים במקרקעין, שהינו דו צדדי בין הרשות המקומית לבין יזם תמ\"א, או הסכם משולש (שאליו מתווספים גם הדיירים כצד להסכם).","הסכם חכירה שנחתם בין רשות מקרקעי ישראל לבין אגודה שיתופית ומגדיר את שטח הקרקע המוחכר לאגודה."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2023-05#9","e":37,"n":9,"s":"אודי מעוניין למכור את דירת המגורים שבבעלותו.\nאילו הוצאות רשאי אודי לנכות לשם קביעת סכום מס השבח שיהיה עליו לשלם לרשויות המס בגין המכירה?","o":["אודי יכול לנכות מסכום השבח את שכר הטרחה ששילם לעורך דין ברכישה ובמכירה, ואלה לא יהיו יותר מ- 2% מערך הנכס.","אודי יכול לנכות מסכום השבח אגרות ששולמו על ידו לרשם המקרקעין, דמי תיווך ששילם ברכישה בגובה של עד 2% מסכום הנכס, וכן את שכר טרחת שמאי מקרקעין ששולם על ידו בקשר עם מכירת הדירה.","אודי יוכל לנכות מסכום השבח את שכר הטרחה ששילם לעורך דין ברכישה ובמכירה, וכן את דמי התיווך ששילם עד גובה 3% מערך הנכס במכירה.","אודי יכול לנכות מסכום השבח את שכר הטרחה ששילם לעורך דין ברכישה בלבד, אך לא במכירה."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2023-05#10","e":37,"n":10,"s":"נילי וגדעון הם בעלי זכות חכירה ל- 99 שנים של דירת מגורים בת 5 חדרים, המשמשת למגוריהם. נילי מפעילה מכון יופי באחד מחדרי הדירה, ואילו גדעון מפעיל בחדר אחר בדירה משרד רואי חשבון. כעת הם מעוניינים למכור את הדירה.\nהאם במקרה הנדון, הדירה תיחשב כ\"דירת מגורים מזכה\" לעניין מס שבח?","o":["כן, משום שמדובר בדירה ששימשה בעיקרה למגוריהם של נילי וגדעון.","לא, משום שנעשה שימוש ב- 50% מהדירה לצורך פעילות עסקית שאינה מגורים.","לא, מאחר שלנילי וגדעון זכות חכירה בלבד, הם לא יוכלו למכור את הדירה כדירת מגורים מזכה.","כן, אבל נילי וגדעון מחזיקים בזכויות בדירה ביחד ולכן, בכל מקרה, לא יכולים להיחשב כ\"יחיד\" לצורך הגדרת \"דירת מגורים\"."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2023-05#11","e":37,"n":11,"s":"מי מבין הבאים אינו רשאי לקבל רישיון תיווך?","o":["מי שטרם מלאו לו 21 שנה.","מי שריצה עונש מאסר בפועל בששת החודשים שקדמו להגשת הבקשה לרישיון תיווך.","מי שנפתחו כנגדו חמישה ויותר תיקי הוצאה לפועל.","מי שנכשל בבחינה לקראת קבלת רישיון תיווך במקרקעין יותר מארבע פעמים."],"c":[1],"a":false,"note":"","sub":"b_license"},{"id":"2023-05#12","e":37,"n":12,"s":"מתווך מחזיק בהזמנת תיווך ובהסכם בלעדיות שנערכו כדין, ומבצע את פעולות התיווך שסוכמו מול הלקוחות בהסכם הבלעדיות מולו.\nלפי פסק הדין בבר\"ע 2285/05 אבנר שמואלי ואח' נ' דורון סמוכה ואח', במקרה שהדירה נמכרה לקונים, שלא באמצעות המתווך, במהלך תקופת הבלעדיות, האם המוכר חייב לשלם את דמי התיווך למתווך?","o":["לא, מכיוון שהמתווך לא היה הגורם היעיל בעיסקה, הוא לא זכאי לדמי תיווך בגינה.","כן, אך במקרה כזה המתווך יהיה זכאי לכל היותר לדמי תיווך בשיעור של 70% מדמי התיווך המוסכמים.","לא, שכן בכל מקרה לא ניתן היה להסכים על תקופת בלעדיות למכירה.","כן, משום שקיימת חזקה שהמתווך הינו הגורם היעיל במכירה."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2023-05#13","e":37,"n":13,"s":"דינה ירשה מאביה את הזכויות בשטח חקלאי, בבעלות המדינה, ששימש לגידול תותים בפאתי פתח תקווה. דינה מעוניינת \"להפשיר\" את הקרקע, על ידי שינוי יעודה של הקרקע מחקלאות למגורים.\nאילו מהתשלומים הבאים יהיה על דינה לשלם, ולאיזו רשות, במידה וישונה יעוד הקרקע כאמור?","o":["דמי הסכמה לרשות מקרקעי ישראל, בגין הסכמתה למהלך של שינוי הייעוד בקרקע.","דמי היוון לרשות מקרקעי ישראל, המגלמים את הערך הכלכלי של שינוי הייעוד.","דמי היתר לרשות מקרקעי ישראל והיטל השבחה לועדה המקומית, בשיעור של 50% מערך ההשבחה שנקבעה בשל שינוי הייעוד.","מס שבח בשיעור של 25% משווי הקרקע החדש לאחר ההפשרה, לרשות המיסים."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2023-05#14","e":37,"n":14,"s":"במכירת דירה חדשה, אילו מהתנאים הבאים חייבים להתקיים על מנת שחברה קבלנית תהיה רשאית לגבות מרוכש דירה חדשה סכום הגבוה מ- 7% מערך הדירה?","o":["מסירת ערבות בנקאית, או פוליסת ביטוח, או רישום שיעבוד, או רישום הערת אזהרה על הדירה הנרכשת.","מסירת המפתח של הדירה הנרכשת.","מסירת המפתח של הדירה הנרכשת ורישום הערת אזהרה לטובת הקונה.","מסירת ערבות אישית לטובת הרוכש מטעם הקבלן."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2023-05#15","e":37,"n":15,"s":"בבעלותה של אסתר דירת מגורים יחידה בישראל, שבה היא חיה לבדה. שווי הדירה כ- 2.5 מיליון ש\"ח. לאסתר יש בת יחידה בשם יסמין. יסמין חיה בשכירות, ואין לה דירת מגורים.\nכמה מס יהיה על יסמין לשלם בגין קבלת הדירה בעתיד בירושה?","o":["הורשה מהווה מכירה ולכן תהיה חבות מלאה הן במס שבח והן במס רכישה.","הורשה אינה מהווה מכירה, ולכן אין חבות במס בזמן ההורשה.","החבות במס שבח תיגזר משווי הדירה (2.5 מיליון ש\"ח). אין חבות במס רכישה.","לא ניתן לקבל פטור ממס שבח, היות שמדובר בדירת ירושה."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2023-05#16","e":37,"n":16,"s":"עמית חתם על חוזה למכירת דירתו למנשה בשנת 2010. שווי המכירה היה מיליון ש\"ח. מנשה שילם לעמית את מלוא התמורה, אך לא פעל לרישום הערת אזהרה לטובתו בלשכת רישום המקרקעין, ואף השאיר את הדירה ריקה. בשנת 2023 מכר עמית את אותה דירה לחיים. שווי המכירה היה מיליון ושמונה מאות אלף ש\"ח. חיים שילם לעמית את מלוא התמורה, לא ידע על עיסקת המכירה למנשה, ורשם הערת אזהרה לטובתו בלשכת רישום המקרקעין.\nלפי ע\"א 2643/97 שלמה גנז נ' בריטיש וקולוניאל חברה בע\"מ ואח', מי מבין השניים (מנשה או חיים) יזכה בדירה?","o":["מנשה יזכה בדירה, שכן הוא היה הראשון שחתם על חוזה הרכישה.","חיים יזכה בדירה, מכיוון שהשני בזמן גובר תמיד, אלא אם הקונה הראשון השלים את העברת הבעלות על שמו בתמורה ובתום לב.","מנשה יזכה בדירה, כל עוד חיים לא השלים רישום מלא של הבעלות על שמו.","חיים יזכה בדירה, שכן שילם את התמורה, פעל בתום לב והספיק לרשום הערת אזהרה ראשון על הנכס."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2023-05#17","e":37,"n":17,"s":"איזה גוף שלטוני מבין הבאים מוסמך לגבות היטל השבחה?","o":["רשות המיסים.","ועדה מקומית לתכנון ובנייה שבשטחה מצויים המקרקעין.","משרד האוצר.","עיריות שבשטחן יותר מ- 25,000 תושבים."],"c":[1],"a":false,"note":"","sub":"p_levy"},{"id":"2023-05#18","e":37,"n":18,"s":"מתווך התבקש על ידי לקוח להכין לו דו\"ח בתשלום, שבו יעריך את שווי דירתו, וזאת לשם הגשת ההערכה לבית המשפט.\nהאם למתווך מותר לערוך הערכת שווי מקרקעין (שומה), במקרה דנן?","o":["מתווך רשאי לבצע הערכת מקרקעין בתשלום, אך ורק ביחס לדירות המצויות באזור עיסוקו, ושיש לו ידע ומיומנות להעריך את שוויין.","מתווך רשאי לבצע הערכה בתשלום של מקרקעין כחלק מעבודתו.","מתווך רשאי לבצע הערכת שווי מקרקעין בתשלום, ובלבד שלא תוגש לבית המשפט.","למתווך אסור לערוך הערכת שווי מקרקעין בתשלום המוגשת לבית המשפט."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2023-05#19","e":37,"n":19,"s":"האם מתווך במקרקעין (המוגדר \"עוסק\" עפ\"י החוק) מחויב לגלות ללקוח את שמו ומספר הזהות שלו, כשהוא מציע ללקוחו לכרות עימו חוזה?","o":["כן, בכל הצעה לכריתת חוזה חייב מתווך לגלות את שמו ומספר הזהות שלו.","לא, החובה קיימת רק בטופס בלעדיות.","כן, אלא אם המתווך כתב את מספר רישיון התיווך שלו.","לא, עוסק אינו מחויב למסור את שמו ואת מספר תעודת הזהות שלו."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2023-05#20","e":37,"n":20,"s":"האם מנהל עיזבון נדרש להגיש דו\"ח לאפוטרופוס הכללי בגין פעילותו במקרקעין?","o":["כן, מנהל עיזבון נדרש להגיש לאפוטרופוס הכללי דין וחשבון לפחות אחת לשנה, וכן בעת פקיעת משרתו.","לא, מנהל עיזבון נדרש להגיש דו\"ח רק לבית המשפט ולא לאפוטרופוס הכללי.","כן, מנהל עיזבון נדרש להגיש דו\"ח לאפוטרופוס הכללי, אך רק בעת סיום תפקידו במכירת הנכס.","לא, מנהל עיזבון לא נדרש להגיש לאפוטרופוס הכללי דו\"ח, אלא אם חויב לעשות כן על ידי בית המשפט בעת מינויו."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2023-05#21","e":37,"n":21,"s":"תהילה שוכרת חנות בדמי מפתח (לאחר שהחליפה דייר קודם כדין). תהילה לא משלמת דמי מפתח לבעלים של החנות מזה 10 שנים, וזאת ללא כל סיבה. הבעלים פינה את תהילה מהחנות והגיש תביעה כנגדה לתשלום דמי המפתח עבור מלוא התקופה שתהילה נמנעה מלשלם לו דמי מפתח.\nעבור איזו תקופה של אי תשלום זכאי הבעלים לקבל מתהילה דמי מפתח?","o":["הבעלים זכאי לדמי מפתח עבור השנה האחרונה בלבד.","הבעלים זכאי לדמי מפתח עבור שלוש השנים האחרונות בלבד.","הבעלים זכאי לדמי מפתח עבור שבע השנים האחרונות בלבד.","הבעלים זכאי לדמי מפתח עבור מלוא התקופה."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2023-05#22","e":37,"n":22,"s":"למי נתונה הסמכות לאשר מקרקעין כ\"שיכון ציבורי\"?","o":["לשר הבינוי והשיכון.","לוועדה המחוזית לתכנון ולבנייה.","לשר האוצר.","לוועדה המקומית לתכנון ולבנייה."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2023-05#23","e":37,"n":23,"s":"בני הזוג מאיר רצו לרכוש דירה \"ללא פגמים או הפתעות\", ולשם כך שכרו את שירותיה של מתווכת מוסמכת. המתווכת מצאה עבור בני הזוג דירה, ונחתם הסכם לרכישת הדירה. מספר ימים לאחר חתימת ההסכם, קיבלו בני הזוג מידע מהשמאי מטעם הבנק, שלפיו יותר ממחצית מהדירה שרכשו נבנתה ללא היתר, ומייד ביטלו את החוזה. המתווכת לא ידעה על כך, ושמעה על הדברים לראשונה מבני הזוג.\nלפי בר\"ע 209/01 זיוה וזאב מאיר נ' טלי שושן ואח', האם זכאית המתווכת לדמי תיווך במקרה זה?","o":["כן, המתווכת זכאית לדמי תיווך מרגע שהביאה את הצדדים לידי הסכם מחייב.","לא, המתווכת אינה זכאית לדמי התיווך, מכיוון שהחוזה בוטל על ידי הרוכש.","לא, המתווכת אינה זכאית לדמי התיווך, מאחר שמדובר במידע מהותי שהיה עליה לבדוק ולגלות ללקוח.","כן, המתווכת זכאית לדמי התיווך, מאחר שאין זה באחריותה לבדוק אם הדירה בנויה בהיתר."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2023-05#24","e":37,"n":24,"s":"מי מהבאים אינו בעל דעה מייעצת בדיוני ועדה מקומית לתכנון ולבנייה?","o":["נציג רשות מקרקעי ישראל.","נציג השר לאיכות הסביבה.","נציג לשכת רישום המקרקעין.","נציג שר התחבורה."],"c":[2],"a":false,"note":"","sub":"p_plans"},{"id":"2023-05#25","e":37,"n":25,"s":"בבניין הרשום בפנקס הבתים המשותפים ולו תקנון מצוי, ישנן חניות משותפות.\nהאם ניתן לייחד או להקצות מקום חנייה קיים לדירה מסוימת שהשוכר המתגורר בה הוא אדם עם מוגבלות? אם כן, מהו הרוב הדרוש מבין בעלי הדירות לאישור הפעולה?","o":["לא ניתן לייחד או להקצות מקום חניה קיים לבעל דירה מסוים, שכן מדובר בשטח משותף.","ניתן לעשות כן ברוב של 100% מבעלי הדירות.","ניתן לעשות כן ברוב של 75% מבעלי הדירות.","ניתן לעשות כן ברוב של 60% מבעלי הדירות."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2023-07#1","e":38,"n":1,"s":"ביום 1.1.2015 רכש ראובן דירת מגורים בסכום של 1,000,000 ש\"ח. ביום 1.1.2022 מכר ראובן את הדירה לשמעון בסכום של 1,500,000 ש\"ח. הדירה לא הייתה דירתו היחידה של ראובן, והוא לא זכאי לפטור ממס שבח. בהסכם המכר נקבע כי במועד החתימה על הסכם המכר יקבל ראובן 50% מהתמורה, ואת היתרה יקבל בתוך 8 חודשים.\nבנסיבות העניין, מתי חייב ראובן לשלם מס שבח?","o":["ראובן חייב לשלם מס שבח בתוך 6 חודשים מיום חתימת ההסכם.","ראובן חייב לשלם מס שבח בתוך 8 חודשים מיום קבלת התשלום הראשון.","ראובן חייב לשלם מס שבח במועד קבלת התשלום הראשון.","ראובן חייב לשלם מס שבח רק עם קבלת התשלום המלא."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"x_gains"},{"id":"2023-07#2","e":38,"n":2,"s":"שמואל הוא בעלים של דירת מגורים יחידה ברמת גן, אותה רכש לפני 10 שנים (להלן – \"הדירה הראשונה\"). ביום 1.1.2023 רכש שמואל מקבלן דירת מגורים נוספת, בפתח תקווה (להלן – \"הדירה הנוספת\"). את החזקה בדירה הנוספת שמואל יקבל לפני 31.12.2023. שמואל מכר את הדירה הראשונה בתוך 10 חודשים מקבלת החזקה בדירה הנוספת.\nהאם תיחשב הדירה הנוספת כ\"דירה יחידה\" לצורך מס רכישה? מדוע?","o":["כן; הואיל ובסופו של דבר נותרה לשמואל דירה אחת, הוא חייב במס רכישה בשיעורים של דירה יחידה.","לא; בעת רכישת הדירה הנוספת מהקבלן הפכה דירה זו לדירה נוספת ולכן לא מדובר בדירה יחידה.","כן; הואיל ושמואל מכר את הדירה הראשונה בתוך פחות משנה מהרגע שקיבל את החזקה בדירה הנוספת.","לא; דירה שנרכשת מקבלן לא נחשבת כדירה יחידה, והרוכש חייב במס רכישה מלא."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2023-07#3","e":38,"n":3,"s":"האחיות גילה ולילי ירשו מאימן דירת מגורים ברמת גן. לכל אחת מהן יש 2 דירות נוספות. בהתאם לצו ירושת אימן, היו זכאיות גילה ולילי להירשם כבעלות הדירה באופן הבא: גילה - מחצית; לילי - מחצית. מאחר שהעיזבון טרם חולק, גילה ולילי הסכימו לחלק ביניהן בהסכם את הדירה באופן שונה מכפי שמופיע בצו הירושה: גילה - 2/5; לילי - 3/5. גילה ולילי לא שילמו זו לזו כספים בגין החלוקה עליה הסכימו.\nהאם גילה ולילי חייבות במס שבח בגין רישום הדירה על שמן בלשכת רישום המקרקעין על פי החלוקה עליה הסכימו?","o":["כל העברה בלשכת רישום מקרקעין, בגין ירושה, תמיד חייבת במס שבח ולכן האחיות חייבות במס.","כל העברה במקרקעין חייבת במס שבח, ולכן האחיות חייבות במס.","אין חובה לשלם מס שבח במקרה זה, מכיוון שבנסיבות המתוארות לא רואים כמכירה חלוקת נכסי עיזבון בין יורשים.","רק לילי חייבת במס שבח במקרה זה, מכיוון שהיא קיבלה חלק גדול יותר מגילה ולכן מדובר בעסקת מקרקעין לכל דבר ועניין."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2023-07#4","e":38,"n":4,"s":"משה הוא בעלים של דירת מגורים (להלן – \"הדירה\"). יוסי מעוניין לרכוש את הדירה. ביום 1.1.2021, לאחר שיוסי בדק את הדירה, נפגשו משה ויוסי במשרדו של עו\"ד ישראלי וחתמו על זכרון דברים, לפיו התחייב משה למכור ליוסי את הדירה בסכום של 1,500,000 ש\"ח. כן נקבעו מועדי מסירת החזקה, מועדי התשלומים, אילו מיסים חייב כל צד לשלם ומתי, וכל יתר התנאים הרלוונטיים להשלמת העיסקה. בעת החתימה על זכרון הדברים, שילם יוסי למשה מקדמה על חשבון הדירה בסך של 100,000 ש\"ח. הצדדים קבעו ביניהם כי ייפגשו עד ליום 11.1.2021 אצל עו\"ד ישראלי כדי לחתום על הסכם מכר רשמי. ביום 11.1.2021 הגיע יוסי למשרדו של עו\"ד ישראלי כדי לחתום על הסכם המכר, אולם משה לא הגיע לפגישה. בשיחת טלפון שערך עו\"ד ישראלי עם משה, הודיע משה כי הציעו לו סכום גבוה יותר מהסכום שנקבע בזכרון הדברים, ולכן הוא לא רוצה למכור ליוסי את הדירה בסכום שהציע.\nלפי פסק דין רבינאי נ' מן שקד, ובהתאם לנסיבות המתוארות לעיל, האם משה יכול לחזור בו מההסכם?","o":["מאחר שלא נחתם הסכם מכר רשמי, משה לא חייב למכור את הדירה ליוסי.","מדובר בהסכם מחייב, הואיל ובזכרון הדברים הסדירו הצדדים את כל הפרטים המהותיים לעיסקה, וגם קבעו כי זכרון הדברים מחייב.","מאחר שיש קונה המוכן לשלם סכום גבוה יותר, משה רשאי לחזור בו מן העיסקה.","הואיל והצדדים עדיין לא דיווחו על העיסקה לרשויות המס, העיסקה לא מחייבת אותם."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2023-07#5","e":38,"n":5,"s":"ביום 1.1.2021 הציע ראובן למכירה את דירתו בכתב לשמעון בסכום של 1,600,000 ש\"ח ונתן לשמעון 14 ימים להודיע לו האם הוא מקבל את ההצעה. לאחר 10 ימים, בטרם ניתנה תשובתו של שמעון, הודיע ראובן לשמעון כי אינו מעוניין עוד למכור לו את הדירה.\nמהו הדין ביחס לאפשרות של ראובן לחזור בו מן ההצעה?","o":["ההצעה ניתנה בכתב, ולכן לא ניתן לבטלה יותר.","ראובן אינו יכול לחזור בו מהצעתו למכור את הדירה לשמעון, כי נתן מועד לקיבולה.","ראובן רשאי לחזור בו מן ההצעה בכל עת.","ראובן רשאי לחזור בו מן ההצעה בכל עת, ובלבד שמסר לשמעון הודעה בכתב על כך."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2023-07#6","e":38,"n":6,"s":"ביום 1.1.2021 הציעה לאה למשה לקנות את דירתה בקרית-אונו במחיר של 1,600,000 ש\"ח. באותו יום נפגשו משה ולאה והיא הראתה לו את הדירה. בו במקום הודיע משה ללאה כי הוא מעוניין לרכוש את דירתה בסכום שהוצע. שבוע לאחר מכן, נפגשו לאה ומשה במשרדו של עו\"ד ישראלי וחתמו על הסכם מכר. באותו מעמד שילם משה ללאה 10% מהתמורה (160,000 ש\"ח) על חשבון הרכישה. באותו יום רשם עו\"ד ישראלי הערת אזהרה לטובת משה. יום למחרת, נפגשה לאה עם חברתה, ליאורה, וסיפרה לה על העיסקה. ליאורה, אשר אהבה מאוד את דירתה של לאה, הציעה ללאה עבורה סכום של 1,800,000 ש\"ח (200,000 ש\"ח יותר ממשה), ואף אמרה לה שתוכל לשלם את הכסף בתוך שבוע ימים בלבד. לאה שמחה על ההצעה של ליאורה ושתיהן חתמו בו במקום על הסכם מכר לדירה.\nזכותו של מי עדיפה לקבלת הדירה, ואיזה הסכם מבין ההסכמים מחייב?","o":["מאחר שלאה וליאורה חתמו על הסכם מכר מאוחר בזמן ובתמורה גבוהה יותר, זכותה של ליאורה עדיפה.","הואיל ומשה עדיין לא שילם ללאה את מלוא התמורה על פי הסכם המכר, לאה היא עדיין הבעלים של הדירה ולכן היא יכולה למכור את הדירה למי שהיא רוצה.","הסכם המכר בין לאה לבין משה מחייב את הצדדים, מכיוון שנחתם מוקדם יותר ונרשמה הערת אזהרה לפיו ולכן זכותו של משה עדיפה.","הואיל והבעלות עדיין לא נרשמה על שם משה בטאבו, אין כל מניעה למכור את הדירה לליאורה, וההסכם עימה מחייב."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2023-07#7","e":38,"n":7,"s":"חנה, מתווכת מקרקעין בעלת רישיון תיווך, חתמה על הסכם תיווך עם ראובן, אשר הציע בית למכירה בהרצליה, בסכום של 7 מיליון ש\"ח. בדרכה לפגישה עם הקונה שמעון, התקשר אליה עו\"ד ישראלי והוכיח לה כי הבעלים האמיתי של הבית הוא יהודה ולא ראובן. חנה המשיכה בדרכה לפגישה עם שמעון, החתימה גם אותו על הסכם תיווך, אך לא שיתפה את שמעון בשיחת הטלפון עם עו\"ד ישראלי.\nהאם חלה חובה על חנה לגלות לשמעון הקונה את המידע שנתגלה לה? מדוע?","o":["כן; מאחר שיהודה הוא לא הלקוח של המתווכת.","לא; חנה מחויבת בסודיות ללקוח שלה, ראובן.","לא; מדובר בייעוץ משפטי שאינו בסמכותה של המתווכת.","כן; אם לא תגלה את המידע, חנה תיתן מידע שגוי באופן מהותי ותפר את חובת תום הלב וההתנהלות בדרך המקובלת כלפי שמעון."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2023-07#8","e":38,"n":8,"s":"האם מתווך חייב לגלות ללקוחו ברכישת נכס שבעלי הנכס נמצא בפשיטת רגל? מדוע?","o":["כן; מדובר בעניין מהותי, ולכן יש לגלותו ללקוח.","כן; בתנאי שגם המוכר הוא הלקוח של המתווך.","לא; מדובר בעניין משפטי סודי וחסוי.","לא; כי גילוי פשיטת רגל יפגע במוכר ובמחיר שניתן לקבל על הנכס."],"c":[0],"a":false,"note":"","sub":"b_duties"},{"id":"2023-07#9","e":38,"n":9,"s":"ועד הבית החליט לערוך תקנון חדש בבית משותף, ולקבוע בו הוראה כי חלק מסוים מהרכוש המשותף יוצמד לדירת הגן בבניין.\nהאם הדבר אפשרי?","o":["הדבר אפשרי, בהחלטה של כל בעלי הדירות.","הדבר לא אפשרי; אסור בכל מקרה להצמיד חלק מסוים מהרכוש המשותף לדירה מסוימת.","הדבר אפשרי, ברוב של בעלי הדירות ששני שליש מהרכוש המשותף צמוד לדירותיהם.","הדבר אפשרי, ברוב של שני שליש מכלל בעלי הדירות."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2023-07#10","e":38,"n":10,"s":"מי יכול להגיש בקשה לתיקון צו רישום בית משותף, ולמי מוגשת הבקשה?","o":["אחד מבעלי הדירות או בעל זכות בדירה יכול להגיש את הבקשה לבית משפט השלום.","כל אחד מבעלי הדירות או בעל זכות בדירה יכול להגיש את הבקשה למפקח על הבתים המשותפים.","בעלי הדירות שלפחות שני שלישים מהרכוש המשותף צמוד לדירותיהם יכולים להגיש את הבקשה לבית משפט השלום או למפקח על הבתים המשותפים.","בעלי הדירות שלפחות שני שלישים מהרכוש המשותף צמוד לדירותיהם יכולים להגיש את הבקשה למפקח על הבתים המשותפים."],"c":[1],"a":false,"note":"","sub":"h_works"},{"id":"2023-07#11","e":38,"n":11,"s":"ועד הבית של בית משותף ברחוב ויטק 9 בתל אביב, החליט להתקשר עם קבלן לשם ביצוע פרויקט של חיזוק בתים משותפים מפני רעידות אדמה. במסגרת הפרויקט, ייבנו דירות חדשות לבניין (וזאת מבלי להרוס ולבנות מחדש את הבניין). כל דיירי הבניין חתמו על הסכמתם לביצוע הפרויקט, למעט חנה. חנה הינה קשישה ונכה המרותקת לביתה באופן קבוע. הקבלן לא מעוניין להציע לה דיור חלופי.\nהאם ניתן לאשר את הפרויקט חרף התנגדותה של חנה?","o":["לא ניתן לאשר את הפרויקט, מכיוון שקיומו טעון הסכמת כל בעלי הדירות.","המפקח על הבתים המשותפים יכול לאשר ביצוע הפרויקט ברוב של 2/3 מבעלי הבתים.","למפקח על הבתים המשותפים אין סמכות לאשר את ביצוע העבודות, אלא אם הוצעו לחנה מגורים חלופיים לתקופת ביצוע העבודות.","המפקח על הבתים המשותפים חייב במקרה זה לאשר את הפרויקט."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2023-07#12","e":38,"n":12,"s":"מוכרים חתמו על הזמנה לשירותי תיווך ובלעדיות למשך חצי שנה למתווך א', אשר ביצע פעולות תיווך כדין. במהלך תקופת הבלעדיות הגיע למוכר מתווך ב' שמצא קונה לנכס. המוכר חתם גם למתווך ב' על טופס הזמנה לשירותי תיווך, ונחתמה עסקה בזכותו.\nעל פי פסק דין אל הנכס נ' שמלצר, מי מהמתווכים זכאי לדמי תיווך?","o":["רק מתווך א', שכן המוכרים חתמו על הסכמה לבלעדיות.","רק מתווך ב', שהיה הגורם היעיל בעיסקה.","שני המתווכים, וכל אחד מהם יקבל דמי תיווך כפי שסוכם עימו ללא הפחתה.","שני המתווכים, אבל עליהם לחלוק בדמי התיווך."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"b_order"},{"id":"2023-07#13","e":38,"n":13,"s":"משכיר חתם למתווך על הסכם בלעדיות בלתי מוגבל בזמן להשכרת חנות. לאחר חודשיים ביקש המשכיר לבטל את הבלעדיות.\nלפי הדין, האם רשאי המשכיר לבטל הסכמתו לבלעדיות להשכרת החנות? מדוע?","o":["כן, בלעדיות לתקופה בלתי מוגבלת בזמן היא חסרת תוקף.","המשכיר יוכל לבטל את הסכם הבלעדיות אך ורק בתום 9 חודשים.","המשכיר יוכל לבטל את הסכם הבלעדיות לאחר חודשיים.","אם בוצעו 2 פעולות שיווק כדין, לא ניתן לבטל את הסכם הבלעדיות."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2023-07#14","e":38,"n":14,"s":"לפי פסק דין שמעון נ' סמיקון, האם קיימת חובה על מתווך להציג לקונה נסח של הנכס שהוא מציע ללקוח?","o":["כן, כחלק מחובתו של המתווך לנהוג בהגינות ובזהירות ובכלל זה למסור מידע מהותי על הנכס.","לא, נסח הוא מסמך משפטי ואסור למתווך לעסוק בו.","כן, אבל רק אם יש עיקולים על הנכס.","לא, זה אינו חלק מתפקידו של מתווך."],"c":[0],"a":false,"note":"","sub":"b_duties"},{"id":"2023-07#15","e":38,"n":15,"s":"על חלקתה של ליאת רשומה זיקת הנאה לטובת חלקתה של דנה, ואולם לא נקבעה תקופה בתנאיה.\nמה תוקף זיקת ההנאה?","o":["זיקת ההנאה תקפה כל עוד לא נמחקה.","זיקת ההנאה תקפה לזמן סביר.","זיקת ההנאה תקפה עד שדנה תמכור את חלקתה.","זיקת ההנאה לא תקפה שכן יש לרשום זיקת הנאה על שם בן אדם."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2023-07#16","e":38,"n":16,"s":"מה ההבדל בין משכנתא למשכון?","o":["משכנתא היא שעבוד על נכס מקרקעין ומשכון הוא שעבוד זכויות.","משכנתא היא הלוואה לרכישת דירה ומשכון זו הלוואה לרכישת רכב.","משכנתא ניתן לרשום רק אם הנכס לא רשום בטאבו, ומשכון ניתן לרשום רק אם הנכס רשום בטאבו.","אין הבדל בין משכנתא למשכון."],"c":[0],"a":false,"note":"","sub":"l_mortgage"},{"id":"2023-07#17","e":38,"n":17,"s":"מה מבין הבאים אינו עשוי להיכלל בתוכנית בניין עיר (תב\"ע)?","o":["תקנון.","תשריט.","נספח שמירה על הסביבה.","גרמושקה של בקשה לקבלת היתר בנייה."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2023-07#18","e":38,"n":18,"s":"האם חקלאי שמעמדו הוא \"בר רשות\" יכול להגדיל את שטח יחידת המגורים שלו?","o":["לא; \"בר רשות\" לא יכול להגדיל את שטח יחידת המגורים שלו.","כן; ל\"בר רשות\" יש רשות להגדיל את שטח יחידת המגורים שלו ללא תנאי.","לא; \"בר רשות\" משמעותו שניתן לפנותו מהקרקע בכל רגע.","כן; \"בר רשות\" יכול להגדיל את שטח מגוריו לפי הזכויות וההסכמים החלים על הקרקע."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2023-07#19","e":38,"n":19,"s":"צביקה הוא בעלים של בית מלון ומעוניין למכור את בית המלון. לצורך כך, צביקה התקשר בהזמנת תיווך עם יוסי המתווך.\nיוסי המתווך ניהל משא ומתן שלא צלח עם חברת \"איתמר\" בע\"מ לגבי רכישת המלון.\nלאחר כשנה פנה נציג הבעלים אל מתווך (מתווך אחר) אשר הצליח לסגור את העיסקה עם חברת \"איתמר\" בע\"מ במחיר חדש.\nיוסי המתווך לא היה מעורב במשא ומתן בשלב זה, וכן לא התבקש לסייע. בסופו של דבר נחתם חוזה רכישה בין הצדדים.\nבנסיבות המתוארות לעיל ולפי פסק דין ע\"א 2144/91 מוסקוביץ נ' ביר, האם זכאי יוסי המתווך לדמי תיווך?","o":["יוסי לא זכאי לדמי תיווך, מכיוון שלא טיפל בעיסקה עד תומה.","יוסי לא זכאי לדמי תיווך, מכיוון שלא סיים את המשא ומתן על המחיר בעיסקה.","יוסי זכאי לדמי תיווך בעיסקה מכיוון שהזמנת תיווך כדין תקפה למשך שנה.","יוסי זכאי לדמי תיווך, מכיוון שנציג הבעלים הוא \"גורם מתערב\" במשא ומתן, שאינו שולל את זכאותו של יוסי לדמי תיווך."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2023-07#20","e":38,"n":20,"s":"תמ״א 38 היא תוכנית המיתאר הארצית לחיזוק מבנים נגד רעידת אדמה. התמ״א כוללת הוראות שנועדו לחזק מבנים שנבנו לפני 1.1.1980 מפני רעידות אדמה, ומאפשרת הוספת שטחי בנייה לבניינים קיימים העוברים חיזוק באמצעות התמ״א. לערן בעלות מלאה על מבנה שנבנה בשנות ה-60, שחציו משמש למגורים וחציו משמש לעסקים ולחנויות. המבנה רשום כבית משותף. ערן מעוניין לדעת האם תמ״א 38/2 יכולה לחול על המבנה שברשותו.\nאיזה מבין התנאים הבאים הוא תנאי מחייב להכנסת הבניין לתמ\"א 38/2?","o":["התנאי המחייב הוא שאין התנגדויות לתוכנית.","התנאי המחייב הוא שעל ערן להסב את השימושים בנכס לשימוש מגורים לפני שיוכל להחיל את הוראות תמ״א 38/2 על המבנה שברשותו.","התנאי המחייב הוא שתמ\"א 38/2 תחול על מבנה ציבור בלבד.","התנאי המחייב הוא שהאישור שניתן לחיזוק המבוקש משתלב בתשתית הקיימת."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2023-07#21","e":38,"n":21,"s":"לראובן משק חקלאי אותו הוא מעבד באגודה השיתופית ״שדה מנגו״ שבגליל. בצוואתו ביקש ראובן להוריש את הנחלה לילדיו דנה ושמעון, כדי שימשיכו לעבד את הקרקע לאחר מותו.\nהאם ניתן להוריש נחלה חקלאית ל- 2 ילדים בצוואה? מדוע?","o":["לא; יש לקבוע את היורשים כבנים ממשיכים ולחלק את הקרקע ביניהם בצוואה.","כן; בתנאי שימונה מנהל עיזבון שיחלק את הרכוש בין האחים.","לא; לא ניתן להוריש נחלה לשני ילדים, אלא יש לקבוע בן ממשיך אחד לנחלה.","כן; ניתן להוריש חלק בלתי מסוים במקרקעין בצוואה לשני ילדים."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2023-07#22","e":38,"n":22,"s":"נדב רכש דירה חדשה מקבלן. אל חוזה המכר צורפו מפרט והוראות תחזוקה ושימוש, כשהן חתומות על ידי הקבלן. הצדדים סיכמו בנספח מיוחד לקצר בשנה אחת את תקופת הבדק לאי-התאמה יסודית, משנתיים לשנה בעניין שקיעה של ריצוף.\nהאם ניתן לקצר את תקופת הבדק לאי התאמה יסודית?","o":["ניתן לקצר את תקופת הבדק רק בהסכמה בכתב ובנספח נפרד, ולכן הצדדים פעלו כדין.","ניתן לקצר את תקופת הבדק אך ורק בנושא שקיעה של הריצוף.","תקופת הבדק היא תקופה מקסימלית בחוק ומותר לקצר אותה גם בעל פה.","לא ניתן לקצר את תקופת הבדק לאי-התאמה יסודית."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2023-07#23","e":38,"n":23,"s":"מהו ״שימוש חורג״ בקרקע או בבניין?","o":["שימוש בנכס מקרקעין השונה מזה שנקבע בתוכנית החלה במקום או בהיתר הבנייה.","שימוש בנכס לפי תוכנית בדבר בינוי או עיצוב אדריכליים החורג מקו הבניין.","שינוי חלוקת שטחי הבנייה המותרים בתוכנית אחת, שהיא תוכנית שאישרה הוועדה המחוזית.","הגדלת מספר יחידות הדיור ללא הגדלת סך השטחים למטרות עיקריות."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2023-07#24","e":38,"n":24,"s":"האם חוק הגנת הדייר חל על בניינים שהם חלק ממשק חקלאי?","o":["כן; אין הגבלה על השכרה בדמי מפתח.","לא; שכירות בדמי מפתח מותרת רק בתוך יישובים עירוניים.","כן; שכירות בדמי מפתח מותרת רק למטרות מגורים ומסחר.","לא; חוק הגנת הדייר לא חל על בניינים שהם חלק ממשק חקלאי."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2023-07#25","e":38,"n":25,"s":"יחיעם הוא מתווך מוסמך. יחיעם לקח לטיפולו בהתנדבות תיווך לזוג עולים חדשים.\nיחיעם לא תרגם את החוזה לשפה שהעולים מבינים ולא גילה להם על חריגת בנייה בנכס שמצא להם.\nבנסיבות המתוארות, האם יחיעם הפר את חוק המתווכים?","o":["כן; אלא אם הצדדים הסכימו מראש ובכתב שהקונה לא ייחשב לקוח.","לא; מתווך לא יכול לתת שירותי תיווך בהתנדבות.","לא; לקוח של מתווך ייחשב רק מי שמשלם עבור התיווך.","כן; בני הזוג מהווים לקוחות לכל דבר ועניין, גם כשהתיווך נעשה ללא תמורה."],"c":[3],"a":false,"note":"","sub":"b_duties"},{"id":"2024-02#1","e":39,"n":1,"s":"שאול הוא מתווך בעל רישיון באזור הקריות. בין שאול ללקוח נחתמה הזמנה בכתב לביצוע פעולת תיווך במקרקעין שתבוצע על ידי שאול באופן אישי. שבוע לאחר מכן, פרץ בין שאול ללקוח ויכוח מר, שבמסגרתו צעק הלקוח על שאול שהוא איטי ועצלן. שאול מצידו הודיע ללקוח שאין בכוונתו לקיים את החוזה בין הצדדים והוא מפסיק לשווק את הדירה. הלקוח הודיע לשאול בתגובה שקיים ביניהם חוזה תקף ולכן הוא דורש ממנו את השירות שהתחייב לו בחוזה.\nבנסיבות העניין, האם ניתן לחייב את שאול לקיים את החוזה? מדוע?","o":["כן; ניתן לחייב את שאול לקיים את החוזה והוא יחויב בפיצוי בגין ההפרה.","כן; עלבון כלפי נותן שירות אף פעם לא מהווה הפרה יסודית של החוזה.","לא; מדובר בכפייה לבצע שירות אישי שלא ניתן לאכוף בבית משפט.","לא; מאחר שהתנהגות הלקוח אינה סבירה."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2024-02#2","e":39,"n":2,"s":"איזו מעבודות הבנייה המנויות להלן לא מחייבת קבלת היתר בנייה?","o":["איחוד דירות הכולל התאמות צנרת.","הקמתו מחדש של בניין קיים.","שינוי פנימי של דירה שאינו נוגע לצד החיצוני של הבניין.","סגירתה של דרך."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2024-02#3","e":39,"n":3,"s":"מיקה משכירה את דירתה בגבעתיים לדנה לתקופה של 6 שנים.\nבנסיבות המתוארות, האם יש חובה לערוך את הסכם השכירות בכתב? האם נדרש לרשום את השכירות במרשם המקרקעין (טאבו)?","o":["העיסקה טעונה מסמך בכתב וגם טעונה רישום.","העיסקה טעונה מסמך בכתב ולא טעונה רישום.","העיסקה לא טעונה מסמך בכתב ולא טעונה רישום.","העיסקה לא טעונה מסמך בכתב, אך טעונה רישום."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2024-02#4","e":39,"n":4,"s":"משה הוא בעלים של דירה הנמצאת בקומה חמישית בבית משותף. משה מעוניין להתקין מעלית בבניין.\nמהו הרוב הדרוש להחלטה כדי שניתן יהיה להתקין את המעלית?","o":["בעלי דירות שבבעלותם שליש מהדירות בבית המשותף רשאים להחליט באסיפה הכללית על התקנת מעלית ברכוש המשותף.","בעלי הדירות שבבעלותם רוב מהדירות ושני שליש מהרכוש המשותף צמוד לדירותיהם, רשאים להחליט באסיפה הכללית על התקנת מעלית ברכוש המשותף.","בעלי הדירות שבבעלותם שני שלישים מהדירות ושלושה רבעים מהרכוש המשותף צמוד לדירותיהם, רשאים להחליט באסיפה הכללית על התקנת מעלית ברכוש המשותף.","בעלי דירות שבבעלותם שני שלישים מהדירות בבית המשותף רשאים להחליט באסיפה הכללית על התקנת מעלית ברכוש המשותף."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2024-02#5","e":39,"n":5,"s":"דן ואמיר רכשו במשותף חלקת אדמה ובנו עליה בית דו משפחתי. הם חתמו על הסכם שיתוף אשר הסדיר את ניהול המקרקעין המשותפים והשימוש בהם ואת זכויותיהם וחובותיהם בכל הנוגע למקרקעין. ההסכם לא נרשם בלשכת רישום המקרקעין. בין היתר, קבע ההסכם כי אף אחד מהשותפים לא יהיה רשאי למכור את חלקו ללא הסכמת השותף האחר במשך 25 שנים מיום הרכישה. כעבור שש שנים מכר דן את ביתו לגדעון.\nבהתייחס להסכם שנחתם בין השותפים, האם אמיר יכול להתנגד למכירה?","o":["אמיר יכול להתנגד למכירה, כי טרם חלפו 25 שנים מאז הרכישה.","אמיר לא יכול להתנגד למכירה, מאחר שהסכם השיתוף לא נרשם בלשכת רישום המקרקעין.","אמיר לא יכול להתנגד למכירה, מאחר שחלפו יותר מ- 5 שנים ממועד חתימת הסכם השיתוף.","אמיר יכול להתנגד למכירה רק אם יתברר שדן לא הציע לו לרכוש את חלקו בקרקע לפני שמכר אותה לגדעון."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2024-02#6","e":39,"n":6,"s":"מהו ההבדל בין 'הקלה' לבין 'שימוש חורג' בתכנון ובנייה?","o":["הקלה היא בנייה בשינוי קל מהוראות התוכנית החלה על הנכס; שימוש חורג הוא שימוש שונה מזה שנקבע בתוכנית החלה על המקום או בהיתר הבנייה.","הקלה היא שימוש שונה מזה שנקבע בתוכנית החלה על המקום או בהיתר הבנייה; שימוש חורג הוא בנייה בשינוי קל מהוראות התוכנית החלה על הנכס.","שימוש חורג אף פעם לא מוגבל בזמן בעוד שהקלה תמיד מוגבלת בזמן.","אין הבדל בין הקלה לשימוש חורג - מדובר באותו היתר."],"c":[0],"a":false,"note":"","sub":"p_permit"},{"id":"2024-02#7","e":39,"n":7,"s":"ליאל וסתיו הם שותפים בקרקע חקלאית, עליה נטועים עצי פרי הדר. בין השניים לא נכרת הסכם שיתוף. מידי שנה, בעת הבשלת הפרי, מגיעה סתיו לפרדס וקוטפת פירות הדר ואוכלת במקום. ליאל מתנגד לכך.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["סתיו רשאית ליהנות מפירות ההדר לפי חלקה במקרקעין.","סתיו רשאית ליהנות מפירות ההדר רק בהסכמתו של ליאל.","סתיו רשאית ליהנות מפירות ההדר, רק אם תשלם לליאל שכר ראוי בעד השימוש.","סתיו לא רשאית כלל ליהנות מפירות ההדר, שכן אין הסכם המאפשר זאת."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2024-02#8","e":39,"n":8,"s":"בחוזה האחיד בין הקבלן \"שוק דירות\" בע\"מ (להלן: \"הקבלן\") לבין לקוחותיו נקבע כי התמורה שתשולם לקבלן תהיה לפי מדד בסיס, ויתרת התשלום תהיה צמודה אך ורק לעליית המדד, ולא תתבטא במקרה של ירידת המדד.\nבנסיבות המתוארות, האם מדובר בתנאי מקפח?","o":["בנסיבות המתוארות חזקה כי מדובר בתנאי מקפח.","כן, מאחר שהמדד נקבע על ידי הרשויות.","לא, כי זכותם של צדדים לחתום על סעיף שמשנה את הוראות החוק.","לא, מכיוון ששר האוצר אישר בצו מיוחד תנאי זה."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2024-02#9","e":39,"n":9,"s":"בהסכם מכר דירה בין ספיר לאברהם נקבע כי \"במקרה של איחור במסירת הדירה לאברהם, ספיר תשלם לאברהם פיצוי בסך של 30,000 ש\"ח עבור כל חודש איחור\". ספיר איחרה בחודשיים במסירת הדירה. הנזק שנגרם לאברהם בפועל נמוך בהרבה מהכתוב בחוזה, והוא עומד על 10,000 ש\"ח לכל התקופה. ספיר מסרבת לשלם את מלוא הפיצוי המוסכם.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ספיר רשאית לבקש מבית המשפט להפחית את הפיצוי המוסכם, אם הפיצויים נקבעו ללא כל יחס סביר לנזק שניתן היה לצפות מראש בעת כריתת החוזה, כתוצאה מסתברת של ההפרה.","ספיר רשאית לבקש מבית המשפט להפחית את הפיצוי המוסכם, רק אם הפקידה מראש את סכום הפיצויים כערבות.","ספיר לא רשאית לבקש מבית המשפט להפחית את הפיצוי המוסכם, מאחר שהיא הסכימה לתנאים אלה מראש.","ספיר לא רשאית לבקש מבית המשפט להפחית את הפיצוי המוסכם, מאחר שמדובר בטעות בכדאיות העיסקה בלבד."],"c":[0],"a":false,"note":"","sub":"c_remedy"},{"id":"2024-02#10","e":39,"n":10,"s":"עדנה רכשה דירה בפרויקט שבנייתו תושלם על ידי הקבלן בתוך שנתיים מיום כריתת החוזה. בחוזה נקבע כי הכסף שתשלם עדנה מובטח בערבות בנקאית.\nכעבור שנה, ולאחר תשלום של 20% ממחיר הדירה, כאשר הבנייה טרם הסתיימה, מבקש הקבלן להחליף את הערבות הבנקאית בשיעבוד חלק יחסי מהקרקע, שעליה נבנית הדירה של עדנה. בחוזה אין התייחסות לנושא זה.\nבנסיבות המתוארות, האם הקבלן רשאי להחליף את הערבות? אם כן מדוע?","o":["לא, מכיוון שטרם הושלמה בניית הדירה וטרם נמסרה החזקה בה לקונה.","כן, רק אם נקבע כך בחוזה בין הקבלן לבנק שהנפיק את הערבות הבנקאית.","לא, שכן לא ניתן לשנות חוזה בדיעבד, גם לא בהסכמת הצדדים.","כן, ובלבד שהקבלן הודיע על כך בכתב לעדנה וקיבל את הסכמת הבנק שהנפיק את הערבות הבנקאית."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2024-02#11","e":39,"n":11,"s":"שניר מונה זה עתה כמנהל העיזבון של המנוחה אסתר. העיזבון כולל נכס מקרקעין. לאסתר יש שני בנים. כדי לכסות את חובות העיזבון יש להציע את הנכס למכירה.\nהאם יש להציע את הנכס לבנים של אסתר לפני אישור המכירה לאדם אחר?","o":["כן, יש להציע לבנים של אסתר תחילה את הנכס, בזמן סביר ובמחיר שאינו נופל ממחיר השוק.","לא, אין זכות קדימה ליורשים במכירת נכס עיזבון.","לא, הרוכשים היו צריכים לסלק את חובות העיזבון לפני שהנכס הוצע למכירה ולכן אין להם זכות קדימה.","כן, היורשים קובעים את זהות הרוכש."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2024-02#12","e":39,"n":12,"s":"האם דייר מוגן לפי חוק הגנת הדייר, שמבקש למכור את זכויות הדיירות המוגנת, יכול לעשות זאת? כיצד עליו לפעול?","o":["הדייר המוגן רשאי למכור את זכויותיו לכל המרבה במחיר, מבלי לקבל את הסכמת הבעלים של הנכס.","דייר מוגן לא יכול למכור את זכות הדיירות המוגנת, כי המדובר בזכות אישית.","דייר מוגן יכול למכור את זכויותיו רק למי שגר איתו בנכס לפחות 6 חודשים.","דייר מוגן רשאי למכור את זכויותיו, רק אם פנה תחילה לבעלים והציע לו לקבל את החזקה בתמורה לסכום שצד ג' מוכן לשלם, וצירף תצהירים לאימות הדברים."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2024-02#13","e":39,"n":13,"s":"נבו חוכר בית פרטי הרשום ברשות מקרקעי ישראל. נבו שילם דמי היוון בעבור הבית ל- 99 שנים. לאחר 10 שנים נבו מוכר את הבית.\nבנסיבות המתוארות האם על נבו לשלם דמי הסכמה בכדי לקבל את הסכמת מנהל מקרקעי ישראל להעברת זכויות החכירה בנכס לצד ג' ומדוע?","o":["נבו צריך לשלם דמי הסכמה, מאחר שבכל העברת זכויות חכירה הרשומות ברשות מקרקעי ישראל תדרוש הרשות דמי הסכמה להעברת הזכויות לצד ג'.","נבו לא צריך לשלם דמי הסכמה, מאחר שחכירה לדורות דינה כבעלות בנכס לכל דבר ועניין, ולכן אין צורך בקבלת הסכמת רשות מקרקעי ישראל להעברת הזכויות לצד ג'.","נבו לא צריך לשלם דמי הסכמה, מאחר שדמי הסכמה אינם נגבים מנכס מהוון.","נבו צריך לשלם דמי הסכמה; יהיה עליו לשלם דמי הסכמה מופחתים ביחס לשנים שעברו מיום ההיוון ועד ליום העברת הזכויות לצד ג'."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2024-02#14","e":39,"n":14,"s":"בבעלות ברוך בית נופש בעיר אילת. מגרש בית הנופש של ברוך גובל עם המגרש של אלי. בשבוע שעבר אושרה במגרש של אלי תוכנית בניין עיר (תב״ע) לבניית מגדל מגורים בן 30 קומות, אשר יחסום לברוך את הנוף לים הנשקף מביתו. ברוך מעוניין לתבוע פיצויים עבור הפגיעה באטרקטיביות של בית הנופש שלו. ברוך רוצה להגיש מייד תביעה.\nלאיזה מוסד על ברוך להגיש תביעה לפיצויים בגין הפגיעה במקרקעין שלו כתוצאה מהתוכנית שאושרה לאלי?","o":["לוועדה המקומית לתכנון ובנייה.","לוועדה המחוזית לתכנון ובנייה.","לבית משפט השלום.","לבית המשפט המחוזי."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2024-02#15","e":39,"n":15,"s":"משה, בעל רישיון תיווך במקרקעין, החתים את יוסף על הזמנה בכתב לביצוע פעולת תיווך במקרקעין. משה ציין בהזמנה בכתב את הפרטים הבאים: שם הלקוח, ו\"דרושה דירה לרכישה ברחובות בסכום של כ- 1.5 מיליון ש\"ח\".\nהאם הזמנת התיווך ערוכה כדין? מדוע?","o":["כן; הזמנת התיווך בכתב תקינה לפי הדין.","לא; היה על משה לכתוב סכום מדויק ולא משוער.","לא; היה על משה לציין גם את הסכום המוסכם של דמי התיווך.","לא; היה על משה לציין את מספר החדרים של הדירה המבוקשת."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2024-02#16","e":39,"n":16,"s":"רועי הוא אדם פרטי שרכש נכס למגורים בשנת 2005.\nבשנת 2015 אושרה תב\"ע שהופקדה בעירייה והעלתה את ערך הנכס ב- 70%.\nבשנת 2020 מכר רועי את הנכס למיכל (גם היא אדם פרטי, אשר רכשה את הנכס לצורכי מגורים).\nבחוזה המכר נכתב: ״היטלים לרשות המקומית ישולמו על ידי הבעלים עד למועד המכירה״.\nאיזה מהמיסים או מההיטלים הבאים, על מיכל לשלם?","o":["מס רכישה.","היטל השבחה.","מס שבח מקרקעין.","מס ערך מוסף."],"c":[0],"a":false,"note":"","sub":"p_levy"},{"id":"2024-02#17","e":39,"n":17,"s":"לפי פסק הדין בעניין ע\"א 2144/91 מוסקוביץ נגד ביר, מה יהיה גובה דמי תיווך אם דמי התיווך לא סוכמו במסגרת הזמנת תיווך?","o":["1% .","2% .","0% .","1.5% ."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"b_fee"},{"id":"2024-02#18","e":39,"n":18,"s":"משה העניק הלוואה לדוד. ההלוואה נרשמה בטאבו כמשכנתה לדירה. המשכנתה רשומה כדין. משה מבקש לממש את המשכנתה, מאחר שדוד לא עמד בתנאי החזר המשכנתה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["משה צריך לפנות לעו\"ד מתוך רשימת עוה\"ד הממונים ככונסי נכסים מטעם בית המשפט ועורך הדין יפרסם מודעה למכירת הדירה בשלושה עיתונים שונים.","משה צריך להגיש בקשה למימוש משכנתה לבית המשפט ומיד לאחריה יהיה רשאי לפרסם את הדירה למכירה.","משה צריך להגיש להוצאה לפועל בקשה למימוש משכנתה. אם דוד לא ישלם את החוב, לאחר שיוזהר כדין, יצווה רשם ההוצאה לפועל על מכירת דירת המגורים.","משה יכול למכור את הדירה ללא צורך בפניה לגורם כלשהו, אך הוא חייב להשיב לדוד את כל הכספים שיקבל ממכירת הדירה אחרי כיסוי החוב של המשכנתא."],"c":[2],"a":false,"note":"","sub":"l_mortgage"},{"id":"2024-02#19","e":39,"n":19,"s":"מוטי, מתווך מקרקעין בעל רישיון, החתים את רוני על טופס הזמנת שירותי תיווך, לפיו הוא יפעל למכירת הדירה של רוני. הוסכם כי מיד עם החתימה על הסכם מכר, ישלם רוני למוטי 2% מסכום התמורה. לאחר כחודש נמצא רוכש ונחתם הסכם מכר. לאחר החתימה על הסכם המכר, הפר הרוכש את הסכם המכר ולא עמד בלוח התשלומים. רוני ביקש לבטל את הסכם המכר עם הרוכש. מוטי דרש מרוני לשלם לו את דמי התיווך, אך רוני סירב בשים לב לכך שהחוזה הופר והוא פנה לבית המשפט לביטולו.\nבנסיבות המתוארות, על פי פסק הדין רע\"א 394/88 א' שושני ואח' נ' אברון את פורת בע\"מ, מהו הדין?","o":["רוני חייב בתשלום דמי התיווך גם במקרה של ביטול ההסכם. רוני לא יוכל לתבוע מהרוכש את דמי התיווך שנאלץ לשלם.","אם החוזה יבוטל כדין, אזי מוטי לא זכאי לקבלת דמי תיווך.","אם החוזה יבוטל כדין, מוטי יהיה זכאי למחצית דמי התיווך.","רוני חייב בתשלום דמי התיווך גם במקרה של ביטול ההסכם. רוני יוכל לתבוע מהרוכש גם את דמי התיווך שנאלץ לשלם."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2024-02#20","e":39,"n":20,"s":"דליה רכשה דירת מגורים חדשה מיזם. לפי המפרט בהסכם המכר, שטח המכר של הדירה הוא 120 מ\"ר + 12 מ\"ר שטח מרפסת. לאחר מסירת הדירה, שכרה דליה את שירותיו של מודד מוסמך שמדד את הדירה וגילה כי שטח הדירה הוא 118.5 מ\"ר בלבד + 12 מ\"ר שטח מרפסת.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מדובר בחריגה מותרת לפי הדין.","לא ניתן לחרוג מהמפרט שבחוזה, הפיצוי נקבע לפי שווי מ\"ר בנוי.","לא ניתן לחרוג מהמפרט שבחוזה, הפיצוי נקבע לפי עלות בנייה של מ\"ר בנוי.","ניתן לחרוג לפי הדין מהמפרט שבחוזה, אך החריגה במקרה זה עולה על המותר לפי הדין."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2024-02#21","e":39,"n":21,"s":"מתווך חתם עם לקוח על הסכם להזמנת שירותי תיווך, למכירת דירתו של הלקוח. רוכש פוטנציאלי חתם על זכרון דברים, הכולל תנאי מתלה, ושולמה מקדמה על חשבון רכישת הדירה. בסופו של יום התנאי המתלה לא התקיים, וזכרון הדברים בוטל כדין. המתווך דרש מהלקוח את דמי התיווך, שכן הסכם התיווך שנחתם קובע כי גם אם העיסקה לא תצא אל הפועל, ישולמו דמי התיווך.\nבנסיבות אלו, על פי פסק הדין ת\"א (חי') 4350/08 אורן דה-כהן נ' זר-גוטמן, האם ישנה במקרה זה זכאות לדמי תיווך?","o":["ככל שאכן נקבע כך בהסכם התיווך, המתווך זכאי לקבלת דמי התיווך.","בשים לב לכך ששולמה מקדמה על חשבון התמורה, המתווך זכאי לקבלת דמי התיווך.","ככל שהתמורה ששולמה עולה על 10% מסכום התמורה, קמה חובה לתשלום דמי התיווך.","מתווך זכאי לדמי תיווך רק כשיש הסכם תקף; כשמתברר שהעיסקה לא יצאה אל הפועל משום שהתנאי המתלה לא התקיים, אין חיוב בדמי תיווך."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2024-02#22","e":39,"n":22,"s":"דניאל, מתווך מקרקעין, חתם עם שמעון על הזמנת תיווך כדין ועל הסכם בלעדיות נפרד למשך 4 חודשים. לפי ההסכם, דניאל ישווק את דירתו של שמעון באופן בלעדי. דניאל הציב שלט פרסום בחלון הדירה במשך כל 4 החודשים והמתין לפניות של רוכשים פוטנציאליים.\nהאם דניאל השלים את התנאים לזכאותו לבלעדיות?","o":["כן, בתנאי שהסכם הבלעדיות נחתם במסמך נפרד.","לא, דניאל לא יכול היה להסתפק בהצבת שלט פרסום בנכס.","כן, מאחר שדניאל פעל כגורם יעיל בפרסום הדירה.","לא, מאחר שאסור שתקופת הבלעדיות תהיה קצרה מ- 6 חודשים."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2024-02#23","e":39,"n":23,"s":"בתחילת שנת 2018 רכשה ריקי דירה, בה התגוררה כשנתיים. בתחילת שנת 2020 החליטה להפעיל בכל שטח הדירה מכון ספא יוקרתי. בסוף שנת 2023 החליטה ריקי לסגור את הספא ולמכור את הדירה.\nבנסיבות המתוארות, האם תוכל ריקי למכור את הדירה כדירת מגורים מזכה לצורך קבלת פטור ממס שבח? מדוע?","o":["כן, כל עוד הדירה שימשה למגוריה בחלק מהתקופה ניתן למכור אותה כדירת מגורים מזכה.","כן, כל עוד הדירה שימשה אותה למגורים יותר מ- 18 חודשים.","לא, משום שהדירה לא שימשה למגורים ב- 4 שנים שלפני המכירה, וגם לא שימשה למגורים ארבע חמישיות מתקופת השבח.","לא, אם חלפו יותר מ- 4 שנים מאז מועד הרכישה, לא ניתן למכור דירה כדירת מגורים מזכה לצורך קבלת פטור ממס שבח."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2024-02#24","e":39,"n":24,"s":"יהונתן רכש דירה וקיבל משכנתה מבנק דיסקונט. לאחר מספר שנים, בעודו ממשיך לשלם את המשכנתה, יהונתן קיבל הודעה לפיה המשכנתה הועברה לבנק לאומי, בכפוף למוסכם בתנאי המשכנתה. יהונתן מסרב לשלם לבנק לאומי, בטענה כי הוא התחייב רק כלפי בנק דיסקונט וכי לא התקבלה הסכמתו להעברה של החוב המשועבד.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["המשכנתה היא של הבנק המלווה בלבד, ולא ניתן להעבירה לאחר.","ניתן להעביר את המשכנתה רק אם בעלי המקרקעין מסכים לכך בכתב.","ניתן להעביר את המשכנתה, בתנאי שהמעביר הינו מוסד פיננסי מוכר בישראל והמועבר הינו בנק ישראל.","ניתן להעביר את המשכנתה ללא הסכמת בעלי המקרקעין, אך יש ליידע את יהונתן על העברת החוב בפועל לבנק אחר."],"c":[3],"a":false,"note":"","sub":"l_mortgage"},{"id":"2024-02#25","e":39,"n":25,"s":"איזה מהמשפטים הבאים לא מוגדר כ\"צורכי ציבור\" לעניין סמכות הוועדה המקומית לתכנון ובנייה, אשר בסמכותה להפקיע קרקעות שנועדו בתוכנית לצורכי ציבור?","o":["זיקת הנאה למעבר בין חלקות.","שטח המיועד להקמת מכללה ציבורית.","שטחי חנייה לחניונים.","שווקים בהיותם מסחריים."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2024-05#1","e":40,"n":1,"s":"מתווך שלח הזמנה לביצוע פעולת תיווך ללקוח באמצעות דואר אלקטרוני, הכוללת את כל הפרטים הנדרשים ואת חתימתו. הלקוח לא חתם על ההזמנה, אולם שלח הודעת דואר אלקטרוני כי הוא מאשר את ההתקשרות.\nהאם נכרת הסכם תיווך מחייב בין המתווך והלקוח? מדוע?","o":["לא; אם הלקוח לא חתם על ההזמנה במקום המיועד לכך, לא נכרת הסכם מחייב.","כן; ההסכם מחייב רק בתנאי שבמסמך ההזמנה מצוין כי אישור באמצעות שליחת דואר אלקטרוני יהווה תחליף לחתימה.","כן; נכרת הסכם מחייב, משום שהתמלאו כל התנאים לכריתת חוזה כדין.","לא; ההסכם מחייב רק אם המתווך מאשר לאחר מכן באמצעות דואר אלקטרוני כי הוא מאשר את העיסקה."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2024-05#2","e":40,"n":2,"s":"אדם נדרש לשלם דמי היוון עבור שימוש בקרקע שבבעלות המדינה.\nלמי מהבאים עליו לשלם את דמי ההיוון?","o":["רשות מקרקעי ישראל.","מיסוי מקרקעין.","מועצה מקומית.","לשכת רישום המקרקעין."],"c":[0],"a":false,"note":"","sub":"ila"},{"id":"2024-05#3","e":40,"n":3,"s":"שותפים רכשו ביחד קרקע מוסדרת (להלן: \"המגרש\"). בשנת 2015 חתמו השותפים על הסכם שיתוף בקשר למגרש. השותפים מעוניינים לברר כעת מה מעמדו של הסכם השיתוף. ההסכם קבע הוראה אחת ויחידה, לפיה שותף אינו רשאי לעשות בחלקו במגרש עיסקה אחרת ללא הסכמת השותפים האחרים.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ההסכם לא תקף כלפי צדדים שלישיים.","ההסכם תקף, בתנאי שנרשמה זכות קדימה על פי ההסכם.","ההסכם תקף, בתנאי שנרשמה זכות קדימה בין יורשים.","ההסכם בין הצדדים אינו תקף."],"c":[3],"a":false,"note":"","sub":"l_shared"},{"id":"2024-05#4","e":40,"n":4,"s":"האם ניתן לרשום דירה בבית משותף כחלקה תלת-מימדית?","o":["לא; דירה בבית משותף יש לרשום בפנקס הבתים המשותפים, ואין תוקף לעיסקה בחלק מסוים במקרקעין.","כן, ניתן לרשום דירה בבית משותף כחלקה תלת-מימדית.","לא ניתן לרשום דירה בבית משותף כחלקה תלת-מימדית, אולם ניתן לרשום כחלקה תלת-מימדית את כל הבית המשותף.","כן, משום שכל דירה היא תלת מימדית."],"c":[2],"a":false,"note":"","sub":"h_works"},{"id":"2024-05#5","e":40,"n":5,"s":"זוג נשוי הינו בעלים משותפים של נכס מקרקעין בו הם מנהלים במשותף עסק מסחרי. לאחרונה נקלעו יחסיהם למשבר, והבעל רוצה להעביר את חלקו בנכס, ללא תמורה, לחברו. האישה טוענת כי על הבעל להציע לה תחילה לרכוש את חלקו.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["האישה צודקת; יש לה זכות קדימה לגבי חלקו של הבעל בנכס.","האישה צודקת; בן זוג לא יכול להעביר נכס המשמש לעסק משותף עם בן הזוג השני, אלא באישור בית המשפט.","האישה טועה; אין לה זכות קדימה בעסק, אלא רק בדירת מגורים משותפת.","האישה טועה, מכיוון שלא רשמה הערת אזהרה לגבי זכותה."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2024-05#6","e":40,"n":6,"s":"דוד פנה ליזם אשר משווק פרויקט חדש למגורים. דוד התקשר בהסכם מכר עם היזם לרכישת דירה \"על הנייר\" בפרויקט. דוד החליט לשלם כבר עכשיו, ביום חתימת ההסכם, 100% ממחיר התמורה. הערובה בהסכם המכר הינה ערבות בנקאית של בנק מלווה לאחר תשלום מלוא התמורה. לפני הבנייה מבקש היזם לרשום הערת אזהרה לטובת דוד במקום ערבות של הבנק.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בקשת היזם הינה בניגוד לחוק. הערת אזהרה אינה ערובה מותרת לפי החוק. היזם נדרש היה להמציא ערבות בנקאית או פוליסת ביטוח לטובת דוד.","בקשת היזם הינה בניגוד לחוק. הערת אזהרה היא אמנם ערובה מותרת לפי החוק, אך במקרה כזה, יש להשלים את הבנייה כדין ולמסור חזקה בנכס תחילה.","בקשת היזם הינה בהתאם לחוק. הערת אזהרה הינה ערובה מקובלת לפי החוק.","בקשת היזם הינה בהתאם לחוק, אך במקרה שבו התמורה משולמת במלואה במעמד חתימת ההסכם, נדרש לקבל אישור מהממונה על חוק המכר."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2024-05#7","e":40,"n":7,"s":"עידו רכש דירה בסיוע מתווך. בהתאם לסיכום בין עידו למתווך, שילם עידו דמי תיווך בשיעור של 3% מסכום העיסקה. עידו מבקש למכור היום את הדירה ומבקש לנכות את סכום דמי התיווך ששילם בעת הרכישה, וזאת על מנת להפחית את החבות במס שבח.\nהאם רשאי עידו לעשות כך?","o":["עידו רשאי לנכות את דמי התיווך במלואם.","עידו רשאי לנכות עד 2% מסכום התמורה של רכישת הדירה.","עידו אינו רשאי לנכות דמי תיווך במקרה המתואר.","עידו רשאי לנכות את דמי התיווך במלואם, בכפוף לכך שפקיד רשות המיסים שוכנע שנסיבות העיסקה המיוחדות שהוסברו לו, הצדיקו תשלום דמי תיווך גבוהים יותר."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2024-05#8","e":40,"n":8,"s":"משה פנה ליוסי, מתווך מקרקעין מוסמך, וביקש ממנו לפעול למכירת דירתו. יוסי החתים את משה על הסכם להזמנת שירותי תיווך, במסגרתו נקבעה תקופת בלעדיות, וכן נקבע כי יוסי יהיה זכאי לקבלת דמי תיווך במהלך תקופה זו, בין אם הדירה נמכרה באמצעותו ובין אם לאו. הדירה נמכרה במהלך תקופת הבלעדיות שלא באמצעות יוסי. משה סירב לשלם את דמי התיווך, לאחר שיוסי ביצע פעולות שיווק כדין.\nלפי פסק הדין: בר\"ע (ת\"א) 2285/05 אבנר שמואלי נ' דורון סמוכה, האם יוסי זכאי לדמי תיווך?","o":["קיים הסכם מחייב בין הצדדים - יוסי זכאי לקבלת דמי תיווך ללא סייג.","קיים הסכם מחייב בין הצדדים - יוסי זכאי לדמי תיווך, מכיוון שביצע את פעולות השיווק לצורך קידום המכירה.","ההסכם אינו חוקי - יוסי לא יכול היה לקבוע בהסכם, כי יקבל דמי תיווך בין אם הדירה תימכר באמצעותו ובין אם לאו.","ההסכם אינו חוקי - יוסי יכול היה לקבוע בהסכם כי יקבל דמי תיווך גם אם הדירה תימכר שלא באמצעותו, אולם היה צריך לקבוע דמי תיווך מופחתים במקרה כזה."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2024-05#9","e":40,"n":9,"s":"דוד רכש דירה חדשה מיזם. לאחר שנה וחצי מיום קבלת החזקה בדירה, נתגלו בעיות וליקויים בדירה. דוד פנה אל היזם בדרישה לתיקון הליקויים.\nהאם היזם עדיין מחויב לתיקון הליקויים בדירה?","o":["תקופת הבדק היא שנה מיום מסירת הדירה, לכן אין חובה על היזם לתקן את הליקויים.","תקופת הבדק היא עד שנתיים מיום מסירת הדירה, לכן קיימת חובה על היזם לתקן את הליקויים.","תקופת הבדק משתנה בין ליקוי לליקוי ולכן יש לבחון את סוג הליקויים.","תקופת הבדק היא עד שבע שנים מיום חתימת הסכם המכר. לכן, יש לבחון מתי נחתם הסכם המכר והאם חלפה תקופת הבדק."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2024-05#10","e":40,"n":10,"s":"יערית רכשה דירה בבית משותף. יערית מעוניינת לשפץ את הדירה באופן יסודי.\nבגין אילו מהעבודות הבאות יערית לא נדרשת לקבל היתר בנייה?","o":["הוספת מרפסת בצד המזרחי של הדירה, שאינו צד חזיתי בבניין.","הרחבת פתחי החלונות בדירה בחזית הפונה לרחוב.","שינוי בחלוקת החדרים בדירה, כך שבמקום דירת 4 חדרים הדירה תשמש כדירת 5 חדרים.","פיצול הדירה ל- 2 דירות קטנות בנות כ- 45 מ\"ר כל אחת, עם דלת כניסה נפרדת לכל דירה מחדר המדרגות."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2024-05#11","e":40,"n":11,"s":"דביר שוחח עם חברו נדב, וסיפר לו כי הוא מחפש לרכוש דירה בנתניה. נדב נזכר כי יש לו חבר אשר מעוניין למכור דירה בנתניה. נדב הציע לדביר ולחברו (בעלי הדירה בנתניה), כי יקשר ביניהם תמורת דמי תיווך בשיעור 1% מהעיסקה. לנדב אין רישיון לעסוק בתיווך.\nלפי פסק הדין ת.פ. 1224/06 מ\"י נ' דוידסון דניאל, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["העיסוק בתיווך ללא רישיון הוא עבירה פלילית.","כל אדם רשאי לעסוק בתיווך במקרקעין, אך אם אין לו רישיון תיווך עליו לעדכן את הצדדים.","כל אדם רשאי לעסוק בתיווך במקרקעין, בתנאי שהוא בעל רישיון תיווך או שהוא עובד אצל מתווך בעל רישיון.","כל אדם רשאי לעסוק בתיווך במקרקעין, אף ללא רישיון תיווך, אך לא יהיה זכאי לדמי תיווך במקרה המתואר."],"c":[0],"a":false,"note":"","sub":"b_license"},{"id":"2024-05#12","e":40,"n":12,"s":"זוג קשישים הינם בעלי קרקע חקלאית מזה שנים רבות. לאחרונה פנה אל בני הזוג מתווך והציע לרכוש מהם את הקרקע. המתווך לא סיפר לבני הזוג כי באותו מועד פורסמה כתבה בעיתון המקומי, לפיה הופקדה תוכנית מיתאר בוועדה המחוזית, שמשמעותה קידום הליך של שינוי יעוד הקרקע מייעוד חקלאי לייעוד למגורים. יש לציין כי המידע על כך היה נגיש לכול. זוג הקשישים, שלא היו מודעים לכך, חתמו על הסכם המכר עם המתווך, אולם יום למחרת החתימה על ההסכם גילו את המידע, ובהתאם לכך דורשים לבטל את החוזה.\nלפי פסק דין ע\"א 2469/06 רונן סויסה ואח' נגד חברת זאגה ואח', מה הדין?","o":["בני הזוג זכאים לבטל את החוזה בשל הטעיה.","בני הזוג זכאים לבטל את החוזה, משום שכל פרט לא נכון שנמסר בעיסקה מקנה זכות לביטול החוזה.","בני הזוג אינם זכאים לבטל את החוזה, כי לא הקונה היטעה אותם.","בני הזוג אינם זכאים לבטל את החוזה עקב הטעיה; המידע היה גלוי לכול והם היו יכולים לבדוק בעצמם את המצב התכנוני טרם המכירה."],"c":[0],"a":false,"note":"","sub":"c_form"},{"id":"2024-05#13","e":40,"n":13,"s":"בחוזה שכירות דירה שנכרת בין משה לבין גילה, השוכרת, נקבע כי איחור במסירת הדירה לשוכרת יזכה אותה בסך של 100 ש\"ח לכל יום איחור. משה איחר למסור את הדירה לגילה במשך חודשיים ולגילה נגרמו בשל האיחור נזקים כספיים גדולים וכן עוגמת נפש רבה.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["גילה רשאית לוותר על הפיצוי המוסכם ולתבוע את נזקיה הממוניים הריאליים.","גילה זכאית לקבל את הפיצוי המוסכם בלבד ולא מעבר לכך.","גילה זכאית לקבל את הפיצוי המוסכם וגם לתבוע כל נזק נוסף.","גילה לא זכאית לוותר על הפיצוי המוסכם ולתבוע את נזקיה הממוניים הריאליים."],"c":[0],"a":false,"note":"","sub":"r_rent"},{"id":"2024-05#14","e":40,"n":14,"s":"יעקב מכר את דירת המגורים שלו ללאה, וזאת באמצעות זיכרון דברים מחייב, המהווה חוזה לכל דבר. הצדדים לא ציינו בזיכרון הדברים מה יהיה מועד מסירת הדירה. הצדדים פנו לבית המשפט בעניין הפרט החסר בזיכרון הדברים.\nעל פי מה ישלים בית המשפט את הפרט החסר של מועד מסירת הדירה?","o":["בית משפט לא משלים פרטים חסרים בחוזים.","בית משפט ישלים את הפרטים החסרים בהתאם לשיקול דעתו.","בית משפט ישלים פרטים לפי הנוהג הקיים בין הצדדים, או לפי הנוהג המקובל בחוזים מאותו סוג.","בית המשפט ייאלץ לבטל את החוזה, כי אין אפשרות להשלים פרט מהותי כזה שלא סוכם במפורש בחוזה מקרקעין."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2024-05#15","e":40,"n":15,"s":"משה, המתווך, החתים את יגאל על הזמנה לביצוע פעולת תיווך, למכירת דירתו. בנוסח ההזמנה, שהוכן מראש על ידי המתווך, נקבע כי הסכם המכר עם הרוכשים ייערך אך ורק על ידי עורך דין לוי.\nבהנחה שנוסח ההזמנה עונה להגדרת \"חוזה אחיד\", האם הסעיף שקבע כי עריכת הסכם המכר תיערך רק ע\"י עו\"ד לוי הוא סעיף תקף?","o":["חזקה שמדובר בתנאי מקפח בחוזה אחיד ולכן יתכן שבית המשפט יבטל את הסעיף.","מדובר בתנאי מקובל הנוגע לשיתוף פעולה בין מתווך לעורך דין ולכן הסעיף תקף.","מדובר בתנאי מקפח רק אם המתווך מקבל עמלה מעורך הדין.","מדובר בסעיף שיגאל היה מודע לקיומו ולכן הסעיף תקף."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2024-05#16","e":40,"n":16,"s":"בין כפיר, בעל מגרש, לבין אריאל, נכרת חוזה המעניק לאריאל זכות מעבר במגרש של כפיר (להלן: \"הזכות\"). אריאל מעוניין למכור את הזכות לשחר.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["בהיעדר הוראה אחרת בחוזה, על אריאל לקבל את הסכמתו של כפיר למכירה.","אריאל רשאי למכור את הזכות לשחר, שכן הוא בעל הזכות.","אריאל אינו רשאי למכור את הזכות, אלא אם השתמש בה בעצמו לפחות 30 שנה.","אריאל רשאי למכור את הזכות רק באישור בית המשפט."],"c":[0],"a":false,"note":"","sub":"l_shared"},{"id":"2024-05#17","e":40,"n":17,"s":"דני התחייב להשכיר לדינה את דירתו למשך שנה. דינה שילמה לו את שכר הדירה לשנה מראש. כעבור יום, ובטרם קיבלה דינה את החזקה בדירה, התחייב דני להשכיר את הדירה ליפית. יפית שילמה לדני שכר דירה לשנה מראש ואף קיבלה חזקה בדירה.\nמה הדין?","o":["אם יפית לא ידעה על ההתחייבות הקודמת לדינה, זכותה של יפית תגבר על זכותה של דינה.","זכותה של דינה גוברת, שכן היא בעלת התחייבות קודמת לזו של יפית.","זכותה של יפית גוברת, רק אם רשמה הערת אזהרה.","זכותה של יפית גוברת, כי כבר שילמה מראש את מלוא דמי השכירות."],"c":[0],"a":false,"note":"","sub":"r_rent"},{"id":"2024-05#18","e":40,"n":18,"s":"רוני מתגורר בבית משותף ומעוניין להתקין על גג הבית המשותף, המהווה רכוש משותף, דוד לחימום מים על ידי השמש. הגג לא משמש את הדיירים לשום מטרה. רוני קיבל היתר להתקנה לפי חוק התכנון והבנייה. גג הבניין קטן ורק מחצית מהדיירים יוכלו להתקין דוודים בדומה לרוני.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["על רוני לקבל את הסכמת כל בעלי הדירות האחרים, טרם התקנת הדוד.","על רוני לקבל את הסכמת רוב בעלי הדירות, טרם התקנת הדוד.","רוני רשאי לבצע את ההתקנה ללא הסכמת כל בעלי הדירות, כי ממילא הגג לא שימש לכל מטרה אחרת ומכיוון שקיבל לכך היתר.","רוני רשאי לבצע את ההתקנה בהסכמת נציגות הבית המשותף בלבד."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2024-05#19","e":40,"n":19,"s":"בחוזה המכר בין קבלן לבין רוכשי הדירות בבית משותף נקבע כי הניהול וההחזקה של הרכוש המשותף יתבצעו למשך שש שנים מיום איכלוס הבניין על ידי חברת הניהול וההחזקה \"דינדין\" בע\"מ.\nבהתאם לתנאים הנ\"ל, האם ניתן להחליף את חברת ההחזקה כעבור שנתיים מאכלוס הבניין?","o":["לא ניתן להחליף את חברת ההחזקה עד שלוש שנים מיום תחילת הניהול וההחזקה.","ניתן להחליף את חברת ההחזקה, מכיוון שמדובר בתנייה מקפחת בחוזה אחיד.","ניתן להחליף את חברת ההחזקה בהחלטה של רוב בעלי הדירות שיש להם 2/3 מהרכוש המשותף הצמוד לבתיהם.","לא ניתן להחליף את חברת ההחזקה, כי החלפת החברה תהווה הפרת חוזה שתקף לשש שנים מול הקבלן."],"c":[0],"a":false,"note":"","sub":"h_common"},{"id":"2024-05#20","e":40,"n":20,"s":"מנחם, בעלים של דירה, חתם על זיכרון דברים למכירת דירתו לקונה. הקונה שילם למנחם באותו מעמד מקדמה על חשבון העיסקה.\nבזיכרון הדברים הופיעו עיקרי העיסקה ונכתב בו כי \"חוזה מפורט ייערך בעוד שבוע\".\nבהתאם לפסק דין ע\"א 158/77 חוה רבינאי נ' חברת מן השקד בע\"מ (בפירוק), האם רשאי הקונה לבקש רישום הערת אזהרה על סמך זיכרון הדברים?","o":["הקונה זכאי לכך, מכיוון שזיכרון הדברים עומד בדרישת הכתב שבסעיף 8 לחוק המקרקעין ומהווה התחייבות לעשות עיסקה.","הקונה זכאי לרישום הערת אזהרה, מכיוון ששילם מקדמה על חשבון התמורה.","הקונה אינו זכאי לרישום הערת אזהרה ללא הסכמת המוכר.","הקונה אינו זכאי לרישום הערת אזהרה, שכן בין השניים נכרת זיכרון דברים בלבד ולא נכרת חוזה מחייב."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2024-05#21","e":40,"n":21,"s":"שלמה שכר דירת מגורים כדייר מוגן בדמי מפתח, ונפטר. לשלמה בת זוג, אשר התגוררה עימו במשך 5 חודשים בסמוך לפטירתו. בנוסף, הוא הותיר שלושה ילדים. דני, אחד מילדיו, התגורר עימו בדירה במשך שנה בסמוך לפטירתו. בת הזוג ושלושת הילדים מעוניינים להמשיך בשכירות המוגנת.\nמי מהם זכאי להמשיך את הזכות לשכירות המוגנת?","o":["עם פטירתו של שלמה אף אחד מהם לא זכאי לכך; הזכות לדייר מוגן בדמי מפתח היא אישית, ולכן פוקעת עם פטירתו.","בת הזוג לא זכאית, משום שהיה עליה להיות בת זוגו ולהתגורר עימו לפחות 6 חודשים בסמוך לפטירתו על מנת שתהפוך לדיירת. שלושת הילדים זכאים לכך.","בת הזוג זכאית ראשונה, ואם היא מוותרת על זכות הדיור, אזי שלושת הילדים יהיו לדיירים. במקרה כזה, לילדים תינתן זכות הבחירה האם להתגורר יחדיו או למכור את זכות השכירות.","רק דני זכאי להמשיך את הזכות לשכירות המוגנת."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2024-05#22","e":40,"n":22,"s":"דניאלה רכשה דירה מקבלן \"על הנייר\". הדירה תיבנה בעוד מספר שנים ותימסר לדניאלה לאחר סיום הבנייה וקבלת טופס 4.\nהאם דניאלה נדרשת לשלם מס רכישה לפי רכישת זכות במקרקעין או לפי רכישת דירת מגורים?","o":["דניאלה תשלם מס רכישה לפי ערך הקרקע, מכיוון שהדירה עדיין לא בנויה.","דניאלה תשלם מס רכישה לפי דירת מגורים, משום שמדובר בדירה שבנייתה טרם נסתיימה, ויש עימה התחייבות מצד המוכר לסיים את הבנייה.","דניאלה תשלם מס רכישה לפי ערך הקרקע; הגדרת דירת מגורים היא שהדירה משמשת למגורים בפועל כעת או שימשה בעבר במשך 18 חודשים לפחות. מאחר שהדירה עדיין לא נבנתה, היא לא עונה להגדרת דירת מגורים.","דניאלה תשלם מס רכישה לפי דירת מגורים; תמיד מחשבים את ערך הקרקע כשהיא בנויה."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2024-05#23","e":40,"n":23,"s":"דניאל חתם על הסכם לרכישת דירה. למוכר הדירה יש חבות במס שבח בגין מכירת הדירה. בהסכם המכר נקבע כי דניאל ישלם סך של 35% מהתמורה במעמד חתימת ההסכם וסך של 65% הנותרים בתוך 3 חודשים, בעת קבלת החזקה בדירה. עוד נקבע, כי המוכר ישלם את מס השבח, בהתאם לשומה עצמית שדיווחו לרשות המיסים באותו רגע. דניאל שילם למוכר את מלוא התמורה.\nהאם היה על דניאל לשלם מקדמה על חשבון תשלום מס שבח?","o":["לא; מכיוון שתשלום מס שבח חל תמיד על המוכר.","כן; דניאל צריך היה לשלם תשלום מקדמת מס שבח על חשבון התמורה בתוך 30 ימים.","לא; המוכר צריך היה לשלם תשלום מקדמת מס שבח על חשבון התמורה בתוך 60 ימים.","כן; דניאל צריך היה לשלם תשלום מקדמת מס שבח מתוך התשלום השני."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"x_gains"},{"id":"2024-05#24","e":40,"n":24,"s":"מהי גרירת משכנתה?","o":["החלפת ההלוואה לנכס כנגד הלוואה מבנק אחר.","החלפת זהות הלווה בנכס המשועבד ללווה אחר.","החלפת ההלוואה לנכס כנגד הלוואה ממוסד חוץ בנקאי.","החלפת הנכס המשועבד לבנק כבטוחה כנגד הלוואה, בנכס אחר."],"c":[3],"a":false,"note":"","sub":"l_mortgage"},{"id":"2024-05#25","e":40,"n":25,"s":"מהו הסכם \"משבצת דו צדדי\"?","o":["הסכם חכירה אשר נחתם בין רשות מקומית לאגודה שיתופית.","הסכם חכירה אשר נחתם בין הסוכנות היהודית לאגודה שיתופית.","הסכם חכירה אשר נחתם בין רשות מקרקעי ישראל לסוכנות היהודית.","הסכם חכירה אשר נחתם בין רשות מקרקעי ישראל לאגודה שיתופית."],"c":[3],"a":false,"note":"","sub":"ila"},{"id":"2024-08#1","e":41,"n":1,"s":"יוסי פנה לחן, שהיא מתווכת במקרקעין, על מנת למצוא דירת מגורים. חן המתווכת הציגה ליוסי דירה, וציינה בפניו כי הדירה מתאימה לדרישותיו. חן ידעה כי בדירה קיימת רטיבות בחדר השינה, אך לא יידעה בכך את יוסי. יוסי רכש את הדירה. בדיעבד (לאחר רכישת הדירה), נודע ליוסי כי יש רטיבות בחדר השינה, וכי חן הייתה מודעת לליקוי. יוסי למד משיחות עם אנשי מקצוע בתחום, כי המדובר בליקוי שלא ניתן לתקן עקב שיפוע בגג, ומשיחה עם שמאי אף למד כי ליקוי שכזה מפחית באופן ניכר את שווי המכירה של הנכס.\nלפי דיני הגנת הצרכן, האם חן הפרה את חובת הגילוי כלפי יוסי כצרכן?","o":["כן, מכיוון שמדובר בפגם המפחית באופן משמעותי את ערך הנכס.","לא, חוק הגנת הצרכן אינו חל על מתווך מקרקעין.","לא, חובת הגילוי לפי חוק הגנת הצרכן חלה רק על מוצרים, ולא על מתן שירותים כגון שירותי תיווך.","לא, מכיוון שחן מחויבת לחובת הגילוי ללקוח שבחוק המתווכים בלבד, ויוסי צריך לבדוק את הנכס בעצמו ולשקול בעצמו את כדאיות הרכישה בהתאם לכך."],"c":[0],"a":false,"note":"","sub":"k_consumer"},{"id":"2024-08#2","e":41,"n":2,"s":"לקוח פנה לעידו, מתווך במקרקעין, לקבלת שירותי תיווך. הצדדים סיכמו שאם עידו יאתר עבור הלקוח דירה מתאימה, ישלם הלקוח דמי תיווך בסך 2% מסכום התמורה. בעקבות האמור, חתם הלקוח על הסכם להזמנת שירותי תיווך במקרקעין מול עידו. בהסכם נפלה טעות סופר ונכתב כי ישולמו דמי תיווך בסך 20%, בתוספת מע\"מ. הצדדים לא הבחינו בטעות שנרשמה בסכום. לאחר מאמץ משמעותי של עידו, הוא הצליח לאתר ללקוח דירה מתאימה, והלקוח חתם על הסכם לרכישת הדירה. כעת הגיע הזמן לשלם את דמי התיווך בהתאם להסכם, שמלבד הטעות האמורה לגבי הסכום, לא נפל בו פגם. הלקוח מצידו זועם על הטעות ומסרב לשלם דמי תיווך.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["הלקוח צריך לשלם דמי תיווך בסך 20%, כפי שהוע
