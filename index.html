לה על הכתב ונחתם.","על הלקוח לשלם 2% דמי תיווך. יש לתקן את החוזה לפי אומד דעת הצדדים, ובהתאם לכך הטעות לא מהווה עילה לביטול החוזה.","הלקוח רשאי לבטל את החוזה כולו עקב הטעות שנפלה בכריתתו, מכיוון שהיא מהותית.","הטעות מהווה סטייה משמעותית מדמי התיווך שסוכמו, ולכן לא ניתן לתקן את הטעות והחוזה בטל ומבוטל בהתאם."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2024-08#3","e":41,"n":3,"s":"דניאל השכיר חנות שבבעלותו לחן. תקופת השכירות נקבעה על ידי הצדדים למשך ארבע שנים. בחוזה נכתב כי על חן השוכרת לשלם את דמי השכירות, בין אם היא משתמשת בנכס, ובין אם לאו. כעבור מספר חודשים מתחילת השכירות נקלעה חן לקשיים כלכליים, והפסיקה לשלם את דמי השכירות. חן פינתה את החנות, אך חיפשה ולא מצאה שוכר חלופי. דניאל מצידו נמנע מלהשכיר את החנות עד לתום תקופת השכירות, וזאת על אף שפנו אליו שוכרים רבים מתאימים, אשר רצו לשכור את החנות. אף אחד מהפונים לשכור את הנכס לא הסכים לשלם את אותם דמי שכירות ששילמה חן, או שהדרך שבה התלבשו לא מצאה חן בעיני דניאל. דניאל דורש מחן לשלם לו את דמי השכירות במלואם, לכל התקופה.\nבנסיבות המתוארות, האם חן חייבת בתשלום דמי השכירות?","o":["חן חייבת בתשלום דמי השכירות עד לתום תקופת השכירות. חן הייתה רשאית למצוא שוכר חלופי, שייכנס בנעליה ובמחדלה לא עשתה כן, כי לא מצאה שוכר מתאים.","חן חייבת בתשלום דמי השכירות עד לתום מחצית מתקופת השכירות.","חן לא חייבת בתשלום דמי השכירות שדורש דניאל, שכן דניאל יכול היה למנוע את הנזק או להקטינו באמצעים סבירים על ידי השכרת המקום לשוכר חלופי.","חן לא חייבת בתשלום דמי שכירות מרגע שפינתה את החנות."],"c":[2],"a":false,"note":"","sub":"r_rent"},{"id":"2024-08#4","e":41,"n":4,"s":"דניאל הוא בעלים רשום כדין בטאבו של קרקע, שעליה התחיל בבנייה של וילה עבור משפחתו. כעת מדינת ישראל מעוניינת לקדם פרויקט ׳מטרו׳, שהוא פרויקט תחבורה תת קרקעי אשר יעבור מתחת לקרקע של דניאל.\nהאם דניאל הוא הבעלים של השטח שמתחת לחלקה שלו, והאם ניתן לפצל את הבעלות לקרקע ולשטח שמתחתיה?","o":["הבעלות בשטח של קרקע מתפשטת בכל המימדים, לרבות העומק שמתחת לשטח הקרקע ובחלל הרום שמעליו, ואין לכך חריגים. לכן, לא ניתן לפצל את הבעלות מתחת לקרקע של דניאל ומעליה ברישום בטאבו.","הבעלות בשטח של קרקע מתפשטת בחלל הרום שמעל הקרקע, אך לא בעומק שמתחת לשטח הקרקע. לכן מימד העומק שמתחת לשטח של קרקע אינו שייך לבעלים פרטיים ואינו רשום על שמם.","העומק שמתחת לקרקע של דניאל שייך לו, אך ניתן להפרידו משאר החלקה ולרשום את החלק שמתחת לקרקע של דניאל כחלקה תלת מימדית.","אין כל אפשרות חוקית לקדם פרויקט ציבורי של המדינה בשטח הרשום כשטח פרטי."],"c":[2],"a":false,"note":"","sub":"l_ownership"},{"id":"2024-08#5","e":41,"n":5,"s":"שמעון ודניאל הינם בעלים בחלקים שווים ב\"מושע\" בקרקע פנויה. בין הצדדים אין הסכם שיתוף המסדיר את אופן השימוש של הצדדים בקרקע. שמעון לקח יוזמה, והפעיל לבדו במקום חניון, בהתאם לחוק, ברוב החלקה, והחניון הניב רווח נאה. דניאל לא התנגד ליוזמה. לאחר כשנה, דניאל דרש משמעון שישלם לו בעבור השימוש שעשה בקרקע.\nהאם שמעון צריך לשלם לדניאל תשלום כלשהו בגין השימוש שעשה בחלקה?","o":["שמעון לא צריך לשלם כל תשלום, משום שעשה שימוש בשטח משותף והעסק הוא שלו בלבד.","שמעון צריך לשלם דמי שימוש ראויים בהתאם לרווחים שהופקו מהשימוש בקרקע לחניון, וזאת בהתאם לחלקו היחסי של דניאל בקרקע.","שמעון צריך לשלם אך ורק דמי שימוש ראויים בקרקע, ואין לדניאל זכות ברווחים של השכרת מקומות חניה, כי הוא עסק פרטי של שמעון.","שמעון לא צריך לשלם כל תשלום שהוא; מכיוון שאין בין הצדדים הסכם שיתוף שמגדיר את חלקו של דניאל בקרקע, כל שותף יכול להשתמש בחלק בלתי מסוים בקרקע כרצונו."],"c":[1],"a":false,"note":"","sub":"l_shared"},{"id":"2024-08#6","e":41,"n":6,"s":"פלוני חתם על הסכם מכר ללא עורכי דין, למכירת דירתו לאלמוני. הסכם המכר אינו קובע הוראות לעניין רישום הערת אזהרה על התחייבות לעשיית עיסקה. הדירה רשומה בפנקס הבתים המשותפים בלשכת רישום המקרקעין. אלמוני פנה לרשם המקרקעין בבקשה לרישום הערת אזהרה בגין הסכם המכר.\nהאם אלמוני יכול לרשום הערת אזהרה?","o":["אין לאלמוני זכות לרשום הערת אזהרה. רק הבעלים הרשום יכול לרשום הערת אזהרה בגין מכירה, וזאת על מנת למנוע נוכלויות במקרקעין.","אלמוני צריך להגיש לרשם המקרקעין את הסכמתו של פלוני לצורך רישום הערת האזהרה, שאז יוכל לרשום הערת אזהרה. ללא הסכמה שכזאת, לא תירשם הערת אזהרה.","רשם המקרקעין ירשום הערת אזהרה לטובת אלמוני, בכפוף לכך שלהנחת דעתו הוכח שפלוני אכן התחייב בכתב לעשות עיסקה במקרקעין.","הרשם אינו מוסמך לרשום הערת אזהרה לטובת אלמוני, ואפשר לרשום הערת אזהרה רק באמצעות בית משפט."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2024-08#7","e":41,"n":7,"s":"שמעון רכש דירה חדשה מקבלן. הוראות הסכם המכר בין הצדדים קובעות כי הפרויקט יקבל ליווי בנקאי מטעם בנק גדול בישראל. שמעון שילם את התשלום הראשון באמצעות פנקס שוברים, וקיבל לידיו ערבות בנקאית. להפתעתו, הבחין שמעון שסכום הערבות שקיבל נמוך מהסכום ששילם על חשבון הדירה. שמעון פנה לבנק, ובבנק השיבו לו שסכום הערבות אינו אמור לכלול את רכיב המע\"מ המשולם.\nהאם הבנק צודק? מדוע?","o":["כן; הערבות הבנקאית לא אמורה לכלול את רכיב המע\"מ בעיסקה.","לא; הערבות הבנקאית אמורה לכלול את כל הסכום ששולם עפ\"י פנקס השוברים.","לא; הערבות הבנקאית אמורה לכלול את כל התשלום ששילם שמעון על דירתו ולהבטיח אותה.","כן, אך רק בכפוף לכך שהקבלן הנפיק ערבות אישית לידי שמעון בגובה סכום המע\"מ."],"c":[0],"a":false,"note":"","sub":"s_apt"},{"id":"2024-08#8","e":41,"n":8,"s":"\"מוגנים ונהנים\" היא שותפות רשומה, אשר שוכרת בית עסק כדייר מוגן מאז שנות ה- 50 של המאה הקודמת. במהלך שנת 2023 עזב אחד השותפים את השותפות, ולשותפות הצטרף שותף חדש. בעל הנכס גילה זאת והודיע לשותפות כי מדובר בהפרה של כללי הדיירות המוגנת בישראל, ולכן על השותפות לפנות את הנכס.\nהאם בעל הנכס צודק? מדוע?","o":["לא; דייר מוגן בעסק אינו יכול להחליף דייר מוגן אחר, אלא אם בעל העסק ביקש לרכוש את חלקו תחילה. מכיוון שבעל העסק לא עשה זאת, הוא טועה.","כן; עזיבה של אחד השותפים בשותפות אינה פוגעת בזכויות הדיירות המוגנת. יחד עם זאת, הצטרפות של שותף חדש לשותפות, מבלי לקבל את אישור בעל הנכס, שוללת את זכות הדיירות המוגנת.","לא; עזיבה או הצטרפות של שותף לשותפות רשומה אינה פוגעת כשלעצמה בזכויות הדיירות המוגנת.","כן; פעילות השותפות הינה פעילות עסקית בנכס, ולכן היא שוללת את זכות הדיירות המוגנת. דיירות מוגנת נועדה למגורים בלבד."],"c":[2],"a":false,"note":"","sub":"r_protected"},{"id":"2024-08#9","e":41,"n":9,"s":"עידו ביקש למכור קרקע שבבעלותו. לצורך כך, התקשר עידו עם יוסי, מתווך במקרקעין, וביקש מיוסי לאתר קונה לקרקע. השניים חתמו על הסכם להזמנת שירותי תיווך. לאחר כשבוע התקשר יוסי לעידו והודיע לו, כי קיים קונה שהציע לרכוש את הזכויות בקרקע בתמורה לסך של 2,000,000 ש\"ח. עידו הסכים, ובהתאם לכך נחתם הסכם מכר מקרקעין. עידו ביקש שלא להיות מעורב כלל בנושא, ולבוא רק לחתימה על הסכם המכר. בדיעבד גילה עידו שהקונה שילם בפועל עבור רכישת הזכויות סך כולל של 2,500,000 ש\"ח, שמתוכם 500,000 ש״ח הגיעו אל המתווך יוסי ללא ידיעת עידו. עידו תבע את המתווך ודרש לקבל את ההפרש ששילם הקונה עבור הקרקע.\nבהתאם לפסק הדין בעניין ע\"א 3597/09 יואל נדב נ' עו\"ד דוד ינובסקי ואח', מה דין הסכום הנוסף ששילם הרוכש בעבור הקרקע?","o":["עידו הסכים למכור את זכויותיו בתמורה לסך של 2 מיליון ש\"ח, ולכן אינו זכאי לקבלת תמורה נוספת.","המתווך נדרש להשיב לעידו את ההפרש בסך 500,000 ש\"ח.","מדובר בדמי תיווך שהם עניין שבין המתווך לרוכש בלבד ולכן לא יקבל עידו סכום נוסף מהמתווך.","בהתאם לפסיקת בית המשפט, אם ההפרש בין הסכום ששילם הרוכש לבין הסכום ששולם למתווך אינו עולה על 25% מסכום התמורה המקורי, המוכר אינו זכאי לקבלת סכום כלשהו."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2024-08#10","e":41,"n":10,"s":"לוועדה המקומית לתכנון ובנייה תל אביב הוגשה תוכנית שבסמכות ועדה מחוזית לתכנון ובנייה.\nכיצד צריכה הוועדה המקומית לפעול?","o":["הוועדה המקומית צריכה להעביר את התוכנית לוועדה המחוזית.","הוועדה המקומית צריכה לדון בתוכנית ולהעביר את המלצותיה לוועדה המחוזית, בתוך 30 ימים מיום שהוגשה לה התוכנית.","הוועדה המקומית צריכה להחזיר את הבקשה למגישים ולהפנות את המגישים לוועדה הנכונה.","הוועדה המקומית צריכה לדחות את הבקשה מחוסר סמכות."],"c":[1],"a":false,"note":"","sub":"p_plans"},{"id":"2024-08#11","e":41,"n":11,"s":"מהם התנאים המינימליים לפי הדין, לצורך זכאות לדמי תיווך על ידי מתווך?","o":["הסכם בלעדיות במסמך נפרד, היותו של המתווך הגורם היעיל בהתקשרות בין הצדדים, הזמנת תיווך בכתב חתומה כדין, רישיון תיווך בתוקף במועד ביצוע העסקה.","הזמנת תיווך בכתב חתומה כדין, ורישיון תיווך בתוקף במועד ביצוע העסקה.","בלעדיות בתוקף, והיותו של המתווך הגורם היעיל להתקשרות בין הצדדים.","היותו של המתווך הגורם היעיל בהתקשרות של הצדדים, הזמנת תיווך בכתב חתומה כדין, ורישיון תיווך בתוקף במועד ביצוע העסקה."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2024-08#12","e":41,"n":12,"s":"דינה רכשה דירת מגורים לפני 17 שנה והתגוררה בה במשך שנתיים. כעבור שנתיים עברה דינה לגור בדירה שכורה, תוך שהשתמשה בדירה שבבעלותה לצורך עסק לבניית ציפורניים. כעת מבקשת דינה למכור את דירתה כדירת מגורים מזכה לצורכי מס שבח.\nהאם דינה רשאית לעשות כן? מדוע?","o":["כן, משום שמדובר בדירת מגורים.","כן, משום שהדירה שימשה למגורים במשך השנתיים האחרונות לפני מכירתה.","לא, משום שהדירה לא שימשה בעיקרה למגורים במרבית תקופת השבח של הדירה, ולא בארבע השנים האחרונות.","לא, משום שהופעל בדירה עסק, ולכן היא אינה עונה להגדרת דירת מגורים לצורכי מס שבח."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2024-08#13","e":41,"n":13,"s":"בהתייחס לפסק הדין בעניין ע״א 3455/06 דה כהן נ׳ עמרם, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["לפי פסק הדין, אין מניעה שתאגיד יספק שירותי תיווך לציבור, אם הבעלים הרשום של התאגיד הוא מתווך בעל רישיון תיווך.","לפי פסק הדין, החוק לא מאפשר מתן שירותי תיווך באמצעות תאגיד, אלא באמצעות מתווכים בלבד.","לפי פסק הדין, תאגיד אינו יכול לתת שירותי תיווך, משום ששם המתווך ופרטיו חייבים להיות כלולים בהזמנת התיווך.","לפי פסק הדין, תאגיד יכול לתת שירותי תיווך לציבור, כל עוד פעולות התיווך נעשות על ידי מתווך בעל רישיון."],"c":[3],"a":false,"note":"","sub":"b_license"},{"id":"2024-08#14","e":41,"n":14,"s":"שירה ביקשה למכור את דירתה. המתווך זריזי מצא לשירה קונה. זריזי ניהל את המשא ומתן והצדדים ניסחו בעזרתו זכרון דברים מפורט, שבו הופיעה ההצעה שהציע הקונה ושירה קיבלה, ותנאי העיסקה הבסיסיים: כתובת, מחיר, מועדי תשלום ומועד מסירת החזקה. הצדדים לחצו ידיים ופתחו בקבוק שמפניה, אך סיכמו לערוך תיקון הגהה במועד התשלום האחרון, כך שמועד התשלום האחרון יוקדם בשבוע מהמועד שכתוב בזכרון הדברים. שירה חתמה על זכרון הדברים, אך הקונה לא הספיק לחתום על זכרון הדברים – אלא רק אישר את זכרון הדברים והתיקון בכתב במשפט ״מאשר את ההסכם״ שנכתב בדואר אלקטרוני, לפני שנסע בדחיפות לחו״ל לתקופה קצרה. כעת שירה מבקשת למכור את דירתה לקונה אחר, שמציע לה סכום גבוה יותר, ומבקשת לדעת האם זכרון הדברים מחייב אותה, מכיוון שהקונה טרם חתם עליו.\nלפי פסק הדין בעניין ע״א 158/77 רבינאי נ׳ מן שקד בע״מ, האם בנסיבות המתוארות זכרון הדברים הוא חוזה מחייב?","o":["לפי פסק הדין, עריכת זכרון דברים היא פעולה משפטית לפי חוק המתווכים במקרקעין, התשנ״ו-1996. מכיוון שלמתווך אסור לסייע בעריכת זכרון דברים, אזי לזכרון הדברים אין תוקף.","לפי פסק הדין, זכרון דברים שכזה עומד בקריטריונים לכריתת חוזה לפי חוק החוזים, החתימה של הרוכש אינה חיונית ובין הצדדים נכרת חוזה בתוקף בהתאם לסעיף 2 לחוק החוזים (חלק כללי), התשל״ג-1973.","לפי פסק הדין, זכרון דברים אינו מחייב, משום שחסרה בו גמירת דעת לפי סעיף 2 לחוק החוזים (חלק כללי), התשל״ג-1973, כל עוד לא נחתם.","לפי פסק הדין זכרון הדברים אינו מחייב משום שעיסקה במקרקעין חייבת להיות בכתב לפי סעיף 6 לחוק המקרקעין, התשכ״ט-1969, ודרישה זו כוללת חתימה."],"c":[1],"a":false,"note":"","sub":"c_form"},{"id":"2024-08#15","e":41,"n":15,"s":"גלית רכשה דירה בבניין הרשום כבית משותף. בבניין קיימות שלוש מעליות: מעלית ימנית, מעלית אמצעית, ומעלית שמאלית. לאחר שגלית נכנסה להתגורר בדירה, היא קיבלה הודעה מוועד הבית, האוסרת על הדיירים להשתמש במעלית הימנית, משום שהיא הוצמדה לדירת הפנטהאוז אשר בקומה 4. עוד נכתב בהודעה, כי השימוש במעלית השמאלית והאמצעית מותר לכל דיירי הבניין.\nהאם ניתן להצמיד מעלית לדירה מסוימת בבניין?","o":["כן; בעלי הדירות רשאים לקבוע בתקנון כי חלק מסוים של הרכוש המשותף יהיה צמוד לדירה פלונית - ובלבד שאם יש עוד מעליות בבניין, ייוותרו רוב המעליות לשימוש כלל הדיירים.","לא, בעלי הדירות רשאים לקבוע בתקנון כי חלק מסוים של הרכוש המשותף יהיה צמוד לדירה פלונית - ובלבד שלא קבעו זאת ביחס לחדרי מדרגות, מעליות, מקלטים ומתקנים המיועדים לשמש את כל בעלי הדירות.","לא, בעלי הדירות לא רשאים לקבוע בתקנון כי חלק מסוים של הרכוש המשותף יהיה צמוד לדירה פלונית.","כן, כל עוד ומי שמשתמש במעלית הוא דייר בבניין."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2024-08#16","e":41,"n":16,"s":"יוחנן וליאור התקשרו ביניהם בחוזה שכירות למשך 4 שנים עם אופציה (ברירה) להארכת השכירות לתקופה נוספת בת 20 שנים. בהסכם נקבע כי הארכת השכירות תבוצע בהתאם להודעה שתימסר בין הצדדים 90 יום לפני תום תקופת השכירות הראשונה.\nהאם במקרה שכזה נדרש רישום השכירות בפנקסי המקרקעין? מדוע?","o":["לא, משום שההסכם נחתם ל- 4 שנים. תקופת האופציה טרם התממשה, ולכן היא לא נחשבת כחייבת ברישום בפנקסי המקרקעין.","לא, משום שאין חובה לרשום שכירות שתוקפה פחות מ- 25 שנה.","כן, משום שישנה חובה לרשום כל שכירות בפנקסי המקרקעין.","כן, משום שתקופת האופציה (הברירה) נספרת בחישוב של תקופת השכירות לצורכי רישום השכירות בפנקסי המקרקעין."],"c":[3],"a":false,"note":"","sub":"r_rent"},{"id":"2024-08#17","e":41,"n":17,"s":"דויד מכר את דירתו ליונתן, תושב חוץ שהחליט לעלות לישראל. מסיבות שונות טרם עלה יונתן לישראל. המכירה נעשתה כנגד תמורה מלאה, אך מסיבות שונות לא נסתיימה ברישום הבעלות של יונתן בפנקסי המקרקעין, ואף לא ברישום הערת אזהרה לטובת יונתן.\nלאחר שנים רבות, דויד החליט למכור את הדירה לרחל. רחל שילמה את מלוא התמורה שביקש ורשמה הערת אזהרה לטובתה, אך לא הספיקה להשלים את רישום הבעלות בדירה על שמה בפנקסי המקרקעין. דויד לקח את התמורה ונעלם. כעבור זמן עלה יונתן לישראל וגילה לתדהמתו כי רחל נמצאת בדירה שרכש. יצוין כי רחל לא היתה מודעת לעיסקה שביצע דויד עם יונתן.\nלפי פסק הדין בע״א 2643/97 שלמה גנז נ׳ בריטיש קולוניאל בע״מ, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["יונתן לא זכאי לאכיפת ההסכם משום שהוא לא רשם הערת אזהרה לטובתו, אך נשמרת לו הזכות להגיש תביעת פיצויים כנגד דויד.","יונתן זכאי לאכיפת ההסכם, משום שהוא הראשון בזמן, ורחל לא השלימה את רישום הבעלות על שמה.","יונתן פעל בחוסר תום לב כשלא רשם הערת אזהרה על שמו, ולכן רחל זוכה בנכס.","דויד המוכר פעל בחוסר תום לב ובמרמה, לכן רחל תזכה בנכס."],"c":[0],"a":false,"note":"","sub":"l_register"},{"id":"2024-08#18","e":41,"n":18,"s":"מאיה מכרה את דירתה לשירה באמצעות מתווך, וחתמה על טופס הזמנת שירותי תיווך כדין. המתווך היה הגורם היעיל בעיסקה, ובעל רישיון תיווך כדין. ההסכם בין מאיה לרוכשת כלל תנאי מתלה, הקובע כי תוקפו של ההסכם כפוף לאישור בית משפט. עוד קבע ההסכם כי עד לאישור בית משפט, יופקד הכסף בנאמנות אצל עורכי דין. בית המשפט אישר את ההסכם (התנאי המתלה התקיים), אך שירה הפרה את ההסכם, וגרמה לביטולו.\nלפי פסק הדין רע״א אנג׳ל שושני ואח׳ נ׳ אברון בע״מ, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["מאיה לא חייבת לשלם את דמי התיווך, מאחר שההסכם הופר ובוטל.","אין חובה לשלם דמי תיווך במקרה שכזה, מכיוון שמדובר בהסכם שכפוף לתנאי מתלה.","על מאיה החובה לשלם למתווך את דמי התיווך, משום שהתנאי המתלה התקיים.","על מאיה החובה לשלם למתווך מרגע שנחתם הסכם מחייב בין הצדדים."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2024-08#19","e":41,"n":19,"s":"שני היא מתווכת במקרקעין. לשני לקוחה אשר מעוניינת למכור דירה. שני פנתה ללימור, שהינה מתווכת במקרקעין, והציעה לה לשתף פעולה בתיווך העיסקה, כך ששני ולימור יחלקו בדמי התיווך. שני החתימה את הלקוחה על הזמנת תיווך כדין והוסיפה את לימור להסכם להזמנת שירותי התיווך מהלקוחה, ביצעה פעולות שיווק בנכס, והעבירה את הרוכשים הפוטנציאליים להמשך טיפול אצל לימור. לאחר מספר חודשים גילתה שני לתדהמתה כי לימור תיווכה את אותה עיסקה, קיבלה דמי תיווך, אך לא העבירה לשני כל תשלום. לימור טוענת שלא נעשה הסכם ביניהן, משום שיש לערוך הסכם תיווך בכתב.\nלפי פסק הדין בעניין ת\"א 35922/07 מרדכי עוז נ' משה עזרא, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["הסכם שיתוף פעולה בין מתווכים במקרקעין חייב להיערך בכתב. לפיכך, משלא נערך הסכם בכתב ונחתם ע\"י הצדדים, שני אינה זכאית לדמי תיווך.","הוראות חוק המתווכים במקרקעין אינן מתייחסות להסכמי שיתוף פעולה בין מתווכים, ולכן לא נדרש הסכם בכתב כדי שלימור תהיה חייבת בתשלום לשני.","כאשר יש שני מתווכים באותה עיסקה, רק המתווך שהיה הגורם היעיל בעיסקה ואיתר את הרוכש יהיה זכאי לדמי תיווך. לפיכך שני אינה זכאית לדמי תיווך.","לפי פסק הדין, שתי המתווכות זכאיות לדמי תיווך, וזאת בתנאי ששני החזיקה הסכם בלעדיות בתוקף ולימור הייתה הגורם היעיל בביצוע העיסקה."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2024-08#20","e":41,"n":20,"s":"דוד הינו מתווך בעל רישיון בתוקף. דוד החתים את ליבנת על הזמנת שירותי תיווך כדין וכן על הסכם בלעדיות לתקופה של חצי שנה, אשר הוארך לתקופה של שנה. בנוסף, ביצע דוד שתי פעולות שיווק כדין.\nכעבור שנתיים מכרה ליבנת את דירתה לקונה שדוד מצא (קונה אשר שינה דעתו מספר פעמים לאורך התקופה).\nאיזו מהסיבות הבאות יכולה להוות סיבה שבגינה עשוי דוד להיות זכאי לדמי תיווך?","o":["היותו הגורם היעיל בביצוע העיסקה.","קיומו של הסכם הבלעדיות בנכס.","ההסכם להזמנת שירותי תיווך שנחתם בין הצדדים, שבו הוארכה תקופת הבלעדיות.","דוד אינו יכול להיות זכאי לדמי תיווך במצב שכזה, משום שהבלעדיות שלו בנכס הסתיימה לפי חוק."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2024-08#21","e":41,"n":21,"s":"לדנית דירה בבעלותה. כשנולד בנה, רכשה דנית עבורו דירה ורשמה את הבעלות בדירה זו על שמו של הבן. כעת דנית מעוניינת למכור את הדירה שבבעלותה.\nבנסיבות המתוארות, האם זכאית דנית לפטור ממס שבח הניתן בגין \"דירת מגורים יחידה\"? מדוע?","o":["כן; לפי החוק, על שמה של דנית רשומה דירת מגורים אחת, והיא מוכרת אותה.","כן, אך הפטור יהיה חלקי. רואים בדירת מגורים הרשומה על שם ילד שטרם מלאו לו 18 כחצי דירה, ולכן דנית תהיה פטורה מתשלום מחצית ממס השבח.","לא; אין פטור ממס שבח בגין ׳דירת מגורים יחידה׳, הפטור של דירת מגורים יחידה הוא פטור ממס רכישה בלבד, ומס שבח מחושב לפי מדרגות בלבד.","לא; דנית נחשבת לפי חוק כמי שבבעלותה שתי דירות מגורים. זאת משום שילדים שטרם מלאו להם 18 והוריהם, נחשבים כ\"מוכר אחד\" לעניין מס שבח."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2024-08#22","e":41,"n":22,"s":"איזה מההיגדים הבאים הוא הנכון ביותר לגבי זמני \"תקופת הבדק\", ו\"תקופת האחריות\" ברכישת דירה חדשה מקבלן לפי חוק?","o":["תקופת הבדק נמשכת שנה מרגע מסירת הדירה לקונה, ותקופת האחריות אורכת שלוש שנים מרגע מסירת הדירה.","תקופת הבדק מתחילה ברגע העמדת הדירה לרשות הקונה, ותקופת האחריות היא לתקופה של שלוש שנים, שתחילתה בסיום תקופת הבדק.","תקופת הבדק נמשכת שנה ממועד מסירת הדירה לקונה, ותקופת האחריות נמשכת שנה נוספת אחריה.","תקופת הבדק נמשכת שבע שנים ממועד מסירת הדירה לקונה, ותקופת האחריות נקבעת בהתאם לזמני האחריות לפי סוג הדירה."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2024-08#23","e":41,"n":23,"s":"מהו \"הסכם שיתוף במקרקעין\"?","o":["הסכם בין דיירים בבית משותף, המתייחס לכלל הנכסים המשותפים, כגון מעליות, מדרגות, קומת הכניסה ועוד.","הסכם בין בני זוג או יורשים במקרקעין.","הסכם שנעשה בין בעלים משותפים באותה חלקה או גוש, לרוב כאשר אין פרצלציה במקרקעין.","הסכם שיתוף ברווחי שכירות במקרקעין בין בעלים שונים בנכס."],"c":[2],"a":false,"note":"","sub":"l_shared"},{"id":"2024-08#24","e":41,"n":24,"s":"מוטי נפטר והשאיר לילדיו, אור ואיריס, עיזבון שכלל דירה בתל אביב ודירה בירושלים. ע\"פ צו הירושה יורשים אור ואיריס את העיזבון בחלקים שווים. אור ואיריס מעוניינים לערוך ביניהם הסכם חלוקת עיזבון, לפיו איריס תקבל לבעלותה את הדירה בירושלים וכן מחצית מהדירה בתל אביב, ואילו אור יקבל לבעלותו את מחצית הדירה הנותרת בתל אביב. יודגש כי ההסכם נעשה ללא שניתנה ע\"י מי מהיורשים תמורה בכסף או בשווה כסף שהגיע מחוץ לנכסי העיזבון.\nהאם מדובר בעסקה החייבת במס? מדוע?","o":["לא; מכיוון שמדובר בחלוקה ראשונה של נכסי העיזבון.","לא; התמורה שהצדדים מעבירים ביניהם בהסכם הירושה פטורה ממס.","כן; האחים מעבירים ביניהם נכסים ולכן חייבים במס גם אם הם קרובי משפחה.","כן; מדובר במתנה בין קרובים המחויבת בשליש מס רכישה."],"c":[0],"a":false,"note":"","sub":"l_ownership"},{"id":"2024-08#25","e":41,"n":25,"s":"בועז החליט לשפץ את ביתו ולהוסיף שטחי בנייה נוספים (ממ\"ד ומרפסת). לצורך כך מבקש בועז לדעת מה אומדן העלויות הנדרשות לצורך תמחור עבודות הבנייה.\nבאיזה מחירון מקובל להשתמש ככלי עזר בנסיבות אלה?","o":["מחירון מדד תשומות הבנייה.","מחירון דקל.","מחירון יד 2 לחישוב שווי נכס.","מחירון משרד הבינוי והשיכון."],"c":[1],"a":false,"note":"","sub":"k_consumer"},{"id":"2024-11#1","e":42,"n":1,"s":"יסמין ויפעת חתמו על הסכם למכירת דירתה של יסמין ליפעת. אחד הנספחים בהסכם עוסק ב- \"מיזוג מרכזי\". לאחר שנמסרה הדירה, התברר שהמזגן המרכזי נהרס ולא ניתן לתקנו. יסמין, המוכרת, הודיעה כי היא עומדת על קיום החוזה, אך מוכנה לבטל בחוזה את ההוראות הנוגעות למחיר המזגן שסוכם, ולהפחית מהמחיר הכולל את עלות ההחלפה, הרכישה וההתקנה של מזגן מרכזי חדש - מזגן שיהיה מאותו סוג בדיוק. יפעת הקונה, מצידה, דורשת לבטל את ההסכם כולו, בטענה שהיא לא מסוגלת לגור בחום של ישראל בדירה ללא מזגן אפילו רגע אחד.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יפעת רשאית לבטל את החלק הנוגע למזגן בלבד, אך היא תוכל לבטל את ההסכם כולו אך ורק אם תוכיח כי היא לא הייתה חותמת על ההסכם אילו ידעה שהמזגן לא תקין ודורש החלפה.","יפעת לא רשאית לבטל את ההסכם, כי המזגן הוא חלק מנספח לחוזה ולא חלק מהחוזה עצמו. זאת ללא קשר לשאלה האם הייתה קונה דירה ללא מזגן תקין.","יפעת לא רשאית לבטל את ההסכם, כי המוכרת מוכנה להחליף את המזגן ולא ניתן להפריד הסכם לחלקים ולקיים רק את חלקו.","יפעת רשאית לבטל את ההסכם, אך עליה לבטל את ההסכם כולו, מכיוון שלא ניתן להפריד הסכם לחלקים, אלא ניתן לבטל את כולו, או לקיים את כולו."],"c":[0],"a":false,"note":"","sub":"s_sale"},{"id":"2024-11#2","e":42,"n":2,"s":"יהונתן מכר להילה דירת מגורים שבה בנה תוספת של חדר נוסף כדין. מדובר בדירתו השנייה של יהונתן, והדירה נמכרה ברווח גדול. לאחר שיהונתן הצהיר על העיסקה לרשות המיסים, הוא חויב בשומת מס שבח בסך 500,000 ש\"ח. הוועדה המקומית שבשטחה מצוי הנכס דרשה ממנו לשלם לה היטל השבחה (שהוא תשלום חובה המכונה גם 'מס השבחה'), בסך של 200,000 ש\"ח.\nבנסיבות המתוארות, האם יהונתן יכול לנכות את היטל ההשבחה ממס שבח מקרקעין?","o":["לא; יש לשלם מס שבח מקרקעין והיטל השבחה, כי שניהם מחושבים לפי עליית הערך של המקרקעין.","כן; היטל השבחה הוא הוצאה מוכרת לצורך חישוב מס שבח מקרקעין.","לא; היטל השבחה הוא לא הוצאה מוכרת לצורך חישוב מס שבח מקרקעין, כי מדובר במיסים נפרדים.","כן, ובלבד ששיעור הניכוי לא יעלה על 15% מעליית הערך."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2024-11#3","e":42,"n":3,"s":"יעקב מתחתן בשעה טובה והוריו רוכשים לו דירה. מאחר שמשפחתו של יעקב עשירה, הוריו החליטו לרכוש את שירותיו של מעצב הדירות הנודע תומר עדש, אשר ידוע בכך שהוא מתאים באופן אישי את העיצוב של הנכס באופן מרגש ועל בסיס היכרות עם בני הזוג. סוכם בין הצדדים מועד לעיצוב הנכס והתאריך שוריין. שבועיים לפני החתונה התקשר המנהל של המעצב ואמר: \"אני מצטער, אבל איש עסקים ידוע מחתן את בתו בדיוק ביום החתונה שלך ומבקש את העיצוב שלו בדירה של בני הזוג, והוא הציע לתומר סכום כפול ממה שסיכמנו איתך. לכן תומר לא מעוניין לבצע את העיצוב אצלך. אבל נשמח לשלוח לך מעצב אחר\".\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הוריו של יעקב לא יכולים לאכוף על המעצב המצליח תומר את החוזה כי לא מדובר בהפרת חוזה, שכן החוזה לא נערך בכתב.","הוריו של יעקב לא יכולים לאכוף על המעצב המצליח תומר את החוזה ולחייב אותו להופיע באופן אישי, אך הם יכולים לתבוע מתומר המעצב פיצויים.","הוריו של יעקב יכולים לתבוע מתומר אכיפה של החוזה, וגם פיצויים.","הוריו של יעקב יכולים לאכוף על המעצב המצליח תומר את החוזה, אבל הם יצטרכו לבחור האם לתבוע אכיפה של החוזה שהופר או פיצוי."],"c":[1],"a":false,"note":"","sub":"c_remedy"},{"id":"2024-11#4","e":42,"n":4,"s":"ברכישת דירה חדשה מקבלן, כאשר מקבל הקבלן מרוכש הדירה סכום העולה על 7% מהמחיר, איזו מהחלופות הבאות איננה קבילה כערובה לטובת הקונים?","o":["ערבות בנקאית.","פוליסת ביטוח.","צ'ק לפקודת הקונה.","הערת אזהרה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2024-11#5","e":42,"n":5,"s":"גיא הוא מתווך במקרקעין. אביתר מבקש מגיא למצוא לו בית להשכרה בדמי מפתח, והוא מבקש ליהנות מזכויות של דייר מוגן במבנה, הנמצא בתוך משק חקלאי באחד המושבים שבאזור מגוריו כיום.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["אין מניעה לשכור בדמי מפתח במקרה זה, מדובר בשכירות משנה מול רשות מקרקעי ישראל (מינהל מקרקעי ישראל).","יש מניעה לשכור בדמי מפתח במקרה זה, משום שאביתר הוא לא קרוב משפחה של בעלי החלקה.","אין מניעה לשכור בדמי מפתח במקרה זה, משום ששכירות בדמי מפתח מותרת למטרות מגורים ומסחר.","יש מניעה להחלת חוק הגנת הדייר במקרה זה, שכן חוק הגנת הדייר לא חל על מבנים שהם חלק ממשק חקלאי."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2024-11#6","e":42,"n":6,"s":"עורך דין יצחקי מונה ע\"י רשם ההוצאה לפועל ככונס נכסים על דירתו של החייב אמנון, במסגרת תיק הוצאה לפועל שנפתח כנגד אמנון. אחרי שהדירה נמכרה, התברר, למרבה הצער, כי עורך דין יצחקי התרשל במילוי תפקידו וגרם נזקים לדירה טרם מסירתה לרוכש.\nבנסיבות המתוארות, מה יכול אמנון לעשות על מנת לקבל פיצוי מכונס הנכסים?","o":["להגיש תביעה בבית משפט נגד כונס הנכסים, מכיוון שבהוצאה לפועל לא ניתן לחייב כונס נכסים בפיצוי. חילוט הכספים ייעשה לאחר מכן בהוצאה לפועל.","להגיש בקשה לרשם ההוצאה לפועל לחיוב כונס הנכסים בפיצוי, וחילוט הערובה שהפקיד.","להגיש בבית משפט השלום בקשה לביטול הליכי הכינוס ולביטול מכירת הדירה ע\"י הכונס.","להגיש בקשה להתמנות ככונס נכסים על המשרד של כונס הנכסים בהוצאה לפועל."],"c":[1],"a":false,"note":"","sub":"k_misc"},{"id":"2024-11#7","e":42,"n":7,"s":"יזם פנה לבנק בבקשה לליווי בנקאי לפרויקט בנייה חדש. הבנק פנה לשמאי מקרקעין בבקשה לערוך דו\"ח כללי המפרט את העלויות המשוערות בפרויקט הבנייה ואת פוטנציאל הרווח שלו.\nבנסיבות המתוארות, כיצד נקרא הדו\"ח אותו ביקש הבנק מהשמאי?","o":["דו\"ח פוטנציאל.","דו\"ח בנק מלווה ליזם.","דו\"ח רווח פרויקט משוער.","דו\"ח אפס."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2024-11#8","e":42,"n":8,"s":"איתי, ספרן שעובד בספרייה העירונית, חתם על הזמנה בכתב לביצוע פעולת תיווך ועל הסכם בלעדיות למתווך המוסמך חן. במסגרת ההסכם בין השניים, התחייב חן לקבל לטיפולו עסקת מכירה של חנות שירש איתי מסבו. השניים הסכימו כי חן יקבל בלעדיות על העסקה ולא קבעו את משך תקופת הבלעדיות.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["תקופת הבלעדיות תסתיים בתום 9 חודשים מיום ההזמנה.","תקופת הבלעדיות תסתיים בתום שנה מיום ההזמנה.","תקופת הבלעדיות תסתיים בתום 6 חודשים מיום ההזמנה.","בהיעדר קביעה בנוגע למשך הבלעדיות, לא תהיה לחן בלעדיות על המכירה."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2024-11#9","e":42,"n":9,"s":"יערית רכשה דירת יד שנייה בת 90 מטר בקומה השלישית בבית משותף. יערית מתכוונת לשפץ את הדירה באופן יסודי לצורך השכרתה.\nבנסיבות המתוארות, ביחס לאיזו מהעבודות הבאות יערית לא נדרשת לקבל היתר בנייה?","o":["הוספת מרפסת שמש בצד המזרחי של הדירה, שאינו צד חזיתי בבניין.","הרחבת פתחי החלונות בדירה בחזית הפונה לרחוב.","שינוי בחלוקת החדרים בדירה, כך שבמקום דירת 4 חדרים הדירה תשמש כדירת 3 חדרים.","פיצול הדירה ל- 2 דירות קטנות בנות כ- 45 מטרים כל אחת, עם דלת כניסה נפרדת לכל דירה מחדר המדרגות."],"c":[2],"a":false,"note":"","sub":"p_permit"},{"id":"2024-11#10","e":42,"n":10,"s":"עדן מעוניין למכור את ביתו ולצורך כך חתם על הסכם להזמנת שירותי תיווך ועל הסכם בלעדיות עם אורי המתווך. אורי פרסם את הבית למכירה ומצא רוכשים פוטנציאליים. לאחר כשבוע אכן נחתם הסכם מכר אצל עורכי הדין. כעת עדן מסרב לשלם את דמי התיווך, בטענה שהופרו תקנות המתווכים הנוגעות להזמנת התיווך. הטענה להפרה הייתה בכך שמספרי תעודות הזהות של עדן ואורי לא היו כתובות על הזמנת שירותי התיווך והסכם הבלעדיות.\nבהתאם לפסק הדין ע\"א 4582/08 אהרון גופר נ' יהודית קאופמן ובנסיבות המתוארות, איזה מהמשפטים הבאים נכון?","o":["אורי לא זכאי לדמי תיווך, מאחר שהפר את התקנות המחייבות בהזמנת התיווך, בכך שמספרי תעודות הזהות של הרוכש והמתווך לא היו כתובות בהסכם התיווך.","אורי זכאי לדמי התיווך, על אף אי מילוי הדרישה לכתיבת מספרי הזיהוי, מאחר שאין ספק ביחס לזהותם של המתווך והלקוח.","אורי לא זכאי לדמי תיווך, מאחר שלא נחתם זיכרון דברים במעמד המשא ומתן.","אורי זכאי לדמי תיווך, אך מאחר שלא מילא באופן מדויק אחרי הוראות החוק, הוא יהיה זכאי רק למחצית מדמי התיווך הכתובים בהסכם."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2024-11#11","e":42,"n":11,"s":"חברת הבנייה \"דירה נאה\" בנתה דירה חדשה והדירה נמכרה לדנה. לחוזה המכר לא צורף מפרט. חודשיים אחרי איכלוס הדירה החדשה גילתה דנה כי המרצפות בדירה הן ברמת איכות בינונית ומטה. דנה חוששת שהמרצפות ייסדקו לאחר זמן קצר ומבקשת מהחברה להחליף אותן במרצפות באיכות גבוהה יותר.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["החברה לא מחויבת לעשות דבר בנוגע למרצפות, כי החברה לא מחויבת לצרף מפרט לחוזה.","החוזה בטל; מאחר שהמפרט חייב להיות חלק בלתי נפרד מן החוזה, דנה יכולה לבקש שיחזירו לה את כל הכסף ששילמה עבור רכישת הדירה.","החברה רשאית למסור לדנה מפרט גם לאחר מסירת החזקה בדירה ובלבד שכל דבר שהיה צריך לפרט במפרט יהיה לפי התקן או תקנות הבנייה.","החברה מחויבת למסור את הדירה לדנה כשכל פרט שהיה צריך לפרט במפרט הוא באיכות גבוהה."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2024-11#12","e":42,"n":12,"s":"למוטי נודע כי לאחרונה אושרה תוכנית בניין עיר מיטיבה, החלה גם לגבי הנכס שלו. התוכנית תעניק תוספת זכויות המאפשרת למוטי לבנות קומה בנויה נוספת לגג הבית בשטח של 200 מ\"ר. מוטי לא מעוניין כרגע לנצל את זכויות הבנייה הנוספות ולהוסיף עוד קומה לנכס שלו, אלא למכור את הנכס.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["מוטי יצטרך לשלם היטל השבחה בגובה 50% מערך הנכס אך ורק אם הוא בונה בפועל לפי התוכנית, וכך גם לגבי מי שיקנה ממנו.","מוטי יחויב בהיטל השבחה מלא בגובה של עד 50% מערך ההשבחה שנקבע, אותו יחויב לשלם באופן מיידי במועד בו נודע לו על אישור התוכנית, גם אם הוא לא מעוניין לנצל את הזכויות הנוספות.","מוטי יחויב בהיטל השבחה לפי התוכנית אך ורק אם הוא מנצל אישית את זכויות הבנייה.","מוטי יחויב בהיטל השבחה בגובה 50% מערך ההשבחה, אך רק כאשר ימכור את זכויותיו בנכס, או כאשר יחליט לבנות לפי זכויות הבנייה הנוספות."],"c":[3],"a":false,"note":"","sub":"p_levy"},{"id":"2024-11#13","e":42,"n":13,"s":"בחודש ינואר 2018 רכשה ריקי דירה למגוריה והתגוררה בה במשך שנתיים. בחודש ינואר 2020 החליטה ריקי לגור בשכירות במקום אחר, ולהפעיל בדירה שרכשה מכון ספא יוקרתי. בחודש דצמבר 2023 החליטה ריקי לסגור את הספא ולמכור את הדירה.\nבנסיבות העניין, האם תוכל ריקי למכור את הדירה כדירת מגורים מזכה לצורך קבלת פטור ממס שבח? מדוע?","o":["כן; כל עוד הדירה שימשה למגוריה בחלק מהתקופה, ניתן למכור אותה כדירת מגורים מזכה.","כן; הדירה בבעלות פרטית ולכן אין מניעה שתיחשב כדירת מגורים מזכה, גם אם הופעל בה עסק.","לא; משום שהדירה לא שימשה למגורים ב- 4 שנים שלפני המכירה, וגם לא שימשה למגורים במרבית תקופת השבח.","לא; אם חלפו יותר מ- 4 שנים מאז מועד הרכישה, לא ניתן למכור דירה כדירת מגורים מזכה לצורך קבלת פטור ממס שבח."],"c":[2],"a":false,"note":"","sub":"x_gains"},{"id":"2024-11#14","e":42,"n":14,"s":"מאיר חתם על הזמנה בכתב לביצוע פעולת תיווך במקרקעין \"בעניין שכירת דירה במגדל ברח׳ ההסתדרות 8 בפתח-תקווה\", שבו מאיר מעוניין לגור. מיד לאחר החתימה הוצגו בפניו מספר דירות במגדל המבוקש. הפרטים של אותן הדירות לא צוינו במפורש בטופס ההזמנה, למעט כתובת המגדל. עוד באותו היום, הודיע מאיר למתווך שהוא לא מעוניין בדירות שהוצגו בפניו, ודרכיהם של השניים נפרדו. מאיר מעוניין להיפגש עם בעליה של דירה אחרת בבניין המשותף, וחושש שמא יהיה חייב לשלם את עמלת התיווך עליה התחייב בהזמנה.\nבנסיבות המתוארות ובהתייחס לפסק הדין בעניין ת״ק 41268-09-12 כהן נ׳ גולן, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["פירוט הנכסים לא מהווה חלק מדרישות התקנות בכל הקשור לטופס ההזמנה, ולכן מאיר לא יהיה חייב בדמי תיווך במקרה זה.","פעולת התיווך לא מתייחסת לדירה הנוספת שמאיר מצא בעצמו באותו בניין, ולכן מאיר לא יהיה חייב בדמי תיווך.","המתווך זכאי לדמי תיווך גם בגין עיסקה המתייחסת לדירה באותו בניין, וזאת מכוח עיקרון תום הלב.","המתווך זכאי לדמי תיווך במקרה זה בכל נכס שימצא מאיר באותו הבניין, כי זה בדיוק מה שכתוב בטופס הזמנת שירותי התיווך."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2024-11#15","e":42,"n":15,"s":"דנה וליאור פנו למתווך חגי בבקשה למציאת רוכש לביתם.\nהמתווך החתים את בני הזוג על הסכם הזמנת שירותי תיווך והסכם בלעדיות למשך שישה חודשים, אך לא ביצע פעולות לשיווק הנכס. לאחר ארבעה חודשים בני הזוג מכרו את ביתם ללא התערבותו של חגי.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["לחגי יש בלעדיות על מכירת הנכס עד 6 חודשים, וכל עוד הדירה נמכרת בזמן הבלעדיות, הוא ייחשב כ׳גורם יעיל׳ ובכל מקרה דנה וליאור יהיו חייבים לשלם לו דמי תיווך.","חגי לא ביצע פעולות שיווק ולכן תקופת הבלעדיות הסתיימה לאחר 1/3 מהתקופה המנויה בהסכם התיווך, כלומר לאחר חודשיים, וחגי אינו נחשב עוד כ׳גורם יעיל׳. דנה וליאור לא צריכים להוכיח כי חגי לא היה גורם יעיל.","בתקופת הבלעדיות מתווך זכאי לדמי תיווך ואין צורך להזדקק לשאלה אם הוא ׳גורם יעיל׳.","תקופת הבלעדיות ביחס לדירה היא שלושה חודשים לכל היותר. גם אם הצדדים כתבו בהסכם תקופה העולה על 3 חודשים."],"c":[1],"a":false,"note":"","sub":"b_order"},{"id":"2024-11#16","e":42,"n":16,"s":"מיכאל מבקש למכור את הזכויות בבית המגורים שלו, אך לדבריו \"צריך לשלם דמי הסכמה למינהל\" (רשות מקרקעי ישראל).\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["הנכס הוא נכס מהוון ולכן יש לשלם דמי הסכמה לרשות מקרקעי ישראל.","מינהל ההנדסה של הוועדה המקומית דורש תשלום בגין הסכמתו למכירת הנכס.","הנכס לא מהוון ולכן יש לשלם דמי הסכמה לרשות מקרקעי ישראל.","תשלום דמי הסכמה למיכאל הוא תנאי הכרחי להעברת זכויות החכירה בנכס לצד ג'."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2024-11#17","e":42,"n":17,"s":"ראובן הוא בעלים של הזכויות במשק חקלאי במושב יוקרתי. את המשק ראובן מעבד במסגרת האגודה השיתופית של המושב. בצוואה שלו ביקש ראובן להוריש את הנחלה לילדיו בחלקים שווים.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["ראובן יכול להוריש את הנחלה לילדיו בחלקים שווים, כי הוא מוגדר כ-״בר רשות״ בהסכם המשבצת החל על הקרקע.","ראובן יכול להוריש את הנחלה לילדיו בחלקים שווים, אבל עליו להפקיד את הצוואה אצל הרשם לענייני ירושה ו/או אצל האפוטרופוס הכללי.","קביעת הבן הממשיך נעשית מראש ומחייבת אישור של האגודה השיתופית ושל רמ״י.","לא ניתן להוריש את הנחלה, מכיוון שלחקלאים באגודה שיתופית אין זכות קניינית בקרקע."],"c":[2,3],"a":false,"note":"תשובה נכונה: תשובות ג וד התקבלו","sub":"ila"},{"id":"2024-11#18","e":42,"n":18,"s":"צחי ודלית רכשו דירה חדשה מקבלן. לצורך רכישת הדירה הם לקחו הלוואה לדיור מהבנק. כאשר ביקשו לרשום את שיעבוד ההלוואה, הקבלן הודיע להם שהרישום אודות השיעבוד בגין לקיחת ההלוואה מהבנק ייעשה ברשם המשכונות וכן במינהל מקרקעי ישראל, וגם בחברה המשכנת.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["חברה משכנת פועלת מטעם הבנק לרישום המשכנתא, שכן לזוג אין זכויות בעלות על הדירה, אלא הבעלות על הדירה היא של הבנק עד לסילוק המשכנתא.","חברה משכנת בונה את הבניין, משכנת בו את הדיירים ומנהלת את רישום הבעלויות בו. החברה המשכנת תרשום ברישומיה את השיעבוד לבנק בגין ההלוואה ואת צחי ודלית כבעלים של הנכס.","חברה משכנת מנהלת את הרישום בפנקסי המקרקעין (טאבו).","חברה משכנת בונה את הבניין ומשכנת בו את הדיירים."],"c":[1,3],"a":false,"note":"תשובה נכונה: תשובות ב וד התקבלו","sub":"l_register"},{"id":"2024-11#19","e":42,"n":19,"s":"ליאור רכש דירה מקבלן בקומה השלישית בפרויקט יוקרה. למרבה הצער, לאחר שהתגורר בדירה כ- 3.5 שנים בלבד, הריצוף בדירה החל לשקוע והתגלו ליקויים נוספים בריצוף, שמקורם בתכנון לקוי. הקבלן סירב לתקן את הליקויים מאחר שלטענתו, בתום תקופת הבדק בגין ליקויים אלו אין לו כל אחריות לביצוע תיקונים בדירה.\nבנסיבות המתוארות, האם על הקבלן קיימת חובה לבצע תיקונים לליקויים שבנכס זה? מדוע?","o":["לא; לפי הדין תקופת הבדק בגין ליקויים אלו היא שנתיים בלבד, ולכן לאחר תקופה זו אין לקבלן אחריות לביצוע תיקונים.","כן; מאחר שמדובר בפרויקט ששווק לציבור כפרויקט יוקרה, חובה על הקבלן לדאוג לתיקון ליקויים שהתגלו בדירה בתוך תקופה של 20 שנה מתום תקופת הבדק.","כן; על הקבלן לתקן את הליקויים, מאחר שחלה כאן תקופת האחריות שבתום תקופת הבדק.","לא; אם הליקויים לא צוינו בפרוטוקול מסירת הדירה ולא התגלו גם ב- 3 חודשים שלאחר המסירה, הקבלן אינו נושא באחריות בגינם."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2024-11#20","e":42,"n":20,"s":"ביום 15.6.2024 מכרה ורד לשמואל דירת מגורים בסכום של 2 מיליון ש\"ח (להלן – הדירה הנמכרת). ורד רכשה את הדירה הנמכרת בשנת 1995. במועד המכירה לשמואל היו בבעלות ורד דירות נוספות, אותן רכשה בשנים קודמות. סוכם בין ורד לשמואל כי במעמד חתימת ההסכם ישלם שמואל לורד 40% מהתמורה, ואת היתרה בתוך 6 חודשים.\nהאם שמואל וורד חייבים בתשלום מקדמת מס שבח?","o":["שמואל וורד לא חייבים בתשלום מקדמת מס שבח, כי ורד רכשה את הדירה בשנת 1995.","שמואל וורד חייבים בתשלום מקדמת מס שבח; ורד תהיה חייבת בתשלום מקדמת מס שבח בשיעור 7.5% מהתמורה.","שמואל וורד לא חייבים בתשלום מקדמת מס שבח, כי מס שבח חל על הקונה.","שמואל וורד חייבים בתשלום מקדמת מס שבח בשיעור 15% מהתמורה."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2024-11#21","e":42,"n":21,"s":"יוסף גר בדירת גג בבית משותף ברח' ז'בוטינסקי בבני ברק. הבית רשום בפנקס הבתים המשותפים וחל עליו התקנון המצוי. כל דייר בבית המשותף משלם עבור הוצאות אחזקת הבית דמי ועד בית בסך 100 ש\"ח לחודש. יו\"ר וועד הבית דרש מיוסף לשלם דמי ועד בית בסך 200 ש\"ח לחודש, הואיל ודירתו של יוסף גדולה פי שתיים מכל שאר הדירות בבניין. יוסף סירב, בטענה שאסור לחייב אותו לשלם יותר מדיירים אחרים בבניין.\nבנסיבות המתוארות, האם יוסף צודק בטענתו? מדוע?","o":["כן; כל דייר בבית משותף משלם ועד בית בסכום שווה.","לא; בעל דירה חייב להשתתף בהוצאות הדרושות להחזקתו התקינה ולניהולו של הרכוש המשותף לפי יחס שטח רצפת דירתו אל שטח הרצפה של כל הדירות בבית המשותף.","לא; בעל דירה חייב לשלם לוועד הבית לפי החלטת ועד הבית ואין התייחסות בחוק לנושא.","כן; אלא אם יוסף מקבל שירות נוסף מהוועד בגין התשלום הנוסף, ששאר הדיירים אינם מקבלים."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2024-11#22","e":42,"n":22,"s":"בית מגורים צמוד קרקע מוצע למכירה. יעל המתווכת מצאה כי קיימת הערת אזהרה לטובת הוועדה המקומית לתכנון ובנייה בדבר תוכנית להפקעת שטח המיועד לדרך המתוכננת לעבור בחלקה עליה בנוי הבית. בתגובה, בעל הנכס עדכן את יעל כי הוועדה המקומית הציעה קרקע חלופית הממוקמת בצידו האחר של המגרש.\nבנסיבות המתוארות, האם אכן הוועדה המקומית רשאית לכרות הסכם עם בעלי מקרקעין פרטיים לצורך הפקעה?","o":["הוועדה המקומית רשאית לבוא לידי הסכם עם בעל מקרקעין שהופקעו על ידיה, כי במקום תשלום יועברו לו מקרקעין אחרים רק אם התקבל אישור מאת רשות מקרקעי ישראל להסכם.","בהתאם לחוק, הוועדה המקומית רשאית לשלם פיצויים כספיים בלבד לטובת שטח ההפקעה ולא לתת שטח חלופי.","הוועדה המקומית לא רשאית לכרות הסכמים עם בעל קרקע פרטי; אם מתקיימת הפקעה, נקבע תשלום זהה ואחיד לכל בעלי הקרקעות בגין ההפקעה.","הוועדה המקומית רשאית, בתנאים מסוימים, לבוא לידי הסכם עם בעל מקרקעין שהופקעו על ידיה, כי במקום תשלום יועברו לו מקרקעין אחרים."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2024-11#23","e":42,"n":23,"s":"יואל הוא בעל תואר שני במשפטים ועוסק בתחום הנדל\"ן מזה שנים רבות. יואל פעיל במיוחד בעיר הרצליה, בה הוא מתגורר. בעברו היה יואל יזם מקרקעין ובנה מספר בניינים בהרצליה. בנוסף לכך אף עסק בשיווק פרויקטים. כיום יואל מלווה משקיעים ואנשים אשר מעוניינים לייצר הכנסה פאסיבית ולהגיע לחופש כלכלי.\nלאחרונה התבקש יואל לבצע הערכת שווי תמורת תשלום לדירת מגורים בבניין בו שיווק מספר דירות בעבר.\nבנסיבות המתוארות, איזה מהמשפטים הבאים הוא הנכון ביותר?","o":["יואל יכול לבצע הערכת שווי בתנאי שקיבל היתר לכך מלשכת שמאי המקרקעין.","יואל לא יכול לבצע הערכת שווי בתשלום, אלא אם הוא בעל רישיון שמאי מקרקעין.","כמשפטן וכיזם נדל\"ן יואל יכול לבצע הערכת שווי בתשלום באזור בו הוא מתמחה.","יואל יכול לבצע הערכת שווי בתשלום במקרה זה אם הוא בעל רישיון לתיווך במקרקעין."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2024-11#24","e":42,"n":24,"s":"נמרוד הוא מתווך מקרקעין מזה 15 שנים. בינואר 2023 החתים נמרוד את משה על טופס הזמנת שירותי תיווך בנוגע לרכישת דירה בקומה חמישית ואחרונה בבניין בפתח תקווה ששווייה הועמד על סך 2 מיליון ש\"ח. משה התחייב לשלם דמי תיווך בשיעור 2% משווי העיסקה, אולם היתנה את רכישת הדירה בכך שניתן יהיה לבנות תוספת של 2 חדרים מעל הדירה.\nנמרוד הבטיח למשה שאכן יש היתר לבנות את התוספת מעל הדירה, אך ידע, ולא טרח לציין בפניו כי ההיתר בתוקף רק עד חודש מרץ 2023. בחודש מרץ 2023 נחתם הסכם מכר, ומשה שילם לנמרוד את דמי התיווך במלואם. מבדיקה שערך משה מול העירייה התברר לו כי נמרוד לא אמר לו שההיתר הוגבל בזמן, וכעת ההיתר לא רלוונטי. משה טוען כי נמרוד הפר את חובותיו המקצועיות כלפיו.\nבנסיבות המתוארות, האם משה צודק? מדוע?","o":["לא; היה על משה לבצע את כל הבדיקות הרלוונטיות בקשר לדירה ולא לסמוך על נמרוד בעניין.","לא; נמרוד לא מוסמך לייעץ בנושאים של תכנון ובנייה בנכס שהוא מתווך.","כן; ההגבלה בזמן היא פרט מהותי שהיה ידוע לנמרוד והיה עליו לגלותו למשה במסגרת חובת הנאמנות והגילוי שלו ללקוח כמתווך.","כן; אבל רק אם נמרוד מייצג את משה בלבד ולא גם את הצד השני."],"c":[2],"a":false,"note":"","sub":"b_duties"},{"id":"2024-11#25","e":42,"n":25,"s":"ניב מעוניין למכור חנות ברחוב דיזנגוף בתל אביב בסכום של 4 מיליון ש\"ח. החנות היא הנכס היחיד שבבעלות ניב, לא היה בבעלותו כל נכס אחר ב- 4 השנים האחרונות, והוא לא מכר כל נכס בפטור ממס שבח בארבע השנים האחרונות.\nבנסיבות המתוארות, האם ניב זכאי לפטור ממס שבח?","o":["כן; החנות היא הנכס היחיד של ניב ולכן הוא זכאי לפטור מלא ממס שבח.","כן; ניב מעולם לא השתמש בפטור ממס שבח ולכן הוא זכאי לפטור מלא.","לא; מכירת נכס במחיר של 4 מיליון ש\"ח אינה מזכה בפטור ממס שבח.","לא; חנות לא פטורה ממס שבח במכירתה."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2025-02#1","e":43,"n":1,"s":"ביום 1.1.2020 רכשה גילה דירת מגורים חדשה מקבלן. הקבלן התחייב בהסכם המכר להעמיד לרשות גילה את הדירה בתוך שנה מיום הרכישה. הבנייה התעכבה עקב מחלוקת פנימית בין הקבלן לבין עובדיו, וכתוצאה מכך הקבלן העמיד את הדירה לרשות גילה באיחור של 7 חודשים מהמועד שנקבע בהסכם. בהסכם לא נקבע מנגנון לפיצוי במקרה כזה.\nהאם זכאית גילה לפיצוי מהקבלן בגין העיכוב במסירת הדירה? מדוע?","o":["לא; שבעה חודשים זו תקופת איחור סבירה, ולא תקופה שבגינה מגיע פיצוי בגין איחור במסירה לפי החוק.","כן; בכל מקרה מגיע לגילה פיצוי, מכיוון שמדובר בהפרת החוזה. זאת, גם אם העיכוב הוא רק של יום.","כן; גילה זכאית לפיצוי, אך זאת רק לאחר שחלפו שישים יום מתום המועד הקבוע לכך בחוזה המכר.","לא; אלא אם גילה תצליח להוכיח את נזקיה."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2025-02#2","e":43,"n":2,"s":"יוסי עסק בתיווך מקרקעין ב- 5 השנים האחרונות לסירוגין. יוסי פגש את גילה במקרה בבית קפה בקניון לב המפרץ, והיא ספרה לו שהיא מעוניינת למכור את הדירה המדהימה שלה בקרית מוצקין בסכום של 2 מיליון שקל. יוסי ענה, שאמנם רישיון התיווך שלו, כפי שהיה באותה עת, אינו בתוקף, אולם הוא יהיה מוכן לסייע בכל זאת עם התיווך במקרה זה. יוסי איתר עבור גילה קונה, אשר רכש מגילה את הדירה במהירות, לפני שיוסי הספיק לחדש את רישיון התיווך שלו, ולפני שהספיק לשלוח לגילה טופס הזמנת תיווך לחתימתה. לאחר כחודש שלח יוסי לגילה דרישת תשלום דמי תיווך בשיעור 2% משווי העיסקה. גילה סירבה לשלם ליוסי דמי תיווך, בטענה כי יוסי אינו זכאי לדמי תיווך, הואיל ואינו עומד בתנאי החוק.\nבנסיבות אלה, האם לפי החוק גילה חייבת בתשלום דמי התיווך?","o":["כן; יוסי היה הגורם היעיל בעיסקה, ולכן עמד בתנאים לזכאות לתשלום דמי תיווך.","לא; זאת משום שיוסי לא היה הגורם היעיל בעיסקה.","לא; משום שיוסי לא מחזיק בהזמנת תיווך בכתב כדין, ולא היה בעל רישיון תיווך בתוקף במועד העיסקה.","כן; מכיוון שלפי החוק אם הלקוח יזם את הפניה למתווך הוא חייב לשלם דמי תיווך אזי הוא חייב לשלם דמי תיווך בכל מקרה."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2025-02#3","e":43,"n":3,"s":"מתווך החתים לקוח על טופס הזמנת שירותי תיווך. בהזמנה נכתב כי ״דמי התיווך יעמדו על 2% ממחיר העיסקה״. הלקוח הבין כי מחיר זה כולל מע״מ ואמר זאת, והמתווך מצידו לא תיקן את הלקוח. העיסקה בוצעה כדין, והמתווך כעת זכאי לדמי תיווך. אלא שאז התגלעה מחלוקת בין הצדדים לגבי שאלת המע״מ: המתווך שביצע את העיסקה דורש מהלקוח לשלם דמי תיווך של 2% בתוספת מע״מ. הלקוח טוען כי המע״מ לא צוין בהזמנת התיווך ולכן אין להוסיפו.\nבנסיבות אלה, האם יש חובה לכתוב במפורש את תוספת המע״מ בהזמנת התיווך?","o":["אין חובה שחלה על המתווך להתייחס למע״מ בהזמנת תיווך.","קיימת חובה על המתווך להתייחס לשאלה האם דמי התיווך כוללים מע״מ.","רק כאשר הקונה הינו עוסק מורשה, על המתווך להתייחס למע״מ.","אין חובה שחלה על המתווך להתייחס למע״מ בהסכם הזמנת תיווך כיוון שהמע״מ נגבה לפי שיעור המע״מ בעת החתימה על ההסכם."],"c":[1],"a":false,"note":"","sub":"b_fee"},{"id":"2025-02#4","e":43,"n":4,"s":"מוכר מקרקעין שלח הצעה להסכם מכר בדואר אלקטרוני, הכוללת את כל הפרטים הנדרשים לצורך ההצעה, ואת חתימתו. הקונה לא חתם על ההזמנה אך שלח הודעה בדוא״ל כי גמר אומר בדעתו לאשר את ההסכם.\nלפי פסק הדין ע״א 158/77 רבינאי נגד מן שקד, האם בנסיבות אלה נכרת הסכם מכר מחייב בין המוכר והקונה ?","o":["אם הרוכש אינו חותם על החוזה במקום המיועד לכך, אז לא נכרת מצד הרוכש חוזה מחייב.","נכרת חוזה מחייב בין הצדדים, אך ורק בתנאי שבחוזה מצוין כי אישור באמצעות שליחת דואר אלקטרוני יהווה תחליף לחתימה של הרוכש על המסמך.","בין הצדדים נכרת חוזה מחייב ללא חתימת הרוכש .","נכרת חוזה מחייב בין הצדדים אך ורק אם מוכר מאשר לאחר חתימת הרוכש באמצעות דואר אלקטרוני כי הוא מאשר סופית את העיסקה."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2025-02#5","e":43,"n":5,"s":"הדיירים בבית משותף ברחוב אלנבי בתל אביב מבקשים לחזק את הבניין מפני רעידות אדמה, ולהוסיף ארבע דירות חדשות. במסגרת הפרויקט מבקשים הדיירים להוציא חלק מהרכוש המשותף ולהצמיד לכל דירה חדשה חניה. זאת מתוך הרכוש המשותף בבית המשותף.\nבמקרה זה, מהו הרוב הדרוש לשם אישור הצמדת החניות לדירות ספציפיות?","o":["2/3 של בעלי הדירות ש- 3/4 מהרכוש המשותף צמודים לדירותיהם.","רוב רגיל של בעלי הדירות.","ניתן לאשר הצמדה של רכוש משותף לרכוש פרטי אך ורק על פי תביעה למפקח על הבתים המשותפים.","כל בעלי הדירות."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2025-02#6","e":43,"n":6,"s":"אדם ירש מקרקעין מסחריים מכוח צוואה של אביו, וכעת מבקש לרשום את המקרקעין המסחריים על שמו.\nהאם הירושה מהווה מכירה מהוריו אליו לצורכי מיסוי מקרקעין?","o":["לצורכי מיסוי מקרקעין הורשה אינה נחשבת כמכירה, אך היא נחשבת כרכישה מקרוב משפחה.","לצורכי מיסוי מקרקעין הורשה אינה נחשבת כרכישה, אלא אם מדובר בנכס מסחרי, אז הירושה מחויבת בשליש מס רכישה.","הורשה נחשבת כמכירה לצורך מיסוי מקרקעין, והיא מחויבת בשליש מס שבח.","הורשה אינה נחשבת כמכירה לצורכי מיסוי מקרקעין, גם אם מדובר בנכס מסחרי."],"c":[3],"a":false,"note":"","sub":"x_gains"},{"id":"2025-02#7","e":43,"n":7,"s":"מהו ׳חוזה פיתוח׳ שנכרת עם רשות מקרקעי ישראל (מינהל מקרקעי ישראל)?","o":["חוזה שמקנה לרוכש הזכויות בקרקע מסוימת זכויות חכירה בנכס מקרקעין בלבד.","חוזה שבו רשות מקרקעי ישראל מזמינה שירותי בנייה מקבלן.","חוזה שלפיו רוכש זכויות בקרקע מתחייב לבנות בפרק זמן נתון נכס, ואחרי הבנייה יתקשר עם הרשות בהסכם חכירה.","חוזה שלפיו הרשות מפתחת עבור רוכש זכויות בקרקע מסוימת את הקרקע או הנכס."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2025-02#8","e":43,"n":8,"s":"האם דייר מוגן לפי חוק הגנת הדייר רשאי למכור את זכויות הדיירות המוגנת ולהציע דייר אחר במקומו? אם כן, כיצד?","o":["רשאי לעשות כן מבלי לקבל את הסכמת הבעלים של הנכס.","אינו רשאי למכור את זכות הדיירות המוגנת.","רשאי לעשות כן רק אם הנכס הינו דירת מגורים ולא נכס מסחרי.","רשאי לעשות כן באמצעות פנייה תחילה לבעלים בצירוף תצהירים."],"c":[3],"a":false,"note":"","sub":"r_protected"},{"id":"2025-02#9","e":43,"n":9,"s":"בדרומה של העיר תל אביב קיים בניין בן 4 קומות, ובו משרדים מעל קומת מסחר. הבניין נבנה בהיתר לפני 50 שנה. יוסי הינו בעל הזכויות במשרד בבניין, בשטח של כ- 50 מ\"ר. לאחרונה גילה יוסי כי קיימת תוכנית בניין עיר חדשה למתחם שבו ממוקם הבניין. התוכנית הינה ״תוכנית איחוד וחלוקה ללא הסכמת דיירים״, ומטרתה לקדם התחדשות עירונית במתחם, אשר סובל מהזנחה מתמשכת.\nבנסיבות אלה, מה המשמעות של תוכנית איחוד וחלוקה (רה-פרצלציה)?","o":["תוכנית איחוד וחלוקה מאפשרת במסגרת התחדשות עירונית לנצל זכויות בנייה בלבד.","תוכנית שניתן לקדם במגרשים פנויים בלבד, לרבות בשטח משותף, לשינוי יעוד קרקע בלבד.","תוכנית לאיחוד וחלוקה של מגרשים שאינם סמוכים, וחלוקתם מחדש, כדי לאפשר פיתוח השטח וניצולו המקסימלי.","תוכנית שבה נקבעות בעלויות וקווי גבול ובסופה הקרקע הופכת להיות מוסדרת."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"p_plans"},{"id":"2025-02#10","e":43,"n":10,"s":"עמי ותמי שותפים בעסק למכירת ממתקים. לאחרונה הקימו מפעל חדש בצפון הארץ, והחליטו לרכוש מכספי החברה בית מגורים בבעלות פרטית בקרית שמונה. בית אשר יותאם כך שישמש כחנות למכירת הממתקים שלהם, וזאת באמצעות התקנת מדפים ותשתית מיחשוב. הניחו כי בית המגורים נבנה בהיתר כדין.\nבנסיבות אלה, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["עמי ותמי אינם יכולים להשתמש בבית המגורים לשימוש מסחרי.","עמי ותמי יכולים להשתמש בבית המגורים לשימוש מסחרי, שכן אין איסור בישראל להשתמש בבית מגורים לצורך מסחרי, גם אם לא גרים בו.","עמי ותמי צריכים להגיש בקשה לוועדה לתכנון ובניה לשינוי יעוד של הבית והסבתו מבית מגורים למסחר.","עמי ותמי צריכים להגיש בקשה לשינוי יעוד לרשות מקרקעי ישראל ולקבל את הסכמתה לשינוי."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2025-02#11","e":43,"n":11,"s":"דניאל רכש דירת יוקרה ענקית בגודל 750 מ״ר מחברת נדל\"ן, שמשווקת פרויקט מגורים בתל אביב. נאמר לדניאל על ידי נציגי הקבלן שעשויים להיות שינויים של עד 13.5 מ\"ר בשטח הבנוי שדניאל יקבל בפועל, בהשוואה לתשריט שנחתם בין הצדדים. דניאל חושש שיאבד חדר שלם בדירת היוקרה שלו וייגרעו מדירתו 13.5 מ\"ר.\nבנסיבות האמורות, האם לדניאל יש זכות לקבלת המטרים המלאים כפי שהיו בתשריט?","o":["סטייה בשטח בשיעור העולה על 2% היא סטייה מהותית (לא סטייה קבילה), לכן דניאל זכאי לקבל את המטרים המדויקים אחד לאחד אל מול התשריט.","סטייה בשטח בשיעור העולה על 5% היא סטייה מהותית (לא סטייה קבילה), לכן דניאל זכאי לקבל את המטרים המלאים מהתשריט.","סטייה של עד 2% אינה מהותית ומהווה סטייה קבילה אל מול התשריט ולכן דניאל אינו זכאי לקבל את המטרים המדוברים בנסיבות אלה.","סטייה בשיעור העולה על 5% היא סטייה לא מהותית (כלומר סטייה קבילה), אך דניאל יהיה זכאי לפיצוי בגין המטרים המופחתים."],"c":[2],"a":false,"note":"","sub":"s_apt"},{"id":"2025-02#12","e":43,"n":12,"s":"יוסי, בעל זכויות במקרקעין שלגביהם קיימת הצעה של תוכנית בניין עיר מפורטת, הגיש התנגדות לתוכנית האמורה בפני ועדה מקומית עצמאית לתכנון ובנייה הוד השרון. הוועדה דחתה את התנגדותו.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["יוסי רשאי לפנות להליך של ערר בוועדת ערר לתכנון ובנייה.","אין אפשרות להתערב בהחלטה של ועדה לתכנון ובנייה.","יוסי יכול להגיש ערר לוועדת ערר לתכנון ובנייה, אך רק אם לא קיבל רשות לבנות כפי שביקש.","יוסי יכול להגיש ערר לבית משפט בלבד."],"c":[0],"a":false,"note":"","sub":"p_plans"},{"id":"2025-02#13","e":43,"n":13,"s":"המתווך יצחק מייצג את סימה ודוד, שמבקשים לרכוש דירה לעצמם, בהתאם לטופס הזמנת שירותי תיווך, שנחתם כדין ביניהם לבין יצחק. יצחק מצא דירה שמתאימה לרצונותיהם של סימה ודוד, שבה משה ופזית אשתו מתגוררים. סימה ודוד ביקרו בנכס ובאותו מועד חתמו עם משה על חוזה לרכישת הדירה. בהמשך הסתבר שמשה הוא בעלים רק של מחצית הדירה, כפי שהיה ידוע למתווך יצחק. מחצית הדירה השנייה שייכת לאשתו, אשר סירבה לחתום על הזמנת התיווך ומתנגדת למכירת הדירה. עקב התנגדותה של פזית, החוזה בוטל על ידי סימה ודוד.\nלפי פסק הדין בבר״ע 209/01 זיוה וזאב מאיר נ׳ טלי שושן, האם המתווך יצחק זכאי לדמי תיווך מהזוג סימה ודוד בנסיבות אלה?","o":["כן; לפי פסק הדין מתווך זכאי לדמי תיווך מרגע שנחתם הסכם ואין לכך סייגים.","כן; משום שהחוזה בוטל לאחר כריתתו והצדדים כרתו ביניהם את החוזה.","לפי פסק הדין, המתווך יהיה זכאי למחצית דמי התיווך במצב שכזה.","לא; המתווך יצחק היה צריך לגלות לרוכשים הפוטנציאליים כי פזית היא בעלים נוסף בנכס, ולכן הוא אינו זכאי לדמי תיווך."],"c":[3],"a":false,"note":"","sub":"b_fee"},{"id":"2025-02#14","e":43,"n":14,"s":"המתווך עודד התבקש על ידי דפנה לייצג אותה במכירת דירת המגורים שלה. דפנה חתמה לעודד על הזמנת תיווך כדין והסכם בלעדיות. עודד ביצע שתי פעולות תיווך בנכס כדין, שאחת מהן הייתה לתלות שלט בדירה הנמכרת. דפנה עצמה פירסמה את הדירה בקבוצת וואטסאפ, שבה חבר שלמה הרוכש. שלמה הגיע למקום, הרים טלפון למתווך עודד, ולאור השיחה עם המתווך עודד, שבה עודד נתן לשלמה את כל פרטי הדירה ואת המידע המהותי בקשר לנכס, החליט שלמה לרכוש את הדירה.\nדפנה טוענת כי היא אינה חייבת בדמי תיווך לעודד, משום שהיא זו שפירסמה את המודעה ומצאה את הקונה.\nלפי פסק הדין ת״א 945-12-11 עודד סיטי נ׳ טל פרי, האם בנסיבות אלה דפנה חייבת בדמי תיווך לעודד? מדוע?","o":["כן; גם במקרה שבו בעל הבית מוצא את הרוכש בעצמו, הבלעדיות מזכה את המתווך בדמי תיווך כ״גורם יעיל״.","לא; מדובר במקרה שבו חזקת הגורם היעיל שבבלעדיות נסתרת על ידי פעולות שמבצע בעל הנכס שמצא את הרוכש בעצמו.","כן; משום שהרכישה של הדירה נעשתה בעקבות השיחה עם המתווך עודד שהיה הגורם היעיל שהביא לחתימה על חוזה המכר.","לא; המתווך לא היה הגורם היעיל, שכן דפנה פירסמה את ההודעה בקבוצה ומצאה את הרוכש בעצמה."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2025-02#15","e":43,"n":15,"s":"איתן ובת זוגו נמצאים בזוגיות שנייה, וגרים בנפרד דרך קבע עקב שיקולים הקשורים לעבודתה של בת זוגו. יחד עם זאת, הם בעלים במשותף של דירת מגורים המשמשת למגורים בארבע השנים האחרונות.\nהאם ייחשבו איתן ובת זוגו, לצורכי הגדרת ׳דירה מזכה׳ למס שבח, כ״מוכר אחד״?","o":["לא; על בני הזוג להתגורר יחדיו בדירת המגורים המזכה כדי להיחשב כ׳מוכר אחד׳ לצורך חישוב ׳דירת מגורים מזכה׳ לשניהם.","לא; אלא אם דירת המגורים המזכה שימשה למגורים לא רק בארבע השנים האחרונות, אלא גם בארבע חמישיות מהתקופה שבשלה מחושב השבח בדירה עבור שניהם.","כן; הדירה שימשה למגורים בארבע השנים האחרונות ולכן בני הזוג זכאים לפטור ׳דירת מגורים מזכה׳ ללא כל סייג.","כן; מסתכלים רק על איתן לצורך בדיקת חישוב ׳דירת מגורים מזכה׳ ואין משמעות לבת זוגו . הזכות להיחשב כ׳דירת מגורים מזכה׳ היא עבור שני בני הזוג."],"c":[0],"a":false,"note":"","sub":"x_gains"},{"id":"2025-02#16","e":43,"n":16,"s":"יערה רכשה דירה מקבלן בפרויקט של ״תמ״א 38(3)״ שבו כלל הדירות נהרסו, ויערה קיבלה לידיה דירה חדשה. יערה ביקשה במהלך תקופת הבדק כי ייערכו מספר תיקונים בדירתה, אך הקבלן הפתיע אותה וטען כי אין לה כל זכאות לכך, משום שמדובר בפרויקט תמ״א 38(3), וכי עליה לשלם עבור ההתאמות והתיקונים בהתאם להצעת מחיר שהעביר לה.\nהאם בנסיבות אלה הקבלן צודק בטענתו, ודירה חדשה בפרוייקט תמ״א 38(3) אינה מזכה בתיקונים בתקופת הבדק לפי חוק המכר (דירות), התשל״ג-1974?","o":["כן; לא מדובר בדירה חדשה, אלא בדירה בפרויקט של תמ״א 38(3) ולכן חוק המכר (דירות) אינו חל במקרה זה.","כן; לרוכשים אין כל זכאות לתיקונים שיבצע הקבלן בדירה בפרויקט תמ״א 38(3), אלא אם הם יממנו את התיקונים.","לא; אלא אם לא מדובר בדירת מגורים, אלא בדירה שתשמש כמלאי עסקי, שאז לא יחול עליה חוק המכר (דירות).","לא; חוק המכר (דירות) חל על דירות חדשות, ואין סייג לתחולתו על דירות שנבנו במסגרת פרויקט תמ״א 38(3)."],"c":[3],"a":false,"note":"","sub":"s_apt"},{"id":"2025-02#17","e":43,"n":17,"s":"מנחם מחנה את רכבו מזה 30 שנה וחודש, בשביל שבכניסה לבית של שכנו יוסף, עימו היה בקשר טוב כל השנים. יוסף מעולם לא ביקש ממנחם שלא להחנות את הרכב במקום זה, והוא אף כתב לו בפתק לפני 30 שנה שהוא מסכים שיחנה במקום, כי אין לו רישיון נהיגה בעצמו.\nלפני כחודש נפטר יוסף, וכעת מנחם חושש כי בנו ויורשו של יוסף ידרוש ממנו להפסיק להחנות את רכבו באותו מקום.\nהאם מנחם רשאי לרשום הערת אזהרה בגין השימוש בחניה?","o":["כן; אך נדרשת לשם כך הסכמת בעל המקרקעין שבהם נרשמת זיקת ההנאה ברגע הרישום.","כן; הואיל ומנחם עשה שימוש בשביל הבית של יוסף יותר מ- 30 שנה, אזי הוא בעל זכות זיקת הנאה הניתנת לרישום.","לא; לא ניתן לרשום זיקת הנאה על חניה.","לא; לא ניתן לרשום זיקת הנאה בחלק ממקרקעין בלבד, כגון רק בשביל שמוביל אל הנכס."],"c":[1],"a":false,"note":"","sub":"l_register"},{"id":"2025-02#18","e":43,"n":18,"s":"למתווך שמחפש נכס לרכישה עבור לקוחו נודע כי בדירה מסוימת, שהוא מבקש להציע ללקוחו, ניתן היתר לשימוש חורג במרתף הדירה לצורך מגורים לעשר השנים הבאות.\nהאם המתווך חייב לגלות מידע זה ללקוחו?","o":["המתווך אינו חייב לגלות ללקוח מידע זה, שכן חובת הגילוי חלה על המוכר.","המתווך חייב לגלות מידע זה ללקוחו, שכן קיימת חובת גילוי של מידע מהותי לגבי הנכס, ומדובר במידע מהותי, שכן ההיתר לחריגה עשוי לפוג.","המתווך חייב לגלות מידע זה ללקוחו רק אם הבעלים של הנכס מתיר זאת, שכן המתווך חייב כלפי הבעלים בחובת סודיות.","המתווך אינו חייב לגלות מידע זה, שכן ההיתר לחריגה צפוי להתחדש."],"c":[1],"a":false,"note":"","sub":"b_duties"},{"id":"2025-02#19","e":43,"n":19,"s":"חברת ״אמות״ עוסקת בבנייה ובשיווק מקרקעין.\nהאם מותר לעובד החברה, שאינו בעל רישיון תיווך, להציג בה נכסים ולפרסם מידע ופרטים לגבי זכויות במקרקעין כדי לעניין רוכשים?","o":["כל אדם רשאי לפרסם פרסומים כאמור ובתנאי שהוא התקשר בהסכם בלעדיות עם מתווך בעל רישיון המפקח עליו.","חל איסור מוחלט על פרסומים כאמור ללא רישיון תיווך.","מותר לפרסם פרסומים כאמור, ובלבד שהמפרסם אינו מציג עצמו כמתווך במקרקעין.","מותר לפרסם פרסומים כאמור כל עוד והמשווק לא מציג מידע מהותי לגבי הנכס."],"c":[2],"a":false,"note":"","sub":"b_license"},{"id":"2025-02#20","e":43,"n":20,"s":"ביום 1.1.24 יוסף הציע בכתב לאבנר את דירתו בלוד למכירה בניסוח הבא: ״אני מציע לך לרכוש את דירתי במחיר של 1.9 מיליון ש\"ח. ההצעה תעמוד בתוקפה למשך שבעה ימים״. ביום 5.1.24 הודיע יוסף לאבנר בעל פה, כי מכיוון שלא הודיע על רצונו לרכוש את הדירה עד אותו זמן , הוא מעלה את המחיר המבוקש על ידו ל- 2.1 מיליון ש\"ח.\nהאם יוסף רשאי היה לנהוג כפי שנהג? מדוע?","o":["כן; כל עוד אבנר לא קיבל את הצעתו של יוסף, יוסף רשאי לחזור בו מן ההצעה ולשנותה.","לא; מכיוון שהודיע כי הוא חוזר בו מההצעה בעל פה - יוסף היה צריך לשנות את המחיר בכתב לא בעל פה.","לא; מאחר שהצעתו של יוסף היא הצעה בלתי חוזרת, אסור היה לו לחזור בו מן ההצעה בטרם חלף המועד שנקבע על ידו, במחיר שנקבע לתקופה זאת.","כן; הצעה בלתי חוזרת היא תמיד לרכישת הנכס בלבד, והמוכר רשאי תמיד להעלות את המחיר במהלך תקופת ההצעה הבלתי חוזרת."],"c":[2],"a":false,"note":"","sub":"c_form"},{"id":"2025-02#21","e":43,"n":21,"s":"מה מהבאים לא ניתן לרשום במרשם המקרקעין (טאבו)?","o":["הערת אזהרה בגין התחייבות בכתב לעשות עיסקת מקרקעין.","הערת אזהרה בגין התחייבות בכתב לשאילת נכס מקרקעין.","הערת אזהרה בגין התחייבות בכתב לזכות קדימה במקרקעין.","עסקה הסותרת הערת אזהרה קיימת."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2025-02#22","e":43,"n":22,"s":"נאווה ויוסי החליטו להתגרש. בבעלות בני הזוג דירת מגורים ברחובות, הרשומה על שם שניהם בחלקים שווים. בני הזוג הגיעו להסכמה להתגרש, שבמסגרתה יוסי יעביר על שם נאווה את חלקו בדירה המשותפת, אגב הגירושין. חלקו של יוסי בדירה המשותפת שווה מיליון ש״ח.\nבבעלות נאווה דירה נוספת בראשון לציון, שרכשה לפני שנישאה.\nכמה מס רכישה תשלם נאווה בגין קבלת חלקו של יוסי בדירה ברחובות?","o":["הואיל ובבעלות נאווה דירה נוספת על דירת בני הזוג, היא תשלם מס רכישה בשיעור 8% משווי הדירה עבור מחצית הדירה שהיא מקבלת מיוסי.","נאווה לא תשלם מס רכישה, משום שהיא אינה מגיעה למדרגות המס המחייבות תשלום.","נאווה לא תשלם מס רכישה כלל, הואיל והעברה אגב גירושין אינה מכירה.","נאווה תשלם מס רכישה לפי דירה ראשונה, הואיל וההעברה בין בני הזוג אינה נספרת לצורכי מיסוי מקרקעין."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2025-02#23","e":43,"n":23,"s":"באיזה מהמקרים הבאים אדם שנפגע מהפרת חוזה אינו זכאי לאכיפת החוזה שהופר?","o":["אם החוזה בר ביצוע.","אם הופר חיוב מחיובי החוזה במשתמע.","אם הוא זכאי לפיצויים בשל הפרת החוזה.","אם אכיפת החוזה אינה צודקת בנסיבות העניין."],"c":[3],"a":false,"note":"","sub":"c_remedy"},{"id":"2025-02#24","e":43,"n":24,"s":"לצורך קבלת בלעדיות בתיווך, האם יש לפרט את כל פעולות השיווק שהדין מתייחס אליהן? אם כן, היכן?","o":["כן; יש לפרט את כל פעולות השיווק שהדין מתייחס אליהן, וכן פעולות נוספות שסוכמו בין הצדדים, ככל שסוכמו, במסמך נפרד מטופס הזמנת שירותי התיווך.","כן; יש לפרט את כל פעולות השיווק שהדין מתייחס אליהן, וכן פעולות נוספות שסוכמו בין הצדדים, ככל שסוכמו, בטופס הזמנת שירותי התיווך.","לא; יש לפרט את הפעולות שסוכמו בין הצדדים בלבד לצורך הבלעדיות, בטופס נפרד מטופס הזמנת שירותי התיווך.","כן; יש לפרט את כלל פעולות השיווק שהדין מתייחס אליהן, בטופס הזמנת שירותי התיווך."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2025-02#25","e":43,"n":25,"s":"בחוזה התיווך המיועד לכלל לקוחות סוכנות התיווך ״נוף נאה עוסק מורשה״, נכתב הסעיף הבא: ״עמלת התיווך ללקוחות המחפשים נכסים דרך הסוכנות תעמוד על 1% ממחיר הנכס. יחד עם זאת, אם מנהל הסוכנות יקבע כי הסוכנות החליטה להוציא מספר לא סביר של שעות עבודה על חיפוש הנכס עבור הלקוח, תועמד העמלה על 2% ממחיר העיסקה\".\nמשה, לקוח של הסוכנות, טוען שמדובר בתנאי שמקפח אותו.\nהאם משה צודק לפי הדין? מדוע?","o":["לא; לא מדובר בחוזה אחיד אלא בחוזה עם לקוח מסוים.","לא; דמי התיווך עולים מכיוון שההשקעה בלקוח משמעותית במיוחד.","כן; מדובר בתנאי מקפח, מכיוון שלא מדובר בחוזה אחיד, אלא בחוזה עם לקוח מסוים.","כן; חזקה שהתנאי המקנה זכות לשינוי מחיר בדיעבד בחוזה הנו מקפח."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-05#1","e":44,"n":1,"s":"חיים המתווך ראה מודעה שפורסמה על ידי יהודה - בעלים של דירה, לפיה מוכר יהודה את דירתו בסכום של 1,000,000 ש\"ח. במודעה נכתבו המילים הבאות: \"פרטי, לא למתווכים\". חיים יצר קשר עם רחל, אשר התעניינה בעבר בדירה דומה. חיים ציין בפני רחל כי יש לו להציע לה דירה במחיר 1,050,000 ש\"ח, והחתים אותה על טופס הזמנת שירותי תיווך, לפיו חויבה ב- 2% דמי תיווך מתוך 1,050,000 ש\"ח. שבוע לאחר מכן נפגשו יהודה ורחל אצל עו\"ד עציוני כדי לחתום על הסכם מכר, או אז התברר לרחל, לתדהמתה, שמחיר הדירה היה ונותר 1,000,000 ש\"ח בלבד, ולא 1,050,000 ש\"ח, כפי שטען בפניה חיים. חיים מצידו טען כי היא משלמת לו דמי תיווך מוגדלים והדבר מוכר למיסוי מקרקעין.\nהאם חיים פעל באופן תקין בנסיבות המתוארות? מדוע?","o":["כן; על הצדדים לדווח את המחיר המלא שהם משלמים בעד עיסקת מקרקעין.","כן, הואיל וחיים היה הגורם היעיל בעיסקה ודמי התיווך פורטו בהזמנת שירותי התיווך.","לא, משום שחיים לא החתים את יהודה על הסכם להזמנת שירותי תיווך כלקוח שמממן את שכר טרחתו.","לא; חיים הפר את חובת הנאמנות שלו כלפי רחל בכך שלא נקב במחיר של עיסקת המקרקעין בפניה בשקיפות."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-05#2","e":44,"n":2,"s":"שמשון הוא בעל דירה יחידה. שמשון מעוניין לרכוש מאדם פרטי אחר דירה, שתהווה תחליף לדירה הראשונה שלו.\nהאם שמשון יכול להיות זכאי לשלם מס רכישה במדרגת מס לפי דירה יחידה, בגין הדירה השנייה שהוא רוכש בנסיבות אלה?","o":["לא, אלא אם שמשון ימכור את הדירה הראשונה שלו בתוך 24 חודשים.","כן, אם שמשון ימכור את אחת מדירותיו בתוך 12 חודשים.","לא, שמשון לא זכאי למדרגות מס הרכישה של דירה יחידה, מכיוון שברגע שהוא רוכש את הדירה השנייה הוא רוכש דירה נוספת.","כן, אם ימכור את דירתו האחרת, שהיתה דירתו היחידה, בתוך 18 חודשים."],"c":[0,3],"a":false,"note":"תשובה נכונה: תשובות א וד התקבלו","sub":"x_purchase"},{"id":"2025-05#3","e":44,"n":3,"s":"לפני ארבע שנים עבר יחזקאל בהצלחה את הבחינה בדיני תיווך מקרקעין של משרד המשפטים, אולם טרם שילם את אגרת רישיון התיווך. יחזקאל איתר לקוח שמעוניין בשירותיו כמתווך, ובהתאם לכך החתים אותו על טופס תקין להזמנת שירותי תיווך, איתר עבורו דירה, ופעל במסירות וביעילות. כתוצאה מפעולותיו של יחזקאל הלקוח חתם על הסכם לרכישת הדירה האמורה. יומיים לאחר חתימת העיסקה, יחזקאל פנה למשרד המשפטים, שילם את האגרה והפעיל את רישיון התיווך שלו.\nהאם יחזקאל זכאי לדמי תיווך בנסיבות המתוארות?","o":["כן - כל עוד יחזקאל פועל בהגינות, מוסר את כל המידע הרלוונטי ללקוח ומחתים אותו על טופס הזמנת שירותי תיווך.","כן - יחזקאל רשאי להפעיל את רישיונו מייד לאחר ביצוע העיסקה.","לא - אסור למתווך לפעול לאיתור לקוח, אלא על הלקוח לפנות למתווך.","לא - משום שליחזקאל לא היה רישיון תיווך בתוקף בזמן שעסק בתיווך העיסקה."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-05#4","e":44,"n":4,"s":"ביום 1.1.24 נפטרה סבתה של גילה, והורישה לה את דירת המגורים היחידה שלה. העיזבון של הסבתא טרם חולק בין היורשים. שבועיים לאחר מכן התגרשה גילה מבעלה, כאשר הסכם גירושין שנחתם בין בני הזוג (ואושר ע\"י בית המשפט בפסק דין) קבע, כי היא תקבל מבעלה אגב הגירושין וללא תמורה את זכויותיו בדירה המשותפת של בני הזוג.\nהאם גילה חייבת בתשלום מס רכישה? אם כן – בעבור איזו מהדירות?","o":["מאחר שהזכויות בדירה המשותפת שקיבלה גילה מבעלה נחשבות לדירתה השנייה (אחרי הדירה שירשה מסבתה), גילה חייבת בתשלום מס רכישה בגין הדירה השנייה על פי המדרגות הקבועות בחוק לדירה שאיננה דירה יחידה.","מכיוון שבבעלות התא המשפחתי (גילה ובעלה דאז) היתה כבר דירה, גילה היתה חייבת בתשלום מס רכישה בגין הדירה שקיבלה מסבתה על פי המדרגות הקבועות בחוק לדירה שאינה דירה יחידה.","גילה לא חייבת במס רכישה בגין אף אחת מהעיסקאות האמורות, מכיוון שהירושה וגם ההעברה ללא תמורה מבן זוג אגב גירושין, אינן נחשבות למכירה על פי חוק.","גילה חייבת בתשלום מס רכישה לפי מדרגות המס, בהתאם לשווי הנכסים באופן מדורג."],"c":[2],"a":false,"note":"","sub":"x_purchase"},{"id":"2025-05#5","e":44,"n":5,"s":"חננאל המתווך יצר קשר עם יואב, שהיה מעוניין למכור את דירתו. חננאל הציג בפני יואב רישיון תיווך בתוקף, וציין כי הוא מתווך מנוסה. יואב התרשם מאוד מחננאל, וקבע פגישה עם חננאל. בעת הפגישה ציין המתווך כי יש לו קונה המעוניין בדירה, אולם הודיע ליואב כי יהיה מוכן לקשר בין הצדדים רק אם יואב יסכים לרכוש את שירותיו כמתווך, כשירכוש דירה במקום הדירה אותה הוא מוכר. יואב הרגיש שעליו להסכים להצעת המתווך, ובהתאם לכך החתים חננאל את יואב על טופס הזמנת שירותי תיווך לשתי הדירות.\nהאם יש פסול בהתנהלותו של חננאל? מדוע?","o":["לא; חננאל הציג בפני יואב רישיון תיווך כדין והחתים אותו על טופס הזמנת שירותי תיווך.","לא; אין כל פסול בכך שמתווך ירצה לייצג את המוכר גם בעיסקת הרכישה הבאה, ואין מגבלה שחלה על ההתקשרות של יואב עימו בעיסקה הבאה, אלא אם ידרוש בלעדיות.","כן; אסור למתווך להתנות שירות בדירה אחת במתן שירות בדירה אחרת.","כן; אלא אם המתווך החתים את יואב על שני טפסי הזמנת שירותי תיווך שונים."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2025-05#6","e":44,"n":6,"s":"גרשון, מתווך בעל רישיון, ואשתו גילה, הינם הבעלים של בית מגורים (להלן: \"הבית\"). גרשון פרסם את הבית למכירה בסכום של 5 מיליון ש\"ח. עופרה התעניינה בבית ופנתה לגרשון. גרשון הציג בפני עופרה רישיון תיווך, ולאחר שעופרה חתמה על טופס הזמנת שירותי תיווך, לפיו התחייבה לשלם לגרשון דמי תיווך בשיעור 2% משווי העיסקה, הציג גרשון את הבית לעופרה. עופרה התרשמה מהבית וביקשה לקבוע פגישה אצל עו\"ד לחתימה על הסכם המכר.\nהאם גרשון פעל באופן תקין? מדוע?","o":["כן; גרשון פרסם את הבית, הציג בפני עופרה רישיון תיווך במקרקעין, והחתים אותה על טופס הזמנת שירותי תיווך כדין בהיותו הגורם היעיל בעיסקה.","כן; אך רק אם גרשון מגלה בכתב כי הוא בן זוגה של גילה.","לא; גרשון הוא בעל עניין אישי בעסקה כבן זוגה של גילה.","לא; גרשון היה חייב לגלות לעופרה שיש לו עניין אישי בעיסקה, והוא מוגבל בייצוג הנכס, מכיוון שהוא הבעלים."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-05#7","e":44,"n":7,"s":"הרצל גר בקומת קרקע בבית משותף שבו 16 דירות. כל בעלי הדירות בבית המשותף, למעט הרצל, הסכימו על התקנת מעלית בבניין. לאחר התקנת המעלית, פנתה נציגות הבית המשותף להרצל בדרישה כי ישלם את חלקו בעלות הקמת המעלית, וכי ישלם את חלקו בהוצאות החזקתה והפעלתה של המעלית.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["הרצל לא משתמש במעלית, ולכן הוא לא צריך לשלם עבור התקנת המעלית, וגם לא עבור החזקתה והפעלתה.","הרצל חייב לשלם עבור התקנתה, החזקתה והפעלתה של המעלית, מכיוון שהיא משותפת לכל הבניין.","הרצל חייב לשלם עבור חלקו בהתקנת המעלית, אולם הוא פטור מתשלום החזקתה והפעלתה של המעלית, מכיוון שהוא לא משתמש בה בפועל.","מאחר שהרצל גר בקומת הקרקע, הוא פטור מתשלום עבור התקנת המעלית, אולם הוא חייב להשתתף בהוצאות החזקתה והפעלתה של המעלית."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2025-05#8","e":44,"n":8,"s":"אלכס הוא בעלים של דירה בבית משותף. אלכס גילה להפתעתו כי משה - בעל דירה בקומת הקרקע, הרחיב את דירתו ובנה מחסן בשטח הרכוש המשותף. אלכס פנה למשה ודרש ממנו לפנות את המחסן. משה סירב.\nהאם אלכס יכול להגיש תביעה נגד משה? אם כן, בפני איזו ערכאה?","o":["כן; אלכס יכול להגיש תביעה לסילוק יד לבית המשפט המחוזי שבתחום שיפוטו נמצא הבניין.","לא; על אלכס לפתוח הליך בפני הוועדה המקומית לתכנון ובנייה בלבד.","לא; אלכס אינו רשאי להגיש תביעה, אלא רק הנציגות של הבית המשותף מוסמכת להגיש תביעה לסילוק יד נגד משה מהשטח המשותף.","כן; אלכס יכול להגיש תביעה לסילוק יד לבית המשפט המוסמך או למפקח על רישום המקרקעין, במחוז שבו נמצא הבית המשותף."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2025-05#9","e":44,"n":9,"s":"חזי ירש מאביו דירה. עו\"ד נמרודי טיפל ברישום הדירה על שם חזי. כשהוציא עו\"ד נמרודי נסח טאבו התברר כי רשומה משכנתא על זכויות אביו בדירה, עוד משנת 1958 לטובת ג'ורג' סמיט - בעל דרכון אנגלי, בסכום של 150 ל\"י (לירות ישראליות). חזי ניסה לברר אודות אותו ג'ורג' סמיט ואף שכר את שירותיהם של חוקרים פרטיים בישראל ובאנגליה, אולם ללא הצלחה. מאחר שהורשה איננה מכירה על פי חוק, הועברו הזכויות על שם חזי, אולם חזי אינו יכול למכור את הדירה לצד שלישי מבלי למחוק את המשכנתא.\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["חזי חייב לאתר את ג'ורג' סמיט ולשלם לו את כספי המשכנתא, אחרת לא ניתן לבטל את רישום המשכנתא.","חזי יכול לפנות לבית המשפט המוסמך בבקשה לסעד הצהרתי לפיו מאחר שהוא לא הצליח לאתר את ג'ורג' סמיט יש למחוק את המשכנתא מהטאבו, כך שיוכל למכור את הדירה.","חזי רשאי להפקיד את כספי המשכנתא המגיעים מאביו לג'ורג' סמיט בידי רשם המקרקעין ולבקש שהרשם יפקיע את המשכנתא במידה שנפדתה, וכך תימחק המשכנתא מהטאבו.","חזי יכול לפנות למפקח על רישום המקרקעין בבקשה שימחק את המשכנתא הואיל והתיישנה."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2025-05#10","e":44,"n":10,"s":"ניצה ראתה דירה שפרסמה מוכרת, והחליטה כי היא מעוניינת בדירה. בהתאם לכך ביקשה ניצה מהמוכרת שתמתין עד שהיא תגייס את מלוא המימון לרכישת הדירה. במקביל חתמה ניצה עם המוכרת על זיכרון דברים ושילמה לה מקדמה ע\"ס 200,000 ש\"ח על חשבון רכישת הדירה. כל זאת ללא שנעזרו בעורכי דין, וללא שנרשמה לטובת ניצה הערת אזהרה בלשכת רישום המקרקעין (הטאבו).\nבינתיים ראתה קונה אחרת את הדירה, תוך שלא היתה מודעת לניצה ולמה שהתרחש מולה, ולאחר משא ומתן עם המוכרת חתמה עימה על הסכם מכר בקשר לדירה, שילמה למוכרת את מלוא התמורה והשלימה את רישום הדירה בטאבו על שמה.\nהאם ניצה זכאית לרישום הדירה על שמה? מדוע?","o":["כן; ניצה היא הראשונה שנחתם עימה הסכם, ושולמה מקדמה כדין.","כן, משום שהקונה השנייה בזמן צריכה הייתה לדעת על זכותה של ניצה.","לא; משום שלא נחתם חוזה העונה לדרישת המסוימות בחוק החוזים.","לא; משום שהקונה השנייה שילמה את מלוא התמורה, פעלה בתום לב והשלימה את העיסקה ברישום בטאבו."],"c":[3],"a":false,"note":"","sub":"l_register"},{"id":"2025-05#11","e":44,"n":11,"s":"גידי, חבר בנציגות הבית המשותף בבניין, שוחח עם משה, בעל דירה בבניין, ושאל לעמדתו של משה בקשר לביצוע פרויקט התחדשות עירונית, לפי חוק המקרקעין (חיזוק בתים משותפים מפני רעידות אדמה) (להלן – \"חוק החיזוק\"). משה השיב שבאופן עקרוני הוא בעד הפרויקט. לאחר מספר חודשים ראה משה מודעה על לוח המודעות של הבניין, שבה הוא רשום כמי שנתן הסכמתו לפרויקט התחדשות עירונית.\nהאם משה אכן נחשב כמי שנתן את הסכמתו לפרויקט? מדוע?","o":["כן; משה אמר לגידי במפורש שהוא לא מתנגד לפרויקט, וגידי רשם את הדברים בספרי הבית המשותף.","כן; משום שניתנה הסכמה לפרויקט ההתחדשות העירונית בעל פה על ידי משה.","לא; הסכמות בפרויקט כזה לא יכולות להינתן בעל פה בלבד. גידי היה חייב להחתים את משה על הצהרה מסודרת, ורק אז ההסכמה היא על פי דין.","לא; הסכמתו של משה חייבת היתה להינתן בכתב, ואף להיות מאומתת ע\"י עורך דין בדרך שמאמתים שטר עיסקה."],"c":[3],"a":false,"note":"","sub":"h_works"},{"id":"2025-05#12","e":44,"n":12,"s":"לדנה דירת מגורים בבעלותה המלאה. דנה החליטה לרכוש דירת מגורים נוספת, ביחד עם אחיה, וכל אחד שילם מחצית מעלות הדירה. דנה ואחיה חילקו את הדירה ביניהם לשימושם.\nהאם דנה זכאית לשלם מס רכישה בגין רכישת הדירה לפי מדרגות דירת מגורים יחידה? מדוע?","o":["כן; חלק מדירת מגורים אינו נחשב דירת מגורים נוספת.","לא; מאחר שגם חלק מדירה נחשב לדירת מגורים, דנה אינה זכאית למס רכישה לפי מדרגות דירת מגורים יחידה.","כן; מאחר שחלקה של דנה נחשב מלאי עיסקי.","לא; מאחר שבאותה עיסקת מכר לא ניתן לתת פטור לשני רוכשים."],"c":[1],"a":false,"note":"","sub":"x_purchase"},{"id":"2025-05#13","e":44,"n":13,"s":"מהו מס שבח ובאילו נסיבות הוא מוטל?","o":["המס אשר מוטל על ידי רשות מיסוי מקרקעין על מוכר זכות במקרקעין בעבור תוכניות בניין עיר שאושרו באזור. המס יוטל במכירת הזכות במקרקעין או עם אישור תוכנית בניין עיר המעלה את ערך הנכס על ידי הרשות המקומית שבה נמצאים המקרקעין.","המס אשר מוטל על ידי רשות מיסוי מקרקעין על מוכר זכות במקרקעין בעבור ההפרש שבו עולה שווי המכירה על יתרת שווי הרכישה. מס זה מוטל על ידי רשויות מיסוי מקרקעין בעת מכירת זכות במקרקעין.","המס אשר מוטל על ידי הרשות המקומית על רוכש זכות במקרקעין בעבור תוכניות בניין עיר שאושרו באזור. המס ישולם במכירת זכות במקרקעין או במימוש תוכנית הבנייה.","המס אשר מוטל על ידי הרשות המקומית על מוכר זכות במקרקעין בעבור ההפרש מסכום הרכישה לסכום המכירה. מס זה יוטל בעת מכירת זכות במקרקעין."],"c":[1],"a":false,"note":"","sub":"x_gains"},{"id":"2025-05#14","e":44,"n":14,"s":"שרית ויניב (להלן: \"בני הזוג\") מעוניינים ברכישת דירה. בני הזוג פנו למתווך והדגישו בפניו כי הם מעוניינים שיאתר עבורם דירה \"ללא חריגות וללא הפתעות\". המתווך מצא לבני הזוג דירה, ונחתם הסכם מכר. אלא שלאחר החתימה על ההסכם, גילו בני הזוג כי חלק מהדירה נבנה ללא היתר. בהמשך לכך ביטלו בני הזוג את הסכם המכר.\nעל פי פסק דין בר\"ע 209/01 זיוה וזאב מאיר נ' טלי שושן ואח', האם המתווך זכאי לדמי תיווך במקרה כזה? מדוע?","o":["לא; משום שהסכם המכר בוטל בדיעבד.","כן; המתווך זכאי לשכר טרחתו מרגע שנחתם הסכם מחייב ואין לכך חריגים.","לא; למתווך ישנה חובה לברר פרטים מהותיים מסוג זה.","כן; משום שלא הוכח כי המתווך ידע על חריגות הבנייה והיה על בני הזוג להסתייע באיש מקצוע בנושא זה."],"c":[2],"a":false,"note":"","sub":"b_fee"},{"id":"2025-05#15","e":44,"n":15,"s":"דנית התקשרה עם מתווכת בהסכם תיווך. המתווכת הציגה לדנית דירה, וזו ביקשה להגיש למוכרים הצעה בסך של מיליון ש\"ח, הצעה נמוכה ב- 200,000 ש\"ח מהמחיר המבוקש. המתווכת סירבה להעביר למוכרים את ההצעה, כי לדעתה אין סיכוי שיסכימו להצעה כה נמוכה.\nלאחר מספר ימים פנה לדנית מתווך אחר והציע לה את אותה הדירה, דנית שכרה את שירותיו של המתווך, אשר ניהל משא ומתן עם המוכרים ולבסוף רכשה דנית את הדירה בסך של מיליון ש\"ח בזכות המשא ומתן. דנית שילמה למתווך דמי תיווך. יחד עם זאת, למתווכת שהכירה לה את הנכס, דנית לא מעוניינת לשלם דמי תיווך.\nהמתווכת טוענת כי על דנית לשלם לה דמי תיווך. לאף אחד מהמתווכים לא היתה בלעדיות על הנכס בעיסקה.\nעל פי תא\"מ 10272-02-11 ב.פ. הנשיא סוכנויות נדל\"ן בע\"מ נ' בקרמן ואח', האם המתווכת זכאית לדמי תיווך במקרה כזה?","o":["לא; משום שהמתווכת הפרה את חובתה כלפי דנית ולכן אינה זכאית לדמי תיווך.","כן; משום שמהמתווך אשר מראה את הדירה לראשונה לרוכש, והרוכש רכש את הדירה במועד קרוב (עד חצי שנה), חזקה שהוא הגורם היעיל בעיסקה. אלא אם למתווך אחר קיימת בלעדיות.","כן, אך מאחר שהמתווכת רק הראתה את הדירה ולא ניהלה מו\"מ, יש לשלם לה מחצית מדמי התיווך לפי פסק הדין.","כן; משום שלפי פסק הדין, מתווך אשר מראה את הדירה אינו מחויב להעביר הצעה מופרכת לדעתו, וזה חלק משיקול דעתו המקצועי."],"c":[0],"a":false,"note":"","sub":"b_order"},{"id":"2025-05#16","e":44,"n":16,"s":"בבעלותו של משה היה בית עסק בדמי מפתח. משה נפטר ללא בת זוג. דני, בנו, מבקש להמשיך את השכירות בדמי המפתח.\nהאם הבן זכאי לעשות כן?","o":["כן, ובתנאי שדני ימשיך לנהל בעצמו או על ידי אחרים, את העסק שאביו ניהל, ולא ישכירו.","כן, ובתנאי שדני עבד עם אביו בעסק לפחות 6 חודשים לפני מותו.","לא, מכיוון שלא ניתן להמשיך שכירות בדמי מפתח בנכס מסחרי, אלא בדירת מגורים בלבד.","לא; במקרה שכזה הנכס יחזור לבעל הנכס ללא סייג."],"c":[0],"a":false,"note":"","sub":"r_protected"},{"id":"2025-05#17","e":44,"n":17,"s":"מהי \"הצמדה\" ברכוש משותף במקרקעין?","o":["חיבור (הצמדה) בין שני בתים או יותר זה לזה בחלקה אחת, כגון בבית דו משפחתי.","הצמדת השטח לרשות מקומית מסוימת. כל שטח במדינת ישראל מוצמד לרשות מקומית, כך שעל השטח חלות תוכניות בניין של הרשות המקומית.","שיוך של רכוש ליחידה או לבעלים מסוים של מקרקעין בבית משותף.","הצמדת כל נכס לבעלים שלו בנסח הטאבו."],"c":[2],"a":false,"note":"","sub":"h_common"},{"id":"2025-05#18","e":44,"n":18,"s":"ברוך מעוניין למכור נכס. המתווך ששכר ברוך מצא קונה לנכס. הקונה ביקש מהמתווך להעביר בשמו הצעת רכישה בסכום של מיליון ש\"ח. המתווך נפגש עם הקונה והמוכר, אך הצדדים לא הגיעו להסכמות ונפרדו, תוך שהמתווך התבקש להפסיק לעבוד על הנכס של ברוך, וברוך והרוכש התחמקו מהמתווך החל מרגע זה.\nלאחר מספר שבועות, הקונה שוחח עם מתווך נוסף, וסיפר לו על הנכס. המתווך הנוסף הציע את שירותיו כמתווך, ליווה את הקונה לפגישה עם המוכר, ניהל את המשא ומתן, והביא את הצדדים למחיר שהיה מקובל על שני הצדדים. ההסכם נחתם ויצא לפועל.\nלפי ע\"א 7274/97 כוכבה יצחקוב נ' מרדכי אביב מפעל בניה בע\"מ, מי זכאי לדמי תיווך ומדוע?","o":["שני המתווכים עשויים להיות זכאים לדמי תיווך; המתווך הראשון הפגיש בין הצדדים, והמתווך השני סייע לצדדים להגיע להסכמה.","המתווך הראשון זכאי לדמי התיווך במלואם. הוא הפגיש בין הצדדים, ולכן הוא הגורם היעיל בעיסקה, כאשר בלעדיו לא הייתה נחתמת עיסקה.","המתווך השני זכאי לדמי התיווך במלואם. אם לא היה מסייע לצדדים להגיע להסכמה לגבי המחיר, לא הייתה מתקיימת העיסקה, ולכן הוא הגורם היעיל.","אף אחד מהמתווכים לא זכאי לדמי תיווך. לא ניתן לקבוע לגבי אף אחד מהם שהוא היה הגורם היעיל בעיסקה שבלעדיו לא הייתה נחתמת עיסקה."],"c":[0],"a":false,"note":"","sub":"b_fee"},{"id":"2025-05#19","e":44,"n":19,"s":"על איזה מבין סוגי המקרקעין הבאים לא חלה הגבלה בהעברה לגורמים פרטיים לפי דין?","o":["כל מקרקעי ישראל השייכים למדינה.","מקרקעי ישראל שיש בהם כדי להשלים לגורם פרטי את נחלתו, להיקף שמעל מאה דונם.","מקרקעי ישראל שיש בהם כדי להשלים לגורם פרטי את נחלתו, בהיקף של פחות ממאה דונם.","מקרקעי ישראל השייכים לנפקדים וצאצאיהם אשר אינם אזרחי או תושבי ישראל."],"c":[2],"a":false,"note":"","sub":"ila"},{"id":"2025-05#20","e":44,"n":20,"s":"ליאור המתווך חושש מתביעות של לקוחותיו, ולכן בטפסי ההזמנה שלו כלל את המשפט הבא: \"הלקוחות לא יהיו רשאים לתבוע את המתווך. מי שיתבע את המתווך יחויב לשלם לו פיצוי בסך 50,000 ש\"ח, תהיינה תוצאות התביעה אשר תהיינה\".\nבנסיבות המתוארות, איזה מההיגדים הבאים הוא הנכון ביותר?","o":["הלקוח יכול אך ורק לפנות לבית הדין לחוזים אחידים כדי שיבטל את התנאי הזה, ורק לאחר מכן יוכל להגיש תביעה כנגד המתווך.","הלקוח יכול אך ורק לפנות בתלונה לוועדת המשמעת במשרד המשפטים כדי שתעמיד את המתווך לדין משמעתי, ורק לאחר שיורשע בדין יוכל להגיש תביעה נגדו.","הלקוח יכול להפקיד בחשבון הבנק של המתווך 50,000 ש\"ח, שכן הסכים לתנאי בחוזה.","הלקוח רשאי להגיש תביעה ללא חשש. טופס ההזמנה מהווה חוזה אחיד, ותנאי השולל או מגביל את זכות הלקוח לפנות לערכאות משפטיות בחוזה אחיד – בטל."],"c":[3],"a":false,"note":"","sub":"p_plans"},{"id":"2025-05#21","e":44,"n":21,"s":"אופיר רכש דירה מקבלן בפרויקט בנייה חדש, הרשום על שם החברה הקבלנית שבונה את הפרויקט. אופיר ביקש לקחת הלוואה לצורך מימון הרכישה מקרן ״מימון לישראל חזקה בע״מ״. הקרן מבקשת לוודא שאין משכנתא או עיקול על אופיר או על היחידה שרכש וטרם נרשמה בטאבו.\nהיכן ייערך רישום השיעבודים?","o":["רישום השיעבודים יתנהל תמיד ברשם המשכונות בלבד.","רישום השיעבודים יתנהל תמיד בעירייה.","רישום השיעבודים יתנהל בחברה המשכנת ורשם המשכונות.","רישום השיעבודים יתנהל תמיד בטאבו באמצעות הערות אזהרה."],"c":[2],"a":false,"note":"","sub":"l_register"},{"id":"2025-05#22","e":44,"n":22,"s":"דוד מתגורר בבית משותף. דוד מעוניין להצמיד לדירתו חלק מחדר המדרגות, הנמצא בקומה של דירתו, וזאת לצורך הרחבת דירתו.\nמהו הרוב הדרוש לדוד מתוך כלל דיירי הבניין לשם ביצוע האמור?","o":["רוב רגיל מדיירי הבניין.","דוד כלל לא יכול לבצע הצמדה כאמור לדירתו, אפילו אם יקבל את הסכמת כל הדיירים.","רוב של 75% מבעלי הדירות, שלהם צמודים 2/3 מהרכוש המשותף.","הסכמה של כלל בעלי הדירות."],"c":[1],"a":false,"note":"","sub":"h_common"},{"id":"2025-05#23","e":44,"n":23,"s":"דני רכש דירה חדשה מקבלן.\nמהי תקופת האחריות של הקבלן על הדירה ומתי היא מתחילה?","o":["תקופה של שנה - מרגע שהתקבל טופס 4.","תקופה של שלוש שנים - שתחילתה בתום תקופת הבדק.","תקופה של שנה - שתחילתה בתום תקופת הבדק.","החוק אינו קובע תקופת אחריות, והיא נקבעת לפי הוראות הסכם המכר שנחתם בין הצדדים."],"c":[1],"a":false,"note":"","sub":"s_apt"},{"id":"2025-05#24","e":44,"n":24,"s":"אברהם ויצחק הם שכנים בעלי גדר משותפת. אברהם חפר והתקין צנרת מתחת לאדמה שבביתו של יצחק, על מנת להעביר במקום כבלים לתקשורת, אינטרנט וטלפון. יצחק כעס על כך שהדבר נעשה ללא הסכמה וללא תשלום כלשהו מצד אברהם, ודרש מאברהם להוציא את הכבלים מתחת לשטחו.\nהאם אברהם חייב להיענות לדרישתו של יצחק? מדוע?","o":["לא; אברהם יכול להעביר צנרת ללא בקשת הסכמה מתחת לביתו של שכנו, כל עוד הצנרת אינה מזיקה או מפריעה באופן בלתי סביר להנאתו של השכן מהמקרקעין שלו.","לא; אולם על אברהם לשלם ליצחק בגין זיקת הנאה למעבר מתחת לחלקה שלו.","כן; אברהם חייב לפרק את הצנרת באופן מיידי, שכן החפירה וההנחה של הצנרת נעשו ללא הסכמת שכנו.","כן; משום שהבעלות של יצחק על המקרקעין שלו מתפשטת לעומק הקרקע ואין לכך חריגים."],"c":[],"a":true,"note":"תשובה נכונה: כל התשובות מתקבלות","sub":"l_ownership"},{"id":"2025-05#25","e":44,"n":25,"s":"רמי מונה על ידי רשם הירושה כמנהל עזבונו של אפרים ז״ל. לאחר המינוי, גילה רמי שלמנוח נותר חוב של 500,000 ש״ח לבנק. הדרך היחידה לפרוע את החוב, הייתה למכור דירה שאפרים ז״ל רכש בחייו. שלמה, אחד הילדים של המנוח, מתנגד למכירה. אך לנוכח החובות, רמי הודיע לשלמה שאין ברירה, ומתוקף תפקידו כמנהל עיזבון הוא ימכור את הדירה לצד שלישי שאינו אחד מהיורשים. רמי מצא קונה, מכר את הדירה, וחילק את יתרת הכסף שנותר מהמכירה ליורשים.\nהאם רמי פעל כדין? מדוע?","o":["כן; ידו של מנהל עיזבון כיד המוריש והוא רשאי לסלק את חובות העיזבון.","כן; אך רק אם הציע לכל היורשים לקנות את הנכס תחילה במחיר שאינו נופל ממחיר השוק.","לא; רמי לא יכול למכור את הדירה ללא הסכמת כל היורשים.","לא; רמי צריך היה לקבל אישור בית משפט לפני מכירת דירת העיזבון."],"c":[3],"a":false,"note":"","sub":"l_ownership"},{"id":"2025-07#1","e":45,"n":1,"s":"שוש היא מתווכת במקרקעין. נמרוד פנה לשוש, וביקש ממנה שתמצא קונה לדירתו. נמרוד היתנה את חתימתו על טופס הזמנת שירותי תיווך בכך, שבהסכם המכר יירשם סכום נמוך באופן משמעותי מסכום המכירה בפועל, וזאת במטרה לחסוך במס שבח, דבר שהינו בניגוד לחוק. שוש הסכימה לכך, ונמרוד חתם על טופס הזמנת שירותי תיווך בהתאם. שוש פנתה לקונה וסיכמה עימו שמחיר הנכס יעמוד על 1,300,000 ש\"ח, אך הצדדים ירשמו בחוזה שהמחיר הוא 1,000,000 ש״ח בלבד.\nבנסיבות אלה, האם המתווכת שוש פעלה כדין? מדוע?","o":["כן; שוש פעלה בנאמנות ובמסירות עבור הלקוח, ותוכן הסכם המכר אינו בסמכותו של המתווך.","כן; משום שטופס הזמנת שירותי התיווך כולל מחיר משוער של נכסים בלבד.","לא; אסור היה לשוש כמתווכת לקבוע מחיר עם הצד השני לעיסקה.","לא; אסור היה לשוש כמתווכת לשתף פעולה עם הסכם למראית עין בלבד."],"c":[3],"a":false,"note":"","sub":"b_order"},{"id":"2025-07#2","e":45,"n":2,"s":"ראובן פנה לגילה, מתווכת במקרקעין, בבקשה שתסייע לו למצוא רוכש לנכס מסחרי שבבעלותו. בהתאם לכך, חתם ראובן על טופס הזמנת שירותי תיווך, ללא בלעדיות, לפיו התחייב לשלם דמי תיווך בשיעור 1% משווי העיסקה. שבועיים לאחר מכן פגש ראובן רוכש פוטנציאלי בשם יוסף, ומסר לו את כל פרטי הנכס, כולל את גובה דמי השכירות המשולמים לו עבור הנכס. יוסף דחה את ההצעה משום שלדעתו דמי השכירות היו נמוכים מידי. לאחר כשבועיים פנה יוסף לגילה והתעניין ברכישת נכס מסחרי. גילה הציגה בפני יוסף את הנכס שבבעלות ראובן. יוסף הודיע לגילה מיד, כי הוא מכיר את הנכס וכי קיבל כבר הצעה מראובן, אלא שלאור דמי השכירות הנמוכים, דחה אותה.\nגילה הבטיחה ליוסף, כי יש לה שוכרים אחרים שמוכנים לשלם דמי שכירות גבוהים יותר, ואף הציגה לו אותם. יוסף התרצה, וחתם על טופס הזמנת שירותי תיווך. גילה הודיעה לראובן, כי יש לה רוכש חדש, אותו ראובן אינו מכיר, ודרשה מראובן לחתום על טופס הזמנת שירותי תיווך חדש, לפיו נדרש ראובן לשלם דמי תיווך בשיעור 2% משווי העיסקה. כשבועיים לאחר מכן, במעמד חתימת הסכם המכר, הופתע ראובן לגלות כי הרוכש \"החדש\" הוא לא אחר מאשר יוסף, אותו הכיר. ראובן הודיע לגילה על ביטול ההסכם השני, וסירב לשלם לה דמי התיווך בשיעור 2%, בטענה כי גילה הטעתה אותו.\nהאם ראובן צודק? מדוע?","o":["לא; מאחר שראובן חתם על טופס הזמנת שירותי תיווך וגילה הייתה הגורם היעיל בעיסקה, הוא חייב לקיימו.","כן; גילה לא הייתה הגורם היעיל לעיסקה.","כן; גילה הטעתה את ראובן, הן לעניין זהות הרוכש והן בכך שלא גילתה לראובן עובדות מהותיות בקשר לאותו רוכש.","לא; גילה אינה חייבת לגלות לראובן כל מידע בקשר לרוכש לפני חתימתו על הסכם להזמנת שירותי תיווך."],"c":[2],"a":false,"note":"","sub":"b_order"},{"id":"2025-07#3","e":45,"n":3,"s":"דיירים בבית משותף ברחוב הציונות 19 בעפולה, קיימו אסיפת דיירים. באסיפה עלתה הצעה להצמיד מקלט לאחת הדירות בלבד, בתמורה לתשלום כספי לקופת הבית המשותף המדולדלת. בהצבעה תמכו בהצעה מאה אחוז מהדיירים.\nהאם ניתן להצמיד את המקלט לאחת הדירות בבית המשותף? אם כן, באיזה רוב של דיירי הבית המשותף ניתן לעשות כן?","o":["ניתן לבצע הצמדה כאמור והרוב הדרוש לכך הוא של 2/3 מבעלי הדירות בבית המשותף.","ניתן לבצע הצמדה כאמור, אך נדרש לכך רוב של 100 אחוז מבעלי הדירות בבית המשותף.","ניתן לבצע הצמדה כאמור, אך נדרש לשם כך רוב רגיל של בעלי הדירות בבית המשותף.","לא ניתן להצמיד מקלט לדירה מסוימת בבית משותף, גם לא בהסכמה של כל בעלי הדירות בבית המשותף."],"c":[3],"a":false,"note":"","sub":"h_common"},{"id":"2025-07#4","e":45,"n":4,"s":"יוסף רכש דירה חדשה מקבלן. הקבלן לא צירף לחוזה המכר את המפרט של הדירה, ובין הצדדים התגלע סכסוך בנושא איכות הגימור שעל הקבלן לספק ליוסף בדירה החדשה.\nבנסיבות המתוארות, איזה מההיגדים
